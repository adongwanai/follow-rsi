<svg xmlns="http://www.w3.org/2000/svg" width="1120" height="720" viewBox="0 0 1120 720" role="img" aria-labelledby="t d">
<title id="t">Harness evolution: directions in the collection</title><desc id="d">Classification from meta.sections; this is not a citation or lineage graph.</desc>
<style>:root{--bg:#F1F2F4;--ink:#14161C;--rule:#D6D9E0;--accent:#2A33D4}@media(prefers-color-scheme:dark){:root{--bg:#0E1015;--ink:#E8EAF0;--rule:#2A2F3A;--accent:#8D93FF}}text{fill:var(--ink);font-family:'Noto Sans SC',sans-serif}line,path{stroke:var(--rule);stroke-width:2;fill:none}</style>
<rect width="1120" height="720" fill="var(--bg)"/>
<text x="44" y="60" font-size="24" font-weight="700">Harness Evolution · {{ stats.included }} papers + {{ stats.candidates }} candidates</text>
<text x="44" y="92" font-size="14">方向分类 / Directions</text>
<path d="M64 120V650"/>
{% for id, section in sections.items() %}
<g transform="translate(0,{{ 145 + loop.index0 * 54 }})"><path d="M64 0H100"/><circle cx="64" cy="0" r="4" fill="var(--accent)"/><a href="../site/index.html#papers"><text x="116" y="5" font-size="16">{{ section.zh }}</text><text x="505" y="5" font-size="14">{{ section.en }}</text></a><text x="1060" y="5" text-anchor="end" font-size="16">{{ stats.sections[id] }}</text></g>
{% endfor %}
</svg>
