<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>{{ p.title }} · Follow RSI</title>
  <meta name="description" content="{{ description }}">
  <meta property="og:type" content="article">
  <meta property="og:title" content="{{ p.title }}">
  <meta property="og:description" content="{{ description }}">
  <meta property="og:image" content="{{ image }}">
  <meta property="og:image:width" content="1080">
  <meta property="og:image:height" content="1350">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:title" content="{{ p.title }}">
  <meta name="twitter:description" content="{{ description }}">
  <meta name="twitter:image" content="{{ image }}">
  {% if canonical %}<link rel="canonical" href="{{ canonical }}"><meta property="og:url" content="{{ canonical }}">{% endif %}
  <script>location.replace('../index.html#p-{{ p.id }}');</script>
</head>
<body><a href="../index.html#p-{{ p.id }}">{{ p.title }}{% if p.needs_reading %} · 待细读 / Needs verification{% endif %}</a></body>
</html>
