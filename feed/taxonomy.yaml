directions:
  harness:
    zh: Harness / 脚手架 RSI
    en: Harness RSI
    def_zh: 模型权重冻结或不是主要训练对象；系统根据执行或评估反馈修改外部可复用的 Harness 工件，并把被接受的修改带到后续任务或改进轮次。工件包括提示、工具代码或工具库、技能文件、上下文或记忆管理的代码或策略、控制流、工作流、环内验证器与改进器。
    boundary_zh: 训练出的 RL/SFT 模型策略、训练环境或奖励、外部代码库或科研假设等任务产物、当前任务状态和单纯积累的记忆条目均不构成 Harness 演化。需区分修改记忆管理机制与更新记忆数据；不能因系统有记忆、工具、Agent 或 Harness 字样就纳入。一般 RSI 评测或综述也不能仅因提到这些组件而标 secondary harness。
    sub:  # 与 data/papers.yaml 的 section 一致
      evolve_main: 整体 Harness 搜索与演化
      generalize: 泛化、正则、准入与成本
      evidence_selection: 任务与证据选择
      improver: 改进器自身进化
      component: 组件级进化（技能文件、工具代码、记忆或上下文管理机制、接口）
      coevolution: 模型与外部 Harness 工件分别有反馈驱动的持久更新；不能把两个模型联合训练算作此类
  model_weights:
    zh: 模型 / 权重 RSI
    en: Model-weight RSI
    def_zh: 模型用自己产生的轨迹或数据训练自己（SFT、自蒸馏、RL），下一代模型再产生更好的数据，且至少跑了两轮或明确设计为多轮。
  data_task:
    zh: 数据与任务 RSI
    en: Data & task RSI
    def_zh: 由 Agent 根据反馈迭代设计训练数据配比、合成任务、课程、训练环境、奖励或用户模拟器，决定下一轮训练学什么；这些训练系统对象不因由 Agent 编辑而成为 Harness。
  ai4ai:
    zh: 训练算法 / AI 研发 RSI
    en: AI-for-AI RSI
    def_zh: Agent 持续改进训练算法、自主做模型研发，或研究 Agent 用反馈迭代科研假设、实现程序与研究过程。被优化的外部工程或科研产物不等于 Agent 自己的 Harness；只有另有明确的 Harness 工件更新证据才考虑交叉关系。
  experience_world_model:
    zh: 经验、世界模型与探索 RSI
    en: Experience, world-model & exploration RSI
    def_zh: 根据反馈把经验沉淀为跨任务复用的记忆条目、经验价值评分、研究经验或可执行世界模型，或改进探索策略本身。积累或筛选经验数据归此类；反馈驱动地改写可执行技能文件或管理机制才考虑 Harness。只保存当前任务状态不算经验型 RSI。
  meta:
    zh: 元 RSI
    en: Meta-level RSI
    def_zh: 改进「负责产生改进的机制」本身。若该机制是 Harness，主方向记为 harness/improver，meta 记为次方向。
  embodied:
    zh: 具身与物理 RSI
    en: Embodied & physical RSI
    def_zh: 机器人策略或具身 Agent 在仿真或真机中递归改进。
cross:   # 只能作为次方向，或在评测、理论、安全类论文中作为主方向
  evaluation_benchmark: 评测、基准与归因
  theory_survey: 理论与综述
  safety_governance: 安全与治理
exclude_reasons:
  not_persistent: 只在当前任务内迭代，修改不保留到后续任务（例如测试时反复修正同一个答案）
  static_framework: 提出固定的 Agent 或 Harness 框架，本身不随反馈演化
  different_sense_of_harness: harness 指测试或模糊测试框架（test harness、fuzz harness）等其他含义
  single_round_training: 只做一次训练或蒸馏，没有可迭代的改进闭环
  off_topic: 与 RSI 无关
