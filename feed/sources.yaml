- id: hf-daily
  kind: hf_daily
  enabled: true
  schedule: daily
  params:
    url: https://huggingface.co/api/daily_papers
    keywords: *id001
  notes: Primary supplementary discovery source per owner preference. Verified HTTP 200 JSON list with original title, summary,
    authors, upvotes, githubRepo. Backfills every requested date; never uses the HF ai_summary field.
