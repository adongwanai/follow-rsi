- id: arxiv:2611.04434
  title: 'Sketchpad: certified exact arithmetic with a small vision-language model'
  announced: '2026-11-03'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.04434'
  version: 1
  source_hash: acb15dc069377af05f855597fa863c3e6f38aca7f20a9f8758a8ec8783555d8b
  published: '2026-11-03T07:25:42Z'
  updated: '2026-11-03T07:25:42Z'
  hf_daily_dates:
  - '2026-11-09'
  abstract: 'Language models are accurate on most long-arithmetic problems, but their accuracy is estimated on samples
    and carries no guarantee for an unseen input; tool use is exact but moves the computation outside the network.
    We show that exactness at all input lengths becomes a finite, checkable property of a network when each of its
    steps reads only a bounded view of an external working memory. In Sketchpad, Qwen3.5-0.8B with a low-rank adapter
    executes arithmetic procedures on a rendered sheet. Each forward pass reads a three-cell view and emits one
    step: a digit, a carry or borrow, and the next operation. A fixed runtime moves the view and writes no digit
    of a result. We prove in Lean that the model is then exact on all inputs of any length if and only if it is
    exact on the finite set of views the runtime presents, that no finite test suffices when steps also read earlier
    steps, and that the guarantee tolerates bounded numerical perturbation and extends to compositions of procedures.
    All 2,446 views pass on the deployment device, a laptop GPU running the model in a web browser. The certified
    model performs signed addition and subtraction, long multiplication and division, square roots and greatest
    common divisors at arbitrary length. It solved 200 of 200 pre-registered problems in the browser, and 220 of
    220 sums of up to 1,000 digits and products of up to 20 digits, of which GPT-6.1 Sol, the strongest of ten other
    models, solved 217. A symbolic runtime built on these procedures solves, expands and factors polynomials with
    every number computed by the model, and a multiplicative gate on the adapter recovers the base model exactly
    when the sheet is not in use.'
