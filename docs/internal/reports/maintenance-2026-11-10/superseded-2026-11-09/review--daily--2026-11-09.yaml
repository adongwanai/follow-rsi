- id: arxiv:2611.09382
  title: 'Exploring Weight-Space Programming: Capabilities, Generalization, and Limitations'
  announced: '2026-11-06'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.09382'
  version: 1
  source_hash: c94693fd352a00f9f61fccfce31f432a244fa1d5edf8bd96b076e86c3ab3cffc
  published: '2026-11-06T12:22:24Z'
  updated: '2026-11-06T12:22:24Z'
  hf_daily_dates:
  - '2026-11-09'
  abstract: 'Weight-Space Programming (WSP) enables reasoning agents to directly inspect and modify neural network
    parameters, offering an alternative to gradient-based model adaptation. However, its capabilities, cross-task
    generalization, and practical limitations remain insufficiently understood. We systematically investigate WSP
    through 16 editing trajectories across seven benchmarks and two model scales (Qwen3.5-0.8B and Qwen3.5-9B).
    Our findings reveal three key insights. First, WSP can achieve substantial performance gains through highly
    localized interventions. On full held-out evaluations, accuracy improves by up to 29.45, 4.42, 36.72, and 17.11
    percentage points on MATH-500, GPQA Diamond, IFEval, and SciBench, respectively. Notably, modifying only 1,023
    parameters yields a 29.45-point improvement. Second, WSP exhibits promising but uneven cross-task generalization.
    A Math-edited checkpoint improves GPQA Diamond, IFEval, and SciBench by 3.03, 12.18, and 20.10 points, respectively,
    without further editing, while leaving SciCode performance unchanged. Third, effective editing remains challenging
    and inconsistent. Outcomes vary substantially across trajectories, and six of the 16 trajectories retain the
    original weights when candidate improvements cannot be reliably validated. Together, these results highlight
    WSP''s potential for highly localized model adaptation while revealing important challenges in intervention
    discovery, reliability, and cross-task transfer. Homepage: https://wsp-scope.github.io/ GitHub: https://github.com/WSP-Scope/WSP-Scope-Project'
