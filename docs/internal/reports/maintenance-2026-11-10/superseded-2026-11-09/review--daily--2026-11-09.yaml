- id: arxiv:2611.09894
  title: 'Video-Coder: Reinforcing Agentic Coding for Video Generation'
  announced: '2026-11-06'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.09894'
  version: 1
  source_hash: 59ac18b1e21091e354c45645719acf3eef9aeb5569dde82caf4c15f594995a82
  published: '2026-11-06T18:59:57Z'
  updated: '2026-11-06T18:59:57Z'
  hf_daily_dates:
  - '2026-11-09'
  abstract: Recent years have witnessed remarkable progress in video generation in terms of visual quality and temporal
    consistency. However, generating videos with precise spatial structure, coherent motion dynamics, and controllable
    scene composition remains challenging. In this paper, we introduce Video-Coder, the first attempt to train a
    code-driven video generation agent, which autonomously writes and executes code to construct a dynamic 3D scene
    (Draft Video) that provides structure and motion signals to downstream video generators. To support this paradigm,
    we design a dedicated data pipeline and curate two high-quality datasets, Video-Coder-SFT-6k and Video-Coder-RL-2k,
    which contain diverse prompts and ground-truth reference videos. We further develop the Video- Coder Harness,
    a unified interactive environment integrating code execution, 3D scene rendering, and execution feedback for
    agent training and inference. We then train Video-Coder with SFT fol- lowed by harness-native agentic reinforcement
    learning with dual reward feedback, which combines execution-based and video-based rewards. Additionally, we
    design an annealing training strategy that gradually reduces the execution reward over time, allowing the model
    to rely more on the video reward in the later training stages. Experiments show that Video-Coder achieves significant
    gains, improving Minimax-H3 by approximately 7 points on PhyGenBench and 24 points on VBench-2.0. We hope this
    work can serve as an open foundation for coding agents in video generation, and we fully open-source our data,
    models, and code
