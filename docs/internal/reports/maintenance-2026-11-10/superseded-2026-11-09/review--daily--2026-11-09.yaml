- id: arxiv:2611.06748
  title: 'EvoWorld: Towards Out-of-Sight World Evolution in Generative Video Models'
  announced: '2026-11-04'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.06748'
  version: 2
  source_hash: d555bd86c92170076edf70b2aa9c950d6b3d99d396830f27f69a5a817ffce201
  published: '2026-11-04T16:26:45Z'
  updated: '2026-11-05T04:27:21Z'
  hf_daily_dates:
  - '2026-11-09'
  abstract: 'Generative video models are increasingly used as visual world simulators, yet their primary strength
    lies in rendering plausible pixels rather than reasoning about how a world should evolve. Coherent world evolution
    requires more than visual fidelity: when an event occurs, a model must infer its consequences for the entities
    in the world and then render the resulting state. For example, after a wild beast appears, the model should
    not only depict the wild beast, but also infer whether a nearby person should flee, take cover, or fight back
    based on the realized scene. Existing diffusion-based video models lack an explicit mechanism for maintaining
    world state and reasoning over such event-conditioned consequences, often producing visually plausible but behaviorally
    static or causally inconsistent outputs. To make this reasoning gap concrete and measurable, we propose a new
    problem, Out-of-Sight Causal Evolution, which requires a model to render an event, reason about its consequences
    for the evolving world state, and reveal a causally plausible outcome as the world continues to evolve, even
    out of sight. As a baseline reference solution, we introduce EvoWorld, a brain-renderer collaboration framework
    in which a vision-language model serves as the world brain: it observes generated segments, maintains an evolving
    account of the world, and reasons about plausible state transitions, while a segment-autoregressive video renderer
    realizes them visually. We further introduce EvoWorld-Data and EvoWorld-Bench for training and evaluating event
    realization, causal reactions, and revisit consistency. Experiments show that EvoWorld substantially improves
    event-conditioned causal evolution over recent models while preserving visual quality and consistency, establishing
    a reference point for reasoning-guided, autonomous world evolution beyond the current field of view.'
