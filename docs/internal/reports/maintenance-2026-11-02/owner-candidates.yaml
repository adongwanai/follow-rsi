  reason_zh: 论文把每个地球观测任务写成“harness + 验证器”，由现成的通用编码代理（Codex/GPT-6-Astra、Claude Code 等）自行编写训练代码、训练模型、查询密封验证器并迭代。反馈确实驱动修改（验证器分数决定保留哪一代），但被迭代改进的对象是
    EO 模型/提交的 pipeline，即任务产出物（对应边界 c：新模型/外部软件属于任务输出）；人类设计的 harness 与 verifier 在实验中始终固定（“A task’s harness and verifier
    stay fixed while agents improve”），代理并未改写自己可复用的系统提示、工具库、控制流或验证器实现。所谓“recursive self-improvement”是任务内 teacher–student
    代际血缘与自训练，属于边界 d 的 within-task 循环；代理写出的调度脚本也仅用于当次运行，论文明确说明除提交目录外“Nothing else the agent created survives”，因此没有跨任务/跨会话保留的可复用程序工件。综合看，这不是对外部
    Harness 工件的反馈驱动演化，也不是专门评估 Harness 演化的评测，故判为 other_direction。
  limitations_zh: 证据仅限于所给摘要与正文：论文未显式声明编码代理权重被冻结，只说明使用通用编码代理且未对其进行训练；也未展示任何代理自写的 harness/工具/提示工件被保存并复用于后续任务。改进对象在正文中被明确指向
    EO 模型而非代理自身程序，故“可复用外部工件持久改进”的关键证据缺失。方法虽然名为 harness，但其 harness 是人工给定的任务定义容器（数据、checkpoint、库、starter pipeline）与密封验证器，本身不被演化。
  remaining_evidence_needed_zh: 若后续版本或附录/代码库显示代理把自己的控制器脚本、提示或工具库作为可复用工件跨任务保存并据验证器反馈改写（而非仅当次运行内使用），需重新评估其是否满足 Harness
