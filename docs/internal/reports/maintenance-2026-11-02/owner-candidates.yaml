  reason_zh: 论文把权重冻结的 LLM（Opus5.5+Claude Code、其余用 Codex）当作“学习引擎”，在固定比赛/评估预算内反复修改的对象是参赛用的游戏机器人 C++ 策略程序及其配套工具、测试与笔记（所谓
    heuristic system）。该程序是竞赛任务的交付物：排行榜名次（对冻结人类程序池的 Elo/rank）即评测目标；而 agent 自身的可复用执行程序（系统提示、工具库、工作流、in-loop verifier、记忆管理代码）并未被修改，Claude
    Code/Codex 只作为被比较的固定 harness 配置变量出现（“We evaluate 7 model and harness configurations”）。因此落入边界 (c)：改进对象是外部软件/任务输出，而不是
    agent 自身 harness；同时反馈驱动循环发生在单个游戏的一次竞赛运行内部，接近“把当前任务答案做出来”，而非跨任务/跨会话保留的自改进。综上标为 other_direction 并排除。
  limitations_zh: 全文（含附录）可用，排除是基于对象界定的概念判断，而非证据缺失。正文清楚给出：权重冻结、由回放与全池 Elo/rank 驱动、保留最佳快照与笔记；但缺少三项关键证据：(1) 没有任何证据表明
    agent 自身 harness（提示、工具实现、控制流、verifier、记忆管理代码）被修改并被评测；(2) 所修改策略/工具/笔记仅在单次运行内跨修订轮保留，未见跨任务、跨会话或跨游戏复用，跨游戏迁移与“reusable
    policy modules”只出现在 Future Work；(3) harness 差异与模型差异混杂在同一比较中，无法分离。
  remaining_evidence_needed_zh: 若后续版本把 CLI agent 自身的系统提示、工具实现、工作流或 in-loop verifier 作为主要修改对象并加以评测，或证明改进后的策略/工具/笔记被跨任务或跨会话复用（如实现
    Future Work 中的 reusable policy modules、cross-game transfer、continual learning），需重新评估为 harness_evaluation/method；另需核对项目页与代码仓库是否包含跨运行的
    artifact 持久化与 harness 自修改实验。
