    s2: https://www.semanticscholar.org/paper/52ab630fd1f3470d356bc67b988a182d75bce95a
  reason_zh: 被改进对象是围绕确定性 Symbolic Executor 的外部可复用程序工件：用带神经函数调用的 Python 程序完整规定 agent 的行为与控制流（for/if、变量与执行帧式上下文管理），而非只修当前答案。改进回路明确由执行/评估反馈驱动：FM
    Designer 依据当前程序、执行状态与既往执行反馈提出程序，交给 Executor 端到端验证，执行失败或 LLM critic 报错则退回修订；并且在入库前用自造任务变体做可执行的通性检查（metamorphic
    testing 式），不满足即拒收。被接受的程序被持久保存，遇到同族新任务时优先通过参数重绑定复用，失败才调用 FM Designer 修订，且修订须不回归已解题（backward compatibility），多次评测轮次中同一策略被重复使用并摊薄写作成本。模型权重方面，全文所有系统均用
    Claude Sonnet 4.6 作为 neural agent 与 FM Designer，没有任何权重训练，干预完全落在程序工件层面，符合 harness 方法界定。
  limitations_zh: 证据边界：(1) 仅单一 agent harness、单一模型族（Claude Sonnet 4.6）下验证，作者自述结果未必迁移到其他框架与模型；(2) 程序是“任务族”级别工件（family-level），复用为参数重绑定，论文未展示跨
    benchmark/跨会话持久化，仅在同族任务与重复评测轮次内证明复用与摊薄；(3) 部分基准样本小（WorkArena-CF、GAIA L3），统计功效受限；(4) 效率结论依赖复用频率，一次性任务上 ABCAgent
    反而更贵；(5) 论文提及的跨会话程序复用（Pedada et al., 2026）属他人工作，不能算作本文证据。
  remaining_evidence_needed_zh: 可进一步核查附录 F/H 与代码发布物中“程序修订时保留回归约束”和变体检查的具体实现，以及同一存储程序是否被明确记载可跨会话、跨任务族之外的场景复用（正文仅证明同族任务与多轮评测内的复用）。
