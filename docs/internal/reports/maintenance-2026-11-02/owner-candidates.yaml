  group: source_reconciliation_73
  title: Does Failure Feedback Direct Agent Self-Modification?
  scope_recommendation: include
  disposition: scope_advice
  published_original: '2026-10-10'
  updated_original: '2026-10-10'
  hf_daily_dates: []
  source_links:
    arxiv: https://arxiv.org/abs/2610.14662
    s2: https://www.semanticscholar.org/paper/e13e0fbcf9575bab83e4f529e5a581cd2eb05f04
  reason_zh: 该文不是提出新的 Harness 方法，而是专门评估 Harness 演化本身：研究对象是“编辑器观察某次失败→修改外部可复用工件（DGM 的 agent 代码、playbook 指令模块、工具 agent
    的 helper 库代码）→评估器/留出集决定是否保留”的闭环。改进对象是执行器外部的可复用文本/代码工件，模型（Qwen3-4B、Phi-4-mini、o1/Claude 作为编辑器）权重全程冻结，仅作为编辑器与执行器使用，权重更新不是干预手段，因此满足
    harness artifact 演化的研究主题。它给出 per-modification 随机化 directedness 度量、e-value 检验，并在 DGM 公开日志（145 次修改）与两项受控实验（含预注册的第二项研究、留出测试集
    T、8 步循环与 GEPA 对比）上测量目标修复、类别扩散与留出净变化，属于对“反馈驱动的外部 Harness 工件演化”的专门化评估，故按 harness_evaluation 纳入。需注意其结论是“未检测到目标定向优势”，这是效果结论，不影响主题归类。
  limitations_zh: (1) 该文是被动测量与受控实验，不提出可复用的新 Harness 方法或改进器；GEPA、8 步循环等仅作为被比较的外部基线。(2) 证据边界：DGM 日志来自单一系统与一对基础模型（o1
    诊断 + Claude 3.5 Sonnet 实现）、80 次迭代；受控研究仅一个 4B 模型加一个同量级模型族，planted 规则为人工构造，工具环境为合成。(3) 第 3 节 DGM 分析为观察性，只有 e-value
    无需渐近条件，其余为参考量；score 单次评估，噪声界依赖 no-archive 运行。(4) 研究 1 与 2 的附带损害对比非随机化，作者明示不能识别差异来源；H2 等小效应在扰动敏感度范围内。(5) 权重冻结、非主要干预这一点是明确的，但“持久化”体现为子代进入档案并被后续任务/留出集评估，而非跨会话的长期记忆或工作流状态。
  remaining_evidence_needed_zh: 如需进一步界定：核对附录与 ancillary 文件是否包含可复用的 Harness 工件（如修订模板或评估流程代码）作为独立贡献；确认其“保留”机制（DGM
    档案准入、V 集筛选、T 集计分）是否足以视为跨任务持久化，而非仅当前任务内的筛选。
