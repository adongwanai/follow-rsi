  reason_zh: 该工作是“自动 SFT 数据研究”系统：外层 research policy π（元 agent + 执行 agent + 四个分析子 agent + 合成子 agent、skill library、memory
    设计）由作者一次性手工设计，随后用逐组件消融（executor/analysis/synthesis）在固定训练脚本、固定预算、每轮从基座重训的条件下测量其效果。循环反馈（每轮 benchmark 分数、逐例失败、训练动态、历史对比）驱动被修改的对象是数据动作与数据配方
