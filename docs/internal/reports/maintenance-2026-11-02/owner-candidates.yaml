  hf_daily_dates: []
  source_links:
    arxiv: https://arxiv.org/abs/2609.37968
    s2: https://www.semanticscholar.org/paper/e6824981bbd2fcd793b245b1b6fa1d65b1278168
  reason_zh: 论文提出 SelfSearch：同一编码 agent 在每一代获得自身仓库的可编辑副本，依据前若干代自我修改回合的记录（推理、工具动作、结果与代码改动）以及本次编辑中的工具输出与本地检查，修改自己的指令、工具、policy
    library 与任务级编排，产出后继 agent B_{k+1} 并进入下一代，形成反馈驱动的外部可复用程序工件演化循环。改进对象明确是 agent 自身的可复用 harness，而非某个任务答案或用户产物；模型权重不参与更新——正文明确写明底层模型权重保持冻结（weights
    remain fixed），演化只发生在仓库代码/提示/工具层，因此权重不是主要干预。持久性方面：后继实现跨代累积，最终 agent 在搜索冻结后才在下游基准上评测，且发现的 harness 可在不改源码的情况下迁移到另一模型家族，符合“被接受的工件为后续任务/轮次留存”的要求。反馈虽然不使用下游奖励，但由自我修改回合的执行轨迹与本地验证驱动，仍属执行反馈闭环，因此不落入静态模板或仅存取的记忆管理边界。
  limitations_zh: 检索阶段刻意不使用下游评测信号，反馈仅为自我修改回合记录与本地工具检查，缺少跨任务评测作为显式选择压力；每个模型-基准仅报告一次搜索的两条 lineage，未给出多次独立搜索的方差，论文自身也承认需要检验增益的一致性；与评测引导基线的比较非预算匹配（SelfSearch
    不做 development-set 选择）；部分 lineage 在个别基准上无提升或退化；与九个 harness 的对比是在对齐推理/执行设置后进行的单点比较。
  remaining_evidence_needed_zh: 确认附录中运行时记录的挂载与写回机制是否确为工件级持久化（而非仅在单次回合内的临时状态），并核对表 5/表 11 中工具与流程改动是否确实被后续代继承使用。
