    修改的实现细节。2) 部分收益对比（DGM、OpenHands、Aider 的已发表数字）作者自述仅作参考点，非受控比较；受控比较主要是 PCE vs GEA 与 parent-only distillation 消融。3)
    Polyglot 主结果为单次运行（SWE-bench 为两次运行），统计稳健性有限。4) 固定上下文探针分析中的诊断提案未被实现或评估，只能说明诊断行为变化，不能单独证明下游性能提升。5) 论文是方法论文，非专门评估
