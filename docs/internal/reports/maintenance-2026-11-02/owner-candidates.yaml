  title: 'R$^2$Orch: Recursive Self-Improvement for Agent Orchestration via Self-Play within a Skill-Internalization
    Loop'
  scope_recommendation: include
  disposition: scope_advice
  published_original: '2026-10-15T23:21:21Z'
  updated_original: '2026-10-22T15:32:16Z'
