- id: arxiv:2610.29023
  group: source_reconciliation_73
  title: Inheritance as an Admission Test for LLM Prompt Merge Operators
  scope_recommendation: include
  disposition: scope_advice
  published_original: '2026-10-21'
  updated_original: '2026-10-21'
  hf_daily_dates: []
  source_links:
    arxiv: https://arxiv.org/abs/2610.29023
    s2: https://www.semanticscholar.org/paper/1f60b79ee31bbd2db638ee4b477038041a56eb77
  reason_zh: 该文的外部可复用工件是每个 agent 的 system prompt（策略/配置），模型权重冻结（正文明确 no weights are updated, and evolution acts on
    strategies alone）。循环为竞争性协同进化：agent 之间对局得到 realised fitness φ，再按排名 Boltzmann 抽样 donor、按适应度差给出请求剂量 β，由 merge 算子（tactic
    append、template append、free rewrite、constrained rewrite）把 donor 的行为痕迹注入 recipient 生成子代 prompt，子代进入种群并按排名比例淘汰，重新评分。修改由执行/评估反馈驱动（对局得分与冻结
    reference panel 的 θ 读数、以及准入检验 Δs 的统计判定），并跨 40 个 generation 保留、复用（子代成为后续 recipient/donor，出现复制累积，append 运行的最终均值越过最好
    generation-zero 成员 0.771）。因此属于以冻结权重、评估反馈驱动、可保留的外部 prompt 工件演化，符合 harness_method；同时其准入检验也可视为对 merge 算子/improver
    的审计，但论文显示的主要保留更新是 prompt 工件本身。
  limitations_zh: 证据边界：(1) 全部测量仅用 gemini-3.1-flash-lite 与单一 negotiation 任务，开放环 16 对、闭环每算子 3 次运行，泛化性未证；(2) 论文主贡献是
    merge 算子准入检验（测量协议），并非声称竞争性评分比固定 verifier 训练更快，且未跑 fixed-oracle 对照臂；(3) 被演化的 merge 算子（improver）本身是固定的，未被自动改写，只有
    prompt 工件被更新；(4) 改进以种群平均 reference performance 越过最好种子为判据，属种群级 prompt 演化，而非单一 agent 对自身程序的自修改；(5) 准入检验在闭环中仅以
    +0.01/+0.02 的边际通过，且 template append 判定不确定，效果稳健性有限；(6) 未展示演化出的 prompt 跨任务或跨会话复用。
  remaining_evidence_needed_zh: 可进一步核实：(a) 正文是否明确把子代 prompt 作为后续 generation 的 recipient/donor 持久复用（40 代闭环与复制累积已提供较强支持）；(b)
    是否存在跨任务/跨会话复用该 prompt 工件的证据；(c) 若要把该文归为 harness_evaluation，需要其研究主体是对 harness 工件演化的专门评测，而当前主体是 merge 算子准入检验，故按方法归类更稳妥。
