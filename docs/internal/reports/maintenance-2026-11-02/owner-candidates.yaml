  reason_zh: 该工作把可复用产物明确放在执行器外部：每个任务族学习一个可执行 solver（代码、经验 scope 规则、答案适配器），连同冻结的族级路由一起构成部署策略，属于工具实现/技能文件/控制流层面的外部
    Harness 制品。改进回路清晰：writer 提出程序，harness 在带标签训练实例上执行并返回逐例正确性、执行错误、诊断与中间可视化，反馈驱动下一轮修订并检测回归，随后拟合 scope 规则、做留一任务稳定性与增益检验并冻结。持久性有证据：程序与
    scope 在部署前冻结，直接在新图像问题与后续评测上复用，还能跨执行器复用（Flash-Lite 复用 Pro 制品，DeepSeek/GPT 复用冻结 FL 路由），说明保留制品而非只修当前答案。模型权重角色为冻结：贡献在于程序获取与直接执行，而非
    SFT/RL；对比实验也以固定 base agent 与工具套件进行。按边界(c)，这里的程序不是一次性任务产物，而是被论文作为主要改进对象的可复用执行程序，因此判为 harness_method 并建议纳入。
  limitations_zh: 1) 正文没有一句显式的“不更新任何模型权重”声明，冻结结论主要依赖方法描述（writer/执行器为固定模型、制品以代码形式保存与冻结复用）以及对 DeepSeek/GPT “without
    target-model training or recalibration”的说明，属于强推断而非直接陈述。2) 全系统增益混合了程序直接执行、轨迹蒸馏文本技能回退与族级路由校准三部分，文本技能仅对 TIR 加 0.3、MIRA
    加 0.8 点，但主体结论仍是程序路线。3) 反馈消融只在 TIR-Bench 与 MIRA 各五个族上重做获取，样本有限；scope 规则拟合只依赖诊断特征，论文自承不是多重搜索校正后的保证。4) 该制品是任务族专用的视觉求解程序，与“任务输出型生成程序”边界接近，需依赖论文对复用性、冻结与跨执行器迁移的证据来区分。
  remaining_evidence_needed_zh: 建议核对附录 A.2/A.4 与随附代码，确认：(a) 获取阶段 writer 与部署执行器的模型权重确实未被更新、也无梯度/微调步骤；(b) 冻结的 solver
