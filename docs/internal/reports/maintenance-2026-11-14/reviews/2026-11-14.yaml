- id: arxiv:2611.09254
  title: 'TwinHash: Two-Sided Object Identity Management for Time- and Energy-Efficient Agentic Workflows'
  announced: '2026-11-06'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.09254'
  version: 1
  source_hash: 33394492e196c1d128037218da5a4b17a33cbeb06715c2f0c55c34b21a5b4d4f
  published: '2026-11-06T10:13:21Z'
  updated: '2026-11-06T10:13:21Z'
  hf_daily_dates: []
  abstract: Agentic artificial intelligence (AI) services interleave large language model (LLM) generation with
    external tool execution, and increasingly rely on search-based workflows that repeatedly revisit shared reasoning
    states and computations. These patterns create substantial redundancy across tool outputs, LLM responses, and
    key-value (KV) prefixes, yet existing serving systems primarily optimize shared prompt prefixes, while naive
    input-keyed caching is unsafe when identical requests produce different outputs. We present TwinHash, a unified
    object management architecture that assigns each object an input-side hash key to recognize repeated requests
    and an output-side content fingerprint to validate and locate stored state, complemented by type-specific reuse
    guards that preserve correctness and response diversity. A software object identity table maintains reusable
    objects across requests and trajectories, while a hardware object placement table tracks their residency across
    hierarchical memory tiers so that evicted state can be retrieved rather than recomputed. Across seven agent
    frameworks and five benchmark suites, reuse follows workflow structure more than benchmark identity. TwinHash
    serves up to 81% of tool outputs wherever deterministic tool reads recur, and up to 92% of LLM responses in
    search-based frameworks. Retrieving an evicted KV-prefix from DRAM reduces TTFT by up to 5.6x on Qwen3-32B,
    with greater gains projected for larger dense models. Under search-based frameworks, TwinHash reduces end-to-end
    wall-clock time by up to 87% and measured task energy by up to 81% over a prefix-cached baseline, while a per-key
    serving cap controls the quality-reuse trade-off in adaptive search. These results demonstrate that unified
    identity, safety, and placement management can convert structural redundancy in emerging agentic workflows into
    substantial serving-efficiency gains.
