- id: arxiv:2610.17718
  title: 'ECG-RSI: Recursive Self-Improvement through Targeted Electrocardiogram Waveform Evolution'
  announced: '2026-10-13'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: data_task
  decision: backlog
  arxiv_id: '2610.17718'
