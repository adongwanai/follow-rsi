  source_hash: 4f5dd6f2af597c6b60748e53eadba7137116e675c01875a2f043d0e68bc0e437
  published: '2026-10-13'
  updated: '2026-10-13'
  hf_daily_dates: []
  abstract: Electrocardiogram (ECG) models need supervision that targets evolving weaknesses and remains faithful
    to waveform evidence. We introduce ECG-RSI, a recursive self-improvement framework combining verified waveform
    synthesis with feedback-guided intervention search. Signal remeasurement verifies waveform edits; construction
    errors guide generator repair, while learner errors motivate interventions compared on a separate selection
    set. Across seven benchmarks, three rounds raise Qwen3.5-35B-A3B's mean question-answering accuracy from 34.57%
    to 56.04% and mean classification F1 from 24.27 to 34.03. Across the retained trajectory, the preferred supervision
    shifts from direct reinforcement to confusion-focused contrasts. Continued feedback correction yields diminishing
    external gains. These results motivate separating error diagnosis from intervention selection and checking whether
    gains on the feedback set transfer to independent benchmarks.
