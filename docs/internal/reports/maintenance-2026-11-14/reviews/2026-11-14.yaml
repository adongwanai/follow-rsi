- id: arxiv:2611.08538
  title: Subliminal Learning in Vision-Language Models
  announced: '2026-11-04'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.08538'
  version: 1
  source_hash: 953d118110f44cf10a2b4e70c07dc6597aed5a3a1fe5112721e27dbad44d9272
  published: '2026-11-04T23:36:01Z'
  updated: '2026-11-04T23:36:01Z'
  hf_daily_dates:
  - '2026-11-12'
  abstract: Subliminal learning is a phenomenon in large language models (LLMs) where a teacher passes a hidden
    preference to a student through training data unrelated to that preference. We study whether subliminal learning
    also occurs in vision-language models (VLMs). We finetune a teacher VLM to prefer a specific animal or facial
    attribute and use a control teacher from the same base model. Both teachers generate numbers for an unrelated
    visual task involving geometric shapes. Two students initialized from the same base VLM are finetuned on the
    same images, using numbers generated by either the biased or control teacher. Across VLMs ranging from 2B to
    7B parameters, we find that both animal and facial preferences can transfer through this unrelated task. Students
    trained on biased-teacher outputs select the target more often than control students, with a difference of up
    to $\sim$10 percentage points in the animal preference task. Transfer can become stronger with more training
    data and varies with the target preference, model, and how the numbers are generated. Beyond preferences, we
    show that the biased student's explanations use more of the same words and phrases as the biased teacher's explanations
    than those of the control student, even when all three models select the same image. These results matter for
    training VLMs and show that training on unrelated data may change both a VLM's image preferences and how it
    explains its choices, and that transfer can become stronger with more training samples.
