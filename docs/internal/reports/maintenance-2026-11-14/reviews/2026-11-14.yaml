  summary_zh: 预注册评测比较冻结模型周围的简单配置、救援配置与 GEPA 选出的提示，追查 Harness 搜索增益究竟来自答案可解析性、基线选择还是评测缺陷。注入缺陷的对照显示，使用同一管线进行复制可能复现缺陷的影响，而不能揭示它。
  summary_en: A preregistered evaluation compares simple configurations around frozen models, a rescue configuration
    and GEPA-selected prompts to examine whether Harness-search gains come from answer parseability, baseline choice
    or evaluation defects. Injected-defect comparisons show that replication through the same pipeline can reproduce
    a defect’s distortion instead of revealing it.
