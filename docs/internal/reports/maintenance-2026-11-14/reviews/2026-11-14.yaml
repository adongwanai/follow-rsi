  updated: '2026-10-13'
  hf_daily_dates: []
  abstract: 'Bringing general-purpose agents into the physical world calls for an executable representation of physical
    intelligence. Compared with vision-language-action (VLA) models, which map observations and language instructions
    directly to actions, code makes control logic explicit and reusable. Code can serve not only as a policy representation
    but also as the workspace in which the agent solves a task. Rather than following a prescribed workflow of planning,
    execution, and verification, the agent can autonomously inspect the state, revise and execute code, and use
    feedback to choose the next step. The success of this SWE-style loop in digital environments motivates its extension
    to physical tasks. Yet physical execution remains prone to recurring failures. To retain and refine experience
    for later scenes, we introduce EmbodiedEvo, where a coding agent evolves reusable Skills and Lessons through
    feedback on a single Playground scene, then freezes the resulting harness for diverse new scenes. On RoboDojo-Sim,
    EmbodiedEvo achieves an average score of 44.48 and a success rate of 37.82%, surpassing all officially verified
    results. Paired tests show the largest gains on memory-dependent tasks and successful reuse of coordinated procedures,
    while fine contact control remains difficult. Experience from stronger models also improves weaker executors:
    Astra’s experience raises Sol and Luna’s success rates by 8.86 and 5.50 percentage points over no experience.
    Compared with raw interaction history, Skills and Lessons achieve comparable task performance at 53.0% lower
    execution cost.'
