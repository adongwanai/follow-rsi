    - harness
  summary_zh: 用于实现和比较 Harness 演化方法的开源框架：以 recipe 和算子接入 AHE、Hyperagents、A-Evolve、GEPA，保护评估边界并保存候选谱系；在同一底模下比较 MiniSWE
    与 Codex，并保留 sealed 任务检验泛化。
  summary_en: An open-source framework for implementing and comparing harness-evolution methods. Recipes compose
    AHE, Hyperagents, A-Evolve, and GEPA with protected evaluation and candidate lineage; experiments compare MiniSWE
    and Codex under the same underlying model with separate sealed tasks.
  scope_reason_zh: RSIHub 的核心是为 prompt、skill 与整体 Harness 演化提供统一运行、保留、评测和可审计框架。应作为 harness_eval 框架/评测收录；不能把接口支持可修改
    operator，写成其报告实验已经验证外层 agent 自适应修订整套 recipe。
  caveat_zh: 报告实验运行固定 recipe；框架可审计性不等于安全隔离，本文没有独立复现。此前四篇报告已有原文/数字表核对，本记录只裁定专题类型。
