  summary_zh: 用发现任务反馈训练提案器并保留外部脚手架；执行器冻结，提案器权重会更新。
  summary_en: Trains a proposer from discovery feedback while retaining executable harnesses; executor weights remain
    frozen, but proposer weights change.
  scope_reason_zh: 该工作把改进对象明确放在围绕冻结执行器的可执行 harness 上：harness 包含系统提示、可复用技能、工具、middleware 和执行控制参数，由 proposer 生成；每轮
    harness 引导预算内的 discovery rollout，rollout 结果形成奖励并用于更新 proposer，选中的最佳解与 harness 跨轮保留，且学习到的 harness 可迁移到 GPT-5.5
    等更强执行器。虽然 proposer 的 LoRA 权重被训练，但执行器 M0 始终冻结，论文的主要可检查、可复用、可保留产物是外部 harness，因此属于 harness_method，而非优化 executor
    权重的普通 RL。
  caveat_zh: 证据边界：作者明确说明迁移收益并不隔离纯迁移效应，因为 executor 选择与额外搜索也参与迁移流程；LLM-SQL 与 Txn 被 quarantine；若干条件为单次 campaign；公开
    artifact 未包含 trusted runtime、sandbox、gate、scrubber 等，协议无法完全独立验证。另需注意 proposer 权重通过 RLOO/LoRA 更新，若把 proposer
    训练本身视作 primary 会有边界争议；但执行器从未更新，且 harness 是显式持久化与可迁移对象。
