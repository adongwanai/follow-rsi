  summary_en: Uses incident outcomes to create and revise diagnostic scripts and playbooks, committing reusable
    artifacts for future incidents.
  scope_reason_zh: 研究对象是 SDO 的外置、可复用运行工件：自撰 playbooks（诊断/修复说明与脚本）、detectors（Go 代码，由 monitor 执行并路由 playbook）、architecture
    summary 与 outcome log；这些工件决定后续事件如何检测、分派和修复，属于围绕执行器的控制流、工具/技能工件，而非当前任务答案。反馈回路为：事件解决后 responder 反思并将经验蒸馏为 playbook
    和 detector；outcome log 记录 detector 触发与 playbook 使用，后续反思据此收紧、拆分或扩展 detector 映射。工件提交至应用 Git 仓库，新 detector 经重新部署注册，跨事件持久。这不是单纯存储或检索经验，因为系统改写可执行
    detector 代码和操作流程；论文还明确保持模型与 detector API 不变，权重更新不是主要干预。
  caveat_zh: 论文未报告权重训练或微调；改进主要来自自撰运行记忆与 detector 代码更新。Detector API 固定，且部分收益可能也来自提示中的示例脚本，需区分工件改写与上下文示例的影响。评估主要基于
    SREGym 变体和 Claude Code，未覆盖其他执行器或长期生产漂移。
  remaining_evidence_needed_zh: 若要进一步评估证据强度，可核查公开仓库中 detector/playbook 的跨事件提交历史，确认 outcome log 驱动的调整确实长期保留，并排除仅由上下文示例造成的表观改进。
