- id: arxiv:2610.16725
  title: 'Trace-to-Architecture: Capability Bottleneck Diagnosis for Harness Revision'
  canonical_source_hash: 63675297089baef07983e4c0df4da790e0a68ccf918ca3fcc942712cec903b53
  direction_override:
    primary: harness
    harness_sub: evolve_main
    secondary: []
  summary_zh: 从成功与失败轨迹诊断瓶颈，修改控制与工具组件，经验证保留到后续轮次。
  summary_en: Diagnoses bottlenecks from successful and failed executions, revising harness components and retaining
    changes that pass validation for subsequent rounds.
  scope_reason_zh: 该文提出 T2A：任务代理在当前 harness 下执行并产生轨迹，开发代理基于成功/失败执行证据分组、诊断能力瓶颈，进而修改 driver、组件或日志规则（如技能卡内容、调用条件、动作检查、记忆与执行控制）。修改前登记目标任务改进、受保护任务不退化、编辑确实触发等验收条件；通过验证的
    harness 被保留，并作为后续轮次与冻结测试的当前 harness。改进对象是外部可复用的执行程序/harness 工件，而非当前任务答案；权重未更新，反馈驱动修改且保留持久化，符合 harness_method。
  caveat_zh: 证据边界：语义验收由开发代理自行书写并判断，程序不独立裁决；组件消融仅覆盖可独立禁用的组件，部分修订与基本执行流耦合而未消融；Full T2A 与指令替换比较还混合了 Claude Code 版本、effort
    和工具权限差异，不能全部归因于单一机制；实验限于三个环境和三个任务模型。
  remaining_evidence_needed_zh: 可进一步核对附录中每次接受修订的具体外部工件与冻结提交记录；现有正文已足以判定为 harness 方法纳入。
