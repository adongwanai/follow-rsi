  summary_zh: 依据任务成败和成本学习何时咨询顾问，冻结策略表后用于留出任务。
  summary_en: Learns when to consult an advisor from task outcomes and costs, freezing a policy table for held-out
    tasks.
  scope_reason_zh: 论文的改进对象不是模型权重，而是执行器-顾问工作流上的外部元控制器策略：在 PRE_STEP/STALL/PRE_DELIVERY 等接触点根据执行证据映射到紧凑状态并选择 SILENT/CONSULT。该策略用成本惩罚后的终端任务成败作为回报，通过
    Monte Carlo 控制更新动作值，训练后冻结为可查表部署的策略表，在不相交的 held-out 任务上复用。执行器和顾问模型均固定/未微调，因此权重更新不是主要干预；这属于围绕执行器的控制流/工作流工件，反馈驱动且持久化。
  caveat_zh: 证据仅覆盖单一模型对（gemini-3-flash/3.1-pro）和 Magentic-One 框架；控制器只决定是否插入顾问建议，未学习或改变更广泛的工作流结构；策略在开发任务上训练后冻结，held-out
    评估不再在线更新；未证明跨任务族或跨会话的广泛泛化。
