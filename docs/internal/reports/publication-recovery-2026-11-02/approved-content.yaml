- id: arxiv:2609.39544
  title: 'Growing an Agent/Prover Interface: Evolutionary Tool Design for Cost-Efficient Theorem Proving in Rocq
    and Lean'
  canonical_source_hash: 458148ffe1a685f7c2273f6e6928733c4cdbc95e17a040759faf752824500ff5
  direction_override:
    primary: harness
    harness_sub: component
    secondary: []
  summary_zh: 按证明任务评估改进工具服务器接口，保留有效修改并冻结用于后续测试。
  summary_en: Evolves theorem-prover tool interfaces from task evaluations, retaining beneficial changes and freezing
    the server before subsequent testing.
  scope_reason_zh: 改进对象是围绕冻结执行器（Claude Haiku/Sonnet 等固定 API 模型）的外部可复用工具实现——Rocq 的 MCP 服务器接口（工具集、输出渲染、错误提示、会话机制等），属于“工具实现/库”类
    Harness 工件，而非模型权重。闭环清晰：前沿模型作为 orchestrator 提出一个变异（新增工具、改写输出、改配置），用较小模型作为 tester 在 dev60/hard70/mathcomp35/miniF2F-Rocq
    等数据集上按固定预算评测，依据准确率净增益阈值接受或回退，成本与时间为次要目标；这是执行/评测反馈驱动修改。持久性成立：最终服务器在接触 held-out 测试集前被冻结，作为可复用工件发布（rocq-mcp-evolve）并移植为
    lean-mcp-evolve，供后续任务与会话复用，且在四个模型上取得更好成功率、成本与时间。权重角色为 frozen：论文中模型仅作为 orchestrator/tester/被试，未做 SFT/RL 权重更新，主干预是外部服务器工件。
  caveat_zh: (1) 部分工件改动未经评测直接加入（如 open/build/verify 等文件操作工具），说明并非所有工件更新都受反馈驱动；(2) Phase 2 的三个变异全部被拒，项目级任务的改进主要沿用
    Phase 1 结果；(3) 变异接受基于小样本（每桶 40 次尝试、±2 阈值），统计功效有限；(4) orchestrator 为 LLM，作者仅固定目标、预算与验证规则，过程不可确定性重放；(5) 成本/墙时仅为次要目标，Phase
    1 未用于验证任何变异；(6) Lean 移植仅小幅改善成本与时间，成功率未超过 lean-lsp-mcp。
  remaining_evidence_needed_zh: 建议核对附录表 8/表 1 中每个变异的具体实现与版本记录，确认服务器代码与提示/文档改动是主要被优化对象，而非测试器提示或评测环境调整；并检查是否存在对执行器权重或测试器系统提示的隐性优化。
  content_basis: existing_source_quotes_and_reconciled_scope_no_new_numeric_claims
  existing_catalog_summary_preserved: false
