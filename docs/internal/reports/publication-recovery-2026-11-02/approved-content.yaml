- id: arxiv:2610.13870
  title: 'Ask Your Advisor: Learning When to Consult Stronger Models in Agentic Systems'
  canonical_source_hash: 56c2334e05cc44e6030cab9d8df88433150d83574d539e83cdadf56667a862a3
  direction_override:
    primary: harness
    harness_sub: component
