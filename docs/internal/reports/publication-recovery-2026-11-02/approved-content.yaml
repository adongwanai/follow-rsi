- id: arxiv:2610.05284
  title: 'Fusion is the New Mutation: Bandit-Guided Evolution on Workflow Graphs'
  canonical_source_hash: 890a6caac173b62f76f4d89b3645fcfcfc6d7d5756a45b55248dca36314ec2ed
  direction_override:
    primary: harness
    harness_sub: evolve_main
    secondary: []
  summary_zh: 按验证反馈融合工作流程序，保留后代和多父谱系，供后续搜索继续组合。
  summary_en: Fuses executable workflows using validation feedback, retaining offspring and multi-parent lineage
    for subsequent search.
  scope_reason_zh: 论文把改进对象放在可执行 agentic workflow 程序上：workflow 由编排代码、控制流和内部 prompt 组成，执行器使用固定 Claude/GPT-4o-mini
    等模型。DAGO 以子 workflow 的验证分数作为 bandit reward，更新 parent-combination 选择策略，并让 LLM 通过 summary-guided fusion 生成子 workflow；子
    workflow 写入 DAG，成为后续轮次可选的 parent，最终最高分 workflow 被返回复用。故属于围绕冻结执行器的 Harness 方法，反馈驱动且工件持久。
  caveat_zh: 仅依据提供的摘要与正文；正文中间有省略，附录仅见部分内容，未逐项复核所有实现细节。持久性证据主要是同一目标任务搜索轮次中的 DAG 复用与最终返回复用；跨任务迁移只是泛化证据，不等同于跨会话或跨任务自动持久化。未发现权重训练，但未完整检查所有实验配置。
  remaining_evidence_needed_zh: 可进一步核对附录 D/E 的 fusion prompt 与 Algorithm 1 实现，确认子 workflow 确实被保存为可复用 artifact 并作为后续
    parent；确认返回的 workflow 在搜索结束后如何被存储/复用。
