  summary_zh: 在合成组织模型中按试验分数选择并保留评估程序，分析递归改进的条件。
  summary_en: Models recursive organizational improvement by selecting and retaining evaluation programs from trial
    scores in synthetic simulations.
  scope_reason_zh: 本文是专门针对人—智能体组织递归改进的建模与评估研究，研究对象包括评估程序替换、记忆保留和程序版本，而不是只优化模型权重。其循环是：用试验分数和已获取标签评估候选评估程序，选择并保留程序，再在后续轮次或区块中部署和再评估；因此反馈驱动且有跨轮持久化，属于围绕执行者的外部可复用策略/控制流更新。模型权重未更新，执行者可视为冻结。
  caveat_zh: 证据主要来自合成模拟和固定目录中的评估程序替换（Biased/Balanced/Neyman）；外层选择器固定，记忆规则在单次运行内固定；Study 2 从固定目录选安排，不走版本化补丁接口；实现未覆盖表3全部关系。程序替换的边际贡献在
    Window 8 下小且不确定，不能等同于真实部署中的代码级自改进。
