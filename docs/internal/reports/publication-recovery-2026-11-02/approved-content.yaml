- id: arxiv:2609.39148
  title: Do Self-Evolving Skills Generalize to Held-Out Tasks?
  canonical_source_hash: 4839d9ecd1da4496ac1ae976c97f2b78e69178dddb5e827f0029c092f7e3fd46
  direction_override:
    primary: harness
    harness_sub: improver
    secondary:
    - meta
    - evaluation_benchmark
  summary_zh: 按执行失败修改元技能，经验收后在同一基准轨迹内保留，并指导测试时技能生成。
  summary_en: Revises a metaskill from execution failures, retaining validated updates within each benchmark trajectory
    to guide test-time skill generation.
  scope_reason_zh: 该文的GSO把持久改进对象定义为metaskill，即一个可复用的“如何写skill”的指南，而不是一次性任务skill。循环是：在训练任务上执行、失败归因到metaskill某一模块、只编辑该模块、用验证任务上的repair/regression配对门控决定是否接受；接受的更新在benchmark轨迹内保留，最终选出的m*用于后续测试任务。模型和agent固定，所有调用使用同一模型且不更新权重，因此主要干预不是权重训练，而是外部可复用程序/策略工件的反馈驱动修改，属于Harness
    method。
  caveat_zh: 证据边界：持久性限于单个benchmark轨迹，作者明确说接受更新不跨benchmark迁移；测试时GSO还会为每个任务写新skill并可能重试，作者也承认这只能说明整体方法有效，不能分离metaskill学习与测试时技能生成/重试的贡献。该文同时包含对既有自演化skill方法的评测，但方法本身的metaskill更新与持久化证据是直接的。
  remaining_evidence_needed_zh: 可进一步核对附录A.3中m(0)到m*的更新是否在测试前完全冻结，以及是否有消融能分离metaskill学习与测试时临时skill生成/重试的贡献；当前纳入依据是整体GSO方法中metaskill作为持久工件被反馈驱动修改并保留。
