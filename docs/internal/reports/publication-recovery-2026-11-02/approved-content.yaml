- id: arxiv:2610.15221
  title: 'HarnessNet: Feedback-driven Hierarchical Joint Harness Evolution for Multi-agent Systems'
  canonical_source_hash: 8a97d5c42f2c676041ddac7f62e0934c8237cedeeb41cf3fb726708191f858df
  direction_override:
    primary: harness
    harness_sub: evolve_main
    secondary: []
  summary_zh: 以任务执行反馈修改多代理脚手架代码，经检查点选择后评估跨模型复用。
  summary_en: Uses task feedback to revise multi-agent harness code, selecting checkpoints and evaluating reuse
    after changing foundation models.
  scope_reason_zh: 该论文的核心对象是 Agentron/HarnessNet 中可修改的 forward harness 代码仓库，包含提示、工具注册、记忆/解析/策略等可执行程序；基础模型权重保持冻结，优化器也是冻结的编码代理。训练循环先用固定
    harness 快照在训练任务上执行并收集失败案例及环境/下游反馈，再由局部优化器以代码级方式修改 harness，形成 H^{k+1} 并按训练/验证表现选择检查点。迁移研究显示演化后的 harness 在替换基础模型后仍然有效，说明改进对象是可保留、可复用的外部
    harness 程序，而非当前答案或模型权重。因此属于 Harness METHOD。
  caveat_zh: 证据仅来自提供的摘要与正文；论文中拓扑和优化器本身是固定的，且 FH0 初始化阶段对 strategy.py、memory.py、parsing.py 等有限制，但优化器阶段的 allowed_paths
    明确允许代码级修改，故不构成排除理由。未提供独立人类复核或代码仓库级审计证据。
