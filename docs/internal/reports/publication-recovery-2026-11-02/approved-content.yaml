- id: arxiv:2609.39304
  title: 'Scale and Selection: What Makes Automatic Harness Evolution Work for Visual-Interface Robot Agents'
  canonical_source_hash: b17bf8624cbf6c36db43f0f155a58a3659f6bf90f60f8d2c1182d57027b0fc9b
  direction_override:
    primary: harness
    harness_sub: generalize
    secondary:
    - model_weights
    - embodied
  summary_zh: 以执行证据和冠军挑战者规则演化机器人脚手架；蒸馏权重是另一条更新链。
  summary_en: Evolves robotic harnesses using rollout evidence and champion-challenger selection; policy-weight
    distillation is a separate update path.
  scope_reason_zh: 研究对象是视觉界面机器人 agent 的外部 harness，包括提示词、MCP 工具、观测/控制与验证规则，属于可复用执行程序而非任务答案。循环中优化器 agent 读取成批 rollout
    证据，提出有界 harness 修改，并用 Champion-Challenger 规则在同一固定案例上比较后决定是否保留；任务 agent 与优化器模型在该 harness 演化链中未被训练。被接受的 champion
    harness 跨多轮保留，并被后续 held-out 评估和 RoboCasa365 组合使用，满足反馈驱动与持久性。论文另有将 harness rollout 蒸馏回策略权重的第二条链，并让 harness 演化在更强策略上继续，因此可视为
    harness 与权重共演化的混合系统；但核心可判定对象仍是 harness 更新。
  caveat_zh: 证据仅来自提供的摘要与正文；harness 演化链明确冻结模型，但权重蒸馏链是另一条更新路径，且正文称共演化循环只实际跑了一轮，后续重复循环尚属设计。排行榜蒸馏策略的维护者验证在写作时仍待确认。未检查代码/仓库是否公开以及
    rejected challenger 是否只作审计日志。
  remaining_evidence_needed_zh: 核实公开代码或仓库中 harness 修改是否确实作为可复用 artifact 持久化，并确认多轮 harness-policy 共演化是否实际运行超过一轮。
