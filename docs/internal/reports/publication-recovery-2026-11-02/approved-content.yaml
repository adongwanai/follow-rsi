- id: arxiv:2610.32253
  title: 'RSIHub: A Composable Framework for Agent-Evolution Methods'
  canonical_source_hash: ab543fc10edf2dae2e450a71dc5eb11318f80136e6ff7997e10e9366bd1d4036
  direction_override:
    primary: evaluation_benchmark
    harness_sub: null
