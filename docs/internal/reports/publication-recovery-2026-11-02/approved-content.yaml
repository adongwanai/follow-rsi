  summary_zh: 以仿真执行反馈修订代码技能与诊断经验，再冻结给未见场景中的新代理复用。
  summary_en: Refines code skills and diagnostic lessons using simulation feedback, then freezes artifacts for fresh
    agents in unseen scenes.
  scope_reason_zh: 该工作把改进对象明确放在执行器外部的可复用 Harness 工件上：Playground 中由 coding agent 通过物理执行反馈修订可执行 Skills 与诊断 Lessons，形成
    skills/lessons 文件；Test 阶段这些工件被冻结并交给新的 agent/场景复用，模型参数和机器人接口保持固定。闭环是“观察—写/改代码—执行—依据物理反馈修订 Skills/Lessons”，且经验跨未见场景和跨模型保留，符合
    Harness METHOD 的反馈驱动外部工件更新与持久化要求。
  caveat_zh: 证据主要来自 RoboDojo-Sim，每个任务仅一个 Playground 场景；Test 中 Harness 只读、不继续更新；部分 Precision/Long-Horizon 任务仍失败；复用经验会增加执行成本；配对案例用于说明机制，作者明确未隔离单个工件的因果效应，也不能据此证明所有
    Skills/Lessons 均由反馈直接产生。
  remaining_evidence_needed_zh: 资格证据已足够；若需更强因果或泛化结论，应复核单工件消融、跨任务/跨模型复用是否确为同一冻结工件，以及真实机器人迁移证据。
