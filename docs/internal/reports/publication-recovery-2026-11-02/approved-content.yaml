- id: arxiv:2610.15738
  title: 'Visible but Not Avoided: State-Dependent Re-Proposal of Rejected Candidates in Catalog-Based LLM Optimization
    Loops'
  canonical_source_hash: 40760a535e6d14baca4913294ec5598197ec51bd89a1723194822aae8cf51157
  direction_override:
    primary: evaluation_benchmark
    harness_sub: null
    secondary:
    - harness
  summary_zh: 测量脚手架优化器是否重复提议已拒编辑，比较真实循环状态与干净初始探针。
  summary_en: Measures re-proposal of rejected harness edits, contrasting optimizer trajectory states with clean
    initial-state probes.
  scope_reason_zh: 该文研究的是以 40 条编辑目录改进 GUI agent harness 的 LLM 优化循环：提议者每轮命名一条编辑，按开发集准确率决定是否保留，历史（含失败与拒绝标记）进入下一轮，被保留的编辑构成持续演化的
    harness。因此受试对象是外部 harness 工件的反馈驱动演化过程，属于专门评估而非通用 agent 基准；提议者与执行 agent 的权重均冻结，未更新模型权重。论文提供预注册实验、置信区间和匹配状态干预，作为
    harness_evaluation 证据较强。但它评估的是提议者的重提议行为/拒绝规避，不是提出新的 harness 更新方法；状态句干预是实验性固定提示，不是由反馈更新并持久化的复用工件。
  caveat_zh: 仅一个合成 GUI agent、一个 40 编辑候选集和三个开源提议者；自由文本优化器未研究；主要状态干预未固定 provider 路由；未证明最终 harness 在 30 轮循环之外的任务/会话中复用；状态句效果归因依赖
    Assumption 2，且部分分析为 post hoc。
  remaining_evidence_needed_zh: 确认论文的测量框架是否应被界定为 harness 演化评估而非一般优化器行为研究，并检查是否有独立于实验条件的、由反馈更新并持久化的复用策略工件；若无，则不应升级为
    harness_method。
