  summary_zh: 用执行器反馈演化元技能库，测试前冻结，再指导未见任务的脚手架构造。
  summary_en: Evolves a meta-skill bank from executor feedback, freezing it before constructing harnesses for unseen
    tasks.
  scope_reason_zh: 该工作研究 test-time AI4AI：Builder 在开发集上为每个任务构造 harness（指令、记忆、上下文组织、组合工具、执行控制、验证与恢复、工作区准备七类组件），Target
    执行后产生公开执行记录与开发分数，Builder 据此对 bank 做 keep/revise/add 更新。被改进对象是模型权重之外的、可复用的外部工件：显式的 meta-skill 银行（外部策略/技能文件）以及由它指导生成的可执行
    harness 组件（附录案例显示生成 auditor、controller、submission gate、memory 模块等可执行支持）。两模型权重全程固定，正文明确“both the Builder’s and
    Target’s model weights remain fixed”，因此权重更新不是主要干预。学习循环由执行反馈驱动，且学到的 bank 在测试前冻结并用于所有 held-out 任务的新 harness 构造，满足“被接受的修改工件持久化并服务后续任务”的要求。虽然每个测试任务都重新构造
    harness，但承载经验的 meta-skill bank 本身是跨任务持久的外部工件，属于 Harness 方法而非仅修当前答案。
  caveat_zh: 证据边界：(1) 主实验仅一个 Builder（GPT-5.6-Sol）与两个 benchmark，作者自述需更多 Builder 与任务；(2) 每任务仅一次正式执行，跨 Builder/跨 Target
    迁移的置信区间均包含零，迁移收益不确定；(3) 开发集仅约 10%，无独立验证集，跨数据集复用未评估；(4) 学习机制被作者称为“simple initial evolution mechanism”，两轮 pass、每任务至多一次
    keep/revise/add；(5) harness 组件的因果贡献仅在冻结 harness 上做消融，部分区间含零，案例研究为单例定性说明。
  remaining_evidence_needed_zh: 若需进一步核实，可检查随论文发布的代码与 prompt，确认 meta-skill bank 以外部文件形式持久化并在新会话/新任务中被加载，以及 Builder
    生成的 harness 组件确为可执行工件而非纯文本提示；正文与 Table 1、附录案例已基本覆盖这些要点。
