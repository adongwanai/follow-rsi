- id: arxiv:2610.17370
  title: 'HarnessTTT: Learn to Optimize Harness at Test-Time for Scientific Discovery'
  canonical_source_hash: ca580dcc58b370f3678ce2023ecfe762e3d858be5c5f9bb0350b050a372bb494
