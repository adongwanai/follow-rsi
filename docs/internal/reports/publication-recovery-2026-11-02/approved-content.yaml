- id: arxiv:2610.00704
  title: 'SkillSpec: Consensus-Gated Agent Skill Evolution via Representation Specialization'
  canonical_source_hash: 56c8f469511db95e74bee5ac113330a4f778da904ffe130391fb8b43f9348de8
  direction_override:
    primary: harness
    harness_sub: component
    secondary: []
  summary_zh: 利用执行轨迹和配对验证演化技能，保留可靠骨架，再特化技能表示。
  summary_en: Evolves skills through trajectory feedback and paired validation, preserving a validated backbone
    before specializing its representation.
  scope_reason_zh: 该文的主要改进对象是固定策略模型之外的自然语言技能产物：技能作为可复用的文本程序记忆，被迭代修改并可在 flat/graph/hybrid 表示下特化；正文明确策略模型参数不更新，权重不是主要干预。循环上，训练执行轨迹与验证集配对结果驱动候选技能生成、筛选和原子提交；Phase
    II 再利用 Phase I 的接受/拒绝轨迹选择并特化表示。被接受的 validated backbone 作为不可变源保留并供后续特化/评测复用，符合 Harness 方法对执行反馈驱动、外部可复用程序工件持久修改的要求。不是单纯记忆存储/检索，也不是权重优化或任务输出。
  caveat_zh: 证据边界：正文对 Phase II 的 token 统计仅覆盖部分使用，部分配对比较为单次运行且未固定上游 SkillOpt；这些影响效果强度/可复现性，但不改变其外部技能工件被反馈驱动修改并持久保留的
    scope。未提供跨会话实际部署持久化细节，持久性证据主要来自 validated backbone 在 Phase II 的复用与最终技能评测。
  remaining_evidence_needed_zh: 无需进一步范围核查；若做强度复现，可核对技能文件的实际存储与跨任务复用接口，以及单次运行比较的稳健性。
