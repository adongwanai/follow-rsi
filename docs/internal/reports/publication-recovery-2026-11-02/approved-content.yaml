  summary_zh: 在仿真中用轨迹反馈修订冻结策略外的控制代码，并在留出任务评估。
  summary_en: Uses rollout feedback to revise control code around a frozen robotic policy, evaluating retained harnesses
    on held-out tasks in simulation.
  scope_reason_zh: RoboArchitect 用机器人轨迹诊断并修改冻结政策周围的控制代码，只在训练集改进时接受候选，最后在留出场景/任务评估；控制与记忆机制本身演化，符合 Harness。
  caveat_zh: 读方法、实验设置与控制/记忆实例；VLABench 为 progress score，其余为 success rate，不能把平均数全称二元成功率。抽象中的 9.7→43.3 与 12.7→40.2
    为作者报告；未复算表格/底层日志。 已核实验为仿真，不能声称真机迁移。
