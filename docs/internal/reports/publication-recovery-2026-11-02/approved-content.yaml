- id: arxiv:2609.38660
  title: 'Breaking Babel: A Self-Evolving Multi-Agent System for Long-Form Subtitle Translation'
  canonical_source_hash: a1121a3ba3982a397977546e2d12fb8d017ff3bf029ece0cb32376d5e1f70157
  direction_override:
    primary: harness
    harness_sub: component
    secondary: []
  summary_zh: 按翻译反馈更新提示和路由，在同剧留出片段冻结复用；没有独立验收门控。
  summary_en: Updates prompts and routing from translation feedback, reusing frozen configurations on held-out segments
    of the same series without independent acceptance gates.
  scope_reason_zh: SMART把翻译智能体的提示词Π、图路由策略ρ与工具分配显式定义为可学习系统状态，而底层LLM权重保持不变（摘要与3.5节反复声明'without retraining the underlying
    LLMs'/'the underlying LLM parameters remain fixed'），因此权重不是主要干预对象。循环清晰：judge给出分数c与文本批评δ，evaluator将批次内分数与批评聚合为反馈Δ_t（式8），再由受限重写算子F^Π改写欠佳智能体提示（保留角色与工作流骨架）、F^ρ在固定类别集合下重排每类别的智能体/工具子集（式9、附录B.8、Algorithm
    1第22–32行）。被接受的配置写入持久状态并在训练前缀之外的留存剧集上冻结加载（B.7 Phase 5 'this config is loaded unchanged at inference time'），序列记忆作为任务状态继续累积。消融显示去掉自进化带来约0.36的整体惩罚上升，说明进化本身是可度量的改进对象。对象（系统提示/控制流路由/工具配置）、反馈驱动、持久复用三要件均满足，故判为harness_method并建议纳入。
  caveat_zh: 1) 持久化范围限于同一剧集内部：进化用的是每部剧前30%内容，冻结后用于同剧剩余70%，没有展示跨剧集、跨任务或跨优化轮次的复用，属于按任务实例的test-time适配，比一般'跨任务可复用harness'的持久性弱。2)
    更新无验证门控：F^Π/F^ρ为单次提案式重写，作者明确'there is no separate validation-gated acceptance test'，固定跑3个epoch后直接采用末期配置，无回滚或早停，'accepted'一词的证据较弱，只能算经反馈重写后被沿用。3)
    序列记忆（术语库/角色档案/习语库）的持续累积只是任务状态，不构成本身对管理代码的变异，不能作为独立证据。4) SOURCE BODY含'[Middle omitted]'，省略部分主要是附录结果表（F.1–F.5等），核心机制证据位于摘要、3.5、5.4、B.7、B.8，均在可见范围内。5)
    主要评测SubMQM为LLM判官，另有人工研究仅覆盖子集方向；但这只影响证据强度，不影响对象归属。
  remaining_evidence_needed_zh: 核对被省略的中段（附录F各表）是否含额外的自进化细节或跨任务复用证据；确认是否有任何实验把进化后的提示/路由表复用到其他剧集或其他任务（决定持久化是否满足later
    tasks而不仅是later episodes）；确认附录C.5/C.6的提示与路由改写示例是否与B.8的约束一致，以及是否存在未在正文提及的接受阈值或回滚机制。
