  summary_en: Compares independent and peer-assisted skill evolution at matched cost; cheaper copying does not establish
    better final performance.
  scope_reason_zh: 该文的研究对象正是外部可复用 Harness 工件（skill file，即推理时注入的可写程序性指令）在反馈驱动下的演化：每个 agent 在单一 token 预算内选择 Revise（用
    OpenEvolve 依训练集反馈改写 skill）/Observe（拷贝同侪 skill 及其训练分数）/Act，被接受的 skill 进入个人库并在后续 49 轮与 200 条 held-out 任务上继续被选择、再修订、再传递（存在
    lineage 与 recursive transmission 统计）。执行器权重被明确冻结（'Only skill files change; model weights and decision prompts
    stay fixed'），故干预对象是工件而非权重。文章主贡献不是新方法而是受控刻画/评估：用同成本对比 ΔJ(C)=J(π_soc;C)−J(π_solo;C) 检验社群式 skill 演化是否优于同预算独立学习，并辅以
    PE、IS、随机化拷贝时点等因果干预，因此属于专门评估 Harness 工件反馈式演化的研究，而非通用 RSI/多智能体基准。其结论以零效应/效率-效果之辨为主（社会群体更省 token、偶有更快提升，但同成本下无显著优势，且谱系收敛到少数早期发现），但这不影响其作为该主题高质量评估证据的资格。
  caveat_zh: 1) 主要 skill-file 实验仅用一个指令遵循基准（IFBench）与两个模型（GPT-OSS-120B、GLM-5.3-Flash），外推性有限；第 4 节的 bandit 部分的对象是
    bandit 臂而非 skill 工件，与 Harness 直接相关性较弱。2) 结果多为不显著/零效应：GLM 轨迹 +1.31pp、最终 +0.95pp、ΔJ(C) +0.98pp 均未显著，作者明言 'neither
    model meets our criterion for recursive social improvement'；仅 GLM uniform 控制器有一项 nominal 显著对比，因此该文更支持“社会式 Harness
    演化尚不能超过同成本独立演化”的边界，而非被验证的改进机制。3) 复制带来的成本节省部分来自设计本身（观察免去 100 例评估），作者自承不能据此说明学到了更好技能。4) 同侪列表顺序固定，无法区分偏好与位置效应。5)
    提供的正文中段有省略（'[Middle omitted]'），相关附录细节（含 UCB/uniform 完整实现与 E.3 预算设置）未能逐条核验。
  remaining_evidence_needed_zh: 核验被省略的中段与附录（E.3、F、G 完整内容），确认是否存在对被演化工件（如决策提示、控制器代码）的额外改动或任何权重训练条件；确认 skill 库在 held-out
    任务上的跨任务持久复用证据是否如正文所述；并核对附录中 ΔJ(C) 插值方法与显著性族校正的完整报告，以判断证据强度。
