- id: arxiv:2609.38143
  title: Learning Meta-Skills for Agent Harness Design in Test-Time AI4AI
  canonical_source_hash: 340a9e1236b09d346bce201fee6db477d479f97ce49918885e9463b35ab9fc69
  direction_override:
    primary: harness
    harness_sub: improver
