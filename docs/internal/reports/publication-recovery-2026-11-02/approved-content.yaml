  summary_zh: 从执行历史筛选任务和成功轨迹，支持提示变异与保留；筛选器本身固定。
  summary_en: Selects tasks and successful trajectories from execution histories to support prompt mutation and
    retention; the curator itself remains fixed.
  scope_reason_zh: 该工作把 GEPA 类反射式 prompt optimizer 作为外层循环，Curator 根据历史执行与评估反馈筛选任务并检索成功轨迹，Reflector 据此提出并接受系统提示 mutation；被修改并可复用的是
    agent 的 system prompt，随后用于后续任务与 held-out 测试。actor 与 optimizer 模型仅用于推理，未做 SFT/RL 权重更新，因此主对象是外部 prompt artifact
    而非权重。Curator 的筛选/检索本身不是独立 RSI，但它服务于 prompt 的反馈驱动更新与持久化，符合 Harness method 边界。
  caveat_zh: 正文未显式写 weights frozen，但方法只描述 prompt optimization，没有权重训练；Curator 指令/策略看起来是固定的，不是被进化对象；成功轨迹检索属于经验选择，不能单独算作
    management policy mutation。证据足以确认 prompt 被优化并用于 held-out test，但未逐条展示跨独立 session 的复用。
  remaining_evidence_needed_zh: 可核对附录或代码确认 actor 与 optimizer 未做任何权重更新，以及 Curator 自身是否固定；当前证据已支持 prompt 为可复用改进对象。
