- id: arxiv:2610.21218
  title: 'AutoOnboarder: Autonomously Onboarding LLM Agents'
  canonical_source_hash: 98fa85faf39b95f19c12a75006053ccc1785a4afc6323ba6217b3bb292709751
  direction_override:
    primary: harness
    harness_sub: component
    secondary: []
  summary_zh: 依评分反馈调整提示、模型选择及脚手架源码，保留配置用于验证；收益归因有限。
  summary_en: Uses scored feedback to adjust prompts, model selection, and harness code, retaining configurations
    for validation; component-level benefit attribution remains limited.
  scope_reason_zh: 该文提出 AutoOnboarder：由 Onboarder 编码代理迭代修改 Executor 的任务提示词、OpenRouter 模型选择和 browser-use harness
    源码。每轮在 Onboarding 集上执行 Executor，读取 Trainer 的分数与逐例反馈，再保留或回退修改，最后提名一个保留配置用于验证。模型权重未被训练或更新，模型杠杆只是切换模型标识，因此主要干预是外部可复用执行程序配置而非权重优化；反馈驱动修改且保留配置延续到验证，符合
    Harness 方法。
  caveat_zh: 证据显示 harness 杠杆使用很少，最多两次迭代；论文自己也说 harness 与 prompt/model 的贡献无法从高方差、小样本结果中可靠区分。最终保留配置仅用于验证集评估，缺少其在后续任务、长期会话或更多优化轮次中复用的直接证据。研究是单任务，且作者报告运行方差很大。
  remaining_evidence_needed_zh: 检查 per-iteration ledgers/session logs 与最终候选代码，确认具体 harness 源码修改是否被接受并保留；确认最终 Executor
    是否在验证之外被复用；进一步拆分 harness、prompt 和模型选择的各自贡献。
