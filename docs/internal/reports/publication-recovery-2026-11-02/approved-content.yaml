- id: arxiv:2610.36660
  title: 'The View from Nowhere: Population-Centered Agent Evolution'
  canonical_source_hash: 31f6b1998e650e712cdce4c1851e95f9e1dd190cbc78f261ee13ef60abbaaddc
  direction_override:
    primary: harness
    harness_sub: evolve_main
    secondary: []
  summary_zh: 汇总种群执行证据诊断并修改代理代码，将验证后的后代保留为后续父代。
  summary_en: Distills population execution evidence to diagnose and revise agent harness code, retaining evaluated
    offspring as parents for subsequent evolution.
  scope_reason_zh: 论文明确属于 Harness 进化：进化编码智能体通过修改软件 harness（prompts、tools、episode/workflow 逻辑）来自我改进，而基础模型参数保持固定（正文明确说明修改可改变
    prompts/tools/execution workflow，而 foundation model 与推理限制保持固定，且修改范围限于 coding_agent.py、harness_def.py、tools/、utils/）。改进对象是外部可复用程序工件，而非模型权重。闭环由执行/评估反馈驱动：每个变体保留执行日志、提交补丁与评估结果，群体蒸馏把跨变体的成功/失败模式与既往修改历史压缩成
    population block，再据此诊断并对父代 harness 提出并实施单一修改，子代在 gate 任务与剩余任务上评估后才进入存档。持久性充分：修改后的 harness 变体进入 archive（不剪枝）并作为后续世代的父代，最终选出的最佳智能体在不进一步自修改的情况下在
    held-in 重复评估与三个 held-out 任务集上被评测，优势在 held-out 上保持。因此属于规则 (a)-(e) 之外的合规 Harness 方法，而不是仅存储/检索经验（蒸馏结果被用于驱动 harness
    变异，而非仅记忆检索），也不是把生成补丁当作任务输出。
  caveat_zh: 1) 证据仅来自摘要与正文，附录中的提示词、蒸馏输出契约（output contract）与 archive 准入细节未展开，无法逐条核对 population block 到 harness 修改的实现细节。2)
    部分收益对比（DGM、OpenHands、Aider 的已发表数字）作者自述仅作参考点，非受控比较；受控比较主要是 PCE vs GEA 与 parent-only distillation 消融。3) Polyglot
    主结果为单次运行（SWE-bench 为两次运行），统计稳健性有限。4) 固定上下文探针分析中的诊断提案未被实现或评估，只能说明诊断行为变化，不能单独证明下游性能提升。5) 论文是方法论文，非专门评估 Harness
    进化的评测研究，评估部分不构成独立评测条目。
  remaining_evidence_needed_zh: 核对附录 A 中 population block 的输出契约、蒸馏预算与 archive 更新/保留规则，确认 harness 修改确为唯一被持久化的改进对象（排除隐含的权重或记忆库更新）；核对附录
    C 表 5/表 7 的多次运行与 held-out 数据以评估结果稳健性。
