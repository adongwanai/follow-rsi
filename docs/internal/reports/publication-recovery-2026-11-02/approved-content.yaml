  summary_zh: 以训练题失败反馈演化图表推理程序，固定视觉模型并保留留出选择的版本。
  summary_en: Evolves executable chart-reasoning programs from training failures, keeping the vision model fixed
    and retaining holdout-selected candidates.
  scope_reason_zh: 论文把可执行的 inference program 作为主要优化对象，明确包含 system prompt、按问题类型的提示、token 预算和输出后处理；VLM 权重固定，验证器保证模型名和贪心解码不变，因此权重更新不是主要干预。每代用训练题上的具体失败样本驱动
