- id: arxiv:2610.09197
  title: 'FreeEvolve: Learning to Evolve Beyond Fixed Loops'
  canonical_source_hash: 41221e40ab25fb4ae4cea721f24015fecf3c2e41308a4c5004f26c7071ac8c59
  direction_override:
    primary: harness
    harness_sub: improver
    secondary:
    - meta
  summary_zh: 用完整改进战役的结果修订演化技能，再将冻结技能用于新环境的脚手架改进。
  summary_en: Refines evolution skills using complete improvement campaigns, then transfers frozen skills to guide
    harness improvement in new environments.
  scope_reason_zh: 该工作属于 Harness METHOD。改进对象是外部可复用的程序性工件：一个可编辑的 evolution skill（SKILL.md 文本策略文件），它规定进化战役如何采样任务、分配评估、分支与停止；该工件驱动
    Claude Code evolver 修改 worker harness（提示、工具/控制回环、检索与搜索过程），worker 的模型权重始终固定（正文明确 harness 改进无需改变模型权重，各环境还把模型与推理配置列为
    held fixed）。反馈闭环清晰：候选 skill 不被孤立打分，而是装入 evolver 跑完整 worker 进化战役，用产出的 worker 与战役轨迹作为证据来评估和精炼 skill（meta-evolution），因此是执行/评估反馈驱动工件修改，而非人工设模板。持久性明确：学到的
    skill 在见到目标环境前被冻结，安装到全新 worker 上复用并跨环境/跨模型迁移，seed skill 与 no-data LLM 改写均被对照排除，证明增益来自执行经验而非指令改写。这符合可复用外部工件（技能文件/控制流策略）被保留用于后续任务与优化轮次的
    Harness 定义，而非 SFT/RL 权重优化，也非仅生成任务产物。
  caveat_zh: 证据边界：(1) 仍是两层嵌套（worker 与 meta 两层，嵌套被显式限制为两级），非开放式 RSI；外层 meta-evolver 与 seed skill 由人手写，论文自述仍保留两个人类设计组件（Claude
    Code 通用 agent loop 与 seed skill），但其声称这些不含评估调度/接受规则/停止准则。(2) 改进对象既是 skill 也是 worker harness，需注意 worker harness
    编辑在单次战役内产生，跨环境持久的是 skill；部分 worker harness 转移结果显示单源 skill 在 Terminal-Bench mean 上退化，说明迁移有边界。(3) 需要足够强的 evolver
    模型（Haiku 4.5 无增益），这是能力门槛而非权重更新证据。(4) 判定基于摘要与给出的正文；未逐条核对附录中 skill 全文与代码，但对本判定（对象=技能文件、反馈驱动、持久复用）不构成实质影响。
  remaining_evidence_needed_zh: 无关键待查项；如需进一步确认，可核对附录 G.1/G.2 中 seed 与 meta-evolved SKILL.md 全文，验证被持久化的确为可复用的战役控制策略文件，并确认
    worker 层编辑不被误当作主要持久对象。
