- id: arxiv:2610.05533
  title: What Does a Harness Repair? A Preregistered Study of Visibility, Baseline Adequacy and Evaluation Defects
  canonical_source_hash: 9dfe6a50426d57fd73b1e4691c2de603c59c684722c45938762842f37c76c264
  direction_override:
    primary: evaluation_benchmark
    harness_sub: null
    secondary:
    - harness
  summary_zh: 预注册评测脚手架搜索收益的来源，区分基线不足、答案可读性和评估缺陷。
  summary_en: Preregistered evaluation separates harness-search gains arising from baseline inadequacy, answer readability,
    and evaluation defects.
  scope_reason_zh: 该论文是专门评估 harness 搜索/演化的研究：研究对象是冻结模型外部的提示词、token 预算、解析器等可复用 harness 工件，GEPA 依据搜索分区分数反馈选择 harness，选中的
    harness 被记录并在 replication/test 上评估。模型权重明确冻结，权重更新不是干预对象。它不属于 harness_method，因为作者没有把自身执行程序作为主要改进对象，也没有递归循环；但作为评估
    harness 增益来源、基线充分性和评估缺陷的专门研究，符合 harness_evaluation。
  caveat_zh: 证据边界：仅研究一轮选择、无递归循环；GEPA 只搜索提示词文本且每项研究四次运行；覆盖模型和注入缺陷有限；评估器本身固定，不能证明长期递归自改进或跨任务保留的通用 harness 演化。
  remaining_evidence_needed_zh: ''
