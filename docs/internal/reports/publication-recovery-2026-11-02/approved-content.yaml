- id: arxiv:2610.42141
  title: 'RoboArchitect: Automating the Design of Robotic Agents with Persistent Memory'
  canonical_source_hash: 5574e8ff63eb8864dca862c609ea9a6753530c0504c9d86a497ec1c1dcddc7db
  direction_override:
    primary: harness
    harness_sub: evolve_main
