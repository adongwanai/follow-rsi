- abstract: 'Robots can use historical observations to answer spatiotemporal queries in familiar environments, but
    the presence of relevant evidence does not imply that existing tools support the operations a task requires.
    We introduce ReSight, a task-driven self-improving memory system for embodied agents that expands the capabilities
    for processing and accessing historical observations as task demands arise. ReSight retains keyframes and their
    spatiotemporal associations, separating observation evidence from extensible derived fields so that stored observations
    can be reprocessed for new needs. An execution agent and a coding agent share this memory through different
    interfaces: the former calls registered tools within a bounded online budget, while the latter uses a programmable
    workspace and a larger exploration budget to inspect evidence, write programs, and acquire models as needed.
    To realize capability expansion in ReSight, we develop Explore-Distill-Mount (EDM), which identifies capability
    gaps from execution and exploration records without task reference answers and converts exploration-derived
    solutions into reusable memory builders, query tools, and skills, extending memory representations and access
    capabilities as needed. Experiments on three public benchmarks demonstrate effective base memory access and
    capability expansion. With the execution model and online budget held fixed within each benchmark, EDM reduces
    mean position error on OC-NaVQA from 33.10 m to 24.72 m and improves high-level success on FindingDory from
    38.3% to 63.8%. With the tools and skill frozen, success still improves by 28.3 percentage points on FindingDory
    episodes excluded from exploration and distillation. Experiments on real robot patrol memories further demonstrate
    reuse of these capabilities for subsequent queries and new memories, with fewer online tool calls on average.'
