- abstract: Discussions of complexity, knowledge and intelligence often overlook the work involved. For example,
    outputs generated by short programs have low algorithmic complexity but can have high computational depth, the
    least work needed to produce them from near-shortest programs. Producing them with less work can require longer
    descriptions, giving high work-bounded complexity. We introduce a formalism that compares achievements under
    work and information limits and describes how learning and persistence can make deep achievements shallow by
    reusing products of earlier work. For an agent with a limited work budget, the value of building and maintaining
    such resources depends on how they support its goals over later tasks. We define grasp as performance across
    work budgets at a fixed information allowance. Low grasp can still yield success through grind at high cost
    in work, without necessarily improving human grasp. Applied to improvement itself, grasp gives a criterion for
    recursive self-improvement in which successors make comparable further improvements more efficiently. Another
    route to faster progress is to expand the resources brought to bear through knowledge sharing and coordination
    across society, even while comparable advances require increasing work. Grasp also applies to collectives, which
    may outperform their members yet require more total work than one system with their combined resources. Establishing
    and sustaining organisation can itself be deep even when the primary task is simple. These demands may help
    explain the richness of biological and social systems. In agent collectives, this organisational work can generate
    goals beyond assigned tasks, including maintaining the collective itself. We therefore caution against allowing
    an emergent agent society to assume authority over social coordination, since it could increasingly direct work
    towards its own persistence and goals.
