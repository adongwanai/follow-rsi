- id: arxiv:2610.24453
  title: 'Hippo: Training-Free Agent Self-Evolution via Hippocampal Replay'
  announced: '2026-10-17'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: experience_world_model
  decision: reject
  arxiv_id: '2610.24453'
  version: 1
  source_hash: 10cb1d118ab14033ab269d7f30d60d71b88ff173c481c8782d41ad47eb1ed9ef
  published: '2026-10-17T04:43:26Z'
  updated: '2026-10-17T04:43:26Z'
  hf_daily_dates: []
  abstract: 'Motivated by recursive self-improvement (RSI), we study how LLM agents can learn through external memory
    without updating model parameters. Extracting useful experience from a single attempt is difficult: flawed reasoning
    can produce success, while poor execution can obscure a sound strategy. Preserving its value over time is also
    difficult: our accumulation baseline without consolidation initially improves but eventually performs below
    a no-memory baseline. Our key idea is to compare attempts at the same task to identify reusable decisions and
    refine when they apply. We introduce Hippo, a memory framework inspired by selective hippocampal encoding and
    replay that learns from these comparisons when shortcomings are diagnosed. It compares the resulting experience
    with existing memory to merge overlaps and resolve conflicts through explicit applicability conditions. This
    allows prior guidance to be revised without storing every lesson as a separate entry. Experiments on SWE-bench
    Verified, WebArena, and Mind2Web show performance gains in all three settings and substantially fewer retained
    experiences than the accumulation baseline. The gains extend across the evaluated base models of varying capabilities,
    indicating that memory-based adaptation remains useful even for highly capable models.'
