      Meta-Skill。这里跨任务保留的是改进器决策规则，不能描述成部署时持续积累全局 Harness 补丁。
    summary_en: Meta² compares training trajectories and verifier feedback offline to iteratively revise Meta-Skill
      rules for when and how to intervene. At deployment, these improver rules are frozen and reused to guide harness
      edits on new tasks. Each online edit affects only its active run and is discarded afterward, without being
      written back to the Meta-Skill. The inherited artifact is improver decision guidance, rather than a growing
      collection of global deployment patches.
