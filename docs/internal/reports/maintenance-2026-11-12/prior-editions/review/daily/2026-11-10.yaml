- id: arxiv:2611.04439
  title: 'DualEvolve: Dual-Level Self-Evolution of Mechanism and Orchestration for Recommendation'
  announced: ''
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.04439'
  version: 1
  source_hash: dc7a2cd43bb4838ffe2fdf07694ce852ade5b397d4d4c2d2a133fbebad262209
  published: '2026-11-03T07:32:10Z'
  updated: '2026-11-03T07:32:10Z'
  hf_daily_dates: []
  abstract: Recommender systems are widely used in e-commerce and content platforms, where improvement requires
    repeated model design, training optimization, and experimental validation. Large language model (LLM) agents
    increasingly automate this development cycle. Sustained autonomous improvement requires agents to improve both
    recommendation models and their development workflows. However, task-performance-driven approaches select updates
    mainly by candidates'final scores, without a separate optimization signal for experimentation quality. We therefore
    present DualEvolve, a dual-level framework that co-evolves recommendation mechanisms and agent orchestration
    toward recursive self-improvement. Inner evolution revises model and training code using task feedback to improve
    recommendation performance. Outer evolution scores the inner-loop experimental process, updates harness and
    skill rules using these scores and execution traces, and adjusts orchestration choices based on next-round scores
    to improve the quality of subsequent experiments. Experiments on MovieLens-1M and three Amazon Reviews 2023
    subsets cover four recommendation methods and 16 settings. DualEvolve achieves higher test means than Base,
    OpenEvolve, and DeepEvolve in all 64 setting-metric comparisons, with macro-averaged relative gains over DeepEvolve
    of 7.6% (HR@5) and 9.0% (NDCG@5).
