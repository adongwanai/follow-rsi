  updated: '2026-11-02T19:39:06Z'
  hf_daily_dates: []
  abstract: With the rise of Group Agent such as Claude Tag, agents increasingly serve as digital workers for long-term
    team collaboration. These agents operate over shared contexts that continuously accumulate through multi-user
    interactions. However, existing agent memory systems are mainly designed for individual users and struggle to
    capture group-level knowledge in shared contexts, including group relationships and collaboratively formed knowledge.
    Manual memory strategies further limit adaptation to diverse and evolving shared contexts. To this end, we propose
    \textbf{EvoGroup (EvoG)}, a self-evolving harness for group agents that starts from a minimal six-tool cold
    start and adapts through interaction with shared context. EvoG uses confidence and task outcomes to select informative
    trajectories, while also eliciting self-reflections on uncertainty in low-confidence cases. The analysis agent
    then examines selected trajectories through adaptive progressive disclosure, followed by bucketed analysis to
    synthesize high-level findings that guide the evolve agent in revising the Harness. Empirically, pass@1 on held-out
    split of EverMemBench improves from 71.07\% to 89.58\%, surpassing both self-evolving memory and human-designed
    harnesses, including Claude Code (85.83\%). To evaluate generalization, we freeze the evolved harness and evaluate
    it on the unseen GroupMemBench, where, with GPT-5.5, it demonstrates effective generalization and outperforms
    both memory baselines and human-designed harnesses.
