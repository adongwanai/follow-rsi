    summary_en: WAAC retains field-compression policies in a history store after task-success verification and retrieves
      them for compatible later workflows. Only policies actually validated and applied can become successful precedents;
      unverified executions are not treated as successes. The qualifying component is a feedback-selected, reusable
      compression policy. Matching and fusion remain fixed, so this is not evidence of self-rewriting compression
      source code or merely accumulating general experience content.
