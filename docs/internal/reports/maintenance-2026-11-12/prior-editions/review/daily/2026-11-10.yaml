- id: arxiv:2611.03868
  title: 'EvoGroup: A Self-Evolving Harness for Group Agents in Shared Contexts'
  announced: ''
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.03868'
