- id: arxiv:2611.05139
  title: 'Meta$^2$: Precomputing Reusable Knowledge for Online Harness Evolution in Long-Horizon Agents'
  announced: ''
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.05139'
  version: 1
  source_hash: 8fd8e2aecb16096243c921e2f7fd32b85e57bcbf7c20ab66951d7552e653c772
  published: '2026-11-03T16:19:21Z'
  updated: '2026-11-03T16:19:21Z'
  hf_daily_dates: []
  abstract: 'Harness optimization improves long-horizon agents by refining the prompts, tools, memory, and hooks
    around a frozen model. Offline methods can learn from completed trajectories, but deploy one shared harness
    that may overfit training tasks and cannot react to evidence revealed during a new run. Online evolution can
    adapt before, during, or after one run through an evolver, but may have to reason about every intervention from
    scratch or rely on verifier feedback that is usually unavailable at test time. We introduce Meta$^2$, which
    moves offline optimization one level up: rather than optimizing a shared harness, it learns reusable knowledge
    for harness evolution and applies it within each task online. Offline, Meta$^2$ learns a textual Meta-Skill
    $M$ by contrasting training rollouts of the same task agent under three configurations: without an evolver,
    with an evolver guided by the current version of $M$, and with an evolver given privileged verifier information
    available only in training. Contrasts in trajectories and outcomes are aggregated across tasks to refine $M$
    into reusable guidance on when and how to evolve, when to leave the harness unchanged, and which interventions
    to avoid. Online, an evolver combines the frozen $M$ with emerging trajectory evidence to decide whether to
    KEEP the harness unchanged or EVOLVE it through a task-local edit. Each edit applies to the rest of the same
    run without resetting its environment or progress. Thus, evolution guidance transfers across tasks while harness
    edits remain task-local, and held-out verifier feedback is never available to the evolver. On two long-horizon
    benchmarks, Terminal-Bench 2.1 and DeepSWE 1.1, Meta$^2$ achieves the highest performance among evaluated methods
    with GPT-5.6-Terra, reaching 81.00% and 44.44%, respectively. Ablations support the value of contrastive evolution
    guidance and keeping online harness edits task-local.'
