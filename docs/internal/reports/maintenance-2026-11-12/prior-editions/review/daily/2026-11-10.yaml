- id: arxiv:2611.09892
  title: On Agentic Manipulation Policies
  announced: '2026-11-06'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.09892'
  version: 1
  source_hash: 87279eabfbd8b4cf1273447abe309b68f1902330d90b4016561eb4a504c74d3e
  published: '2026-11-06T18:59:34Z'
  updated: '2026-11-06T18:59:34Z'
  hf_daily_dates: []
  abstract: 'Recent work on robot manipulation has focused on specialist policies trained on demonstrations. We
    show that generalist AI models can control manipulators more reliably than specialist policies such as vision-language-action
    models (VLAs) and world-action models (WAMs). We systematically analyze agentic manipulation policies (AMPs),
    in which a generalist AI model commands the manipulator directly, adapting its actions as the task unfolds.
    We present AMP1, a reference harness that runs unchanged across single-arm, bimanual, and mobile manipulation.
    AMP1 achieves state-of-the-art results on the RoboLab-120 and CaP-Gym benchmarks, with no demonstrations or
    task-specific training. On RoboLab-120, AMP1 reaches an 85.6\% success rate zero-shot, compared to 49.2\% and
    42.9\% for leading VLA and WAM policies. The agent succeeds zero-shot in 104 of 108 real-world trials spanning
    twelve tasks and three robot instances, reducing failure rates by 20x and 15x relative to strong VLA and WAM
    baselines. The basic harness supplies no grasping, pushing, or placing skills; the agent develops its own strategies,
    such as searching for hidden objects, using objects as tools, and calibrating its cameras. With the addition
    of a persistent memory store, the agent can also learn from experience: an augmented harness with a memory representation
    that is carried across episodes lowers the failure rate on RoboDojo bimanual manipulation tasks by 4.6x relative
