  source_hash: a98bad66d1a3aa9ca5c0154e5851deabb6b744881976575136e8783473cb58a8
  published: '2026-11-06T01:47:55Z'
  updated: '2026-11-06T01:47:55Z'
  hf_daily_dates: []
  abstract: As long-horizon agents increasingly rely on multi-step tool interactions to accomplish complex tasks,
    their execution trajectories continuously accumulate structured outputs and intermediate artifacts, leading
    to growing context overhead. Existing compression methods primarily rely on text importance or fixed truncation
    rules, often overlooking cross-step dependencies within workflows and potentially discarding critical information
    required for subsequent task execution. To address this challenge, we propose WAAC, a workflow-aware framework
    for agent trajectory compression. WAAC structurally models successful historical trajectories to extract reusable
    workflow compression experience and incorporates online backward dependency analysis to dynamically identify
    information retention requirements. By combining current dependency constraints with historical experience,
    WAAC selects appropriate compression strategies for different types of historical information. Experiments on
    PinchBench and Odysseys demonstrate that WAAC achieves an overall score of 87.6 and a perfect completion rate
    of 19.0%, respectively, while reducing execution costs by 19.7% and 29.1% compared with the strongest baseline
    methods. These results demonstrate the effectiveness of workflow-aware trajectory compression in improving task
    performance and cost efficiency for long-horizon agents. Code and resources are available at https://anonymous.4open.science/r/waac-6527/.
