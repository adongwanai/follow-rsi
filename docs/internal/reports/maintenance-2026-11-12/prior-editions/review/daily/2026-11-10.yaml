- id: arxiv:2611.08763
  title: 'CrowdDirector: Runtime Orchestration of Crowd Simulation through Natural-Language Directives'
  announced: '2026-11-05'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.08763'
  version: 1
  source_hash: 37f3636ae877811eaae3fcc252eb775ed8bbe6594541086dc5673dac92579ed1
  published: '2026-11-05T22:18:10Z'
  updated: '2026-11-05T22:18:10Z'
  hf_daily_dates: []
  abstract: Natural language offers an intuitive way to direct a virtual crowd while a simulation is running. Handwritten
    rules execute efficiently but cannot respond flexibly to varied instructions, whereas asking a large language
    model (LLM) to control the crowd at every update introduces repeated latency, cost, and the risk of unsupported
    actions. We present CrowdDirector, a framework that uses an LLM only when the user adds or changes an instruction.
    The LLM translates the request into a structured instruction, and a scene validator checks whether the entities
    and actions it references exist in the current Unity scene. Accepted instructions are stored and remain continuously
    active as the simulation is running. At each simulation tick, a graph neural network uses the current scene
    state and active instruction to choose an available action and target for each agent, while Unity handles movement,
    interactions, and animation. The network is trained offline on simulated scenarios, with LLM guidance on how
    agents should respond to instructions. Our evaluations show the scene validator's feasibility decisions matched
    human judgements more often than the LLM's own assessment, and on a behavioural benchmark CrowdDirector follows
    user instructions more closely than handwritten rules while avoiding repeated LLM calls. It therefore provides
    a practical middle ground between fixed rules and continuous LLM control.
