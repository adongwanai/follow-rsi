- id: arxiv:2611.09472
  title: 'ENGRAM: From Agent Experience to Weights through Verified Consolidation'
  announced: '2026-11-06'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.09472'
  version: 1
  source_hash: 81462978f1c9a8b4edcb2cb5a544b0f4c31f2f5b310fc8970ece5a1f7881cd4f
  published: '2026-11-06T13:51:02Z'
  updated: '2026-11-06T13:51:02Z'
  hf_daily_dates: []
  abstract: Language-model agents use experience through external retrieval and parameter learning. Consolidating
    stored experience into model weights requires deciding both which experience to train on and when its external
    records can leave retrieval. Admission based solely on student mastery can exclude useful teacher demonstrations,
    while removal immediately after training can discard guidance that the model still needs. We introduce ENGRAM,
    a framework that separates training admission from memory release. A demonstration-aware gate admits skills
    based on student mastery or sufficient successful teacher demonstrations. The student learns from selected action
    traces with context from an Engram Trace Graph (ETG). A verification gate then compares the updated model without
    episodic retrieval against the base model with retrieval on reserved probes. Release requires valid training
    participation and scores meeting both relative and absolute criteria; records for skills that fail verification
    remain retrievable. Experiments across interactive and reasoning benchmarks show consistent gains over frozen-weight
    ETG controls, with ablations supporting demonstration-aware admission and selective adapter activation. A controlled
    held-out comparison shows that verified release substantially reduces the retrievable footprint while remaining
    close to retain-all performance and outperforming immediate and budget-matched random release. ENGRAM also improves
    task performance while reducing input-token usage and model calls. Skill-level verification further reduces
    retrievable experience through selective archival, retaining external guidance for skills that do not meet the
    release criteria. Code is available in anonymous.4open.science/r/engram-anonymous.
