- id: arxiv:2611.08946
  title: 'Flex-RSI: Benchmarking Recursive Self-Improvement of Frontier Agents'
  announced: '2026-11-06'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
