      Harness 再在不相交测试集评估；对齐候选尝试次数不等于对齐全部 token、费用或算力。
    summary_en: HarnessFlow uses MCTS to allocate search across refinement paths of executable harnesses. A coding
      agent uses a parent design, validation feedback, and execution records to revise context construction, state
      management, tool use, and stopping rules; candidates and scores persist in the search tree. The harness selected
      on validation is evaluated on a disjoint test set. Matching candidate-attempt counts does not establish matching
      total tokens, dollar cost, or compute.
