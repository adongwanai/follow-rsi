- id: arxiv:2611.06254
  title: 'HarnessFlow: MCTS-Guided Harness Optimization for LLM Agents'
  announced: ''
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.06254'
  version: 1
  source_hash: 86b0ac3bdc5f22a24ff8c933603f6a4d13e5055487f0d1efc469b5a86f7b8755
  published: '2026-11-04T10:05:15Z'
  updated: '2026-11-04T10:05:15Z'
  hf_daily_dates: []
  abstract: The performance of large language model (LLM) agents depends on both the underlying model and the harness
    that governs interaction with tools and the environment. Yet harness design remains largely manual, and automating
    it requires navigating an open-ended search space through costly end-to-end evaluations. We introduce HarnessFlow,
    a framework for optimizing complete executable harnesses under a limited candidate-evaluation budget, with the
    model and task environment held fixed. HarnessFlow organizes candidates and their evaluation histories in a
    refinement tree, using a Monte Carlo Tree Search (MCTS)-based policy to balance exploitation and exploration.
    A coding agent refines selected harnesses using archived code, execution feedback, and a library of reusable
    harness mechanisms. With 15 refinement attempts per benchmark, HarnessFlow achieves the highest mean test scores
    among the compared methods on six benchmarks spanning agentic tasks, coding, and web interaction. The optimized
    harnesses achieve an average score of 69.48%, outperforming the initial harnesses and Meta-Harness by 10.89
    and 3.95 percentage points, respectively, while incurring lower average per-task execution costs than hand-engineered
    baselines. These results suggest that structured harness search offers a promising route toward automating the
    design of capable and efficient LLM agents.
