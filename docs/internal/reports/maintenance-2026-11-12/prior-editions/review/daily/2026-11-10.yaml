  published: '2026-11-06T13:26:43Z'
  updated: '2026-11-06T13:26:43Z'
  hf_daily_dates: []
  abstract: 'Agent skills are short documents that teach a language model how to handle a class of tasks. To save
    context, these documents are increasingly compiled into low-rank adapters (LoRA), which keep the behaviour but
    lose the text: an adapter is hard to read, edit, audit or move to another model. We ask whether the skill document
    can be written back from the adapter and its frozen base model, and we score each recovered document by the
    share of the original''s key instructions it states and by the tasks it solves. Reading the weights alone recovered
    little with the methods we tried; a learned map from weights to text passed on about one bit of the document.
    Running the adapter worked much better. The Executing Writer, a small writer trained on top of the adapted model,
    recovers 39-44% of the key instructions of held-out skills, against 1.3-1.5% with another skill''s adapter,
    and on adapters fitted to 41 external skills its documents restore 85-91% of the original''s task gain. These
    strongest results are on adapters whose training stored the document; adapters trained on behaviour alone are
    much harder for trained writers (1-2% of instructions). For these adapters we test an agent that runs the base
    and adapted models and writes a skill from where they differ. On ALFWorld its skills recover 58-71% of a LoRA''s
    gain and carry over to models that cannot load the LoRA, lifting Llama-3.1-8B from 5% to 55%. Whether such a
    skill comes from the adapter depends on what the adapter learned: when its behaviour cannot be guessed, the
    adapter is the source; when it can, a reward loop without the adapter does as well.'
