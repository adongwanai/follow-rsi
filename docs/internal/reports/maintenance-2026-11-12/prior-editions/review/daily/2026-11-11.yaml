- id: arxiv:2611.10542
  title: 'When Experience Becomes a Backdoor: Poisoning Self-Evolving LLM Agents via Failure-Aware Task Optimization'
  announced: '2026-11-07'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.10542'
