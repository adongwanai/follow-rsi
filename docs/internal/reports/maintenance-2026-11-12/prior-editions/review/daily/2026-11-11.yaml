- id: arxiv:2611.08240
  title: 'FewStepRL: Fine-tuning Few-step Diffusion Models with Reinforcement Learning'
  announced: '2026-11-05'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.08240'
  version: 1
  source_hash: b90ec3794bf4748af649e6eae262d2bc154b99cd8c7476a370f583f2439fa8e9
  published: '2026-11-05T16:19:52Z'
  updated: '2026-11-05T16:19:52Z'
  hf_daily_dates:
  - '2026-11-10'
  abstract: Reinforcement learning (RL) has become a standard post-training method for diffusion models, but most
    RL objectives roll out the current policy at every iteration, and with a many-step sampler these rollouts typically
    dominate the cost of training. Few-step models cut this cost, yet they model an average velocity over an interval,
    whereas existing RL objectives are built for an instantaneous velocity with a many-step sampler. We adapt RL
    objectives to few-step models systematically in three phases, namely a transformation, a decomposition and an
    adaptation. The transformation to $x$-space expresses each objective we consider through a common policy prediction,
    at the clean end by default and at an explicitly marked level for transition or flow-map objectives, so that
    objectives stated over densities, velocities or rewards become comparable. The decomposition writes the gradient
    of each of these objectives as the sum of a self-regression toward a reference and a reward augmentation, so
    that a method reduces, at the gradient level, to a choice of anchors and weights. The adaptation computes each
    anchor from a few-step model at the end of its transport or along its tangent, with the instantaneous velocity
    recovered from the network itself or from an auxiliary network. This yields few-step versions of FlowGRPO, AWM,
    DiffusionNFT, DiffusionOPSD and ReFL in one modular codebase. In our experiments, reward-gradient-based methods
    are the most effective when the reward is differentiable and its gradient is affordable; otherwise DiffusionNFT-style
    methods generally reach high rewards in relatively few iterations despite a sometimes higher per-iteration cost.
    Extra inference steps show no systematic aggregate benefit in our experiments, although selected outputs visibly
    improve with two to four times as many sampling steps as in training.
