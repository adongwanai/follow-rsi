- id: arxiv:2611.12041
  title: 'SMO: Compiling Natural Language Skills into Graphs of Reusable State-Move-Outcome Bricks'
  announced: '2026-11-09'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12041'
  version: 1
  source_hash: 65a8e1bac10909ba1320c0a4d93f799e10087d6e3f4a521abe26800e77c5b61c
  published: '2026-11-09T08:19:04Z'
  updated: '2026-11-09T08:19:04Z'
  hf_daily_dates: []
  abstract: 'Large language model agents increasingly rely on reusable natural-language skills, yet growing skill
    collections remain accumulations of isolated text artifacts that are difficult to compare, deduplicate, and
    compose. We argue that the reusable content of a skill lies not in its surface wording but in its procedural
    transitions: which operation to execute under a given state and which observable outcome to produce. Based on
    this observation, we propose State-Move-Outcome (SMO), a compilation-like framework that decomposes raw skills
    into reusable procedural bricks and organizes admitted bricks as an externalized symbolic structure. When compiling
    a skill, SMO first retrieves and composes existing bricks, dynamically connects them through Outcome-to-State
    conditions, and creates a candidate brick only for an uncovered procedure; the candidate becomes reusable only
    after validation and admission. Experiments on SkillsBench v1.1 demonstrate that SMO represents 232 rawSkills
    from 87 underlying tasks with 95 shared bricks, reducing the corresponding skill representations from 366,472
    to 149,154 tokens--a $\mathbf{59.3}\times$ reduction and $\mathbf{2.46}\times$ compression. Across 232 skill-conditioned
    evaluation instances, SMO raises the average task score from $\mathbf{0.6379}$ to $\mathbf{0.7478}$ and increases
    5/5 Pass instances from $\mathbf{138}$ to $\mathbf{164}$, while matching or outperforming rawSkill on $\mathbf{208}$
    of $\mathbf{232}$ instances. It also reduces average runtime token consumption by $\mathbf{38.38\%}$. These
    results show that compiling natural-language skills into shared procedural units can jointly improve skill reuse,
    representation efficiency, and downstream execution.'
