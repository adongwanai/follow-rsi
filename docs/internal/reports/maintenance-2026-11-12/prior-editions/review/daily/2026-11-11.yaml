- id: arxiv:2610.36980
  title: 'AutoVend: Benchmarking LLM Agents on Long-Horizon Autonomous Vending Operations'
  announced: '2026-10-27'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
