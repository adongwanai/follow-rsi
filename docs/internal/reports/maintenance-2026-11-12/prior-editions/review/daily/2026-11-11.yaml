- id: arxiv:2611.12552
  title: 'SciMARS: Multi-Agent Recursive Self-Improvement for Closed-Loop Scientific Discovery'
  announced: '2026-11-09'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.12552'
  version: 1
  source_hash: 5198bd9551bd2245989c8f87b54984dfee54bfa55d00fe1dd0c4d2c226d2ddf4
  published: '2026-11-09T15:20:32Z'
  updated: '2026-11-09T15:20:32Z'
  hf_daily_dates: []
  abstract: 'We propose SciMARS, a framework for recursive task-local adaptation of multi-agent harnesses in closed-loop
    scientific discovery. Multi-agent systems coordinate analysis, experimental design, and verification as scientific
    evidence evolves. However, two problems limit their effectiveness: (i) without shared memory, agents lose observations
    and repeat work; (ii) fixed role procedures, handoffs, and memory policies perpetuate mistakes despite retained
    evidence. We address these problems with a shared evidence graph and separate component editors. SciMARS adapts
    roles and coordination; SciMARS + Memory adds a third editor for how agents record, retrieve, and receive evidence.
    Candidate probes guide composition and selection of the next harness. We evaluate scientific discovery through
    experimental-data replay and a digital twin. SciMARS + Memory resolves 12/18 GPT-6-Astra and 2/18 GLM-5.3 attempts
    on Autonomous Science Bench, compared with 8/18 and 1/18 for the base multi-agent team. On ScienceAgentBench
    and AppWorld, it solves 14/38 and 11/20 tasks, compared with 11/38 and 5/20 for the base team. These results
    support combining shared memory with harness adaptation across scientific and interactive tasks.'
