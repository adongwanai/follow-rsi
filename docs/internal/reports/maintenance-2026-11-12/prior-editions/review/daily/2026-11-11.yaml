- id: arxiv:2611.12063
  title: Toward Verifiable Auto-Research for Data Systems
  announced: '2026-11-09'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12063'
  version: 1
  source_hash: b4df29060332c507731447116db8cce2e2f3b551b07951210a997ad5113cf41b
  published: '2026-11-09T08:39:16Z'
  updated: '2026-11-09T08:39:16Z'
  hf_daily_dates: []
  abstract: AI auto-research is poised to forge bespoke data systems, from key-value stores and indexes to query
    engines, each engineered for a specific workload and hardware platform. Yet this promise rests on fragile ground.
    An agent optimizes what it can measure, not necessarily what users need. Natural-language requirements leave
    ample room for specification gaming, producing systems that blaze through benchmarks while silently losing updates
    or violating consistency. Worse, each research iteration consumes tokens, while validating a candidate under
    real concurrency, memory pressure, and failure conditions can stretch the entire research process into weeks.
    In this paper, we envision a more cost-efficient and verifiable approach to auto-research. Precise and composable
    specifications anchor the search, lightweight performance critics prune costly dead ends, and falsification
    and deductive verification make correctness an integral part of the process rather than an afterthought. By
    treating correctness, performance, research time, and token cost as equally important objectives, we aim to
    transform AI-generated data systems from plausible artifacts into trustworthy, production-grade systems whose
    behavior can be understood, audited, and ultimately relied upon.
