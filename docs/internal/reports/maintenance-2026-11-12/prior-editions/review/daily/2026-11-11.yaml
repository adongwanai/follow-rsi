  abstract: Reinforcement-learning-trained agents for retrieval-augmented generation retrieve content (passages,
    knowledge-graph fragments, or hyperedges) and supervise training with outcome rewards on the final answer. Across
    these paradigms the reasoning route through retrieved content never leaves the language model's hidden state,
    conflating declarative knowledge with the procedural knowledge that recurs across queries of the same logical
    type; content-only methods consequently plateau as reasoning depth grows. We introduce PatternBloom, an agentic
    RAG framework that shifts the unit of retrieval from content (what to read) to logic (how to reason). A first
    RL stage scores the agent's constructed evidence graph by a frozen oracle's information gain through the Information-Density
    Reward (IDR), a size-normalized mutual-information surrogate. High-reward trajectories are distilled into a
    Graph Pattern Memory (GPM) of type-abstracted reasoning skeletons, and a second RL stage uses the Pattern-Augmented
    Reward (PAR) to couple policy to memory, turning procedural reasoning into a learnable, externalized structural
    prior. A 7B PatternBloom outperforms $27$ baselines by $+15.0$ Avg-OOD EM, with the gain compounding with reasoning
    depth precisely because procedural knowledge, once distilled, is reused rather than re-derived at every query.
    We release our code at https://github.com/EllenYiGe/PatternBloom.
