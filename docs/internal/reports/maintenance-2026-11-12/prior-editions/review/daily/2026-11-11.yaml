- id: arxiv:2611.08452
  title: 'ReproBridge: Building Reproducibility into ML Research Artifacts'
  announced: '2026-11-05'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.08452'
  version: 1
  source_hash: 8e75ffca685503e2908e983f6f0f92f0dba068fdad0f57839882544867efca50
  published: '2026-11-05T18:45:36Z'
  updated: '2026-11-05T18:45:36Z'
  hf_daily_dates:
  - '2026-11-10'
  abstract: Reproducing machine learning experiments requires reconstructing procedures from information scattered
    across papers, released code, and supporting artifacts. For coding agents, reproduction success can therefore
    depend on their ability to fill in missing details, rather than on the released artifacts alone. We ask whether
    preserving recovered procedures and decisions improves subsequent independent reproduction. We define a standardized
    artifact design comprising a refined codebase, environment setup, experiment launchers, and a reproduction guide,
    and introduce ReproBridge, an agent workflow for constructing these refined reproducible artifacts. ReproBridge-Bench
    provides 1,029 tasks from 387 experiments across 36 papers, anchored by five human-verified reference scores
    per task. Agents attempt tasks in fresh sessions with raw code or refined artifacts; a separate Auditor checks
    execution evidence. Across four evaluated models, refined artifacts raise mean reproduction success from 76.4%
    to 92.6% and reduce downstream API spending by 19.7% on average. The cross-model success-rate spread narrows
    from 21.6 to 3.9 percentage points, with all four models achieving mean success rates above 90%. Removing any
    component reduces success in the ablation study, with the largest losses from code and environment removal.
    These results suggest that preserving execution knowledge helps even models with lower raw-code success reproduce
    experiments more reliably and at lower API cost.
