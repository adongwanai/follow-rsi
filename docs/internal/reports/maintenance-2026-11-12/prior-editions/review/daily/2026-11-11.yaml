- id: arxiv:2611.12120
  title: 'SCALE: Small-Model-First Concept Abstraction with LLM-Guided Experience Internalization'
  announced: '2026-11-09'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12120'
  version: 1
  source_hash: 25ea565753c7a8f1a3218e79abf9f7195a3d940be22487bce44a5c9c79677984
  published: '2026-11-09T09:33:19Z'
  updated: '2026-11-09T09:33:19Z'
  hf_daily_dates: []
  abstract: Autonomous agents must continually acquire reusable knowledge from experience without relying on costly
    large language model (LLM) reasoning for every decision. However, existing experience-based approaches often
    struggle to transform accumulated observations and reasoning into compact knowledge that lightweight models
    can independently apply. This paper proposes SCALE, a small-model-first framework that integrates selective
    LLM reasoning, experience-driven concept abstraction, and knowledge internalization. A lightweight model handles
    routine predictions, while prediction errors and accumulated cross-episode evidence selectively trigger LLM
    reflection. The LLM analyzes relevant historical experiences, generates positive and negative counterfactual
    examples, and proposes reusable concept hypotheses. Independently validated concepts are progressively incorporated
    into hierarchical neural representations, enabling lightweight models to exploit increasingly abstract knowledge.
    Meanwhile, mastered experiences are excluded from active memory while their original records remain available
    in a complete archive. Experiments across ten random seeds show that historical recall improves held-out accuracy
    from 87.11% to 98.28%, hierarchical concept knowledge increases difficult-case accuracy from 55.33% to 66.47%,
    and abstract archiving reduces active experience records from 6,000 to 1,528.
