    summary_en: SkillCache compiles a completed invocation trace into a parameterized capsule of programs and natural-language
      steps. A host replays candidates in a sandbox, returns failure diagnostics to the compiler agent for repair,
      and retains qualified capsules for later requests while keeping the source skill for recovery. This execution-feedback
      repair loop qualifies as component evolution; continued learning from warm executions remains future work.
      Replay uses the original request conditions, so it does not guarantee arbitrary new requests, and savings
      depend on compilation cost and reuse frequency.
