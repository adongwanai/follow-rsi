    summary_en: SciMARS uses execution traces and public probes to revise team role procedures, handoff contracts,
      and, in its memory extension, evidence-recording and retrieval policies before composing and selecting a successor
      harness. Retained edits govern later improvement rounds of the same task; new evaluation tasks reset adaptation,
      so this is not cross-task accumulation. The optimizer itself stays fixed. Scientific discovery is evaluated
      through experimental-data replay and a digital twin, rather than new physical wet-lab experiments.
