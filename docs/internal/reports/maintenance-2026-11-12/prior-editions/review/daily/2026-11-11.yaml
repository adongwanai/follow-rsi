  - '2026-11-10'
  abstract: 'Visual generative models increasingly blur the line between synthesizing observations and simulating
    environments. Yet visual plausibility alone does not constitute successful world modeling: compelling outputs
    may lack persistent state, physical dynamics, or causally consistent responses to interactions. We define a
    generative world model as a predictive dynamical system that maintains a persistent, history-conditioned representation
    of an environment, updates that representation in response to actions or interventions, and generates temporally
    coherent trajectories that reflect outcomes under observed and counterfactual interventions. From this definition,
    we derive an intelligence-oriented framework spanning perceptual grounding, persistent state modeling, controllable
    transformation, dynamics-aware prediction, and closed-loop interaction. We present WorldFoundry, open-source
    infrastructure for reproducible inference and evaluation across video, 3D and 4D, embodied action, and interactive
    world systems. WorldFoundry unifies model and benchmark discovery, runtime and asset preparation, execution
    orchestration, artifact management, and interactive visualization, while modality-specific adapters preserve
    native inputs, execution semantics, output representations, and evaluation protocols. Explicit manifests, durable
    artifact contracts, and evidence-aware scorecards separate execution readiness from evaluative claims, making
    each claim traceable to its supporting artifacts. The catalog contains 270 model entries, 74 benchmarks, and
    62 registered metric entries, with readiness and execution evidence recorded separately. WorldFoundry enables
    reproducible comparison of persistent, controllable dynamics across heterogeneous systems, advancing the field
    from perceptual synthesis toward measurable world intelligence.'
