- id: arxiv:2611.09124
  title: Toward the Era of Agentic Embodied Intelligence
  announced: '2026-11-06'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.09124'
