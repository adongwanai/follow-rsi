- id: arxiv:2611.10987
  title: Horizon-Scalable Q-Learning
  announced: '2026-11-07'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.10987'
  version: 1
  source_hash: 3472bcf00a40dabd3b9541d753f1e62efdc6e018f6ba79ba7b1952cfdca3e6a2
  published: '2026-11-07T22:03:33Z'
  updated: '2026-11-07T22:03:33Z'
  hf_daily_dates:
  - '2026-11-10'
  abstract: Learning accurate off-policy state-action value functions (Q-functions) from offline datasets becomes
    harder as the task horizon grows. One-step temporal-difference (TD) learning bootstraps after every transition,
    so small per-step errors accumulate along the horizon, and early states can be badly misvalued even when the
    TD loss is small. Multi-step TD shortens this chain by following the dataset trajectory for several steps; however,
    since the behavior policy is often suboptimal, every followed action adds a bias, and no fixed number of steps
    suits a whole trajectory. In this paper, we propose Horizon-Scalable Q-Learning (HQL), a simple method that
    enables accurate long-horizon value learning by automatically balancing between one-step and multi-step returns.
    HQL extends a target through a dataset action only when the critic values it at least as highly as the best-of-N
    actions sampled from the BC policy, and otherwise falls back to a one-step target. We show that this rule is
    a principled off-policy correction that needs no action densities, which makes HQL compatible with expressive
    flow and diffusion policies. Experiments show that HQL avoids the failures of both one-step and multi-step TD
    on a combination-lock task across horizons, and outperforms prior horizon-reduction methods on long-horizon
    OGBench and OCBench tasks.
