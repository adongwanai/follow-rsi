- id: arxiv:2611.11499
  title: 'JoMoHa: Joint Model--Harness Optimization with Reinforcement Learning'
  announced: '2026-11-08'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.11499'
  version: 1
  source_hash: 289417b6bff8d1d27b347f6fe729821aed76b1a6a14fd70195585cb6f76b358c
  published: '2026-11-08T16:58:39Z'
  updated: '2026-11-08T16:58:39Z'
  hf_daily_dates: []
  abstract: The performance of language agents depends jointly on model weights and the harness. Optimizing either
    alone can be constrained by the other component, limiting overall performance gains. Our analysis of naive alternating
    training reveals progressive incompatibility between the model and harness, which increasingly interferes with
    task execution and may also undermine model training, leading to performance degradation. To coordinate the
    evolution of models and harnesses, we introduce JoMoHa, to our knowledge the first framework to jointly train
    an executable harness generation policy and a task execution policy through reinforcement learning. JoMoHa outperforms
    the evaluated weight-only and harness-only baselines and achieves the highest success rates among the evaluated
    methods on ALFWorld, WebShop, and DBBench, averaging 70.3% and reaching 97.0% on ALFWorld. By learning both
    task execution and runtime improvement from its own generated trajectories, JoMoHa performs recursive self-improvement
    (RSI).
