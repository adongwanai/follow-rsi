routes:
- name_zh: 打基础
  name_en: Foundations
  papers:
  - adas
  - dgm
  - meta-harness
  - hyperagents
  question_zh: 「搜索 Agent 设计」与「自改代码」两条源头各自是什么？
  question_en: What are the two origins of searching agent designs and modifying one’s own code?
  why:
    adas:
      zh: 理解搜索 Agent 设计的起点。
      en: Understand the starting point of agent-design search.
    dgm:
      zh: 理解自改代码如何作为后续任务的版本保留。
      en: See how edited agent code is retained for later tasks.
    meta-harness:
      zh: 连接早期设计搜索与现代 Harness 优化。
      en: Connect early design search with harness optimization.
    hyperagents:
      zh: 理解改进器自身也能被修改的元层。
      en: Understand a meta level that can edit the improver itself.
- name_zh: 方法主线
  name_en: Mainline methods
  papers:
  - ahe
  - self-harness
  - darwinx
  - modularrsi
  - rrsi
  question_zh: 最常见的对比基线各自解决了什么？
  question_en: What does each of the most common comparison baselines address?
- name_zh: 工程闭环与长程可靠性
  name_en: Engineering loop & long-horizon reliability
  papers:
  - autosaddler
  - modularrsi
  - riseharness
  question_zh: 怎样从失败轨迹定位到代码、控制修改范围、验证跨任务收益？
  question_en: How can failures be traced to code, edits kept in scope, and gains across tasks verified?
- name_zh: 改进器自身进化
  name_en: Evolving the improver
  papers:
  - hsi
  - meta-n
  - aide2
  - milo
  - harness2
  - rsiflow
  question_zh: 搜索策略或元 Agent 怎样持续更新，证据够不够？
  question_en: How do search strategies or meta agents keep updating, and is the evidence sufficient?
- name_zh: 没有答案标签
  name_en: No ground-truth labels
  papers:
  - tthe
  - harness2
  - harnesspro
  - agent-s4
  question_zh: 用什么代理信号选版本，怎样控制错误反馈？
  question_en: Which proxy signals select versions, and how can incorrect feedback be controlled?
- name_zh: 多任务与跨模型泛化
  name_en: Multi-task & cross-model generalization
  papers:
  - harnesscompass
  - starharness
  - mad-rsi
  - oo-harness
  question_zh: 怎样避免只适配一组任务或一个模型？
  question_en: How can adaptation to just one task set or one model be avoided?
- name_zh: 任务与证据选择
  name_en: Task & evidence selection
  papers:
  - activesaddler
  - ssr
  - ecdysis
  - task-coevolve
  question_zh: 下一轮用哪些任务、哪些失败来驱动修改？
  question_en: Which tasks and failures should drive edits in the next round?
- name_zh: 模型与 Harness 协同
  name_en: Model–harness co-evolution
  papers:
  - harnessx
  - co-evolving-harnesses-models
  - self-hpo
  - harnessadapt-rl
  question_zh: 什么时候改 Harness、什么时候改权重，收益怎样拆分？
  question_en: When should the harness change, when should weights change, and how can their gains be separated?
- name_zh: 实验设计（所有人必读）
  name_en: Experimental design (everyone)
  papers:
  - rethinking-evaluation
  - hda
  - harnessdev
  - rsihub
  - harnessopt-bench
  - auditing-product
  - trusting-trust-revisited
  question_zh: 同预算下，收益来自可迁移改进、额外计算还是过拟合？基线有没有泄露答案？
  question_en: Under matched budgets, do gains come from transferable improvements, extra computation, or overfitting?
    Do the baselines leak answers?
  why:
    rethinking-evaluation:
      zh: 建立测试时扩展与演化的同预算比较意识。
      en: Compare evolution with test-time scaling under matched budgets.
    hda:
      zh: 学习把过拟合与额外计算从改进收益中拆开。
      en: Separate overfitting and extra compute from improvement gains.
    harnessdev:
      zh: 区分反馈分数、冻结后的留出收益，以及固定执行器的独立演化线。
      en: Distinguish feedback scores, post-freeze held-out gains, and separate fixed-executor evolution trajectories.
    rsihub:
      zh: 看统一评估边界下的方法比较，并检查分区分母、单次运行与预算限制。
      en: Compare methods under shared evaluation boundaries while checking split denominators, single-run estimates, and budget limits.
    auditing-product:
      zh: 检查声称改进流程变好的证据是否充分。
      en: Check the evidence behind claims of a better improvement procedure.
