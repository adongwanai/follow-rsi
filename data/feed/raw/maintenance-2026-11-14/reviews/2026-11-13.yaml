- id: arxiv:2611.14046
  title: Structured Confidence Perturbation via Fisher Geometry for Adversarial Training
  announced: '2026-11-10'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.14046'
  version: 1
  source_hash: e5242504a14c2f24c416adb5aae32cf4a145502c5dfb86b57c85d0076e2f458a
  published: '2026-11-10T13:13:30Z'
  updated: '2026-11-10T13:13:30Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: Adversarial training is often plagued by "pseudo-attacks", perturbations that significantly increase
    the loss value but fail to truly alter the model's confidence structure. To address this, we propose two complementary
    approaches to directly attack and defend against confidence structure deformation. First, building upon the
    traditional loss maximization perspective, we introduce a hybrid objective that integrates cross-entropy and
    KL divergence, encouraging adversarial examples to simultaneously disrupt prediction accuracy and distribution
    consistency. Second, we geometrically reconstruct adversarial training by generating perturbations that maximize
    the distribution distance on the confidence manifold. Theoretical analysis shows that the optimal perturbation
    direction aligns with the principal eigenvectors of the Fisher information matrix. We also propose an efficient
    algorithm to avoid high-dimensional matrix computations. Experiments on multiple datasets and model architectures
    demonstrate that our method outperforms existing methods in adversarial robustness and robust transferability,
    particularly excelling in structural perturbations within high-confidence regions.
