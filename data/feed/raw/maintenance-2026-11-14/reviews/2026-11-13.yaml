- id: arxiv:2611.17334
  title: Unbundling Multimodal Vision Encoding
  announced: '2026-11-12'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.17334'
  version: 1
  source_hash: 03304fc192c38eb13a4438dd67d169998ceef174acbc4c8fe38d5b021e34974b
  published: '2026-11-12T18:59:54Z'
  updated: '2026-11-12T18:59:54Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: 'How multimodal language models should encode visual input remains up for debate. Most models use a
    pretrained vision encoder, while some recent recipes train the encoder from scratch with the language model
    or remove it entirely. Vision encoders bundle together three design choices: a visual prior from upstream pretraining,
    dedicated vision capacity, and pre-fusion placement of that capacity (i.e., before the multimodal backbone).
    Because published models also differ in data, architecture, and compute, comparing them cannot isolate the effect
    of each choice. We disentangle these choices via a controlled framework where we pretrain all models from scratch
    on common data and compare them on visual question answering and language benchmarks at matched lifetime compute.
    We find that the visual prior is not necessary; an encoder trained jointly from scratch is on par with a pretrained
    one, without a separate training stage. What matters instead is dedicated vision capacity: an encoder-free model
    trails on visual understanding even when its backbone is enlarged by the encoder''s parameter count. Yet that
    capacity need not precede multimodal fusion, as vision-only modules added in-fusion to early backbone layers
    perform comparably to a pre-fusion encoder and can lower time to first token. These results also hold across
    backbone sizes, when encoder pretraining is treated as free, and when starting from a pretrained language model.
    Overall, our findings favor dedicated vision capacity trained jointly with the backbone and placed early within
    it.'
