- id: arxiv:2611.12872
  title: 'HiVe-Mem: Interleaving Horizontal Memory Expansion and Vertical Evidence Composition for Multimodal Agents'
  announced: '2026-11-09'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12872'
  version: 1
  source_hash: cda184b31b51ad398650eb46532105cbf0c4ba8a6166dcfdfa148821d1dd43f5
  published: '2026-11-09T18:57:00Z'
  updated: '2026-11-09T18:57:00Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: As multimodal agents accumulate increasingly long interaction histories, effectively retrieving and
    utilizing past information becomes critical for long-term interaction. Existing memory systems typically rely
    on semantic retrieval over compressed memories and expose predefined representations, which may miss relevant
    memories and overlook heterogeneous evidence needs across queries. We introduce \textbf{\hivemem}, a multimodal
    memory framework that interleaves \textbf{\textsc{H}}or\textbf{\textsc{i}}zontal Memory Expansion with \textbf{\textsc{Ve}}rtical
    Evidence Composition. For horizontal memory expansion, \hivemem organizes memory episodes into a relational
    graph using textual and visual anchors, expanding semantically retrieved seeds with related neighbors to recover
    complementary information. For vertical evidence composition, each retrieved memory retains multiple evidence
    forms, including compact summaries, captions, grounded visual views, raw images, and interaction history. A
    lightweight trainable selector independently composes an evidence subset for each retrieved memory, enabling
    query-adaptive utilization of heterogeneous multimodal information. This two-dimensional design jointly broadens
    memory coverage and adapts the evidence contributed by individual memories. Experiments across three multimodal
    memory benchmarks show that \hivemem consistently improves task performance across base models while reducing
    token consumption by about 90\% compared with the most efficient competing multimodal baselines.
