- id: arxiv:2611.14815
  title: 'BirdDreams: Joint Perspective and BEV Video Generation for a Plausible, Reactive Driving World Model'
  announced: '2026-11-10'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.14815'
  version: 1
  source_hash: 75620f7a992b97ba625026f4796d7cf96094cd03eab4e74d727c2bfdd6d60a77
  published: '2026-11-10T23:04:58Z'
  updated: '2026-11-10T23:04:58Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: 'Driving world models aim to simulate how a scene unfolds under different ego actions. This requires
    plausible motion of surrounding vehicles as well as precise ego-trajectory control. Learning vehicle motion
    from perspective video alone is challenging because motion is entangled with appearance and vehicles can be
    occluded. Prior work therefore conditions video generation on layouts that specify vehicle motion, providing
    control over surrounding vehicles but requiring their future trajectories as inputs. We introduce BirdDreams,
    an autoregressive driving world model that jointly generates perspective video and a schematic bird''s-eye-view
    (BEV) video, making scene layout part of the predicted future. The BEV, rendered from scene annotations for
    training, depicts roads and vehicles as simple shapes at a fixed metric scale, providing a top-down view of
    their positions and motion with reduced occlusion between vehicles. Perspective video, by contrast, retains
    scene details that the BEV omits, such as traffic signals and object appearance. Joint attention between two
    video diffusion transformers, one per stream, lets each stream inform the other during generation. The predicted
    BEV also provides a geometric interface for ego control: we translate and rotate its latest frame along an input
    ego trajectory and use the resulting frames as a soft condition that shows how the scene would appear to move
    if only the ego vehicle moved. At inference, BirdDreams generates both videos from a single camera image without
    requiring an HD map or vehicle-state inputs. On PhysicalAI-AV and nuScenes, BirdDreams follows input ego trajectories
    more faithfully than prior driving world models and generates more plausible ego motion without ego-action conditioning.
    Human evaluation shows that BirdDreams outperforms a perspective-only baseline in generating realistic surrounding-vehicle
    behavior.'
