- id: arxiv:2611.16748
  title: 'PhysLoop: Harnessing LLMs'' Physics Awareness for Self-Improving Video Generation Models'
  announced: '2026-11-12'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.16748'
  version: 1
  source_hash: 09e17db0ee539ac45792e9abdb50a87da4ddc486c0080d3820ecd83dcb0904f9
  published: '2026-11-12T12:59:35Z'
  updated: '2026-11-12T12:59:35Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: 'Video generation models produce visually realistic videos but still struggle with physical dynamics
    and causal consistency. Learning from generated videos requires fine-grained physical supervision, yet reliable
    quality judgments, correction pairs, and controlled variations are difficult to obtain. Large language models
    (LLMs) possess physical knowledge, but struggle to reliably guide video generation models in producing their
    training videos. We present PhysLoop, a unified harness designed to support physically grounded self-improvement
    in video generation models. The harness guides and constrains LLMs throughout video generation, selection, and
    correction, distilling their physical knowledge into physically consistent videos. The framework supports controllable
    training-data construction and inference-time video repair. By identifying and correcting failures, PhysLoop
    marks a key milestone toward recursive self-improvement (RSI) in video generation models with limited human
    intervention. We release 100K videos spanning diverse, realistic indoor and outdoor scenes, along with generation
    tools and two evaluation datasets: PhysLoop-Gen and PhysLoop-Repair. We evaluate controllable generation and
    localized repair on these datasets, respectively, and assess physical behavior on the external Physics-IQ Verified
    benchmark.'
