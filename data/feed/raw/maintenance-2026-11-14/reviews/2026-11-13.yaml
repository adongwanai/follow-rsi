- id: arxiv:2610.07701
  title: 'On the Boundary of Admission Gates: An Injected-Truth Study of Falsification-First Selection in Quantitative
    Strategy Research'
  announced: '2026-10-06'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.07701'
  version: 1
  source_hash: 41ca822c6e4669b2d234fe0a3893e315a57c8073d5e519606fdc96a38bc03fa1
  published: '2026-10-06'
  updated: '2026-10-06'
  hf_daily_dates: []
  abstract: 'Strategy research conflates two problems: finding a profitable rule, and establishing that the finding
    is not search luck. The latter calls for admission gates -- statistical criteria that must be satisfied before
    a conclusion is adopted -- yet whether gates work, and at what cost, remains untested. We introduce an injected-truth
    protocol with a random-admission control that adopts at the same rate as the gate; only if the gate beats this
    control does it carry information rather than merely raise a threshold. Across synthetic and real-calibrated
    panels, gates eliminate false discoveries in the weak-signal regime but cut adoption to 1--7%, and add nothing
    when signals are strong. Most importantly, criteria computed on absolute rather than excess returns silently
    reject every candidate, including true signals. Keywords: multiple testing, backtest overfitting, strategy admission,
    injected-truth validation, excess returns, false discovery rate'
