- id: arxiv:2610.14463
  title: 'Soft-to-Rigid: Shape Continuation as an Alternative Search for Packing Congruent Shapes'
  announced: '2026-10-10'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.14463'
  version: 1
  source_hash: bf808d2589d39a48434067a5cb48e9d43a85b1f9290d5e42b5106466ee7a7dfd
  published: '2026-10-10'
  updated: '2026-10-10'
  hf_daily_dates: []
  abstract: 'Searches for dense packings of congruent shapes move rigid pieces. Hardening starts each piece as its
    inscribed disk and deforms it into the target shape while the container is compressed. We ask whether it is
    a search worth running alongside existing ones, and test it at matched budget and comparable tuning against
    rigid starts, growth, simulated annealing and perturbation--compression on seven families of squares, triangles,
    hexagons and disks in squares, triangles and circles (188 instances), scoring each method by the lowest container
    size it reaches. Hardening is not a better default: tuned rigid starts reach the lowest size most often. It
    is a different search. On squares in a square it reaches packings the other four methods miss, including Trump''s
    n = 11 and Wainwright''s n = 19 in 32 runs per method, and in a targeted follow-up campaign at ten times the
    budget (16 runs per method) it is the only one to reach the best known packings for n = 17 and n = 26, while
    annealing alone reaches n = 27. In exploratory ablations, compressing disks and then switching to polygons at
    once, or growing rigid polygons along hardening''s area schedule, shows no detectable difference from rigid
    starts, and hardening''s unique packings contain more tilted pieces. The bias costs elsewhere: hardening is
    worse on triangles and on four families held out from all development, where the short-pilot policy we tested
    showed no detected advantage over always starting rigid. Shape continuation is an alternative search that reaches
    different packings, worth keeping beside rigid ones; we did not show that splitting a fixed budget between them
    pays, and we have no test that predicts where it helps. Search campaigns were planned before they ran, with
    amendments, exploratory analyses and post-hoc checks identified separately; every run is replayable and every
    number is generated from an event log.'
