  updated: '2026-11-12T12:40:24Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: 'Generalist manipulation policies can benefit from the complementary experience of humans, real robots,
    and simulated agents. However, differences in morphology, sensing, and control interfaces make it difficult
    to learn effectively from their combined demonstrations. We introduce EgoX, an egocentric cross-embodiment learning
    framework that organizes heterogeneous demonstrations through semantically corresponding observation and action
    modalities. EgoX pretrains a Modularized Cross-Embodiment Transformer with Embodiment Dreaming (MXT+) on this
    mixture and fine-tunes it on target-embodiment demonstrations. Within each embodiment, MXT+ assigns a dedicated
    tokenizer to each observation modality and a dedicated expert to each action modality, with a Transformer trunk
    shared across embodiments. A training-only embodiment-dreaming objective predicts latent representations of
    future visual and proprioceptive states, encouraging the shared trunk to model each embodiment''s dynamics.
    Across 13 task-embodiment pairs spanning five tasks and six robot embodiments, including five physical robots
    and one simulated humanoid, cross-embodiment pretraining raises MXT+''s average normalized task progress from
    0.63 to 0.80 over training from scratch. The gains are particularly pronounced under out-of-distribution conditions,
    where average task progress increases from 0.53 to 0.77. Ablations demonstrate the benefits of broader pretraining
    mixtures, modular interfaces, and embodiment dreaming, with dreaming producing more similar latent geometry
    across embodiments. Project page: egox-dream.github.io.'
