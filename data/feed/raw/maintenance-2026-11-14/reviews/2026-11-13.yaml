- id: arxiv:2607.13920
  title: 'DeepStress: Stress-Testing Deep Search Agents'
  announced: '2026-07-15'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2607.13920'
  version: 2
  source_hash: 398311a99efa2e24973f410544c19387726253f7245a82f99d9a09d5099135bc
  published: '2026-07-15T14:59:29Z'
  updated: '2026-11-12T13:18:48Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: While search agents demonstrate impressive capabilities in multi-step question answering, their robustness
    to poor-quality evidence remains under-explored. Such evidence is rare in benchmark corpora, and resulting failures
    are hard to reproduce. We propose DeepStress, a dynamic stress-testing framework that subjects agents to degraded
    evidence at controlled rates. It replaces the retrieval module with a synthetic environment where documents
    are generated dynamically for each query, under independent control of their trustworthiness, relevance, and
    factuality. To characterize behavior under stress, we go beyond binary accuracy with a five-way classification
    of final-answer outcomes and two new reliability-aware metrics, RAS and CoPRAS, which credit cautious behavior
    and account for computational cost. Evaluating 12 systems on questions from HotpotQA and BrowseComp-Plus, we
    find that several open-weight agents answer confidently when sources contain obvious credibility red flags,
    and that many HotpotQA questions are answered from parametric knowledge even when all returned documents are
    factually wrong.
