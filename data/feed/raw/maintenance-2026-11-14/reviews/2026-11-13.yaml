  published: '2026-10-06'
  updated: '2026-10-06'
  hf_daily_dates: []
  abstract: Automated building design must comply with seismic and wind codes and satisfy structural mechanics constraints,
    yet most existing agents produce visually plausible models without verification grounded in mechanical analysis
    and code compliance. We introduce the Vibe Building task and propose PE-Loop (Physics-Engine-in-the-Loop), an
    agent in which a deterministic physics engine is the sole source of evaluation signals, mapping code constraints
    to a physics process reward, while the language model is confined to proposing discrete revisions (section menu,
    topology, and lateral system). Designs are verified by held-out seismic and wind time-history checks and a constructability
    gate. On VB-Bench, 3,577 physics-adjudicated building instances across six code families, PE-Loop achieves the
    highest verified success rate under three of four backbone LLMs, the highest held-out seismic pass rate under
    all four, and the highest held-out wind pass rate under three. Replacing the physics verdict with a language-model
    judge, all else fixed, leaves 58.43% of accepted designs noncompliant. These results suggest that reliable structural
    design rests less on a stronger LLM proposer than on an adjudicator the proposer cannot influence, a division
    of labor for agents whose outputs must hold up in the physical world.
