  source_hash: 66374d0e7f0ab40a33cf3e658d2fb639373d11fb569bbe1ae730e7b6f7c29153
  published: '2026-11-12T05:40:37Z'
  updated: '2026-11-12T05:40:37Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: Transferring LLMs into System One decision models typically replaces the language modeling head with
    a decision head while retaining the full backbone, making every decision pay for all layers. Yet it remains
    unclear how much depth such decisions require. We find that decision information is concentrated in intermediate
    layers, with early layers building essential features and the final six layers removable without loss, while
    independently trained smaller models largely mimic the full model rather than developing specialized decision
    capabilities. These findings suggest that efficiency requires not simply smaller backbones, but shared computation
    across different depths. Building on this, we propose \method{}, which jointly trains a full model with prefix
    sub-models that share its final layers and decision head through self-distillation. A lightweight gate reads
    the hidden state at each exit to determine whether additional computation is needed, allowing one model to operate
    at multiple layers. Across seven decision benchmarks, our approach matches or outperforms independently trained
    models at every depth, while achieving better accuracy-efficiency trade-offs through adaptive computation.
