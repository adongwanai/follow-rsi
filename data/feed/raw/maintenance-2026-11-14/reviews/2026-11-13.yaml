- id: arxiv:2611.08321
  title: 'ControlAnything: Generative UI and On-Demand Device Integration for Mixed-Reality Hand Interaction by
    a Coding Agent'
  announced: '2026-11-05'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.08321'
  version: 1
  source_hash: bcc77a57eaf965f141ee27fe44e9dacc5d4dcbd9aea0f8e4ef678d4eb98d9663
  published: '2026-11-05T17:18:13Z'
  updated: '2026-11-05T17:18:13Z'
  hf_daily_dates: []
  abstract: Connecting hand input in mixed reality (MR) to a nearby physical device typically requires an integration
    written in advance for that device, its transport and the mapping. ControlAnything defers this integration to
    the moment of use and assigns it to a coding agent. On a Meta Quest 3, the wearer selects an object outlined
    by SAM 3.1 and states what their hands should control. An agent built on Meta's Muse Spark model then writes
    a connector program on the wearer's laptop, tests it against the live device through hand-written MIDI, Bluetooth
    and key-press transports, and returns augmented-reality (AR) controls, a per-frame hand program, or both. These
    outputs are a form of generative UI, interfaces created by an AI model; here, the agent also generates and tests
    the code that binds the interface to a physical device. In a single-session technical evaluation with the author
    as the only wearer, nine of ten requests addressing five targets reached a ready state, and the wearer stopped
    one. The median time to ready was 32.5 s (range 24.9-57.8 s, excluding speech transcription); sequential model
    calls accounted for a median of 89.9% of this time, and 91.7% of input tokens came from the prompt cache. The
    system's evidence of success extends to transport acknowledgements but not to physical effects. These findings
    point to connector reuse and the observation of effects through the headset's own sensors as next steps for
    on-demand device integration in MR. A user study with first-time wearers is planned.
