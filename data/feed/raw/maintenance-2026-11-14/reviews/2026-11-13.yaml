  source_hash: 2b4ef60159d1385462baad6574c140cdf7d435aebe8ee7b0aec458cd96f1d97c
  published: '2026-11-09T17:31:47Z'
  updated: '2026-11-09T17:31:47Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: 'Large language models (LLMs) increasingly mediate how people seek and consume information, including
    accounts that differ across languages and regions, especially on contested topics. Supporting diverse information
    seeking requires models to help users navigate competing narratives across languages and information streams.
    We define six capabilities necessary for diverse multilingual information seeking: three foundational capabilities
    for narrative inclusion, narrative exclusion, and missing narrative identification; and three higher-level capabilities
    for presenting diverse narratives, preserving narrative coverage under confirmatory queries, and maintaining
    information parity across languages. To guide the development of those information seeking capabilities, we
    introduce \textsc{NarrativeBench}, a benchmark comprising 1,333 news articles in 23 publication languages across
    23 contested topics and 460 Reddit-grounded queries. Evaluating 14 LLMs across 24 query languages, we find that
    current models lack the capabilities needed to reliably navigate diverse narratives, limiting users'' control
    over the perspectives they receive and leaving substantial gaps in exposure to competing accounts even when
    diversity is explicitly requested. Information access also differs across query framings and languages, risking
    echo chambers, linguistic filter bubbles, and information disparities that weaken the common ground needed for
    democratic discourse. \textsc{NarrativeBench} provides a foundation for developing information systems that
    give users across languages and regions agency to navigate diverse narratives.'
