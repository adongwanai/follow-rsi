  arxiv_id: '2611.16961'
  version: 1
  source_hash: 9d111ddc9a44ddae2d27222f63545e28845ce89ce3fa29590f17725524984f2f
  published: '2026-11-12T15:32:47Z'
  updated: '2026-11-12T15:32:47Z'
  hf_daily_dates:
  - '2026-11-13'
  abstract: 'Existing adaptive-reasoning methods shorten the explicit reasoning a model writes, or skip it by switching
    modes; either way the answer is still written out token by token. \emph{Rather than deciding how much to think},
    we explore a different paradigm, \emph{zero-or-$T$ thinking}: a single model either answers from the implicit
    thinking inside one forward pass, generating no token, or performs full autoregressive reasoning at a cost of
    $T$ tokens when that is worth paying. We realise it in a \emph{hybrid decision model} (HDM), where one frozen
    backbone serves both modes and a lightweight \emph{self-routing block} chooses between them. The block estimates
    the \emph{value of thinking}, the utility the slow mode is expected to add over the fast one, from what that
    implicit thinking has already produced, and the slow mode runs only where that value exceeds a price $λ$ set
    per request. Where no per-decision label exists, as in episodic agentic tasks, we introduce \emph{Calibrated
    Decision Policy Optimisation} (CDPO), a reinforcement-learning recipe that trains the block from episode-level
    returns. We evaluate HDM on MMLU-Pro, AGIEval, GPQA-Diamond, JevBench, BANKING77 and MiniWoB. Specifically,
    on JevBench HDM-4B scores $0.857$ against Jev''s $0.851$ ($+0.7\%$) at a median $0.179$\,s against $0.652$ ($-72.5\%$).
    On the agentic venue MiniWoB HDM-27B cuts token cost by $80.1\%$.'
