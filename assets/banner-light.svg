<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="340" viewBox="0 0 1280 340" role="img" aria-label="Follow RSI"><title>Follow RSI</title><defs><pattern id="dots" width="18" height="18" patternUnits="userSpaceOnUse"><circle cx="9" cy="9" r="1" fill="#D6D9E0"/></pattern></defs><rect width="1280" height="340" fill="#F1F2F4"/><rect width="1280" height="340" fill="url(#dots)"/><text x="48.0" y="92.0" font-family="'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="13" font-weight="600" fill="#2A33D4" text-anchor="start" letter-spacing="1.6">FOLLOW RSI · RECURSIVE SELF-IMPROVEMENT</text><text x="45.0" y="170.0" font-family="'Noto Serif SC','Source Han Serif SC','Songti SC','STSong',Georgia,serif" font-size="78" font-weight="900" fill="#14161C" text-anchor="start" letter-spacing="-1">Follow RSI</text><text x="48.0" y="220.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="19" font-weight="700" fill="#14161C" text-anchor="start">Five minutes a day to keep up with recursive self-improvement.</text><text x="48.0" y="256.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="15" font-weight="400" fill="#585D69" text-anchor="start">AI is learning to improve itself. We keep the record.</text><line x1="48" y1="290" x2="112" y2="290" stroke="#2A33D4" stroke-width="3"/><rect x="800" y="70" width="432" height="104" rx="6" fill="#FFFFFF" stroke="#D6D9E0"/><line x1="800" y1="82" x2="800" y2="162" stroke="#F1F2F4" stroke-width="3"/><line x1="800" y1="82" x2="800" y2="162" stroke="#D6D9E0" stroke-width="2" stroke-dasharray="4 4"/><text x="820.0" y="96.0" font-family="'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#585D69" text-anchor="start">HDA · arXiv 2610.22466</text><text x="820.0" y="150.0" font-family="'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="46" font-weight="700" fill="#14161C" text-anchor="start" letter-spacing="-1" class="big">54%</text><text x="938.0" y="132.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="13.5" font-weight="400" fill="#585D69" text-anchor="start" class="fit">of harness-evolution gains on the</text><text x="938.0" y="154.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="13.5" font-weight="400" fill="#585D69" text-anchor="start" class="fit">search set come from overfitting</text><rect x="800" y="190" width="432" height="104" rx="6" fill="#FFFFFF" stroke="#D6D9E0"/><line x1="800" y1="202" x2="800" y2="282" stroke="#F1F2F4" stroke-width="3"/><line x1="800" y1="202" x2="800" y2="282" stroke="#D6D9E0" stroke-width="2" stroke-dasharray="4 4"/><text x="820.0" y="216.0" font-family="'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="12" font-weight="400" fill="#585D69" text-anchor="start">Auditing · arXiv 2610.27610</text><text x="820.0" y="270.0" font-family="'SFMono-Regular','JetBrains Mono',Menlo,Consolas,monospace" font-size="46" font-weight="700" fill="#14161C" text-anchor="start" letter-spacing="-1" class="big">4/26</text><text x="956.0" y="252.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="13.5" font-weight="400" fill="#585D69" text-anchor="start" class="fit">papers claiming a better improver</text><text x="956.0" y="274.0" font-family="-apple-system,BlinkMacSystemFont,'PingFang SC','Noto Sans CJK SC','Noto Sans SC','Microsoft YaHei','Segoe UI',sans-serif" font-size="13.5" font-weight="400" fill="#585D69" text-anchor="start" class="fit">ran a matched-budget comparison</text></svg>