<header class="site-header" id="site-header" data-page="{{ active }}" data-site-index="{{ root_prefix }}index.html">
  <div class="site-header-brand">
    <a class="site-wordmark" href="{{ root_prefix }}index.html#home">Follow RSI</a>
    <span class="site-tagline" id="tagline"><span class="zh">每天 5 分钟，跟上 RSI 前沿</span><span class="en">Five minutes a day to keep up with recursive self-improvement</span></span>
  </div>
  <nav class="site-nav" aria-label="主导航 / Main navigation">
    <a id="daily-link" data-header-page="daily" href="{{ root_prefix }}daily/index.html"{% if active == 'daily' %} aria-current="page"{% endif %}><span class="zh">今日动态</span><span class="en">Today</span></a>
    <button type="button" data-header-view="papers"{% if active == 'papers' %} aria-current="page"{% endif %}><span class="zh">证据库</span><span class="en">Evidence library</span></button>
    <button type="button" data-header-view="routes"{% if active == 'routes' %} aria-current="page"{% endif %}><span class="zh">阅读路线</span><span class="en">Reading routes</span></button>
    <button type="button" data-header-view="map"{% if active == 'map' %} aria-current="page"{% endif %}><span class="zh">方向图</span><span class="en">Research map</span></button>
    <button type="button" data-header-view="gaps"{% if active == 'gaps' %} aria-current="page"{% endif %}><span class="zh">研究空白</span><span class="en">Open problems</span></button>
    <a id="guide-nav-link" data-header-page="guide" href="{{ root_prefix }}guide.html"{% if active == 'guide' %} aria-current="page"{% endif %}><span class="zh">导读</span><span class="en">Guide</span></a>
    <a id="weekly-link" data-header-page="weekly" href="{{ root_prefix }}weekly/index.html"{% if active == 'weekly' %} aria-current="page"{% endif %}><span class="zh">每周精选</span><span class="en">Weekly picks</span></a>
  </nav>
  <div class="site-utilities">
    <button class="iconbtn" id="lang" type="button" aria-label="Switch to English">EN</button>
    <button class="iconbtn" id="theme" type="button" aria-label="主题：自动 / Theme: auto"><span class="zh">主题</span><span class="en">Theme</span></button>
    {% if config.repository_url %}<a class="site-github" href="{{ config.repository_url }}">★ GitHub</a>{% endif %}
  </div>
</header>
