<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="description" content="Harness 自进化论文证据库：留出集、同预算、跨模型、成本，逐篇记录。">
  <meta property="og:title" content="Follow RSI · Harness Evolution Evidence Base">
  <meta property="og:description" content="Every paper, with an evidence receipt.">
  <meta property="og:image" content="https://adongwanai.github.io/follow-rsi/og.png">
  <meta name="twitter:card" content="summary_large_image">
  <title>Follow RSI · Harness Evolution Evidence Base</title>
  <link rel="stylesheet" href="style.css">
  <script src="data.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
<div id="app">
  <a class="skip" href="#main">跳至论文 / Skip to papers</a>
  <div class="wrap">
    <header class="topbar">
      <div class="brand"><b>Follow RSI</b> · <span id="tagline">每天 5 分钟，跟上 RSI 前沿</span></div>
      <nav class="views" aria-label="视图 / Views">
        <button type="button" data-view="papers"></button>
        <button type="button" data-view="routes"></button>
        <button type="button" data-view="gaps"></button>
        <button type="button" data-view="map"></button>
        <a id="daily-link" href="daily/index.html">今日动态</a>
        <a id="weekly-link" href="weekly/index.html">每周进展</a>
      </nav>
      <div class="utilities">
        <button class="iconbtn" id="lang" type="button">English</button>
        <button class="iconbtn" id="theme" type="button"></button>
        <a class="github-link" data-repo></a>
      </div>
    </header>
    <section class="hero" aria-labelledby="h1">
      <div>
        <p class="eyebrow" id="eyebrow"></p>
        <h1 id="h1"></h1>
        <p class="lede" id="lede"></p>
        <div class="meta mono" id="meta"></div>
        <div class="hero-actions"><a class="btn" data-repo></a><a class="text-link" id="newsletter"></a><a class="text-link" id="guide-link" href="guide.html"></a></div>
      </div>
      <div class="stubs">
        <button class="stub" data-open="hda" type="button">
          <span class="src">HDA · arXiv 2610.22466</span>
          <span class="big">54<small>%</small></span>
          <span class="txt" id="hda-copy"></span>
        </button>
        <button class="stub" data-open="auditing-product" type="button">
          <span class="src">Auditing the Product · arXiv 2610.27610</span>
          <span class="big">4<small>/26</small></span>
          <span class="txt" id="audit-copy"></span>
        </button>
      </div>
    </section>
    <section class="updates" id="updates" aria-label="论文动态 / Paper activity"></section>
  </div>
  <div class="bar" id="bar">
    <div class="wrap">
      <div class="bar-row">
        <label class="search" for="q"><span aria-hidden="true">⌕</span><input id="q" type="search" autocomplete="off"><kbd>/</kbd></label>
        <button id="filter-open" class="iconbtn" aria-expanded="false" aria-controls="filter-panel" type="button"></button>
        <label class="sort-label"><span id="sort-label"></span><select id="sort"><option value="newest"></option><option value="oldest"></option><option value="must"></option><option value="evidence"></option></select></label>
      </div>
      <div id="filter-panel">
        <div class="toggles" id="toggles"></div>
        <div class="sections" id="sections" role="group" aria-label="方向 / Directions"></div>
        <details class="advanced-filters"><summary id="advanced-title"></summary><p class="note" id="filter-rules"></p><div id="facets"></div></details>
        <div class="legend" id="legend"></div>
      </div>
      <div class="results-line"><span id="result-count" role="status" aria-live="polite"></span><button type="button" class="clear" id="clear"></button></div>
    </div>
  </div>
  <div class="wrap"><main id="main" tabindex="-1"></main><footer id="footer"></footer></div>
</div>
<div class="scrim" id="scrim" hidden></div>
<aside class="drawer" id="drawer" hidden aria-modal="true" role="dialog" aria-labelledby="dtitle"></aside>
</body>
</html>
