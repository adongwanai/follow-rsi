name: Fix evidence / 修正证据
description: Correct an evidence value with a source.
body:
- type: input
  id: paper
  attributes:
    label: Paper ID / 论文
  validations:
    required: true
- type: dropdown
  id: field
  attributes:
    label: Evidence field
    options:
    - held_out
    - matched_budget_baseline
    - cross_model_transfer
    - cost_reported
    - disjoint_evolution_set
    - reliability_metric
    - code_released
    - evolved_harness_released
    - who_edits
    - feedback
    - timing
    - topology
  validations:
    required: true
- type: input
  id: value
  attributes:
    label: New value / 新值
  validations:
    required: true
- type: textarea
  id: source
  attributes:
    label: Source / 出处
    description: Required page or table number and the supporting passage.
  validations:
    required: true
- type: checkboxes
  id: relationship
  attributes:
    label: Relationship / 与论文的关系
    options:
    - label: 我是作者 / I am an author
    - label: 我读过正文 / I have read the full paper
