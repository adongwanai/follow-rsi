name: New paper / 新论文
description: Suggest a candidate with traceable evidence.
labels:
- candidate
body:
- type: input
  id: arxiv
  attributes:
    label: arXiv link
    placeholder: https://arxiv.org/abs/...
  validations:
    required: true
- type: dropdown
  id: section
  attributes:
    label: Section
    options:
    - foundations
    - evolve_main
    - generalize
    - evidence_selection
    - improver
    - component
    - coevolution
    - evaluation
    - survey_theory
    - candidates
  validations:
    required: true
- type: textarea
  id: mechanism
  attributes:
    label: One-sentence mechanism / 一句话机制
    description: Describe only what the paper supports; include the source page.
  validations:
    required: true
- type: textarea
  id: held_out
  attributes:
    label: held_out
    description: Optional. Provide the value AND a page/table number with the supporting
      passage. Leave blank if unknown.
    placeholder: 'value: ...; source: p. ... / Table ...; passage: ...'
- type: textarea
  id: matched_budget_baseline
  attributes:
    label: matched_budget_baseline
    description: Optional. Provide the value AND a page/table number with the supporting
      passage. Leave blank if unknown.
