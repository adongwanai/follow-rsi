name: Follow RSI daily
on:
  schedule:
    - cron: '23 2 * * *'
  workflow_dispatch:
    inputs:
      days:
        description: Calendar days to backfill (HF requests every day)
        type: number
        default: 3
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: follow-rsi-state-${{ github.repository }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Discover, judge and summarize (no public publishing)
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DAYS: ${{ inputs.days || 3 }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: python -m scripts.feed.cli run --stage all --until summarize --schedule daily --days "$DAYS" --issues
      - name: Persist source metadata, caches and health even after a failed stage
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.feed.ci commit --message "Update Follow RSI daily state" --deploy-pages --paths data/feed site/feed/status.json badges/feed-updated.json site/badges/feed-updated.json
