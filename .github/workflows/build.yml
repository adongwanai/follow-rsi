name: Check generated files
on:
  pull_request:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: pip install -r requirements.txt
      - run: python scripts/build.py
      - name: Generated output must be committed
        shell: bash
        run: |
          if ! git diff --exit-code || test -n "$(git ls-files --others --exclude-standard)"; then
            echo '::error::Generated files are stale; run `python scripts/build.py` and commit its output.'
            exit 1
          fi
