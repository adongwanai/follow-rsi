name: Follow RSI weekly discovery
on:
  schedule:
    - cron: '7 21 * * 0'
  workflow_dispatch:
permissions:
  contents: write
  issues: write
  actions: write
concurrency:
  group: follow-rsi-state-${{ github.repository }}
  cancel-in-progress: false
jobs:
  discover:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Citation and author discovery
        env:
          LLM_API_KEY: ${{ secrets.LLM_API_KEY }}
          S2_API_KEY: ${{ secrets.S2_API_KEY }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LLM_PROVIDER: ${{ vars.LLM_PROVIDER }}
          LLM_MODEL: ${{ vars.LLM_MODEL }}
          LLM_BASE_URL: ${{ vars.LLM_BASE_URL }}
        run: python -m scripts.feed.cli run --stage all --until summarize --schedule weekly --issues
      - name: Check arXiv versions and retractions
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.feed.cli versions --issues
      - name: Compare discovery with reference lists
        if: always()
        run: python -m scripts.feed.cli recall
      - name: Persist weekly discovery and recall reports
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: python -m scripts.feed.ci commit --message "Update Follow RSI weekly discovery" --deploy-pages --paths data/feed review site/feed/status.json badges/feed-updated.json site/badges/feed-updated.json
