name: Follow RSI weekly picks
on:
  schedule:
    - cron: '41 23 * * 0'
  workflow_dispatch:
    inputs:
      week:
        description: ISO week (blank means current UTC week)
        type: string
        default: ''
permissions:
  contents: write
  pull-requests: write
  actions: write
concurrency:
  group: follow-rsi-state-${{ github.repository }}
  cancel-in-progress: false
jobs:
  queue:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
      - run: python -m pip install -r requirements.txt
      - name: Queue owner picks from daily-approved papers
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REVIEW_WEEK: ${{ inputs.week }}
        shell: bash
        run: |
          args=()
          if [[ -n "$REVIEW_WEEK" ]]; then args+=(--week "$REVIEW_WEEK"); fi
          python -m scripts.feed.ci queue-picks-pr "${args[@]}"
