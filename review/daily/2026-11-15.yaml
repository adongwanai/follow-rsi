- id: arxiv:2611.16487
  title: 'HeMeR: Heterogeneous Memory Reconciliation for Embodied Agents via Structured KV Reuse'
  announced: '2026-11-12'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.16487'
  version: 1
  source_hash: bee13fee05e0e283326da7d5a8dd05976d69f65ba8716565f6660c5434ecf944
  published: '2026-11-12T08:58:20Z'
  updated: '2026-11-12T08:58:20Z'
  hf_daily_dates: []
  abstract: Embodied agents make decisions by combining information from heterogeneous memory modules, including
    declarative memory for explicit knowledge, procedural memory for learned routines, and working memory for current
    observations. During interaction, the memory contents required for decision making change with the agent's state,
    goal, and task progress, while many contents remain shared across consecutive decisions. However, existing memory
    modules are typically accessed through separate interfaces, so each updated memory context is often processed
    as a new input to the foundation model. This prevents selective key-value (KV) cache reuse for unchanged memory
    contents and forces full KV cache recomputation even when much of the memory context remains valid. We introduce
    HeMeR, an inference framework that performs KV reconciliation between dynamically updated memory contexts and
    reusable KV states. HeMeR tracks declarative, procedural, and working memory contents across action decisions,
    preserves KV states for unchanged contents, and reconciles only the KV states affected by memory-content updates.
    This enables efficient and stable inference as memory contents evolve during interaction. We evaluate HeMeR
    on ALFWorld, Habitat, and real-world robotic deployments requiring coordinated use of heterogeneous memory contents.
    In the real-world setting, HeMeR achieves 83.20% task success and reduces per-step inference time from 2.94
    to 1.87 seconds compared with MemRL, while preserving compatible KV states as task progress updates the memory
    context.
