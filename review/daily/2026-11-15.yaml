- id: arxiv:2610.28914
  title: 'D-Skill: Distilling Teacher Knowledge through Agent Skills'
  announced: '2026-10-20'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2610.28914'
  version: 1
  source_hash: 6b5e7e0b0ae588fb3d915a29d169faa31fc8ac2be824a5b92d1a28c9c4ff09cb
  published: '2026-10-20'
  updated: '2026-10-20'
  hf_daily_dates: []
  abstract: Frontier language-model agents excel at complex tasks, but high inference costs make transferring their
    capabilities to smaller models essential. Traditional knowledge distillation achieves this through parameter
    updates, requiring access to the student's weights and additional training compute while encoding the transferred
    knowledge implicitly in the parameters. We introduce D-Skill, a framework that treats the teacher as a black
    box and distills its behavioral advantage into an interpretable natural-language skill by analyzing paired rollouts
    and identifying behavioral divergences and agreements. The resulting lessons are consolidated offline, with
    any compatible skill-update backend, into a skill document that is provided to the student at inference time.
    D-Skill constructs the skill entirely offline from fixed trajectories, without labels, further environment interaction,
    or weight updates after rollout collection. Across SpreadsheetBench-Verified, ALFWorld, and chess puzzles spanning
    multiple teacher-student pairs, D-Skill closes 75%-95% of the teacher-student gap without touching model weights.
    After a single offline pass over the paired traces, D-Skill outperforms one-epoch SFT baselines and remains
    competitive with multi-epoch SFT. Under the same model family, the resulting student also incurs 5.7x-8.3x lower
    inference cost per task than the teacher. Our results demonstrate that natural-language skill distillation offers
    a performant, interpretable, and efficient alternative to weight-based capability transfer.
