  updated: '2026-11-12T15:49:00Z'
  hf_daily_dates: []
  abstract: 'Weight-space programming (WSP) uses language models to construct neural network weights without training.
    We test whether known game mechanics can be compiled into compact agents that generalise to held-out levels,
    renderings and start states within a game family. Writers receive simulator source with held-out level data
    removed for 20 privately authored, unpublished ARC-AGI-3-style game families. With a fixed 57k-parameter recurrent
    architecture, the strongest writer reaches 56% held-out-level success with feedback, while the four main writers''
    Python players reach 97-100%. An exploratory free-architecture condition reaches 68-90%. Learning from support-level
    examples transfers much less well, but these learners lack the source information given to writers. Written
    networks have a program-like structure: 93% of parameters are zero, and 90% of the rest are small integers or
    powers of two. NumPy players under comparable computation caps reach 91%, versus the networks'' 79%. Training
    the strongest writer''s architectures from scratch yields about 1% success within our budget. Written fixed-network
    weights are fragile, and standard PPO removes most of their success. Prompts for noise robustness increase tolerance
    by about four orders of magnitude for two of three writers, but PPO makes larger updates and still removes most
    success. These results demonstrate rule-to-network compilation in this setting, while showing limited benefits
    over Python programs and no successful combination with the tested PPO fine-tuning.'
