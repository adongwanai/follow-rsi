  summary_override:
    summary_en: Turns differences between fixed teacher and student execution traces into task-general operating
      rules, progressively patching a reusable skill for later held-out tasks while student weights remain fixed.
      The rules cover tool use, verification, stopping and retries. The default pipeline adds no environment calls
      or post-patch evaluation-based selection; the separate SkillOpt variant retains a validation gate, which should
      not be attributed to the default pipeline.
    summary_zh: 将固定的教师与学生执行轨迹差异转成任务通用操作规则，逐批修改并保留可复用技能，供后续独立任务加载；规则涉及工具调用、验证、停止与重试，学生权重保持不变。默认流程不增加环境调用，也不逐次评测筛选补丁；另设的
