- id: s2:7872d98d7366afe3ac62a134eb74aa3efdf3018b
  title: Brain Cognition-Inspired Adaptable LLM Agents for Continuous Knowledge Reuse Across Tasks in IoT
  announced: ''
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: null
  version: 0
  source_hash: f413a81648e24b78571977f63d75b90804cb8e18d8a35938b0569db8f07a1691
  published: ''
  updated: ''
  hf_daily_dates: []
  abstract: 'Large language model (LLM)-based agents are promising in Internet of Things (IoT) applications. However,
    existing agent systems suffer from an ephemeral limitation: agents are instantiated for individual tasks and
    terminated upon completion, losing valuable execution experiences across different tasks where past knowledge
    reuse is impossible. Inspired by dual-process theory in cognitive science, we propose a brain cognition-inspired
    dual-system agent framework for continuous knowledge reuse across heterogeneous task streams, termed the cognition-inspired
    dual-system agent framework for continuous knowledge reuse (CIA-CKR). The CIA-CKR framework separates fast (reactive
    execution) from slow (deliberative planning) cognition phases by maintaining a persistent knowledge base throughout
    the operational lifetime of agents. Two synergistic mechanisms are designed that mirror bidirectional knowledge
    flow in human cognition: a personalized agent generation mechanism that retrieves task-relevant knowledge and
    configures context-specific agent capabilities through top-down adaptation, and a knowledge accumulation mechanism
    that extracts experiential insights from execution traces through bottom-up feedback. Extensive experiments
    on HomeBench (smart home control) and OmniEAR (embodied multiagent collaboration) datasets demonstrate that
    CIA-CKR consistently outperforms both vanilla LLMs and recent memory-augmented methods, achieving 10.82% and
    4.23% average accuracy improvements on HomeBench and OmniEAR, respectively, over the best baselines.'
