- id: s2:5bdd4b4a33f2207d918e44be0d2cbc4524093cf3
  title: 'DRIP: Defending Prompt Injection via Token-wise Representation Editing and Residual Fusion'
  announced: '2026-11-14'
  window_status: backlog
  in_repo: false
