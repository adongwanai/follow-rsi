- id: arxiv:2611.24357
  title: Semantic Context Handoff with On-Demand Evidence for Long-Horizon Agents
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.24357'
  version: 1
  source_hash: ff676ea2f18e9d11ded82a21d1708c6b306f14f147c40af6218341b8691c7bde
  published: '2026-11-18T12:49:41Z'
  updated: '2026-11-18T12:49:41Z'
  hf_daily_dates: []
  abstract: 'Traditional long-horizon LLM agents often hand off context through full-history prompting, retaining
    all previous action--observation interactions. As execution proceeds, this history keeps growing, increasing
    inference cost and potentially degrading accuracy. Existing methods control this growth by preserving compact
    conclusions while removing earlier observations, but doing so can discard evidence that later becomes relevant.
    We introduce Semantic Context Handoff (SCH), whose central abstraction is state--evidence separation: a compact
    semantic state carries the agent''s current interpretation, while supporting action--observation evidence remains
    separately addressable and can re-enter context when later execution makes it relevant, without separate summarization
    or retrieval-model calls. Empirically, SCH improves long-horizon agent performance while substantially reducing
    context cost. In a controlled 150-task SWE-bench study, SCH''s evidence recovery improves Pass@1 from $80.0\%$
    to $86.9\%$ at essentially unchanged token use and execution time. In the complete-system comparison, SCH achieves
    86.9% Pass@1 while using 43% fewer tokens and 41% less wall-clock time than the strongest baseline by task performance.
    Across models and benchmarks, SCH consistently reduces token use relative to full-history prompting while remaining
    competitive with or improving upon the evaluated baselines. Trajectory analysis confirms that SCH recovers evidence
    from substantially earlier parts of the interaction history rather than merely preserving a recent context window.'
