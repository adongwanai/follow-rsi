  arxiv_id: '2611.21644'
  version: 1
  source_hash: 8698e46dd7fb2a74dc303feb4670e553b036c27a9e07511a7a1f2b1afda23d87
  published: '2026-10-14T10:45:36Z'
  updated: '2026-10-14T10:45:36Z'
  hf_daily_dates:
  - '2026-11-18'
  abstract: 'Multimodal large language models (MLLMs) excel in vision-language tasks; yet, whether they maintain
    consistent understanding of information-rich visuals (InfoVis) when the surface language changes remains unclear.
    To quantify this capability, we introduce MInfoVisQA, a parallel benchmark with 8,960 QA configurations derived
    from 128 seed instances across 24 languages. We construct seed-matched, language-parallel visuals and QA pairs
    by disentangling numerical-structural data from text and programmatically synchronizing translated labels. We
    evaluate 25 MLLMs under two settings: Language-Aligned QA (LQA, matching visual-text languages) and Cross-Language
    QA (XQA, fixed QA language with varying visual languages). The results show that aggregate accuracy masks substantial
    robustness gaps: two models with comparable mean LQA accuracy (80.4\%) exhibit performance spreads of 7.8 and
    20.3 percentage points across languages. Moreover, all 25 models score lower with non-English visuals under
    fixed English QA, underscoring the need for cross-language sensitivity metrics.'
