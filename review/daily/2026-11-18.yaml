- id: arxiv:2611.11937
  title: Attention at Absolute Zero
  announced: '2026-11-09'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.11937'
  version: 3
  source_hash: 1b94cdf91706101de272b49e4a4194d1807537f4936514b9cf93f26edb23179c
  published: '2026-11-09T06:08:10Z'
  updated: '2026-11-19T01:26:26Z'
  hf_daily_dates:
  - '2026-11-18'
  abstract: 'Attention scores candidate supports of an answer, which we call witnesses, and reads the scores at
    a temperature. We build a higher-order attention layer whose state lives on pairs of items: for a pair (a, b),
    each third item k is a witness judged through its legs (a, k) and (k, b). It reads witnesses at zero temperature,
    keeping the best and the number tied with it, passes on only bits comparing such counts, rebuilds its pair state
    from the input and these bits at every loop, and is trained from answers alone. Each choice removes one way
    soft attention fails at size: dispersed weight, unresolved gaps between learned scores, and a drifting soft
    state. In maximum retrieval it is right on at least 99.95% of sets 1,000 times larger than in training, on all
    ten seeds; trained with a soft count, the same network falls to 42% at 4,096 items. On CLRS-30 without hints,
    a general form of the layer (half its channels read at zero temperature, numbers embedded, state carried) beats
    the best published model, which uses hints on some tasks; the full cold layer is exact on every test input of
    9 of the 12 tasks whose answers depend on numbers only through comparisons. From yes-or-no answers it decides
    2-SAT and two-colouring exactly at 500 variables and, as our theory predicts, not parity equations. Beside a
    frozen 7B language model it chains family relations exactly at 1,000 statements after training on 16, where
    the model alone falls to 44%; finite checks on the weights prove every block that learned correct at every size,
    on acyclic contexts and given what the model reads. On CLUTRR it is right on every story of five to ten relations
    given the graphs, learning the 62 rules exactly; from text, with the model frozen, no hand-written rule and
    only a small read-in trained, it lifts an open 7B model from 33% to 65%, above every system we found without
    hand-written rules except frontier reasoning models.'
