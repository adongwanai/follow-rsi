- id: arxiv:2611.25100
  title: 'HapBO: Harnessed $α$-$π$ Bayesian Optimization via Expert Natural Language Priors'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.25100'
  version: 1
  source_hash: 1c79979d0fbf1f573035fb1ed11dae815ca18f0b64dce9afb30b1b2df000f366
  published: '2026-11-18T19:36:28Z'
  updated: '2026-11-18T19:36:28Z'
  hf_daily_dates: []
  abstract: 'Bayesian Optimization (BO) can be substantially more sample-efficient when informed by prior knowledge
    about the problem. In practice, however, such knowledge is often available only in natural language, e.g., expert
    intuitions or documentation, rather than as the explicit probability distribution landscape that prior-guided
    BO methods may require. Leveraging it effectively demands both an expressive mapping from language to priors
    and robustness to information that may be misleading. We propose HapBO (Harnessed $α$-$π$ Bayesian Optimization),
    which elicits beliefs once from a human expert, a large language model (LLM), or both, and deterministically
    compiles a structured specification into a reusable belief function ($π: \mathcal{X} \to[0,1]$), with a rich
    representation not restricted to a Gaussian family. Building on $α$-$π$BO, HapBO applies this belief function
    through a bounded positive multiplier on any nonnegative acquisition, preserving positive acquisition support
    and requiring no LLM calls during optimization. We prove that, for the Expected Improvement acquisition function
    (EI), HapBO preserves the standard simple-regret rate up to a bounded factor, even under adversarial beliefs.
    We evaluate HapBO on 40 HPOBench tasks, a synthetic suite in 6-15 dimensions and two real-world applications:
    cortical neurostimulation and constrained solar design. HapBO achieves the lowest aggregate HPOBench regret
    and strong real-world task performance, with zero in-loop token cost. In real-world applications it improves
    the optimization outcome even at budgets of 12-20 queries, and at a small fraction of the wall-clock and token
    costs of other LLM-based methods.'
