- id: arxiv:2611.24302
  title: 'OpenKAGE: Open-Ended Lifelong Learning in the Open World via Knowledge-Sharing Agent-Group Evolution'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.24302'
  version: 1
  source_hash: 21c5869f8a4d91ba3c5d88c1052bf0516a1574013e517156fc2b5b6a72782d6c
  published: '2026-11-18T12:11:56Z'
  updated: '2026-11-18T12:11:56Z'
  hf_daily_dates: []
  abstract: 'Building autonomous agents that continually explore open worlds and acquire new capabilities through
    experience is a long-standing aspiration in artificial intelligence. Existing research often pursues lifelong
    learning within predefined tasks, curricula, or objectives, with self-improvement largely confined to individual
    agents. We introduce OpenKAGE, an agent-group evolution framework for open-ended lifelong learning. Within this
    framework, agents autonomously explore open worlds and continually acquire new capabilities by accumulating
    and reusing knowledge from their own interactions and the experience of others. OpenKAGE builds on two key mechanisms:
    (1) a two-layer knowledge representation, with a memory layer for situated memories and an experience layer
    for transferable experience and skills that retains the applicability conditions needed for reuse; and (2) a
    knowledge-sharing mechanism that semantically consolidates textual experience into a continuously evolving shared
    knowledge graph, while executable skills are shared verbatim. In Minecraft, OpenKAGE supports open-ended lifelong
    learning, enabling agent groups to sustain exploration and reach advanced technological milestones. Furthermore,
    the accumulated knowledge can be transferred to a newly initialized agent group on a different backbone model,
    improving its survival and exploration progress.'
