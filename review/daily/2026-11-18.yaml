- id: arxiv:2611.23702
  title: 'KnowMe Paper Radar: Lightweight Discovery of Promising Papers in the Age of Autoresearch'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
