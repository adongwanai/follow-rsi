- id: arxiv:2611.23890
  title: 'EVA-RSI: Recursive Self-Improvement of Video Evaluators for Judging Temporal Quality'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2611.23890'
  version: 1
  source_hash: 156476b634752453b710295c486b3a2b64e4165a79fcf456500fcbbfc42ebb0f
  published: '2026-11-18T05:41:49Z'
  updated: '2026-11-18T05:41:49Z'
  hf_daily_dates: []
  abstract: 'Video evaluators play an important role in video generation, yet they miss motion defects, limiting
    the quality of generated videos. Recursive self-improvement (RSI) has made strong progress in mathematics and
    coding, where explicit verifiers provide reliable feedback on a single goal. Video evaluation poses two difficulties
    for RSI: it has no verifier, and it must judge many dimensions at once, such as physics, smoothness and dynamics,
    where a gain on one can cost another. We introduce EVA-RSI, a multi-agent framework for exploring RSI under
    these two constraints. We build a fixed proxy exam with construction-defined targets by applying controlled
    changes to videos, such as temporal reversal and frame dropping. These edits supply supervision without human
    annotation. A small set of human-labeled real videos anchors the exam to human judgment. Each dimension has
    an LLM agent that proposes improvements. A leader agent coordinates the proposals, and a Nash bargaining rule
    selects updates that balance progress across dimensions. Humans design the exam, review candidate changes and
    revise the curriculum between stages. Starting from Qwen3-VL-8B, EVA-RSI improves motion evaluation, with the
    largest gain on smoothness, and the gains carry over to defect types never seen during the run. On the dynamics
    subsets of public benchmarks, our evaluator achieves the highest observed scores among 21 tested models. As
    an RL reward, it increases generated motion and earns human preference. A data-selection pipeline incorporating
    it also increases motion.'
