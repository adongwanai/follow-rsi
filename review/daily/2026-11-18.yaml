- id: arxiv:2611.19800
  title: Multi-Branch Transformer
  announced: '2026-11-15'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.19800'
  version: 1
  source_hash: 53c4a66881ba89dd0a10b256e387f3504b4dc5f49f177520e955b7f19a6d9f3f
  published: '2026-11-15T05:20:54Z'
  updated: '2026-11-15T05:20:54Z'
  hf_daily_dates:
  - '2026-11-18'
  abstract: 'Transformer language models are commonly scaled by making their blocks wider or stacking them deeper.
    In this work, we explore a complementary path: branching, the parallel composition of full Transformer blocks.
    We introduce the Multi-Branch Transformer (MBT), which processes the input through shared initial layers, executes
    independently parameterized branches of sequential blocks in parallel, and fuses their outputs before shared
    final layers. At comparable training compute, we study three MBT variants: Wide-Shallow preserves block width,
    Narrow-Deep preserves sequential depth, and Balanced interpolates between them. In controlled pretraining experiments
    at four mixture-of-experts scales (0.8B to 2.1B total parameters), 2-branch Wide-Shallow MBTs consistently outperform
    sequential Transformers under matched parameter and training-compute budgets. Balanced MBTs improve further
    and retain comparable quality as the number of branches increases. To improve inference efficiency at long contexts,
    we introduce Joint-KV, which constructs a shared KV cache from branch representations at each depth. Our final
    recipe combines Balanced MBTs with Joint-KV, supported by an inference engine that exploits branch grouping
    and shared-cache reuse. Fitted scaling curves indicate that standard Transformers require up to 1.26x as much
    training body compute to match our final models'' validation loss. These models reduce full-model KV-cache storage
    by up to 34% and deliver up to 51.4% higher decoding throughput on a single H200 GPU. Ablation studies show
    that branching yields gains beyond changes in width and depth, enables an effective KV-sharing strategy (Joint-KV),
    remains robust across fusion functions, and performs best in the middle layers. These findings show that branching
    offers a practical path for scaling language models toward both better modeling quality and faster inference.'
