- id: arxiv:2611.20321
  title: 'Unreasonable Confidence from Simulator Misspecification: Directional Robustness on the SPEED+ Sim-to-Real
    Benchmark'
  announced: '2026-11-15'
  window_status: in_window
  in_repo: false
