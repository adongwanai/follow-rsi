  updated: '2026-11-17T18:57:10Z'
  hf_daily_dates:
  - '2026-11-18'
  abstract: 'LLM agents increasingly drive their own learning. Self-improvement methods delegate various components
    of model optimization to the models themselves. As models become more capable, this motivates a basic question:
    do these increasingly capable models still need us to specify how they should self-improve? In this paper we
    study an autonomous paradigm in which, given basic primitives, resources, and a general goal for self-improvement,
    agents construct their own self-learning algorithm for context-based optimization. Using the setting of gameplay
    as a testbed, a frozen LLM agent is given a compute budget and tools for collecting experience and updating
    text documents, and allowed to freely experiment without an externally imposed loop or access to real-world
    data. We find that sufficiently capable models do self-improve under these conditions, demonstrating strategies
    that align with classic cognitive frameworks for self-regulated learning and constructs from machine learning
    literature on self-generated curricula. Furthermore, we study the extent to which the learned text artifacts
    transfer to external benchmarks, observing improvement across different game horizons, mechanics, and 3D navigation.'
