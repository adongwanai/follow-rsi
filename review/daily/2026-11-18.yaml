- id: arxiv:2611.23847
  title: 'Great Listeners, Poor Decision-Makers: Rethinking Agentic Audio AI'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
