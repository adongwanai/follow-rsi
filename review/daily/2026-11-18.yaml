  updated: '2026-11-20T05:20:30Z'
  hf_daily_dates:
  - '2026-11-18'
  abstract: 'Kernel optimization is essential for efficient large language model (LLM) training and inference on
    Ascend NPUs. Existing Ascend kernel benchmarks primarily focus on kernel generation, with less emphasis on the
    ability of agents to optimize existing implementations under input configurations drawn from real workloads.
    To address this requirement, we introduce AscendGYM, a benchmark whose initial suite comprises 48 kernels across
    three difficulty levels. Each kernel is paired with test cases whose data types and tensor shapes are collected
    from real-world training and inference tasks. Consequently, performance improvements on AscendGYM map directly
    to the corresponding workloads. In terms of usability, two evaluation modes are supported in AscendGYM: model
    evaluation and model-harness evaluation. The kernel optimization capabilities of both trained models and custom
    agents are allowed to be measured. It provides a complete execution environment that closely reproduces how
    Ascend kernels are invoked in practical pipelines. For model evaluation, it additionally includes a built-in
    harness equipped with search orchestration and experience accumulation. Finally, we propose a new metric, the
    Speedup-Token Score (STS), which quantifies performance gains relative to token cost. By jointly considering
    speedup and cost, STS enables the assessment of practical kernel optimization capability of a model or harness
    under an acceptable budget. AscendGYM is available at https://github.com/SLAI-AITP/AscendGYM.'
