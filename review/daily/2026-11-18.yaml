- id: arxiv:2611.24422
  title: Resolution as Attention for Efficient Agent Memory Perception
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.24422'
  version: 1
  source_hash: c60afaba51854e1334160cbf934b1754ed5990f2141b012e3a79edb7c2a448f9
  published: '2026-11-18T13:43:16Z'
  updated: '2026-11-18T13:43:16Z'
  hf_daily_dates: []
  abstract: LLM-based agents accumulate extensive interaction histories when solving complex, long-horizon tasks,
    making efficient memory management critical to their performance and scalability. While existing memory management
    methods primarily focus on what to retain or retrieve, they often overlook how much perceptual detail should
    be allocated to individual past interactions. We posit that effective agent memory depends not only on the information
    preserved, but also on the granularity at which each past interaction is perceived. Motivated by this insight,
    we propose Resolution as Attention (RAA), a memory perception mechanism that uses visual resolution as a means
    of attention allocation across interaction histories. RAA renders past interactions as images and dynamically
    adjusts their resolution at every step according to their relevance to the agent's upcoming decision, preserving
    fine-grained information for critical interactions while reducing visual-token consumption for less relevant
    ones. To adaptively determine the perceptual fidelity of each interaction, we train a lightweight relevance
    estimator with teacher-model guidance and further optimize it to preserve the agent's decision consistency at
    a reduced visual-token cost. Experiments across multiple tasks and backbones show that RAA reduces token consumption
    by over 50% without compromising task performance. Moreover, RAA can be integrated as a plug-in perception layer
    with existing memory management methods, yielding further token savings and revealing adaptive perception as
    a complementary dimension of agent memory.
