  source_hash: 40cc9fc80d897f607dda820020616c2f01a11aeb677f518d7230df3afa1d7566
  published: '2026-11-18T13:29:44Z'
  updated: '2026-11-18T13:29:44Z'
  hf_daily_dates: []
  abstract: Improving the efficiency of training and inference infrastructure is a practical component of recursive
    self-improvement. Existing benchmarks for agent-driven optimization largely focus on individual software layers
    such as kernel, leaving unclear whether agents can deliver end-to-end performance gains under production workloads.
    We introduce RSIBench-Infra, a benchmark of 20 training and inference tasks spanning diverse model families
    and modalities, with deployments of up to 32 accelerators on NVIDIA GPUs and Ascend NPUs. Agents start from
    runnable baselines derived from official recipes and can modify the software stack across engine, kernel, and
    instruction levels. An OCI image-layer submission protocol captures these changes for reproducible deployment,
    while independent evaluation measures end-to-end performance under task-specific quality constraints. Across
    all task results, 66.2% exceed $1.10\times$ validated speedup. These results demonstrate that current agents
    can improve production-scale training and inference performance, but identifying effective optimization strategies
    and consistently translating local improvements into end-to-end gains remain challenging.
