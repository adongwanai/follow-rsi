  updated: '2026-11-17T17:59:42Z'
  hf_daily_dates:
  - '2026-11-18'
  abstract: Robot manipulation videos provide a rich visual experience, yet recovering robot action and gripper-state
    annotations from RGB observations still remains challenging. Using the embodiment-agnostic tool-center-point
    (TCP) pose as the action space, we present TCP4D, a unified model in which a shared 4D scene representation
    both tracks observed TCP motion and generates future TCP trajectories. Given a monocular video and initial 2D
    TCP queries, the tracker directly recovers metric TCP poses in SE(3) and gripper states alongside scene geometry
    and camera parameters. The generator samples local features from the same 4D representation along the recovered
    TCP tracks, then combines them with robot observations and language instructions to predict future TCP states.
    Our new cross-embodiment augmentation pipeline converts existing RGB videos into demonstrations for alternative
    embodiments by retargeting the recovered motion and synthesizing the corresponding observations, without recorded
    source-robot states. Experiments show that the tracker achieves absolute trajectory errors of 7.60 and 16.07
    mm on DROID and RoboLab and adapts to a new embodiment with only ten demonstrations. The generator achieves
    69.19% mean success on RoboTwin and outperforms well-established policy models on two real-world tasks, while
    joint training on source and augmented demonstrations improves target-robot success by 41.5% over augmented-only
    training.
