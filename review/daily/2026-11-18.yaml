- id: arxiv:2611.17048
  title: 'Beyond Answering: Learning to Speak First and Act in Streaming Video'
  announced: '2026-11-12'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.17048'
  version: 2
  source_hash: fe5d20ed009f690447f0a32162d255283c567e0672d902e23b14c9dde0387218
  published: '2026-11-12T16:31:54Z'
  updated: '2026-11-15T02:23:24Z'
  hf_daily_dates:
  - '2026-11-18'
  abstract: Most AI assistants respond only when prompted, remaining silent even when events in the video stream
    offer meaningful opportunities for conversation. To move beyond purely user-driven interaction, we present AURA
    2.0, a streaming video large language model that introduces three core upgrades to AURA. The key advance is
    Model-Initiated Conversation (MIC), which enables the model to identify topics worth discussing in the evolving
    visual stream and initiate conversations at appropriate moments without a user query. Stream-Aware Tool Calling
    (SATC) lets the model act on what it sees by invoking external tools using the current visual and conversational
    context and incorporating returned information into the ongoing interaction. Interactive Visual Grounding (IVG)
    supports visual grounding in both user inputs and model outputs. The model can identify objects marked by users
    on video frames and produce frame-aligned bounding boxes to link its responses to specific objects and regions.
    To develop these capabilities, we construct a dedicated streaming interaction dataset and adopt a three-stage
    training scheme to integrate the new behaviors with AURA's existing streaming interaction abilities. We further
    incorporate Long-Horizon Interaction Memory (LHIM) to maintain contextual continuity over extended video streams.
    Evaluations on public streaming benchmarks show that AURA 2.0 achieves leading performance among open-source
    streaming models, while targeted evaluations further validate its new interaction capabilities.
