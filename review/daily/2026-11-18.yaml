- id: arxiv:2611.12069
  title: 'MPEG-Diffusion: Mixed-Resolution Video Generation'
  announced: '2026-11-09'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12069'
