  source_hash: da63501dee5c5a6f6fa1278aa664877f78e39817918613c4c0e26ae25c2277d9
  published: '2026-11-09T08:43:56Z'
  updated: '2026-11-09T08:43:56Z'
  hf_daily_dates:
  - '2026-11-18'
  abstract: 'Video diffusion transformers (DiTs) generate realistic videos, but their heavy computational cost limits
    broader real-world applications. Mixed-resolution generation reduces this cost by generating the visually important
    region at high resolution (HR) and the rest at low resolution (LR), yet existing methods suffer a severe quality
    drop on videos and require knowing the HR region in advance. We show that these failures are not inherent to
    mixed resolution, and propose $\textbf{MPEG-Diffusion}$ to address their three root causes: (1) dual-resolution
    attention to mitigate the curse of mixed resolution, where each query reads the K/V of its own resolution, (2)
    a mixed-resolution decoder to blend the HR and LR latents before decoding and resolve distortion, and (3) a
    self-selected HR region using the DiT''s knowledge to find the visually important region without requiring it
    in advance. Processing only $30\%$ of full-resolution tokens, MPEG-Diffusion speeds up denoising by $4.8\times$
    on Wan2.1 14B ($3.8\times$ on 1.3B), outperforming prior methods on nearly every metric. In the user study,
    we demonstrate the high quality of MPEG-Diffusion, with raters preferring it over prior mixed-resolution methods
    in over $90\%$ of pairs and rating it close to full resolution.'
