- id: arxiv:2611.21925
  title: 'DNeo: Your Parallel Draft Model Needs Better Target Feature Encoding'
  announced: '2026-11-16'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.21925'
  version: 1
  source_hash: 0e039a7a1cc6b03db2fc6def46aee21096815ded0e53abf05416d7f10a8e32fd
  published: '2026-11-16T21:41:20Z'
  updated: '2026-11-16T21:41:20Z'
  hf_daily_dates:
  - '2026-11-18'
  abstract: 'Speculative-diffusion decoding uses a small parallel drafter model to generate b draft tokens in one
    forward pass, which then undergo parallel verification via a larger target model. Faster inference can be achieved
    when multiple draft tokens pass verification simultaneously. Recent parallel draft architectures (DFlash, DSpark)
    improve draft quality by conditioning on rich features computed by the target, through a mechanism known as
    feature encoding. However, standard feature encoding mechanisms have three limitations: (1) they are lossy,
    applying encoding projections that are destructive to the underlying target feature-space via a discovered effect
    known as residual mixing, (2) they are memory-less, with no record of previously processed proposals, and (3)
    they utilize features sampled uniformly from across the target layers, omitting important hidden states. To
    address these issues, we propose Mixture-of-Features Attention (MoFA), a lightweight feature-encoding approach
    equipped with a working memory that encodes previously rejected proposals. Leveraging MoFA, rejection memory,
    and a set of further enhancements, including 2-tap causal convolutions, prefix-only cross-attention, and non-uniform
    target layer selection, the final architecture, DNeo, achieves 1.3x faster generation speed than SoTA (DFlash-2)
    without impacting drafter footprint or generation quality. DNeo marks a new state of the art in high quality,
    fast LLM inference.'
