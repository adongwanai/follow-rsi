- id: arxiv:2611.23108
  title: 'FMT: Lossless Image Compression in a Fixed Number of Parallel Steps'
  announced: '2026-11-17'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.23108'
