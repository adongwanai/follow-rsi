- id: arxiv:2611.23855
  title: 'RoboBuilder: Agentic Robot Co-Design with Real-world Video Feedback in the Loop'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.23855'
  version: 1
  source_hash: 867abf844ae4a6302e019c3f0e81263afceccf224a036c721caf44b91bfc5e69
  published: '2026-11-18T05:02:07Z'
  updated: '2026-11-18T05:02:07Z'
  hf_daily_dates: []
  abstract: 'Can AI agents design robots that work in the real world? We introduce RoboBuilder, a benchmark in which
    coding agents co-design a robot''s hardware and program from standard parts, motors and a custom 3D-printed
    part, and every design that passes in simulation is built and tested on a physical course. Simulation alone
    is not enough: under public part data, none of 15 initial passing designs crossed the real course, so an agent
    learns the simulator from measurements it requests and videos of real runs. Across four frontier coding agents,
    ten obstacles at three difficulty levels, 16,427 simulations of 12,774 distinct robots and 135 physical robots
    built in an estimated 240 hours, agents solve nearly all easy obstacles and invent mechanisms our search baselines
    do not reach, but falter at harder levels, when one robot must cross every obstacle, and in the real world,
    where 66% of simulated passes hold across all levels. Closing the loop helps: shown a video of its real failure,
    an agent redesigns the robot, sometimes correcting its simulator, and removes 72% of level-1 and level-2 failures.
