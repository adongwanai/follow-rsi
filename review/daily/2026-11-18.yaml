- id: arxiv:2611.24590
  title: 'Think Offline, Act in Real Time: Self-Improving Visual Game Agents through Code'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.24590'
  version: 1
  source_hash: ec8ab420b87753ca1ba94a7bf010938cc4dfdbf3f1614990cce6d96af5e483a0
  published: '2026-11-18T15:18:22Z'
  updated: '2026-11-18T15:18:22Z'
  hf_daily_dates: []
  abstract: 'Pre-trained models can read screens and reason about games, yet on an unfamiliar game, an agent still
    has to learn to play. We ask how an agent can self-improve on such a game from a few of its own attempts, in
    real-time visual games where the agent sees only the screen and the game keeps running while the agent thinks.
    We study two kinds of policy that can carry this improvement. In model as policy, a model selects actions during
    play; we adapt real-time chunking so that committed actions keep executing while the model reasons, and train
    a 2B controller for this interface. In code as policy, a model writes, tests, and revises a program between
    attempts, and the program acts during play. Across 170 GameWorld tasks, with at most eight one-minute executions
    per run, code as policy reaches 47.80% mean progress, against 30.90% for our trained controller, and leads in
    all five game categories. Improving the controller''s weights on a single game, by contrast, yields only modest
    gains. These results favor letting a model think offline and storing what it learns in a program that acts in
    real time. Project repository: https://github.com/TabibitoQZP/SIGame'
