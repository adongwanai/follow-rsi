  published: '2026-11-18T01:47:31Z'
  updated: '2026-11-18T01:47:31Z'
  hf_daily_dates: []
  abstract: The growing volume of topically similar papers makes it difficult to identify new work that can offer
    useful research insights or methodological guidance. We present KnowMe Paper Radar, a lightweight discovery
    tool that combines multiple sources of evidence into personalized reading priorities. Users specify topics,
    priorities, exclusions and dates; the system brings together topical relevance, recency, author research histories,
    collaboration paths and direction-specific institutional context. By exposing each score component and its supporting
    sources, KnowMe helps readers select promising papers for their current questions and discover relevant work
    beyond familiar authors. Automatic acquisition, version merging and graph-cache reuse keep this workflow convenient
    without large language model (LLM) inference during ordinary use. Experiments on 174,640 acquired records show
    more than threefold faster repeated context preparation, while cached abstracts improve normalized discounted
    cumulative gain at rank 10 (NDCG@10) from 0.412 to 0.598 on expert-judged retrieval tasks. Complementary analyses
    examine how the same accumulated records support semantic retrieval, research-history modeling and literature-grounded
    planning. A browser interface and a structured command-line interface (CLI) make these capabilities available
    to both researchers and research agents, positioning KnowMe as a practical upstream tool for literature-informed
    recursive self-improvement (RSI) workflows.
