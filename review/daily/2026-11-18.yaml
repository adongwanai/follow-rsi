  source_hash: af211eefd7e34a590c2f7ee672de6d2a6786569d0e9f06f35169182da8244bb6
  published: '2026-11-18T04:52:13Z'
  updated: '2026-11-18T04:52:13Z'
  hf_daily_dates: []
  abstract: 'Audio artificial intelligence (AI) now recognizes speech, sounds, and music remarkably well, yet voice
    agents still act when they should not: they execute commands addressed to others, act on misheard content, and
    commit before the user finishes speaking. This position article argues that the bottleneck in agentic audio
    AI has shifted from recognition to decision-making. We propose a reference architecture with an explicit decision
    layer, separate from perception and reasoning, that chooses whether to act, wait, ask, or remain silent from
    evidence on addressedness, speaker identity, content confidence, tool reliability, utterance completeness, and
    action risk. We motivate the design through six recurring decision failures and a decision-theoretic argument
    that transcript confidence alone is insufficient to justify an action. We implement the layer with fuzzy inference,
    evolutionary optimization, and sequential decision-making, and evaluate it through simulations, ablations, and
    recorded audio, including egocentric recordings. Addressedness and speaker evidence matter most, risk-aware
    gating suppresses costly errors, and well-tuned policies perform similarly, with fuzzy gates more robust to
    overconfident addressedness estimates. On recorded audio, explicit gating cuts executed side talk from 41\%
    to 7--10\% while serving 83--85\% of valid requests under successful clarification, outperforming prompting-based
    baselines. These results support explicit action gating as an architectural requirement for reliable voice agents.'
