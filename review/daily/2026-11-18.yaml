- id: arxiv:2611.24924
  title: 'Agentic Harness Engineering Beta: Requirement-Centered Evolution of Agent Harnesses'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.24924'
  version: 1
  source_hash: 7f2146915962aee8010b4fcea23d39c9533b8b9c4417d890128de6f5319493b0
  published: '2026-11-18T18:52:13Z'
  updated: '2026-11-18T18:52:13Z'
  hf_daily_dates: []
  abstract: 'Real-world harness engineering is driven by explicit and implicit user requirements, which guide development
    and validation. However, existing harness evolution methods often overlook implicit requirements and interaction
    needs, while using a single evolution agent to modify the harness and benchmark scores to select changes. This
    process often produces narrow patches and leads to benchmark-specific local optima. We introduce Agentic Harness
    Engineering Beta (AHE-Beta), a requirement-centered loop that brings real-world engineering practices into harness
    evolution. The loop consists of three steps: (1) User-driven evaluation lets simulated users raise their requirements
    as issues while they work with the harness over multiple turns. (2) Team-based modification implements those
    requirements as generalizable changes rather than task-specific patches. (3) Requirement-driven selection merges
    a change only when it resolves a verified requirement and passes review. Empirically, on held-out tasks, AHE-Beta
    raises pass@1 from 21.9% to 33.3% while using 40.8% fewer tokens than Base Harness, and achieves higher pass@1
    than Claude Code, Meta-Harness, and AHE. In a blind human A/B test, real users prefer AHE-Beta in 31 of 48 valid
    pairs and rate it higher on all five dimensions, matching the directional preference of the user simulator.
    The human A/B results show that AHE-Beta achieves its goal of aligning harness evolution with real-world user
    requirements. Without further evolution, the gains transfer to GLM-5.3 and DeepSeek-V4.1-Flash with pass@1 improvements
    of 15.8% and 5.3% over Base Harness. Together, these results show that requirement-centered harness evolution
    is a more general method for improving agent capabilities.'
