  abstract: Visual foundation models are central to physical intelligence, yet their development remains constrained
    by fragmented training datasets, inconsistent annotation quality, and limited multimodal supervision. To address
    these challenges, we introduce GameRealm, a large-scale, richly annotated dataset that grounds visual observations
    in synchronized, game-native supervision. GameRealm encompasses over 120 million RGB frames and 1,000 hours
    of gameplay footage across all views. Beyond its unprecedented scale, GameRealm provides rich multimodal supervision,
    including metric depth, camera parameters, synchronized audio, control inputs, and 3D point trajectories. Its
    diversity further extends to flexible view configurations, spanning single-view, stereo, multi-view, and panoramic
    recordings. To enable scalable acquisition across diverse game environments, we develop a unified data collection
    pipeline that combines human-operated interaction with agentic exploration. Extensive experiments across diverse
    visual learning tasks demonstrate that GameRealm consistently strengthens visual foundation models in both visual
    generation and geometric learning. These results establish GameRealm as a versatile and valuable data resource,
    unlocking new opportunities for advancing visual intelligence.
