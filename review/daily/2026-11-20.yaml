- id: arxiv:2611.26627
  title: RL Post-Training in Diffusion Transformers Is Activation Steering
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.26627'
  version: 1
