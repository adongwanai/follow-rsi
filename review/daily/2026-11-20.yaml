  source_hash: 8426dd96d8fd99d9de8120b67eebc0d37998194d038cb745215f536a3fe305bc
  published: '2026-11-19T17:57:59Z'
  updated: '2026-11-20T11:55:50Z'
  hf_daily_dates:
  - '2026-11-20'
  abstract: Task success alone does not specify which behaviors post-training should reinforce. Even successful
    teacher trajectories can contain unsupported assumptions, unproductive repetition, or superficial verification.
    We propose Skill-FT (Skill-Guided Fine-Tuning), which uses natural-language skills to suppress undesirable habits
    and elicit underrepresented effective behaviors during teacher rollouts, then fine-tunes a student model on
    the resulting trajectories. We introduce AutoMaster, an autonomous post-training system in which an LLM agent
    develops these interventions through trajectory analysis, skill design, data selection, and feedback from rollouts
    and evaluation. Across Terminal, Search, and software engineering tasks with 4B and 9B student models, AutoMaster
    improves mean performance over Vanilla SFT on successful unguided teacher trajectories by 1.42-8.99 percentage
    points, with the teacher, task pool, training set size, and SFT recipe held fixed. Together with the ablations
    and trajectory analyses, these results suggest that behavioral shaping can make a fixed model a more effective
    teacher. We further find that retaining skill instructions during SFT yields higher mean performance than removing
    them across all six settings, despite their absence at evaluation and identical supervised outputs. These findings
    suggest that preserving skill context as part of a training demonstration can support better behavioral internalization.
