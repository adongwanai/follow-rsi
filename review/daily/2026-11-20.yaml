- id: arxiv:2611.21885
  title: Language Models Can Rewrite Their Own Weights
  announced: '2026-11-16'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.21885'
  version: 2
  source_hash: 5907748d14a520486c04dff97371c43ac5fe0db5c397b492f11b0c62368c9b4a
  published: '2026-11-16T20:55:08Z'
  updated: '2026-11-18T08:57:59Z'
  hf_daily_dates:
  - '2026-11-20'
  abstract: 'A language model is trained once and frozen. Making it better takes another training run, or a prompt,
    a harness or extra computation at inference that is gone once the task ends. We show a third way: to our knowledge
    for the first time, a language model rewrites its own weights by its own reasoning and becomes better, with
    no gradients and no training. We call this self-rewriting: the model is its own optimizer. In earlier work,
    a frontier model edited a much smaller one; here an open 27B model, given its weights, its graded answers and
    the ability to run itself, diagnoses its own failure and rewrites the weights behind it. It surpasses itself:
    its own edit makes it 6.6 points more accurate on problems it never saw. It keeps getting better: it tests its
    edits on practice problems and submits only what works, each edit improving on the last, and over eight consecutive
    sessions its accuracy only rises. It repairs a damaged copy of itself, like a broken robot that fixes itself
    without being rebuilt: the copy solves almost nothing, yet with no retraining and without ever reading the original
    weights, the model brings it back to over 80% of the original accuracy on image tasks it never saw. And the
    ability emerges with scale: in one model family, the smaller models make no edit or break themselves, and only
    the largest improves and repairs itself. Unlike test-time scaling, self-rewriting writes its gain into the weights,
    at no cost per answer; unlike training, it runs only forward passes, as serving does. The wall between training
    and inference is a limit of our tools, not a property of intelligence. We believe self-rewriting is a necessary
    step toward recursive self-improvement: a model that, like a human, does not separate training from inference
    could keep upgrading itself for life, with no larger model, no harness or prompt engineering, and no pre- or
    post-training.'
