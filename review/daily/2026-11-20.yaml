- id: arxiv:2611.26510
  title: 'AutoMaster: Autonomous Post-Training by Making the Same Model a Better Teacher'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.26510'
