    OpenAI models were already doing quite well. Astra in particular comes up with almost all of the relevant strategies
    very quickly and with low variance, leaving less room for communication to be valuable. Anthropic models have
    much more variance on this task, with individual rare rollouts scoring significantly higher. OpenAI models talk
    much more but talk to each other much less. They tended to use the forum primarily as an update board, posting
    exactly what they were doing with very high frequency in threads that only they were reading or writing to.
    Data Figure 66: OpenAI agents answer their own posts far more often Swarms appear sensitive to how they’re configured
