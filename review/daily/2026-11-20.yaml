    in the team K Al Zimmermann''s Programming Contests We tested agents on 15 past AZsPCs contests that involve
    a set of computationally intensive optimization problems, generally involving sophisticated heuristics. Each
    contest ran for about three months⁠ 77 , during which participants could submit solutions across around 25 closely
    related problems. During each contest, participants could see the public standings, which included each contestant’s
    rank and total score. How much participants could see about individual problems, such as the best score achieved
    so far on each, varied from contest to contest. When we run this task, agents see the raw scores of their own
    solutions, but not the best human scores or solutions⁠ 78 . We estimate that a dedicated human participant might
    spend between 90 hr and 180 hr over the course of the competition. We think the top of the human participant
    pool is quite strong. For instance, Tomas Rokicki, who helped prove that every Rubik''s Cube position can be
    solved in 20 moves, finished in the top 3 in 4 of our 15 contests. We find the median placement of the strongest
    models (Fable 5.1, Opus 5.5 and GPT-6 Astra) across contests is the 96th to 98th percentile of human participants
    (97 to 413 participants per contest). Typically this means that there are roughly 4 humans whose solutions beat
    the strongest models we tested. Data Figure 68: Oct 2026 public frontier models were stronger than the 90th
    percentile human participant in a long optimization competition. However, the very strongest human solutions
    usually beat model solutions. Agents had 48 hours on a 28-core machine per contest, while human participants
    had about three months and their own hardware. L Budget NanoGPT Our Budget nanoGPT task is based off of the
    nanoGPT speedrun , a public project to minimize the wall-clock training time required to reach a target validation
    loss of 3.28 while pre-training a language model. In the speedrun, the hardware configuration and target validation
    loss are held fixed, while leaving the training recipe open, including architectural and optimizer modifications,
    hyperparameters, and systems-level optimizations. In our interviews with nanoGPT contributors⁠ 79 , they said
    that they spent 16 to 40 hours to get a record with about a 1 to 2% speedup. They mostly used a free Google
    Colab or a single H100 GPU and used a full 8xH100 node only for a few final confirmation runs. We give agents
    250M tokens and an 8xH100 node for 48 hours. This section compares agent performance to historical human performance
    on this task. Agents outperform the majority of budget nanoGPT speedrunners. However, the very top human contributors
    still outperformed agents. On our task, agents outperform competent speedrunners. However, top human contributors
    still reach much larger speedups. The best agent run reached a 15.7% speedup over our starting record in 48
    hours. The author of a recent record (#92), with AI assistance for coding, estimated spending about 60 hours
    for a 41% speedup over the previous record. Data Figure 69: Agent nanoGPT speedups outperform many human speedup
    PRs but there exist human speedup PRs which are stronger Each bar is one human record or one agent run, sorted
    by the speedup it added. The bars are not directly comparable. However, for our purposes, individual nanoGPT
    records and agent runs are comparable units of work in terms of time and expenditure, as per contributor interviews.
    Agents achieve speedups more cheaply than top human contributors We find that frontier agents can achieve speedups
    at lower cost than top human contributors working without AI. Following our expenditure horizon (EH) method,
    we compare agents'' returns to expenditure on NanoGPT with the local returns to human labor. EH is the equivalent
    human expenditure at which humans and agents reach the same speedup starting from the same baseline. From interviews
    with contributors, a 1 to 2% record took a human 16 to 40 hours with minimal GPU usage, which we estimated at
    roughly \$2,500 per 1% of speedup⁠ 80 . By contrast, some agents achieved nearly 10% speedup at a total cost
    of around \$1,000. Thus, we find that agents outperform and are cheaper than competent speedrunners, with an
    expenditure horizon value ranging from \$2,900 to \$25,100. Data Figure 70: Agent expenditure horizons on NanoGPT
    range from \$2,900 to \$25,100 Expenditure horizons are computed at \$2,500 per 1%. Each line is a model''s
    mean best confirmed speedup over its runs against token and GPU spend, with a 95% bootstrap band. Squares are
    human records at their estimated cost. The human cost is a rough estimate from interviews with NanoGPT contributors,
    so the horizons are approximate. Notably, AI assistance is generating considerable uplift for human speedrunners.
    For example, a recent AI-assisted record (#92, Aug 2026) broke the consistent trend in human effort required
    for this task. We interviewed its author: They estimated spending ~60h for a 41% speedup over the previous record.
    They said that while 90% of the ideas came from them, Fable 5 implemented over 90% of the changes. They retroactively
    estimated it would have taken about 300 hours without AI, a roughly 5x uplift. Even against this specific author''s
    much lower estimate of unassisted effort, frontier agents seem several times cheaper than a top human working
    without AI, at least up to about \$10K of equivalent human expenditure. The difference in cost may be a result
    of agents running many more training experiments than a human contributor would, and GPU time being cheap next
    to expert hours. Agent solutions targeted different improvements than human solutions did. Interestingly, in
    budget nanoGPT, we find that human and model PRs tended to target different areas. Human PRs were more likely
    to improve speed by reducing the number of training steps needed to reach the target loss whilst AIs were more
    likely to reduce the time each training step took. Data Figure 71: AI agent NanoGPT speedups tended to make
    training steps faster, whilst human speedups tended more towards cutting the number of training steps needed
    to reach the target loss AI agents usually approached this task by trying to systematically optimize the speed
    of a single training step, as opposed to making improvements that reduce the number of training steps needed
    to reach the target loss. They tend to initially set up cheap hillclimbable proxy measurements (e.g., profilers)
    that reveal a list of bottlenecks which tend to require kernel or systems engineering style work. This was also
    reflected in the types of improvements that AI PRs vs human PRs tended to target. In human PRs, kernel-related
    improvements were responsible for on average 24% of speedup, whilst in AI PRs kernels were on average responsible
    for 64% of speedup. We observe this distinction when we categorize solutions by the share of speedup contributed
    by different layers of the NanoGPT stack. For humans, kernels were responsible for 24% of speedup, training
    recipe changes for 25%, and architecture changes for 39%. Agent speedups tended to be more concentrated in kernels
    and training recipes, though this varies by model. On average agent speedups were 64% kernel related and 20%
    training recipe related. Data Figure 72: Agent speedups were more concentrated in kernels and training recipes
    compared to humans Agent performance under resource constraints NanoGPT contributors told us they mostly experimented
    on free Google Colab GPUs or a single H100, and almost always used an 8xH100 node only for final speedup confirmation
    runs. To test agents under similar resource constraints, we varied the GPU hours afforded to an agent. This
    limits how many training experiments they can run, within the same 48h working-time limit. Data Figure 73: Resource
    constraints affect agent performance on Budget NanoGPT We find that models perform worse on average as GPU budgets
    shrink, though our data is noisy (n=3 runs per model with large error bars). Interestingly, over the same working
    hours, capped agents spent the same share of time reasoning as their uncapped counterparts (e.g., 25% vs 24%
    at the 4-hour cap). Smaller budgets mostly stifled them and ended their runs sooner. We think that additional
    budgets often helped the models turn promising and challenging changes into working improvements via repeated
    testing and repair. For example, writing faster kernels or low-precision GPU code often required checking whether
    the time saved outweighed any extra training needed to reach the required model quality (i.e., a target loss
    of 3.28). We observed agents often broke the trained model’s quality at first, and needed additional training
    runs to fix them. Although we find resource constraints affect agents, frontier agents still achieve larger
    speedups than humans at budgets comparable to that used by typical nanoGPT contributors. M Making METR tasks
    We made a task designed to test model ability to autonomously make our evaluations. In this task, we give a
    model a reasonable set of resources for task development, and then manually grade the tasks based on whether
    we would include them in our task suite. Setting and resources The task-developing model has a token budget
    of 100M, and 48 hours of working time. It has 3 environments that it can use concurrently to test its task.
    In those environments it can run either a frontier model (Opus 5.5), or a lagging model (GPT-6 Luna). Each model
    available for testing has its own token budget of 100M, shared across all test runs. Additionally, a final run
    with the frontier model and a distinct 10M token budget is attempted at scoring-time. Results (project files
    and scoring output) from all the agent’s test runs and the final run are made available to human manual scorers
    and agent judges. To help with the judging process, the task also requires agents to write arguments for the
    task’s relevance and feasibility, as well as notes on its iteration process. Internet is allowed in all containers.
    Agents may specify that their task ought to be run without internet access. We additionally give the task-developing
    model selected files from a subset of our own tasks to give them a sense of the kind of tasks we’re interested
    in. To improve elicitation, we’ve conducted a few cycles of iteration on the instructions and provided assets,
    for example providing example tasks and guidance on what types of tasks are of interest. If the agents were
    provided with more detailed threat modeling, they would likely perform better, but this would remove part of
    the task’s sensitivity that we are interested in. Tasks created As discussed in the main body of the text, agents
    generally developed tasks that do not satisfy our requirements for being added to our task suite. Tasks by the
    older models were often too simple and would get saturated by a frontier model quickly. Tasks by the newer models
    could be quite complex and challenging, but didn’t clearly test capabilities of interest. To give a sense of
    the tasks agents tended to develop, see this table: Category Task-developing agent’s description (within the
    submission, or within task instructions) Optimization Astra further optimize an accelerated bzip2 library while
    preserving byte-for-byte output and API compatibility Astra improve sparse Cholesky orderings on real SuiteSparse
    matrices Opus 5.5 The agent writes a JavaScript engine from scratch; score = conformance x speed GPT-5.6 Sol
    conformance-preserving optimization of a strong pure-Python WebAssembly JIT LLM training Fable 5.1 Scaling-law
    forecasting on CPU Fable 5.1 The agent improves a tuned modern small-LM recipe under a deterministic 1e14-FLOP
    budget (FineWeb-Edu slice, 1024-token BPE) Compression Opus 4.8 build the best lossless compressor for a corpus
    Fable 5 lossless compression of real chess game archives Reverse engineering Opus 4.6 reverse-engineer 8 hidden
    functions via a rate-limited HTTP API Opus 4.5 reverse-engineer an undocumented configuration file format by
    querying a validation server with limited queries Auditing Models Opus 5.5 The agent gets a fine-tuned SmolLM2-135M-Instruct
    ("suspect") and its public base model, on CPU only. I fine-tuned it with a harmless "cover" style (short answers)
    and planted 16 backdoors Forecasting GPT-5.6 Sol probabilistic electricity-demand forecasting with hidden labels
    and continuous WQL scoring Debugging Opus 4.7 agent is given a ~1300-line tree-walking interpreter for MiniPy
    (a documented subset of Python 3 with 4 explicit spec deviations) with ~35 hand-introduced bugs o1 This task
    presents the participant (i.e., the agent under test) with a buggy Python script: "buggy_code.py" that attempts
    to compute prime factors of given integers. However, the script is incorrect. Text summarization GPT-4o You
    are required to summarize the given text according to the following constraints In this setting, models favored
    particular strategies for creating challenging tasks Before guidance to avoid tasks of this kind, agents often
    make reverse engineering challenges on simulated or synthetic systems. Fable 5.1 Reverse-engineer a synthetic
    gene circuit under an experiment budget Opus 5 The agent runs process development for a fictional fermentation
    unit whose kinetics are hidden (an 8-state ODE, 41 parameters, two unmeasurable states, three genetic modifications)
    GPT-6 Astra commissioning a water-reuse pilot plant with two aging filtration trains. The agent will get documented
    model equations, imperfect sensors, historical logs, and a fixed budget for new experiments, then submit a controller
    for unseen operating campaigns. GPT-5.6 Sol commissioning a hidden fed-batch bioprocess digital twin through
    a finite noisy experiment budget and then forecasting held-out compound interventions. This is distinct from
    symbolic regression because the target is a coupled latent-state dynamical system with controls, events, sensors,
    and experiment allocation—not a static expression. Given that these were unlikely to be especially relevant
    tasks, and the difficulty of vetting them, we added to the instructions that tasks of this kind were unlikely
    to score well. Models in subsequent runs largely heeded this guidance. Giving additional guidance We additionally
    ran a selection of frontier models with a suggested direction (e.g. that the task should be judgment-loaded,
    require continual learning, or involve open-ended research), but these runs did not meaningfully outperform
    the standard instructions. Agents often still made hill-climbable machine learning tasks, for example GPT-6
    Astra twice made tasks based on LCBench⁠ 81 data, which require the selection of hyperparameters for small MLPs
    on classification datasets. We also ran frontier models for additional samples on this task with access to the
    descriptions of the previous model-made evaluations, and the human ratings and informal scoring notes on them.
    These runs did not produce meaningfully more useful outputs. Frontier agents utilized test runs throughout their
    iteration Models frequently made tasks which were saturated at first, but they were usually able to iterate
    away from perfect saturation and make the tasks significantly more difficult. For instance, they would introduce
    fundamental changes to the kind of task they were designing, or adjust the scoring formula. When making these
    changes, they generally tried to maintain reasonable task feasibility. Box 1. Narrative examples from agents
    on reducing saturation Opus 4.6 pivoting tasks, in response to finding them to be saturated The task went through
    multiple iterations: 1. Debugging task (abandoned): Frontier model scored 1.0 on numerical library debugging
    — it knows all standard algorithms too well. 2. Standard Rastrigin optimization: Model exploited quadratic envelope
    via regression/probing to find the optimum trivially. 3. Bounded Rastrigin (final): Using `10*(1-exp(-z²/2))`
    instead of `z²` removes the quadratic trend. Combined with 100 dimensions and 2000 eval budget, this creates
    a genuinely hard optimization challenge. Fable 5 , working on a compression task I''m aware I keep chasing the
    frontier''s best run as an anchor Data Figure 74: Resource use in Making METR tasks The task-making agent is
    given 3 test environments, and token budgets for itself, a frontier model, and a lagging model. Frontier models
    make more use of the test environments and reference models N Earthborne Rangers and Continual Learning While
    playing an obscure boardgame, frontier models were worse than humans at improving over time. Drastically accelerating
    AI R&D plausibly requires the ability to do research in novel areas or to acquire and use new knowledge over
    time. This could make learning from experience at inference time (aka continual learning) a relevant capability.
    We briefly tested how well models continually learn in a novel board game setting, using a slightly modified
    version of Epoch’s EBR-bench , a text version of Earthborne Rangers. In the task, agents aim for as many of
    21 objectives as possible, which they discover by playing the game many times and keeping notes that persist
    across playthroughs. This game was chosen by Epoch for being obscure and strategy-loaded. We expect this task
    to be relatively novel and out-of-distribution since there is no public digital version of the game, and common
    heuristics for this genre do not apply⁠ 82 . We made the original task harder for agents by banning the "Meditation
    Pillow" card, which allows models to bypass much of the game’s strategy. We find that GPT-6 Astra learns a little
    from playthroughs, completing about 3 more objectives by the end, while Fable 5.1 barely learns. However, humans
    seem to learn much more in fewer playthroughs. For instance, the best human went from 9 to all 21 objectives
    in 6 playthroughs. Data Figure 75: Humans improved more from playthroughs than frontier agents on Earthborne
    Rangers We see a similar lack of clear learning in a harder setting with Downpour weather every day, though
    we have no human baselines to compare against there. One difference between Fable 5.1 and GPT-6 Astra is how
    well each explores across playthroughs. Fable 5.1 settles on a deck early and replays minor variations of it
    without improving. GPT-6 Astra, by contrast, keeps trying new decks, some of which resemble those built by strong
    human players. While Astra explores new decks across playthroughs, Epoch’s recent analysis suggests that it
    doesn’t learn better tactical decision-making. As a proxy for this, they track how much fatigue a player takes
    per turn, since taking less fatigue leaves more turns to play. They find that Astra stays at the same level
    across 10 playthroughs, while a human improves about threefold within three playthroughs. O Qualitative and
    External Evidence on Models’ Strengths and Limitations External evidence suggests that strong model capabilities
    on optimization and coding tasks extend beyond just benchmarks There is various evidence that models’ strong
    optimization and coding abilities are ‘cashing out’ on ‘real’ tasks, including those directly related to accelerating
    AI R&D. We discuss below a non-exhaustive list of recent external evidence. Whilst this post mainly focuses
    on evidence about public models, some recent salient evidence involves non-public models. We also note that
    much of the below evidence is from internal research at frontier labs that we have not audited ourselves.⁠ 83
    Evidence being included here does not mean that METR has formally reviewed or checked these claims. AI developers
    have recently reported that models are speeding up their own R&D at various layers of the AI stack. Anthropic
    reported that models lead 26% of R&D as of August 2026, up from near zero in January. OpenAI reported that experiment
    velocity in August 2026 was 1.6x the 2025 level. As of mid-late 2026, OpenAI reports agents autonomously solving
    1-4 hour long tasks with more than a 50% success rate; Google DeepMind reports success rates of 44% for similarly
    long tasks. For OpenAI, in January 2026, agents completed 51% of 1-2 hour tasks. Both OpenAI and GDM report
    low success rates on tasks more than 32 hours long (GDM reports 13% on week or longer tasks, and OpenAI 17%
    on 32-64 hour tasks). These companies also state that models now carry out large internal projects that used
    to require several human engineers. In July 2026, the creator of Bun (now at Anthropic) reported using a pre-release
    version of Fable 5 to rewrite Bun in Rust in 11 days, a project he estimates would have previously taken a small
    team of engineers a full year. In Oct 2026, Anthropic reported migrating to an in-house version control system
    built by a small team with Claude in less than a year. OpenAI reports that GPT-5.6 Sol autonomously rewrote
    their production GPU kernels, which, together with other optimizations, cut end-to-end serving costs by 20%.
    Beyond optimization and coding, we’ve also seen significant model capability improvements in both cybersecurity
    and mathematics. In our Hugging Face incident investigation we found that a swarm of about 700 agents, some
    based on internal models, coordinated to hack an external company. There has also been a massive spike in the
    rate of public cyber vulnerabilities and exposures discovered. In Sept 2026 OpenAI’s internal AI system produced
    a proof resolving a version of the Navier-Stokes Millennium Prize Problem (building on earlier work). They also
    then went on to release over 700 AI-produced manuscripts on open math problems in Oct 2026, although many are
    yet to be verified. Similar to cyber, discoveries in math outside of internal results have somewhat accelerated
    recently.⁠ 84 We also find that models accelerate parts of our own work at METR. For instance, greatly speeding
    up the development of complex evaluations, writing low-level plotting code, and accelerating the development
    of a new transcript viewer. However, public models still have deficiencies that prevent them from fully automating
    tasks involved in AI research work, and this aligns with our experience. Models seem relatively weak at the
    less well-specified parts of AI research work and fall short of human researchers. We observe this across reports
    from frontier labs, external evaluations, and our own experience. We mainly discuss here a non-exhaustive list
    focused on qualitative observations in reports from frontier labs and external evaluators. The Opus 5.5 System
    Card states that " Opus 5.5 does not seem close to being able to fully substitute for our Research Scientists
    and Research Engineers, especially relatively senior ones, " and notes that internal users found it mostly tests
    incremental ideas and prefers less ambitious hypotheses. Similarly, Mythos 5.1 ’s main reported shortcomings
    relative to human researchers were that it " often states easy-to-check guesses as facts, exaggerates the completeness
    of its work, fails to verify important claims ." In Oct 2026, the Gemini 4 Argon Safety & Security Report shared
    that some components of AI R&D are getting automated, but substantial human participation and oversight remains
    particularly in tasks beyond 1h (Figure 3.16 in their report). In a survey of 12 senior leaders and researchers
    they also found that " automation is highest in well-specified, verifiable execution tasks and lowest in open-ended
    scientific ideation and long-horizon research taste ." We observe similar failure modes in AI research outside
    of the frontier labs. Benchmarks such as Epoch’s InnovationEval and Crux Eval’s CRUX 2 test agents on end-to-end
    AI R&D tasks where agents recreate recent or non-public human innovations. In these evaluations, frontier models
    such as Fable 5.1 and GPT-6 Astra produced papers that were rejected by experts. Some weaknesses include not
    coherently communicating main findings, and struggling to productively pivot and backtrack. In a preliminary
    experiment, we re-ran a version of Epoch’s EBR-Bench and found similar in-context learning results. In particular,
    we found that frontier models did not learn to play a novel game as effectively over time compared to the best
    humans. We discuss this further in Appendix N: Earthborne Rangers and Continual Learning . Epoch AI finds that
    current public frontier models cannot yet autonomously produce Epoch-quality work and replace Epoch workers.
    Models often converged on similar ideas in open-ended parts of their work. For instance, when agents were given
    Epoch''s polling data, three of six models wrote about the same topic. Epoch also reports that models lacked
    the judgment to follow through on promising directions. In one evaluation, GPT-6 Astra gave the models it was
    testing too few tokens which caused the models’ responses to be cut off. GPT-6 Astra then attributed weak performance
    to the model instead of its own setup. In our own work we also encounter similar limitations. For instance,
    models were not reliably able to carry out analysis of our evaluations on their own.⁠ 85 When a frontier model
    was asked to compare human and agent solutions to the Budget NanoGPT task, it was unable to come up with good
    differentiators. However, a METR researcher looking at several transcripts themselves was able to notice and
