  hf_daily_dates:
  - '2026-11-20'
  abstract: 'As multimodal large language models (MLLMs) become increasingly integrated into everyday life, their
    ability to provide safe and reliable assistance in realistic daily activities remains insufficiently explored.
    Existing safety benchmarks primarily focus on isolated harmful requests or adversarial scenarios, overlooking
    the safety risks that may arise as ordinary tasks unfold. In practice, users pursue legitimate goals through
    multi-turn, multimodal interactions, where seemingly benign requests may become safety-critical when considered
    alongside earlier actions and visual observations. This calls for Dynamic Safety Awareness, the ability to track
    evolving task conditions, recognize implicit contextual risks, and provide safe and helpful assistance. To systematically
    evaluate this capability, we introduce DailySafe, a benchmark comprising 195 naturalistic multi-turn, multi-image
    interactions across 10 everyday domains and 42 task categories. Grounded in authentic user dialogue topics and
    documented safety knowledge, DailySafe captures realistic scenarios where safety-critical evidence is progressively
    revealed across conversational turns and visual observations. Using case-specific safety annotations, DailySafe
    assesses whether MLLMs can recognize and appropriately address evolving risks while supporting users'' legitimate
    goals, bringing multimodal safety evaluation closer to real-world everyday AI assistance. DailySafe is publicly
    available at: https://github.com/XuankunRong/DailySafe.'
