    Baselining Our time horizon results, along with analyses that control for task length, depend on estimates of
    how long it would take a skilled human to reach a given score on a task. For most tasks in our original time
    horizon suite, we measured this directly by having skilled professionals attempt the same tasks we evaluate
    models on, under the same conditions. We call these attempts human baselines. Because our new tasks are far
    harder than those in our original suite, this was no longer feasible. It was often difficult to find qualified
    people who could commit the time, the cost of collecting these baselines was much higher, and models often outperformed
    even the experts we did recruit. For tasks in the new suite, we use researchers’ estimates of the time needed
    to reach a range of scores. For most of the tasks we have evidence from humans doing the same or similar tasks,
    but usually not in a dedicated, self-contained setup. We ran formal human baselines for three of our twelve
    task families, though for two of them we also relied on other sources of data and on extrapolation, as we describe
    below . The rest of this section covers our protocol for the formal baselines, how we recruited baseliners,
    and their results. We then explain how we produced human time estimates for each task. Baselining Protocol Each
    baseliner worked in a container identical to the one an AI agent is given, with the same information and resources.
    We avoided giving the baseliners guidance beyond what agents receive, so that humans didn''t have an unfair
    advantage. Baseliners were allowed to use Sonnet 5 for implementation, but we asked them not to rely on it for
    high-level decisions. This differs from TH1, where baseliners mostly couldn’t use AI.⁠ 61 We allowed AI assistance
    partly because many people now use AI in their work, and some people didn’t want to do baselines without it
    because the work would be too tedious. Another reason is that letting baseliners use AI makes baselines cheaper
    to collect, as they can spend more of their time on difficult work that requires their expertise and less on
    routine work. We didn’t allow access to a frontier model to ensure that human baselines were still mostly driven
    by human performance. We also let baseliners access the internet. We didn’t give baseliners hard time limits,
    though we did share a rough estimate of how long we expected the task to take. We also didn’t give them target
    scores or an indication of what strong performance would look like. Throughout the baseline, we periodically
    checked their progress and decided whether to have them continue. Baseliners were paid \$200–350/hr. We didn''t
    use bonuses for reaching performance milestones. However, the progress check-ins meant baseliners who wanted
    to keep working had some incentive to perform well. The table below summarizes how our protocol compares to
    TH1. TH1 TH2 Baseliner profile Professionals with ~5 years'' experience who passed a qualification task Task-specific
