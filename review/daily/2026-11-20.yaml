  updated: '2026-11-20T11:47:47Z'
  hf_daily_dates: []
  abstract: Frontier large language models (LLMs) have enabled vision-and-language navigation (VLN) through direct
    closed-loop perception and action. However, navigation performance depends strongly on the harness governing
    LLM-environment interactions, while existing harnesses largely rely on manually designed navigation tools, memory,
    and agent roles. We introduce NavRSI, a harness-centric recursive self-improvement framework that optimizes
    the navigation behavior of frozen LLMs through closed-loop experience. In each round, NavRSI iteratively collects
    navigation trajectories and failure diagnostics, employs a designer agent to rewrite the harness, and retains
    the revisions that prove effective, while the designer accumulates experience from previous revisions so that
    the harness and this experience co-evolve. Privileged simulator diagnostics guide only the designer and remain
    inaccessible to the navigating LLM, enabling deployment with a single RGB camera and primitive actions, without
    task-specific model training or additional navigation tools. Experiments demonstrate consistent improvements
    across LLMs from four vendors, with 85.64% success rate on the full R2R-CE val-unseen split with GPT-6-Astra,
    surpassing the previously reported best by 4.13%. Evaluations on RxR-CE, NavRAG-CE, and a real humanoid robot
    further demonstrate its generalizability.
