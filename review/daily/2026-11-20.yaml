- id: arxiv:2611.26540
  title: 'AURA: AUdio-dRiven streaming Avatar'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.26540'
  version: 1
  source_hash: 568c5156c95134bf575bb7394b817e79cc7d84c4175b6cfc81223c55530d1391
  published: '2026-11-19T18:17:38Z'
  updated: '2026-11-19T18:17:38Z'
  hf_daily_dates:
  - '2026-11-20'
  abstract: 'Current audio-driven video diffusion models can synthesize realistic talking-head videos but generally
    require dozens of diffusion denoising steps over multi-second video chunks, making them unsuitable for streaming
    applications such as voice assistants and virtual avatars, where low-latency and online causal generation are
    required properties. AURA generates video chunk by chunk with a rolling KV cache, requiring only the audio of
    the current chunk to start generating, rather than a multi-second audio look-ahead like bidirectional models.
    It comes in two sizes: AURA 1.3B streams 576p video in real time on a single GPU (20.7 fps for a 16 Hz playback
    rate), making it suited to interactive avatar applications, and AURA 5B streams 720p video at 9.7 fps. Our two-stage
    distillation pipeline first aligns the causal student with the teacher, by training it to match the teacher''s
    trajectories with fewer diffusion steps and a chunk-wise sliding window causal attention mask, then applies
    Distribution Matching Distillation (DMD) with backward simulation to close the remaining quality gap. On standard
    talking-head benchmarks, AURA 1.3B runs 23x faster than its own bidirectional teacher and reaches a quality
    comparable to TalkVerse at a lower resolution, and AURA 5B matches its TalkVerse teacher at 720p while running
    17x faster. To support reproducibility and further research on streaming avatar generation, we release the weights
    of both models along with a dataset of 30K synthetic videos and their precomputed teacher trajectories.'
