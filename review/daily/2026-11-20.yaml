  source_hash: e6522e8b04b44fcf41ff0050a27510c0997f5e14e33bd3f7f06283c4115c2cb0
  published: '2026-10-31T13:09:19Z'
  updated: '2026-11-14T13:18:44Z'
  hf_daily_dates:
  - '2026-11-20'
  abstract: Decision-making in humans and AI involves multiple cognitive abilities. System One decision models produce
    fast, structured choices. Their cognitive strengths and limitations, however, remain poorly understood. We introduce
    S1CogBench, a benchmark of 24 established cognitive tasks and 27 evaluation modes, evaluating seven open models
    and the API model Jev. It combines human-response prediction, autonomous execution, and controlled task manipulations
    to reveal strengths and failures that aggregate scores miss. We find distinct behavioral profiles across the
    evaluated models. In these models, strong performance on some learning tasks coexists with failures to gather
    information or adapt to feedback, while high accuracy does not guarantee human-like responses to changing task
    demands. Shared readout controls show that model rankings depend partly on how choices are extracted. Separate
    latency comparisons with generative language models show that long responses are much slower than direct decisions,
    whereas matched one-token generation adds little overhead. To our knowledge, S1CogBench is the first benchmark
    of System One decision models on established cognitive experiments. It provides a common empirical basis for
    identifying their capabilities and limitations before integrating them into automated decision systems.
