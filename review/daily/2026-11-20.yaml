- id: arxiv:2611.27780
  title: 'Search-RSI: Expanding Search Worlds Along Multimodal Agents'' Capability Frontier'
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.27780'
  version: 1
  source_hash: 2ce02d9d97b3940db1dd689e8fef563a96b790d436f1a2381c47ee7c8343992e
  published: '2026-11-20T16:09:46Z'
  updated: '2026-11-20T16:09:46Z'
  hf_daily_dates: []
  abstract: 'Multimodal search agents answer knowledge intensive visual questions by grounding them in retrieved
    evidence, and recent recipes train them on multi hop tasks that are synthesized from knowledge graphs and grown
    online to keep pace with the agent. These recipes, however, treat the searchable world as fixed: a new question
    can be well formed and verifiable while its evidence is absent from the retrieval backend, so the agent issues
    the right query, retrieves nothing, and is penalized as if its policy were at fault. Such unreachable negatives
    accumulate with every round of growth. We propose Search-RSI, a recursive self improvement framework that expands
    the search world along the agent''s capability frontier. In each round, the current policy diagnoses its partially
    mastered regions of a task space spanned by hop depth, relation rarity, and distractor density; new tasks there
    are grown together with their evidence; and the same policy decides how they are used: candidates on which its
    probes disagree feed reinforcement learning, while those beyond its reach become hint guided demonstrations
    of its own. Keeping the policy inside this loop matters: an improver frozen at the start of training loses 3.2
    points. On nine multimodal search benchmarks, Search-RSI keeps improving where static task growth saturates,
    raising the average accuracy of the recipe it builds on by 9.8 and 9.5 points at 9B and 27B, of which 7.0 points
    are out of reach for a world that is merely made consistent. The loop uses no external model and only privileged
    task structure that is removed before training, at 1.27x the compute of static growth.'
