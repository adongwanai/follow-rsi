- id: arxiv:2611.26444
  title: 'Mind2Act World: A Diagnostic Benchmark for Embodied Mind, Physical Action, and Mind-Action Composition
    in Robotic Manipulation'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
