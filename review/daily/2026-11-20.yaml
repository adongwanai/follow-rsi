  version: 1
  source_hash: 581696c8cf11bfd003bfe14e991ccefc64e7bf4aa850b84e638b24837b4e33d7
  published: '2026-11-16T16:44:07Z'
  updated: '2026-11-16T16:44:07Z'
  hf_daily_dates:
  - '2026-11-20'
  abstract: 3D Gaussian Splatting enables object-level operations on Gaussian primitives, yet existing segmentation
    methods are largely trained and evaluated through rendered views. This mismatch can produce accurate rendered
    masks from incomplete 3D selections since alpha-blended feature supervision concentrates learning on dominant
    contributors while leaving occluded or low-contribution Gaussians weakly supervised. We propose VODA, a plug-and-play
    supervision objective that exploits local depth structure to group per-pixel contributors and directly supervises
    all Gaussians in selected depth clusters, bypassing contribution-weighted gradient delivery. To evaluate volumetric
    completeness, we introduce Removal-3D, a synthetic object-removal benchmark, and the Removal Depth Error (RDE),
    a metric comparing predicted and ground-truth depth changes. Across four rendering-based baselines, VODA consistently
    improves volumetric segmentation on Removal-3D while maintaining or improving performance on LERF and ScanNet.
    Further analysis shows that VODA recovers lower-contribution Gaussians, while simple gradient reweighting and
    spatial propagation fail to reproduce comparable gains.
