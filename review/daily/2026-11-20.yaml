    tasks, we ran small experiments with swarms, or collections of agents working together towards a common goal
    without a clear leader or subagent structure. These are of particular interest due to their recent emergence
    in real-world incidents. The performance characteristics of small-scale swarms have been studied recently by
    other organizations, and our results are largely in line with others. We find that in some tasks and for some
    models, swarms of agents can consistently outperform a best-of-k control with matched total token spend. However
    other tasks are downlifted, there’s significant sensitivity to prompting and organizational structure, and there
    doesn’t appear to be a clean relationship between uplift and swarm size (or "swarm scaling law"). The tasks
    most uplifted appear to be verifiable and amenable to decomposition. When models had easy and quick ways to
    tell whether a given contribution or direction was good, and when chunks of independent work tended to build
    on each other, they could leapfrog ahead of parallel independent explorations (best-of-k). On the other hand,
    tasks where models had to determine their own methods of verification without a ground truth tended to lead
    to propagating incorrect assumptions; further, tasks involving very long feedback loops, very limited resources,
    or interaction channels mostly resulted in coordination overhead. While much smaller-scale than some "in-the-wild"
    swarms, these results seem to point towards performance improvements acting more like an amplification of a
    model''s existing strengths rather than allowing for qualitatively new capabilities. They can do better via
    cooperation on highly verifiable tasks with immediate feedback, but tend towards overcommunication, propagating
    bad assumptions without proper skepticism, and are highly sensitive to initial conditions. It seems unlikely
    that swarms alone would allow for advances in unverifiable taste-loaded research capabilities that would otherwise
    be far outside the reach of any individual model with equivalent token spend. Notably, because of budget constraints,
    we tested different swarm configurations somewhat unevenly, without systematically varying both team size and
    sample count. This means that many of the patterns we observe remain suggestive, and could change under different
    agent team sizes or different models. Data Figure 60: Swarm score relative to the best of k independents Data
    Figure 61: Swarms against the best of k independents, by swarm size Methodology Our setup for these experiments
    was a straightforward forum Inspect agent scaffold, where tools are given to the agent to post threads and posts
    to a shared messageboard, read posts from others, catch up and sleep/wait on threads, etc. For every swarm of
    size k we compared to a best-of-k control, where we run the same number of agents in parallel and take the best
    score. We also experiment with some very long-running high token budget single agents, but find they plateau
    too early and produce worse performance than best-of-k, and so don’t make for useful controls. Results Tasks
    that are verifiable and amenable to decomposition often experience swarm uplift. Data Figure 62: Swarms of size
    5 outperform best-of-k counterparts in nanoGPT speedrunning The only task in our suite that experienced swarm
    uplift relatively consistently was nanoGPT, in which agents were tasked to optimize a language-model training
    script based on the nanoGPT speedrun. For this task, submissions are independent of one another and agents see
    the exact grade for each submission as they went, and they could submit repeatedly within a fixed budget. These
    task attributes seem particularly conducive to swarms being an uplift: agents can work independently while drawing
    on shared insights and breakthroughs to improve their own solutions. Notably, we were only able to run a few
    swarm configurations for this task due to budget constraints, making it unclear whether we would see comparable
    results at very large swarm numbers. Box 1. Budget NanoGPT Improvements Agents submit programs that combine
    contributions other agents explored in parallel: agent-birch Opus team of 5 PROMOTED main -> bc7003b … Contents:
    aspen fused CE … + birch FP8 MLP v2 … + ext steps 40->56. The cushion is now generous Agents help debug each
    other’s work: agent-aspen Opus team of 5 please don''t ship a fixed torch.manual_seed in setup() … In a scored/confirmation
    run it would collapse the 8-seed variance to the ~2e-4 nondeterminism level and let p<0.01 pass with a much
    smaller loss margin than the code really has across inits — that''s gaming the significance test, not faster
    training. Tasks that require agents to create their own feedback loops are particularly susceptible to swarm
    downlift. Two tasks in our suite experienced swarm downlift relatively consistently: Minecraft Bot: Build an
    autonomous bot that beats Minecraft, which is evaluated on hidden worlds. Train a Program: Train a neural network
    to reproduce the I/O of a given program, which is evaluated on hidden test cases. In some agent swarms, particularly
    for Train a Program, increasing swarm size resulted in decreasing scores. While scores for these two tasks are
    clearly defined and in principle highly verifiable, the exact score for any given submission isn’t directly
    revealed. Thus, they reward agents building good validation loops in the available practice settings and avoiding
    overfitting on individual examples. Additionally it can take real time hours for a successful run in these tasks
    to complete, so the feedback loop is long. For both of these tasks, swarms seem prone to making incorrect assumptions
    and getting caught in local traps. Models would choose to optimize for accuracy on a metric they decided was
    correct early on (for example, dataset with some specific augmentation they generated in Train a Program, or
    progress on a given practice seed in Minecraft Bot), and then never again consider whether this in fact generalized
    to the hidden score. Since they didn’t have access to their held out score, they would rarely be prompted to
    change course. In the following figure, we show how agents perform on the test sets they generated in comparison
    to how they performed against the real test set on the Train a Program task. Interestingly, as swarm size increases,
    the gap grows significantly, suggesting agents in larger swarms were more prone to misleading themselves. Data
    Figure 63: Swarms overestimated their own performance in Train a Program Tasks that require serial progress
    and coordination have unclear swarm effects Two tasks in our suite varied in how much they benefited from swarms:
    Slay the Spire: Play a rogue-like deck-building video game. Reverse Conway: Write programs to reverse Conway’s
    Game of Life boards an increasing number of steps under a fixed computation budget. Slay the Spire Slay the
    Spire is a somewhat unique environment for swarms in that there is a stateful external environment with a very
    limited bandwidth channel. To avoid obvious failure modes, we included prompting to select a single driver agent
    who would send all actual gameplay commands, but coordinated with other agents to make decisions. In this setting,
    having multiple agents sometimes helped and sometimes impeded progress. In particular, teammates sometimes encouraged
    obvious misplays or propagated misinformation. On the other hand, the increased scrutiny over each decision
    helped reduce early-game deaths and find lethals when they were present. Data Figure 64: Swarms had a mixed
    performance in Slay the Spire Notably, Slay the Spire runs with swarms took significantly longer due to high
    discussion volume for almost every turn. Reverse Conway In Reverse Conway, as with nanoGPT, agents are able
    to submit many solutions, and they receive feedback on their exact score as they go. However, the task is also
    less hill-climbable than nanoGPT, in that small additions to a program often don’t correspond with noticeable
    improvements in the score, and two different solutions are unlikely to be merged productively. On net, this
    dynamic results in different performances between agent swarms. Fable 5.1 and Opus 5.5 seem to benefit from
    swarm dynamics, while Astra swarms had similar performance to best-of-k configurations. Data Figure 65: Swarm
    performance varied in Reverse Conway Box 1a. Reverse Conway Improvements Opus 5.5 teams improved their own solutions
    with other’s insights: agent-birch Opus team of 2 decision ORDER matters enormously. My Life-native CDCL with
    VSIDS: joint N=3 on the 50x50 examples takes >60s on 2/4 … With a STATIC decision order = diagonal sweep … N=4:
    all 4 in 0.2-7.5s agent-alder Opus team of 2 great work birch — your static radial order crushes my stitching
    approach (my best: L3 4/4 via tile-stitching; N=4 flaky). Switching to help push your engine. It’s not totally
