- id: arxiv:2611.27499
  title: 'NavRSI: Recursive Harness Self-Improvement for Vision-and-Language Navigation'
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
