- id: post:https://metr.org/blog/2026-11-20-q4-2026-capability-update/
  title: AI R&D-relevant model capabilities are improving rapidly and are getting harder to measure
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: null
  version: 0
  source_hash: 576640f55dc45515748f56aca6261bfc746d15ab2208e7498f2e508aa7d27d94
  published: '2026-11-20T08:00:00+00:00'
  updated: ''
  hf_daily_dates: []
  abstract: 'Contents Overview 1 Background 2 Methodology 3 Results 4 Robustness Checks 5 Discussion 6 Acknowledgments
    Appendices A Difficulty Estimation and Baselining B Time Horizon Diagnostics C MCI Modelling Methodology D Limitations
    of IRT E MCI Robustness Checks F Estimating Lifecycle Cost for Tasks G Data Integrity and Reward Hacking H Changes
    in Capability Growth Rates I Inference Scaling J Swarm Experiments K Al Zimmermann''s Programming Contests L
    Budget NanoGPT M Making METR tasks N Earthborne Rangers and Continual Learning O Qualitative and External Evidence
    on Models’ Strengths and Limitations Overview This post presents evidence from our capability evaluations of
    public models relevant to AI R&D acceleration, up to Opus 5.5 and GPT-6 Astra. We remain significantly uncertain
    about central questions, including (1) what capabilities are in practice necessary for drastic acceleration,
    and (2) how quickly relevant model capabilities are improving. We think that current public evidence is insufficient
    to rule out drastic AI R&D acceleration in the next couple of years. By drastic AI R&D acceleration we mean
    a situation where capabilities improve so quickly that humans are no longer able to meaningfully understand,
    assess, and react to catastrophic risks posed by new AI systems. This overview summarizes our main takeaways
    and their relevant sections within the post. 1 Background describes our motivation and aims, and how our thinking
    about capability evaluations has changed since the release of the original time horizons paper . 2 Methodology
    describes the different task sets used throughout the post, changes to human baselining methodology, and introduces
    our use of multiple score thresholds per task. Figure 1: November 2026 update on AI capability measurement 3
    Results contains the evidence for our main takeaways, which are: Models usually match or outperform skilled
    humans on our coding and optimization tasks ( Section 3.A.1 ) . When we recruited our own human baseliners,
    we typically failed to find humans that outperform the current frontier models. In a couple of cases where we
    have existing sources of many (10+) domain specialists attempting a task, models tend to place at a very high
    percentile but not the absolute top ( Section 3.A.2 ). On our dataset, models perform somewhat worse on tasks
    that we estimate are costlier to turn into RL training environments, even after controlling for how long these
    tasks would take humans. However, models appear to be improving at similar rates on our lower and higher cost
    tasks ( Section 3.B.1 ). We observe that various properties that can make an eval more realistic also make the
    eval costlier to make, run, and score. We use a model estimated measure we call ‘Lifecycle Cost’ to try to quantify
    this observed costliness. In our data, a doubling of lifecycle cost for a task of a given length imposes a difficulty
    penalty that is very roughly equivalent to halving the time horizon of the agent. Despite this, we see similar
    rates of progress on high and low cost subsets of our tasks, and we also see AI performance improving over time
    even on our most costly tasks. On our tasks which require choices in the absence of clear empirical feedback,
    AI agents appear to have worse judgment than human experts ( Section 3.B.2 ). This matters especially when feedback
    is slow or the available tests provide limited evidence that a solution will generalize. For instance, in one
    task we found that compared to an expert scorer, model judges overestimate an output’s quality when the output
    is made by a similarly strong or stronger model. On the combined suite of TH1.1 and TH2, time horizons are doubling
    roughly every 3.6 months ( Section 3.C.1 ). Since TH2 is more difficult, any given model has a lower 50% time
    horizon on this combined suite compared to on TH1.1 alone.⁠ 1 We find that horizon doubling trends are shorter
    on a subset of TH2 (the verifiable subset) when excluding TH1.1. This could be consistent with a recent acceleration
    in time horizon that is hidden in the combined trend (which includes both TH1.1 and TH2) due to TH2 tasks being
    harder for a given time horizon, but there are also other plausible explanations. The doubling time on the combined
    suite is similar to the trend recently reported by OpenAI on internal research tasks.⁠ 2 When tracking public
    model capabilities on a composite metric of model ability over time, we do not see strong acceleration or deceleration
    in model ability over the public frontier with the models we tested. However, we do see uncertain evidence of
    developer-specific trend changes in some conditions ( Section 3.C.2 ). We use an index (METR Capability Index,
    or MCI) to track frontier AI capabilities over the past few years based on IRT, a statistical modelling technique
    similar to the one underlying the Epoch Capabilities Index . Similar to other indices of this kind⁠ 3 , we do
    not observe slope changes in the overall public frontier trend (on the public models we tested) but we do observe
    some developer-specific slope changes.⁠ 4 However, we are unsure of the validity of these findings due to their
    sensitivity to methodological choices. 4 Robustness details various checks we did on our results, such as checking
    for reward hacking and refusals. We also investigate the effectiveness of agent swarms as an elicitation technique
    and find that they seem helpful on verifiable tasks with a clear metric and fast feedback (compared to best-of-k⁠
    5 ), and have unclear or negative effects on our other tasks. 5 Discussion describes open questions for assessing
    AI R&D acceleration. The appendices give more detail on our methodology, report robustness checks for our analyses,
    and highlight individual tasks with notable model behavior. 1 Background In this post we focus on the measurement
    of capabilities relevant to accelerating AI R&D. A particularly salient uncertainty for AI R&D relevant capability
    evaluation is whether strong performance on ‘well-specified’ tasks alone is sufficient for drastic AI R&D acceleration,
    or whether other capabilities are needed. We aim to present evidence that is informative regardless of the reader’s
    view on this question. Historically, METR used our ‘time horizon’ metric as a way to measure the SWE-related
    agentic capabilities of AI systems.⁠ 6 Time horizon measurements were useful for risk assessments because (1)
    We considered the capabilities we were measuring with our time horizon suite to be necessary to pose catastrophic
    risk, (2) Our time horizon measurements were substantially grounded in human reference data, which made it easier
    to relate to risk relevant thresholds, and (3) measured capabilities were far from possible danger, which allowed
    us to argue these systems posed negligible catastrophic risk with reasonable confidence. For example, see METR’s
    evaluation of GPT-5 . Much has changed since the original release of time horizon, and this has led to various
    changes in our approach and thinking: Public models have gotten a lot better at many tasks: When time horizon
    was first released in March 2025, the best models had a measured time horizon of around 1 hour (Sonnet 3.7).
    Within a year, models had saturated the TH1.1 suite, which includes tasks up to 30 hours. In many domains, it
    is now challenging and expensive to find human baseliners who outperform the models.⁠ 7 Public models have strong
    enough capabilities in areas like coding and hacking that we no longer think we can construct an argument that
    risk is very low due to incapability on verifiable SWE-based tasks alone: For instance, public frontier models
    can hack services,⁠ 8 ⁠ 9 ⁠ 10 reason about the mechanics of how they are graded⁠ 11 , and bypass restrictions
    set by sandboxes.⁠ 12 As a result, in order to make claims about risk from capabilities, we need to either (1)
    engage more with the specifics of the capability profile of the agent, and the capabilities required for a specific
    threat model, or (2) find other necessary broad agentic capability limitations that bound risk. We are increasingly
    concerned that our easy-to-run, containerized evals could overestimate real-world capabilities, due to similar
    RL environments becoming common in training. Both AI developers and evaluators have a shared desire for quantitative,
    cheap signal about AI capabilities (developers for training, and evaluators for measurements). As a result,
    we think evaluations often share much in common with the RL environments used to train models. This is a problem
    for evaluators because we often want to use our evaluations as a proxy for some other, harder-to-measure, capability
    of interest.⁠ 13 When these proxies (or nearby tasks) are trained on, they are liable to overestimate capabilities
    in these areas of interest.⁠ 14 We are somewhat concerned that AI developers'' efforts to train on available
    cheap, quantitative capability signal mean that evaluators have relatively less uncontaminated signal to use
    for generalizable measurement of capabilities of interest. These changes in the landscape have led to various
    modifications in our approach to capability evaluation. In summary: Human baseline and time estimation changes:
    Because our new tasks are harder and we aim to assess model capabilities relative to AI R&D lab employees, we
    recruited more experienced human baseliners than the STEM graduates in our previous work. The required expertise
    and time commitment made recruitment difficult, so we collected substantially fewer human baselines. We also
    allowed human baseliners to use Sonnet 5 for implementation. We did this to help with recruitment and try to
    avoid slowdowns associated with baseliners being used to coding with AI assistance.⁠ 15 Human baselines are
    directly used for only 9% of our estimates for how long it takes a human to complete the task. For tasks without
    successful human baselines, we use an estimation procedure informed by public records, experts, and extrapolation
    that we detail in Appendix A: Difficulty Estimation and Baselining . Task coverage and multiple score thresholds
    per task: To use our limited resources well we attempted to make more specific evals that targeted capabilities
    that we considered relevant to AI R&D relevant strengths and weaknesses. For instance, optimizing metrics, logic
    puzzles, and judgment-loaded tasks. As a result, the new tasks we have developed don’t cover as broad a range
    of general SWE work as the TH1.1 suite. Additionally, many of our new tasks now have multiple score thresholds,
    instead of just one. This allows us to extract more information from each task, at the cost of some of our analysis
    becoming more complicated,⁠ 16 see Section 2 for more information. Investigation and handling of suspected systematic
    measuring issues: As mentioned above, we are concerned about systematic measurement issues related to similarity
    of our evaluations and RL environments. We attempt to mitigate this problem by using more manually scored tasks
    and qualitative evidence, or otherwise developing evaluations that we expect to be less similar to the environments
    AI developers train on, while still being related to the capabilities we’re interested in. 2 Methodology We
    discuss results from several tasks and experiments, many of which have their own specific methods, budgets,
    and affordances (e.g., GPUs, internet access, etc.). This section describes shared methodology. Agent Setup.
    For all tasks, we evaluated models using our standard ReAct-style scaffold which amongst other tools, has bash,
    python and image-viewing tools.⁠ 17 We run models with xhigh or higher reasoning effort (a setting that controls
    how much the model reasons before acting), and the highest available reasoning setting for models older than
    Feb 2026. Token and time limits were chosen per task with the aim that agent performance reached a plateau in
    further inference scaling, though this aim wasn’t always achieved, see Appendix I: Inference Scaling for token
    scaling curves. Task Suites. Our results cover three distinct task suites: Time Horizon 1.1: 222 tasks including
    tasks from SWAA, HCAST, and RE-Bench. MirrorCode: 75⁠ 18 CLI software replication tasks. TH2: 36 tasks grouped
    into 12 task families⁠ 19 with two broad subsets: TH2 verifiable: 8 families covering optimization, ML, puzzles,
    and games. TH2 hard-to-verify & judgment: 4 families covering conceptual reasoning, judgment, and hard-to-verify
    research. Data Figure 2: TH2 tasks are harder for AI agents and estimated to take humans longer New tasks sets.
    The tasks we created sets span two kinds: Verifiable : In these tasks, agents work towards a well-defined objective
    that is scored automatically, such as an optimization target, score, or accuracy on held-out inputs. They usually
    measure their progress against the objective while working, although in some tasks they are required to build
    proxy metrics. Hard-to-verify & judgment: In our hard-to-verify tasks, agents work on an open-ended research
    problem with no cheap check for success or progress, and typically humans or a model given a human-written rubric
    judge final outputs. These research tasks are mostly based on our own work at METR. We also created more judgment-loaded
    tasks. By judgment, we’re broadly referring to the ability to make good choices in the absence of clear and
    fast empirical feedback.⁠ 20 In these tasks, agents are typically given an artifact (e.g., another agent’s transcripts
    on a task) and asked to judge its quality for some purpose. The table below summarizes the family of tasks in
    each set. Task Set Task Families TH2 verifiable AZsPCs (15 tasks): Solve heuristic optimization problems from
    Al Zimmermann’s Programming Contests . Budget NanoGPT (2 tasks): Optimize a language-model training script based
    on the NanoGPT speedrun . Minecraft Bot (3 tasks): Build an autonomous bot that beats the game. Reverse Conway
    (2 tasks): Find a starting board that evolves into a target pattern in Conway''s Game of Life. Train a Program
    (1 task): Train a neural network to reproduce the I/O of a given program. Earthborne Rangers (2 tasks): Play
    a card-based game that involves managing resources. This task is a lightly adapted version of Epoch’s EBR-Bench
    . Slay the Spire (4 tasks): Play a roguelike game through a text interface. Dominion-like Game (2 tasks): Play
    a deckbuilding game. TH2 hard-to-verify & judgment Making METR Tasks (1 task): Build an evaluation task that
    METR would find informative. Investigate Wiki Incident (1 task): Reconstruct an investigation into AI agents
    colluding on a wiki, based on MessageBoardAuditBench . LMCA (1 task): Rate critiques of philosophical arguments,
    scored by agreement with expert ratings, from Cooper et al. Judge Run (2 tasks): Score an agent’s run on Making
    METR Tasks with a rubric. Scoring. Unlike our earlier suites, TH2 includes some tasks that are manually graded
    by humans (Making METR Tasks) or model judges (Investigate Wiki Incident).⁠ 21 In Time Horizon 1.1, continuously
    scored tasks are binarized via a task-specific threshold chosen to represent human performance. For our new
    tasks, where possible, we instead use multiple score thresholds based on intermediate human performance on the
    task. We define these thresholds as (score, time) points: each point is the time taken by an expert human to
    reach a corresponding score . We defined (score, time) points for 34 of the 36 new tasks using a mix of successful
    human baselines (3 tasks) and researcher estimates of score given time (31 tasks). Despite our best efforts
    to recruit strong human baseliners, sometimes our baselines fell short of what we estimated an AI R&D expert
    (e.g., lab employee) could achieve. In such cases, we used our estimates when we could make reasonable arguments
    for their feasibility. Our estimates usually draw on records of real human work, e.g., NanoGPT speedrun records,
    and in some cases experts or our own experience. Where a task had more than one baseline, we used the points
    of the highest-scoring baseline. See Appendix A: Difficulty Estimation and Baselining for more details. We include
    robustness checks on how sensitive the time horizon trends are to our estimates in Appendix B: Time Horizon
    Diagnostics . Run coverage. On both TH1.1 and our new suite TH2 we typically ran 15 models: GPT-4o, o1, GPT-5,
    Opus 4.5, Opus 4.6, GPT-5.4, Opus 4.7, GPT-5.5, Opus 4.8, Fable 5, GPT-5.6 Sol, Opus 5, Fable 5.1, GPT-6 Astra
    and Opus 5.5. Where we refer to using the MirrorCode suite of tasks, we use older runs that do not cover the
    latest models.⁠ 22 Lastly, in this post we use an IRT methodology to summarize agent performance on a single
    scale and deal with uneven run coverage. We describe this methodology next. METR Capability Index (MCI) Methodology
    In some parts of our analyses, we want a common scale for model capabilities and task difficulties. Even though
    the capability profile of models is often ‘jagged’ compared to the human capability profile, model capability
    profiles are usually quite similar between models. This presents us with an opportunity to roughly summarize
    their capabilities with a single latent factor. Item Response Theory (IRT) models are one way to fit data to
    find these latent ‘strength’ factors. The METR Capability Index (MCI) is an IRT model that is very similar in
    spirit to the Epoch Capabilities Index (ECI). However, unlike the ECI, which aggregates model performance across
    public benchmarks, our model treats the individual task as its unit of analysis and uses tasks we developed
    ourselves. Notably, unlike a ‘time horizon’-like axis, IRT models do not require calibration against human performance.
    The ability axis reflects models’ patterns of strengths and weaknesses across tasks, rather than those of humans.
    For each of our tasks, we define a scale in [0,1], where 0 corresponds to failure and 1 corresponds to full
    score⁠ 23 , and fit a two parameter logistic for the score an agent \(m\) will get on a task \(t\)⁠: \[p_{mt}=\sigma
    (\alpha_{t}(\theta_{m}-\beta_{t})),\quad \sigma (x)=\frac{1}{1+e^{-x}}\] where \(p_{mt}\) is the expected score
    agent \(m\) will get on task \(t\)⁠, \(\alpha_{t}\) is the task discrimination, \(\beta_{t}\) is the task difficulty,
    and \(\theta_{m}\) is the agent ability. When an agent’s ability \(\theta_{m}\) is equal to a task’s difficulty
    \(\beta_{t}\)⁠, the agent is expected to achieve 50% of the maximum possible score. The slope parameter \(\alpha_{t}\)
    captures how quickly the expected score changes around that 50% point. To fit this two-parameter logistic, we
    maximize the fractional-logit log-likelihood function. We also apply weightings to, for instance, upweight based
    on the number of runs we have on a task, downweight large numbers of similar tasks, and downweight ‘noisy’ tasks
    where our observed data is not well fit by our model. We generate 95% confidence intervals using hierarchical
    bootstrap across task families and runs. For full IRT model and fitting details, see Appendix C: MCI Modelling
    Methodology . We also do various robustness checks of our model, which can be found in Appendix E: MCI Robustness
    Checks . 3 Results In this section we’ll cover our results and other collected evidence. Section 3.A covers
    AI R&D relevant model capability strengths, Section 3.B covers model limitations, and Section 3.C covers capability
    trends. 3.A AI R&D Acceleration Relevant Capabilities We find that current public frontier models have extremely
    strong capabilities on optimization tasks, often outperforming skilled humans. Generally, these tasks have a
    clearly defined goal that is cheaply checkable. Usually the solution has few required criteria or constraints
    other than those expressed by some score, and often this score is observable to the agent. Section 3.A.1 describes
    evidence that models outperform our humans on our hard but well-defined coding and optimization tasks. Section
    3.A.2 describes model performance relative to top experts in places where we have the data to do so. Appendix
    O: Qualitative and External Evidence on Models’ Strengths and Limitations also describes external evidence that
    model strengths in this area extend beyond just benchmarks. 3.A.1 Models often match or outperform skilled humans
    on coding problems and metric optimization with strong feedback signals We see strong performance from models
    on TH1.1, our old (primarily verifiable) sets of tasks, as well as on the verifiable portion of our TH2 tasks.
    Current public frontier models have an estimated time horizon of up to 27 hours on the verifiable subset of
    our TH2 tasks. We also found that current public frontier models were able to beat the human baseliners that
    we recruited on the 3 tasks we attempted to acquire human baselines for. Since we want to measure whether models
    are able to replace AI developer employees, we aimed to acquire baseliners of a similar skill level. We recruited
    people with specialist knowledge in the task domain. For instance, for Train a Program our best external baseliner
    is a former International Grandmaster on Codeforces and won the 2020 Kaggle ARC-AGI competition. For Minecraft
    Bot and Reverse Conway, our best-performing baseliners were somewhat less credentialed, but had compensatory
    specialist knowledge or experience. We paid \$200-350/hr and spent a total of roughly \$90k for 7 attempted
    baselines. Overall, we are uncertain about the comparability of our baseliners to AI R&D lab employees. We would
    guess that our baseliners’ skill within the task domain probably didn’t match the level of skill that typical
    frontier AI researchers have within their own domain. On the one hand, our baseliners were experienced, and
    often had specific experience relevant to the task. On the other hand, AI developers offer very high compensation,
    and have recruiting teams optimizing for finding highly talented individuals. Additionally, our tasks required
    dozens of hours of commitment, which plausibly selected against potential participants with full-time employment,
    and may have led to some adverse selection effects. For more details on human baselines see Appendix A: Difficulty
    Estimation and Baselining . Various other work also observes high capability on these kinds of tasks. For instance,
    on MirrorCode , where agents reimplement software by checking against a full test suite, Opus 5.5 solves 77%
    of medium to large programs that would take human experts weeks to months to do on their own. GPT-6 Astra recently
    scored 98% on FrontierMath Tier 4 , a benchmark of research-level math problems designed to take a strong mathematician
    specializing in that domain 1-2 weeks. 3.A.2 Where we have more human data, models outperform most humans on
    verifiable optimization tasks, but do not always dominate top experts. For two of our TH2 verifiable task families
    we have a larger pool of pre-existing human data to compare model performance against. On these two task families,
    we observe AI agents had high percentile performance but were generally unable to beat the very top performing
    humans. Data Figure 3: Current public frontier models outperform most humans (but not always the very top experts)
    on tasks with a large pool of participants On the left, we show where model solutions rank against human participants
    in AZsPCs contests. On the right, we show model’s speedup over record #78 ranked among speedups of human records
    #79 to #92. For AZsPCs, models had 48 hours on a 28-core machine, and participants had about three months. For
    Budget NanoGPT, models had 48 hours on 8xH100s, and contributors typically reported 16 to 40 hours per record.
    The first of these two task families was 15 Al Zimmermann contests , multi-month long optimization competitions.
    We find the median placement of the strongest models (Fable 5.1, Opus 5.5 and GPT-6 Astra) is the 96th to 98th
    percentile of human participants (97 to 413 participants per contest). We estimate that a dedicated human participant
    might spend between 90 hr and 180 hr over the course of the competition. We think the top of the human participant
    pool is quite strong.⁠ 24 In the median contest, roughly 4 humans beat the strongest models we tested, see Figure
    3(a) . The second of these two task families was Budget NanoGPT speedrun, where we run the AI agent with a comparable
    amount of compute⁠ 25 to what human speedrunners typically use. Agent solutions (all starting from record #78)
    and human records aren''t perfectly comparable, since each human record builds on previous records. However,
    interviews with contributors suggest that each human record took a similar amount of labor and resources, comparable
    to one of our agent runs. So we compare each agent run’s speedup to the speedup of individual human records,
    and believe this comparison is rough but still informative. Also note that recent "human records" can be AI-assisted
    (sometimes heavily so), and that we only include human records set up to Aug 2026. On Budget NanoGPT speedrun,
    we find that fully autonomous AI agents outperform many competent speedrunners, achieving better speedups whilst
    costing less. However, top human contributors still can reach much larger speedups than AI agents, see Figure
    3(b) . The best AI agent run (of 2 to 5 runs per model) reached a 15.7% speedup over our starting record in
    48 hours. The author of a recent unusually strong record (#92), with AI assistance for coding, estimated spending
    about 60 hours for a 41% speedup over the previous record. For more detail on each of the results see Appendix
    K: Al Zimmermann''s Programming Contests and Appendix L: Budget NanoGPT . 3.B AI R&D Acceleration Relevant Capabilities
    Limitations In this section we present evidence that current public frontier models have capability limitations
    that may prevent them from drastically accelerating AI R&D via automating research work. In Section 3.B.1 ,
    we introduce Lifecycle Cost, a rough proxy for how costly a task would be to build and use as an RL training
    environment. We find that on our dataset, models perform worse on tasks with higher Lifecycle Cost, even when
    controlling for task length. Section 3.B.2 describes evidence of limitations related to performing well on tasks
    where it is difficult to get clear empirical feedback about the quality of the solution. In these tasks, agents
    need to create their own metrics of quality, handle tradeoffs, or exercise judgment. Appendix O: Qualitative
    and External Evidence on Models’ Strengths and Limitations also describes external evidence on weaknesses in
    the context of AI-related research. 3.B.1 On our dataset, models perform worse on tasks that we estimate are
    costlier to turn into RL training environments, even after controlling for task length. As discussed in Section
    1 , the evals that are METR’s current primary way of measuring model capabilities are likely to have much in
    common with the RL environments that companies use to train their models. This is because both METR and AI developers
    want to be able to cheaply, easily capture signals about model capabilities. As RL has become a larger share
    of training, we have become more concerned that this overlap causes systematic measurement issues. To try to
    quantify how difficult a task is to make into an RL environment, we created a very rough proxy measure which
    we call Lifecycle Cost. This is the cost for us to develop a containerized environment for the task, and then
    to run and score the task 100 times.⁠ 26 The goal with this quantity is not to reflect the ‘real cost’ of RL
    environments per se, but rather to have some rough quantitative metric of relative costliness. Table 1 gives
    examples of properties that we have found make it more expensive to create highly realistic tasks, which Lifecycle
    Cost aims to capture. Figure 4: Properties that make it more expensive to create realistic tasks Table 1: Lifecycle
    cost factors Cost factor Example Manual scoring In many cases, programmatic scoring would overly constrain the
    task, and models may be unable to properly judge the quality of the output. In these cases, we can use humans
    to score outputs. This is especially costly when the human needs to be an expert. Examples include Making METR
    Tasks and Sunlight.⁠ 27 Compute-per-run Some of our tasks involve using GPUs or other compute infrastructure,
    which has an associated cost. In TH2, both Budget NanoGPT and Train a Program use GPUs. Serial time Evaluations
    that take a long time to complete are generally more difficult to construct and run. Long tasks tend to be more
    prone to technical issues and length often compounds other cost factors, such as monitoring cost.⁠ 28 Our longest
    evaluations in TH2 verifiable tasks are run for 48 hours. Token costs Tasks where models use more tokens are
    costlier to run. The token cost of an evaluation is often (but not always) correlated with the serial time needed
    to run the task.⁠ 29 Action monitoring Sometimes models behave in ways that can cause real world harm. METR
    monitors certain high-risk evaluations to prevent this. This increases token costs, and often requires human
    researcher time for approvals. Further details about METR’s monitoring setup are available in this post . Environment
    complexity Environments which offer more components or opportunities for interaction are generally harder to
    make. It is therefore often desirable to ‘import’ a complex environment from some existing artifact (e.g. a
    game, or a dataset). The process of importing the task whilst ensuring it is fair is generally harder for more
    complex artifacts as there are more opportunities for bugs, and increased labor cost of QA. Another obvious
    route for introducing environment complexity is allowing the evaluation to interact with the ‘real world’, which
    we discuss below. Interaction with the real world Allowing internet access, and particularly interacting with
    the real world (e.g. making money on some prediction market) is a potential way to incorporate lots of realistic
    complexity into a task. However, real world interaction can increase Lifecycle Cost by increasing monitoring
    requirements and QA costs associated with guarding against unintended solutions. These tasks also typically
    have more issues with noise (lack of reproducibility), have shorter lifetimes (the internet and world change
    over time), and involve resources that require some evaluator overhead to manage (e.g. cryptocurrency, credit
    cards, accounts). Implicit generalizability requirements In real work, there is often some gap between what
    measures are readily available to iterate against, and the ultimate requirements applicable to the solution.
    For example, it is easier to iterate against the currently known feature requirements of an application, and
    its related tests, than to choose an architecture which will be easy to adapt to future requirements and preclude
    harder-to-notice failure modes. Introducing these generalization requirements in a fair way usually requires
    giving agents more context on the wider situation in which its solution will be used, which takes additional
    development time. Additionally, the ultimate requirements on a solution are often most naturally exercised on
    longer timescales, which can make scoring harder.⁠ 30 Making the task robust to reward hacking, and scoring
    sensitive to the capabilities of interest It is often the case that when we first make a task, oversights in
    task design mean that agents can score highly via methods that do not test the capability of interest. Despite
    many of our tasks containing instructions to follow the intended spirit of the evaluation, we still find that
    we need to put in a lot of ‘hardening’ effort to prevent reward hacking or otherwise ‘cheesy’ solutions. This
    increases implementation and QA costs. This also increases running costs, since we typically check our runs
    for reward hacking each time they are run.⁠ 31 Use of experts Some tasks require specialist knowledge and time
    to create, run or score. For example, datasets created by experts (LMCA), and evaluations that require expert
    scoring (Making METR Tasks, Sunlight). Human interaction during the run Tasks which require human participation
    (e.g. in a game, or in an adversarial cyber challenge). Wall clock, coordination, and labor costs are significant
    for such tasks.⁠ 32 (None of our TH2 tasks include this). We estimate Lifecycle Cost for our tasks with an LLM
    judge (Opus 5.5). This judge is given the task code (including the README, instructions, and scoring), and asked
    to estimate various costs associated with the task like e.g. development, QA, and scoring costs. We also amortize
    shared development costs over families of similar tasks. We iterated on the prompt for the judge such that the
    judge’s estimates roughly matched our own for about 10 tasks across domains and cost ranges.⁠ 33 While we expect
    our prompt to generalize reasonably well to tasks outside ours, some choices like which phases we break cost
    into, how much we assume AI speeds up task development, labor rates, etc. reflect our own experience. For full
    details of how we estimate Lifecycle Cost see Appendix F: Estimating Lifecycle Cost for Tasks . We think there
    are various limitations to Lifecycle Cost as a proxy for ‘difficulty to make a suitable RL environment’, and
    also to using ‘difficulty to make a suitable RL environment’ as a predictor of model performance broadly: RL
    environment creation difficulty doesn’t account for differing demand in different capability domains. For example,
    we might assume that AI developers are more interested in creating models that are good at coding, but much
    less interested in making models good at deception and sabotage. RL environment creation difficulty doesn’t
    account for cross-task generalization gains, or the amount / degree of task coverage needed for generalization
    within a domain. Our LLM judge is calibrated to our own estimates of Lifecycle Cost, which are informed by METR’s
    constraints. Labs are likely to have different constraints to us. Costs are likely to change as model capabilities
    improve. What is costly today may not be costly in a year, or a few months. For instance, judging according
    to a rubric may have been costly to do in 2023, but model graded rubrics are common today. In Table 1 we give
    examples of factors that have, up to now, increased Lifecycle Cost for us. We are not claiming that these are
    fundamental barriers, or even that these will be relatively costly in the future. Figure 5 shows a scatter plot
    of human time-to-complete vs Lifecycle Cost for our tasks. For TH2 tasks, Lifecycle Cost is estimated only for
    the highest score threshold. On our dataset, human time-to-complete and Lifecycle Cost are quite correlated
    (R 2 = 0.82).⁠ 34 Data Figure 5: Lifecycle costs are correlated with the estimated human completion times, for
    tasks in our dataset When we control for this correlation between time-to-complete and Lifecycle Cost we find
    that (for a given length) tasks with higher Lifecycle Cost tend to be somewhat more difficult than what would
    be predicted by their time-to-complete alone (R 2 = 0.14), see Figure 6 .⁠ 35 ⁠ 36 Data Figure 6: Tasks we estimate
    would be costly to turn into RL environments tend to also be harder for models In Appendix F: Estimating Lifecycle
    Cost for Tasks we show plots using all (score, time) points per task where we observe a similar but weaker effect
    of lifecycle cost, and more associations with task time. However, our data is noisy and could be affected by
    a few things. For example, many of our task times are estimates, and if they are systematically wrong, part
    of this effect could come from error in task time. That said, it’s somewhat reassuring that when we use models
    to estimate task time instead of human estimates/baseline, we also observe a similar trend. Another reason could
    be that this effect is driven primarily by a few high cost tasks. In the plot above, we account for this by
    filtering such outlier tasks. More ablations are in Appendix F: Estimating Lifecycle Cost for Tasks . When we
    subset our tasks by high and low Lifecycle Cost, controlling for task length, and plot time horizons over release
    dates, we find that models perform worse on the higher Lifecycle Cost subset of our tasks, see Figure 7 . On
    average, the higher Lifecycle Cost subset is 2.9x as expensive as the lower Lifecycle Cost subset, and models
    perform 2.9x worse in terms of time horizon, equivalent to 1.5 doublings. Interestingly, compared to the lower
    lifecycle cost subset, model performance on the higher lifecycle cost subset is closer to performance reported
    by OpenAI on their own internal research usage.⁠ 37 We don’t have many task distributions to compare here, but
    we think this is at least an encouraging sign about our ability to create evaluations that are directionally
    more predictive of performance on ‘actual’ AI R&D tasks. It also seems like some (weak) evidence in favor of
    lifecycle cost being correlated with factors of difficulty that make ‘real’ AI R&D internal research tasks more
    difficult for models than some kinds of evaluations. Data Figure 7: Models have lower 50% time horizons on TH1.1
    and TH2 tasks that we estimate are costlier to make, even controlling for length. The costlier subset is closer
    to the reported difficulty of OpenAI research use. See Appendix F: Estimating Lifecycle Cost for Tasks for how
    we split tasks by lifecycle cost controlled for time. On our data, doubling times on the higher cost subset
    are similar to (and very slightly shorter than) doubling times on the lower cost subset. However, our task set
    spans a restricted range of relative lifecycle cost so it is possible that for sufficiently high relative lifecycle
    cost doubling times are longer (or alternatively, are shorter). If we were to take seriously that lifecycle
    cost was a good proxy for realism, then differences in doubling times would be consequential for forecasting
    the impact of AI systems: If higher lifecycle cost tasks actually have a slower growth rate, and relatively
    high lifecycle cost tasks are required, then naive extrapolation could predict that drastic AI R&D acceleration
    happens much later. On the other hand, if there was no difference in growth rate at different (relative) lifecycle
    costs, then this would imply that each doubling in relative lifecycle cost simply delays trends by some number
    of months. On our dataset, a doubling in lifecycle cost for a given length of tasks results in model performance
    reaching 50% success rate approximately 4.6 months later.⁠ 38 Note that we are highly uncertain about the lifecycle
    cost of tasks required to drastically accelerate AI R&D. They could potentially be many doublings more expensive
    than the typical task in our dataset.⁠ 39 Overall, we remain uncertain about the relative growth rates of high
    lifecycle cost vs low lifecycle cost tasks. For more information see Appendix F: Estimating Lifecycle Cost for
    Tasks . Using a similar methodology to time horizon, we also estimated Lifecycle Cost horizon as the model-estimated
    lifecycle cost at which agents have a 50% chance to succeed at the task. We find that the lifecycle cost horizon
    of models is also steadily improving, though with a longer doubling time compared to the time horizon trend.
    See Appendix F: Estimating Lifecycle Cost for Tasks for the lifecycle cost horizon trend ( Figure 51 ) and corresponding
    logistic fits per model. 3.B.2 On domains where the ‘true’ quality of a solution is hard for the agent to determine
    due to prohibitively long feedback loops or requirements that the solution generalize, models appear to have
    worse judgment than human experts A property we consider to be somewhat captured within lifecycle cost is the
    verifiability or ‘fuzziness’ of tasks. Tasks that are ‘fuzzier’ tend to be harder to automatically score, or
    more faithfully scored in ways that are too resource intense for a typical evaluation context. These ‘fuzzy’
    tasks are typically taken to load on skills like ‘taste’ and ‘judgment’, and often include ‘research’ as a central
    example. We think that making a binary distinction between ‘fuzzy’ and ‘verifiable’ tasks can be somewhat misleading.
    Many tasks often categorized as ‘fuzzy’ are in fact verifiable in some way, given sufficient time to let the
    consequences of a given solution play out. For instance, making a ‘good app’ for some purpose might be considered
    a fuzzy task, but given enough time and exposure to use, we could eventually observe more objective and faithful
    measures of quality e.g. number of users or ratings. One way to operationalize this is in terms of the general
    costliness of assessing the quality of a solution in the long run.⁠ 40 Tasks where it is expensive to actually
    ‘play out’ the whole process to a point where long-run quality can be assessed (e.g. deciding a research agenda),
    are costlier-to-verify. We therefore expect these ‘fuzzier’ or ‘costlier-to-verify’ tasks to have higher lifecycle
    costs than typical for their length. In this section we discuss evidence related to the ‘judgment’ capabilities
    of models and provide a few other examples of weakness related to managing one’s own feedback loops. As defined
    in Section 2 , by judgment, we’re broadly referring to the ability to make good choices in the absence of clear
    and fast empirical feedback. This is often driven by strong argument and reasoning, or instilled via experience
    and expressed through the careful application of learned heuristics. In practice, this can short circuit otherwise
    necessary and expensive feedback loops. As a result, ‘judgment’ is particularly helpful on ‘costlier-to-verify’
    tasks. It is unclear to us the degree to which drastic acceleration of AI R&D will require judgment or related
    capabilities. We discuss this further in Section 5 . However, we would consider weakness in ‘judgment’ and related
    capabilities to be reasonable candidates for what most delays drastic AI R&D acceleration. As one measure of
    these domains, we ran LMCA,⁠ 41 a benchmark where models need to rate critiques of philosophical arguments.
    Models have shown steady improvement, and many have agreement above the estimated agreement level of expert
    humans who spent 5 minutes on the task, but all public models are still below the estimated agreement level
    of expert humans spending 15 minutes.⁠ 42 AI agents now build borderline-useful evaluation tasks, but not yet
    ones we consider especially informative We made a task designed to test model ability to automate making our
    evaluations. The agent is asked to create a new task for our evaluation suite which is informative for METR’s
    assessment of model capabilities. None of the tasks agents produced were sufficiently useful to us to warrant
    inclusion in this post.⁠ 43 Data Figure 8: AI agents now build borderline-useful tasks, but not yet ones we
    consider especially informative The models we tested generally favored making automatically scored optimization
    tasks, even when (in follow-up experiments) instructed to make tasks where "success is sensitive to decisions
    which have poor short term feedback." Agents did not independently try to improve their understanding of what
    tasks METR would find most useful, despite internet access. We did not observe agents produce novel threat modeling,
    or construct tasks based on particularly insightful hypotheses about model capabilities.⁠ 44 AI judges are overgenerous
    when judging tasks made by models stronger than themselves We observed related weaknesses when models are asked
    to judge the quality of other model-made tasks. When asked to score tasks according to how useful they’d be
    for us, their agreement with our own ratings depends on the relative strength of the judge model and the task-creator
    model. Frontier models show high agreement with our own ratings when the task is made by a weaker model than
    themselves, but give inappropriately high scores when the task is made by a stronger, or similarly strong, model,
    see Figure 9 .⁠ 45 Opus 5.5, the judge that had the highest agreement with our human scorer, scores Astra’s
    tasks on average about 0.2 (out of 1) more highly than our human.⁠ 46 Data Figure 9: AI judges are overgenerous
    on tasks made by stronger models The most straightforward explanation for this is that models have poor judgment
    about what makes a good task. This poor judgment effectively caps the model’s performance during the task itself,
    because the model only has its own judgment to optimize against. With the end result being that when used as
    judges they systematically overestimate the quality of their own solutions, and those of stronger models. Another
    possibility is that strong models exhibit behaviors that cause weaker judges to overestimate their solutions.⁠
    47 Some caveats to our judgment related results: Firstly, we think it is somewhat likely that models are underelicited
    on these kinds of problems. For example, in our setting and similar settings⁠ 48 , we observe models significantly
    underutilize their provided token limits and affordances. Secondly, we do see current public frontier models
    displaying good judgment (of unclear generality) on some ML tasks. For instance we observe that on days-to-weeks
    long ML evaluations with programmatic scoring, models are able to beat our human baseliners. This includes tasks
    that we explicitly designed to be novel, and that we do not believe to have been trained on. In related work,
    P-Zero Research also finds strong performance on TasteVal , which measures the compute efficiency of agents''
    experiment choices in up to 120hr long verifiable ML optimization tasks.⁠ 49 And this performance seems to persist
    under resource limits matched to those that humans work under (as in TasteVal or our Budget NanoGPT results).
    However, it seems plausible to us that the judgment displayed by models on these tasks is in some sense less
    general than the judgment displayed by humans. It also seems plausible that there is no fundamental difference.
    3.C AI R&D Acceleration Relevant Capabilities Trends 3.C.1 Across TH1.1 and TH2 we find that capabilities are
    doubling roughly every 3.6 months Across our TH1.1 and TH2 tasks, we find that time horizons are doubling roughly
    every 3.61 months (95% CI 2.08-4.94), or 110 days, see Figure 10 . This is similar to the previous TH1.1 doubling
    trend of 105 days.⁠ 50 On these tasks, naive extrapolation would imply that models reach a 50% time horizon
    equal to the longest score threshold on our task set (200 hours) in July 2027. Data Figure 10: Across TH1.1
    and TH2 we find that capabilities are still increasing quickly, doubling roughly every 3.6 months. In Appendix
    B: Time Horizon Diagnostics , we see similar results when noising our baseline estimates and when using model
    estimated times instead of our default time estimates.⁠ 51 When we estimate separate trends for task subsets,
    we observe a faster doubling time on TH2 verifiable tasks than on TH1.1 tasks. Our data is noisy, but for TH2
    (verifiable) we see a doubling time of 1.65 months (95% CI 0.79 to 3.99), see Figure 11 . This trend is faster
    than the combined TH1.1 + TH2 doubling time.⁠ 52 Data Figure 11: When separated, time horizon doubling times
    on TH2 (verifiable) appear shorter than on TH1.1. We also show trends on MirrorCode, another verifiable task
    distribution. Trends are fit to frontier models. Doubling time CIs are calculated by bootstrapping over models,
    families, and runs. Model CIs are bootstrapped over families and runs. In this figure we show a wider array
    of models, due to not having to constrain to data on which we have runs for every (model, task) pair across
    TH1.1 and TH2. Logistic fits are given in Appendix B: Time Horizon Diagnostics . This faster doubling time could
    be taken as evidence of an acceleration in model capabilities in 2026 (at least as measured by time horizon,
    on these tasks). However, we think it is worth noting that we already observe similarly quick doubling times
    on MirrorCode in the second half of 2025 (another, easier, verifiable distribution of tasks), when TH1.1 was
    still growing at a slower rate. We are not sure what the cause of the faster doubling time on TH2 (verifiable)
    and MirrorCode is. One possibility is a general acceleration in capabilities measured by time horizon, as mentioned
    above. In principle, such an acceleration could be hidden in the combined set by an artificial deceleration
    from switching over to TH2, which is generally a harder set of tasks at a fixed time horizon.⁠ 53 Some other
    possibilities include these distributions having data over a more restricted date range, or that tasks involved
    have properties that make them easier to improve at quickly, or combinations of these possibilities. One possibility
    that we find plausible is that doubling times may tend to be shorter on less diverse sets of tasks. Essentially,
    when a set of tasks are very similar to one another, longer tasks might not be that much more difficult (e.g.
    if it is mostly more of the ‘same kind’ of work). Or alternatively stated, once models have learnt the main
    skills needed to do a kind of task, they are relatively quickly able to do longer versions of that kind of task.
    However, across a varied set of tasks, longer tasks are more likely to include different or multiple different
    kinds of work, such that models may overall tend to acquire the necessary abilities later. So relative lack
    of diversity may be a contributing factor towards MirrorCode and TH2 (verifiable)’s shorter doubling times.⁠
    54 Another possibility is that our selection for difficult tasks during development contributes to TH2 (verifiable)
    having a shorter doubling time. However, we would be somewhat surprised if this was the majority of the reason
    for the faster doubling time of TH2 (verifiable), since we e.g. kept tasks that were saturated during the suite’s
    development. We also note that recently published data from OpenAI seems to imply a doubling time of 3.8 months
    when using their models on their own internal research tasks, which is similar to the 3.6 month doubling time
    we find over TH1.1 and TH2.⁠ 55 3.C.2 We do not observe a strong acceleration in capability across public frontier
    models, as measured by METR Capability Index (MCI) on our tasks. However, we do see uncertain evidence of developer-specific
    trend changes in some conditions. If AI R&D were already being substantially sped up, we might expect to observe
    an acceleration (i.e., a positive change in growth rates) in the capability of models over time (even if they
    continued to have a jagged profile). We see rapid progress on tasks when measured in terms of time horizons.
    Given the uncertainty we have about whether ‘task length’⁠ 56 is a good metric of task difficulty, and the value
    of our time estimates, we also analyzed our data with MCI, an IRT model. When we fit our MCI model (similar
    to metrics like Epoch''s ECI , and Anthropic’s AECI ) we do not observe an obvious acceleration over all public
    frontier models, see Figure 12 . We believe this result provides moderate evidence against a general deceleration
    in model capabilities and weak to moderate evidence against a general acceleration over all the models we tested.
    Data Figure 12: When fitting the MCI model to our data, we do not see an obvious acceleration or deceleration
    in capabilities over time. However, if we instead calibrate MCI and fit trends separately for each AI developer,
    we do observe some slope changes (i.e., increasing capability growth rates) in certain conditions. We find that
    slope changes on developer-specific MCI are generally comparable to those presented in METR’s Independent Assessment
    of AI R&D Acceleration at Anthropic in October 2026 and recent Anthropic system cards in the conditions that
    we are most able to reproduce, i.e. on public Anthropic models up to Opus 5.5. We are uncertain about the validity
    of these slope changes, since we find they are quite sensitive to various methodological choices. We discuss
    these AI developer specific slope changes and sensitivity to methodological choices in Appendix H: Changes in
    Capability Growth Rates . Note that, when using this kind of IRT methodology to detect acceleration, we think
    it is worth bearing in mind some reasons that this method may ‘miss’ an actual acceleration. Firstly, it is
    possible that developers could be delaying public releases for longer as models get more capable,⁠ 57 which
    could cause us to not detect an acceleration. Secondly, MCI always has more uncertainty in the ability of the
    most capable AI model,⁠ 58 which we expect to delay our ability to detect an actual acceleration. This methodology
    is also only able to detect acceleration in overall ability as measured by MCI, rather than acceleration caused
    by AI specifically. We do not know what the counterfactual trend would have been had AI developers not been
    using AI to help with their research. It’s entirely possible that without AI we would see a decelerating trend,
    and that AI use has in fact accelerated trends to the current level. For more details on our methodology, see
    Appendix C: MCI Modelling Methodology , for robustness checks see Appendix E: MCI Robustness Checks , for additional
    discussion of limitations of our model and related IRT models, see Appendix D: Limitations of IRT . 4 Robustness
    Checks We did various robustness checks for our evaluation results: To check that our token budgets for runs
    were large enough we looked at how performance scales with increasing tokens. For each task, we aimed to set
    a token budget where performance plateaus, though this was not always achieved. For more details, see Appendix
    I: Inference Scaling . We also checked for reward hacks. Runs with reward hacks were assigned a score of zero.
    To do this we manually looked through a subset of traces, and ran model scanners over the runs (sometimes with
    instructions on what to look for by task, informed by reading through the subset). Most of the reward hacking
    we found was by near-frontier agents,⁠ 59 such as GPT-5.6 Sol, GPT-6 Astra, Fable 5, Fable 5.1, and Opus 5.5.
    For more details see Appendix G: Data Integrity and Reward Hacking and Appendix G: We find that models still
    often engage in reward hacking . We excluded runs where classifiers blocked generation, or the model itself
    refused. This was quite rare and affected about 36 runs across both TH2 and TH1.1. We also performed some preliminary
    checks for sandbagging, see Appendix G: Refusals and Sandbagging for more. Finally, we experimented with using
    “swarms” rather than our regular scaffold. We generally compared swarm runs to best-of-k (which typically performs
    better than a single very long serial run on these kinds of tasks). Though our data is noisy, we found that
    swarm scaffolds seem to increase performance over best-of-k controls on tasks with a clear metric to optimize.
    In other tasks, we found unclear or negative effects. In particular, we found that large swarms seemed harmful
    to performance when the task required creating a proxy metric for themselves. For more detail see Appendix J:
    Swarm Experiments . These results lead us to believe that we may be somewhat undereliciting performance on our
    clean verifiable optimization tasks due to not using swarms. We expect that not using swarms on our other tasks
    is not a contributor to underelicitation. We generally found that swarms were very expensive to run; our swarm
    experiments used approximately \$500k in tokens. 5 Discussion As model capabilities have improved, some methods
    and evaluations that we have previously used to upper bound risk have become less useful, or obsolete. Current
    public models now have very strong performance on well-scoped ML, cyber, and coding problems. Therefore, it
    is now more difficult to bound risk by pointing to some easy-to-measure and broad incapability. Instead, our
    understanding of risk from model capabilities is more dependent on questions related to the specific details
    of model capability profiles, and facts about the world. We do not feel that we currently have good answers
    to many of the most important questions here. For instance: How much stronger are model capabilities on easier
    (or less-costly) to verify tasks, compared to harder (or costlier) to verify tasks? On our dataset, we observe
    weaker performance on the higher relative lifecycle cost subset of our tasks. However, the link between lifecycle
    cost and some notion of ‘realism’ remains very unclear, and we do not know if its associations with worse model
    performance apply to other task distributions. Are models getting better at harder-to-verify tasks more slowly?
    If so, by how much? On our dataset, we see similar doubling times on the high and low relative Lifecycle Cost
    subsets of our tasks. However, we could imagine that the trend could be different on tasks with much higher
    lifecycle cost, or that were otherwise more realistic. What capabilities are even necessary for drastic AI R&D
    acceleration? In this post we have largely avoided making claims about what is necessary and sufficient for
    drastic AI R&D acceleration, but this is a major source of uncertainty for us. It may in fact be possible to
    drastically accelerate AI R&D via easy-to-verify tasks alone. As a result, we think it is prudent to consider
    the possibility that AI may be able to drastically accelerate AI R&D before we see good performance on many
    ‘realistic’ tasks that may be necessary for the automation of ‘normal’ jobs. At the very least, AI developers
    are putting a great deal of active effort into getting their AIs to automate their own research,⁠ 60 which we
    might expect to bring forward automation relative to AI R&D’s ‘natural’ difficulty. 6 Acknowledgments We thank
