- id: arxiv:2611.25179
  title: 'Phantom Success, Silent Failure: Auditing the Success Checkers of Simulated Manipulation Benchmarks'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.25179'
  version: 1
  source_hash: 8a41d3b3b579dc52d817ac3f1aa3c157fcd670850ecf9f07b8cce72f5415107d
  published: '2026-11-18T21:02:31Z'
  updated: '2026-11-18T21:02:31Z'
  hf_daily_dates:
  - '2026-11-20'
  abstract: Simulated manipulation benchmarks measure policy performance using hand-written success checkers that
    label each episode as a success or failure. Passing an expert demonstration shows that a checker accepts one
    way of completing the task. Learned policies, however, may stop after partial progress or complete the task
    in a different way. A checker may then accept an incomplete execution (phantom success) or reject an execution
    that satisfies the instruction (silent failure). In this paper, we introduce SimAudit, an LLM-based pipeline
    that audits success checkers against task instructions. SimAudit analyzes the instruction and checker code to
    identify scenarios where the two may disagree, recreates those scenarios in simulation, and runs the original
    checker. Multi-view renderings are then used to verify whether the observed behavior satisfies the instruction.
    Across RoboTwin 2.0, RoboCasa365, and RoboDojo, 183 simulated test cases produced the predicted checker verdict.
    Visual verification and deduplication yielded 61 distinct defects across 49 tasks, including 40 phantom successes
    and 21 silent failures. Most defects in RoboCasa365 accepted incomplete executions, most in RoboDojo rejected
    valid executions, and both error types were common in RoboTwin 2.0. These findings suggest that validating success
    checkers requires testing both incomplete executions and valid alternatives to expert demonstrations, and motivate
    more rigorous evaluation protocols for future benchmarks.
