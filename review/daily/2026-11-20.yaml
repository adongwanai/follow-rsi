- id: arxiv:2611.27804
  title: 'Generalist Action Critic: Harnessing Frontier Models in Autonomous Driving'
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.27804'
  version: 1
  source_hash: 8d7631a760dddeebd186f350cad0573376c162f8c792aa25004a3c74d58fc316
  published: '2026-11-20T16:32:53Z'
  updated: '2026-11-20T16:32:53Z'
  hf_daily_dates: []
  abstract: Frontier models have demonstrated remarkable general-purpose reasoning capabilities, opening new possibilities
    for intelligent decision making in the physical world. In autonomous driving, many recent approaches seek to
    leverage these capabilities through additional adaptation for action output, particularly in scenarios where
    existing models underperform. We introduce Generalist Action Critic (GAC), a zero-shot framework that combines
    frontier models' general-purpose reasoning with the planning competence of specialized driving models through
    an inference-time harness. In GAC, specialized planners generate multiple candidate trajectories and make an
    initial selection, while a frozen frontier model serves as an action critic that assesses the selected trajectory
    against scene evidence and either retains it or reselects from the available candidates. The harness combines
    camera images with spatial overlays, provides driving context and reasoning principles through textual instructions,
    and regulates the information available at each stage to support trajectory assessment and reselection. On HUGSIM,
    GAC raises DrivoR's HD-Score to 43.2, achieving state-of-the-art performance among methods trained without additional
    simulation data. GAC also consistently improves closed-loop driving safety across three planners, with relative
    HD-Score gains of up to 32.1%. Experiments on NAVSIM v1 further reveal how GAC improves planning performance
    by correcting up to 52.13% of eligible unsafe trajectory selections while introducing new failures in only 0.67%
    of originally high-quality selections. These results demonstrate the potential of harnessing frontier models
    to improve driving safety through inference-time cooperation with specialized planners.
