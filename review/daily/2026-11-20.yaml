  hf_daily_dates:
  - '2026-11-20'
  abstract: Unified multimodal models aim to support visual understanding and generation within a single framework.
    However, prevailing approaches often separate their visual representations or backbone computation to accommodate
    the different requirements of these two tasks, which limits the degree of unification. In this paper, we present
    HiUni, which revisits this design choice and explores whether a pretrained vision language model can be directly
    extended into a unified model with extensive parameter sharing. Specifically, HiUni reuses the same language-aligned
    ViT and dense Transformer backbone for both capabilities, while confining task-specific computation to the output
    side. Yet such a design introduces two key challenges. Generation in pixel space is difficult to optimize, and
    semantic abstraction in pretrained ViT discards fine spatial details required for synthesis. To address these
    challenges, HiUni introduces a \emph{Pixel Diffusion Head} tailored to direct pixel-space optimization and a
    lightweight \emph{HiGate} pathway that provides fine-grained spatial details near the output stage. Extensive
    experiments show that HiUni achieves a similar average understanding score to the pretrained VLM while attaining
    competitive performance on image generation and editing. Controlled comparisons and analyses further demonstrate
    that a single dense backbone can effectively support both capabilities without task-specific backbone computation,
    highlighting a simpler path toward unified multimodal modeling.
