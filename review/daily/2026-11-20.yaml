    models, families, and runs. Model CIs are bootstrapped over families and runs. C MCI Modelling Methodology Our
    goal with METR Capability Index (MCI) is to estimate AI capabilities and task difficulty along a single axis,
    in a similar spirit to the ECI and AECI. For these purposes, Item Response Theory has a few benefits, including
    allowing us to evaluate agents only on a subset of questions, accounting for differences in how difficult and
    discriminatory tasks are, and quantifying uncertainty in our capability estimates. Data First, we need to form
    a dataset of how an agent performed on various tasks. This is complicated somewhat by the fact that we have
    lots of closely related tasks, and sometimes have multiple agent attempts on a given task. Thus, we conceptualize
    our data in a hierarchical structure, where each hierarchy of data serves a different purpose in our IRT model:
    families: these are related groups of tasks. For instance, we have the AZsPCs family where the tasks are the
    individual competitions. Our data has 113 families. tasks: these are individual activities with goals the agents
    might pursue. Our data has 333⁠ 66 tasks, meaning an average of 2.9 tasks per family. runs: We often evaluate
    an agent on a task multiple times. A run is an independent instance of an agent performing a task. Our data
    has 38,180 scored run-level observations, meaning an average of ~4.7 observations per evaluated agent-task pair.
    The fundamental unit of analysis is a task, but we use runs to help more precisely estimate how an agent might
    do on a given task, and we use families to downweight tasks that are very similar. Basic IRT Model For each
    of our tasks, we define a scale in [0,1], where 0 corresponds to failure and 1 corresponds to full score⁠ 67
    , and fit a two parameter logistic for the score an agent \(m\) will get on a task \(t\)⁠: \[p_{mt}=\sigma (\alpha_{t}(\theta_{m}-\beta_{t})),\quad
    \sigma (x)=\frac{1}{1+e^{-x}}\] where \(p_{mt}\) is the expected score agent \(m\) will get on task \(t\)⁠,
    \(\alpha_{t}\) is the task discrimination, \(\beta_{t}\) is the task difficulty, and \(\theta_{m}\) is the agent
    ability. A difference of 0 between task difficulty, \(\beta_{t}\)⁠, and agent ability, \(\theta_{m}\)⁠, predicts
    that the agent will score 0.5 on that task. The slope parameter \(\alpha_{t}\) corresponds to how well a given
    task can distinguish between two agent abilities, in that a one unit increase in agent ability \(\theta_{m}\)
    predicts an \(\alpha_{t}\) unit increase in the log score odds. Task Dispersion Since our task suite is very
    diverse, we want to downweight ‘noisy’ tasks where our observed data is not well fit by our model. So, we fit
    a noise parameter for each task, called the dispersion (\(\varphi_{t}\)⁠), which is a function of run-level
    deviance (\(d_{mtr}\)⁠): \[\varphi_{t}=\frac{\sum_{m,r}d_{mtr}}{N_{t}-2},\quad d_{mtr}=2[y_{mtr}\log \frac{y_{mtr}}{p_{mt}}+(1-y_{mtr})\log
    \frac{1-y_{mtr}}{1-p_{mt}}]\] where \(y_{mtr}\) is the observed score for a run of an agent on a task. Mathematically,
    dispersion is approximately the average of the difference in log-likelihood between the fitted curve and the
    observed curve. Intuitively, dispersion measures how much individual run outcomes depart from what the fitted
    curve predicts. Larger departures mean we treat the task as noisier and give it less weight. Fitting the IRT
    Model To fit our two-parameter logistic, we maximize the fractional-logit log-likelihood. To reflect certain
    features of our data, we introduce a few adjustments to the fit: Downweighting of noisy tasks . We multiply
    by \(1/\varphi_{t}\)⁠, which is the inverse of our task dispersion parameter, to downweight noisy tasks. Partial
    downweighting on run count . We want more runs for a task to reflect increased confidence for a task, while
    not completely discounting tasks with only a few runs. So, we apply \(w_{mt}=1/\sqrt{n_{mt}}\)⁠, where \(n_{mt}\)
    is the number of scored runs for an evaluated agent-task pair. Partial downweighting on family size . Since
    families often include similar tasks and we want our model to be robust to adding many tasks within a given
    family, we add family-level down-weighting, \(f_{t}=1/\sqrt{q_{t}}\)⁠, where \(q_{t}\) is the number of fitted
    tasks in task \(t\)⁠''s family. Further, to help with model fitting, we add priors on our task discrimination
    and difficulties. In particular, our base priors are: \[\log \alpha_{t}\mid \mu \sim N(\mu ,3^{2}),\quad \beta_{t}\sim
    N(0,{10}^{2})\] We scale each task''s prior penalties by \(f_{t}c_{t}\)⁠, where \(c_{t}=\frac{\sum_{m}\sqrt{n_{mt}}}{\sum_{m}n_{mt}}\)⁠,
    the average run weight. We fit \(\mu\) as the weighted mean log discrimination, \(\frac{\sum_{t}f_{t}c_{t}\log
    \alpha_{t}}{\sum_{t}f_{t}c_{t}}\)⁠. Our full objective thus becomes: \[\max_{\theta ,\alpha ,\beta }\quad \sum_{t}\frac{f_{t}}{\varphi_{t}}\sum_{m,r}w_{mt}[y_{mtr}\log
    p_{mt}+(1-y_{mtr})\log (1-p_{mt})]-\sum_{t}f_{t}c_{t}[\frac{(\log \alpha_{t}-\mu )^{2}}{2\cdot 3^{2}}+\frac{\beta_{t}^{2}}{2\cdot
    {10}^{2}}]\] The dispersion \(\varphi_{t}\) is not part of this maximization; we use double GLM, which allows
    parameters to have their own noise parameter. In particular, we alternate between fitting with \(\varphi_{t}\)
    held fixed and re-estimating \(\varphi_{t}\) from the fitted curves, until all the parameters stop changing.
    The dispersion \(\varphi_{t}\) is estimated from unweighted run deviances; neither family nor run weights enter
    its update. We establish a scale for the ability and task difficulty axis by setting two anchor models: GPT-4o
    at -1, and Opus 4.6 at 0, and rescale the axis so that GPT-4o is at 0 and a one-unit change in ability is set
    equal to 633, which is the number of days between each model''s release. Confidence Intervals To produce our
    confidence intervals, we do a hierarchical bootstrap over families and then runs. Each sampled copy of a family
    independently resamples within each model–task pair. We resample whole task families because related tasks may
    provide overlapping evidence about model capability. Resampling runs captures variation between repeated evaluations.
    Differences from the ECI Our analysis is similar in spirit to Epoch’s ECI, but we do have a few notable differences,
    including: Source of difference How this is reflected in our model We run a task-based analysis, while the ECI
    runs a benchmark-based analysis. We’d expect our tasks to vary more in their reliability than benchmarks, since
    benchmarks aggregate over many questions or tasks. Thus, we downweight ‘noisy’ tasks where our observed data
    is not well fit by our model using our dispersion parameter. We have run-level data, and each run enters the
    fit as its own observation. The ECI fits one score per model-benchmark pair. We want the fit to account for
    how much evidence supports each observed average. Thus, we make it so that additional runs on a task count for
    more data. In particular, a model-task pair’s weight grows with its number of runs, and run-to-run variation
    contributes to the task’s dispersion parameter and bootstrap. We have the structure of tasks being in families,
    whereas the ECI does not. We downweight tasks according to the family size, so that certain families don’t dominate
    the analysis. We estimate uncertainty using a hierarchical bootstrap over task families and runs, while the
    ECI reports posterior credible intervals. D Limitations of IRT IRT provides a useful way to summarize model
    performance, but the resulting ability estimates and trends should be interpreted with several caveats: The
    ability axis reflects models’ patterns of strengths and weaknesses across tasks, rather than those of humans.
    In other words, this figure is not interchangeable with the original time horizons graphs – a linear trend on
    this axis may not necessarily correspond to linear growth in the human time required to complete tasks that
    the models can solve. We think IRT methods will likely be a lagging indicator of acceleration. When the most
    capable models reliably succeed on tasks that distinguish weaker models, there may be few informative comparisons
    available to estimate the size of their ability advantage. Without regularization, this can lead to wide confidence
    intervals on their estimated abilities, making acceleration difficult to distinguish from statistical uncertainty.
    As a result, a substantial capability gain may only become clear retrospectively, once additional models or
    harder tasks provide more informative comparisons. These trends do not account for internal models. It’s possible
    that internal models are far beyond the current frontier. Results can be sensitive to the IRT modeling decisions.
    To account for this, we conduct a variety of robustness tests, and generally find similar trends (see IRT robustness
    checks in Appendix E: MCI Robustness Checks ). We also purposefully do not place any priors on IRT ability,
    which can artificially lower confidence intervals. Changes in task composition can also affect the trend if
    different capabilities improve at different rates. The distribution of tasks here also may not reflect the most
    important capabilities necessary for frontier lab uplift, or for AI risk scenarios. We do not find any multi-dimensionality
    in performance (see IRT robustness checks in Appendix E: MCI Robustness Checks ). However, these checks cannot
    establish that our task suite captures all the capabilities relevant to AI R&D or AI risk. Identifying acceleration
    is a product of good task-design. One consequence of moving away from human baselines is that, for some tasks,
    we no longer know for sure whether the highest possible scores are achievable. This makes it harder to measure
    progress, since models may approach an unknown performance ceiling and appear to improve more slowly, even when
    their scores are well below the line the task developer sets as the best possible performance. We believe that
    this hasn’t affected our tasks significantly thus far, but may be a bigger problem going forward. E MCI Robustness
    Checks In this section, we assess our IRT model’s fit, test how sensitive our findings are to modelling choices,
    and examine what our ability estimates capture. How well does the model describe the data? Examine residual
    plots for abnormal patterns . Check whether the data support a single ability dimension . How sensitive are
    our findings to modelling choices? Vary the strength of our priors . Use a least squares objective instead of
    maximising a fractional-logit log-likelihood . Change the choice of anchors . Remove the down-weighting . Change
    the link function . What do our ability estimates capture? Test whether our analysis would detect acceleration
    if it occurred on our task suite . Compare our ability estimates with ECI estimates . Fit a linked-linear line
    to our IRT ability estimates (see Appendix H). In general, we find that our current assumptions are reasonable
    and that most modelling choices do not result in large changes to our ability estimates. Residuals First, we
    inspect our residuals, which additionally serves as a check for our choice of the logit link function. The following
    plots compare predicted score and actual score, to diagnose whether the logit link function is a good choice.
    We find that the link function does fit our data well, both for continuously scored tasks and for binary tasks.
    Data Figure 29: IRT residuals on continuously scored tasks Each point is a model–task pair. For model-task pairs
    with several runs, the y-value is the average score over that pair’s runs. Data Figure 30: IRT residuals on
    pass/fail tasks Each point is a model–task pair. For model-task pairs with several runs, the y-value is the
    fraction of runs that succeeded over that pair’s runs. Multidimensionality Check In our main analysis, we assume
    that ability is unidimensional. In this robustness check, we try fitting the model with more than one dimension
    to see if this assumption is reasonable. We employ the standard multidimensional 2PL model: \[p_{mt}=\sigma
    (\alpha_{t}(\theta_{m}-\beta_{t})+\sum_{k=1}^{K} {}\lambda_{tk}\psi_{mk}),\quad \sigma (x)=\frac{1}{1+e^{-x}}\]
    Where \(K\) is the number of extra dimensions, \(\psi_{mk}\) is model \(m\)⁠’s score on extra ability dimension
    \(k\)⁠, and \(\lambda_{tk}\) is how much task \(t\) depends on this extra ability dimension beyond \(\theta_{m}\)⁠.
    We find that ability is unidimensional in our data. First, almost all differences between models lie along one
    ability axis. Second, the model with one-dimensional ability fits better according to the BIC. Table 2. BIC
    results across extra dimensions Extra dimensions Extra parameters BIC difference (bigger is worse) +1 +366 +2,268
    +2 +731 +4,840 We can visually compare between our two-dimensional ability model, and we find that the difference
    between models lies primarily along our main \(\theta_{m}\) axis. Data Figure 31: Almost all differences between
    models lie along one ability Strength of penalties We include prior penalties on \(\alpha_{t}\) and \(\beta_{t}\):
    \[\log \alpha_{t}\mid \mu \sim N(\mu ,3^{2}),\quad \beta_{t}\sim N(0,{10}^{2})\] The \(\alpha_{t}\) penalty
    punishes tasks where the log discrimination is very far from the average log discrimination in the suite; \(\beta_{t}\)
    penalty punishes tasks whose difficulty is far from the level at which Opus 4.6 would have a 50% chance of success.
    Both priors are pretty weak, but especially the task difficulty prior. The log discrimination prior is necessarily
    somewhat stronger to help our CI bootstraps converge. We find that changing the strength of the prior penalties
    changes our results very little. Data Figure 32: Robustness to difficulty prior SD (baseline 10) Data Figure
    33: Robustness to log discrimination prior SD (baseline 3) Least Squares In our main analysis, to fit our two-parameter
    logistic, we maximize the fractional-logit log-likelihood. We do this since fractional-logit gives greater weight
    to a given prediction error near 0 or 1 compared to least squares. This fits our noise structure better, because
    we believe that small score changes near 0 or 1 can represent meaningful capabilities differences that least
    squares gives little weight to. In this robustness check, however, we try minimizing the least squares objective
    function. This involves a task-dispersion that looks like: \[\varphi_{t}=\frac{\sum_{m,r}d_{mtr}}{N_{t}-2},\quad
    d_{mtr}=2(y_{mtr}-p_{mt})^{2}\] And a full objective function that looks like: \[\max_{\theta ,\alpha ,\beta
    }\quad -\sum_{t}\frac{f_{t}}{\varphi_{t}}\sum_{m,r}w_{mt}(y_{mtr}-p_{mt})^{2}-\sum_{t}f_{t}c_{t}[\frac{(\log
    \alpha_{t}-\mu )^{2}}{2\cdot 3^{2}}+\frac{\beta_{t}^{2}}{2\cdot {10}^{2}}]\] We find that changing to a least
    squares objective function changes our point estimates very little. It does slightly increase the ability scores
    for the pre-2025 models, and significantly widens their confidence intervals. Data Figure 34: Robustness to
    different objective functions Sensitivity to Anchor In our main analysis, we choose GPT-4o and Opus 4.6 to anchor
    our ability axis at -1 and 0, respectively (0 and 633 on the MCI scale the charts show). We use anchor models
    because our axes would be under-determined otherwise; different combinations of ability, task difficulty, and
    task discrimination would give the same predicted score. We choose these two anchor models in particular to
    get coverage across our suite: both of them have been evaluated across many of our TH1, TH1.1, and TH2 tasks.
    In this robustness check, we see whether choosing two different anchor models would change our results. We find
    that the choice of anchor models changes our point estimates very little. However, as is expected, the confidence
    intervals for models farther away from the anchor models generally increase; this is especially true if the
    two anchor models chosen do not have good coverage across our suite (e.g., Opus 4.5 and GPT-5.4 haven’t been
    evaluated much on the TH1 and TH1.1 suite, so using them as anchors results in larger confidence intervals for
    models that have only been evaluated on those suites). Data Figure 35: Robustness to anchors Remove downweighting
    In our task, we downweight noisy tasks with our dispersion parameter, partially downweight tasks by family membership
    which proxies for task similarity, and partially upweight tasks depending on how many runs it has. Each of these
    weighting schemes is meant to handle our particular data structure. For instance, if we don''t downweight tasks
    by family membership, certain categories of tasks (e.g., Slay the Spire and the Al Zimmermann contests) can
    contribute a disproportionate share of information constraining ability estimates. It happens to be that these
    families supply information that agrees with everything else, but weighting is a principled way to limit the
    dependence on those particular families. Note that there’s a sliding scale here; we can treat individual tasks
    as observations, which is like "no weighting" has occurred, or we can treat whole family units as observations,
    which is conceptually equivalent to weighting each task by 1/(number of tasks in the family). We instead take
    a middle-of-the-road approach, where we weight each task by 1/sqrt(number of tasks in the family). Similar logic
    applies to the weighting based on the number of runs. We think these are all reasonable choices given our data
    structure, but do complicate our model. In this robustness check, we see how our results would change if all
    such weighting were removed. We find that point estimates don’t change much. Data Figure 36: Robustness to removing
    weighting Link Function In our main analysis, we use a logit link, which maps a model’s ability relative to
    a task’s difficulty to an expected score through a logistic curve. Logit is the standard choice for IRT. In
    this robustness check, we try four other links, which each change a different part of the curve’s shape: probit,
    cauchit, complementary log-log, and log-log. We find that changing the link function does result in very minor
    changes in our point estimates. Regardless, we feel that our choice is justified, considering that the logit
    link function is simple, standard, and suits our data well. Further, the point estimate changes don’t alter
    any of our conclusions. Data Figure 37: Robustness to link function Acceleration Detection One concern is that
    our model might somehow artificially constrain the point estimates from showing acceleration. This robustness
    check shows that our model could show acceleration trends, if models had performed very well. We do this by
    multiplying the score odds by some factor, such that they stay between 0 and 1. We find that our model is able
    to support "outlier" performance from models when we synthetically improve scores. However, this does not show
    that our task-design would necessarily allow for such trends, since we’re not entirely confident that a 100%
    is achievable on some of our tasks with no human baseliner. Data Figure 38: Robustness to injected acceleration
    Comparison to ECI We compare our ability estimates against Epoch’s ECI, one of the most well-known IRT-like
    models that places AI agents on a single "general capability" scale. The following figures are narrowed to the
    models present on both of our analyses, though each set of point estimates comes from a fit on that analysis’s
    full set of models. We allow for a linear transformation between the ECI ability axis and the IRT ability axis
    so that we can compare trends on the separate ability scales. In particular, we try rescaling two different
    ways: Linear rescaling to fit all model ability scores. A single line is fit through every model in both analyses.
    This gives the closest overall match between the two scales and shows how well they agree across the whole period.
    However, one limitation of this approach is that recent models help choose the line. If the two scales have
    drifted apart recently, the fit absorbs part of that drift by tilting the line, and the gap is spread across
    early and late models. Linear rescaling to fit only models released before October 2025. The line is fit to
    the earlier models and then applied unchanged to the later ones. This tests whether the relationship between
    the two scales that held before October 2025 has continued for more recent models. However, since the linear
    rescaling uses fewer model data points, any error in the fitted slope will grow the further the line is extended.
    Despite the many differences in modelling choices and data structure documented in Appendix C: MCI Modelling
    Methodology , we find that the ECI and our model share very similar model ability trends. However, we also find
    that when we rescale the ECI ability axis to only fit models released before October 2025, recent frontier models
    have slightly elevated ability scores in the ECI compared to our model. The exact reasons for the divergence
    are unclear, but Appendix H: Changes in Capability Growth Rates discusses some modelling and data considerations
    that may be relevant. Data Figure 39: MCI vs ECI F Estimating Lifecycle Cost for Tasks We define Lifecycle Cost
    as the estimated cost of developing a task, then running and scoring it 100 times. We used an LLM-Judge (Opus
    5.5) to estimate Lifecycle Cost given the task’s instructions, README, metadata and relevant source files, and
    a prompt as shown below. With an iterative process, we roughly calibrated the model-generated estimates to our
    own for around 10 tasks from varying domains and cost ranges by tuning our pipeline and prompts. We found that
    models were often poor at estimating total Lifecycle Cost for a task, but did better when provided a breakdown
    structure. We also found it better to make models estimate time when possible and procedurally convert that
    to cost accounting for considerations like labor rates, AI uplift, etc. We describe below more details on our
    methodology: Breakdown cost. The model estimates the hours to develop a task in four phases: initial implementation,
    test runs and improvements, quality assurance, and difficulty estimation (including human baselines). We convert
    hours to cost at \$150/hr rate for human labor. Account for AI uplift. We divide each phase''s cost by a rough
    speed-up from our own experience making tasks with AI: 4x for initial implementation, 2x for test runs and improvements,
    2x for quality assurance, and 1x for difficulty estimation. Include infrastructure cost to develop, run, and
    score. The model also estimates, in dollars, the infrastructure cost of development (e.g., tokens and GPUs for
    test runs) and the cost of running and scoring one attempt, including any manual scoring. Amortize shared cost
    within task families. The model splits development into work that other tasks in the same family reuse, such
    as a shared harness or grader, and work specific to the task. We split the shared cost evenly over the family
    (e.g., MirrorCode). We finally add up the parts above: a task''s share of the shared development cost, its task-specific
    development cost, and 100 times the cost of one attempt to run and score. We do not use any totals reported
    by the model itself. We don’t feel strongly about our choice of 100 here, which was picked based on public speculation
    about RL environment usage (e.g., see this piece by Mechanize). We also still find worse model performance when
    lowering this to running and scoring just 10 times (see ablation below). Our template prompt⁠ 68 is shown below:
    You will be shown data about a task, and then asked a question about the task. Your job is to read the question
    and the task data closely, and then provide a good assessment and answer to the question about the task. <task_data>
    { "task_id": "<family>/<task>", "task_version": "<version>", "datetime_created": "<date>", "task_source": "<HCAST,
    SWAA, RE-Bench, MirrorCode or TH2>", "instructions": "<the instructions the agent is given>", "scoring_instructions":
    "...", "readme": "<the task''s README, or null>", "compose": "<the task''s Docker compose file, or null>", "repo_link":
    "<link to the task''s source code>", "meta": { "summary.md": "<a short summary of the task>" }, "relevant_files":
    { "manifest.yaml": "<file contents>", "<task>.py": "<file contents>", ... } } </task_data> Estimate the cost
    to develop the task and to run and score it 10 times. Account for tasks that require manual scoring (and so
    use human time at human cost for scoring). Itemize the different potential costs (including compute costs, costs
    from the task taking a long time to run, costs to run scoring, any associated recruitment and management costs
    for specialized labor) and then sum them up. Assume all human time (engineering, domain experts, manual scoring)
    costs $150 per hour. Give your estimate in dollars. Also include a "breakdown" object in your json. Give the
    development work in hours for each phase, once for the shared part and once for the task_specific part: - shared:
    development that other variants of the same task would reuse (a shared harness, environment or grader) - task_specific:
    development specific to this task Phases: - initial_implementation: choosing the task, the spec and the scoring
    design, and writing the task, environment and scorer until it runs - test_runs_and_improvements: model runs
    to check the task works, reading their transcripts, and fixes and features after test runs, QA and review -
    quality_assurance: a human QA run, reward-hacking checks, review - difficulty_estimation: human baselines or
    human time estimates - development_compute: compute and tokens used during development, in dollars Also give
    per_attempt: the cost to run and score one attempt, in dollars. ```json {"reason": "...", "value": 7800, "confidence":
    0.6, "breakdown": {"shared": {"initial_implementation": 24, "test_runs_and_improvements": 10, "quality_assurance":
    3, "difficulty_estimation": 0, "development_compute": 200}, "task_specific": {"initial_implementation": 3, "test_runs_and_improvements":
