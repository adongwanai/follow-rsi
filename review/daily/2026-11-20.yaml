- id: arxiv:2611.26617
  title: 'One Prior, Two Dynamics: Repurposing Video Diffusion Transformers for Self-Supervised Latent Action Learning'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.26617'
  version: 1
  source_hash: a956d023e257d2d0aadf9895cc9be3e8b47c9606b77e552b67ca98a9e6789e10
  published: '2026-11-19T18:58:14Z'
  updated: '2026-11-19T18:58:14Z'
  hf_daily_dates:
  - '2026-11-20'
  abstract: 'Videos reveal how the world changes, but rarely the actions that cause those changes. Latent action
    learning recovers such supervision from visual transitions, yet often learns the underlying dynamics largely
    from scratch. We ask whether a pretrained video generator can instead provide the prior for both inverse and
    forward dynamics. We introduce O$^{2}$LaF, built on a simple principle: one prior, two dynamics. We initialize
    both models from the same pretrained video DiT and adapt them to their distinct roles: a feed-forward transition
    encoder with learnable action queries for inverse dynamics, and a causal, action-conditioned video generator
    for forward dynamics. By controlling information access and optimizing both dynamics end-to-end through a compact
    bottleneck, O$^{2}$LaF learns transferable actions from unlabeled videos. Across navigation and robotic manipulation,
    O$^{2}$LaF sets a new state of the art in few-shot action probing and enables stronger zero-shot action transfer
    across visual contexts and embodiments. Beyond generative video priors, we further extend our framework to predictive
    representation priors such as V-JEPA2, achieving competitive performance. Our findings suggest a broader paradigm
    for latent-action learning: repurposing pretrained video models to discover transferable actions and predict
    their consequences.'
