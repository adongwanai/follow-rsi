- id: arxiv:2611.26629
  title: Posterior Matching Distillation
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.26629'
  version: 1
  source_hash: 7b3a2158919621dfcfae5a22862b6f98d19977602567a887230bc1734815394b
  published: '2026-11-19T18:59:57Z'
  updated: '2026-11-19T18:59:57Z'
  hf_daily_dates:
  - '2026-11-20'
  abstract: Diffusion distillation accelerates image and video generation by compressing a pretrained teacher's
    iterative sampling process into a few network evaluations. Distribution-based methods achieve this by matching
    the student's output distribution to the teacher's. This matching is often driven by reverse-KL objectives,
    whose mode-seeking bias favors dominant teacher modes at the expense of diversity across samples. We introduce
    Posterior Matching Distillation (PMD), a new member of the distribution-based distillation family that combines
    mode-covering posterior sampling with any-step generation. At zero population loss, PMD recovers the teacher's
    full posterior of clean images at each trained noise level. Its stochastic student supports any-step sampling
    budgets within the trained timestep grid without further training. To learn these posteriors, PMD matches exponentially
    reweighted averages of student samples conditioned on a fixed noisy state to corresponding teacher posterior
    means. Under Gaussian corruption, exponentially tilted posterior mean is a single teacher evaluation at a shifted
    input. We prove that, matching tilted means over an open neighborhood uniquely identifies the full posterior.
    PMD thus supervises the entire conditional distribution through a family of mean constraints, without any auxiliary
    student-score network. Experiments on SDXL and FLUX.2 [klein] 4B demonstrate that PMD achieves the best FID
    among 4-step methods on both models, while maintaining competitive or leading performance across prompt-alignment
    and perceptual-quality metrics.
