- id: arxiv:2611.27116
  title: 'CoEvoBench: Can LLMs Drive Recursive Co-Evolution of Agentic Systems?'
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.27116'
  version: 1
  source_hash: bf1142af77be302d706ba1cebfc8eb8408d78aea9309d9a914c1afb5f246125b
  published: '2026-11-20T04:40:59Z'
  updated: '2026-11-20T04:40:59Z'
  hf_daily_dates: []
  abstract: The performance of an LLM agent depends on both its model and its harness, the code that mediates its
    interaction with tools and environments. Can LLM researchers drive this co-evolution as a recursive improvement
    process, deciding round after round which component to change when each change alters the value of the other?
    Existing benchmarks evaluate post-training or data research with the harness out of scope, or harness optimization
    with the model fixed, leaving this joint decision unmeasured. We introduce CoEvoBench, a benchmark that evaluates
    LLMs as researchers co-evolving the model and harness of a target agent across five agentic domains. Researchers
    start from a common base model and initial harness, train and revise within a 24-hour budget, and submit a model-harness
    pair that is scored on separate test tasks. Across five frontier researchers, the strongest closes more than
    four fifths of the gap to an instruction-tuned reference system, and co-evolution succeeds on interaction tasks
    but rarely on long-horizon coding. These results suggest that current LLMs can make a strong first improvement,
    but cannot yet turn feedback from an improved system into the next one. CoEvoBench provides a controlled testbed
    for measuring the research capabilities that recursive co-evolution requires.
