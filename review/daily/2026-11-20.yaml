  updated: '2026-11-20T12:26:00Z'
  hf_daily_dates: []
  abstract: Scene graph generation (SGG) aims to detect objects in an image and predict the relationships between
    them. The standard PredCls, SGCls, and SGDet settings show how much performance drops without ground-truth boxes
    and labels, but not where or why a model fails. Knowing this would allow fixing a model where it fails, without
    retraining. We propose RoHa-SGG (Root-cause-guided Harness optimization for SGG), which extends agentic harness
    optimization to SGG. It optimizes the harness, the inference code around a frozen SGG model. RoHa-SGG has two
    main LLM agents. A root-cause analysis (RCA) agent finds the components where the model fails and diagnoses
    why, and a proposer agent searches for a harness that fixes these causes. We evaluate RoHa-SGG on Visual Genome
    and PSG with representative two-stage, one-stage, and multimodal-LLM SGG models. The analysis shows that the
    components where ground-truth triplets are lost differ across models and datasets. RoHa-SGG improves every metric
    on all five model-dataset combinations. Graph-constrained R@100 and mR@100 rise by up to 15.8 and 26.4 points
    for the multimodal LLM and by up to 3.6 and 10.1 points for the two-stage and one-stage models. With root-cause
    guidance, the harness search reaches the final score of an unguided search up to three times faster.
