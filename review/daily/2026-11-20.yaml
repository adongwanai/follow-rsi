- id: arxiv:2611.00911
  title: 'S1CogBench: What System One Decision Models Can and Cannot Do on Cognitive Experiments'
  announced: '2026-10-31'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.00911'
