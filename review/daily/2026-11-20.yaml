  updated: '2026-11-20T16:28:51Z'
  hf_daily_dates: []
  abstract: 'Long-horizon embodied tasks require agents to ground instructions in changing observations, coordinate
    heterogeneous tools, and recover from failures that can propagate through downstream operations. Although existing
    LLM-based agents retain experience and refine reusable skills, successful local repairs do not by themselves
    establish complete-task gains over the current shared procedure library. We present EvoTER, an experience-driven
    framework that enables embodied agents to self-evolve tool-use skills without updating model parameters. EvoTER
    operates through a three-role evolution loop: Explorer records tool-use trajectories; Diagnoser distills successful
    and failed executions into skills for tool selection, parameter computation, postcondition checks, and recovery;
    and Validator retains candidate revisions only when they improve complete-task success in fresh sessions. In
    simulation, EvoTER improves overall task success from a pre-evolution baseline of 53.60% to 80.40%. In real-world
    experiments, simulation initialization reduces the attempts required to acquire short-horizon skills, while
    continued real-world evolution improves long-horizon success from 20% to 80%-100% across tasks and enables the
    evolving skill library to incorporate new tool functionality introduced after simulation development. Project
    page: https://evoter-project.github.io/'
