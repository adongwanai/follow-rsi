- id: arxiv:2610.42141
  title: 'RoboArchitect: Automating the Design of Robotic Agents with Persistent Memory'
  announced: '2026-10-30'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2610.42141'
  version: 1
  source_hash: 5574e8ff63eb8864dca862c609ea9a6753530c0504c9d86a497ec1c1dcddc7db
  published: '2026-10-30T17:58:48Z'
  updated: '2026-10-30T17:58:48Z'
  hf_daily_dates:
  - '2026-11-02'
  abstract: 'Recent work shows that a frozen robot policy performs far better inside an agent harness, where control
    code decides when to query the policy, consult vision tools, or command the arm directly. Yet today these harnesses
    are built by hand and redesigned for each new robot or benchmark. We show that harness design can be automated,
    offering a strong alternative to finetuning on a novel setup. In RoboArchitect, a coding model observes a robot''s
    rollouts, diagnoses failures, and iteratively revises the harness around the frozen policy. The harness evolves
    on a set of episodes for its optimization and is evaluated on held-out scenes and tasks. Without updating any
    model weights, RoboArchitect raises average success from 9.7% to 43.3% on unseen scenes (4.5x) and from 12.7%
    to 40.2% on unseen tasks (3.2x), across multiple benchmarks and policies. The gains are largest where the benchmark
    is far from the policy''s training data: wrapping a general-purpose policy, the evolved harness yields a specialist
    that often outperforms even the finetuned version. Intuitive control strategies are automatically designed,
    such as lifting a jammed arm clear or reaching in horizontally when an obstacle blocks the way from above. The
    harness also evolves its own persistent memory, carrying learned experience, such as effective grasp depths,
    into later decisions. These results suggest that substantial headroom in robotic manipulation lies in the agent
    harness, and its design can be effectively automated and optimized without weight updates.'
