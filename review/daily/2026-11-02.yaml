  updated: '2026-10-29T14:48:50Z'
  hf_daily_dates:
  - '2026-11-02'
  abstract: A capable voice assistant must do more than recognize words; it must understand requests, reason over
    context, sustain conversations, and act through tools. We present Apriel Voice 27B Preview, an open speech-language
    model that unifies these capabilities within a shared reasoning backbone while retaining text and image input
    modalities. Built on the post-trained Gemma 4 26B-A4B checkpoint, Apriel Voice directly processes speech and
    generates both responses and tool calls without requiring a separate dialogue model. We introduce a two-stage
    training procedure to adapt the model to speech. The first stage establishes the speech interface, while the
    second jointly adapts the projector and backbone through supervised fine-tuning, text replay, and source-dependent
    cross-entropy and forward Kullback--Leibler divergence supervision. Automatically constructed speech-conditioned
    dialogues provide conversational training data, while local teacher serving, overlapping teacher and student
    computation, and fused full-vocabulary losses enable efficient online distillation. In thinking mode, Apriel
    Voice achieves a score of 98.90 on Big Bench Audio, 81.13 on Speech-BFCL, and a task success rate of 65.51%
    on τ-Voice, with a mean latency of 1.91 seconds. It also achieves 51.27% English EVA accuracy and 74.13% experience
    pass@1. Finally, we deploy Apriel Voice 27B Preview on a custom serving platform to support interactive voice
    interactions.
