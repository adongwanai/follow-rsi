- id: arxiv:2610.39276
  title: 'MemSteer: Turning User Histories into Supervision for Agent Memory Optimization'
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2610.39276'
  version: 1
  source_hash: 5d59b95c1bbe5aaf41d8d3161cacf422d86e6e4631a9c0f8ee0c01a4048bdb97
  published: '2026-10-29'
  updated: '2026-10-29'
  hf_daily_dates:
  - '2026-11-02'
  abstract: An effective agent memory system should adapt to a user's history and task requirements. Human-annotated
    supervision can guide this adaptation by providing feedback for evaluating and improving memory designs. Yet
    suitable labels are rarely available for new user histories, and manually constructing QA pairs and supporting
    evidence is costly. We introduce MemSteer, which turns unlabeled user histories into question-answer (QA) supervision
    with supporting evidence for memory-design optimization. MemSteer constructs an evidence-grounded answer plan
    that specifies how facts across related records jointly support a reference answer. The plan guides question
    generation, while source-grounded auditing and blind answer recovery check the resulting annotations. To study
    the utility of this supervision, we develop MemSteer-Opt, which combines QA-based design evaluation with evidence-guided
    failure diagnosis to revise memory store, retrieval, and context construction without updating model parameters.
    Experiments on ATM-Bench and RHELM show that this supervision is competitive with official-QA-guided optimization.
    Relative to Base-BM25, MemSteer-Opt improves ATM-Bench Question Score by 13.4 points and RHELM accuracy by 4.1
    and 6.6 points without and with external data, respectively. The supervision also benefits two existing optimizers
    on ATM-Bench, while new-user experiments demonstrate continued design optimization using supervision generated
    from the target histories.
