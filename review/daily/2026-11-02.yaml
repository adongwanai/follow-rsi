- id: arxiv:2610.40339
  title: 'Wizard: Manipulate Any World in Real Time via Agentic Control'
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.40339'
  version: 1
  source_hash: 711d668cc3d59cd0920e2c36b681b7b0ae328070f1a1414da284fb8d00ccc99e
  published: '2026-10-29T16:03:19Z'
  updated: '2026-10-29T16:03:19Z'
  hf_daily_dates:
  - '2026-11-02'
  abstract: Recent advances in video world models have enabled the generation of increasingly realistic and interactive
    virtual environments, opening new possibilities for player-customizable gameplay. Agentic frameworks further
    advance this direction by decoupling explicit game logic and controllable world representations from visual
    generation. However, existing approaches support only simple game settings and predefined motion patterns, generalize
    poorly to unseen environments and characters, and offer limited real-time interactivity. In this paper, we introduce
    Wizard, an agentic game world model that enables real-time, precise control over character motions while generalizing
    zero-shot across novel scenes, characters, and actions. To achieve this, we construct a diverse dataset spanning
    750 scenes and 178 characters, incorporating skeleton and geometry information as structured representations.
    We leverage these representations as intermediate proxies to condition a video generation model, together with
    an adaptive masking mechanism that improves alignment between the conditioning signals and generated video rollouts.
    Furthermore, we introduce an agentic framework that explicitly maintains and updates game states, allowing players
    to freely configure their virtual worlds and exercise fine-grained control over character motions while preserving
    visual quality and gameplay consistency. By combining agentic control with structured proxy-based generation,
    our framework unlocks new possibilities for player-driven game creation with real-time, generalizable, and mechanically
    consistent world simulation.
