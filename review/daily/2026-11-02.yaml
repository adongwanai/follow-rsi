- id: arxiv:2610.40636
  title: Probing Spatial State Representations in Visual Foundation Models
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.40636'
  version: 1
  source_hash: 16f92488fc9975c1c4c5acbc34778a94b37963c74c419d391cb95ad2bf4e2065
  published: '2026-10-29T17:58:16Z'
  updated: '2026-10-29T17:58:16Z'
  hf_daily_dates:
  - '2026-11-02'
  abstract: 'An observer sees only part of the surrounding world, yet must keep track of what lies beyond the current
    view. Spatial perception therefore involves more than recognizing individual images: it calls for a persistent
    spatial state that is updated under self-motion and used to guide action. Do visual foundation models provide
    representations that support such a state? We study this question through four levels of spatial capability---spatial
    structure, object persistence, predictive spatial update, and actionability---using frozen-feature probes on
    ten representations under streaming egocentric observations of static indoor environments. The resulting capability
    profiles vary across tasks, network layers, and prefix lengths: strong readout of the visible scene does not
    ensure accurate object persistence or future-feature retrieval. Matched controls separate readout accuracy from
    reliance on visual history and motion. Native future prediction retains recoverable spatial structure, but a
    spatial reader trained on real features does not transfer to predicted features unchanged. Finally, goal-dependent
    candidate selection does not establish reliable continuous action utility: predicted actions respond to goal
    changes, yet supplying the correct goal does not reliably improve progress. Across the four levels, object persistence
    and actionability build on camera-pose readout, whereas feature prediction builds on visible-scene readout.
    Together, these findings motivate evaluating spatial representations not only by what can be decoded from them,
    but by whether that information is maintained beyond observation, updated predictively, and used for goal-directed
    action.'
