- id: arxiv:2610.19882
  title: 'BluePixel: Toward Native 4K Agentic Image Editing'
  announced: '2026-10-14'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.19882'
  version: 1
  source_hash: a14c218a26551296bed062f13d38d6a27d2a60a85d578c1955efe7ae962967b5
  published: '2026-10-14'
  updated: '2026-10-14'
  hf_daily_dates: []
  abstract: 'Instruction-driven image editing has reached native 4K, yet how such editors are trained remains undisclosed,
    and pretraining one from scratch is beyond most teams. The task itself compounds the difficulty: a single end-to-end
    editor cannot make precise parametric adjustments, match specialized experts, or interpret the vague instructions
    users actually write. We argue that 4K editing is a system problem rather than a single-model problem, and present
    BluePixel, which couples a native-4K editing model with an agent harness; the complete training recipe is disclosed
    in this paper. The model makes 4K training practical: it turns a 1K-pretrained editor into a native-4K one through
    progressive VAE adaptation that keeps 4K training as affordable as 1K, absorbs a long tail of vertical editing
    skills through continual learning, and refines the aesthetic-fidelity trade-off with reinforcement learning.
    Distillation via source-anchored target projection (SATP) then compresses 50 denoising steps to 4, completing
    a 4K edit in 8.7 s on a single Kunlunxin P800 XPU while preserving task success rate and background consistency.
    The harness, BluePixel Agent, makes editing controllable: it decomposes user instructions into specialist and
    general operations, verifies every result with the same reward model that guided training, and retries within
    bounded attempts. On VINS-4KEval++ (3,305 native-4K cases), BluePixel ranks second among seven models, behind
    only GPT Image 2 in non-edited-region consistency.'
