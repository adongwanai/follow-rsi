- id: arxiv:2610.30753
  title: 'FilmFlow: Agentic System for 3D Virtual Film Cinematography'
  announced: '2026-10-22'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
