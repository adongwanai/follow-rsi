- id: arxiv:2610.20935
  title: 'RAC: A Relational Agent Contract for Constraint-Governed Engineering Tasks'
  announced: '2026-10-14'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.20935'
  version: 1
  source_hash: 1c9f9d525ff36bdcd1bccf48350fc15727fb91e64bb8a6259c9bc87989d626b3
  published: '2026-10-14'
  updated: '2026-10-14'
  hf_daily_dates: []
  abstract: 'Engineering agents must produce artifacts that satisfy exact, coupled constraints. Existing solutions
    often require agents to make semantic decisions and also derive consequences such as precise geometry or timing
    from those decisions, leading to failures in constraint-governed engineering tasks. In this paper, we introduce
    RAC, a harness-agnostic contract for the action and feedback layer of engineering agents. It specifies authoritative
    observations, semantic actions, tool-based realization, independent verification, and repair evidence. The agent
    decides which relations an artifact should satisfy; specialized tools derive their concrete consequences. On
    PCB placement, routing, and repair tasks, RAC achieves the highest clean-pass rate for all nine evaluated models,
    averaging 90.9%, compared with 74.0% for the strongest baseline, requirements-only delegation. In job-shop scheduling,
    direct relational actions achieve 96.3% quality pass versus 59.6% for code-mediated delivery with access to
    the same scheduling backend. Our evaluations on 141 embedded-code tasks across four microcontroller identify
    the action contract as a source of agent capability: preserving semantic control while delegating mechanically
    derivable outputs improves the reliability of constrained artifacts.'
