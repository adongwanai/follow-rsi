  arxiv_id: '2610.06212'
  version: 1
  source_hash: 5edc5de115ed924f4e6e73d6c8430f538f980587f846948a72e840bb199fb47f
  published: '2026-10-05'
  updated: '2026-10-05'
  hf_daily_dates: []
  abstract: 'Online agents can improve future service by constructing reusable tools, guidance, or model states,
    but this work competes with current requests for the same GPUs. Exploiting idle compute for self-evolution faces
    a fundamental systems constraint: benefits arrive only after an artifact is published and used, while pausing
    evolution leaves service capacity waiting for memory release and runtime recovery. An investment worth completing
    may therefore be worth postponing. We present LearnSched, a state-aware scheduler that brings the reuse window
    of a capability and the timely return of compute into a common investment model. LearnSched incorporates candidate
    progress, checkpoint overhead, and the current recovery path into action values. Under the same information
    and capacity constraints, it uses one-step counterfactual rollout to choose progress, checkpointing, or waiting
    relative to a fully costed window policy. We characterize handoff costs through independent A100 component measurements
    and evaluate action selection in 1920 paired finite-model scenarios. When cold recovery is expensive, waiting
    for longer execution windows can improve net value by avoiding handoffs; in evaluated warm-recovery scenarios,
    the strong window policy already achieves the same value. Retaining recoverable state can shorten capacity return
    and reduce the need for complex evolution scheduling.'
