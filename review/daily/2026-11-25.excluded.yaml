- id: arxiv:2610.21266
  title: 'TRACER: A Multimodal Harness for Patient Care in Hospitals'
  announced: '2026-10-15'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.21266'
  version: 1
  source_hash: 552887c82cd0311f7a82b0d5ef758b21728433dd90a8125454b7f2f98f27776a
  published: '2026-10-15T05:00:47Z'
  updated: '2026-10-15T05:00:47Z'
  hf_daily_dates: []
  abstract: Continuous video and clinical records provide complementary information for understanding how patient
    behavior evolves over a hospital stay. A central challenge is how to represent behavior across the entire stay
    while preserving access to fine-grained visual and clinical evidence. We introduce TRACER, a training-free multimodal
    harness that constructs minute-level action records from video and combines them with clinical records into
    hourly reports. The harness equips an LLM agent with tools to query this hierarchy, inspect relevant video,
    and retrieve clinical records. To evaluate TRACER, we construct two benchmarks. The first contains 397 annotated
    one-minute clips spanning 15 atomic actions; the second poses 144 clinician-informed multiple-choice questions,
    grounded in 264 hours of video and clinical records from two ICU patients. TRACER achieves up to 84.8% accuracy
    for action detection and 61.0% QA accuracy versus 49.3% for the strongest baseline using the same backbone.
    Across 280 patients spanning approximately 60,000 camera-hours, TRACER identifies significantly less purposeful
    activity in patients with a positive delirium assessment during their stay than in those without (p < 0.0001).
    Our results show that combining continuous video with clinical records can support understanding of patient
    behavior over time and across patient cohorts without training on protected health data.
