  updated: '2026-10-23T08:28:29Z'
  hf_daily_dates: []
  abstract: Humans efficiently process multimodal streams spanning hours to years, building persistent, fine-grained
    spatiotemporal memories that support reasoning about and predicting long-horizon events. In contrast, existing
    benchmarks focus on short- and medium-context tasks, and most foundation models struggle to preserve fine-grained
    information over long horizons. To evaluate and improve long-horizon spatiotemporal reasoning, we introduce
    the LongVideo dataset and the 4DMemoryBench. LongVideo comprises about 900 hours of video and over 5,000 manually
    reviewed questions covering visual, textual, and spatiotemporal reasoning across diverse context lengths. We
    further develop the 4DMemory Harness, which integrates four complementary skills, 22+ specialized tool models,
    and a model-specific retrieval-augmented generation system. Evaluating 13 leading models, we find that standalone
    foundation models struggle with long-horizon tasks, while the 4DMemory Harness improves all of them by over
    50\%. Compared to previous benchmark, the same models exhibit a performance drop of more than 10\% on 4DMemoryBench.
    We hope 4DMemory will facilitate the development of spatiotemporal agents capable of addressing complex, long-horizon
    tasks.
