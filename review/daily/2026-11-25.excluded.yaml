- id: s2:6e81be5f1cc145aaf97a7a0b1944d5430d4ce68a
  title: A critical assessment of the rise of agentic AI, its capabilities, task domains and open challenges
  announced: '2026-10-05'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: null
  version: 0
  source_hash: 1bbaa1cd1eeef361dd9b0de5850f4e29d2a64983e13a282dbab9cb0a2281cbcb
  published: '2026-10-05'
  updated: '2026-10-05'
  hf_daily_dates: []
  abstract: 'The tremendous advancement in Large Language Models (LLMs) has triggered a fundamental reorientation
    in AI: from basic, single-prompt-based systems to agentic systems that can perceive the world, break down problems
    into multiple steps, use external tools, and continuously revise the generated response through a long-range
    dialogue. Although such a revolution is driven by four major technologies: instruction-following models, structured
    tool APIs, retrieval-augmented generation, and multi-agent orchestration systems, no holistic survey of this
    emergent field from a task-oriented unified point of view exists. We bridge this gap through a comprehensive
    survey of agentic AI systems structured by a taxonomy of nine capability domains: text analysis and understanding,
    code generation and software engineering, image and graphics generation, audio and music generation, video synthesis,
    mathematical and scientific reasoning, web and information retrieval, robotic and embodied control, and multi-modal
    and general-purpose agency. Within each domain, we present relevant systems and examine key design characteristics
    and capabilities, review evaluation results, and discuss limitations. A taxonomy flow diagram and capability
    matrix frame this survey, which discusses over 40 distinct agent systems in the body of the text, of which 37
    representative systems that span all nine domains are cross-tabulated in the capability matrix (Table 22). We
    discover a convergence on the foundational architectural substrate, comprising a core LLM, an integrated tool
    layer, an offloaded memory, and a planning component, yet substantial divergence in how these pieces are combined
    for the particular task domains. Our review indicates that whereas domain-specific agents (e.g., AlphaFold 3,
    Devin, Suno) currently maintain a lead in niche domains through the deep integration of specialized tooling,
    the top frontier general-purpose models (e.g., GPT-4o, Gemini 1.5, Claude 3.7) are rapidly catching up by augmenting
    their expanded tool-chains and deploying multi-agent orchestrations. Finally, we present 13 open challenges,
    ranging from long-horizon reliability to adversarial robustness, continual learning, cross-modal coherence,
    and governance, that serve as a blueprint for the transition from brittle, task-specific agents to reliable
    and versatile general-purpose intelligence and require a joint advance in model architectures, training methods,
    evaluation frameworks, and governance.'
