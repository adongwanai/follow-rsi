- id: arxiv:2610.27725
  title: 'World2HOSI: A Multi-Expert Harness for Long-Horizon Human-Object-Scene Interaction Generation'
  announced: '2026-10-20'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.27725'
  version: 1
  source_hash: fb2520b7b482a099427bda94d9f785911047369ea2941cc82dd4921ef98b2a4d
  published: '2026-10-20T06:43:51Z'
  updated: '2026-10-20T06:43:51Z'
  hf_daily_dates: []
  abstract: Long-horizon human-object-scene interaction (HOSI) is central to embodied AI, animation, and game development.
    Existing human-object interaction (HOI) and human-scene interaction (HSI) models excel in their respective domains,
    but none alone covers tasks requiring multiple interaction skills. Training unified HOSI models is hindered
    by scarce and costly data. We introduce World2HOSI, a multi-expert orchestration harness that generates continuous
    HOSI data from 3D Gaussian Splatting (3DGS) scenes and natural language instructions. Our key insight is that
    long-horizon HOSI hinges not on a stronger single model but on orchestration. Given a shared, structured scene
    state and an orchestration harness grounded in it, existing experts can jointly accomplish tasks beyond the
    reach of any of them alone. World2HOSI realizes this insight as a closed loop around a persistent scene state
    built from decoupled background and object assets. A harness plans action stages over this state, invokes experts
    via their native conditioning interfaces, and writes each action's effects back, so that every invocation is
    grounded in the evolving world. To reduce physical artifacts, bounded residual optimization and contact-driven
    physics simulation further ensure the physical plausibility of human motion and object manipulation, respectively,
    while preserving interaction intent. Experiments and a perceptual user study show that World2HOSI achieves the
    best task completion and interaction quality on the evaluated HOSI tasks, while generating more diverse data.
