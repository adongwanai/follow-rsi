- id: arxiv:2609.39382
  title: 'SkillFM: Generating Skills for LLM Agents via Latent Flow Matching'
  announced: '2026-09-30'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2609.39382'
  version: 1
  source_hash: 64cd6c78e9d7be13d37caf305d31c0b441566c9d6a75e766fc78756646dbe9bb
  published: '2026-09-30'
  updated: '2026-09-30'
  hf_daily_dates: []
  abstract: Textual skills provide reusable guidance for large language model agents, but existing approaches often
    rely on manually curated skill banks or reinforcement learning with indirect and delayed feedback. We introduce
    SkillFM (Skill Flow Matching), a generative framework that synthesizes task-conditioned textual skills directly
    without test-time skill retrieval. Our framework combines a codec for encoding and reconstructing textual skills
    in a continuous latent space with a conditional flow model trained using improved MeanFlow. At inference time,
    the learned velocity field enables single-step latent sampling, and an LLM-based decoder converts the sampled
    representation into textual guidance for a frozen downstream agent. We evaluate the framework on embodied tasks,
    question answering, and web shopping. On ALFWorld and Search-QA, our method achieves the best overall performance
    among the compared vector-based skill approaches. Our analyses further demonstrate that latent skill generation
    is an effective alternative to retrieval-based skill augmentation. Our code and training skill libraries are
    available at https://github.com/lulushang999/SkillFM.
