  updated: '2026-10-11'
  hf_daily_dates: []
  abstract: 'Large language model (LLM) agents are increasingly deployed as teams, yet they fail in characteristically
    social ways: information holders stay silent, dominant speakers anchor groups on wrong answers, and norm violations
    go unsanctioned. We present Agent Sociodrama, a framework for modeling and validating evolving social dynamics
    in LLM agent teams. Under fixed personas, agents''emotional states and directed, asymmetric relationships are
    updated every round by a unified external LLM judge and shape their subsequent interactions. Across six LLM
    backbones and five social scenarios, we assess social fidelity through classical social-theory patterns and
    agreement with human judgments. The resulting trajectories exhibit structured social patterns and model-specific
    differences. We then introduce Trajectory-Guided Persona Recasting (TPR), which diagnoses group-dynamic failures
    from interaction transcripts and social trajectories and recasts agent personas before rerunning the task. Across
    four collaborative benchmarks, TPR improves performance from both heterogeneous and randomly initialized agent
    persona compositions, yielding up to 83.3%p of accuracy improvement over the initial casting. On representative
    distributed-information cooperation and mixed-motive bargaining tasks, we outperform SOTOPIA and AgentVerse
    in three of four comparisons, by up to 37.5%p in Pareto rate. These results show that validated social trajectories
    provide actionable signals for repairing LLM agent teams.'
