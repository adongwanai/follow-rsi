- id: arxiv:2610.23470
  title: 'QD-Rec: Open-Ended Evolution of Recommendations via Quality-Diversity'
  announced: '2026-10-16'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.23470'
