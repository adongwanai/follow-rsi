  updated: '2026-10-16'
  hf_daily_dates: []
  abstract: Advances in reasoning, coding, and tool use enable LLM agents to solve operations research (OR) problems
    through iterative problem modeling, program construction, and verification. Yet passing self-authored verification
    does not ensure that the solutions satisfy task constraints and meet optimization quality. This gap can arise
    from correlated specification errors, where the generated program and its checks share omissions or misinterpretations
    of task requirements, alongside incomplete verification coverage and ineffective optimization strategies. We
    propose VERAS, a verification-guided adaptive search harness for reliable OR that uses verification evidence
    to prioritize feasibility repair, constraint-coverage review, and solution-quality improvement. VERAS combines
    task-specific solution checkers with a separate verification agent to examine candidate solutions against the
    task requirements. It uses verification feedback to guide feasibility repair, additional constraint checking,
    and objective improvement, while candidate acceptance criteria screen revisions for deterioration in output
    validity or constraint satisfaction. On ORAgentBench, VERAS achieves a 42.99% pass rate, exceeding the reported
    35.51% of Codex using the same LLM. Across two industrial-scale OR problems, VERAS reduces inter-datacenter
    peak bandwidth by 10.34% relative to native Codex and lowers annualized distribution network planning costs
    by 6.28% compared with expert-designed solutions. Code and evidence are available at https://github.com/holimario/VERAS.
