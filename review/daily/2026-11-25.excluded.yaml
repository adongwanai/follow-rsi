- id: arxiv:2610.04942
  title: Zero-Shot Time-Series Question Answering via Decoupled Perception and Reasoning
  announced: '2026-10-04'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.04942'
  version: 1
  source_hash: 5665da32b52d9e1645032c5a9f43c2b4c54bd20da01b17353a0b699ab4151756
  published: '2026-10-04'
  updated: '2026-10-04'
  hf_daily_dates: []
  abstract: Time-series question answering (TSQA) requires grounding linguistic queries and diverse answer formats
    in complex numerical observations. However, existing methods heavily overfit to specific datasets and struggle
    to generalize when input series, question contexts, and answer requirements shift simultaneously. To address
    this challenge, we propose TSHarness, an agentic framework that establishes a decoupled workflow for cross-dataset
    zero-shot TSQA. At its core, TSHarness divides and conquers numerical perception and contextual reasoning via
    a structured Time-Series Perception State (TPS). Guided by a reusable memory of analytical knowledge, a learned
    Tool Selector adaptively invokes numerical tools to extract salient statistical and temporal features into the
    TPS. The answering agent then performs semantic reasoning over the TPS to generate target outputs, triggering
    iterative re-perception through the feedback loop when evidence is deemed insufficient. By separating numerical
    feature extraction from question-specific reasoning, TSHarness eliminates the need for target-side training
    or answer feedback, providing a generalizable, cost-efficient foundation for zero-shot TSQA.
