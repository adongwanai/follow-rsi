- id: arxiv:2610.23186
  title: 'Code Skill Server: A Large-Scale Search Engine for Code Generation Skills'
  announced: '2026-10-16'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.23186'
  version: 1
  source_hash: 9f06c14c53b9fda5c100b39059f2eb5864bc9cfded621a43e5f83cd3038238f5
  published: '2026-10-16'
  updated: '2026-10-16'
  hf_daily_dates: []
  abstract: Agent skills have proven to be an effective technique for improving agent ability on specific tasks,
    including software engineering, natural science, and mathematics. During such a process, using agent skills
    often involves manually discovering and organizing skills from heterogeneous sources, while existing skill retrieval
    methods mainly focus on selecting relevant skills from established skill libraries. However, with the rapidly
    increasing number and variety of reusable agent skills, manually searching for relevant skills across heterogeneous
    sources is becoming impractical at scale. In this paper, we introduce the Code Skill Server (CSS), a large-scale
    search engine for finding the most useful code generation skills for a target task. CSS consists of a skill
    server that incrementally collects and indexes publicly available code generation skills from multiple sources,
    with 993 skills included in the corpus used in this work. Extensive experiments across different retrieval methods
    and code generation benchmarks show that the best CSS configuration improves Pass@1 by up to 13.91% and consistently
    improves all evaluated models by at least 4.21% in the cross-model evaluation. These results demonstrate that
    CSS can effectively search for and serve relevant skills, improving code generation quality and enhancing models'code
    generation capabilities. Code and the CSS-993 corpus are available at {https://github.com/haoyuli-sdu/CodeSkillServer}.
