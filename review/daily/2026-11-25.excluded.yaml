- id: arxiv:2610.35767
  title: 'Free to Look, Free to Reason: Simple LLM Harnesses Outdiagnose Hand-Crafted Root Cause Analysis Agents'
  announced: '2026-10-26'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.35767'
  version: 1
  source_hash: 9b64e2e0c93f771329e2a9bf53a350e42cfee939ec4d529053514d7e460b72c0
  published: '2026-10-26T17:12:02Z'
  updated: '2026-10-26T17:12:02Z'
  hf_daily_dates: []
  abstract: Root cause analysis (RCA) of microservice failures has attracted many LLM agents whose investigation
    is hand-crafted, through standard operating procedures, fixed stages and role agents. Each is evaluated on its
    own data against few baselines, so it is unknown whether this design beats letting a capable model investigate
    on its own. We compare three simple harnesses that prescribe none of the model's calls (one call over an evidence
    package, a SQL agent and the Codex coding agent) with five published LLM RCA agents and with statistical and
    causal methods on RCAtlas, 90 validated cases from eight public datasets, across six models and three reasoning
    efforts. The simple harnesses are the most accurate (PR@1 65-77% on three mid-tier models), ahead of the published
    agents (16-53%) and the non-LLM methods (6-39%), on every model on which both families were run. The published
    agents fix from a tenth to all of their model calls in the program, and a case study shows how these prescriptions
    skip the decisive evidence. A stronger model mainly improves reliability, a multi-turn harness mainly improves
    aptitude, and more reasoning effort changes accuracy by a few points at most while multiplying the time by up
    to seven. Among runs more accurate than the best non-LLM method, every Pareto-optimal run in cost or time uses
    a simple harness.
