- id: arxiv:2610.18866
  title: 'AutoAgent0: An Agentic Runtime for Safe Closed-Loop Driving'
  announced: '2026-10-13'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.18866'
  version: 1
  source_hash: 1b3aeab2ae4d8888edd2ebe807e7ebee9f96c472b1e7187bb63fbc5e32c767f7
  published: '2026-10-13'
  updated: '2026-10-13'
  hf_daily_dates: []
  abstract: 'Safe autonomous driving requires more than accurate planning at a single frame: it demands reliable
    closed-loop execution in dynamic environments. Although end-to-end driving policies have advanced rapidly, the
    accumulated closed-loop errors, especially in unseen scenarios, can push vehicles into states from which the
    same policy struggles to recover. We address the challenge by treating closed-loop driving safety as a test-time
    execution problem. We introduce AutoAgent0, an agentic runtime and harness framework that augments existing
    driving experts with complementary detection skills, rule-based action verification, and feedback-driven recovery.
    To address inaccurate scene perception, an independent detection module constructs scene context using complementary
    perception skills, and a rule-based verifier checks proposed trajectories against this context before execution.
    When the nominal trajectories are unreliable, the orchestrator of the runtime activates Recovery Planning, where
    an agentic loop constructs alternative action proposals from action primitives and iteratively refines them
    using verification feedback. This design combines independent scene assessment with feasibility checks and online
    recovery, addressing both perception errors and the limited recovery capabilities of individual experts. Evaluations
    on Fail2Drive and NavSafe-$\infty$ demonstrate improved closed-loop robustness over single-expert execution
    in long-tail and safety-critical scenarios. These results demonstrate that runtime supervision can improve closed-loop
    robustness across multiple driving experts without retraining the underlying policies.'
