- id: arxiv:2610.22319
  title: A team of Gemini 4 Argon agents beats Minecraft
  announced: '2026-10-15'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.22319'
  version: 1
  source_hash: aa019a271a7dce8db905dacd431fa61250f76471f270343d4817cf0dfe713cc4
  published: '2026-10-15'
  updated: '2026-10-15'
  hf_daily_dates: []
  abstract: 'We placed four Gemini 4 Argon agents in a sandboxed Minecraft survival world and gave them one goal:
    defeat the Ender Dragon. Each agent controlled a player via an open-source library called Mineflayer and coordinated
    with its teammates through in-game chat and shared memory. No one assigned roles or wrote game logic. The agents
    planned, wrote, and debugged every program themselves. Researchers could watch the run on a live dashboard and
    pause or stop it at any time, but they had no cause to intervene. Starting from a randomly generated world on
    Easy difficulty, the team wrote 2,783 programs and defeated the dragon in 27 hours and 14 minutes, dying 605
    times along the way. To our knowledge, this is the first end-to-end autonomous completion of Minecraft by AI
    agents, achieved using only the standard Mineflayer library without pre-scouted seeds or other game-specific
    tools written by humans. Winning required the agents to keep a coherent plan across thousands of dependent steps
    for more than a day. Complex real-world software engineering and enterprise tasks demand the same long-horizon
    coding and multi-agent coordination. We describe the setup, how the run unfolded, the team''s strategies (dividing
    the work, sharing what they learned, recovering each other''s items), and the limits of the result.'
