- id: arxiv:2610.26426
  title: 'HarnessRL: Co-Evolving Policies with a Just-in-Time Training Harness for Open-Ended RL'
  announced: '2026-10-19'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.26426'
  version: 1
