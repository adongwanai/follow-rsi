  abstract: Autonomous agents increasingly depend on harnesses that govern interaction, memory, tools, and execution
    around large language models (LLMs). While recent work has begun to evolve these harnesses from execution experience,
    the supervision used to guide evolution often remains relatively static, making it difficult to track changing
    behavioral weaknesses across rounds and potentially limiting generalization to unseen tasks. To address this
    issue, we propose RuHarness, a rubric--harness co-evolution framework for continual agent self-improvement.
    RuHarness continually discovers and reassesses behavioral criteria from execution trajectories, prioritizes
    the most relevant unresolved weaknesses, and uses them to guide targeted harness updates while keeping the task
    objective fixed. Extensive experiments across diverse agent tasks and backbone models show that RuHarness outperforms
    strong harness-evolution baselines, particularly on unseen held-out tasks. Further analyses show that adaptive
    rubric prioritization tracks shifting weaknesses and supports more sustained improvement and stable generalization
    across evolution rounds.
