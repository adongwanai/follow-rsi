  updated: '2026-10-25T08:09:22Z'
  hf_daily_dates:
  - '2026-10-22'
  abstract: Agent harnesses have become a central component of modern agentic systems, shaping how models use tools,
    manage context, and coordinate long-horizon interaction. Realizing the benefits of these harnesses depends on
    how effectively the underlying model can make use of them, motivating reinforcement learning directly through
    the harness. While recent efforts have explored harness diversification to reduce specialization to particular
    execution settings, how to systematically construct and organize harness diversity for cross-harness generalization
    remains insufficiently understood. This work studies Harness Scaling as a distinct scaling dimension for agentic
    RL, focusing on structured variation in how policies execute and interact with the same underlying task and
    environment. Concretely, we construct a factorized harness space, select a compact training subset with balanced
    factorial coverage, and organize cross-harness training through locality-aware task assignment. Across multiple
    benchmarks, model scales, and RL algorithms, Harness Scaling consistently improves generalization to unseen
    harness combinations. Moreover, policies trained through structured white-box harness variation transfer effectively
    to unseen external black-box harnesses, outperforming policies trained through a single complex black-box harness.
    These results establish harness diversity as a meaningful scaling dimension for agentic RL and highlight the
    importance of how this diversity is organized for cross-harness generalization.
