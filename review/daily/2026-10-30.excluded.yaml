- id: arxiv:2610.35439
  title: 'Omni-InteractScope: Benchmarking Proactive and Agentic Interaction in Continuous Omnimodal Streams'
  announced: '2026-10-26'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.35439'
  version: 1
  source_hash: fb2ff830d49f16be24300434db1f35256cea04e8320b307a044dda3b73a930f1
  published: '2026-10-26T13:39:48Z'
  updated: '2026-10-26T13:39:48Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Omnimodal large language models (Omni-LLMs) are increasingly expected to assist users while observing
    continuous audiovisual streams. However, existing evaluations provide limited insight into how reliably these
    models connect stream evidence and user needs to timely, sustained interventions. We introduce Omni-InteractScope,
    a benchmark of 1,479 human-annotated, cross-reviewed interactions with 1,790 temporal targets across eight task
    groups. It links input modalities, event triggers, intervention types, and user needs, covering event-timed
    tool invocation and query-free assistance alongside notifications, warnings, state tracking, and continuous
    responses. Our experimental results on the proposed benchmark reveal three critical limitations of current Omni-LLMs:
    (1) Timely tool invocation remains unreliable: all 12 evaluated models produce an on-time first response for
    at most 40\% of tool-invocation targets, and joint timing-and-tool accuracy reaches at most 32.0\%. (2) Query-free
    reminders remain poorly covered: all evaluated models achieve lower timely reference-target recall on query-free
    reminders than on explicit questions, measured on their respective target sets. Reminder recall never exceeds
    23.0\%. (3) End-to-end guidance coverage remains limited: nine models cover none of the 26 guidance sequences
    in full, and the remaining three cover only one to three sequences each. Targeted controls further show that
    tool-invocation scores alone do not establish event grounding and that reminder coverage depends on response
    history and frequency. These findings motivate developing and evaluating streaming assistants for timely action,
    initiative under general user needs, and coverage of entire response sequences.'
