  arxiv_id: '2610.22280'
  version: 1
  source_hash: b24b169efd5dfbf703343006ff2cb135a6485430299c263ccf1c288be8abeb92
  published: '2026-10-15T00:00:00.000Z'
  updated: '2026-10-15T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-16'
  abstract: 'Computer-use agents increasingly tackle long-horizon tasks, where running a frontier model at every
    step is expensive and a small open-weight model alone often fails. Weak-to-strong escalation offers a middle
    ground where a weak agent acts by default and hands control to a strong one only when needed. The core challenge
    is deciding when to escalate, which requires an uncertainty signal cheap enough to check at every step. However,
    even after handoff, the strong agent can still get lost, but a black-box API that the strong agent is usually
    served exposes no internals to monitor. To this end, we propose LEASH, a training-free framework that unleashes
    the strong agent only when the weak agent''s latent uncertainty signals it is needed, and keeps it on a leash
    afterward. LEASH has three layers: (1) initial task uncertainty for early routing, (2) step-level uncertainty
    for runtime escalation, and, after handoff, (3) a shadow observer for continued oversight of the strong black-box
    agent. Here, we use latent uncertainty as a fuel for all three layers. Specifically, we compare the weak model''s
    hidden states with those from its past successful and failed trajectories, and a state that looks more like
    the failures signals higher uncertainty. During weak-agent execution, our uncertainty estimator reuses activations
    already produced during action generation, so it needs no extra forward pass or dedicated monitor training.
    Experiments on OSWorld across four contemporary model backbones show that LEASH consistently improves over standalone
    weak agents and outperforms random escalation by 6.55--11.94 points at matched escalation rates. With Qwen3.5-35B-A3B,
    LEASH achieves 73.66% task success at $0.4117 per task, matching always-on Claude Opus 5 (72.90%) while reducing
    inference cost by 19.2%.'
