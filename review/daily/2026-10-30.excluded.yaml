- id: arxiv:2610.34283
  title: 'ChronoReplay: One Answer Interface Is Not Enough for Streaming Spatial Intelligence'
  announced: '2026-10-25'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.34283'
  version: 1
  source_hash: 6ae960b9cadeb1ce6c6e16a8a35d709e0098ff0dbc6ede0652d6d63df7fc91a6
  published: '2026-10-25T13:31:49Z'
  updated: '2026-10-25T13:31:49Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Training a spatial VLM to answer which side an object lies on does not require it to preserve the metric
    displacement that determines that answer, while supervision for a distance estimate may leave categorical relations
    largely unconstrained. When post-training emphasizes one readout, improvements can therefore concentrate on
    that interface while transfer to others remains weak or even degrades; we call this observed specialization
    interface lock-in. ChronoReplay addresses it by replaying heterogeneous spatial supervision as chronologically
    ordered episodes, retaining source-native targets, and balancing supervision across families. Under the same
    observation access, a single ChronoReplay checkpoint improves OVO-S-Bench, OST-Bench, and UCS-Bench together,
    including a 13.41-point gain on OST-Bench, and achieves the highest three-benchmark mean among the supervision
    settings compared here. Same-data controls further separate the ingredients of this transfer: answer serialization
    redistributes gains across OST and UCS, family-balanced learning improves over ordinary joint SFT and natural
    turn weighting, and chronological replay exceeds a shifted-order control by about 2.41 OST points across two
    paired seeds. Adaptive frame selection then changes evidence access while keeping the trained model fixed, providing
    an additional inference-time gain at lower visual cost. Streaming spatial performance depends on what distinctions
    supervision preserves, how heterogeneous histories are organized during learning, and what causal evidence inference
    makes available at test time.'
