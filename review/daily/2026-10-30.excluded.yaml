- id: arxiv:2610.33135
  title: 'WorldCast: World-Consistent Character Video Generation with Large-Angle Camera Control'
  announced: '2026-10-23'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.33135'
  version: 1
  source_hash: 329ff1e8b5445ea4283fcad56ab1d767c5861850c9e66ee93e67899371aca5ae
  published: '2026-10-23T00:00:00.000Z'
  updated: '2026-10-23T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-27'
  abstract: Precise camera control is essential for cinematic character video generation, yet existing methods struggle
    to follow large-angle trajectories with combined rotation, translation, and radius variation from arbitrary
    initial azimuths. Such viewpoint changes also reveal character regions unseen in the initial frame, causing
    geometric distortions, appearance degradation, and identity drift. To systematically study these coupled challenges,
    we introduce CLACT, a large-scale Character-centric dataset and benchmark covering diverse Large-Angle Camera
    Trajectories, with accurate camera geometry and multi-view character observations for training and evaluation.
    We further propose WorldCast, a framework for world-consistent character video generation under diverse large-angle
    camera motions. Specifically, we back-project the initial frame into a 3D point cloud using estimated depth,
    align the point-cloud scale with the target camera trajectory, and render it along the trajectory to obtain
    explicit geometric guidance and coverage masks. To complement the incomplete character information, we introduce
    Geometry-Aligned Memory Attention (GAMA). Using relative camera poses estimated jointly from the initial frame
    and multi-view character anchors, we express anchor and target-view geometry in a common coordinate frame. GAMA
    uses this geometric alignment to guide the retrieval and injection of view-relevant character features during
    generation. Evaluations across diverse large-angle camera trajectories demonstrate accurate trajectory following
    while preserving character geometry, appearance, and identity.
