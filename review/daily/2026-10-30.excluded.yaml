  abstract: Agent skills encode operational procedures and domain expertise as reusable knowledge assets, yet their
    distribution in plaintext exposes them to unauthorized copying and leakage. However, practical mechanisms for
    skill ownership verification and leakage tracing remain underdeveloped. Watermark embedding before distribution
    offers a potential solution, but structured, compact skill instructions impose stringent requirements for factual
    and procedural accuracy. To address these challenges, we introduce SkillMarker, a KGW-based watermarking method
    that jointly targets functionality preservation and strong watermark embedding. SkillMarker unifies quality-constrained
    rewriting with signal-oriented candidate search. The former separates essential knowledge from flexible expression
    to preserve instruction fidelity; the latter explores alternative expressions to obtain a stronger watermark
    signal under preservation constraints. We release an open-source toolkit that integrates watermark embedding,
    quality auditing, and detection to support the protection of agent skills. SkillMarker targets ownership verification
    and leakage tracing in distributed skill ecosystems, where content may be copied in whole or in part, or incorporated
    into other skills.
