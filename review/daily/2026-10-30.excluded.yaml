  abstract: 'Robots must act under physical and social constraints while adapting to changes in their environment
    and human needs. Existing embodied-agent systems often focus on specified goals or abstract execution into symbolic
    actions, limiting evaluation in an evolving world. We introduce TARSphere, a robot-oriented full-stack framework
    for physically and socially grounded long-horizon embodied agents. TARSphere-Infra runs robot policies in a
    physics simulator with embodied NPCs and constrained dialogue. An event-driven finite-state machine (FSM) uses
