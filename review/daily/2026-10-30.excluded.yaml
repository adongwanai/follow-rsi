  source_hash: 031f036b65c7523165b106153c23ab8a69b5a9f95e63cb548b18f3199998c38d
  published: '2026-10-21T00:00:00.000Z'
  updated: '2026-10-21T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-22'
  abstract: Linear-attention language models keep their context in a recurrent state of fixed size, where an inference
    system stores one copy of this state for every sequence it decodes at the same time. Storing the state at lower
    precision therefore lets more sequences share an accelerator. Existing state quantizers round the state after
    every generated token and report that four bits lose accuracy unless the bit width is raised or the model is
    fine-tuned.\par We introduce PACE, a post-hoc four-bit state quantizer. PACE rounds the state only once every
    few generated tokens, as chunked kernels already do once per chunk during prefill, and keeps the tokens generated
    in between in a small buffer. Rounding less often reduces the error that accumulates in the state. Additionally,
    we find that the large entries of the gated-delta state gather in columns, because some channels of the update
    written at each token remain large across many tokens. PACE therefore shares each quantization scale within
    one column. It also keeps the heads that retain rounding error longest at eight bits. On four hybrid models
    from 4B to 35B parameters, PACE with mixed four- and eight-bit heads is competitive with eight-bit DAMP on the
    three larger models at about two thirds of its memory, PACE with four-bit heads throughout scores higher than
    Q-Mamba at equal memory, and rounding every few tokens preserves the decoding speedup of the buffer.
