  abstract: 'Recent advances in multimodal large language models (MLLMs) have enabled them to act as autonomous
    agents, creating and editing 3D models via code or direct software manipulation. In practical workflows, these
    models must infer object shapes, materials, spatial layouts, and lighting from diverse references while strictly
    following instructions to reconstruct, modify, or design 3D content. However, existing benchmarks provide limited
    coverage of such open-ended requests across real-world scenarios. To bridge this gap, we introduce BlenderWorld,
    the first comprehensive benchmark dedicated to evaluating frontier models on realistic 3D creation tasks. BlenderWorld
    comprises 223 tasks spanning architecture, products, natural environments, and scientific visualization, driven
    by text, image, video, and structured specification inputs. To rigorously assess these complex deliverables,
    we establish a unified evaluation protocol: we render the submitted Blender projects from multiple viewpoints
    and evaluate them against 2,651 task-specific binary rubrics alongside holistic visual quality scores. Benchmarking
    thirteen frontier models reveals that GPT-6-Astra achieves the highest overall fused score of 79.9, followed
    by Opus-5 (73.0) and GPT-5.6-Sol (67.7). Ultimately, our findings reveal a critical bottleneck: while current
    models can parse broad instructions, they still profoundly struggle with fine-grained 3D spatial coherence and
    accurate structural reproduction in Blender, leaving substantial headroom for future 3D-native agentics.'
