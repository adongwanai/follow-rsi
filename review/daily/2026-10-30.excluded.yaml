- id: arxiv:2610.31162
  title: 'HiSTEVE 1.0: Harnessing Human-Interface VLA Agents for Open-World Games'
  announced: '2026-10-22'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.31162'
  version: 1
  source_hash: 0b914ba93278fdfc9c434556f370f8c64418a3e4c1e471653efb7e2133593c89
  published: '2026-10-22T00:00:00.000Z'
  updated: '2026-10-22T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-26'
  abstract: Building virtual embodied agents that operate in open-ended games like human players is a long-standing
    goal requiring both long-horizon autonomy and reliable native-interface control. As a procedurally generated
    open world, Minecraft provides a natural testbed for studying the integration of these capabilities. Existing
    agents typically provide either native visuomotor control without long-horizon autonomy or high-level planning
    executed through environment APIs or predefined skills. To bridge this gap, we propose HiSTEVE, a hierarchical
    VLA agent with a capability-aware agent harness. At the orchestration level, we equip the harness with structured
    memory for tracking progress and a VLM planner for selecting subtasks within the VLA's capabilities. To reliably
    determine subtask completion, we further introduce a policy-coupled task completion state detector that conditions
    on VLA policy context to signal candidate completion. At the control level, a single VLA executes all subtasks
    with vision-only perception and native keyboard-and-mouse actions. To mitigate interference between heterogeneous
    GUI and non-GUI interactions, we introduce regime-specific RMSNorm branches and separate mouse-movement token
    embeddings. We also train the VLA through world knowledge injection, imitation learning, and reinforcement learning
    with environment feedback to improve reliability and recovery. HiSTEVE achieves state-of-the-art atomic-task
