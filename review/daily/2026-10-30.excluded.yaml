- id: arxiv:2610.27712
  title: 'RLSplat: Resource-Linear Budget Control for Feed-forward 3D Gaussian Splatting'
  announced: '2026-10-20'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
