  abstract: 'Recent advances in general-purpose AI models and agentic systems have enabled them to perform some
    CAD tasks. A systematic assessment is now needed to establish what these systems can accomplish and how well
    their outputs meet engineering requirements. This paper presents an empirical study of GPT-6 Astra, a SOTA general-purpose
    AI model, across four basic CAD tasks: model understanding, generation, editing, and evaluation. We design test
    cases spanning different levels of complexity and engineering requirements. The results show that GPT-6 Astra
    can support multiple stages of CAD workflows, with successful outcomes in cases involving nontrivial geometric
    complexity. This suggests that general-purpose AI is beginning to offer practical value in almost all steps
    in CAD workflow. However, gaps remain between generating visually plausible geometry and producing valid, functional,
    and editable CAD models. Recurring errors in freeform geometry, parameter dependencies, and mating relationships
    between parts limit engineering usefulness. Agentic iterative refinement can improve results but does not consistently
    resolve critical errors; long completion times further constrain practical use.'
