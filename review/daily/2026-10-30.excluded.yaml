- id: arxiv:2610.34674
  title: Benchmarking Obstacle-Conditioned Safety in Household Robot Navigation
  announced: '2026-10-26'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.34674'
  version: 1
  source_hash: be8b41bb312f61e48a725c7af2e4369e66d1e163dbf4ee28c986aeadcca04c0c
  published: '2026-10-26T01:06:22Z'
  updated: '2026-10-26T01:06:22Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: Safe household navigation requires robots to regulate clearance and speed according to what an obstacle
    is and how close it is, without unnecessary conservatism. Yet existing evaluations do not test whether semantic
    safety distinctions are reflected in continuous motion. To that end, we introduce OSMA-Bench, an Obstacle-Conditioned
    Safe Motion Adaptation Benchmark built on spatially matched scenario sets that differ only in obstacle type.
    We also propose the Semantic Sensitivity Index (SSI), which measures whether clearance and distance-dependent
