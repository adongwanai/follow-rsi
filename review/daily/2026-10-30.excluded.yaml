- id: arxiv:2610.35864
  title: 'VibeVideoBench: Evaluating Multimodal Agents on Code-Driven Video Generation'
  announced: '2026-10-26'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.35864'
  version: 2
  source_hash: 15cf3f6ae7f34b5f2cce29f221f0e931655dd009b4f4029a5520a969842fdec3
