  arxiv_id: '2610.19560'
  version: 1
  source_hash: 0af625a0d5ebec7b506e4cd832636fb7f8476f367a58a196b9c7349d201efceb
  published: '2026-10-14T04:19:15.000Z'
  updated: '2026-10-14T04:19:15.000Z'
  hf_daily_dates:
  - '2026-10-15'
  abstract: In long-horizon tool-calling tasks, LLM agents can fail not only because of tool-use errors, but also
    because of ineffective interaction with users. Yet existing benchmarks largely assume cooperative and behaviorally
    stable users, leaving the effect of emotional variation on agent reliability underexplored. We introduce τ-Emotion-Bench,
    a ten-domain benchmark for evaluating tool-calling agents under controlled emotion-conditioned user interactions
    while preserving the underlying task objective. To scale both benchmark construction and agent training, we
    introduce Tracer, a scalable agentic data-generation pipeline that constructs grounded, policy-valid tasks and
    collects trajectories through an interactive agent--user--environment harness. By allowing dissatisfied users
    to terminate inefficient interactions, the harness provides an interaction-aware signal that filters trajectories
    with excessive user dependence and favors effective tool use. Experiments with two user simulators show that
    frontier agents remain unreliable, with substantial gaps between average task success and consistent task completion.
    Tracer-generated supervision consistently improves Qwen3 models across scales, generalizes to unseen domains,
    and transfers to τ-Bench and τ-Trait. Behavioral analyses further show that higher task success is associated
    with a better balance between tool execution and necessary user follow-up. Overall, τ-Emotion-Bench and Tracer
    provide a scalable framework for evaluating agent reliability under diverse user behaviors and improving tool-calling
    agents through interaction-aware supervision.
