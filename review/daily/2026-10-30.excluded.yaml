  abstract: 'Multimodal agents (MMAs) sustain interaction through reasoning, memory, tools, and feedback, most visibly
    as computer-use agents, while robotic systems (RSs) couple sensing and actuation under physical dynamics. We
    define multimodal embodied agents (MMEAs) as goal-directed systems that couple multimodal task reasoning with
    physical action and revise decisions from the resulting feedback. This raises a central question: what changes
    when a multimodal agent moves from computer-use to robot-use? We introduce PAPAV, a unified capability-centric
    framework of five recurring functions: Perceive the current state, Anticipate action effects, Plan a feasible
    course, Act through an interface or body, and Verify the outcome. Defined by function rather than architecture,
    these capabilities let PAPAV identify what all three share and then compare MMEAs with MMAs and with RSs. Five
    physical constraints, from partial observability to unverifiable outcomes, leave fewer choices fixed in advance
    and less room to reverse errors. Across 64 benchmarks, explicit evaluation centers on Act; only 5 assess Anticipate
    and 3 assess Verify, leaving both largely hidden behind task success. These constraints also frame the open
    challenges we identify. PAPAV therefore provides a common basis for designing reliable physical agents and measuring
    progress across all five capabilities rather than task success alone.'
