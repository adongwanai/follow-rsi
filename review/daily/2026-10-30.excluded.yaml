- id: arxiv:2610.20693
  title: 'Orbia: Do Generated Videos Form a Consistent 3D World?'
  announced: '2026-10-14'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.20693'
