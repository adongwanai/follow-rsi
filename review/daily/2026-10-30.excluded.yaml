- id: arxiv:2610.34491
  title: What Effort Level Should I Choose? On the Economics of Reasoning Effort in LLM Agents
  announced: '2026-10-25'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.34491'
  version: 1
  source_hash: 14343e2e9346b91b8fe35eb30db34be696f4c4b27bf85a03343076c15103bcaa
  published: '2026-10-25T18:33:17Z'
  updated: '2026-10-25T18:33:17Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Generative models increasingly expose a reasoning effort setting that lets users scale inference-time
    compute, trading higher cost for potentially improved performance. Users must choose an effort level before
    knowing whether extra reasoning will help, and even a successful run does not reveal whether the effort purchased
    was necessary. Reasoning effort is therefore a credence good: buyers observe the outcome but cannot assess the
    marginal value of the computation they paid for. In this work, we measure the counterfactual effect of effort
    levels on both proprietary and open-weight models on four benchmarks, spanning single-call reasoning and long-horizon
    agentic tasks. Effort, it turns out, does not consistently preserve tasks that lower effort solves, can overspend,
    and can change trajectory behavior. First, we find that although higher effort can raise accuracy in aggregate,
    it frequently fails on tasks that lower effort solved. Second, on the subset of easy tasks that every effort
    level solves, higher effort is generally more costly, with the highest effort level costing up to 42x as much
    as the lowest. Lastly, effort changes not only how many tokens are used, but also how agents solve tasks: at
    higher effort, agents verify their own work more heavily and more often search for solutions than work through
    problems directly, both of which lengthen trajectories without necessarily altering the outcome. These findings
    show that naively choosing the highest level is not only cost-inefficient but also offers no guarantee of the
    best instance-level performance. A simple alternative, starting at the lowest effort and escalating only after
    a verified failure, matches or improves on fixed top effort across all models and benchmarks at lower cost for
    most proprietary models.'
