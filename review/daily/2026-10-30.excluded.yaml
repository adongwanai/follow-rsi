  updated: '2026-10-26T10:54:11Z'
  hf_daily_dates:
  - '2026-10-29'
  abstract: Diffusion language models (DLMs) generate text through iterative denoising, enabling bidirectional context
    modeling and parallel token refinement. Recent studies have applied reinforcement learning (RL) to DLMs and
    improved their reasoning performance. However, the iterative denoising process makes credit assignment more
    challenging, as final outcome rewards provide limited information about how different tokens contribute to the
    final output. In this paper, we propose Denoising Token Credit Assignment (DTCA), a framework for token-level
    credit assignment in reinforcement learning for diffusion language models. DTCA estimates token contributions
    by measuring the improvement in prediction confidence of remaining masked positions after token commitment and
    groups these signals according to part-of-speech (POS) categories. These contribution weights are used to select
    informative denoising timesteps and assign token-level learning signals during RL training. DTCA further calibrates
    these learning signals according to token-level entropy changes induced by policy updates. Experiments on LLaDA-8B-Instruct
    show that DTCA consistently improves mathematical reasoning performance across different generation budgets,
    with gains of up to 9.0 points on MATH500 and 5.3 points on GSM8K over the base model.
