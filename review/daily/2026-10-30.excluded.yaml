- id: arxiv:2610.28655
  title: 'What Git Does Not Record: Provenance Legibility in Two AI-Assisted Research Repositories'
  announced: '2026-10-09'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.28655'
  version: 1
  source_hash: 72b5a75650248b7a990818493177031136e31d4460ea1921c7f37523079aae24
  published: '2026-10-09T00:00:00.000Z'
  updated: '2026-10-09T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-26'
  abstract: 'Publishers and funders increasingly ask authors to disclose how AI tools contributed to a piece of
    research. In computational work the repository is where an author or an auditor would look for the answer, and
    we ask what it can actually supply. We audit two single-investigator repositories by the same author in the
    same field, each carrying a different class of agent residue: a prescriptive trace of standing rule files and
    a narrative trace of a running agent scratchpad, in repositories of 466 and 103 commits. The two are legible
    in opposite ways. 85.6% of the lines ever committed to the prescriptive trace are visible at the current revision,
    and a standing rule states a conclusion and discards the episode behind it; the narrative trace records episodes
    and shows 21.8%. Counted by revision the gap is far smaller: 15 of the prescriptive trace''s 41 revisions leave
    no visible line, against 18 of the narrative trace''s 41. The Co-Authored-By trailer, the field an automated
    audit reads, is one of three AI trailer keys Project A carries and covers 66 of the 121 commits carrying any.
    In Project B it has low sensitivity against an explicit within-repository proxy: 39 commits revise a file maintained
    to hold an agent''s working notes and 1 (2.6%) carries the trailer. Project A''s repository-level rate is unstable
    in time too, stepping from 2.7% to 17.7% across a boundary we did not specify in advance. Repository channels
    disagree, and neither rate can be read as an involvement rate; we do not isolate the cause, and say so. We give
    a field-by-field account of which provenance claims such traces support, which they cannot, and which they answer
    confidently and wrongly, construct an auditable evidence ledger, and derive the requirements this places on
    any system meant to record research provenance as it happens.'
