- id: arxiv:2601.15351
  title: 'OmniSpectra: A Unified Foundation Model for Universal Spectra Representation Learning'
  announced: '2026-01-21'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2601.15351'
  version: 2
  source_hash: 4c14b8ae6a428b0b293a1c5cdd5c5ce4e131f03f2d352c3c6511decc5e56168d
