- id: arxiv:2610.34186
  title: 'HuGe: Scaling Humanoid Generalist Vision-Language-Action Models with Egocentric Experience'
  announced: '2026-10-25'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.34186'
  version: 1
  source_hash: e1381c65d8937ee8d0dfbff395257490a5afa7e433e5b4a0ee07c24026b8b88d
  published: '2026-10-25T09:46:41Z'
  updated: '2026-10-25T09:46:41Z'
  hf_daily_dates:
  - '2026-10-29'
  abstract: Extending Vision-Language-Action models (VLAs) to humanoid robots requires coordinated whole-body control
    and diverse demonstrations that are costly to collect in real-world scenarios. Although egocentric human demonstrations
    provide a complementary source of task experience, differences in visual embodiment and missing robot proprioception
    complicate transfer to humanoid policies. To address these challenges, we introduce HuGe, a family of Humanoid
    Generalist VLAs pre-trained on over 2,000 hours of egocentric human and robot data. Specifically, HuGe employs
    three existing representative VLA architectures to predict latent motion tokens for a pretrained whole-body
    controller, together with hand-control signals. Based on this, we introduce a three-stage training pipeline
    that combines egocentric pre-training, humanoid adaptation, and downstream fine-tuning. To facilitate transfer
    across embodiments, we construct pseudo-proprioceptive states through simulation playback during pre-training
    and modify arm appearance in egocentric observations through re-rendering during downstream fine-tuning. With
    this pipeline, HuGe achieves the state-of-the-art on simulation benchmark HumanoidArena. Furthermore, real-world
    experiments on the Unitree G1 indicate that augmenting robot demonstrations with visually adapted egocentric
    demonstrations significantly increases success on a pick-and-drop task.
