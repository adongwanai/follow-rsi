- id: arxiv:2610.25100
  title: 'Deep Fusion Memory: A Chunk-Level Parametric Memory for Large Language Models'
  announced: '2026-10-18'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.25100'
  version: 1
  source_hash: 94c6a48faa6228d64e99f33fd3d053800b07778d57502c80caf80ea2a8940d98
  published: '2026-10-18T00:00:00.000Z'
  updated: '2026-10-18T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-23'
  abstract: Large language models need effective ways to acquire and use external knowledge beyond what they retain
    from pretraining. Continued pretraining risks catastrophic forgetting, while retrieval at inference time can
    add substantial overhead. External parametric memory avoids online retrieval, but constructing its training
    data requires extensive offline search, and output-level interpolation provides only shallow fusion. We introduce
    Deep Fusion Memory (DFM), a parametric memory architecture that reduces this construction workload and incorporates
    learned memory into intermediate hidden states. A causal memory predictor learns to generate memory from the
    preceding context, using retrieved chunk embeddings from the corpus as supervision. The predicted memory is
    shared across tokens within each chunk and fused into their hidden states through gated cross-attention. Memory
    prediction and fusion are trained end to end with the backbone frozen, and inference requires no explicit retrieval.
    Compared with existing parametric memory approaches, which often construct token-level memory targets, DFM requires
    32times fewer retrieval queries and 2048times fewer retrieved items to construct its training data. Across six
    QA tasks, DFM performs better over the strongest baseline by 12.71% on Mistral-7B-v0.3 and 11.19% on Qwen3-8B-Base.
    Beyond QA, domain adaptation yields average gains of 6.51 and 4.38 points over Qwen3-4B-Base and Qwen3-8B-Base,
    respectively.
