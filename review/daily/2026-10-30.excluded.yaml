  arxiv_id: '2610.20220'
  version: 1
  source_hash: e44c0b5846fb4114077af140efb3b5740653b7ffa4560f10c7d51e4fd7f9fdf6
  published: '2026-10-14T00:00:00.000Z'
  updated: '2026-10-14T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-15'
  abstract: 'Autoregressive generation underlies real-time, causal video synthesis and is the backbone of video
    world models. Today''s dominant approach distills a bidirectional diffusion model into a causal few-step student,
    but existing pipelines make this conversion prohibitively expensive, requiring offline Probability Flow ODE}
    (PF-ODE) trajectories that cost tens of thousands of GPU-hours and terabytes of storage. We show it can be made
    dramatically more efficient. Pushing this efficiency to its extreme, we reduce trajectory supervision to a single
    sample, the strictest setting possible, and find that it causes severe quality collapse. We trace this to the
    teacher''s trajectory geometry: the high-noise regime, governing semantic layout and motion, and the low-noise
    regime, governing fine texture exhibit fundamentally different curvature and optimization behavior, so a single
    monolithic student cannot jointly fit both, causing severe representation interference. Motivated by this, we
    propose Glance Forcing, a lightweight distillation framework that decouples the denoising trajectory into two
    complementary slow and fast experts, each guided by a tailored, stage-specific objective, while keeping the
    pretrained teacher entirely frozen. This decoupling further reveals a general mechanism underlying few-step
    distillation: PF-ODE distillation mainly straightens the few-step trajectory geometry, while the subsequent
    distribution-matching stage independently governs distributional quality. Using only one PF-ODE trajectory,
    Glance Forcing already surpasses the fully-trained state-of-the-art baseline, raising the VBench Total score
    from 84.04 to 84.22 while cutting trajectory-collection cost from thousands of GPU-hours to about one A100-GPU-hour,
    with markedly larger gains in dynamic degree, VisionReward, and instruction-following, and consistent preference
    from human raters over strong baselines.'
