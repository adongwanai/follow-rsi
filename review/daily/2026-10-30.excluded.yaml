- id: arxiv:2610.35684
  title: 'OmniShowcase: Omnidirectional Subject-Consistent Video Generation from Multi-View Images'
  announced: '2026-10-26'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.35684'
  version: 1
  source_hash: 0616f4878bdebfa4b427f54de3d21c3339a9e232c6b12996268ce8c5e764e840
  published: '2026-10-26T16:19:59Z'
  updated: '2026-10-26T16:19:59Z'
  hf_daily_dates:
  - '2026-10-29'
  abstract: 'Generating videos of a specific subject from a few reference images remains challenging when the camera
    reveals surfaces that are not visible in the input. Early subject-to-video (S2V) methods condition on a single
    reference image and must therefore infer the subject''s unseen appearance and geometry as the viewpoint changes.
    To address this limitation, recent methods extend S2V to multiple reference views, providing more information
    about the subject from different viewpoints. However, they do not explicitly specify the 3D structure that connects
    these observations. In addition, existing training data do not guarantee that viewpoint changes preserve the
    same underlying 3D subject. We present OmniShowcase, built on two components: (i) a fully automated data synthesis
    pipeline that produces training videos along diverse camera trajectories, with viewpoint variation driven by
    underlying subject geometry, even spanning full 360-degree orbits; and (ii) a geometry-conditioning method that
    provides the video model with a turntable of surface-normal maps reconstructed from the reference views without
    requiring temporal alignment with the generated frames. We construct Showcase-4K, a corpus of 3D-asset-based
    videos covering twelve camera motions across 88 trajectory configurations with reconstruction-derived surface-normal
    conditioning, and ShowcaseBench, a held-out evaluation set with the source meshes and camera parameters used
    to render each video. Experiments show state-of-the-art subject identity and 3D consistency while maintaining
    competitive video quality and motion. Project page: justin4ai.github.io/OmniShowcase'
