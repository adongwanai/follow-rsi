- id: arxiv:2610.31924
  title: Sub-monolayer tracking of molecular states at buried interfaces
  announced: '2026-10-22'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.31924'
  version: 1
  source_hash: 12f06320aca09c105af07fb6a1884e25114b37fcdda80519ad661e9292bb3c38
