  updated: '2026-10-21T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-22'
  abstract: 'Forming an accurate theory-of-mind (ToM) is key to successful multi-agent collaboration and requires
    reasoning under uncertainty to capture multiple possible partner states. This is hard to do in the text representation
    space native to large language model (LLM) agents, which more easily describe a single partner state. To address
    this challenge, we introduce ToM2Vec, which learns to form abstract theories-of-mind in a rich latent space
    via a fixed budget of continuous reasoning tokens. During training, supervision for these tokens comes from
    the partner''s actual thoughts, which the ToM tokens are trained to abstract and match. At test-time, ToM tokens
    are generated by each agent and act as conditioners for that agent''s thoughts and actions. Across several environments
    covering collaborative, competitive, and mixed-motive settings (Overcooked-AI, multiparty negotiation, Decrypto,
    Hanabi, and Collab Escape/Capture), we evaluate ToM2Vec''s ability to support multi-agent interactions and collaboration,
    finding consistent improvements over the base model and a variety of competitive trained and prompted baselines.
    We show that latent reasoning is critical, with performance dropping when reasoning is expressed in text. Moreover,
    we show that ToM2Vec training generalizes to partner model families not seen at train-time, including a proprietary
    model (GPT-5.4). In our analysis, we provide evidence that the latent tokens encode a ToM, rather than task-specific
    information: ToM2Vec''s tokens improve the agent''s ability to directly answer questions about partner beliefs,
    desires, and next actions.'
