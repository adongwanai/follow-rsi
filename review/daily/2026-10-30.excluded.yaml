- id: arxiv:2610.31635
  title: 'HiP3R: Hierarchical Pose Graphs for Long-Horizon 3D Reconstruction'
  announced: '2026-10-22'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.31635'
  version: 1
  source_hash: 1c4cab4f301a00c45c0f0b5f11ff9dfa8cb65816d0e0f978f3408df987721ba5
  published: '2026-10-22T00:00:00.000Z'
  updated: '2026-10-22T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-27'
  abstract: Feed-forward models accurately estimate camera motion and 3D geometry from short video windows. However,
    computational and memory costs prevent direct inference on sequences containing thousands of frames. Long videos
    must therefore be processed as overlapping chunks. This division produces independent local reconstructions
    with inconsistent coordinate frames and duplicate estimates of shared cameras. Achieving global consistency
    requires propagating constraints from adjacent overlaps and distant revisits across the sequence. This requirement
    naturally motivates pose graph optimization. However, the choice of graph level creates a trade-off. Chunk-level
    graphs efficiently resolve scale drift and close large loops. Yet, their rigid transformations cannot correct
    internal errors or conflicting frame predictions. Conversely, frame-level optimization offers local flexibility,
    but scaling it globally is computationally expensive and can break metric scale. HiP3R resolves this trade-off
    using a hierarchical pose graph. HiP3R first optimizes a robust chunk-level Sim(3) graph to establish the global
    layout and scale. It then holds this layout fixed and estimates one shared SE(3) camera per frame, turning overlapping
    window predictions into a single trajectory. Experiments across multiple benchmarks demonstrate the effectiveness
    of HiP3R in improving camera trajectories and 3D reconstruction. Our method applies to both chunk-based and
    streaming backends without additional training or fine-tuning. The codes are available at https://kkakkkka.github.io/HiP3R.
