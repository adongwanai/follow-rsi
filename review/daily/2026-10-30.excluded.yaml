- id: arxiv:2610.20424
  title: 'BizBench: Unveiling Hidden Challenges in Deploying Long-Horizon Agents for Real-World Business'
  announced: '2026-10-14'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.20424'
  version: 1
  source_hash: 6e29f4b67e7832ced7b05356cfedd99e506692c6efe0b921214ca7781a0c2f53
  published: '2026-10-14T00:00:00.000Z'
  updated: '2026-10-14T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-19'
  abstract: 'Existing long-horizon agent benchmarks often emphasize final task success while providing limited assessment
    of intermediate execution validity. Yet real-world business operations require agents to navigate extensive,
    potentially outdated or conflicting policies while satisfying critical constraints throughout execution. These
    requirements are particularly consequential in high-stakes domains such as payments, where intermediate violations
    can incur financial losses or regulatory consequences regardless of the final outcome. To bridge this evaluation
    gap, we introduce BizBench, a multi-turn benchmark grounded in real-world procedures from a leading payments
    company. Its executable environment integrates 789 knowledge documents and 601 discoverable business tools,
    with consistent policies, states, and tool behavior. The benchmark comprises 50 tasks involving resource constraints,
    temporal dependencies, prior commitments, and conflicting or outdated guidance. Each task is validated through
    reference execution, while deterministic checks assess both goal attainment and execution validity without prescribing
    a single solution path. Experiments reveal substantial limitations even among frontier models: Claude Opus 5
