  published: '2026-10-24T00:00:00.000Z'
  updated: '2026-10-24T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-27'
  abstract: 'Successful tool-use trajectories are not necessarily useful supervision. Even successful interactions
    may underrepresent multi-step dependencies or contain actions that are unjustified by the information visible
    to the agent at decision time. We identify two coupled requirements for effective trajectory supervision: compositional
    coverage, so that important observation-action dependencies are represented, and decision grounding, so that
    each supervised action is supported by the learner-visible interaction history. We introduce Trajectory2Gym,
    which constructs executable interactions around under-supported compositional structures and derives supervision
    only from grounded decisions in their realized executions. Structural-support selection allocates the resulting
    experience, while parent-normalized supervised fine-tuning preserves the semantic interaction as the unit of
    training weight. This reframes trajectory generation as the deliberate construction of learnable interaction
    experience, rather than the collection of successful trajectories. Across five Qwen3 scales, Trajectory2Gym
    improves Tau1, Tau2, and BFCL at every tested scale, increasing the equal-weight three-benchmark mean by 16.9-29.8
    percentage points. The gains are strongest in stateful and multi-turn interaction, where later decisions depend
    on earlier observations and feedback. Our results suggest that scaling tool-use agents depends not only on collecting
    more successful trajectories, but on constructing interactions whose dependencies are represented and whose
    decisions are learnable from the agent''s visible history.'
