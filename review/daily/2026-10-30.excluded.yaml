- id: arxiv:2610.20597
  title: Co-Evolving Acting and Forecasting for Language Agents
  announced: '2026-10-15'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.20597'
  version: 1
  source_hash: bb9f88755ae24da2ad345bb13b6d9d14ae9bb2b5465d37ec880c56fa47677d31
  published: '2026-10-15T00:00:00.000Z'
  updated: '2026-10-15T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-20'
  abstract: 'Training language agents is bottlenecked by the high cost of long-horizon rollouts, yet standard agentic
    reinforcement learning (RL) learns only from a terminal scalar reward, leaving the supervision in intermediate
    steps largely unused. Prior work exploits this supervision through value targets that estimate per-step success
    probabilities or observation targets that fit environment response. Both are hard to construct well: (1) value
    targets come from the same single scalar signal for each step in the trajectory, and (2) observation targets,
    such as web pages and terminal logs, are long and noisy and reach only one step ahead. We propose CoPE, which
    adds a third kind of multi-step action targets. On successful on-policy trajectories, CoPE trains the policy
    backbone to generate the action sequences that follows each history. Each action is also supervised when forecast
    from the preceding histories, forming a temporal ensemble that the shared backbone absorbs during training,
    and this enables acting and forecasting to co-evolve. The policy still acts one step at a time at inference,
