- id: arxiv:2610.32285
  title: 'Trial by Trace: Benchmarking AI Agent Harnesses for Reliability and Failure Attribution'
  announced: '2026-10-23'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
