  updated: '2026-10-27T01:04:39Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Video stylization typically transforms entire scenes, while local artistic editing requires precise
    region--style association, spatial control, and temporal consistency. We introduce LociArt, a unified paradigm
    for free-style local video stylization that explicitly specifies where to stylize and what style to apply while
    preserving non-target content. At its core, GRNStyle builds on Generative Refinement Networks (GRN) and introduces
    a polar style-aware mask that embeds style identities as equal-norm directions within selected regions. Complementary
    representation--geometry conditioning combines encoded mask features with raw-mask spatial support, integrating
    spatiotemporal context with geometric control. To provide paired supervision, we develop an automated pipeline
    combining global stylization, video object removal, matting, and compositing, and construct the LociArt-100K
    Dataset with 100K local stylization pairs. We further establish the LociArt Benchmark, comprising 80 source
    videos and 84 target masks covering 168 foreground/background stylization cases, with a Style Prototype Similarity
    (SPS) evaluation scheme for regional style quality and complementary measures of non-target preservation and
    temporal consistency. Experiments show that GRNStyle outperforms existing methods in regional style quality
    and spatial control while maintaining strong temporal consistency. Qualitative examples further illustrate joint
    stylization of multiple regions with the same or different learned styles, despite training only on single-region,
    single-style pairs. Together, these components provide a unified foundation for learning and evaluating controllable
    local video stylization. Project page: https://higherhu.github.io/lociart/.'
