- id: arxiv:2610.19128
  title: 'CLASHarness: Benchmarking Multi-Agent Conflict in Computer Use via a Controllable and Verifiable Generation
    Pipeline'
  announced: '2026-10-13'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.19128'
