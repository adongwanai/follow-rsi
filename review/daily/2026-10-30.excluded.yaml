- id: arxiv:2610.13623
  title: 'APEX-Harm: Evaluating Agent Safety in Shared Professional Workspaces'
  announced: '2026-10-09'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.13623'
