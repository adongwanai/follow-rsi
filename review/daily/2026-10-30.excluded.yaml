- id: arxiv:2610.15166
  title: 'ExeWorldBench: Benchmarking Code-Based Executable 3D World Modeling'
  announced: '2026-10-10'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.15166'
  version: 1
  source_hash: bf0797b6908272baec22c65dad35f0f239224c44a07419166b4e2e920a26ed6d
