  abstract: 'Expert human readers process large inputs (e.g., code repositories and long documents) by skimming
    to closely read only what matters. On the other hand, language models process all input tokens through each
    model layer, resulting in significant processing costs for long-context inputs. We introduce TokenGate, a small,
    drop-in component that extends existing trained models to enable end-to-end learnable token pruning over long-context
    inputs for fast and memory-efficient prefill. To enable end-to-end learning despite the non-differentiable top-K
    operator for token pruning, we introduce token-gated attention, a mechanism inspired by Mixture-of-Experts that
    re-weights attention logits using token importance scores. Across diverse tasks, TokenGate achieves 1.4-11.3times
    faster time-to-first token (TTFT) and 1.5-3.4times lower peak memory at no accuracy degradation for prefill
    in transformers. Compared to the best-performing prior methods for token-pruning, TokenGate gives up to 6.4times
    faster prefill and 2times lower peak memory. TokenGate natively extends both standard transformers (e.g., Qwen3)
    and hybrid-attention models (e.g., Qwen3.5) with simple lightweight adaptation comparable to standard parameter-efficient
    fine-tuning. We make our code available at: https://github.com/tokengate-models/TokenGate.'
