- id: arxiv:2610.22507
  title: 'RealCLI: Toward a Unified Evaluation of Human-Agent Collaboration for CLI Agents'
  announced: '2026-10-15'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.22507'
  version: 1
  source_hash: a9c61b8707285e5bddd8bffe1563c609d0f752b49002e4f03b3fb380d02b9f0a
  published: '2026-10-15T18:03:13Z'
  updated: '2026-10-15T18:03:13Z'
  hf_daily_dates:
  - '2026-10-29'
  abstract: 'Command-line interface (CLI) agents increasingly execute longer-horizon tasks, yet existing benchmarks
    either assume that user instructions remain fixed throughout execution or evaluate task outcomes without capturing
    runtime collaboration quality. In this paper, we present REALCLI, a paired benchmark that unifies the evaluation
    of task execution and human-agent collaboration quality on realistic CLI tasks. To comprehensively measure collaboration,
    REALCLI builds a five-dimensional framework, operationalized into 22 sub-dimensions and 51 interaction scenario
    templates. REALCLI provides two modes for paired comparison: REALCLI-EXEC supplies complete specifications upfront,
    whereas REALCLI-COLLAB introduces a scripted user that delivers progressive information, corrections, constraint
    revisions, and authorization decisions. Evaluations reveal profound capability gaps in frontier agents: the
    best configuration attains an average score of only 49.2%, and when evaluated by the joint collaboration score
    (J_{collab}), the peak performance reaches merely 37.6%. These results show that task effectiveness diverges
    sharply from collaboration quality, with models consistently struggling in steerability, trust calibration,
    and safety boundary management. REALCLI provides a rigorous, reproducible foundation for measuring and advancing
    collaborative CLI agents.'
