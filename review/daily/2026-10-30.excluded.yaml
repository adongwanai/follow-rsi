  abstract: 'Recent world action models provide visual foresight and future prediction for robot manipulation, but
    lack explicit mechanisms for compositional skill reuse. Agentic robotics combines code-based planning and reasoning
    with reusable skills, but often lacks predictive grounding in physical dynamics. We introduce AW-0, an agentic
    world action model framework that integrates code-based planning with joint video and action prediction. We
    jointly model code, future video, and robot actions as three coupled generative streams within a unified mixture-of-transformers
    architecture. Within this architecture a code expert generates parameterized skill routines and control logic
    while video and action experts generate future visual states and low-level motor commands. Code serves two complementary
    roles: it structures multi-step prediction and control within the world model and represents skills as reusable
    programs for subsequent agentic execution. We further introduce an automated curation pipeline that labels robot
    and human video trajectories with aligned programs and consolidates recurring routines into reusable skill libraries.
    Evaluations on RoboTwin 2.0 and physical bimanual manipulation tasks show improved task performance over VLA
    and WAM baselines, alongside gains in language following, semantic reasoning and robustness, demonstrating that
    agentic code enables connection between planning, prediction and execution within WAMs.'
