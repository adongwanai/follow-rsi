- id: arxiv:2610.36192
  title: 'Beyond the Estimate: Wiener-Informed Decoding for Easier Training of Pixel-Space Flow Models'
  announced: '2026-10-26'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.36192'
  version: 1
  source_hash: a78c5825825962ef012b88ec387f228274cee6f1dc75128193cecc98a78fe5db
  published: '2026-10-26T19:24:42Z'
  updated: '2026-10-26T19:24:42Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Learning velocity fields directly in pixel space is difficult and slow. We show that coarse second-order
    image statistics can ease this task: frozen Wiener estimates improve velocity learning, with gains extending
    beyond the linear predictions they explicitly provide. Moreover, we observe similar but complementary gains
    from frozen bases and pixel decoding. These observations motivate Wiener-informed Decoding (WiD), which uses
    statistical knowledge both for direct prediction and to organize decoder computation without modifying native
    blocks. WiD combines a trainable Wiener prediction path with coefficient interfaces that inject features into
    the native decoder and return its predicted coefficient corrections, with these components initialized with
    data statistics. All introduced parameters, including the spectrum and coordinate transforms, are trained jointly
    under the original pixel-space velocity objective. Across model scales and decoder architectures, WiD accelerates
    training and improves generation quality with modest parameter overhead. It also yields smoother gradient trajectories
    and remains effective with representation alignment. WiD improves class-conditional and text-to-image generation
    across different resolutions. On ImageNet 256 x 256, PixelDiT-XL with WiD reaches FID 1.53 after 500 epochs,
    achieving comparable quality to PixelDiT with 37.5% fewer training epochs. Statistical denoisers contribute
    beyond the estimate: their computational structure can also ease pixel-space training.'
