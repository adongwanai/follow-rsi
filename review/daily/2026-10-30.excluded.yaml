- id: arxiv:2610.20731
  title: 'WorldCast: Exploring Intelligent Visual Generation in World State Prediction'
  announced: '2026-10-14'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
