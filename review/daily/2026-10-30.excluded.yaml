  updated: '2026-10-27T17:59:52Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: Vision-Language-Action (VLA) models have made substantial progress in robotic manipulation, but their
    generalization remains constrained by the diversity and coverage of action-labeled robot demonstrations. Human
    videos provide much broader behavioral and environmental experience, while learning from them faces a fundamental
    trade-off between scalable data and explicit action grounding. We introduce ThinkWorld, a VLA learning framework
    that grounds action reasoning in world dynamics and strengthens it through reinforcement learning with world
    imagination. ThinkWorld represents each action thought as a Chain-of-Dynamics (CoD), a sequence of discrete
    motion tokens that captures the intermediate dynamics connecting the current world to a future state and serves
    as a common action representation across embodiments. We first initialize CoD with action-labeled demonstrations,
    then predict the future induced by each CoD and reinforce those whose predictions better match the observed
    outcome. This enables videos without action annotations to provide direct supervision from observed state transitions,
    allowing human and robot experience to refine the same reasoning space. Experiments in simulation and on real
    robots demonstrate effective human-to-robot transfer and strong generalization to unseen tasks and environments.
