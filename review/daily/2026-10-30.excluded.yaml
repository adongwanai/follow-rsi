- id: arxiv:2610.20832
  title: Amortizing Sequential Experimental Design in Reasoning LLMs
  announced: '2026-10-14'
  window_status: null
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.20832'
  version: 1
  source_hash: bfecd3a2e41ab7494ff5b9823cd415d51eb12cefcb31b21246a1df2365dd0753
  published: '2026-10-14T19:15:58Z'
  updated: '2026-10-14T19:15:58Z'
  hf_daily_dates:
  - '2026-10-29'
  abstract: Despite their extensive pretraining knowledge and strong reasoning capabilities, large language models
    (LLMs) struggle to adaptively gather information in experimental design tasks. We study how to amortize sequential
    Bayesian experimental design (BED) into an LLM by explicitly training the reasoning that guides action selection
    using information-gain rewards. Our approach specifies the experimental generative model independently of the
    LLM's own beliefs, allowing us to optimize expected information gain under a model of our choosing. We investigate
    the design choices for amortization, including alternative generative-model constructions, reward estimation,
    hypothesis-space specification, multi-step objectives, and computational costs relative to training- and inference-time
    BED baselines. On Twenty Questions, the resulting policies improve information acquisition and task performance,
    outperform inference- and training-time BED baselines at substantially lower computational cost, and generalize
    to unseen categories. We further demonstrate positive transfer from Twenty Questions training to Medi-Q, a real-world
    clinical dialogue benchmark. These results suggest that information gathering can be learned as a generalizable
    reasoning skill in LLMs.
