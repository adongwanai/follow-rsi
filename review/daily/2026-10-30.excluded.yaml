  abstract: LLM routing dynamically selects and coordinates heterogeneous language models across diverse tasks.
    However, existing approaches are largely built around a predefined execution paradigm, such as single-round,
    multi-round, or agentic routing, which fixes how model calls are organized and limits adaptation to different
    query needs. We propose RouteWeaver, a unified routing framework that integrates these routing modes within
    a single LLM policy, jointly learning which mode to use and how to select models within that mode. To jointly
    optimize mode selection and within-mode execution, we develop COMET-GRPO (COordinated Mode-Execution Training),
    which decouples the trajectory-level advantage into separate signals for mode selection and within-mode execution,
    enabling more targeted credit assignment to each decision level. We further introduce progressive exploration,
    which gradually shifts training from externally assigned modes to autonomous selection, so that the router first
    learns how to execute each mode before deciding when to use it. We evaluate RouteWeaver across mathematics,
    coding, knowledge, logical reasoning, and factual recall. RouteWeaver achieves an average accuracy of 61.4%,
    an 11.03% relative improvement over the strongest baseline, and outperforms all compared baselines in each of
    the five domains. Ablations show that both COMET-GRPO and progressive exploration are important for adaptive
    routing; without progressive exploration, the routing policy collapses entirely to single-round execution.
