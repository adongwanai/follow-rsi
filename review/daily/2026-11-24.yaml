- id: arxiv:2611.32085
  title: 'ExpGuard: Guarding Long-Horizon LLM Agents against Corrupted Experience'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.32085'
  version: 1
  source_hash: d4dc0fce9e4443900262010d8f5d5643a540ebf02a33b71ffa2ab7d419acda25
  published: '2026-11-24T07:09:54Z'
  updated: '2026-11-24T07:09:54Z'
  hf_daily_dates: []
  abstract: 'Long-horizon large language model (LLM) agents distill past trajectories into reusable experiences.
    Misleading or adversarial guidance in source trajectories can corrupt these experiences, allowing harmful instructions
    to persist across tasks and influence future agent actions. Assessing the risks of potentially corrupted experiences
    poses three challenges: (1) modeling provenance and execution dependencies before experience reuse, (2) learning
    task-conditioned risk from trajectory outcomes, and (3) repairing risky experiences at online inference. To
    address these challenges, we present ExpGuard, a framework for retrieval-triggered experience risk assessment
    and online repair. Specifically, to tackle challenge (1), ExpGuard integrates experience semantics with provenance
    and execution dependencies in a task-conditioned heterogeneous graph to predict attack and task-failure risks
    before experience reuse. To enable task-conditioned risk supervision and tackle challenge (2), we conduct matched
    counterfactual replays of each original experience and its minimally neutralized counterpart from the same task
    and environment checkpoint, deriving separate risk labels from differences in attack success and legitimate
    task completion. To tackle challenge (3) at inference time, ExpGuard repairs candidate experiences flagged as
    high-risk by the graph-based predictor at retrieval and re-predicts their risks before they enter the agent''s
    active experience context. Extensive experiments demonstrate the effectiveness of ExpGuard in identifying risky
    experiences and defending agents against experience corruption.'
