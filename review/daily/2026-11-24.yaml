  hf_daily_dates:
  - '2026-11-24'
  abstract: We present WeMM-Ecom, a family of multimodal large language models that deliver frontier e-commerce
    capabilities while achieving state-of-the-art general-purpose performance at their respective scales. The family
    spans five sizes, from a 0.8B dense model to a 35B mixture-of-experts model with 3B active parameters. Our training
    pipeline begins with two-stage continued pre-training that progressively raises the proportion of e-commerce
    data within a diverse multimodal data mixture, followed by hybrid-thinking post-training that combines on-policy
    distillation and reinforcement learning to support both non-thinking and thinking modes. For evaluation, we
    construct a comprehensive suite of 28 e-commerce benchmarks (23 in-house and five open-source) covering eight
    business scenarios and complement it with 64 public general-purpose benchmarks. On the e-commerce suite, WeMM-Ecom-35B-A3B
    surpasses substantially larger open-source flagship models, including Qwen3.8-Flash-Next, HY4, and DeepSeek-V4.1-Flash.
    On the general-purpose suite, every WeMM-Ecom model surpasses its similarly sized Qwen3.5 counterpart, with
    the lightweight variants (e.g., WeMM-Ecom-2B) showing clear advantages over leading lightweight models such
    as Qwen3.5-2B, MiniCPM-V-4.7-1B, and LFM3-VL-2B. Beyond benchmarks, WeMM-Ecom now powers hundreds of production
    use cases in WeChat, including catalog management, multimodal product search, and livestream commerce, serving
    billion-scale requests per day. We publicly release all model weights and detail our data curation, training
    recipe, and benchmark construction to facilitate future work on domain-specialized multimodal models. We have
    released the model weights and code to facilitate future research at https://github.com/Tencent/WeMM-Ecom.
