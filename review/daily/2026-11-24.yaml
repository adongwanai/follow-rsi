- id: arxiv:2611.33519
  title: 'PRECEPT: Security Self-Improvement of Coding Agents via Evolving Principles'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.33519'
  version: 1
