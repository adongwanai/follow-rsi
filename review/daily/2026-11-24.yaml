- id: arxiv:2611.31733
  title: 'MOSAIC: Memory-Organized Search with Anti-Imitation Crossover for Training-Free Microarchitecture Optimization'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.31733'
  version: 1
  source_hash: fbb4f610fa340a860f997c8a74375cbc2fc370d3089e9733fac1d92d1b6daf7c
  published: '2026-11-24T00:38:05Z'
  updated: '2026-11-24T00:38:05Z'
  hf_daily_dates: []
  abstract: Large language models can generate cache-replacement policies. The central challenge is to retain performance
    on workloads excluded from the search. In our adaptations of published search methods, generated code resembles
    established policies, with cosine similarities of 0.78-0.84. The wider comparison also shows held-out harmonic-mean
    instructions-per-cycle (IPC) losses of 1.0-2.4%. We present MOSAIC, a search controller that improves policies
    without updating language-model weights. It stores concise lessons from previous evaluations rather than repeatedly
    copying high-scoring code. When improvement stops, it selects two high-scoring policies whose code embeddings
    differ and asks the model to combine their mechanisms. Novelty prompts and model rotation support this search;
    controlled memory edits test how the stored lessons affect later proposals. We evaluate cache replacement using
    intervention-level cross-validation and a wider comparison on ten memory-intensive SPEC2006 workloads. MOSAIC
    reaches a 51.1% peak hit rate on the primary search workload and a 47.9% held-out mean in the intervention study.
    Removing crossover reduces these values by 7.8 and 21.8 percentage points, respectively, whereas the tested
    stronger model improves the held-out mean by 0.4 points. In the wider IPC comparison, MOSAIC has the smallest
    held-out gap (0.31%) and the highest held-out IPC among the evaluated LLM configurations. Adapting the same
    controller to data prefetching gives a 4.8% mean speedup over the LRU reference configuration. The accompanying
    corpus contains 10,687 generated policies with lineage and per-iteration prompt logs.
