  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.29355'
  version: 1
  source_hash: bc4abc1c8ea438c9cd23165bfb12571521fb909eee60bda3814bc609b914f88a
  published: '2026-11-22T09:43:53Z'
  updated: '2026-11-22T09:43:53Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Vision-language models have become a new kind of describer, writing about almost anything people see,
    and their descriptions now shape how cultures are known by people and by other models. Descriptions of cultures
    tend to turn particular things into types, and what a description loses shows what its describer lacks. We introduce
    Polytropos, a benchmark that measures what model descriptions of cultural objects keep of the particular object
    by turning each description back into an image and comparing it with the original photograph. On 374 objects
    from the Metropolitan Museum of Art and the Getty, with 1,870 descriptions from five models and 230 written
    by curators, reconstructions are recognised as the recorded culture more often than the photographs, at 54.55%
    to 59.09% against 52.14%, yet 16% to 21% of objects change outcome and only 0.49% of reconstructions are identified
    as the specific object. On the same objects, models lose recorded cultures at a rate similar to curators but
    gain more. Model descriptions give each object many faces, each typical of its culture and almost none the object
    itself.
