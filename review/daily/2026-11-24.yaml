- id: arxiv:2611.29897
  title: 'Motion Mamba 2.0: Autoregressive Diffusion Mamba for Long-Horizon Humanoid Control'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.29897'
  version: 1
  source_hash: df652b407a5f7562330ebf4987a09bbad3f402a7836686e265e7b03d29b84cb0
  published: '2026-11-23T01:51:57Z'
  updated: '2026-11-23T01:51:57Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Long-horizon, real-time controllable motion generation is essential for interactive animation and humanoid
    robotics, where an agent must respond to changing instructions and spatial goals while moving. Existing autoregressive
    diffusion methods generate motion incrementally, but bounded attention caches limit access to distant history,
    while repeated denoising introduces substantial inference overhead. We present Motion Mamba 2.0, a Mamba-based
    root-body diffusion architecture that integrates local attention, resumable recurrent states, and persistent
    content memory (PCM) for long-horizon controllable motion generation. PCM transforms compressed motion history
    from Mamba recurrent states, together with state changes and text-conditioned features, into dynamically updated
    content slots accessible to local attention. To enable efficient inference, we further develop an execution
    scheme tailored to this architecture, combining CUDA Graph replay, fused kernels, and execution-flow simplification
    while preserving the canonical history update. Evaluations on retargeted HiPHI demonstrate accurate terminal
    control over rollouts of up to 39.52 s, while short-horizon comparisons on BONES Seed and retargeted HumanML3D
    show that the model also retains strong spatial control and text-motion matching. On an RTX 4090, the optimized
    execution reduces median complete-window latency from 1685.35 to 276.14 ms, achieving a median paired speedup
    of 6.138$\times$ while preserving identical outputs and committed states in the tested rollouts. Moreover, we
    conduct extensive real-world evaluation on the Unitree G1, demonstrating sequential text-guided action composition,
    expressive motion, and interactive locomotion through keyboard and mouse control.
