  abstract: Vision-language model (VLM)-based agents offer a promising approach to robotic manipulation, yet remain
    limited by inadequate memory organization, uncertain failure attribution, and limited reuse of execution experience.
    We propose Embodied-Harness, a dual-agent framework that improves manipulation by refining the execution harness
    without updating model parameters. The Actor interacts with the environment through a robot-control interface,
    while the Reflector converts execution evidence into reusable operational guidance. Hierarchical Memory Architecture
    maintains short-term execution context and long-term experiential knowledge to support execution and reflection.
    Evidence-based Experience Reflection grounds failure diagnosis in observed interactions, while Recursive Harness
    Self-Improvement refines operational guidance across successive attempts. Experiments on RoboTwin 2.0, RoboSPA,
    and RMBench demonstrate the effectiveness of Embodied-Harness in generalization under environmental variations,
    spatial reasoning, long-horizon planning, and memory-dependent manipulation. Our method achieves success rates
    of 82.4%, 76.7%, and 94.4% on the three benchmarks, respectively. Real-world evaluation further yields an average
    success rate of 96.7% across three manipulation tasks. These results highlight the potential of Embodied-Harness
    to improve robotic manipulation through experience-driven harness self-improvement.
