  arxiv_id: '2611.28489'
  version: 1
  source_hash: 35b01af466cbf006c21750fef3aef494a0b45ecbb4f542a018a13e858670fd5f
  published: '2026-11-21T02:09:03Z'
  updated: '2026-11-21T02:09:03Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: 'Vision Banana showed that a closed image generator, instruction-tuned to paint perception outputs as
    RGB images, becomes a generalist vision model. Does this carry over to \emph{open} generators, and if not, what
    fails? We answer with \textbf{Open Vision Banana (OVB)}, an open framework that adapts the 7B diffusion generator
    of Qwen-Image-2.1 into one instruction-driven model for metric depth, semantic, instance, and referring segmentation,
    using a single shared low-rank adapter and public data. Each task is a \emph{task contract} whose RGB encoder,
    instruction, and decoder share one specification and are checked before training. Studying 42 externally evaluated
    checkpoints from two 100k-update runs, six exact weight-space merges, and eight controlled shorter runs, we
    find that the gap to the closed system is specific and measurable. Geometry is learned early while absolute
    scale is not: median-aligned NYUv2 $δ_1$ stays at 0.89--0.93 throughout training as unaligned $δ_1$ wanders
    between 0.11 and 0.50. The scale is not committed by a single sample: a ten-seed ensemble lifts unaligned $δ_1$
    from 0.348 to 0.516 without retraining. Depth and 2D segmentation compete for the shared adapter, and weight
    merging moves along this trade-off without escaping it. Finally, lower validation flow loss comes with lower
    Cityscapes accuracy (Spearman $ρ\approx-0.9$ between loss reduction and mIoU), so the loss cannot select checkpoints.
    We release code, contracts, training data, and all evaluation outputs.'
