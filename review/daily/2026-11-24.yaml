  updated: '2026-11-24T18:49:19Z'
  hf_daily_dates: []
  abstract: Large language models (LLMs) can generate parallel programs, but their correctness and performance depend
    strongly on the instructions that guide generation. We present \textsc{MetaFORGE}, an execution-grounded meta-learning
    framework that iteratively optimizes persistent natural-language skill specifications for MPI C code generation.
    \textsc{MetaFORGE} combines correctness testing, compiler diagnostics, static-analysis findings, runtime measurements,
    and rank-level load-imbalance profiles into a scalar reward that drives textual-gradient refinement, while an
    external memory distills and retrieves reward-supported optimization knowledge across runs. Across six MPI tasks
    and three workload sizes, \textsc{MetaFORGE} improves static-analysis quality, runtime, and load balance relative
    to zero-shot generation and generally exceeds the evaluated \textsc{TextGrad} iterative baseline. A model-matched
    refinement ablation shows that the MetaFORGE advantage persists when its refinement model is reduced to \texttt{gpt-4o}.
    An expanded retrieval ablation across all 18 task--workload configurations shows consistent runtime benefit
    and broad static-analysis and load-balance benefit from retrieved context. Leakage-controlled held-out and zero-update
    experiments further provide evidence that optimization knowledge persists in both the transferred skill and
    external memory under the evaluated protocol.
