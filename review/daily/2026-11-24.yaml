- id: arxiv:2611.26389
  title: 'ViDecide: Teaching Video Diffusion Models to Reason and Plan Step by Step'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.26389'
