- id: arxiv:2611.29619
  title: 'Wactorz: Self-Writing LLM Agents That Discover, Repair, and Migrate at the Edge'
  announced: '2026-11-22'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.29619'
  version: 1
  source_hash: d422b15fb9e5bb7abd571d6674bb0ef8735f203b866e6a17df524e40010c2f97
