  updated: '2026-11-24T03:43:32Z'
  hf_daily_dates: []
  abstract: Video understanding depends not only on how models reason about visual evidence, but also on which evidence
    they observe. Fixed observation policies determine this evidence in advance; agentic harnesses allow models
    to seek further observations as their understanding develops. This shift creates an opportunity to realize capabilities
    that fixed inputs leave untapped, yet the ability to request observations does not ensure their effective use.
    We investigate when and why video harnesses improve understanding, examining how task demands and models' capacity
    for interaction jointly shape their benefits. Using Video-Relook as an experimental framework, we let models
    adapt their temporal and spatial observations from a common default configuration, and analyze performance and
    interaction trajectories across models and tasks. Adaptive observation yields substantial gains on fine-grained
    action understanding, with benefits also extending to Video-MME-v2. Even under the same observation interface,
    gains differ substantially across models; interaction traces reveal corresponding differences in evidence seeking
    and the reliability of answer revision. The benefits also vary across tasks for the same model, ranging from
    substantial improvements to limited gains and regressions. Together, these findings support an account in which
    harness effectiveness depends on the alignment between opportunities for informative observation and the model's
    ability to turn interaction into reliable revisions. They motivate video harnesses that coordinate perception
    and reasoning, matching observational autonomy to task demands and model capabilities.
