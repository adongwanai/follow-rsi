  source_hash: e25b868715585a1413e41f28f373e566503f673ed30ed37d840107c05aa51cc3
  published: '2026-11-24T07:14:41Z'
  updated: '2026-11-24T07:14:41Z'
  hf_daily_dates: []
  abstract: Robot-programming agents improve executable control policies through repeated testing and repair, yet
    binary success saturates while execution risk persists across unseen scenes. We introduce MARGIN, a risk-aware
    agent that converts successful robot rollouts into actionable evidence for program refinement. Its near-miss
    margin measures the fraction of the execution budget remaining in the slowest successful development rollout.
    The agent uses this signal to prioritize fragile programs, guide targeted repairs, and select revisions that
    preserve development success while increasing execution headroom. An exact safe-racing rule accelerates success-based
    candidate evaluation. We evaluate MARGIN across LIBERO-Pro, LIBERO-90, and Robosuite. In our 80-task LIBERO-Pro
    reproduction, 78 programs attain perfect development success while accounting for substantial failures on unseen
    seeds. The near-miss margin predicts held-out failures with an AUC of 0.774, and low-margin programs exhibit
    2.97 times higher failure risk. Across two independent evaluation rounds spanning 37 unique LIBERO-Pro tasks,
    MARGIN reduces executed control steps by 10.7% and 15.0%, with reductions of 18.0-20.0% on LIBERO-90 and Robosuite.
    Safe racing reduces fixed-sequence candidate-evaluation episodes by 53.5% while retaining identical selections,
    and paired execution probes improve acceptance decisions by identifying hidden regressions. Together, these
    results establish near-miss evidence as an effective basis for risk-aware, budget-efficient robot program refinement.
