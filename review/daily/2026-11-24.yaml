  source_hash: a8add0ffb1a63044937a700b46282e8804b44681ffa04dc3f7733b6af3af1ba8
  published: '2026-11-24T12:08:40Z'
  updated: '2026-11-24T12:08:40Z'
  hf_daily_dates: []
  abstract: Agent skills provide reusable workflows that guide LLM agents in using tools. Refining these workflows
    requires feedback on missing or incorrect instructions, but task-specific verifiers are not always available.
    We propose VISE (Verifier-Independent Skill Evolution), a scripts-first approach that uses tool implementations
    to guide skill revision. It extracts tool capabilities, input requirements, usage conditions, and output formats
    from source code. Using the task request and execution trace, it compares this information with current workflow
    instructions to identify missing or conflicting steps. It then recommends specific edits to SKILL.md, linking
    each change to the relevant implementation and usage conditions. We evaluate VISE as an additional revision
    stage for four evolution methods on SkillsBench and SkillLearnBench. Compared with the corresponding No-verifier
    conditions, it improves overall average task success by 9.14-13.35 percentage points. The proportion of tasks
    solved in all three runs increases by 12.36-18.29 points. A case study shows how revised instructions connect
    tool outputs to later steps. These results support tool implementations as a practical feedback source for skill
    self-evolution.
