- id: arxiv:2611.30662
  title: 'WeMM-Ecom: Advancing Multimodal Content Understanding for WeChat E-Commerce'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
