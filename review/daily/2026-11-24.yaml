- id: arxiv:2611.29590
  title: 'KernelShift: Benchmarking Kernel Optimization Across Evolving Hardware'
  announced: '2026-11-22'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.29590'
  version: 1
  source_hash: 70ff751747d84d5150228c8301cb1585dd8acf0103f1f483fd092ea10b8d84ca
  published: '2026-11-22T16:25:24Z'
  updated: '2026-11-22T16:25:24Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Efficient AI computation depends on hardware that evolves over time, shifting the strategies needed
    to implement performant code. For CPU kernels, a key evolving factor is the set of available architectural extensions,
    which expose specialized hardware instructions that change the techniques used to optimize kernels. We study
    how effectively coding agents use these new, potentially unfamiliar extensions to write fast code. We introduce
    KernelShift, a benchmarking pipeline and a set of environments for evaluating coding agents in kernel optimization
    across evolving CPU architectures. Its agent-assisted, human-verified pipeline turns code repositories into
    benchmark instances, and its environments let agents optimize code with feedback from the target hardware. Using
    this pipeline, we construct 99 kernels from real-world, actively developed repositories (ncnn, llama.cpp, Arm
    SIMD Loops, and KleidiAI), including inference workloads derived from real model executions. KernelShift supports
    incorporating new kernels and hardware configurations as libraries and processors evolve. We evaluate agents
    with proprietary and open-weight models across progressively newer architectural extensions (Arm Neon, SVE,
    SVE2, and SME2), examining how performance changes as hardware evolves. On established extensions, agents beat
    the auto-vectorized compiler everywhere (2.4-19.8x) and exceed general-purpose libraries such as ncnn (getting
    up to 2.74x over its Neon kernels), but fall behind Arm's hand-tuned KleidiAI kernels (0.70x). In end-to-end
    inference of two LLMs, agent-written kernels achieve a 1.3-1.6x prefill speedup over llama.cpp's fast path.
    However, current agents do not yet reliably adapt to new extensions that require unfamiliar programming models,
    such as SME2's matrix tiles.
