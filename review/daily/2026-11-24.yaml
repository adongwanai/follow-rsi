- id: arxiv:2611.30627
  title: 'From Rewarding What Models Say to How They Think: Attention Process Reward Model for LLM Reinforcement
    Learning'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.30627'
  version: 1
  source_hash: 29593f1216451cb72c004ce0b4790e781c1a82b513f55de5c94f2fe43cc75e45
  published: '2026-11-23T12:57:42Z'
  updated: '2026-11-23T12:57:42Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Reinforcement learning (RL) has become an important component in large language models (LLMs). However,
    existing RL approaches focus on final outputs or textual solution trajectories, leading to coarse-grained rewards
    and unreliable reasoning. Such paradigms focus mainly on what the model outputs while overlooking how the model
    internally reasons. Therefore, can we reward how a model thinks internally rather than merely what it says?
    We first reveal the problem of textual reward aliasing in existing reward modeling approaches. Motivated by
    this, we propose the Attention Process Reward Model (APRM), which assigns internal rewards based on hidden states
    and attention maps to capture high-quality reasoning patterns. With only approximately 46M parameters, APRM
    is trained using ranking and counterfactual objectives, and its reward guides RL optimization while being periodically
    updated to handle distribution shifts. Integrated with representative RL methods, APRM achieved an average pass@8
    gain of 2.88\%. Our results demonstrate the promise of incorporating internal reasoning signals into RL for
    LLMs.
