- id: arxiv:2611.30597
  title: 'ViDiHand2: Unifying Video Diffusion Priors and Hand Geometry for 3D Hand Motion Reconstruction in the
    Wild'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.30597'
  version: 2
  source_hash: e44bff79c2a61470effa6fbe548960ad13914d398b7a1dc59bab572eee6d9b73
  published: '2026-11-23T12:33:36Z'
  updated: '2026-11-24T13:24:16Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Learning robot manipulation from egocentric human videos requires accurate metric 3D hand motion. Recent
    methods leverage pretrained video diffusion model (VDM) priors to recover occluded hands directly from full-frame
    videos, but their appearance-based depth regression generalizes poorly to unseen cameras. In this work, we propose
    ViDiHand2, a geometry-driven framework that reformulates VDM-based hand depth estimation from direct regression
    into fine-grained geometric constraint solving. Specifically, we introduce Fine-Grained Geometric Lifting and
    Clip-Level Ray Fitting, which recover metric depth by enforcing geometric consistency between pixel-aligned
    2D joints and the metric structure of MANO hands, while leveraging temporal observations across the clip. Since
    the lifting relies on these 2D joints, to improve robustness under occlusion and image truncation, we further
    develop Confidence-Gated Fusion to adaptively combine geometrically lifted joints with MANO predictions according
    to localization confidence. Finally, we enhance the VDM backbone to better capture spatial-temporal representations
    and produce the per-frame 2D joint and MANO predictions that both steps rely on. Extensive experiments on seven
    public datasets demonstrate that ViDiHand2 consistently outperforms 18 baselines, reducing in-the-wild absolute
    joint error by 42% and detection failures by 8.82x compared with the best baseline on each metric, while running
    at 57 FPS. The project page is available at https://vidihand2.github.io/.
