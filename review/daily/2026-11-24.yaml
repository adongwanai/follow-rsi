  hf_daily_dates:
  - '2026-11-24'
  abstract: The physical world is open-ended, dynamic, and partially observable. While foundation models have advanced
    embodied intelligence, standalone models struggle with long-horizon execution, and simply integrating models
    with agents may lead to inconsistencies between planning and physical control. To support reliable and adaptive
    behaviors in the physical world, we introduce Innata-0, a native embodied world system. Innata-0 jointly designs
    an embodied world-action model and an agent to combine their complementary strengths. The model, Innata-0-WAM,
    adopts a tri-tower Mixture-of-Transformers architecture that integrates understanding, prediction, and action
    generation. The agent, Innata-0-Agent, coordinates long-horizon execution through memory, verification, and
    recovery. A co-design protocol is further proposed to align model training with agent execution and leverage
    validated experiences to support subsequent adaptation and model improvement. Extensive evaluations demonstrate
    strong embodied capabilities across understanding, world prediction, and robotic manipulation. Innata-0 represents
    our first step toward physical intelligence, and we see it as the beginning of a much longer journey.
