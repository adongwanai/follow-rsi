  version: 1
  source_hash: f23e2795abd41a893758bb84364a99253e755bfe9a35a3bdaae1a9d36120affd
  published: '2026-11-21T14:36:04Z'
  updated: '2026-11-21T14:36:04Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Frontier language models can now read and edit the weights of a neural network much like code and thereby
    improve a small model, an approach known as Weight-Space Programming (WSP). We further explore applying WSP
    to a language model itself, which we call Self-WSP. Specifically, Qwen3.5-0.8B reads its own weights, proposes
    an edit, and then continues with the edited weights as both problem solver and editor. We find many cases of
    genuine self-improvement. Self-edits can raise GSM8K accuracy from 11.8% to 62.2% and MATH500 accuracy from
    7.0% to 32.2%, sometimes by changing only 16 parameters, and in some cases repeated self-editing keeps improving
    the model. A closer look, however, reveals that these gains lack interpretability. The model shows little understanding
    of the edits it makes, and WSP driven by random search sometimes performs comparably. Self-WSP thus holds promise
    as a path toward recursive self-improvement (RSI), but realizing this promise requires further exploration.
