- id: arxiv:2611.32765
  title: 'EviCraft: Can Minecraft Agents Find What They Cannot See?'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.32765'
  version: 1
  source_hash: fd312801c769bbe02109bc64cb533b9d3daa00eb89213e0986a6e356233913b8
  published: '2026-11-24T15:03:47Z'
  updated: '2026-11-24T15:03:47Z'
  hf_daily_dates: []
  abstract: 'In Minecraft, a common testbed for embodied agents, semantic tools such as mineBlock pick targets from
    the simulator''s loaded world state without a visibility test, so a buried ore the agent has never seen is one
    call away, and scores cannot show whether the agent searched. We formalize the missing requirement as evidence
    closure: every decision of an agent system, including those inside its tools, may depend on the world only through
    facts for which the agent holds evidence. EviCraft is a runtime and benchmark that enforces closure below the
    agent and makes the admission rule an experimental variable: a perception-grounded regime (G) admits only what
    is in line of sight or returned by the agent''s own actions, and a loaded-state regime (L) reproduces standard
    tool stacks, with agents, tools, and worlds held fixed. On Survival, the regime effect exceeds the strongest
    agent''s lead: under G, three mid-sized agents reach the diamond in 32%-40% of runs, against 76%-94% under L,
    and the strongest agent under G scores below each of them under L. In two models, removing only the line-of-sight
    test closes 93%-96% of the score gap, and loading state only inside tools recovers 70%-98%, so safeguards on
    observations and queries leave most of the leak open. In open-ended acquisition, the gain from L concentrates
    in items that depend on buried resources or mobs. Code and benchmark are available at https://github.com/AllenReder/EviCraft'
