- id: arxiv:2611.30495
  title: 'DexDuet: Learning Contact-Preserving Bimanual Dexterity from Human Demonstrations'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.30495'
  version: 1
  source_hash: 2abe70daeebad1a0bddf2ca36b32c50b7048a3f0dde679781a494219c8ac1dbf
  published: '2026-11-23T11:13:23Z'
  updated: '2026-11-23T11:13:23Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Human demonstrations provide a rich source of bimanual dexterous skills, yet transferring them to robot
    hands remains challenging. Existing methods primarily optimize object trajectory tracking, often overlooking
    how human hands interact with the object. Even with accurate tracking, robots may contact incorrect object parts
    or slide their fingers, resulting in unstable manipulation. We present DexDuet, a framework that learns contact-preserving
    bimanual dexterity from a single human demonstration. DexDuet employs two interaction rewards to preserve human
    hand-object configurations and contacts. To enable coordinated manipulation, we factorize the bimanual policy
    into two weight-sharing per-hand policies that condition on each other's states. We further propose assisted
    reference-state initialization (A-RSI), an adaptive curriculum that adjusts object assistance and training starts
    across demonstration segments to overcome difficult manipulation phases. Across four benchmarks spanning three
    simulators and five robot embodiments, DexDuet improves object-tracking ADD-AUC by 11 to 41 points over the
    corresponding baselines while consistently achieving better contact preservation. Notably, among 122 paired
    runs with comparable object-tracking accuracy, DexDuet preserves the human's contacts better in 117 cases. Code
    and videos are available at https://rcl-robotics.github.io/Dexduet.io/
