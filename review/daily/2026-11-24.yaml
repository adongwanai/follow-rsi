  published: '2026-11-22T05:17:35Z'
  updated: '2026-11-22T05:17:35Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: AI-driven game development holds the potential to transform diverse human inspirations into interactive
    experiences. However, existing systems and benchmarks primarily focus on explicit development specifications,
    with limited support for adapting multimodal references and evaluating actual gameplay experiences. We introduce
    GameAnything, an open-source agentic platform that transforms multimodal inspirations into playable extensions
    of existing games through iterative development. GameAnything integrates coding agents with an independent playtesting
    critic, persistent development state, and reusable experience memory to support continuous refinement. We further
    present GameAnything-Bench, a benchmark spanning diverse reference modalities, game creation objectives, and
    gaming environments, with exploratory gameplay testing to assess both functional correctness and gameplay quality.
    Evaluations of nine coding agent configurations reveal that current agents can adapt reference content but still
    struggle with playable interactions and precise modifications. Moreover, multimodal references improve content
    fidelity, while iterative refinement yields substantial but varying improvements across agents. These findings
    highlight both the potential and remaining challenges of inspiration-driven game development.
