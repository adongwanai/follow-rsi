- id: arxiv:2611.27376
  title: 'Composable Soft-Prompt Distillation of RL Experts: Toward Continual Post-Training'
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
