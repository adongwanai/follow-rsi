- id: arxiv:2611.31864
  title: 'No Fixed Configuration Is Best: Context- and Cost-Aware Tuning of LLM Pipelines, with an Application to
    Schema Matching and Mapping'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.31864'
  version: 1
  source_hash: 20a5186c1e2f63ef23303f12080eba59a3f66d375d46f07fcfaa65d176793289
  published: '2026-11-24T03:07:21Z'
  updated: '2026-11-24T03:07:21Z'
  hf_daily_dates: []
  abstract: 'The numeric settings of a multi-stage LLM pipeline (a compound AI system) are the usual target of tuning.
    We tuned all of them for an LLM pipeline for schema matching and mapping, with accuracy and cost as joint objectives,
    and we show what this buys, what it cannot buy, and where the remaining accuracy is. First, tuning buys cost
    and a little accuracy. On 35 tasks, with whole groups of tasks held out from tuning, one tuned configuration
    gains 2.9 points of top-1 accuracy (HR@1) over the default at 18% more cost, and another keeps the accuracy
    of the default at 32% lower cost. Second, the accuracy depends on a choice that numeric tuning cannot reach.
    Restricting the search for each source column to one assigned target table changes HR@1 by +30 points on a MIMIC-III
    to OMOP task and by -52 points on a task built from database views, more than numeric tuning gains on nine of
    ten test tasks. Neither setting is right for all tasks: on the larger set of 41 tasks used for the remaining
    results, mean HR@1 is 75.7% with the restriction (the default) and 83.1% without it. Third, choosing the setting
    per task is not enough either: even an oracle that picks the better setting for each task reaches only 87.8%
    on the 41 tasks, because the better setting differs between the columns of one task. The pipeline therefore
    runs both settings, and an LLM judge chooses among their candidate answers on the 26% of columns on which they
    disagree. This reaches 91.5% HR@1 on the 41 tasks, at 5.9 times the cost of the default, about one cent per
    column.'
