- id: arxiv:2611.31115
  title: 'RUIBench: What Makes a Good Robot-Use Interface?'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.31115'
  version: 1
  source_hash: 8b74951afb857f4271337eda032d891e7ad4ce4990fee3cb39c728b4da8f0941
  published: '2026-11-23T17:52:55Z'
  updated: '2026-11-23T17:52:55Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Foundation models can reason about complex physical tasks, yet translating this intelligence into reliable
    robot execution remains challenging. We argue that a critical, often overlooked factor is the robot-use interface
    (RUI), which determines how agents express and execute physical actions. To systematically study its impact,
    we introduce RUIBench, comprising 30 manipulation tasks across five suites spanning world knowledge, in-context
    learning, discovery, dynamic interaction, and contact-rich manipulation. We further develop RUIKit, a unified
    framework that crosses six action abstractions with two interaction forms, yielding 13 interfaces under shared
    perception and control. In simulation, changing only the RUI shifts a frontier agent's success rate from 45%
    to 81%, and that of a fine-tuned 4B model from 13% to 47%. Our analysis reveals that effective interfaces reduce
    unnecessary decisions while preserving essential feedback, with their benefits shaped by agent behavior and
    physical uncertainty. We further uncover a verification gap, where agents frequently declare success despite
    observable failures, revealing the need for task-level verification beyond individual actions. Together, these
    findings establish RUI design as a critical factor in embodied agent reliability.
