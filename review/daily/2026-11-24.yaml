  updated: '2026-11-24T04:04:21Z'
  hf_daily_dates: []
  abstract: Multimodal large language model (MLLM) agents have shown promising capabilities in task-oriented environments.
    However, they still struggle when queries are deferred until after exploration, requiring them to retain visual
    evidence before knowing which details will matter. We introduce EvoViM, a recursively self-evolving framework
    in which a frozen multimodal model turns its own interaction experience into one visual program for memory and
    skills. The program retains images and computes directly on pixels, and its operations decide how this evidence
    is used in each task. During memory evolution, the same model traces failures in its visual trajectories to
    the operations that lost or misused evidence and revises them. It also rewrites the notes and analysis tools
    that guide later revisions, which then build on earlier findings and skip changes that have already failed.
    We evaluate EvoViM with three multimodal models on six tasks covering visual matching, spatial recall, and sequential
    decision-making, including three tasks with deferred queries. Across the six tasks, EvoViM improves the average
    score over AutoMem, the strongest baseline in the main comparison, by 31.3-47.6 points on held-out episodes.
    Programs written once from the initial environment instructions perform substantially worse, highlighting the
    value of interaction experience in shaping how visual evidence is retained and used. Code and dataset are available
    at https://evovim.github.io/.
