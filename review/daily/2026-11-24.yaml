  published: '2026-11-24T22:52:27Z'
  updated: '2026-11-24T22:52:27Z'
  hf_daily_dates: []
  abstract: 'AI coding agents increasingly write and submit code with limited human review, and much of it passes
    functional tests while remaining insecure. We show that these failures persist. Across 14 task sequences, Codex,
    Claude Code, and Qwen Code fixed a vulnerability 85.7% of the time when shown the failing security test, then
    reintroduced the same vulnerability class in a new session 26.7% of the time, about as often as agents that
    had never seen it (27.5%). The capability is present; the retention is not. Neither recording the repair in
    the agent''s persistent context nor supplying published secure coding principles closed the gap: the recorded
    fix stayed tied to the family of the task it came from, and the principles, written for human developers, remained
    too general to apply to the code at hand. The knowledge exists; it is not activated. We call the missing ability
    security self-improvement: an agent learns from its own security failures so that each lesson persists across
    sessions, applies to new code, and does not break what works. We present PRECEPT, which equips coding agents
    with this ability through an evolving library that starts from authoritative secure coding principles and revises
    them against the agent''s own failures, so that each principle comes to fire on the code where that agent actually
    goes wrong. A revision is kept only if fresh executions show it makes code more secure while keeping functional
    success within a small tolerance of the agent without the library. Improvement continues across evolution steps
    rather than saturating after the first. On task families never seen during evolution, PRECEPT''s weakest agent
    reaches 97.1% secure working code, above the strongest unaided agent at 81.9% and the strongest baseline at
    87.7%.'
