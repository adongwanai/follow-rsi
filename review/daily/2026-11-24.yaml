  title: LLMs Memorize Their Own Hallucinations During Post-Training
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.26863'
  version: 1
  source_hash: 4fadf59c4a62cb5b9a472c5f4e0bf040f6c050a32f7bd44cef54c843494dac1f
  published: '2026-11-19T22:28:14Z'
  updated: '2026-11-19T22:28:14Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Reasoning domains have shaped the post-training recipes of frontier models even though they are trained
    and deployed in domains beyond math and code. In this paper, we study the consequences of directly adopting
    reasoning-centric training recipes, e.g., the use of outcome-based rewards for reinforcement learning (RL),
    injection of "cognitive" behaviors such as proposing and backtracking from hypotheses in reasoning chains, etc.,
    for knowledge tasks. We hypothesize that these decisions, while useful for reasoning, inadvertently encourage
    models to memorize hallucinations they themselves generate in their long reasoning chains when trained on knowledge
    tasks. To study this, we train models with standard post-training, extract their self-generated hallucinations
    during RL, and track memorization throughout the rest of training. Our experiments on six open models across
    two model families and two architectures confirm our hypothesis. We find that models' recall of hallucinations
    reinforced during training increases by 4.83% on average, compared to just 0.17% for self-hallucinations that
    receive no training signal. In fact, models even memorize false facts that they immediately retract in their
    reasoning; a backtracking template inherited from reasoning-centric training that has no benefit for knowledge
    recall. Furthermore, we find that memorization is strongest on the hardest training questions, and rewarding
    a hallucination makes the model less likely to abstain from it later (by 7.23% on average). Overall, our work
    identifies and systematically studies a previously unexamined pathway through which models learn hallucinations
    during training.
