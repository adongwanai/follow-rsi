- id: arxiv:2611.30989
  title: 'WorldLeague: Benchmarking Physical Agency'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.30989'
  version: 1
  source_hash: a9f37a02d27aeccc30165d4aab9338bf45930c41d7f996887bbbe7d9dfae183d
  published: '2026-11-23T16:44:19Z'
  updated: '2026-11-23T16:44:19Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: 'AI systems can now operate Blender, follow instructions in complex video games, and manipulate objects
    with robot arms. What range of physical goals can today''s AI systems achieve autonomously? Answering this question
    requires testing systems on tasks that demand different combinations of perception, memory, planning, and action.
    We introduce \textbf{WorldLeague}, a benchmark that compares AI systems on a common set of \textbf{60 simulated
    robot tasks} by measuring progress toward each task''s physical goal from the robot''s trajectory. Robots explore
    scenes to gather evidence in \textbf{WorldSeek}, rearrange objects in \textbf{WorldShape}, and adapt to changes
    in \textbf{WorldShift}. Tying these goals to a single control interface limits which AI systems can be compared.
    In WorldLeague, vision-language models (VLMs) choose targets and motions, while vision-language-action models
    (VLAs) and world-action models (WAMs) use their native controls. For each of six capability dimensions, we measure
    how much progress a system makes toward its goals (Interactive Score) and how often it achieves them (physical
    success rate). Together, these measures form the system''s \emph{Physical Agency Profile}. Among 13 representative
    AI systems, Claude Fable 5.2 achieves 13 of the 60 goals and earns the highest mean Interactive Score (28.58/100).
    Fable leads in four dimensions, while GPT-6.1-Sol and GPT-6-Astra tie for first on rule-following tasks. Even
    when VLMs answer every final question correctly, they receive an Interactive Score of zero in 71.8\% of those
    episodes. WorldLeague gives Embodied AI, Physical AI, and Agentic AI a shared basis for comparing what AI systems
    achieve autonomously, from partial progress toward a physical goal to full goal completion. Project Webpage:
    https://xyangzhou.github.io/WorldLeague'
