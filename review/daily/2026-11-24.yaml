- id: arxiv:2611.32093
  title: 'MARGIN: A Risk-Aware Agent for Robot Program Refinement'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.32093'
