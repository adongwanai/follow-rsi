  arxiv_id: '2611.30771'
  version: 1
  source_hash: 369d10a643d3e453a3e064a0a45690bbe4f07485647e13a4e7de9efeb8b667f2
  published: '2026-11-23T14:41:27Z'
  updated: '2026-11-23T14:41:27Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Interactive intelligence requires agents to act on observations and adapt to the consequences of actions.
    Studying these abilities calls for diverse, challenging tasks under controlled conditions. We introduce GameDojo,
    a controllable interactive gameplay benchmark of 120 boss encounters across 20 games for evaluating model capabilities,
    learning algorithms, and agent harnesses. Coding agents reconstruct the environments and write gameplay scripts,
    producing GameDojo-Data with 600 hours of gameplay trajectories. Experiments reveal substantial challenges for
    frontier models, especially in real-time interaction. Training on GameDojo-Data brings GameDojo-4B to frontier
    performance, with the strongest real-time performance. We also find joint training improves individual tasks,
    and learned policies transfer across bosses. Together, these findings establish GameDojo as a challenging and
    valuable interactive gameplay benchmark for the community. Our project page is at https://gamedojo-benchmark.github.io/
    , and our code is at https://github.com/THUSI-Lab/GameDojo .
