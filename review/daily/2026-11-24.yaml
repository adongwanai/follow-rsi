  abstract: Resolving local atomic structures such as defects and interfaces from electron microscopy contrast relies
    heavily on researcher judgement, leading to low efficiency and subjective standards. Here we present PhyEvo-Mic-RSI,
    a physics-guided and expert-informed recursive self-improvement framework that turns one-off human corrections
    into reusable, verifiable capabilities by updating executable operators, parameters and routing rules with versioned
    inheritance. Given researcher-defined tasks, the system selects analysis paths from image features without expert
    labels, while testing and inheriting code updates under fixed budgets. Combining physical priors with expert
    feedback improves atomic point-defect detection over larger models and raises cross-material interface coverage
    from 5.13% to 72.11% within a 10% area budget. Adapting the framework to micrographs from unseen studies further
    separates touching nanoparticles by aligning optimization with particle-level measurements. This work moves
    computational microscopy beyond standalone models and static scripts towards self-evolving platforms that accumulate
    human scientific expertise
