- id: arxiv:2611.28202
  title: 'AutoPILOT: A Visual Agent Harness for Real-Time Gameplay'
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.28202'
  version: 2
  source_hash: e7cd94fd63a4d75021ce5f4ec9b50631bf264d7e4fd0a34aaeedc977e7524fdc
  published: '2026-11-20T18:56:49Z'
  updated: '2026-11-25T00:54:12Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: 'Multimodal foundation models can play video games well when the game waits for them, but often fail
    when it keeps running. We find that much of this gap lies in the harness, which decides what the model sees,
    what it remembers, and how its outputs become actions over time. Existing harnesses such as VISTA improve the
    first two, yet turn each model call into at most one action, so the agent acts only as often as its model thinks.
    We introduce AutoPILOT, which changes the third: in each model call, the model can send a primitive action,
    start an open-loop macro, or write a closed-loop controller that keeps playing from the screen without further
    model calls until it hands control back. To evaluate agents in real-time games, we build AFK-Bench, 120 diverse
    browser games grouped by how they respond to inaction and playable in real time or with the clock paused. With
    GPT-6.1 Sol under the same budgets, AutoPILOT reaches 68.6% real-time success against 38.3% for VISTA, and on
    GameWorld it keeps 80.0% in real time while VISTA drops from 84.1% to 42.9%. Its gains hold across closed and
    open-source models, and it reaches VISTA''s final success rate at a fifth of its API cost. Our results suggest
    that how a harness turns model outputs into actions over time is a central yet underexplored part of agent design,
    and we hope AutoPILOT and AFK-Bench will serve as a foundation for agents in a world that does not wait.'
