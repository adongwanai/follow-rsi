  note: 历史条目保全：既有目录条目原样保留。RSIHub 的核心是为 prompt、skill 与整体 Harness 演化提供统一运行、保留、评测和可审计框架。应作为 harness_eval 框架/评测收录；不能把接口支持可修改
    operator，写成其报告实验已经验证外层 agent 自适应修订整套 recipe。 scope=harness_method：recipe 声明 mutable surface，进化对象是候选 agent 的
    harness 文件/prompt/skill/tool/orchestration，而非模型权重。循环为 Select→Rollout→Analyze→Mutate→Guardrail→Evaluate→Absorb：训练任务执行反馈驱动修订，Gate
    依据认证评估决定子代是否成为 parent 从而在后续 generation 被 Select 分叉复用，归档与 lineage 保留候选。目标与变异模型均固定为 GPT-5.4，未做权重训练，故权重不是主要干预。论文同时比较四种既有方法、框架核心固定、实验仅评估
