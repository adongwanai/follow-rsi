  published: '2026-11-24T04:28:10Z'
  updated: '2026-11-24T04:28:10Z'
  hf_daily_dates: []
  abstract: Shape decomposition represents 3D objects as a compact set of geometric primitives for interpretable
    modeling and simulation. However, existing decomposition methods are trained primarily for geometric fidelity,
    without explicit constraints on physical plausibility, and can therefore produce disconnected parts or physically
    unstable reconstructions. We present PhysDec, an agentic framework that draws on a pretrained vision-language
    model's semantic understanding and commonsense reasoning to predict material-aware primitive decompositions
    from a few images. Within this framework, PhysDec-Loop is an agentic pipeline that reasons about part structure
    and materials, using a reference 3D point cloud for geometric feedback and physical verifiers to guide iterative
    refinement. Through self-evolution, we further develop another agentic pipeline, PhysDec-Evolved, which learns
    from prior corrections to predict primitive decompositions from images without point-cloud feedback or a correction
    loop at inference. Experiments show that PhysDec-Loop improves geometric fidelity, physical plausibility and
    visual quality over geometry-focused baselines, while PhysDec-Evolved approaches its performance at substantially
    lower inference cost.
