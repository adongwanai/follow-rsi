- id: arxiv:2611.31015
  title: Can Latent Reasoning Drive LLM Outputs Without a Trace?
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.31015'
  version: 1
  source_hash: a7a154279314a403f5e3dcfd7fb50edeede203457cabbdc68668ec12c60ad8b2
  published: '2026-11-23T16:59:12Z'
  updated: '2026-11-23T16:59:12Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: LLMs typically solve complex tasks with chain-of-thought (CoT) reasoning, which is also the main tool
    for monitoring them for misaligned behavior. However, standard transformers can also solve tasks with complete
    latent reasoning (CLR), carrying out the whole task internally and outputting only the final answer. Theory
    bounds the depth of CLR, the number of sequential steps it can carry out, and recent work measured it to be
    shallow. In this work, we ask whether CLR is deep enough for a model to pursue a hidden objective that requires
    reasoning. Such a model would generate a CoT that appears to solve the given task, while a latent multi-step
    computation decides its answer based on the hidden objective. First, we show that a simple auxiliary loss allows
    models to solve a multi-step task latently at least 5x deeper than previously reported. Then, in two common
    tasks, decision-making and code generation, we train a model to pursue such a hidden objective, which decides
    a loan or plants a vulnerability. The model's CoT justifies the output with no trace of the hidden objective,
    and a strong LLM monitor does not flag it. Finally, using activation patching, we find that the latent computation
    is completed before the model generates its CoT, which takes no part in it. Altogether, we show that a hidden
    objective that requires reasoning can go unseen by a monitor that reads only the output.
