- id: arxiv:2611.26745
  title: 'MomentMem: Memorizing Key Moments for Robot Manipulation'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.26745'
  version: 1
  source_hash: d6abbaab3e71c56d8dae201b28fa70f376955fcf60e13075de0968359500a2a1
  published: '2026-11-19T19:42:27Z'
  updated: '2026-11-19T19:42:27Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: Robotic manipulation often requires remembering visual information that is no longer observable, such
    as the original location of an object. Existing approaches typically rely on full observation histories, which
    become redundant over long horizons, or text summaries, which may omit precise visual details. We study visual
    moment memory, the ability to retain such details from key moments for subsequent manipulation. To support this
    study, we introduce VMBench, a suite of long-horizon manipulation tasks requiring memory of spatial locations,
    visual appearances, and their associations. We further propose MomentMem, a hierarchical architecture in which
    a VLM-based memorizer selects keyframes and an executor predicts actions conditioned on the selected memories.
    This separation enables us to evaluate memory selection alongside closed-loop task success and to study memorizer
    generalization independently of the executor. On VMBench, MomentMem achieves 49.9% average success, outperforming
    the strongest evaluated baseline by 31.7 percentage points. Moreover, we find that the memorizer transfers well
    to unseen appearances zero-shot. It can also adapt to an unseen task with only a few memory annotations, reaching
    43.7% success, close to the 44.3% obtained with full memory supervision. Further experiments show competitive
    performance on RMBench and improvements in real-robot manipulation. These results highlight the value of retaining
    sparse visual evidence for memory-dependent manipulation. Our code is available at https://github.com/PKU-VaLuE-Lab/MomentMem.
