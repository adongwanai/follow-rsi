- id: arxiv:2611.30011
  title: 'MORSE: Optimizing Streaming Memory Design via Open-World Auto-Research'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.30011'
  version: 1
  source_hash: 264c099f1036b50772ab02e20993348448f4664f4e8c2f420b749b8c4460420f
  published: '2026-11-23T04:11:45Z'
  updated: '2026-11-23T04:11:45Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: A streaming video system must decide in a single pass what evidence to retain under bounded frame storage,
    before it knows which details a future question will require. Recent recursive self-improvement methods automate
    the design of the harness that stores and retrieves this evidence. They revise the harness in response to failures,
    but the editor must still devise each repair from its prior knowledge and a predefined set of tools. A failure
    that recurs across videos, however, may point to a problem that prior work has already addressed. We introduce
    MORSE (Memory Optimization with Recursive Self-Evolvement), an open-world auto-research framework that uses
    recurring failures to guide an online search for solutions. Its editor groups failures in training traces by
    cause, then searches papers, model cards, and code for methods it can adapt or pretrained perception models
    it can use. When the editor introduces a new perceptual capability, it can also revise how the harness stores
    and retrieves the resulting evidence for a frozen video-language model. On held-out validation streams, MORSE
    first selects revisions that improve answer quality, then seeks faster revisions that preserve those gains within
    a specified tolerance. Across three streaming video benchmarks, MORSE consistently achieves the highest answer
    accuracy within each frozen-backbone comparison. On OVO-Bench, our Qwen3-VL-8B harness answers queries in 0.30
    seconds on average while achieving 75.1% accuracy, 3.1 percentage points ahead of the next-best evaluated harness
    using the same frozen backbone.
