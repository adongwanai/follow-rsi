- id: arxiv:2611.31094
  title: Unlocking the Power of Loops in Pretrained LLMs with Loop Residuals
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.31094'
  version: 2
  source_hash: 6aba35729bf5b476748464c7c504dd7f47986f587346d514879ad14c33e5e42e
  published: '2026-11-23T17:38:43Z'
  updated: '2026-11-24T17:16:14Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: 'Looped Transformers iterate a shared block of layers to increase computation without adding parameters,
    offering stronger performance and test-time scaling. However, this power has so far required training from scratch
    and yielded only modest gains for LLMs. Finetuning existing models into loops is far cheaper, yet also brings
    only marginal gains over SFT. We propose LoopRes, an effective, scalable, and simple approach that turns loops
    into significant and consistent gains for pretrained LLMs. Building on Attention Residuals, LoopRes lets each
    looped layer attend directly to the outputs of earlier loops. Since these outputs are iterates of the same layers
    and become harder to tell apart, we give each a trainable loop-aware key that encodes its structural identity.
    Attending to all earlier loops also lets layers skip intermediate ones, so we restrict each layer to a residual
    window of the latest W loops, forcing every loop to build incrementally on recent ones. Across 6 pretrained
    LLMs from 3 model families and 9 benchmarks, LoopRes delivers significant and consistent gains: at 2x compute,
    it improves Qwen3-1.7B-Base by 29.1% over SFT, more than doubling the gain of the state-of-the-art baseline.
    The gains hold on larger models up to 30B and across all three families. More importantly, from 1.7B to 8B,
    LoopRes scales more steeply than SFT as compute grows, reaching a higher ceiling while needing less compute
    on long outputs. These results establish LoopRes as an effective looping approach, delivering both better performance
    and better test-time scaling.'
