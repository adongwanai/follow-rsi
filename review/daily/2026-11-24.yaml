  source_hash: b1de0d557933de53bee650e53dde95aad24200a44cddd9de8acc6feb199f8958
  published: '2026-11-24T01:52:56Z'
  updated: '2026-11-24T01:52:56Z'
  hf_daily_dates: []
  abstract: LLM agents commonly use the full interaction history as a proxy for state, retaining all past observations
    and actions regardless of whether they remain relevant. We instead ask what information an agent actually needs
    to carry forward. We define agent state as a compact abstraction of interaction history that preserves the competence
    of a fixed reference agent, with the minimal such abstraction as the ideal. Because matching the reference agent's
    behavior is unnecessarily restrictive and difficult for black-box policies, we define sufficiency through task
    performance rather than behavior matching. We represent state abstractions as deterministic recursive programs
    and search over them using an LLM-guided genetic algorithm. Across ALFWorld and ScienceWorld, the learned abstractions
    preserve near-reference task success while reducing mean policy input by up to 71% and 57%, respectively. The
    resulting programs are directly inspectable, providing an explicit account of what information is retained,
    updated, and discarded during interaction.
