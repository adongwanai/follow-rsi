- id: arxiv:2611.12164
  title: 'Let the Fixer Decide: Training a Code Localizer from the Fixer''s Likelihood'
  announced: '2026-11-09'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12164'
  version: 1
  source_hash: b2a3e754c6aec3c096e119b900e2c4d79987b97112f4af3607d6cd8f8a7ef6ae
  published: '2026-11-09T10:18:59Z'
  updated: '2026-11-09T10:18:59Z'
  hf_daily_dates:
  - '2026-11-24'
  abstract: 'Code localizers are usually trained to predict the files a reference patch edits, but the code a fixer
    needs to read is not the same as the code it changes. We propose Fixer-Guided Localization (FGL): the localizer
    proposes several localizations, a frozen fixer scores each by how likely it makes a verified patch, and the
    localizer is trained on these scores with weighted supervised fine-tuning, without running tests and without
    reinforcement learning. We build the full pipeline on Gemma 4 E4B for the Kaggle Gemma-4 Developer Agent competition,
    from 1,629 test-verified Kimi K3 trajectories. The FGL target helps the fixer find the bug as often as the teacher''s
    localization while using 27.5% less code. On the development set, one EM round moves the agent in the expected
    direction compared with a matched control: more tasks reach a patch (53 vs. 46), fewer tasks get stuck reading
    files that do not exist (43 vs. 54), and more tasks are solved (8 vs. 6). Training also changes how the agent
    works: trained agents explore about three times more than the base model and write far fewer wrong patches,
    and the single agent solves up to 11 of 78 tasks, against 8 for the base model. An analysis of 13 evaluation
    runs identifies what limits a 4B agent under an 8-minute budget (time, repetition loops and edit quality) and
    gives practical lessons for training small coding agents. All data, code and adapters are publicly available.'
