  updated: '2026-11-24T12:38:22Z'
  hf_daily_dates: []
  abstract: Large language model (LLM)-based agents are advancing the automation of data-driven scientific research.
    Recent advances in recursive self-improvement (RSI) offer the potential for these agents to continuously improve
    through experience, but evaluating transfer across scientific tasks requires executable, scientifically verifiable
    tasks and independent assessment of self-improvement gains. We introduce RecurSciBench, a scalable benchmark
    for evaluating RSI in data-driven scientific research. Its RecurSciPipe framework automatically constructs scientific
    modeling and data analysis tasks from raw datasets, with execution-based verification and scientific validity
    checks. RecurSciBench spans four scientific domains, multiple data modalities, and varied scientific objectives.
    We evaluate four RSI systems by comparing their initial and evolved states on independent tasks after evolution
    on source tasks, covering within-type, cross-type, and cross-domain transfer. Experiments show that the benefits
    of self-improvement vary across agent systems and scientific domains. Positive overall gains can coexist with
    regressions on individual tasks. Experience can transfer across task types and benefit other domains even without
    measurable gains in the source domain.
