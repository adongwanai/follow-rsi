  hf_daily_dates: []
  abstract: 'Frontier models are increasingly used through harnesses as agents, with growing autonomy to do useful
    work. Agent performance can often be enhanced by the use of skills: reusable workflows, code, and prompts that
    provide task-related information or guide the behaviour of the model. Skills, being textual in nature, present
    themselves as another editable surface to be optimized; current methods have improved on handcrafting and one-shot
    generation by treating skill development as an iterative process, using score-driven search to tweak and improve
    performance. In this paper, we demonstrate the efficacy of the agents themselves as optimizers: across five
    benchmarks, a coding agent without guidance substantially improves every target and outperforms published skill-optimization
    methods. More broadly, this shows the capability of agents to do such work and to refine their own behaviour
    to provide task-specific context, as long as they are given a metric to measure against.'
