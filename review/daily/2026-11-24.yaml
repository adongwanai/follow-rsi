  hf_daily_dates:
  - '2026-11-24'
  abstract: Recently, GPT-6 Astra demonstrates strong generalization in robot control, yet limited disclosure of
    its training leaves open how such capabilities can be reproduced. We introduce nanoAstra, an approach to training
    vision-language models (VLMs) for generalizable manipulation that combines semantic action modeling with capability-preserving
    supervised fine-tuning (CP-SFT). nanoAstra represents robot behavior as semantic steps composed of reusable,
    parameterized action primitives, guided by explicit progress descriptions. Meanwhile, CP-SFT uses an explicit
    robot-specific system prompt to constrain manipulation outputs to a structured action space, aiming to focus
    adaptation on robot-specific contexts and promote specialization while minimizing interference with broader
    pretrained capabilities. With this formulation, we train nanoAstra on more than 5,000 hours of robot data together
    with general VQA data. On RoboTwin 2.0's randomized benchmark, nanoAstra-9B achieves a 17.8% zero-shot success
    rate, substantially outperforming advanced VLA and WAM baselines as well as similarly sized VLMs. With inference
    faster than the corresponding motion execution on a single H20 GPU, our model supports action-chunk-like streaming
    execution that overlaps inference with motion, reducing the robot's idle time from 35.0% to 6.9%.
