- id: arxiv:2611.24154
  title: 'Game2Player: Scaling Gameplay Experience for Visual Agents through Environment-Player Co-Development'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.24154'
  version: 1
  source_hash: 6808339a3d4ff9ad493cbb688bc16513741b1fd284d072bf66ec44d8f5eb93ef
  published: '2026-11-18T09:58:53Z'
  updated: '2026-11-18T09:58:53Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Games are a rich testbed for visual agents, demanding perception, long-horizon planning, and precise
    control. However, collecting human gameplay is costly, and learning from gameplay videos requires inferring
    missing actions. Existing datasets also cover a limited range of games, often without explicit tasks or verifiable
    outcomes. To address these gaps, we introduce Game2Player, a framework that co-develops game environments and
    players to collect diverse and verifiable gameplay experience at scale. In the Game2Player loop, a Builder agent
    adapts existing web games, exposes their internal state, and defines tasks with state-based progress measures
    and success checks. A Coding Player and a VLM Player then attempt the tasks and report problems to the Builder
    for repair, so that play serves as both environment validation and training data collection. With Game2Player,
    we build 568 verified web games with 3,436 tasks, collect 15.7K trajectories (307 hours of gameplay), and hold
    out 50 games as the benchmark PlayerBench. To evaluate the collected experience as training data, we train VLM
    agents with progress-weighted SFT, assigning greater weight to steps that advance task progress. Game2Player-9B
    improves progress from 14.3% to 31.2% on PlayerBench and from 30.0% to 53.1% on the external GameWorld benchmark.
    More broadly, our work suggests a path for visual agents to scale their gameplay experience by building, verifying,
    and learning from existing game worlds.
