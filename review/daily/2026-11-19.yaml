  source_hash: 0616ec8e0fafbb0e9fa3d81aba6b3a138e031a8308b4f57315529d60653daa8c
  published: '2026-11-13T05:25:40Z'
  updated: '2026-11-13T05:25:40Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Flow-based generative models are trained on a hand-chosen prediction target, such as the velocity, the
    noise, or the clean data. This choice strongly affects training and sample quality. We introduce Anisotropic
    Flow Models (AnisoFlow), which replaces a fixed prediction target with a fully learnable one. AnisoFlow learns
    to scale the noise component of the target anisotropically, assigning a separate nonnegative weight to each
    direction in a jointly learned basis. A closed-form map recovers the velocity from the network's prediction,
    leaving the architecture, flow-matching loss, and sampler unchanged. Since recovery is exact, training optimizes
    the target purely to make it easier for the network to predict. We theoretically analyze the resulting prediction
    error and predict that the preferred noise weight in each direction scales near-linearly with data variance,
    in agreement with the weights learned empirically in pixel space. AnisoFlow improves FID from 1.90 to 1.55 over
    the JiT baseline on ImageNet 256$\times$256, by learning only the prediction target, without representation
    alignment or architectural changes. In pixel-space text-to-image generation, AnisoFlow improves image quality
    and, through better-conditioned velocity recovery, largely removes patch-seam artifacts under reduced-precision
    inference.
