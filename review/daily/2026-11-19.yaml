- id: arxiv:2611.24362
  title: 'PIPETTE: Prompt Injection Purple-Teaming for Robust LLM Agents'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.24362'
  version: 1
  source_hash: afedb86198277ed4294cc7262a12803d6f6e3597ca3e8dc64b0c62204301e86f
  published: '2026-11-18T12:56:06Z'
  updated: '2026-11-18T12:56:06Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Large language model (LLM) agents routinely interact with untrusted external data, exposing them to
    indirect prompt injection (IPI) attacks that hijack agents into executing attacker-chosen tasks. To uncover
    these vulnerabilities at scale, automated red-teaming methods often leverage reinforcement learning (RL) to
    generate attacks that achieve high attack success rates (ASR). Model developers use the attacks discovered during
    internal red-teaming to harden agents through adversarial training before deployment, a collaborative offensive-defensive
    process known in cybersecurity as purple-teaming. However, we show that achieving high ASR during red-teaming
    does not guarantee robustness gains from subsequent adversarial training. Specifically, we find that two state-of-the-art
    RL-based red-teaming methods, RL-Hammer and PISmith, suffer from mode collapse, repeatedly discovering similar
    attack strategies whose additional successes add no additional robustness improvements to adversarial training.
    To address this gap, we introduce PIPETTE, a unified prompt injection purple-teaming framework that effectively
    converts red-teaming discoveries into defender robustness improvements. PIPETTE employs a dictionary learning-based
    reward that encourages broader coverage of attack strategies during red-teaming. It also integrates an on-policy
    adversarial training pipeline tailored to IPI defense, enabling agents to resist attacks while completing legitimate
    user tasks. Extensive evaluations across agentic benchmarks (AgentDojo and ASB) demonstrate that PIPETTE produces
    defenders that achieve near-zero attack success rates on static attacks and can withstand strong adaptive attacks,
    while maintaining benign task utility close to that of the undefended baseline.
