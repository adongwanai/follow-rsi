- id: arxiv:2611.21114
  title: 'VAE Rhythm: Temporal Decoding Traces for AI-Generated Video Detection'
  announced: '2026-11-16'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.21114'
  version: 1
  source_hash: 0c43e264d3a886fad938c352f7932904a5c1e59080645e14be3431f15c781bc5
