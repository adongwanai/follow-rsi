- id: arxiv:2611.22033
  title: 'Thinking Harder Doesn''t Lead to Better Choices: Reasoning Effort Increases the Confidence but Not the
    Correctness of LLM Shopping Agents'
  announced: '2026-11-17'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.22033'
  version: 1
  source_hash: c8b1afa31309d2683e1d407dee5ced9f89961c59230a7e1f3e8515e8afcbd3f7
  published: '2026-11-17T00:55:58Z'
  updated: '2026-11-17T00:55:58Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: 'Large language models (LLMs) are increasingly deployed as autonomous shopping agents that process multimodal
    product listings (consisting of visual and text data) and recommend purchases on behalf of consumers. Naturally,
    one might assume that models with more thinking power would make higher-quality purchasing decisions. To test
    this belief, we ask two questions about such agents: does asking a model to think harder make it choose better
    products, and does the confidence it reports tell us the likelihood it may be wrong? We benchmark ten frontier
    models on three product-choice benchmarks built from WebShop, Amazon''s SQID and Wayfair''s WANDS platforms
    to see if LLMs with more thinking power actually make better-quality product purchase decisions. Across all
    three benchmarks, we found that increasing the thinking effort does not increase decision quality in a statistically
    meaningful way. The same change in thinking effort raises stated confidence at a statistically significant level,
    so extra thinking buys confidence rather than correctness. We also measure the calibration of these models (how
    well their reported confidence percentage matches their true correctness percentage) in these tasks and show
    that most models are not well-calibrated at every effort level. We also find that errors are strongly shared:
    when one model errs in a task, several others tend to err on that same task. Furthermore, on tasks where several
    models all err, a large number of them pick the same wrong product.'
