  updated: '2026-11-19T07:04:55Z'
  hf_daily_dates: []
  abstract: Learned models for radio access networks (RANs) are often developed using simulation, yet their predictions
    can shift when exposed to physical propagation conditions, protocol behavior, and equipment implementations.
    This paper presents a cyber-physical recursive self-improvement (RSI) framework for AI-RAN that connects a task-oriented
    student model, an experiment-planning coach agent, a calibratable virtual environment, and a physical host agent.
    Physical measurements are organized as evidence for both model adaptation and subsequent experiment planning.
    We examine an implementation of the physical-feedback pathway using ping-pong handover as a case study. The
    system completes 12 physical executions organized into six baseline--candidate pairs, updates the student from
    measured outcomes, and evaluates the revised model on reserved physical configurations. In the observed short-window
    tests, increasing the time-to-trigger from 320 to 1280\,ms changes the ping-pong count from three to zero. The
    updated student achieves a grouped-validation mean absolute error (MAE) of 2.673 round trips/min, while a common
    three-configuration physical evaluation yields MAEs of 1.240 and 1.601 round trips/min for the pre-feedback
    and post-feedback models, respectively. These results characterize both the operational feedback loop and the
    parameter-dependent generalization behavior revealed by new physical experiments.
