  source_hash: 6de7272c672fc38e43426c07e8468f0a9751d951b9953785865240427870aa79
  published: '2026-11-19T10:08:26Z'
  updated: '2026-11-19T10:08:26Z'
  hf_daily_dates: []
  abstract: Personalized LLM agents must act on a user's current preferences, which change across interactions and
    are rarely stated in full. Existing memory systems store and retrieve content from the interaction history and
    leave the agent to work out which preferences still hold and where they apply. Such content does not indicate
    whether a preference is still current or where it applies, so agents often act on outdated or misapplied preferences.
    We instead treat memory as the assistant's belief about the user. Following Bourdieu's account of habitus as
    durable but revisable dispositions, we model the user as a latent preference state that every interaction, including
    the current request, both reveals and updates. The belief summarizes what the history supports about this state,
    and memory consists of the individual beliefs that bear on the agent's current decision, each with its evidence,
    scope, and status. We implement this view in HabitusMem, a trained writer that states these beliefs as text
    records for a frozen agent. Across two agent families, HabitusMem achieves the best results among memory systems
    on both PersonaMem-v2 and VitaBench 2.0. Controlled analyses show that learned request conditioning drives the
    answering gain, while auxiliary training tasks improve tool use.
