    scores or evaluation setup. Source: Sakana AI, “Introducing Fugu-Cyber” . ↩ フロンティアAIが脆弱性を見つける力が高まっているという認識は、日本政府の対策パッケージ「Project
    YATA-Shield」にも示されている。同パッケージは、2026年5月18日に国家安全保障局、国家サイバー統括室ほか12の省庁が共同で公表したものである。フロンティアAIモデルが脆弱性を発見し修正する力が急速に高まっていることを前提に置き、攻撃者によるAIの悪用がサイバー攻撃の速度と規模を高めているとの認識を示している。そのうえで、重要インフラ事業者には、脆弱性がより速く、より大量に発見・修正されることを前提に対策を強化するよう求め、ソフトウェアベンダーには、セキュア・バイ・デザインの原則を適用し、ソフトウェア開発ライフサイクル全体で高度なAIを使って脆弱性を早期に発見・修正するよう注意を促している。出典：
    パッケージ 、 概要 ↩ NISTは、2020年から2025年にかけてCVEの登録申請が263%増えたことを挙げ、2026年の最初の3か月の申請件数が前年同期より3分の1近く多かったと述べた。出典： NIST ↩ JVN
    iPediaの2026年第3四半期の登録件数は20,073件で、前年同期は10,869件だった。このうち19,913件は米国の脆弱性データベース（NVD）から、147件はJVNから、13件は国内の製品開発者から収集されたものである。件数は登録日にもとづき、登録の時期はNVDでの公開時期に左右される。出典：
    IPA「JVN iPediaの登録状況（2026年第3四半期）」 ↩ FIRSTの中間更新（2026年6月15日）は、増加の要因として、AIによる発見の支援に加え、CNAの積み残し案件の解消やGitHub Security
    Advisoriesの拡大といった事務的な要因を挙げている。NISTの職員は2026年4月、LLMを使った発見ツールによる申請の増加が、NVDの作業負荷を増やしていると述べた。出典： APNIC（FIRSTの要約）
    、 Infosecurity Magazine ↩ NVDは、2026年3月1日より前に公開された未補強の記録の定常的な補強（エンリッチメント）を止め、CISAの「悪用が確認された脆弱性カタログ（KEV）」に載る記録、連邦政府内で使われるソフトウェア、大統領令14028が定める重要ソフトウェアの記録を優先している。出典：
    NIST 、 Infosecurity Magazine ↩ 2026年5月22日、金融庁と日本銀行は、金融機関などに対し、フロンティアAIへの対応を経営トップが直接関与する経営課題として扱い、パッチ適用をリスクにもとづくものにするよう求めた。出典：
    金融庁 、 日本銀行 ↩ FBI FLASH-20261113-001「Threat Overview of ARTEX Autonomous Penetration Testing Framework」、2026年11月13日（TLP:CLEAR）。ARTEXを、オープンソースの、LLM駆動のマルチエージェント型プラットフォームと説明している。攻撃者が侵入の複数の段階を機械の速度で自動化するために悪用しており、少なくとも2026年8月から使われていること、専門性の低い攻撃者でも、複雑な複数標的の作戦を同時に実行できるようになることを述べている。侵入が特権アクセスに至るまで3時間未満という数字は、FLASHの中でMicrosoft
    Threat Intelligenceの資料として引かれている。FLASHが挙げる初期侵入の弱点には、SSRF、IDOR、Web APIの認証欠如、コマンドインジェクション、SQLインジェクション、ハードコードされた認証情報などがあり、個別のCVE番号は挙げられていない。出典：
    FBI IC3 ↩ NICTERは、2026年第1四半期に、AIサービスのエンドポイントを狙った探索の増加を観測した。ダークネット観測は、一方的に届く通信を記録するもので、攻撃の件数を数えるものではない。出典： NICT、NICTER観測統計（2026年1月〜3月）
    ↩ CISAの脆弱性レビュー（2026年8月26日公表）は、2024・2025会計年度を対象としている。多くの攻撃者が、高度な手法ではなく、よく知られた単純な弱点を狙うこと、入力値の検証不備とメモリ安全性の欠陥が最も確実な侵入口であることを指摘し、根強く残る予防可能な弱点をなくすこと、セキュア・バイ・デザインの原則を採用することを推奨している。出典：
    CISAの発表 、 レビュー全文 ↩ この注意喚起は、NICTのLETTICEチームによるものである。LETTICEは、NICTのサイバーセキュリティネクサス（CYNEX）に参加する組織のボランティアによる合同分析チーム。国内で相次いだ情報漏えいの原因の一つとして、A2B
    (App-to-Backend) 攻撃を挙げている。攻撃者は、国内で公開されているアプリを解析して、背後にあるバックエンドサーバーとAPIを把握し、各バックエンドを攻撃する。主に狙われる弱点として、SSRF、リモートコード実行、SQLインジェクション、IDORの4種類を示している。出典：
    NICT CYNEX、2026年10月13日付の注意喚起(Rev. 1.1) ↩ 3つの条件はいずれも、脚注18で挙げた金融庁と日本銀行の要請に示されている。要請は、多くの金融機関がシステムの保守をベンダーに委託していることを指摘し、複数の金融機関で同時にパッチ適用が必要になった場合でも、ベンダーがサービスレベル合意を満たすためのリソースを確保できるか確認するよう求めている。また、パッチの適用対象をすぐに特定できるよう、優先度の高いシステムの技術的負債を解消することを求め、既存のIT人員を短期間で大幅に増やすのは現実的でないとも述べている。要請は金融分野を対象としたものである。
    ↩ Fugu-CyberはCyberGymで86.9%、CTI-REALMで72.1%を達成した。出典： Sakana AI「Introducing Fugu-Cyber」 ↩'
