- id: arxiv:2611.24408
  title: 'StrideWorld: Benchmarking Scene Rigidity and Action Consistency in Interactive Video World Model'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.24408'
  version: 1
  source_hash: 972ad9b2611b30017c9b334e1791e6a6cdef616639f6305835f75ca6e604c6d6
  published: '2026-11-18T13:37:51Z'
  updated: '2026-11-18T13:37:51Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Interactive video world models turn user commands into the exploration of a generated scene, which requires
    the scene to keep its 3D structure as the camera moves and each action to keep a stable effect. Existing benchmarks
    mostly evaluate these properties against references fitted to the video under test, either a scene reconstructed
    from its own frames or a camera trajectory aligned to the command path with a free scale. Such references can
    absorb gradual scene deformation and changes in pace and route length, so these errors can pass undetected.
    We therefore introduce StrideWorld, a benchmark whose references are fixed before the motion they judge. It
    evaluates scene rigidity against the ground-truth geometry of the start view, and action consistency against
    the stride of each action, the camera motion of one command. The stride is measured on the model's first steps
    and then used to test the steps that follow, so each model is judged only against its own steps. Its measurements
    are validated on rendered videos with known camera motion, and its scores agree with human judgments. Across
    \nvideos{} videos generated by \nmodels{} open models from $140$ start views, all models but one deform their
    scenes as the camera moves, with offsets up to $7.3$ times those of a rigid rendering along the same camera
    path. Most models keep a steady pace when a single action is held. Along composed routes, several models often
    stall, and most completed routes end away from the positions predicted by each model's own strides. Only the
    two models that scale commands by the estimated scene depth bring most routes close to these positions. Fine-tuning
    two models on a few rendered clips removes most of their mid-route stalls. Code, data, and a leaderboard are
    publicly available at https://github.com/chuangwang123/strideworld.
