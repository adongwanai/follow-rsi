- id: arxiv:2611.11318
  title: 'PROLA: Principal-Orthogonal Low-rank Adaptation for Predictive Spatiotemporal Weather Downscaling'
  announced: '2026-11-08'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.11318'
  version: 1
  source_hash: 9d3b626717887307f001ad912b333a89866a3d46e931f32af904092ee472e29a
  published: '2026-11-08T11:42:31Z'
  updated: '2026-11-08T11:42:31Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: High-resolution weather prediction is important for resolving local atmospheric patterns missed by coarse
    global forecasts. Large pretrained weather backbones have improved global forecasting, but adapting them to
    produce future high-resolution fields from recent coarse states remains challenging and costly. We formulate
    this setting as Predictive Spatiotemporal Weather Downscaling (PSWD), a task that jointly refines spatial and
    temporal resolution while predicting future high-resolution trajectories. To this end, we propose a framework
    that decomposes prediction into spatial and temporal stages using a shared pretrained backbone, fixed numerical
    scaffolds, and lightweight residual heads. For backbone adaptation, we introduce PROLA (PRincipal-Orthogonal
    Low-rank Adaptation), which allocates a fixed low-rank budget between pretrained weights' principal directions
    and their orthogonal complement. PROLA further rescales rank-1 optimizer updates using gradient signals, improving
    adaptation without increasing trainable rank. Experiments in the PSWD setting show that PROLA outperforms representative
    low-rank adaptation baselines. Further experiments across diverse datasets and tasks support the broader applicability
    of PROLA, showing that its benefits extend beyond the primary weather downscaling setting.
