  abstract: Visual tool use enables vision-language models (VLMs) to acquire task-relevant evidence, but its effectiveness
    can be limited by predefined visual operations and the tool-use strategies learned during training. Representing
    these operations and strategies as reusable external skills allows them to be refined through self-evolution
    without updating model parameters. However, skill refinement can introduce performance regressions. Meanwhile,
    inspecting accumulated task execution trajectories together with skill evolution history may lead to evolution
    evidence overload. To address these challenges, we propose VisualEvolve, a self-evolving framework that evolves
    executable visual operations and tool-use strategies for VLMs through a Select--Execute--Evolve--Evaluate cycle.
    Skill-Library Snapshot Selection uses performance on a fixed validation set disjoint from execution tasks to
    select an effective historical snapshot for subsequent evolution, limiting the propagation of performance regressions.
    Progressive Evidence Access (PEA) guides capability-gap diagnosis through a coarse-to-fine hierarchy comprising
    the Skill-Performance Report, Evolution Log, Trajectory Summaries, and relevant raw trajectory segments. Across
    four VLM backbones and six evaluation sets from three benchmarks, VisualEvolve improves over the Initial Skill
    Library in 23 of 24 settings, with a maximum gain of 15.1 percentage points on VisualProbe Hard using Qwen3.5-Plus.
    Ablation studies support the contributions of Snapshot Selection and PEA, while further experiments show that
    skills can be improved using experience from different data settings and directly reused across backbones. Moreover,
    VisualEvolve enables effective skill self-evolution with over an order of magnitude fewer task-solving trajectories
    than estimated for representative RL-based methods.
