  abstract: 'Recursive self-improvement (RSI) promises AI systems, such as self-evolving LLM agents, that become
    better at producing further improvements. Evaluating this promise requires separating product claims about the
    final system from process claims about the improvement process itself. Existing surveys specify the evidence
    these claims require, but how often studies report that evidence remains unmeasured. We examine this question
    through full-text coding of 114 eligible studies in a reproducible arXiv search frame frozen in October 2026,
    including 90 that describe their own systems as RSI. The codebook links claims to evaluation designs. Independent
    human coding, third-reader adjudication, and a separate blind coding of improver comparisons assess coding reliability.
    Among the 90 RSI studies, 90% report product evaluation beyond development tasks under a broad criterion that
    includes partial or unstated separation, while 60% report evaluation on tasks unused for selection. Only 22%
    audit two or more reruns of the full loop. In a human-coded random sample, the RSI studies show the same contrast:
    45% evaluate on tasks unused for selection and 14% audit two or more reruns. Of the 26 studies claiming a better
    improvement procedure, 23 report a related comparison, but only 4 compare earlier and later procedures from
    identical starting artifacts at a matched budget. Across these results and a comparison set of established works,
    evidence for repeatability and improved procedures remains less developed than product evaluation. Three propositions
    explain how selection effects, shared evaluator errors, and changes in system state limit what product evaluations
    can establish. Together, the findings support a claim-indexed reporting standard that connects each claim to
    the evaluation design needed to test it.'
