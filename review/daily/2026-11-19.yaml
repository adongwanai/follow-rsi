- id: arxiv:2611.25476
  title: 'WeightCode: Installing New Capabilities into Neural Networks via Weight-Space Programming'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.25476'
