    对象：一个跨attempt持久保留workspace的编码agent harness（§3.2：workspace、脚本、缓存模型、README账本跨attempt保留，仅上下文重置，属于上下文/记忆管理与控制流改写）；以及一个在环验证器PRA（§3.4：自建终端与scratch，按rubric对agent的轨迹与workspace执行检查脚本后再打分，把失败项注入agent消息流），并配有可被改写的rubric仓库（§3.5：add/update/retire三种工具，add前必须先跑通并record_check_result，属执行反馈驱动的验证器/策略文件变异）。(2)
    闭环：PRA执行检查得到失败证据→改写rubric仓库（本次77次新增/1次更新）与检查脚本索引（checks/持久，message history每次attempt重置但checks跨attempt保留）→后续attempt与后续任务受该工件约束；离线阶段还用各attempt的leaderboard
    percentile对比强弱attempt来挖掘19条seed rubric（§3.3），这是评估反馈驱动的工件生成。(3) 权重：base agent为Qwen3-Coder-Next（temperature 0）、PRA为Claude
    Sonnet 4.6，全部为推理期使用，未见任何SFT/RL；结论部分讨论的训练PRA反馈仅列为Future Work，故权重为frozen、非主要干预。(4) 持久性：适配后的rubric在同一任务后续attempt复用，seed
    rubric更被证明从DSPredict-Easy迁移到DSPredict-Hard并跨base model（DeepSeek-V3.2）生效，满足“为后续任务/会话保留”。消融显示harness、代码执行、rubric适配各自贡献增益，符合Harness方法要件。
