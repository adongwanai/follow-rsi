  updated: '2026-11-19T03:11:24Z'
  hf_daily_dates: []
  abstract: Agent skills package procedural knowledge as natural-language instructions, and a skill helps only when
    its instructions are correct and properly followed by the agent. Self-evolving agents revise their own skills
    from the runs they make, but existing methods judge each run as a whole, by its outcome or by where it went
    wrong, and cannot tell whether a failure comes from a wrong instruction or from one the agent did not follow.
    Instruction-level coverage was introduced to test skills and labels each instruction of a run as follow, not-follow,
    or not covered, which separates these causes. We leverage it for skill self-evolution with SkillPlumber, a framework
    in which an agent evolves its own skills where coverage shows they fall short. A persistent root cause analysis
    agent turns each label into a revision question and checks each revision against the next run, while a maintainer
    distills investigations across tasks into a shared strategy library. Across three benchmarks and three executors,
    SkillPlumber solves 64.7% to 70.5% of the tasks, 25.6 to 30.4 percentage points higher than the initial skill
    and 8.7 to 14.0 percentage points higher than the strongest baseline, and removing coverage reduces recovered
    failures by 20.8% on SkillsBench with GPT-5.5.
