- id: arxiv:2611.08136
  title: How Far Can Untrained Neural Networks Go in Anomaly Detection? From Tables to Pixels
  announced: '2026-11-05'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.08136'
  version: 2
  source_hash: 42b9892f4d50f882f67821caa3cbbc97a66e433270334d8be25991e4f81d9b1e
  published: '2026-11-05T15:01:17Z'
  updated: '2026-11-09T06:21:36Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Anomaly detection (AD) is often framed as a representation-learning problem, where strong performance
    is expected to require learned features or AD-specific optimization. However, this view can overlook the intrinsic
    separability of anomalies from normal references, even in the absence of learned representations. We therefore
    investigate how far untrained neural networks can go in anomaly detection. To this end, we propose PRISM, a
    framework combining fixed random nonlinear features with normal-reference Mahalanobis scoring for tabular detection
    and dense visual localization. Across 47 tabular datasets in ADBench, PRISM-T achieves the highest mean AUROC
    (86.4%) and the second-highest mean AUPRC (65.9%) among the compared methods. On MVTec AD and VisA, covering
    27 visual categories, PRISM-V achieves mean image-level and pixel-level AUROCs of 90.4% and 96.4%, respectively.
    Notably, both models achieve these results without neural weight optimization or pretrained representations.
    A theoretical analysis further characterizes how nonlinear transformations affect the mean and covariance contributions
    to the Mahalanobis score gap, while empirical analyses examine the resulting score separability. These findings
    establish PRISM as both a competitive anomaly detector and a prior-to-learning baseline for assessing the added
    value of learned representations in anomaly detection.
