  abstract: 'Adapting a film into a game requires selecting source elements and translating them into player actions,
    rules, and feedback. We introduce Movie2Game-Bench (M2G-bench), a benchmark for evaluating film-to-game adaptation
    beyond playability. M2G-bench combines general evaluation, movie-specific evaluation, and playtesting by three
    GUI model players. The protocol connects source content to gameplay steps and implementation evidence, capturing
    both content preservation and interactive realization. The benchmark comprises 22 films and 658 source-specific
    reference items. Evaluating 14 models on the same films with their selected primary harnesses reveals complementary
    strengths in game quality, adaptation, and player experience. A shared weakness concerns playable sequences:
    this category has the lowest content-presence mean in all 14 models, averaging 37.9 out of 100 compared with
    54.8 for iconic elements. Among judgments of retained emotionaldevelopment content, narrative choices account
    for 60.0% and scenario operation for 7.2%. These findings identify two linked priorities for film-to-game adaptation:
    preserving source situations that can support gameplay and connecting retained content to player actions and
    consequences.'
