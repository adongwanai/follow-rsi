- id: arxiv:2611.21553
  title: 'BLIP-Live: Balancing Timeliness & Firing Precision in Proactive Streaming Video Agents'
  announced: '2026-11-16'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.21553'
  version: 1
  source_hash: 1202ad49acbbdac55b85c5246654deefb363f90e9057dd74eaa13621dbc87def
  published: '2026-11-16T18:33:47Z'
  updated: '2026-11-16T18:33:47Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: 'Streaming video understanding is becoming increasingly important for real-world interactive systems.
    Such systems must be proactive for natural and useful human interaction: they should respond as soon as sufficient
    evidence becomes available while avoiding premature, redundant, or incorrect responses. We present BLIP-Live,
    a framework unifying data, metrics, harness, and training around a shared formulation of proactivity as effective
    causal response decisions balancing the two competing objectives of responding vs silence. First, we construct
    BLIP-Live-780K dataset containing human annotations of proactive response content and timing, which defines
    this desired behavior. We then propose PAUC-F, a metric to effectively measure our desired proactive behavior.
    PAUC-F combines existing response timeliness metrics with firing precision to reward early useful responses
    without rewarding excessive firing. With our desired behavior defined and measurable, we finally investigate
    model-agnostic inference harnesses that draw out proactive streaming capabilities of offline vision language
    models (VLMs), together with training pipelines that learn to further improve their proactive responsiveness.
    Across both settings, we find that combinations of sliding visual windows, online interaction memory, and structured
    response outputs consistently yield strongest proactive performance. Our experiments result in two models, with
    our BLIP-Live-Qwen model achieving state-of-the-art performance across four proactive streaming benchmarks,
    with gains up to 44% over baselines and outperforming multiple closed API models. Our code and data will be
    released publicly.'
