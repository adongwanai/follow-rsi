  abstract: Generating a LEGO model from a user request is more than a plausible 3D shape generation. LEGO models
    require physical support per brick, and each brick should be placed unblocked. Current methods address this
    issue by training an expert large language model. We reduce the problem of generating extremely long context
    on all brick connections to that of writing a program that builds LEGO models like a human, considering each
    intermediate step could be executed. We introduce DailyBrick , a multi-stage agentic system that produces a
    LEGO model together with a brick-by-brick assembly instruction for human building and robot assembly. We design
    a multi-stage harness with roles to help LLMs generate more effectively. A versioned construction SDK compiles
    multi-level decisions, from semantic subparts to individual bricks, into canonical operations. An external Meta-Reviewer
    agent replays and inspects the generated package, verifies the model and its construction process, identifies
    failures, traces them to the responsible stage, and routes them to bounded repairs or to editable candidates
    for later skill or tool updates. Extensive experiments demonstrate that DailyBrick generates LEGO models based
    on simple user requests better than recent agentic systems, and show its utility in downstream applications
    such as robot manipulations on model assembly from instructions and brick sets (https://spatialagentlab.github.io/DailyBrick.github.io/).
