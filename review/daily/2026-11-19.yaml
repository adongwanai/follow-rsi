- id: arxiv:2611.26503
  title: 'JARVIS: An Agent That Designs, Builds, and Tests Circuit Boards on Its Own'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.26503'
  version: 1
  source_hash: d9ea93deaa99ff8b0393179b357b8ff48938e59db28ac7b0644b0b033758a61b
  published: '2026-11-19T17:53:30Z'
  updated: '2026-11-19T17:53:30Z'
  hf_daily_dates: []
  abstract: Power electronics is central to the energy transition, but developing new hardware still relies on human-led
    design, fabrication, testing, and iteration. We present JARVIS, an embodied AI agent that autonomously closes
    this loop for circuit boards. JARVIS maintains machine-specific capabilities and constraints, scans its workspace
    using a robot-mounted 3D scanner, and constructs an executable digital twin in which it rehearses robot motions,
    fabrication steps, and circuit behavior before consuming materials. A single text instruction initiates the
    physical experiment. Using unmodified desktop equipment, the agent coordinates a robot arm, a PCB printer that
    deposits conductive silver ink and solder paste, and a pick-and-place machine. It verifies progress using cameras
    and sensors, then tests the fabricated circuit with an OPAL-RT real-time simulator and an oscilloscope. Based
    on the measurements, JARVIS diagnoses deviations from the design and generates a revised design in KiCad for
    subsequent rehearsal. In a demonstration involving a 60 Hz notch filter for grid-connected converter sensing,
    JARVIS completed a first-run experiment in 2 h 39 min without human intervention, achieving 50.6 dB attenuation
    at 60 Hz. Its digital-twin rehearsal identified five issues before fabrication, including a test criterion that
    would have incorrectly rejected a functioning board. During execution, the agent also resolved encountered faults
    autonomously. These results demonstrate an integrated agent-driven workflow for physical design, fabrication,
    measurement, and iterative improvement of power-electronic circuitry. To our knowledge, JARVIS is the first
    system in power electronics in which an agent closes the physical design-build-test-learn loop for circuit boards.
