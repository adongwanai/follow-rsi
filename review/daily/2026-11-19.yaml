  published: '2026-11-18T18:07:55Z'
  updated: '2026-11-18T18:07:55Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Language models acquire their capabilities from training data, and developers withhold data during training
    to keep models from learning capabilities that could be misused. How long this delays a capability, and how
    much data is needed to acquire it later, is unknown. Here we show that the general progress a model makes on
    the rest of its training data substitutes for the data that was withheld. We withheld the training signal for
    individual skills in models of chess, Othello, molecular strings, bracket languages and web text. The delay
    of a withheld skill in larger models was predicted from smaller ones. A chess model never explicitly trained
    to respond to check ranked the legal responses almost as well as a model that was. When models were then trained
    on the withheld data, they acquired the skill with a small fraction of the data needed from initialization,
    and this fraction decreased as the models progressed. A control rule of equal difficulty was learned much more
    slowly. A programming language withheld from the training text of a 7-billion-parameter model was regained in
    the same way. Data filtering therefore delays a capability, and the data required to regain it decreases as
    models improve.
