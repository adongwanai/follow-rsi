- id: arxiv:2611.24098
  title: 'RoughCut-Bench: A Benchmark for Automatic Video Rough-Cut with Large Vision-Language Models'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.24098'
  version: 2
  source_hash: ee59db8b8c2e348bb0bf269ace5d171a07cdba8ba6ff5a11fc0a6ff8aab663ed
  published: '2026-11-18T09:21:18Z'
  updated: '2026-11-20T06:46:34Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: 'Video rough-cut is a core stage in media production workflows, organizing raw media materials into
    an initial video cut. Despite recent advances in large vision-language models (LVLMs) for video-related tasks,
    automatic rough-cut remains underexplored, without a comprehensive benchmark for evaluation or mature workflows
    for producing executable cut plans. To address the evaluation gap, we introduce RoughCut-Bench, which covers
    two practical settings: (1) a visually driven setting over video cases, covering highlight detection and selection,
    source-video ordering, and adherence to user requirements when provided; and (2) a speech-driven setting over
    automatic speech recognition (ASR) transcripts, covering filler removal, expression deduplication, and low-value
    content trimming. Across these settings, the benchmark contains 101 visually driven cases, including 831 raw
    videos with 1,476 highlight annotations. It also includes 84 speech-driven cases, each consisting of an ASR
    transcript with annotated cleanup spans. The evaluation compares cut plans with these annotations in both settings
    and additionally uses a human-aligned agentic evaluator to assess rendered-cut quality in the visual setting.
    To apply LVLMs to automatic rough-cut, we further propose agentic workflows that guide them to produce structured
    cut plans from input materials. Experiments show that current LVLMs remain limited in producing expert-aligned
    cut plans. Our benchmark, code, and prompts are released at https://whalesong-zrs.github.io/RoughCut-Bench-Project-Page.'
