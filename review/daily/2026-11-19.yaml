- id: arxiv:2611.23824
  title: Evidence-Based Credit Assignment for Search-Augmented Language Models
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.23824'
  version: 1
  source_hash: 73697dd4de54b6e173083b907f9d76e64b4f9a47b57e6e34965ee78964700c1f
  published: '2026-11-18T04:24:51Z'
  updated: '2026-11-18T04:24:51Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Reinforcement learning from terminal answer rewards enables search-augmented language models to interleave
    reasoning and retrieval without step-level annotations, yet outcome supervision assigns identical credit to
    every search in a trajectory regardless of whether it retrieved useful information. This limitation is especially
    severe when all sampled rollouts for a question fail, collapsing group-centered outcome advantages to zero even
    when trajectories gather markedly different evidence. We present Evidence-based Credit Assignment (ECA), which
    augments terminal outcome rewards with a training-only auxiliary signal measuring how retrieved documents improve
    the likelihood of a reference answer. Rather than scoring the full dialogue prefix, ECA queries a frozen snapshot
    of the current policy under an evidence-only prompt containing solely the question and the deduplicated documents
    observed so far, isolating the utility of retrieved passages from surface variations in generated thoughts or
    search queries. Within this framework, we compare two return formulations, ECA-Step (which accumulates step-clipped
    potential increments) and ECA-Horizon (which preserves the telescoping horizon gain in potential), paired with
    cross-fold group normalization, novelty gating, and search-local token assignment. Across seven Search QA benchmarks,
    ECA-Horizon improves strict macro exact match over an outcome-only GRPO baseline by 1.03 and 4.80 percentage
    points on Qwen2.5-3B- and 7B-Instruct, respectively, outperforming both RLOO and GiGPO. Zero-shot evaluation
    on MultiHop-RAG further demonstrates strong transfer to multi-hop inference queries.
