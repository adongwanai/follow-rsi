- id: arxiv:2611.24059
  title: 'Replay, Don''t Resample: Off-Policy Consolidation of Long-Horizon RL Experts'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.24059'
  version: 1
  source_hash: 93c2977f48168fee235c11c1a63d3b6a2ae67ab850217168d520e0166ba5de69
  published: '2026-11-18T08:51:39Z'
  updated: '2026-11-18T08:51:39Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: 'Frontier post-training follows a common recipe: train one expert per domain with reinforcement learning
    (RL), then consolidate the experts into one model via multi-teacher on-policy distillation (MOPD). Such consolidation
    is expensive: the student samples in every environment again, an expert scores every sampled token, and the
    student inherits the drift of the final experts. Yet we argue that the experts'' RL runs have already produced
    what consolidation needs: rollouts with their sampling probabilities and rewards, in the order the experts learned
    from them. We propose multi-expert replay policy distillation (MRPD), which replays these training logs through
    the student in the experts'' order. At each step, the policy gradient is recomputed on these scored trajectories,
    and the final experts'' distributions are distilled at the logged prefixes. Following the experts'' own trajectory
    reduces the training-inference mismatch and keeps the student within the clip range, so the replay is off-policy
    in origin but quasi-on-policy throughout consolidation. MRPD samples nothing and calls no environment or reward
    model: the trainer is the sole process, and consolidating the experts costs only about a seventh of the compute
    used to train them. On three long-horizon agentic domains (reasoning, search and SQL), MRPD yields the best
    student model, substantially outperforming online RL baselines, and surpassing MOPD from the same experts at
    a fraction of MOPD''s cost. Our analysis on the same logs shows that the replayed trajectories carry most of
    the gain, and that both the policy gradient and the distillation term add to it. Most interestingly, the order
    of the logs matters more than their amount or rewards, suggesting that expert training logs are a curriculum,
    not a data mixture.'
