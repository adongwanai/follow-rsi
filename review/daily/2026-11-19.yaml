  source_hash: 98935308d00a73f4fff59d9a2bf416bf156087b4645066966e3efbcb8cb93585
  published: '2026-11-18T16:56:59Z'
  updated: '2026-11-20T18:25:30Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: System One models such as Jev return decisions through fast, parallel prediction. In this paper, we
    introduce Jeveration, showing that the same decision paradigm can also generate high-quality images in a single
    forward pass. Jeveration builds on a frozen vision-language model, repurposing its visual-semantic knowledge
    for holistic image generation. The key challenge is to maintain global consistency. A single prompt admits many
    valid images, yet parallel predictions must converge on a coherent whole. We therefore condition all positions
    on a shared random state to coordinate parallel predictions, so that each draw yields a different but coherent
    image. Since the model tends to ignore this state under direct image supervision, we first learn a distribution
    over discrete image codes to guide single-pass generation. Beyond text-to-image generation, we further unify
    image-to-image generation and dense prediction within the same architecture, so that one checkpoint supports
    all three tasks, each in one forward pass. Experiments show that Jeveration generates a 512x512 image in 78
    ms, up to 122x faster than existing unified models, while maintaining competitive image quality and dense prediction
    performance.
