  source_hash: 7372b07f3585311fd98593111f89daf40cd05163441760ca5e1c85a7a47c413f
  published: '2026-11-12T23:45:58Z'
  updated: '2026-11-12T23:45:58Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Multimodal tabular learning involves classification and regression on tables combining structured numerical
    and categorical features with unstructured text and images. These unstructured fields are commonly represented
    by pretrained encoder embeddings reduced with principal component analysis (PCA). This reduction prioritizes
    input variance but may overlook information relevant to predicting the target. We introduce LightTAR, a simple,
    inexpensive method that adapts dimensionality reduction to the prediction task. LightTAR augments the standard
    PCA representation with a few target-aware features extracted jointly from the final and an intermediate encoder
    layer using regularized partial least squares (PLS). We evaluate LightTAR with 21 tabular models, including
    tree ensembles, neural networks, and tabular foundation models. LightTAR improves average predictive performance
    for all models and, averaged across models, improves prediction on almost every MulTaBench dataset. These gains
    come with a small increase in total runtime relative to PCA representations. LightTAR integrates directly into
    existing encoding pipelines, improving tabular learners' predictive performance without modifying the encoder
    or the learner.
