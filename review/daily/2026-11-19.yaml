  arxiv_id: '2611.26806'
  version: 1
  source_hash: e870434a66c0d47384c7dc18e2194ff4b255790f7a55b38b3ba05565dd79d541
  published: '2026-11-19T20:48:58Z'
  updated: '2026-11-19T20:48:58Z'
  hf_daily_dates: []
  abstract: Medical agents built on large language models (LLMs) have advanced rapidly, yet most stay fixed once
    deployed and do not keep using their experience to improve later attempts. As a result, the same kind of error
    can recur across patients. To address this, existing self-improvement methods update an agent's weights or its
    medical harness from its own experience, but their improving strategy stays fixed and never learns which changes
    actually help, which caps how much the agent can improve. Recursive self-improvement (RSI) instead improves
    both the agent and its improving strategy. However, achieving RSI for medical agents is challenging, because
    clinical workflows rarely come with a reference harness, and a change that fixes early errors may not fix the
    problems the agent meets later. We propose MedicalRSI, an RSI framework built on Clinical Model-Harness Co-Evolution,
    in which one model plays two roles. The Solver is the medical agent itself, and the Improver is its learnable
    improving strategy, which writes a medical harness from the agent's failures. Each harness is rewarded by its
    gain over acting without it, and both roles are trained together, so the Improver keeps adapting to the problems
    the Solver has not yet solved. On multiple benchmarks and LLM backbones, MedicalRSI outperforms existing context-level
    and weight-level self-improvement methods and transfers well to unseen workflows, new LLMs and new databases,
    a step toward medical agents that keep improving.
