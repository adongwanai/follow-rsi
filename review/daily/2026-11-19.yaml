- id: arxiv:2611.23068
  title: 'The Resolution Hypothesis: Agent Evolution''s Key Is Identifying Improvements'
  announced: '2026-11-17'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.23068'
  version: 1
  source_hash: 7b86364bd36f74000e19e7e0eb24bf3fc78aa09835675205fb77e3576681c0c0
  published: '2026-11-17T16:57:03Z'
  updated: '2026-11-17T16:57:03Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: 'Agent evolution follows a simple loop: a proposer writes candidate artifacts (prompts, skills, memories)
    and selection accepts those that score higher. This loop has shown promise, yet practitioners face a puzzle:
    methods trade wins across papers, and evolution often fails to bootstrap on certain tasks. We trace this puzzle
    to the Resolution Hypothesis: agent evolution stalls not because methods fail to propose better artifacts, but
    because noisy evaluations cannot reliably identify them. Across seven evolution methods and six models (over
    10M LLM calls), we find support for the hypothesis at both levels where evaluation scores are used. At the candidate
    level (choosing artifacts), helpful candidate artifacts exist, but selection is no better than random at telling
    them from harmful ones, so errors accumulate across rounds. At the method level (ranking methods), typical margins
    of a few percentage points are smaller than the difference between two independent runs of the same method,
    so published rankings often rest on luck. Together, these findings indicate that agent evolution is often bottlenecked
    by reliably identifying improvements. This calls for a shift in how we develop and evaluate self-improving agents,
    from designing ever more candidate improvement systems to making true improvements detectable and accumulable.'
