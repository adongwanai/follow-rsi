    and evolution acts on strategies alone）。循环为竞争性协同进化：agent 之间对局得到 realised fitness φ，再按排名 Boltzmann 抽样 donor、按适应度差给出请求剂量
    β，由 merge 算子（tactic append、template append、free rewrite、constrained rewrite）把 donor 的行为痕迹注入 recipient 生成子代 prompt，子代进入种群并按排名比例淘汰，重新评分。修改由执行/评估反馈驱动（对局得分与冻结
