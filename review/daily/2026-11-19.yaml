- id: arxiv:2611.26007
  title: 'System-One RSI: Building Muscle Memory for Interactive Agents through Guided Practice'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.26007'
  version: 1
  source_hash: 96bd093575bab7c45e944d3b3244ccac0c09e0e06de387b4d6ac27a7ecc784c5
  published: '2026-11-19T12:27:36Z'
  updated: '2026-11-19T12:27:36Z'
  hf_daily_dates: []
  abstract: 'Reasoning models provide strong multimodal task understanding but struggle with sub-second control
    because deliberation increases decision latency. Fast decision models can meet the response window, yet prompting
    and few-shot examples do not readily provide the fine-grained experience required by a new task. Inspired by
    coached motor learning, this paper presents System-One Recursive Self-Improvement (System-One RSI), which couples
    two loops. The high-frequency online inner loop is an Observe, Orient, Decide, Act (OODA) cycle: a decision
    model maps each visual observation and task question to structured judgments, and a decision tree converts them
    into timed actions without invoking a reasoning model. The offline outer loop is a recursive improvement cycle
    carried out by a team of reasoning agents. The team revises the decision-model prompt and decision tree, captures
    interaction records, derives supervision from those records, and trains or deploys updated model parameters.
    The improved system then returns to the environment and generates the experience for the next round, consolidating
    learned distinctions as external muscle memory. The framework operates with a small number of real episodes,
    without expert demonstrations, environment modification, sandboxing, or parallel simulation. Experiments in
    Snake, Zenless Zone Zero, and Black Myth: Wukong use a 27B decision model. Mean Snake score increases from 1.30
    to 7.35. In an evaluated scenario of Zenless Zone Zero, median completion time decreases by 8.4%. In an evaluated
    combat scenario of Black Myth: Wukong, the evasive policy achieves 11 times the mean survival time of a stationary
    reference, while the offensive policy win rate rises from 0% to 66.7% across the evaluated configurations.'
