- id: arxiv:2611.19200
  title: 'LogT: Logically Think with Images for Visual Search'
  announced: '2026-11-14'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.19200'
  version: 1
  source_hash: 1a18a2540a2d40b99dad92d71cb5daa51dcc0ada6dc532e1263700cf8630057b
  published: '2026-11-14T06:47:45Z'
  updated: '2026-11-14T06:47:45Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Thinking with images empowers vision-language models (VLMs) to use an external Zoom-in tool for fine-grained
    visual search. Recent works employ supervised fine-tuning (SFT) and reinforcement learning (RL) with tool-specific
    designs to enable such capabilities. However, achieving logical reasoning alongside accurate and efficient tool
    use remains a significant challenge. To address this, we shift the focus away from increasing RL complexity
    and instead identify SFT data quality as a key bottleneck. We then propose LogT (short for Logically Think with
    Images), a fully automated SFT data engine that explicitly enforces logic-chain-guided reasoning. LogT generates
    an SFT dataset featuring challenging, visually grounded questions and structured tool-use traces with human-like
    logic. We validate our approach by fine-tuning two base models, Qwen2.5-VL-7B and InternVL3.5-8B, on the dataset
    and evaluating them across seven benchmark test sets. We show that LogT-SFT based on Qwen2.5-VL-7B outperforms
    the state-of-the-art trained with both SFT and RL, despite using 3.1$\times$ less data and $>120\times$ fewer
    GPU hours. Furthermore, applying a simple RL recipe without tool-specific design on LogT-SFT yields a model
    that surpasses prior methods with complex RL setups by a substantial 9.59-point margin. In addition to strong
    performance gains, our model exhibits higher tool-use accuracy and efficiency, as well as more structured and
    logically consistent reasoning traces, directly validating the effectiveness of our approach.
