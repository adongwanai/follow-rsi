  abstract: 'In this paper, we propose a Unified Law for Visual Tasks, which could be further divided into Four
    Laws of Computer Vision, with the goal of enabling a single framework or method to uniformly train on and perform
    nearly all visual tasks. Our starting point is an inspiration and hypothesis: if the world information is encoded
    into image, which we call World Snapshots, then image processing is world processing, and image generation is
    World Snapshot generation. Furthermore, if all visual and visualization tasks can be reformulated as generation
    tasks, then a unified method, World Snapshot Models (WSMs), can perform the vast majority of visual tasks, much
    as large language models have largely unified natural language processing. This paper validates these laws across
    more than 1,000 trained and evaluated visual tasks (defined by distinct input-output mappings) and presents
    a unified training framework for future visual-task research and applications.'
