- id: arxiv:2611.22925
  title: 'Code World Model 2.0: Towards Infinite Controllable Video Generation'
  announced: '2026-11-17'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.22925'
  version: 2
  source_hash: f035968bf3996d4c32e5ff1d682a16a77cf344753711fd44d4aca924223981c1
