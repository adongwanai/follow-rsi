- id: arxiv:2611.22382
  title: 'RICoT: Recurrent Interleaved Chain-of-Thought for Page Stream Segmentation'
  announced: '2026-11-17'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
