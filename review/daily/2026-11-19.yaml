- id: arxiv:2611.23751
  title: 'Thinking Fast, Anywhere: One System-1 for the Decision Points of Any Agent Workflow'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.23751'
  version: 1
  source_hash: c3e19016d2a4130663b39ba500a44e984cb55d6b9ddc53b12a5e8f76b288c1f7
  published: '2026-11-18T03:05:41Z'
  updated: '2026-11-18T03:05:41Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: Autonomous LLM agents incur substantial cost and latency by invoking a large model (System-2) at every
    step, even when many intermediate actions choose among a small set of known candidates. Existing dual-system
    agents offload such decisions to a lightweight System-1 model, but rely on workflow-specific hooks authored
    per environment. We present AnyS1, a framework that turns human-authored procedural skills, whose instructions
    naturally specify where choices arise and which options apply, into a shared, domain-general source of decision
    points. Offline, AnyS1 mines grounded enumerable decisions across over 1,000 public skills, gathers execution-grounded
    trajectory states inside isolated containers to construct Any-DP, and trains a single calibrated 4B pointer
    System-1 with label smoothing. At run time, compiled workflows resolve routine decisions in one forward pass
    and fall back to System-2 when confidence falls below a calibrated threshold. Across three unseen benchmarks
    and distinct System-2 model families, AnyS1 preserves task reliability while cutting episode cost by 75-91%
    and model-call time by 63-92% relative to an uncompiled System-2 agent, and maintains performance under zero-shot
    threshold transfer.
