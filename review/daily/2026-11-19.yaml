  abstract: A central obstacle to self-improving agents is the absence of a reliable fitness signal for realistic
    stateful tasks. We introduce \textsc{VeriEvolve}, an evaluator-first evolution framework that constructs this
    missing evaluation layer before optimizing the agent. From task instruction, VeriEvolve synthesizes instruction-grounded
    challenge states and an executable evaluator that checks them. During each round of workflow evolution, the
    evaluator is frozen and serves as the fitness signal. Between rounds, VeriEvolve revises the evaluator by converting
    the end states of strong and weak runs into a pair of counterfactual test cases. Across all 30 MCPMark Filesystem
    tasks, VeriEvolve constructs 30 evaluators with 141 challenge states, achieving 141/141 agreement on the generated
    suites and 113/122 agreement on held-out states produced by executor agents. Evaluator-guided evolution increases
    externally verified success from 6/30 to 18/30 for GLM-5.2 and from 27/30 to 30/30 for Claude; refinement removes
    all three false positives that the weak executor exposes. Cross-environment studies on PostgreSQL, Playwright,
    Notion, and GitHub further expose complementary limits from observability, state representation, and search/execution
    capacity. These results show that executable evaluators can be synthesized and used to guide search when task
    success is observable and an external verifier is available for calibration.
