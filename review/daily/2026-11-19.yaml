  abstract: Large language models enable agents to optimize RTL using EDA feedback, yet their executable search
    procedures remain largely hand- engineered. We present Meta-RTL, an EDA-grounded framework that evolves RTL
    optimization harnesses from a minimal loop while keeping the optimization model, EDA flow, and per-design budgets
    fixed. Compared with Dr. RTL, Meta-RTL* reduces aggregate WNS/TNS violations by 7.8%/11.0% across 20 development
    designs, with area reductions on 70% of them. Without further evolution, Meta-RTL* transfers to 10 unseen IC-RTL
    designs, reducing aggregate WNS/TNS violations by 20.5%/14.0% and total synthesized area by 12.6%. We further
    characterize three search mechanisms in the evolved harness and assess their contributions through ablations
    and a case study.
