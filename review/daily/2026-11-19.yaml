  updated: '2026-11-19T07:32:00Z'
  hf_daily_dates: []
  abstract: Given an image and successive user instructions, sequential image editing should return an updated image
    that satisfies each new request and preserves earlier requirements that remain active. This lets users develop
    a result without repeatedly restating or repairing their decisions. The difficulty is that a retrieved image
    can contain a valid color on an obsolete surface, while the current image may lack the newly requested material.
    Neither reference selection nor a precise object mask alone specifies how to reconcile attributes occupying
    the same region. We present TRACE, which separates the continuing attribute from its visual carrier and prioritizes
    local appearance operations under complete-request checks. Active-goal binding identifies what should persist,
    carrier selection supplies suitable current or newly generated pixels, and tonal calibration reduces tinting
    near highlights and shadows. Experiments across frozen editors, independent visual readers, new source images,
    and complete sequential benchmarks support joint color-material recovery and show how local execution preserves
    the surrounding scene.
