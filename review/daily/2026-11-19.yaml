- id: arxiv:2611.23386
  title: 'Chorus: Shared N-gram Embeddings with Layer-wise Adaptation'
  announced: '2026-11-17'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.23386'
  version: 2
  source_hash: 62d5c1a704cf6f48308730057c3c74cb7c9ee986616c54ce726085548bd00cde
  published: '2026-11-17T19:00:05Z'
  updated: '2026-11-19T12:49:23Z'
  hf_daily_dates:
  - '2026-11-19'
  abstract: 'Language models can gain capacity at little computational cost from n-gram embedding tables: large
    tables of learned vectors for short sequences of consecutive tokens, which are looked up and added to the model''s
    input or to its intermediate layers. Recent designs commonly use a separate n-gram embedding table for each
    layer, which makes the tables costly in memory and prevents layers from sharing what they learn. However, a
    single shared table gives every layer the same embedding, leaves no room for layer-wise preferences, and performs
    poorly in practice. We propose Chorus, in which one set of n-gram embedding tables serves the whole network
    and every layer reads it in its own way. Each layer maps the refined embedding through its own projection layer,
    after rescaling its components by factors computed from its current hidden state. Chorus matches the quality
    of existing n-gram methods with 87% smaller tables: with 1.2B table parameters it predicts text better than
    FactorEngram and DeepSeek''s Engram do with 9.6B. It outperforms Engram, TN-gram and FactorEngram in every setting
    where we compared them, across table sizes from 20M to 9.6B parameters. We also show that the recently proposed
    memory-efficient optimizer Ember works well with Chorus, saving 99.2% of table-optimizer memory compared with
    AdamW without degrading training performance. These results enable further scaling of n-gram embedding tables
    along the table-size axis by reducing memory use and allowing shared knowledge to be reused across layers.'
