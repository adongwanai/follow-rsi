  abstract: Long-horizon LLM agents interact with their environments through complete assistant turns while generating
    each action token by token. We observe that critic values vary primarily across turns, motivating optimization
    anchored at turns with finer credit allocation among tokens. We propose Multiscale Policy Optimization (MPO),
    combining Multiscale Advantage Estimation (MAE) and turn-level importance sampling to align credit assignment
    and policy updates at the turn scale. Extensive experiments across search, tool-use, and automation tasks with
    4B and 30B-A3B models demonstrate consistent gains over strong RL baselines.
