- id: arxiv:2610.25950
  arxiv_id: '2610.25950'
  title: 'AdaExploreBench: Benchmarking LLM Agents for Proactive Exploration and Test-time Adaptation in Evolving
    Environments'
  version: 1
  source_hash: 290307272e439fc025cff9c5a032b8820191456f5db6d69f56b25bb97b4778cf
  abstract: 'Large Language Model (LLM) agents are increasingly deployed in unfamiliar and evolving environments,
    requiring them to proactively explore, understand, and adapt to environmental dynamics. However, existing benchmarks
    rarely test whether agents can proactively discover how an environment works and adapt as it evolves. To address
    this gap, we introduce AdaExploreBench, a benchmark for proactive exploration and test-time adaptation in evolving
    environments. By instantiating environmental dynamics as hidden rules, AdaExploreBench requires agents to actively
    acquire evidence and infer the rules. Under implicit rule drift, the latent rule changes without announcement,
    requiring agents to detect from degraded performance that prior knowledge is stale and re-explore. Experiments
    on eight leading LLMs show that proactive and adaptive exploration remain challenging: GPT-6 Sol achieves only
    61.9% calibrated accuracy, while providing sufficient evidence or removing rule drift improves average performance
    significantly by close to 10%. These results reveal a critical bottleneck in current LLM agents: they can often
    reason effectively from informative evidence once it is available, but struggle to actively acquire the right
    evidence and recognize when previously acquired evidence is no longer valid.'
