- id: arxiv:2610.29458
  arxiv_id: '2610.29458'
  title: Harness Scaling for Generalizable Agentic Reinforcement Learning
  version: 1
  source_hash: 5a1177ec88ba8b47c3d06bcd38abb1585593e7dab390d1bf4bad56d8f1fad158
  abstract: Agent harnesses have become a central component of modern agentic systems, shaping how models use tools,
    manage context, and coordinate long-horizon interaction. Realizing the benefits of these harnesses depends on
    how effectively the underlying model can make use of them, motivating reinforcement learning directly through
    the harness. However, existing approaches typically train through a single fixed harness, which can lead to
    specialization and limited transfer across harness configurations. To address this, we introduce Harness Scaling,
    a new scaling dimension for agentic RL that extends training from a single harness to diverse execution configurations.
    Concretely, we construct a factorized harness space, select a compact training subset with balanced factorial
    coverage, and organize cross-harness training to combine global coverage with controlled variation for the same
    task. Across multiple benchmarks, model scales, and RL algorithms, Harness Scaling consistently improves generalization
    to unseen white-box configurations. Moreover, models trained through structured white-box variation transfer
    effectively to unseen external black-box harnesses, outperforming models trained through a single complex black-box
    harness. These results establish harness diversity as a meaningful scaling dimension for agentic RL and highlight
    the importance of how this diversity is organized for cross-harness generalization.
