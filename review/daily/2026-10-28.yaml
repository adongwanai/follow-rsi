- id: arxiv:2610.37341
  title: 'CodeCap-Bench: Can Code Serve as a Good Video Caption?'
  announced: '2026-10-27'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.37341'
