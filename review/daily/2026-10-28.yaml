- id: arxiv:2610.36068
  title: 'Rollback: Experience Backtracking in World Models for Policy Improvement'
  announced: '2026-10-26'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: embodied
  decision: reject
  arxiv_id: '2610.36068'
  version: 1
  source_hash: 5e9c29fbd6e9607ebf002c6dabf963190e48ad9525eca6cc2137bd40ab8cb529
  published: '2026-10-26T18:01:02Z'
  updated: '2026-10-26T18:01:02Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Action-conditioned world models offer a scalable alternative to costly real-world interaction for improving
    robot policies. However, existing world-model-based methods largely treat world models as forward-only surrogates
    of the physical environment, leaving untapped a capability no physical environment affords: rewinding to past
    decision points to explore counterfactual futures. We introduce Rollback, a policy improvement paradigm that
    turns world models from passive simulators into counterfactual engines: it rolls back to critical decision points,
    branches into alternative actions, and contrasts their outcomes to attribute success to individual decisions.
    This concentrates imagination where it matters most and distills counterfactual outcomes into fine-grained,
    action-level supervision without a separately learned value model. We build a scalable training system that
    unifies distributed world-model search with asynchronous real-robot execution, forming a self-reinforcing cycle:
    real-world experience continually sharpens the world model, and a sharper world model in turn drives further
    policy improvement. We term the world-model side of this cycle test-time physics grounding, a capability that
    hand-built physics simulators lack: while the world model serves as the training environment, real transitions
    from the policy it trains correct its dynamics through a lightweight LoRA pipeline. Experiments on three challenging
    real-world tasks show that Rollback improves success rates over the strongest baseline by an absolute 10.67%,
    11.11%, and 11.85% on block extraction, ball tossing, and tabletop curling, respectively, while achieving more
    stable improvement throughout training. Although initialized from teleoperated demonstrations far below human
    level, Rollback surpasses the average success rate of human players on both ball tossing and tabletop curling
    within 8 hours of training.'
