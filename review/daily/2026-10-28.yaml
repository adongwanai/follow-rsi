- id: arxiv:2509.05512
  title: Quaternion Approximate Networks for Enhanced Image Classification and Oriented Object Detection
  announced: '2025-09-05'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2509.05512'
  version: 2
  source_hash: 41df3fcf5588bdd73a11adf70f10acdf70aca509155005fe232c743d407e997a
