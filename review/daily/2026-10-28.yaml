  source_hash: cf154f43f8baa4f653c0c7182c08dd64557e8a881e8ecada8494bbb1eb414657
  published: '2026-10-27T01:21:26Z'
  updated: '2026-10-27T01:21:26Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: We propose Nemotron-Labs-Diffusion-Uni (NLD-Uni), a unified discrete diffusion large language model
    (DLLM) for visual understanding and generation tasks. Compared with prior unified diffusion models, NLD-Uni
    introduces two major innovations. First, we propose a unified cross-paradigm on-policy distillation (OPD) framework
    that successfully transfers the visual understanding ability of autoregressive VLMs and visual generation ability
    of continuous flow models, to a unified DLLM. Second, NLD-Uni incorporates a novel progressive self-refining
    diffusion process that gradually corrupts each token across multiple steps during training, as opposed to adopting
    the conventional masked diffusion formulation that directly corrupts a clean image token to an uninformative
    mask token. At inference, this design allows NLD-Uni to make intermediate commit to a token, enabling progressive
    self-refinement for better visual quality. Through extensive experiments, we show that NLD-Uni achieves state-of-the-art
    performance among unified DLLMs on diverse tasks including visual question-answering, multi-modal reasoning,
    object grounding, text-to-image generation, and image editing.
