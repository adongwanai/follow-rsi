- id: arxiv:2610.36077
  arxiv_id: '2610.36077'
  title: The Trinity:Capability-Driven Recursive Self-Improvement for Multimodal Agents
  version: 1
  source_hash: e58c8e340cd892efdcbd3b1b449d23c6ad770ec0c117ca5b9abd01b88899a9d8
  abstract: 'Multimodal intelligence can be viewed as human-guided co-evolution between worlds and agents through
    interaction. However, scaling this process faces two bottlenecks: constructing heterogeneous, verifiable environments
    is costly, and manual Harness iteration cannot keep pace with growing task diversity and complexity. A key insight
    is that tasks with different modalities and surface forms can share the same underlying capability requirements.
    We therefore introduce The Trinity, a recursive self-improvement framework coupling world generation with Harness
    evolution through three roles: Creator, Explorer, and Evolver. Drawing on verified execution trajectories, Evolver
    shifts the basis of task organization from surface categories to shared requirements, reorganizing the original
    task tree into a hierarchical capability tree. We introduce Capability-Driven Real2Sim2Real: for heterogeneous
    tasks at the same node, Creator abstracts their common requirements into simplified, verifiable simulated worlds
    for capability learning, while evaluation on original tasks measures transfer. Along this capability tree, Explorer
    progressively evolves reusable capability modules through selective inheritance, forming a Harness tree whose
    validated updates accumulate across iterations within a fixed topology. The resulting Harnesses specialize in
    different capabilities, motivating a Capability-Aware Harness Router that uses public task information to select
    compatible module configurations from the tree. Our evolved Harnesses improve mean performance by 34 points
    across 28 training benchmarks and 26 points across 18 unseen benchmarks, including two real-world embodied tasks.'
