- id: arxiv:2610.29003
  title: 'T-DIG: Text-Conditioned Diversity for Image Generation'
  announced: '2026-10-21'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.29003'
  version: 1
  source_hash: 7ed81b79c8d1d6bb7ef992bca31382777d22ac0ae4df1f68e3d5cd4eda654e81
  published: '2026-10-21T00:11:32Z'
  updated: '2026-10-21T00:11:32Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Text-to-image (T2I) platforms typically return several images per prompt so users can explore different
    visual interpretations and choose one that matches their intent. However, T2I models are usually optimized for
    single-image quality which comes at a cost of multi-image diversity, limiting this exploration. Diversity is
    also contextual: one user wants variations in background, while another wants them in artistic style, and the
    same user may later want variations in clothing. The generated images should differ along whatever axis the
    user cares about. In this paper, we introduce T-DIG, a text-conditioned diversity framework for image generation
    and editing. T-DIG is an iterative framework comprising multiple modules that lets users type prompts, inspect
    default generations, request variations using natural language, and continue refining outputs until they''re
    satisfied. At its core, T-DIG uses an LLM policy that produces K axis-conditioned prompts or edit instructions
    for a frozen generator or editor. We train this policy with GRPO using a text-conditioned diversity reward and
    alignment penalties. Because the image generator remains frozen, T-DIG applies to open-weight, distilled, and
    proprietary models. We also release the first dataset for text-conditioned prompt diversity in image generation,
    with the training and validation splits built from human-written axes and a test set drawn from real user interactions
    with T-DIG. T-DIG far exceeds baselines in improving text-conditioned diversity, while preserving base-prompt
    alignment across a variety of metrics and human judgements. We show that user-directed diversity exploration
    can be added to a wide range of image generation models, open and closed, without the need to access their weights.
    Website: https://image-study.org/t-dig/'
