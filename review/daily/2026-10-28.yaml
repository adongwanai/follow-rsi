  abstract: Vision--Language--Action (VLA) models generate robot actions from visual observations and language instructions,
    but their understanding of physical dynamics remains limited. Video world models can capture scene dynamics,
    yet generating future videos introduces high latency into the control loop. We introduce PDRVLA, whose lightweight
    Physical Dynamics Module extracts physical tokens from vision--language features to condition action generation
    without online video generation. The module learns through direct prediction of future RGB, depth, and optical-flow
    features, with auxiliary supervision through a frozen pretrained video world model. Training relies entirely
    on publicly available data, expanded through human-to-robot synthesis, subtask annotation, and embodied chain-of-thought
    (ECoT) annotation. Across four simulation benchmarks, PDRVLA achieves success rates of 99.3% on LIBERO, 89.9%
    on LIBERO-Plus, 93.6% on RoboTwin~2.0, and 81.5% on SimplerEnv. Ablations show improved future prediction with
    world-model supervision and evaluate how subtask conditioning, future object-pose supervision, and ECoT training
    affect action success.
