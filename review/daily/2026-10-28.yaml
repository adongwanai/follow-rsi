- id: arxiv:2610.33861
  arxiv_id: '2610.33861'
  title: 'ReGE: Stronger Agents through Experience Synthesis'
  version: 1
  source_hash: 49ea27c0afc9fc1501dd350487c6f1a554e92798e7fc43ad880abd7d66c16879
  abstract: Repeated attempts at interactive tasks uncover facts, useful operations, and failures that can inform
    subsequent execution. We introduce ReGE, a framework for turning this recorded experience into guidance for
    a fresh attempt. Its main implementation, ReGE-Syn, uses a single coach call to jointly synthesize bounded execution
    records and available artifacts into self-contained guidance, connecting task-specific findings with proposed
    actions and relevant pitfalls. A student starts from the task's initial environment state and adapts this guidance
    to current observations. Source generation, synthesis, and student execution use the same base model, without
    parameter updates or a stronger teacher. Across four benchmarks, ReGE improves accuracy by an average of 9.9
    percentage points for GPT and 8.8 percentage points for Claude compared with unguided execution. On matched
    BrowseComp-Plus subsets, ReGE-Syn reduces guidance-construction tokens by 98.2\% on GPT and 95.5\% on Claude
    relative to adapted AggAgent, with observed success. Combined construction and execution tokens decrease by
    15.7\% and 35.4\%, respectively, counting input plus output and excluding source generation. BrowseComp-Plus
    ablations further associate access to process information with fewer student steps and show that joint synthesis
    produces substantially shorter guidance than Direct history or Independent summaries, with observed success.
    These results demonstrate how agents can use their own recorded experience to improve subsequent task completion,
    and suggest a low-cost way to consolidate the execution records of parallel agent systems such as agent swarms.
