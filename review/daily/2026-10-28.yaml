- id: arxiv:2610.37624
  title: 'Rare, Relevant, and Still Wrong: How Memory Fails LLM Group Decisions'
  announced: '2026-10-27'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.37624'
  version: 1
  source_hash: 1788c611b2ba102d11a794d1fae2a2e040dab27f0f6a83dd5759ab97689fddc8
  published: '2026-10-27T17:49:39Z'
  updated: '2026-10-27T17:49:39Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'When an LLM group''s discussion is compressed into a short memory for a final decision maker, what
    should the memory keep? Two natural heuristics keep the rarest claims or the claims relevant to the decision
    criteria. On hidden-profile tasks both look attractive, because how widely a fact is held is confounded with
    whether it helps. We introduce CrossProfile, a diagnostic benchmark of 60 templates with automatically verified
    answer keys, in which the ownership of supporting, decoy, and irrelevant facts is crossed while their text is
    held fixed (480 tasks). Across Qwen2.5-7B, Llama-3.1-8B, and two DeepSeek models, both heuristics fail in predictable
    places. Selecting by relevance readmits decoys, because decoys are on topic: even a perfect relevance filter
    loses 23 to 31 points to rarest-first selection in the classic hidden-profile configuration. Rarest-first selection
    is no better than random selection on average and wins only where the rare facts happen to be the useful ones.
    In both cases accuracy follows the balance of evidence the memory keeps, not the policy that kept it. The decision
    model adds a third failure, a form of social proof: it gives extra weight to facts attributed to many agents.
    Removing the attribution tags, or reassigning them at random with line order fixed, raises accuracy in the classic
    configuration by 13 to 24 points. In natural discussions the evidence is lost before any memory acts: the complete
    transcript yields lower accuracy than no notes at all.'
