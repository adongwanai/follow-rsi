  arxiv_id: '2610.37386'
  version: 1
  source_hash: 2268da2b7faaea7cd86fe90d934d4cbb8c106948498b27b765e2424f4e4fda58
  published: '2026-10-27T15:11:35Z'
  updated: '2026-10-27T15:11:35Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Mixture-of-Experts (MoE) models are bottlenecked by loading routed-expert weights from memory during
    interactive decoding at small batch sizes. Because most intermediate channels in a routed expert contribute
    little to any single token, channel selectors predict which channels matter and read only their weights, typically
    keeping channels above a threshold calibrated on offline data. We show that channel selection needs no calibration
    data. First, a calibrated threshold does not fix how much a selector reads, because the number of channels passing
    it varies across inputs; Prox with thresholds calibrated for an 18% read budget actually reads only 12.9% on
    average across our benchmarks. Second, top-k keeps each token''s k highest-scoring channels and needs no calibration
    data. At the calibrated budget, a selector''s top-k version matches or beats its threshold version on the same
    score in 40 of 43 comparisons at 13% and 18% budgets, including all 23 on generation tasks. The top-k versions
    also avoid the repetition-loop collapse that calibrated thresholds cause on Gemma 4. Calibrating a threshold
    thus provides neither of the two things selectors use it for: a known read budget and a consistent accuracy
    gain at that budget. We furthermore introduce a reader built entirely from the model''s weights, which screens
    channels with a ternary sketch and recovers the skipped ones with a low-rank map. Across three post-trained
    MoE models, our reader retains 98.1% of full-model accuracy at 17.8% of routed-expert reads, with Triton kernels
    running MoE blocks 1.60 to 1.90x faster than optimized vLLM at batch one and up to 2.69x at larger batches on
    the same three models.'
