- id: arxiv:2610.37175
  title: 'MLE-World: Predicting Machine Learning Experiment Outcomes with a Learned World Model'
  announced: '2026-10-27'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.37175'
  version: 1
  source_hash: 659875ad991b7c7dc744e2bbf402d6eaa8719b74c9f5d4a38a866240a90d52a3
  published: '2026-10-27T13:01:29Z'
  updated: '2026-10-27T13:01:29Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'AI research agents can propose, execute, and improve programs that solve machine learning tasks. However,
    executing each candidate program requires training and evaluating ML models, limiting how many candidates an
    agent can explore at each step. We introduce MLE-World, a world model finetuned from Qwen3.5-4B that predicts
    a program''s terminal output (error traces, training logs, and validation scores) from its code and data description
    without executing it, together with a confidence score estimating the prediction''s correctness. Because a prediction
    costs one inference call rather than a training run, MLE-World makes test time scaling (TTS) affordable for
    these agents. We build five TTS policies, guided by MLE-World, that compare several candidates per step by their
    predicted outputs: Sequential revision, Best-of-N, Pairwise judging, Fusion, and a UCB style rule that also
    adds an exploration bonus from this confidence score. Since predictions can be wrong, we run a candidate for
    real only when its confidence score is low. On 17 MLE-bench Lite tasks, MLE-World matches the real terminal
    output on 77.9% of held out programs, versus 41.1% for much larger prompted models. MLE-World guided TTS achieves
    up to 22.1% higher observed mean performance than the agent without a world model, with less real execution.
    Project webpage: https://mle-world.github.io/.'
