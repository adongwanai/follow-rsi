- id: arxiv:2610.37037
  title: 'Zooming without Zooming v2: From Seeing Details to Connecting Evidence for Generalizable Multimodal Perception'
  announced: '2026-10-27'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.37037'
  version: 1
  source_hash: 8fa583ccbd2ba917eb0c40ae1cd661942ac4093094b285c5db2f2b53d8d6cf03
  published: '2026-10-27T11:11:53Z'
  updated: '2026-10-27T11:11:53Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Multimodal perception forms the foundation of multimodal intelligence. In particular, spatial perception
    and multimodal long-context understanding are two pivotal tasks that underpin embodied AI and multimodal agents.
    However, synthesizing targeted, high-quality training data for these tasks remains difficult and costly. Our
    key insight is that these tasks share an underlying capability, which we call connecting evidence: identifying
    relevant visual facts, binding them to the correct entities, recovering their relations, and composing them
    into an answer. Crucially, targeted training data are far easier to synthesize for this capability than for
    these tasks themselves. To strengthen this capability, we propose EvidenceConnect, an easy-to-implement data
    synthesis framework that uses zoomed views of related regions within a single image to generate questions requiring
    comparison, aggregation, or chaining of visual evidence. To ensure quality, a reference answer is retained only
    when independent VLMs agree on it, and region-ablation tests discard questions whose answer survives the removal
    of selected regions. We then train base VLMs on the resulting data with RLVR, obtaining Zooming without Zooming
    v2 (ZwZ2). Although the synthesized data are not tailored to any downstream benchmark, ZwZ2 improves fine-grained
    and spatial perception, with further gains on embodied spatial reasoning, multimodal long-context understanding,
    multimodal agent tasks, and general visual reasoning. These results establish EvidenceConnect as an effective
    framework for supervising evidence connection and suggest that strengthening this shared capability leads to
    more generalizable multimodal perception.'
