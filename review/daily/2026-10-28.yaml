- id: arxiv:2610.26030
  title: Truncate or Not? A Scaling Study of Looped Transformers with Truncated Backpropagation
  announced: '2026-10-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.26030'
  version: 2
  source_hash: 6e003140cc8a67f9aa511f1a64395bec6468433fc44c4a47c979619df6ca813e
  published: '2026-10-19T08:52:29Z'
  updated: '2026-10-20T17:28:49Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: 'Looped transformers reuse a shared block of layers to increase computational depth without increasing
    the number of trainable parameters. They are trained with backpropagation through time (BPTT). To save training
    compute, BPTT is often truncated to the last few loops, but truncation yields biased gradients that may weaken
    the benefit of looping. In this work, we study the value of truncation in looped transformer training in a systematic
    way: we jointly vary model size, training tokens, and forward and backward loop counts across nearly 600 training
    runs and fit a unified scaling law that captures the effects of looping and truncation through effective parameters.
    Despite the training-compute savings of truncation, our fitted law favors full BPTT when forward and backward
    loop counts are jointly optimized. In matched-compute runs, full BPTT through fewer loops consistently outperforms
    truncated settings of the same compute. The law further shows that at fixed model size, the compute-optimal
    loop count and training-token budget both grow with compute. When model size is also free, the law identifies
    two fully trained loops as the best looped setting. Experimentally, this setting achieves lower validation loss
    than the compute-optimal non-looped model with about 27% fewer non-embedding parameters and only 8% more training
    compute.'
