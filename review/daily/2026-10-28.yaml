- id: arxiv:2610.32046
  title: Can Test-Time Memory Evolution Outperform Test-Time Training for Scientific Discovery?
  announced: '2026-10-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: experience_world_model
  decision: reject
  arxiv_id: '2610.32046'
  version: 1
  source_hash: ee7ba8032b1f164a76597f11e7fa03a5d20c4c9261c881420e905ed268156e51
  published: '2026-10-23T01:37:19Z'
  updated: '2026-10-23T01:37:19Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: Recent \emph{test-time training} (TTT) frameworks have enabled open-weight large language models (LLMs)
    to outperform inference-only frameworks powered by frontier models on scientific discovery tasks. However, TTT
    introduces additional computational cost for online weight updates during the discovery process, making computational
    efficiency an important consideration when scaling to larger models. This motivates us to explore an efficient
    \emph{test-time adaptation} method for scientific discovery. We introduce \emph{Test-Time Memory Evolution}
    (TTME), a plug-and-play test-time adaptation method, as an alternative to TTT. TTME continually updates the
    external memory by distilling the experience to guide subsequent discovery without updating model weights. To
    have a clean comparison, we evaluate TTME and TTT under the same discovery framework, replacing only the test-time
    adaptation method. Our evaluation shows that TTME outperforms TTT on all five mathematical tasks, while reducing
    computational cost by $82.8$-$84.6\%$ in FLOPs and $47.7$-$58.4\%$ in runtime. These results establish TTME
    as an effective and computationally efficient alternative to TTT in the evaluated discovery settings.
