- id: arxiv:2610.36466
  title: 'Nemotron-Labs-Diffusion-Uni: Elastic Self-Refining Unified Diffusion LLM with Cross-Paradigm On-Policy
    Distillation'
  announced: '2026-10-27'
  window_status: in_window
