  updated: '2026-10-26T03:44:10Z'
  hf_daily_dates:
  - '2026-10-28'
  abstract: Despite rapid advances in large language models (LLMs), their deployment in the sports and health domain
    remains high-risk due to the absence of domain-specific evaluation benchmarks. Existing general-purpose benchmarks
    (e.g., MMLU and HELM) primarily assess broad knowledge and reasoning capabilities, but fail to capture critical
    domain requirements such as exercise safety, physiological appropriateness, personalization, and actionable
    coaching quality. This gap is particularly concerning in fitness and health applications, where incorrect or
    unsafe recommendations can lead to physical harm. To address this limitation, we introduce MoveBench, the first
    comprehensive benchmarking framework specifically designed for evaluating LLMs in sports and health coaching.
    The proposed benchmark integrates heterogeneous task formats, including multiple-choice questions (MCQs) and
    open-ended question answering (OpenQA), grounded in real-world user scenarios and paired with structured rubrics
    emphasizing safety compliance, scientific validity, and training logic. Through large-scale evaluation of 15
    diverse LLMs on 809 questions with 5,012 rubric-level criteria, our results reveal substantial performance variability,
    particularly in safety awareness, structured program design, and personalization capability, highlighting a
    critical gap between knowing and doing. Our work establishes a foundational evaluation standard for sports and
    health LLM applications and provides a reproducible framework for advancing safe, reliable, and context-aware
    AI-driven coaching systems. Open resources are available at https://github.com/SatoSakula/MoveBench.
