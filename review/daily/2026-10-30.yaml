- id: arxiv:2610.37695
  title: 'After One-Click Video: The Inflow of Service-Type Content, the Failure of the Recommendation Pool Mechanism,
    and the BoLe System'
  announced: '2026-10-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.37695'
  version: 1
  source_hash: 119af7fc41122bbd9cc09601df179d706b0e6e9658cda399012facf35aa44ab9
  published: '2026-10-24T09:02:54Z'
  updated: '2026-10-24T09:02:54Z'
  hf_daily_dates:
  - '2026-10-30'
  abstract: 'In September 2026, a new large language model was released. Soon after, a new way of making explainer
    videos became very popular: people asked the model to write a program, and the program produced the video. "One-click
    video" content then appeared in large amounts on many platforms. On the surface, this is a rise in creative
    power at the level of the individual. We argue that, at a deeper level, it changes the structure of the content
    industry. This judgment rests on two observations. First, this wave of content is service-type content. People
    watch it to meet a need, not to enjoy the content itself. The other kind is work-type content. AI makes both
    kinds faster to produce. But anyone can come in and make service-type content, while work-type content is limited
    by the number of people who have something to say. So the ratio between the two slowly becomes unbalanced. Second,
    free platforms choose content through layers of trial viewing, and this uses up user attention. The total amount
    of attention is fixed. The unbalanced ratio also dilutes good content. A simplified mathematical model shows
    that, as long as these conditions hold, the recommendation pool mechanism will fail once new content grows past
    a certain multiple. Based on this, we discuss one possible way out. Machines and entry rules judge whether service-type
    content passes the bar. Trusted people judge work-type content. We call this the BoLe system. At the end, we
    briefly imagine how the two kinds of content may develop from here.'
