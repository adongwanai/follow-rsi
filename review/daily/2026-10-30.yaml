- id: arxiv:2610.32253
  title: 'RSIHub: A Composable Framework for Agent-Evolution Methods'
  announced: '2026-10-23'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: harness / evolve_main
  decision: defer
