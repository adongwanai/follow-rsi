- id: arxiv:2610.39633
  title: Intrinsic Distribution Matching
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.39633'
  version: 1
  source_hash: 2d308e9c76e2dba7353d31871ed29a4bc53a366f05f5cc1db1c9469b52efca93
  published: '2026-10-29T08:57:17Z'
  updated: '2026-10-29T08:57:17Z'
  hf_daily_dates:
  - '2026-10-30'
  abstract: One-step and few-step text-to-image generation must accurately render the details specified in the prompt
    despite limited opportunities for refinement. Distribution matching distillation (DMD) uses score differences
    to bring the generated distribution closer to a reference distribution. Following prior work, we estimate this
    difference with internal velocity branches, avoiding a separate fake-score network. We ask whether an explicit
    moment constraint improves this learned score supervision. A decomposition of the reverse-KL field into a Gaussian
    moment component and a non-Gaussian residual identifies statistics that can be constrained explicitly. We introduce
    Intrinsic Distribution Matching (IDM), which retains the full DMD correction and matches feature means and per-coordinate
    standard deviations using the generator's exponential-moving-average (EMA) copy, requiring no external feature
    encoder. Experiments use full-parameter and low-rank adaptation (LoRA) tuning on Z-Image-Turbo 6B and Qwen-Image
    20B. At two network evaluations, IDM reaches 94.25% and 90.20% on Chinese and English LongText-Bench, the highest
    scores among the compared methods at this budget. Controlled ablations show gains from the added moment loss,
    while generator EMA features perform competitively with an external DINOv2 encoder across the five reported
    metrics. Code is available at https://github.com/inclusionAI/IDM.
