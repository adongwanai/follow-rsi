- id: arxiv:2610.06830
  title: 'MemPilot: Orchestrating On-Demand Multimodal Memory Curation for LLM Agents'
  announced: '2026-10-05'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: harness / component
  decision: defer
