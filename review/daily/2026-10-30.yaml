- id: arxiv:2610.36420
  title: 'SO-101 Bench: Accessible Spatial Manipulation'
  announced: '2026-10-27'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.36420'
  version: 1
  source_hash: c5aa12ed00274ae20f1de76f5c3652293f41527f7e28b5c62f0706425e69207b
  published: '2026-10-27T00:02:28Z'
  updated: '2026-10-27T00:02:28Z'
  hf_daily_dates:
  - '2026-10-30'
  abstract: 'Low-cost arms such as the SO-101 have become the most common entry point to robot learning, yet no
    released policy performs spatially constrained, language-conditioned tasks on them out of the box, and existing
    SO-101 benchmarks run only on physical hardware with simple tasks and few held-out objects. We introduce SO-101
    Bench, a simulated benchmark for language-conditioned spatial manipulation built on an Isaac Lab digital twin
    of a real SO-101 setup. It has four tasks scored as five families, 138 objects in seen, unseen-instance and
    unseen-class splits, 916 evaluation episodes with subsets for held-out appearances, rotate-to-fit planning and
    occlusion memory, and 3,629 simulated demonstrations on which every learned policy is fine-tuned under an equal
    compute budget. The twin ranks policies as the real robot does: five policies trained without real data, four
    VLAs and an LLM agent, keep their exact ranking when the same weights run on the physical arm in an unseen environment
    with unseen objects (Spearman rho = 1.00, MMRV = 0.000), although simulation overestimates success. Across nine
    VLAs and world-action models, the best learned policies score near 61%, with spatial placement, unseen object
    classes and rotate-to-fit planning remaining open. An LLM agent that writes code and hands grasping to a learned
    policy scores 83.2%, and an ablation shows that this lead comes from the choice of harness and the choice of
    language model.'
