- id: arxiv:2610.40647
  title: 'Read, Allocate, Route: Role-Coupled Tokenization for Pixel-Space Generative Transformers'
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.40647'
  version: 1
  source_hash: 96dbbdcebaedde9b5308ac784411cef90c479ef96bf44895d823e17a7c58b752
  published: '2026-10-29T17:59:21+00:00'
  updated: '2026-10-29T17:59:21+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: 'Pixel-space generative Transformers typically use one token per image patch, so capturing finer detail
    requires more tokens and makes global attention increasingly expensive. We observe that finer detail does not
    necessarily require more global communication: low-frequency structure benefits from global exchange, while
    high-frequency detail can be modeled locally. Based on this insight, we introduce SpecSlot, a pixel-space rectified-flow
    Transformer that decouples output detail from the length of the global attention sequence. SpecSlot expands
    each spatial anchor into multiple slots, each assigned a disjoint band of DCT coefficients; this separates anchor
    density from spectral subdivision. Only the lowest-frequency slot from each anchor participates in global attention,
    while all slots interact locally. This allows the model to increase spectral detail without enlarging the global
    sequence. A spatial head further adds a local correction to the spectral prediction, while the generative state,
    target, and loss remain in pixel space. On ImageNet-256, SpecSlot achieves a comparable final FID to a FLOPs-matched
    JiT control while converging faster. On ImageNet-512, it improves FID by 2.84 over the control with 3.9% fewer
    FLOPs, and comes within only 0.69 FID of JiT-B/16 at 38.2% lower cost. On text-to-image generation, SpecSlot
    surpasses JiT-B/8 on DPG-Bench by 1.06 at 40.6% lower forward cost.'
