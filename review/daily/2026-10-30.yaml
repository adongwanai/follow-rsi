- id: arxiv:2610.38681
  title: 'Weaken to Strengthen: Weakening-Induced On-Policy Self-Distillation for Large Reasoning Models'
  announced: '2026-10-28'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.38681'
  version: 1
  source_hash: 895dc5ce2c6f5a58195784cf84b3dd185feb862331ddd892cccd5574ae327d51
  published: '2026-10-28T18:55:38+00:00'
  updated: '2026-10-28T18:55:38+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: 'Self-distillation offers a way to improve reasoning models when a suitable external teacher is unavailable.
    However, common approaches rely on privileged information to construct a stronger self-teacher, limiting their
    use when only unlabeled prompts are available. In this paper, we introduce Weakening-Induced On-Policy Self-Distillation
    (WISD), which instead constructs a weaker counterpart of the original model and uses the contrast between the
    two as a training signal without requiring privileged information. We explore two ways to construct the weaker
    model: low-bit quantization and magnitude pruning. We evaluate WISD across diverse architectures and scales
    on mathematical and coding reasoning tasks. Across these benchmarks, quantization and pruning improve average
    accuracy over the original models by 4.0 and 5.5 percentage points, respectively, achieving state-of-the-art
    performance even without privileged information. Notably, pruning raises Qwen3.5-4B''s accuracy from 57.7% to
    70.5% on HMMT 2025 and from 39.1% to 56.7% on LiveCodeBench v6. Quantization raises Qwen3.6-35B-A3B''s accuracy
    from 68.5% to 74.6% and from 61.8% to 69.5% on the same benchmarks, respectively. These results establish WISD
    as a novel and effective self-distillation framework for large reasoning models.'
