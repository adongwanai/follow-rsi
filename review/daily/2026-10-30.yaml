- id: arxiv:2610.38331
  title: Multi-Token Prediction Done Right
  announced: '2026-10-28'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.38331'
  version: 1
  source_hash: af32fd22f515f7ba1a5017e294e1e3f21dd41b459d5fdfb662ecedf4fa8544e5
  published: '2026-10-28T06:31:05+00:00'
  updated: '2026-10-28T06:31:05+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: 'Multi-Token Prediction (MTP) is now a common ingredient in language-model pre-training, as it improves
    downstream performance and enables faster inference through speculative decoding. We identify a flaw in standard
    MTP training, in which a residual component of the MTP gradient interferes with both next-token and multi-token
    learning, increasingly so with scale. Specifically, the MTP cross-entropy gradient can be decomposed exactly
    into a KL self-distillation term that pulls each MTP head toward the model''s own next-token prediction (NTP)
    distribution and improves speculative decoding, and a residual that has a low signal-to-noise ratio and buries
    the useful KL signal. We introduce the KL gradient-recovery trick: when two distributions share a linear output
    head, the gradient of their KL divergence can be recovered exactly by combining their cross-entropy gradients
    through straight-through gradient routing. Unlike minimizing the KL directly, this trick requires no vocabulary-sized
    logit matrices and is compatible with standard fused cross-entropy kernels. This enables Soft Multi-Token Prediction
    (Soft-MTP), a one-line code change to MTP that removes the noisy residual and backpropagates only the KL self-distillation
    signal by reusing the existing NTP and MTP cross-entropy computations. Soft-MTP supports both DeepSeek- and
    Meta-style MTP, adds no parameters, and incurs no measurable overhead. From 167M to 1.2B parameters, Soft-MTP
    improves over standard MTP with lower NTP perplexity, faster speculative decoding and higher zero-shot accuracy
    at every scale, lower MTP perplexity from 689M onward, and stronger math and code reasoning after fine-tuning
    at 1.2B. Soft-MTP also matches, if not exceeds, direct KL divergence minimization on most metrics. Soft-MTP
    is, in effect, a free lunch for MTP optimization. Our code can be found at this https URL .'
