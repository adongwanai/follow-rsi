- id: arxiv:2610.38568
  title: 'A-RSI: Adaptive Task Refresh for Zero-Data Multimodal Self-Improvement'
  announced: '2026-10-28'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
