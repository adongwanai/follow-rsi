- id: arxiv:2610.37161
  title: 'WorkFactory: Turning Professional Intents into Executable Work for Scalable Agent Training'
  announced: '2026-10-27'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.37161'
  version: 1
  source_hash: dbbd1ba96ae967ebd954266a8b9565cd70c88b1b2291efe6b402e1934c1c5f92
  published: '2026-10-27T12:54:16Z'
  updated: '2026-10-27T12:54:16Z'
  hf_daily_dates:
  - '2026-10-30'
  abstract: Scaling supervised training for working agents requires diverse professional tasks that yield reliable
    expert demonstrations. However, missing or inconsistent task information can obstruct teacher execution and
    weaken the resulting supervision. We propose WorkFactory, a scalable framework for constructing coherent and
    executable professional tasks. Starting from professional intents, information-level planning builds an information
    support graph to guide task instantiation, explicitly representing the dependencies and locations of information
    required for the intended outputs. Probe executions then identify support failures and guide repairs while preserving
    the intended work. We construct 112,686 tasks spanning 612 occupations and use the collected teacher trajectories
    to fine-tune Qwen models at 4B, 27B, and 35B-A3B scales, yielding the WorkPilot family. All three models improve
    over their respective base models across four professional-work benchmarks, with WorkPilot-35B-A3B improving
    from 879 to 1565 Elo on GDPval-AA v2.1. Scaling analyses reveal model-dependent diminishing returns, with execution
    length first increasing and then decreasing. Controlled component analyses show that planning and repair reduce
    probe-diagnosed task environment defects and improve downstream performance. The data and models are available
    at https://github.com/IQuestLab/WorkFactory.
