- id: arxiv:2609.05881
  title: 'Broken on Arrival: Non-Functional Quantized LLM Artifacts in Public Model Registries and How to Catch
    Them'
  announced: '2026-09-05'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2609.05881'
  version: 3
  source_hash: c320da0cc8cdddecf876fa4fa2693f6205fb670946f5619bb7d24940aca77aa7
  published: '2026-09-05T05:05:51+00:00'
  updated: '2026-10-29T03:12:13+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: Developers download quantized large language models (LLMs) from public registries to run them locally.
    None of the registries we examined documented functional testing of their files. We tested all 305 eligible
    code-capable GGUF tags (the this http URL format) across 15 model lines in the official Ollama library, plus
    22 popular Hugging Face community files. A 15-task code screen identified suspects, which we retested on all
    164 HumanEval+ tasks. Seven official tags (2.3%) solved at most six of them. All were low-bit quantizations
    of models with at most four billion parameters. We rebuilt five suspect files from the original weights. All
    five registry files matched our uncalibrated rebuilds tensor for tensor, so none was corrupted. Exact reproducibility
    did not imply function. With the weights, toolchain and tensor mix held fixed, adding an importance matrix raised
    Qwen2.5-Coder-3B scores at three quantization levels from zero to 76-113 of 164 tasks. The same uncalibrated
    recipe left the smaller Qwen2.5-Coder-1.5B functional, showing that the recipe alone does not predict failure.
    None of 66 sampled tags that passed the screen was non-functional. We release the audit data and the quantcheck
    tool and recommend screening low-bit tags before publication, then calibrating or withholding failures.
