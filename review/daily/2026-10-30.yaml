- id: arxiv:2610.39423
  title: 'FDSML: Formula-Driven Supervised Metric Learning with Parameter-Aware Triplet Loss'
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.39423'
  version: 1
  source_hash: 72977a311ffa7105e97dd49f7903f251934e0534ad24245f6ae13321f051a38e
  published: '2026-10-29T06:02:45+00:00'
  updated: '2026-10-29T06:02:45+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: Formula-Driven Supervised Learning (FDSL) enables vision pre-training without real images, but existing
    methods cast pre-training as classification on discretized labels, discarding continuity in the generative process.
    We propose Formula-Driven Supervised Metric Learning (FDSML), which derives relational supervision from image-generation
    parameters beyond discrete class labels. FDSML combines FineFractalDB, our refined fractal dataset with higher
    intra-class variation and more stable structures, with a Parameter-Aware Triplet (PA-Triplet) Loss that assigns
    positives and negatives according to distances in the underlying Iterated Function System parameter space. This
    objective trains embeddings to respect parameter-derived relative similarity orderings. Experiments show that
    FDSML improves transferability to image retrieval while remaining competitive on downstream classification and
    improving robustness under several corruption settings. On ResNet-50, Recall@1 improves from 65.6% to 74.0%
    on Stanford Online Products and from 56.2% to 78.4% on Stanford Cars over FDSL pre-training. These results suggest
    that parameter-derived relational supervision provides a stronger synthetic pre-training signal than label-based
    classification for transfer beyond recognition.
