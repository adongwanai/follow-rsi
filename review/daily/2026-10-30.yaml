- id: arxiv:2610.36671
  title: 'Look Only When Needed: Certificate-Guided Visual Routing for Efficient Diffusion VLMs'
  announced: '2026-10-27'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.36671'
  version: 1
  source_hash: 0e8b67f347025987407f57f038a75bbc95ab7eb94245a189badd23adccf2cf58
  published: '2026-10-27T05:43:30+00:00'
  updated: '2026-10-27T05:43:30+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: Diffusion vision-language models (DVLMs) process their entire input at every denoising step. Since visual
    tokens make up 89-97% of this input on the benchmarks we study, most of the decoding computation is spent repeatedly
    processing the same image. Visual token pruning methods partially relieve this burden by removing part of the
    visual tokens, but they lose the removed information and still process the remaining image at every step. To
    measure how often the image is actually needed, we compare LLaDA-V's predictions with and without the image
    at every decoding step and find that removing the image changes a token being unmasked at only 22.8% of steps
    on average and at as few as 7.9%. We therefore propose LOWN, a decoding method that decides at every step whether
    to process the image and how many tokens to unmask. LOWN predicts the masked tokens without the image and processes
    the image only when this prediction disagrees with the last image-conditioned prediction. Agreement certifies
    the earlier prediction for reuse, and the number of certified tokens sets how many are unmasked in that step.
    We further observe that the need for the image differs across benchmarks, so LOWN's adaptive decision is needed
    rather than a fixed schedule. Without training or a tuned threshold, LOWN retains 99.6% of LLaDA-V's score on
    ten benchmarks at 35.3% of the decoding FLOPs on average. LOWN also generalizes across LLaDA-based DVLMs, composes
    orthogonally with visual token pruning, and runs under key-value caching for further efficiency gains. Code
    and project page are available at this https URL
