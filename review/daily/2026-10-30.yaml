- id: arxiv:2610.39301
  title: 'Youtu-Parsing-Omni: One Encoder, One Schema, All Modalities'
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.39301'
  version: 1
  source_hash: b8ffd25dc373edcce4be2874bd61f978cb3cb63faaa862e6397cf38e010ee23b
  published: '2026-10-29T03:49:25+00:00'
  updated: '2026-10-29T03:49:25+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: We present Youtu-Parsing-Omni, an omni-modal parser that converts documents, images, audio, and video
    into structured records grounded in space and time, providing a perception layer for agents that read, locate,
    and cite evidence across modalities. Its design rests on one encoder for every modality and one schema for every
    task. Youtu-Omni-Encoder, initialized from a pre-trained language model to strengthen text reading, encodes
    all modalities with shared weights in a unified space-time coordinate system, and a few fusion layers let video
    frames attend to concurrent audio, bringing cross-modal fusion and temporal alignment into perception itself.
    OmniSchema unifies the outputs of all ten parsing tasks, allowing a single self-evolving post-training procedure,
    OmniSchema-Aware On-Policy Distillation (OSAD), to provide a shared token-role-based objective across tasks.
    In each round, the model is trained on its own rollouts against token-level targets from a reference-conditioned
    copy of itself, which is then refreshed with the trained weights, so that the parser and its supervision co-evolve.
    With a single 5 B-parameter checkpoint, Youtu-Parsing-Omni achieves state-of-the-art performance on OmniDocBench
    v1.6 (96.96 Overall) and leads all open-weight models on OmniParsingBench (75.08 Avg.), with its advantage concentrated
    on audio and video. It also achieves the best overall chart-parsing score (95.02) and the highest exact chemical-fingerprint
    agreement among compared systems, and matches a dedicated optical-music model in character-level transcription
    of typeset sheet music while staying far ahead of general-purpose systems. Code and model weights are publicly
    available.
