  arxiv_id: '2610.25276'
  version: 1
  source_hash: 110b6728d2360da3e44661919a2f2bb7666373dd3fdd371ee83057b2ff919e08
  published: '2026-10-18T13:47:01+00:00'
  updated: '2026-10-18T13:47:01+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: Synthesizing a monocular video from a new camera trajectory requires preserving the observed scene geometry
    and motion while completing regions that become newly visible. Feed-forward 4D reconstructors recover the structure
    of the observed scene, whereas video diffusion models provide a generative prior for completing unseen content.
    We introduce Holo4D, a video reshooting framework that uses reconstructed 3D trajectories as a holistic source-view
    4D scaffold. We project these trajectories into the requested views and encode their geometry and source appearance
    to guide a pretrained video diffusion model. Together with the source video and target cameras, the scaffold
    grounds generation in reconstructed observations while leaving unsupported regions to the generative prior.
    Experiments demonstrate the value of trajectory-based conditioning for camera control and novel-view synthesis.
    The framework accommodates different 4D reconstructors without retraining the video generator, allowing it to
    benefit from future advances in source reconstruction. More details can be found in our project page.
