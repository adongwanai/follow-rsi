- id: arxiv:2610.40362
  title: 'Your LR Schedule May Not Be Principled: Effective Learning Rate Scheduling in Weight-Normalized Training'
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.40362'
  version: 1
  source_hash: 68c20f1c3ec4d3662d2a16c439dfb956f3d4bfc92a2fc652e989f71c54bfcb3a
  published: '2026-10-29T16:15:08Z'
  updated: '2026-10-29T16:15:08Z'
  hf_daily_dates:
  - '2026-10-30'
  abstract: Weight-normalized (WN) training is emerging as a compelling alternative to conventional weight decay
    (WD), with recent studies reporting substantial pretraining loss gains. We show that these gains are driven
    primarily by the induced effective learning rate (ELR) trajectory rather than by normalization alone. Matching
    ELR trajectories largely collapses the training loss dynamics of WN and WD. Schedule design should therefore
    target ELR rather than the nominal learning rate (LR) alone. Building on this principle, we propose AIR (Affine
    Inverse-square-Root decay), which combines a theoretically derived $1/\sqrt{t}$ decay with an affine adjustment
    to satisfy prescribed peak and terminal LRs over a finite training horizon. We further identify late-stage ELR
    scheduling as a key source of its gains, because a shared late schedule attenuates the effect of earlier LR
