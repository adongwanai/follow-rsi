- id: arxiv:2610.38425
  title: 'IntReal: A Real-World Dataset and Benchmark for Multimodal Interleaved Generation'
  announced: '2026-10-28'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.38425'
  version: 1
  source_hash: 7fe8e16d7ca33469d36140099d952cf21e465b2976611fcc1634e23fbea614b9
