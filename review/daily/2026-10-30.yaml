- id: arxiv:2610.35138
  title: 'Co-Design Bench: Multimodal Collaborative Coding Evaluation for Agentic Models'
  announced: '2026-10-26'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
