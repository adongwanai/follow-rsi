- id: arxiv:2610.40453
  title: 'PhysInsert: Physically Plausible Object Insertion with Geometric Priors and Bidirectional Object-Scene
    Interactions'
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.40453'
  version: 1
  source_hash: 0af44161961775d566355c76a471b0ad0d400a9b6f89562246d7754dce490f96
  published: '2026-10-29T17:01:13+00:00'
  updated: '2026-10-29T17:01:13+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: We present PhysInsert, a framework for physically plausible reference-based object insertion that jointly
    adapts objects and their surrounding scenes. Existing methods often rely on masked inputs, generation-based
    pairs, or training pairs with limited viewpoint variation, leaving pose and illumination adaptation and bidirectional
    object-scene interactions insufficiently constrained. We construct the Insert World dataset with strictly aligned
    Blender-rendered counterfactual pairs and object references across viewpoints and lighting conditions. Building
    on these data, Geometry-Guided Adaptation couples a VGGT geometry stream with image and text streams under target-scene
    feature supervision to guide spatially consistent insertion. Complementary 2D Object-Scene Spatial Supervision
    jointly supervises object occupancy and environmental changes while grounding spatial instructions in object
    regions through image-text attention. We introduce PhysInsert-Bench with dedicated cross-environment and cross-view
    cases requiring illumination and pose adaptation beyond appearance copying. Experiments on PhysInsert-Bench
    and DreamBooth demonstrate improved image fidelity; a user study further shows more accurate placement and improved
    lighting integration, perspective, and pose plausibility.
