- id: arxiv:2610.40614
  title: 'L3G-World: Real-Time Infinite World Generation with Latent 3D Gaussian Memory'
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.40614'
  version: 1
