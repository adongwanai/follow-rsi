- id: arxiv:2610.25276
  title: 'Holo4D: Holistic 4D Reconstruction as Geometric Control for Video Diffusion'
  announced: '2026-10-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
