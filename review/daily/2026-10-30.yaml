- id: arxiv:2610.14465
  title: Co-adaptive Rule Routing and Constraining for Structured Knowledge Retrieval
  announced: '2026-10-17'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: harness / coevolution
  decision: defer
  arxiv_id: '2610.14465'
  version: 1
  source_hash: 49c032ba75008c0a73702e0e2428ee7c5a3705d627c9c53ae7e28e8d740bbd1a
  published: '2026-10-17T00:00:00.000Z'
  updated: '2026-10-17T00:00:00.000Z'
  hf_daily_dates:
  - '2026-10-26'
  abstract: Structured knowledge retrieval acquires task-relevant evidence from structured knowledge sources for
    downstream tasks. Existing methods rely on unconstrained retrieval or predefined query-rule supervision, such
    as author-paper rules for scientific discovery and anatomy-drug rules for precision medicine. Such supervision
    is rarely available in practice. We propose Co-Adaptive Rule Routing and Constraining Retrieval (CoRE), which
    jointly learns which reasoning rule to assign to each query and how to retrieve evidence under that rule, without
    predefined query-rule pairs. A routing agent selects a rule, and its corresponding retriever traverses the knowledge
    base and ranks evidence that satisfies the rule's constraints. Because routing and retrieval are interdependent,
    CoRE alternates between reinforcement learning for the routing policy and contrastive learning for the rule-constrained
    retriever. The selected rules provide supervision for retriever training, while retrieval performance rewards
    the routing policy. This closed-loop process enables both components to co-adapt without explicit query-rule
    supervision. Experiments on STaRK-QA datasets across scientific discovery, biomedical reasoning, and e-commerce
    knowledge management demonstrate CoRE's effectiveness. Ablations show the benefit of co-adapting the router
    and retriever. Generation-based routing transfers across datasets and benefits from multi-domain pretraining
    followed by target-specific fine-tuning. Analysis of rule usage across queries also informs automatic rule refinement
    and discovery.
