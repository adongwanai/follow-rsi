- id: arxiv:2610.40564
  title: Training Foundation Models with a Single Algorithm
  announced: '2026-10-29'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.40564'
  version: 1
  source_hash: 03a2ef97b947c8629a270b5df5853d1b1ce13685abb31ccfd634b59de6c3bb4e
  published: '2026-10-29T17:42:05+00:00'
  updated: '2026-10-29T17:42:05+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: 'Foundation models are typically trained in stages: pretraining, midtraining, supervised fine-tuning
    (SFT), and reinforcement learning (RL), with changes in both data and learning algorithms. We show that this
    algorithmic separation is not fundamental. By deriving suitable RL objectives as maximum-likelihood fitting
    to model-generated target distributions, we place all of these stages under a single likelihood-based training
    algorithm, unified training. This perspective turns the foundation-model training lifecycle into a problem of
    choosing which data to train on, in what proportions, and when, with conventional staged training as a special
    case. We instantiate this framework in a unified training system that mixes static data and RL generations within
    a single trainer. Across controlled and real-world experiments, unified training improves the accuracy-compute
    tradeoff and task coverage while preserving broader capabilities, and provides a stronger starting point for
    continual learning. This work lays the groundwork for a unified science of foundation-model training, connecting
    mathematical principles, training infrastructure, and the development of model capabilities.'
