- id: arxiv:2610.31062
  title: 'SCOPE: Compiling Natural-Language Policies into Neurosymbolic Predicate Programs'
  announced: '2026-10-22'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: harness / component
  decision: defer
  arxiv_id: '2610.31062'
