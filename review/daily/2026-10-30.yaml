  arxiv_id: '2610.38568'
  version: 1
  source_hash: 76bebf9f8ee0a1cd85db96c34c58c9991fa1dbbf4e96acd18c87e5180c806dd4
  published: '2026-10-28T10:03:42+00:00'
  updated: '2026-10-28T10:03:42+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: 'Recursive self-improvement requires models not only to acquire useful training experience, but also
    to decide when their current experience has ceased to be useful. Existing methods often focus on what experience
    to generate next, while paying less attention to when fresh experience should be introduced. Many also construct
    training targets through self-consistency or majority voting, making supervision depend on the model''s own
    uncertain predictions. We address these two questions separately: training dynamics determine when to acquire
    new experience, while the answers to new tasks remain independently checkable. A-RSI monitors reward variation
    and accuracy in training logs to refresh a task pool when its learning signal declines, without consulting validation
    or test scores. A static library of model-authored programs produces multimodal questions and derives their
    reference answers; we specify the task-generation contract, automatically verify chosen properties of the reward
    and refresh rules, and separately audit the generated answers. The training loop uses no external training examples
    or human-written answer labels. On the primary eleven-benchmark suite, A-RSI raises the performance average
    from 57.77 to 61.05 with 800 fresh tasks.'
