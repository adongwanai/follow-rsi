- id: arxiv:2610.32411
  title: A Broader Look into MLLM's Retrieval Heads
  announced: '2026-10-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.32411'
  version: 1
  source_hash: 60f3949e147d90b99936ceb9136ba0c12000fdfa349e4d80d5d58f578da00225
  published: '2026-10-23T09:37:28Z'
  updated: '2026-10-23T09:37:28Z'
  hf_daily_dates:
  - '2026-10-30'
  abstract: Locating relevant evidence in long inputs is a core capability of Multimodal Large Language Models.
    Prior studies attribute this capability to retrieval heads, a sparse set of attention heads that transfer information
    from the context to the output. However, these analyses are confined to a limited set of modalities and the
    corresponding models. Moreover, how retrieval heads can be leveraged to enhance the model calls for further
    exploration. In this paper, we ask whether this mechanism expands together with the input modalities of the
    model. Taking audio-visual input as a newly added modality, we construct paired inputs in which the same answer
    is either spoken or shown on screen. With the evidence content fixed, retrieval heads remain sparse in the new
    modality and are shared to a large extent across modalities. Across 18 language, vision-language, and omni-modal
    checkpoints, omni-modal models largely preserve the retrieval heads of their backbones. Ablating these heads
    eliminates nearly all audio-visual retrieval. The heads shared across modalities make up fewer than 2\% of all
    heads, yet ablating them also degrades document understanding, spatial perception, and visual mathematics. Building
    on these findings, we turn retrieval heads into a target of optimization by training their attention with a
    ranking objective. This raises the page Recall@1 of Qwen3-VL-8B on MMDocIR by 6.03 points and improves document
    retrieval across three model families. Functional attention heads can thus serve both as a lens on multimodal
    models and as a target for improving them.
