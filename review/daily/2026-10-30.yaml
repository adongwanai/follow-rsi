  updated: '2026-10-28T05:24:11+00:00'
  hf_daily_dates:
  - '2026-10-30'
  abstract: Quarterly earnings forecasting requires an agent to connect financial evidence to the income-statement
    line items that produce a company's reported earnings. We introduce EPSBench, a benchmark for studying this
    ability across 149 firm-quarters from 86 US companies. Agents read a fixed collection of filings, earnings-call
    transcripts, and news, then estimate company-specific income-statement drivers with cited evidence. A shared
    accounting calculator converts these estimates into GAAP diluted earnings per share (EPS), providing a common
    basis for comparing forecast assumptions. We evaluate six models under a common harness, assessing point forecast
    error relative to date-matched analyst consensus and checking whether their prediction intervals achieve the
    stated coverage. Three models show no detectable paired difference in point forecast error from consensus, and
    three have higher error. Across all six models, nominal 80% intervals contain reported EPS in only 37--70% of
    runs that return an interval, and most misses fall above the upper bound because the forecasts run low. The
    driver records trace most of the error gap between models to operating-income estimates.
