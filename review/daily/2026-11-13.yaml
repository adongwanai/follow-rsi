- id: arxiv:2609.38288
  title: 'AREX-2: Advancing Self-Improving Agents through Long-Horizon Reflective Tasks'
  announced: '2026-09-29'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: ''
