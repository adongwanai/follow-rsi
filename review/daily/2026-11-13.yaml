- id: arxiv:2611.09798
  title: Test-Time Compute Scales Better with Parallel Agent Teams
  announced: '2026-11-06'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.09798'
  version: 1
  source_hash: a880867c793270746bd8e8be287b4ed8e44f9f4cbeb27065beb3a84f8b28cf3b
  published: '2026-11-06T17:53:07Z'
  updated: '2026-11-06T17:53:07Z'
  hf_daily_dates: []
  abstract: Test-time scaling improves the performance of a fixed model by spending more computation at inference.
    There are two common ways to spend it on agents when a verifier can score every attempt. Best-of-N sampling
    runs many independent agents and keeps the best result but saturates quickly. One large team of collaborating
    agents can score higher but stops improving as it grows. Can we get the best of both? Our method, parallel agent
    teams, does so by sampling many small teams in parallel and keeping the best team's result. We test it on 12
    long-horizon tasks from GPU kernels and formal proofs to exploit development. With a 27B model and a budget
    of 100 agents, parallel teams of ten beat parallel agents on 10 of 12 tasks and beat one team of 100 on all
    four tasks where we ran such large teams. At equal dollar cost the same parallel teams beat a frontier model
    on half the tasks. A simple statistical model shows that individual agents lose because their many samples have
    a low mean and that one large team loses because a single sample gets no gain from variance. Sampling many small
    teams in parallel balances a high mean with the gain from variance. Parallel agent teams thus offer a more effective
    way to scale test-time compute.
