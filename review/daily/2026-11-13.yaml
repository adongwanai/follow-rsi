- id: arxiv:2610.20927
  title: 'Prune the Summary, Not the History: Source-Judged Compaction for Long-Horizon Agents'
  announced: '2026-10-14'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.20927'
  version: 1
  source_hash: 5a44f1af5cd23c7971c453ca1e6736aad6ab274537a6451dbbd1d02c35b8e15a
  published: '2026-10-14'
  updated: '2026-10-14'
  hf_daily_dates: []
  abstract: 'Long-horizon LLM agents rely on context compaction: when the interaction history outgrows the context
    window, a compressor replaces it with a natural-language summary. We show that these summaries contain more
    than a record of what happened. Compaction prompts ask for decisions and next steps, so each summary mixes facts
    established by the environment with reasoning written by the compressor, and the agent cannot tell the two apart
    afterwards. In an analysis of a widely used structured compressor, 83% of failed runs trace back to an action
    that carries out a specific summary entry, most of which no environment output supports. We propose Source-Judged
    Compaction (SJC), a training-free post-processing step that scores each summary entry for whether it has a source
    in the environment outputs or the previous summary, and removes the entries that do not. It changes neither
    the agent nor the compressor and adds one inexpensive judge request per compaction. The judge is Jev, a non-generative
    decision model that answers the source question with a calibrated probability instead of text. On AppWorld and
    OfficeBench with two agent models, SJC improves cross-run reliability over the underlying compressor by 2.1%-8.9%
    without increasing the agent''s token usage.'
