- id: arxiv:2610.10590
  title: 'Agent-Controlled Forgetting for Tool-Using Agents: Reversible Context Curation in Practice'
  announced: '2026-10-06'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.10590'
  version: 1
  source_hash: 05b23288c604d6d60b06e2f555f241e83e310b8bb882963e0f4245e9645cb69c
  published: '2026-10-06'
  updated: '2026-10-06'
  hf_daily_dates: []
  abstract: 'Tool-using agents repeatedly carry observations whose useful content can be much smaller than their
    original payload. We study agent-controlled forgetting: the acting model selects previously observed tool results,
    replaces each with a short note at its original position, and retains the exact original in a recoverable archive.
    A Python harness exposes batch archival and explicit recovery without task-specific model training, while protecting
    user instructions and assistant messages from these operations. In an exploratory OpenTelemetry debugging case
    followed by an unrelated implementation task, the method ended with 231,951 provider-reported prompt tokens
    versus 912,492 under retained history, used 50% fewer cumulative input tokens, and had an estimated API cost
    of USD 1.28-1.44 versus approximately USD 4.38. Both arms passed the two-case primary behavioral oracle; neither
    fully satisfied the follow-up evaluation. The method made more requests and took 17% longer. A contrasting application-development
    pair produced no context or cost saving, and an earlier continuation exhibited lower manually assessed quality
    despite reduced context. These observations demonstrate substantial resource savings in noisy tool-use trajectories
    and identify workload dependence as a central consideration for reversible context management.'
