- id: s2:bba9c640d41965307952f54dc92797a233374430
  title: 'UniCommerce-1.5: A Compact Unified E-Commerce LLM With Structured Prompts and CoT-Guided Teacher Annotation'
  announced: ''
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: null
  version: 0
  source_hash: 4e86c48f3a45de0323dce3851f46f8bd496fc54f3aa7564e75ad8f7f6ed08328
  published: ''
  updated: ''
  hf_daily_dates: []
  abstract: 'E-commerce LLMs are increasingly important for product understanding, recommendation, search matching,
    substitute identification, and product question answering. However, deploying these capabilities in one system
    remains difficult because e-commerce tasks have heterogeneous formats, noisy and long-tailed product text, structured
    output requirements, tight inference budgets, and uncertain teacher-supervision quality. Existing studies often
    rely on large closed models or separate task-specific pipelines, which limits low-cost unified deployment and
    leaves unclear how teacher-generated data affects compact student models. We present UniCommerce, a 1.5B-parameter
    unified e-commerce LLM built on Qwen2.5-1.5B. UniCommerce reformulates six ECInstruct tasks—PM, PRP, SR, MPC,
    PSI, and AG—into a schema-aligned generation framework with structured prompts, CoT-guided teacher annotation,
    answer-span masking during SFT, template-guided output formatting, and unified parsing and evaluation. It achieves
    strong task-level performance across the evaluated systems, including 0.9868 F1 on PM, 0.7788 F1 on PSI, 0.7855
    accuracy on MPC, 0.5483 HR@1 on SR, and $0.9143~\mathrm {F}_{\text {BERT}}$ on AG, while maintaining an average
    runtime of 2.143 seconds and a whole-suite cost of ${\$}4.42$ . Ablation results show that schema guidance,
    teacher supervision, user-side context, and answer-span masking jointly support performance. Teacher-sensitivity
    analysis further shows that teacher-annotation quality depends on schema consistency and learnability rather
    than teacher strength alone, providing a new perspective on low-cost, unified, and teacher-aware e-commerce
    LLM deployment. Our code and data are available at: https://github.com/ZhChHoooi/UniCommerce-1.5'
