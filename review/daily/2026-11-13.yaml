    summary_en: DeCAF divides Harness search into dimensions such as prompts, topology, model assignment, context
      and tool policies. It iterates using development-set execution results, retains non-dominated candidates,
      then uses component diagnostics to compose, repair and select a final pipeline for held-out evaluation. Diagnostics
      locate likely failures; admission still depends on task performance, inference cost and latency. Optimizer
      repeats are few, inference cost rises on some benchmarks and total optimization cost is higher, so a strictly
      cost-matched advantage is not established.
    summary_zh: DeCAF 将 Harness 搜索拆为提示、拓扑、模型分配、上下文和工具策略等维度，以开发集执行结果迭代修改并保留非支配候选，再用组件诊断合成、修复并选择最终程序，在留出集评测。组件诊断只定位可能的失败，准入仍依据任务表现、推理费用和延迟。优化器重复次数少，部分基准推理费用上升，优化总费用也更高，未证明严格同费用预算优势。
