- id: arxiv:2611.08647
  title: 'IWIBench: Evaluating Gradient-Free Model Driven Intra-weight Injection'
  announced: '2026-11-05'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.08647'
  version: 1
  source_hash: 8d64aa8fca82953277abb83b159a7a3ba5cbdb327845526c4ace97335399b619
