- id: arxiv:2611.07723
  title: 'Static Recovery Is Not Dynamic Stability: Dynamics-Aware Benchmarking of Protein Motif Scaffolding'
  announced: '2026-11-05'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.07723'
  version: 1
  source_hash: 24dfa47d16cd399d1988ff6343e6f8d79c10d58513a7178dc38fbe19d279304e
