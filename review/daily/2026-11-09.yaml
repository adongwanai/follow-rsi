- id: arxiv:2611.09634
  title: Steerable Multi-Objective Group-Relative Preference Optimization with Jointly Trained Low-Rank Adapters
  announced: '2026-11-06'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.09634'
  version: 1
  source_hash: f27fe5ee63873d4e6ed9e93dc5d2536bf5a2622c06f03b3b9ccbb5615f3fcb3c
  published: '2026-11-06T15:50:32Z'
  updated: '2026-11-06T15:50:32Z'
  hf_daily_dates:
  - '2026-11-09'
  abstract: Language model deployment often requires different trade-offs between competing objectives as user preferences
    change, yet standard post-training methods typically produce a single policy for a fixed objective weighting.
    We introduce LambdaMix, a new parameter efficient method for learning a preference conditioned family of policies
    with group-relative online reinforcement learning. LambdaMix jointly trains one low-rank adapter per objective
    over a frozen base model. One preference vector selects the adapter mixture that generates responses and weights
    the separately normalized rewards used to update the adapters. A single training run supports changing preferences
    at inference without further optimization. We experiment with four models on helpfulness and harmlessness and
    on solving math problems while following instructions. We also evaluate the two largest models on rewriting
    comments to preserve wording while reducing clues about personal attributes. On the first two tasks, LambdaMix
    achieves higher hypervolume than all evaluated conditioned and policy merging baselines across all four models.
    LambdaMix uses fewer training completions and stores fewer adapter parameters than a set of GRPO specialist
