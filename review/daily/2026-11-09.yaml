- id: arxiv:2611.01182
  title: Fast and Exact Relative-Position Attention via Structure-Aware Kernels
  announced: '2026-10-31'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.01182'
  version: 1
  source_hash: 12dd4cec2074297c5b7aa06f9ef9b8c7e3dbcdf17033d850139f2941a3cc1f10
  published: '2026-10-31T18:29:06Z'
  updated: '2026-10-31T18:29:06Z'
  hf_daily_dates:
  - '2026-11-09'
  abstract: Relative-position attention mechanisms offer compelling alternatives to RoPE across various transformer
    architectures, delivering superior performance in domains such as audio. These mechanisms typically modify attention
    scores by adding content-position or bias-position terms. Unlike RoPE, which encodes position via per-token
    rotations directly on the queries and keys, relative-position terms generally require pairwise offset-dependent
    computation or lookups, complicating their integration into fused attention kernels and introducing severe memory,
    bandwidth, and compute overheads as sequences scale. To address this bottleneck, we propose an exact attention
    algorithm that incorporates additive relative-position terms into FlashAttention-style tiled computation. Our
    method (1) uses offset-aware tiling to avoid redundant indexing and memory accesses, (2) computes only the necessary
    key/query-relation products and reuses them across token pairs in both forward and backward passes, and (3)
    uses offset-based gradient sharding and aggregation, eliminating atomic contention. We provide a unified, efficient
    Triton implementation across diverse relative-position attention mechanisms and evaluate it against naive and
    specialized implementations. For 8K-token sequences, our method speeds up the forward (backward) pass by 1.8-6.4$\times$
    (2.0-21$\times$) and reduces peak memory up to 2.9-128$\times$ (1.4-54$\times$) over the strongest baseline
    for each mechanism, enabling long-context end-to-end transcription that is 1.8$\times$ faster and uses 2.4$\times$
    less memory. Our method thus provides a drop-in, hardware-efficient solution for scaling relative-position attention
    transformers.
