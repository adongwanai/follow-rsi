- id: arxiv:2611.09113
  title: 'Authorization Drift in LLM Agents: Evaluating Boundary Compliance in Multi-Step Tool Use'
  announced: '2026-11-06'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.09113'
  version: 1
  source_hash: 794d6b546f48102373588dd1737e103282b821eb1f00328a35c2bdc276c66db4
  published: '2026-11-06T07:47:25Z'
  updated: '2026-11-06T07:47:25Z'
  hf_daily_dates:
  - '2026-11-09'
  abstract: 'LLM agents can exceed their authorization boundaries while pursuing user goals without an adversary.
    We formalize this phenomenon as authorization drift across data, tool, scope, and time, and introduce the Authorization
    Drift Benchmark (ADB): 648 samples across seven domains, each pairing a sufficient compliant path with an attractive
    unauthorized shortcut. To ensure executable tasks, tempting shortcuts, and feasible compliant paths, Staged
    Execution-Reflective Synthesis (SERS) grounds benchmark validation in real agent rollouts rather than LLM self-critique.
    Across 13 LLMs and three frameworks (25,207 trajectories), greater capability accompanies greater drift, with
    frontier-capable models exhibiting drift rates of 0.43 to 0.61. Yet 86.18% of tasks admit an observed clean-success
    trajectory, showing that drift is avoidable. Drift is persistent and dominated by early data over-collection;
    apparent improvements under agentic scaffolds coincide with collapsing clean-completion performance. To understand
    potential harms to individuals and society, we map drift points to legal provisions across four jurisdictions,
    connecting overreach to privacy and information-security concerns. Data minimisation is the most frequently
    implicated provision, and 93.5% of legally grounded drifting runs map to multiple jurisdictions, making the
    potential consequences of authorization drift more interpretable.'
