- id: arxiv:2610.41711
  title: 'Hierarchical Residuals: A Minimalist Decoupling of Residual Width from Compute Width'
  announced: '2026-10-30'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2610.41711'
  version: 1
  source_hash: 9a8b20bd2ed7b828edf6e1633a8d99c6c3b3b02f55f3333a21988d4814a5c3a0
  published: '2026-10-30T13:18:22Z'
  updated: '2026-10-30T13:18:22Z'
  hf_daily_dates:
  - '2026-11-09'
  abstract: 'Residual connections underpin Transformers, but they implicitly tie the residual width carried through
    depth to the compute width used inside each layer. We introduce Hierarchical Residuals (HiRes), a minimalist
    architectural change that decouples these dimensions, widening the residual state while keeping per-layer compute
    width fixed. HiRes groups layers into blocks: standard d-dimensional PreNorm layers operate inside each block,
    while a wider D-dimensional PostNorm outer residual connects blocks. Learned read/write projections bridge the
    two spaces at block boundaries, leaving individual Transformer layers unchanged. Across different model sizes
    and depths, HiRes consistently outperforms vanilla residual addition, with fitted scaling laws indicating a
    1.30-fold improvement in FLOPs efficiency. On OLMoE-1B-7B pretraining for 500B tokens, HiRes achieves 0.0208
    lower training loss and 1.14-point higher downstream accuracy. HiRes is also competitive with other residual
    expansion methods such as VWN, mHC and AttnRes with less activation memory and I/O costs. Built from only dense
    projections and normalizations, it requires neither specialized kernels nor infrastructure-level optimizations.
    HiRes thus exposes residual width as a practical scaling variable using only standard operators.'
