  note: 符合改进器/生成器自身进化范围（harness/improver）：HyperHarness 不在部署时对每个新用户做昂贵的逐用户搜索，而是利用训练用户群上的下游问答反馈，在外层循环迭代修改共享的「历史→Harness
    元生成器 G_S」（含历史摘要代码、构建提示、预算分配与共享运行时模板 S），使其能为未见用户一次性生成可执行 Python 个性化钩子（user_route、user_keep、user_guidance）。局限：个性化代码被严格限制在固定
    3 钩子 AST 白名单接口内；在跨领域漂移基准 MemoryCD 的簇不相交（cluster-disjoint）切分上迁移增益明显减弱；稳健性检验仅覆盖 12 名用户、单随机种子。 生成空间受限于预定义的三钩子（user_route/user_keep/user_guidance）受限
    AST 沙箱，无法改写宿主主循环。 在跨领域 MemoryCD 簇外泛化设置下性能提升有限，显示元生成器对用户行为簇分布敏感。 稳定性与消融实验样本量较小（12 用户子集、单演化种子）。 三轮证据见 docs/internal/reports/maintenance-2026-11-26/primary-review/final-adjudication.json。
