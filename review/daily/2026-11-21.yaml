  note: 符合组件级 Harness 演化范围（harness/component）：论文构建 1,351 个请求的多方团队认知基准 GroupBrief，并设计 5 轮覆盖率引导的 Harness 搜索，在训练/验证项目上迭代改写智能体检索与简报综合指令（π_0→π̂_r），冻结后迁移至
    289 个项目不相交测试请求及下游协作仿真（下游得分分别提升 +2.54 与 +12.88 个百分点）。局限：被接受的候选实际仅修改了检索与综合提示字符串（I_ret, I_syn），工具原语与 10 轮/4000
    字符预算保持固定；测试集中有 7 个项目曾在此前非搜索实验中查看过（作者自注为探索性迁移）；语料为合成多智能体对话；gpt-6-sol 同时担任候选提议者与评审模型，且简报长度与得分正相关（r=0.34）。 5 轮演化中获准保留的修改仅涉及检索与综合提示词文本，未触及工具实现或循环预算代码。
    289 题测试集中包含 7 个在早期基线探索中检视过的项目，存在轻微基准接触风险（§5.2）。 数据集由多智能体模拟合成，且 gpt-6-sol 兼任优化提议者与覆盖率/仿真裁判，简报得分与文本长度存在正相关（r=0.34）。
    三轮证据见 docs/internal/reports/maintenance-2026-11-26/primary-review/final-adjudication.json。
