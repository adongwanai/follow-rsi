  decision: accept
  arxiv_id: '2610.40747'
  version: 1
  source_hash: 997e0239619633e6fc15409ab99ae4aa6f267942466402ac75fd9b63d2ffcaf9
  published: '2026-10-29T15:54:48Z'
  updated: '2026-10-29T15:54:48Z'
  hf_daily_dates:
  - '2026-11-04'
  abstract: Effective computer-use agents (CUAs) should seamlessly combine visual GUI interaction with code and
    terminal execution within a single policy. We present Mage-VL-Cowork, a 4B hybrid CUA trained from a general
    multimodally aligned checkpoint through an end-to-end, progressive five-stage curriculum across midtraining,
    SFT, and RL. To power this curriculum at scale, Mage-CUA-Forge replaces per-task agent construction with reusable,
    skill-conditioned generation workflows and application-specific preparers, synthesizing 293,806 desktop and
    web tasks across 6,915 skills while reducing recurring per-task expenditure by 82.6%. Rather than directly distilling
    a default teacher, we evolve the teacher harness and instantiate specialized CUA harnesses to yield high-quality
    trajectories alongside stage-specific supervision. Mage-VL-Cowork-4B finally climbs to 66.0% on OSWorld-Verified
    through different training stages with more efficient reasoning cost, achieving state-of-the-art performance
    at its parameter size and pushing forward the frontier of on-device intelligence.
