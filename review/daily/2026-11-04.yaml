- id: arxiv:2611.04035
  title: 'Recursa: Toward Recursively Self-Improving Foundation Model Systems'
  announced: ''
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.04035'
  version: 1
  source_hash: aa0b4420c5b6f7793bbbee11b967124f582857c233e522b6557438fe91a15003
  published: '2026-11-02T22:30:12Z'
  updated: '2026-11-02T22:30:12Z'
  hf_daily_dates:
  - '2026-11-04'
  abstract: 'Foundation models in changing environments can encounter unfamiliar domain knowledge that their original
    training did not cover. However, new domains rarely provide large amounts of expert-created training data or
    reliable supervisory signals for further training. We introduce Recursa, a foundation model system that adapts
    to new domains by learning from its own experience without human experts or a stronger teacher model. Recursa
    uses a knowledge repository to store what it learns: domain-specific skills and instructions on when to apply
    them, along with memories of past task experiences and reflections on what to improve. Recursa bootstraps the
    repository from domain materials and then refines it through recursive self-improvement. It uses parallel learners
    to execute tasks and synthesize local improvements, then validates and merges the improvements into the knowledge
    repository. On Harvey LAB''s Firm Knowledge benchmark, Recursa raises the all-pass rate on held-out test tasks
    from 30.0% to 55.0% with DeepSeek-V4.1-Flash and from 35.0% to 46.0% with Qwen3.8-Flash.'
