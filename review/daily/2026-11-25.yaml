  published: '2026-11-25T00:19:07Z'
  updated: '2026-11-25T00:19:07Z'
  hf_daily_dates: []
  abstract: 'Robot agents discover reusable skills by revising programs from execution feedback and retaining experience
    for later tasks. This process can fail when an agent treats an unsuccessful program as evidence that the task
    is physically impossible, ending exploration with revision budget remaining. We study this failure in Qwen3.8-27B
    and examine two decisions that shape skill discovery: I) how execution failures are diagnosed, and II) which
    lessons enter the shared skill library. Failure diagnosis requires the agent to reconstruct physical action
    effects from multimodal traces, while independent reproduction of a proposed repair does not require adequate
    task performance from its source program. We introduce Skeptic, a training-free protocol that uses measured
    action outcomes to guide repair and measured task success to govern skill admission. A grounded event log reports
    action effects and object end states from depth images and proprioception, separating sensor observations from
    inferred diagnoses. Verified promotion adds a development-success requirement on the source program to the existing
    independent reproduction check. Across 60 audited tasks, the mean number of tasks with false impossibility judgments
    decreases from 19.5 to 8.5 per campaign. On 80 LIBERO-Pro tasks and seven Robosuite tasks, Skeptic improves
    held-out success by 14.9 and 11.7 percentage points, with frozen model weights and the same program-revision
    budget.'
