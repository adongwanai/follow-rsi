  updated: '2026-11-24T16:33:20Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: 'Fine-tuning an instruction-tuned language model on new facts often erodes its general abilities. We
    find that standard fine-tuning lowers instruction-following, reasoning and coding benchmarks by 35 points on
    average, and that these losses track a collapse in answer length: fine-tuned models at least halve their responses,
    and the further a response drifts from the initial model''s length, the more often it fails. We propose InstructReplay:
    the initial model answers a set of general instructions once, and during fine-tuning the model is kept close
    to the initial model on these answers. Across three model families and two domains, InstructReplay reduces the
    average decline on five general benchmarks from 28.1 to 2.4 points and keeps answer length close to the initial
    model''s, while learning the new facts as well as standard fine-tuning. It balances learning and retention better
    than seven adaptation methods in all six settings. Controlled comparisons attribute the gain to replaying the
    model''s own answers to general instructions rather than to the form of the loss.'
