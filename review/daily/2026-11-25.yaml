- id: arxiv:2611.27962
  title: 'Model Carving: Training Transformers That Optimize Their Own Topology'
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.27962'
  version: 1
  source_hash: f36e161403b625e0981d240c992406e01f8a3fe23c80999369126ae6882f40bc
  published: '2026-11-20T18:41:39Z'
  updated: '2026-11-20T18:41:39Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: 'Machine learning has largely kept separate the choice of architecture and the process of training.
    A classic Transformer, for instance, trains a fixed set of attention and MLP sublayers at every layer, in the
    same order, and optimizes the weights within. This uniformity is a convention rather than a principled design
    choice, and it is likely suboptimal: the best architecture for a given task may be smaller, more efficient,
    and far from uniform. We believe that, ideally, training itself should shape the model''s topology. To this
    end, we introduce Model Carving, which learns both a Transformer''s weights and its architecture in a single
    run. By applying learnable, scalar gates to each sublayer, we allow the training loss to remove the model''s
    own components during training -- freeing a smaller heterogeneous network inside. We evaluate Model Carving
    by pre-training standard Transformers from 140M to 2.7B parameters and looped Transformers from 140M to 1.3B.
    At equal training compute, carved models reach a lower validation loss than dense models trained with up to
    1.7 times more compute. Furthermore, carved models also outperform size-matched models produced by pruning or
    distillation, suggesting that the best way to obtain small models for edge devices is to carve them during training,
    not to compress a large one afterwards. This advantage both grows with scale and carries over to downstream
    tasks such as few-shot evaluation and generation. Because the removed sublayers no longer run, carved models
    also cost up to 34% fewer FLOPs per token and decode up to 1.6 times faster without cost in quality. Our results
    show that architecture, like weights, should be learned and not fixed in advance, and that inside every large
    transformer is a smaller, faster, stronger one waiting to be carved out.'
