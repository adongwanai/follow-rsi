  arxiv_id: '2611.30219'
  version: 1
  source_hash: 7b2e16695c79f1adc3f12dbfd6114bfed82d54a99e4fd301f38c676126d06527
  published: '2026-11-23T07:51:14Z'
  updated: '2026-11-23T07:51:14Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: Generating 3D indoor scenes requires a representation that captures object semantics, instance identity,
    height structure, and orientation while respecting room geometry. Methods that model scenes as sequences of
    object vectors learn spatial constraints implicitly, leaving collisions and boundary violations to losses or
    post-processing; semantic-map methods make occupancy explicit, but collapse instance and directional structure.
    We introduce RoomTokens, a sliced structured-token representation in which each token stores semantic class,
    instance-color identity, and facing field. This representation allows a scene to be generated as a discrete
    grid while preserving cues for instance grouping, orientation estimation, and 3D extent prediction. To learn
    the RoomToken distribution, we propose MDIRT (Masked Diffusion over RoomTokens), a masked discrete diffusion
    model that denoises semantic/instance-color/facing channels jointly with a shared cross-slice backbone. Architectural
    tokens are clamped as explicit floor- plan constraints, so the model samples furniture layouts that respect
    room geometry while retaining instance and object-attribute structure. Experiments on 3D-FRONT show that RoomTokens
    with MDIRT improve layout fidelity and physical consistency over sequence/vector- and map-based methods, suggesting
    structured spatial tokens as a practical choice for discrete 3D scene synthesis.
