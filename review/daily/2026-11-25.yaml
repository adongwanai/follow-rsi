  updated: '2026-11-25T03:08:42Z'
  hf_daily_dates: []
  abstract: Conversational sports analytics requires accurate, evidence-based responses with low latency. Changes
    in query distributions, data resources, and model behavior can degrade static agent configurations, motivating
    controlled evolution guided by runtime evidence. We present Sports Agent, a self-evolving framework integrating
    an Agentic SQL Model for structured-data reasoning, a harness for planning and tool orchestration, and a unified
    Feedback Engine connecting online execution with offline evolution. The engine assesses responses and execution
    trajectories, verifies factual claims, diagnoses failures, and generates evolution signals. Model evolution
    combines SQL-to-Question Scaling for coverage expansion with Graph-Guided Scaling for error-targeted synthesis.
    Generated questions undergo trajectory distillation and quality filtering for iterative supervised fine-tuning,
    followed by a separate Post-RL stage. Harness evolution translates recurrent failures into bounded prompt and
    skill updates, validated through independent audits, execution replay, and regression testing. Performance-tolerance
    checks guard against unacceptable degradation during simplification. The resulting Qwen3.6-35B-A3B-based model
    outperforms Qwen3.8-Max on sports question answering and analysis while achieving approximately three times
    the inference efficiency. Across 30 harness-evolution rounds, the aggregate performance score improves by 10.8
    points. In a live sports analytics product, the evolved system improves factual correctness by 10.5 points and
    average response length, a proxy for answer richness, by 158.1%, while reducing average latency by 41.3% relative
    to the baseline.
