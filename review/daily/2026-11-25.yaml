- id: arxiv:2611.30986
  title: Reinforcing Diffusion Models by Instantaneous Trajectory Distribution Matching
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.30986'
  version: 2
  source_hash: 0b24b8dcf540adc1a0c66c8548165363c6fcf494bb8c199bf47852f0544873f2
  published: '2026-11-23T16:42:40Z'
  updated: '2026-11-24T16:13:52Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: Forward diffusion reinforcement learning (RL)---enabling deterministic ODE sampling without trajectory
    backpropagation---has grown increasingly popular for efficiently aligning diffusion models. However, we reveal
    that existing methods essentially rely on signed reward-weighted regression (RWR), regressing the trainable
    policy velocity onto rollouts from a behavior distribution. Unbiased baseline subtraction implicitly assumes
    that the policy velocity equals the behavior marginal velocity---an idealized assumption violated under classifier-free
    guidance (CFG) rollouts, offline/off-policy updates, and imperfect online self-consistency. This behavior--policy
    mismatch breaks baseline invariance and injects baseline-induced gradient drift, destabilizing training. To
    resolve this issue, we propose Instantaneous Trajectory Distribution Matching (iTDM), taking the infinitesimal
    limit of Trajectory Distribution Matching toward a time-local reward-guided target via the posterior-score identity
    to yield a sample-level gradient anchored at the behavior velocity without learning an additional reward-tilted
    target score. Tracking this velocity with an online auxiliary denoiser guarantees exact baseline invariance
    at the auxiliary optimum, effectively suppressing baseline drift across both online and offline RL. Extensive
    experiments across compositional generation, text rendering, and preference alignment show that iTDM achieves
    state-of-the-art in-domain and out-of-domain performance across group-wise online/offline RL and pairwise offline
    RL. Notably, on the challenging GenEval2 benchmark, iTDM converges nearly 3\times faster than competing methods
    while scaling smoothly to 0.87 without collapse. Furthermore, iTDM scales effectively to the 5.6B FLUX.3 model,
    achieving better performance across both in-domain and unseen metrics. Code is available at https://github.com/Luo-Yihong/iTDM
