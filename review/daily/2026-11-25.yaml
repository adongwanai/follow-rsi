- id: arxiv:2611.33757
  title: 'TransHarness: From Benchmark Overfitting to Transferable Harness Evolution'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.33757'
