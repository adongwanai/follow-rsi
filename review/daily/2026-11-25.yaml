  updated: '2026-11-25T04:15:25Z'
  hf_daily_dates: []
  abstract: Harness evolution offers a path to improving coding agents without updating model weights. However,
    existing methods can overfit their evolution benchmarks, producing gains that fail to carry over to new tasks.
    To address this challenge, we introduce Transferable Harness Evolution (TransHarness), which evolves harness
    intervention policies from same-task success-failure contrasts. These policies couple execution-context triggers
    with diagnostic guidance, enabling task-dependent checks and corrections beyond the source executions. Cross-task
    replay and independent semantic selection retain policies that intervene selectively and ground corrections
    in current-task evidence rather than source-specific solutions. We further curate an independent evolution set
    for cross-distribution transfer and conduct a cross-benchmark evaluation covering multiple strong models and
    a range of lightweight and mature harnesses. Experiments show that, with only 300 source trajectories from outside
    the test distribution, TransHarness further improves strong agents across distinct target benchmarks, demonstrating
    transferable harness evolution beyond benchmark overfitting. Specifically, TransHarness achieves state-of-the-art
    scores of 76.4% on DeepSWE v1.1 and 95.5% on Terminal-Bench 2.1, surpassing the strongest baseline model, GPT-6
    Astra, by 2.4 and 5.6 percentage points, respectively.
