  updated: '2026-11-25T17:42:32Z'
  hf_daily_dates: []
  abstract: Video recasting aims to transform the entities and environments of existing videos into new visual worlds
    while preserving their essential actions and interactions. However, achieving coherent transformations remains
    challenging, as coordinated edits can disrupt the original event structure. In this paper, we introduce RecastAgent,
    an experience-guided agentic framework for source-conditioned video recasting that operates under frozen model
    weights. Our framework employs an Experience-Guided Planner to choose edit prompts and input video states under
    qualitative visual critique, allowing the agent to build upon partial progress or backtrack to preserve source
    structure. Across tasks, an Experience Accumulation module distills completed trajectories into conditional,
    evidence-linked principles that record both an editing strategy and its scope of validity. We additionally construct
    a benchmark of 67 source videos with 134 paired-specification tasks across six creative categories for evaluation.
    Experiments demonstrate that RecastAgent outperforms single-pass and agentic rewriting baselines across Bernini
    and Ditto. Furthermore, accumulated experience improves performance on held-out test videos and transfers zero-shot
    to external benchmarks like FiVE-Bench and VE-Bench.
