  hf_daily_dates:
  - '2026-11-25'
  abstract: Reasoning models become long-horizon agents through reinforcement learning or, more cheaply, through
    fine-tuning on a stronger teacher's trajectories, which contain the teacher's chain-of-thought as well as its
    actions. The standard fine-tuning approach imitates both, yet the strongest teachers are closed models whose
    chain-of-thought is hidden behind an API. We show that the chain-of-thought can be left out altogether and that
    the long-horizon policy can be distilled from the teacher's actions alone. The student is trained on these trajectories
    with its reasoning block left empty, while a KL loss on a replay buffer of its own generations limits drift
    from its initial model. Surprisingly, the policy learned from these trajectories with an empty reasoning block
    carries over to inference with thinking enabled, where the student reasons in its own style while acting like
    the teacher, an effect we call cross-format transfer. Distilling the actions of Qwen3.6-27B raises the task
    success of Qwen3-4B on AppWorld from 7% to 18% and that of Qwen3-32B from 12% to 25%. We further introduce CoT-proxies,
    short summaries of the teacher's reasoning placed after the empty reasoning block, which raise Qwen3-4B further,
    to 35%. Since neither actions nor CoT-proxies need the hidden chain-of-thought, the recipe applies unchanged
    to closed teachers. Distilling GPT-5.6 Luna from its visible outputs and the reasoning summaries its API returns
    raises Qwen3-4B from 7% to 48% on AppWorld and from 3% to 28% on SWE-bench Verified.
