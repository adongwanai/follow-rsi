- id: arxiv:2611.30613
  title: 'CineAct: Interaction-State Agents for Playable, Branching Film Generation'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.30613'
