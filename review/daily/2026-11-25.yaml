- id: arxiv:2611.34400
  title: 'EvoLink-Bench: A Benchmark for Evaluating Self-Evolving Agents in Long-Horizon Interdependent Task Streams'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34400'
  version: 1
  source_hash: d20a658762c1d00211643f47052ce587129cfccdf7dac48fc7d0ed9f1f2d590e
  published: '2026-11-25T14:00:22Z'
  updated: '2026-11-25T14:00:22Z'
  hf_daily_dates: []
  abstract: 'Large language model (LLM) agents are evolving from passive chatbots into autonomous systems that operate
    continuously in dynamic environments. Such agents need not only solve current tasks but also learn from past
    interactions to improve future performance. However, existing streaming benchmarks often rely on short task
    sequences or largely independent tasks, providing limited evidence of whether agents can effectively reuse experience
    when later tasks depend on earlier outcomes. To address this gap, we introduce \textbf{EvoLink-Bench}, a benchmark
    for evaluating self-evolving agents in long-horizon, interdependent task streams. It covers daily office work,
    multi-turn dialogue, and AutoResearch-style workflows, with persistent workspaces and dependencies across tasks.
    The benchmark includes two complementary levels: \textbf{L1}, which evaluates the acquisition and revision of
    language-expressible knowledge, and \textbf{L2}, which assesses the development of task-level capabilities through
    execution and feedback. Its evaluation further distinguishes within-task recovery, persistent-state updates,
    and experience reuse in later tasks. We evaluate five agent frameworks across three backbone configurations
    under three persistence conditions, covering 19,635 scored task slots from selected evaluation cohorts. Results
    show that no framework consistently performs best across both levels, retries recover only a limited proportion
    of failed tasks, and persistent-state updates do not necessarily improve subsequent performance. Furthermore,
    the effects of evolution differ between knowledge- and capability-level tasks, suggesting that these two forms
    of evolution require different learning mechanisms. Performance gains also vary across domains and task streams,
    with improvements on some tasks not necessarily extending to others.'
