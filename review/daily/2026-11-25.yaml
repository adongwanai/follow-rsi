- id: arxiv:2611.27741
  title: Can Vision-Language Models Synthesize Executable Game-Playing Programs?
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.27741'
  version: 2
  source_hash: 40500dac0417fa8c788b4b1c6cf184b0745f0896dedd8a82c0f01275b290d925
  published: '2026-11-20T15:36:12Z'
  updated: '2026-11-25T03:33:27Z'
  hf_daily_dates: []
  abstract: 'Recent advances in vision-language models (VLMs) have endowed multimodal agents with increasingly strong
    visual perception and long-horizon reasoning capabilities, making VLM-based autonomous game playing feasible.
    Existing game benchmarks primarily evaluate whether an agent can select appropriate actions from the current
    visual state across different scenarios and games. However, most of them adopt a step-by-step interaction paradigm
    where the current visual observation is sent to the agent before each action. In practical deployment, this
    paradigm introduces two fundamental limitations: the game loop must wait for model inference, making real-time
    interaction impractical, and repeated VLM calls incur substantial cost. Therefore, we propose PlayScriptBench,
    a script-based game benchmark that evaluates whether VLMs can synthesize an executable game-playing program
    from game states. This setting jointly evaluates visual grounding, understanding of game dynamics, long-horizon
    strategic reasoning, and executable program synthesis, providing a more comprehensive assessment of game-playing
    agents. To support more tractable evaluation for current general-purpose VLMs, we further introduce a four-stage
    pipeline --- Explore, Perception, API Construction, and Strategy Composition --- that decomposes controller
    synthesis into game exploration, state perception, interface construction, and strategic control, enabling agents
    to progressively construct an executable program. Experiments on 16 games spanning 4 genres show that even strong
    VLMs struggle on our benchmark, revealing a substantial gap between passive visual game understanding and executable
    closed-loop game control. These results establish script-based controller synthesis as a complementary direction
    for benchmarking VLM-based game-playing agents.'
