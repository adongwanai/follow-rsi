- id: arxiv:2611.30634
  title: Rewirable Circuits in Transformers with Loom Attention
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.30634'
  version: 2
  source_hash: ecf5e27f8c79df95882549ab94f149769bdfecaca4c61e8ad4baac3f44d5c44e
  published: '2026-11-23T13:00:54Z'
  updated: '2026-11-24T08:46:11Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: We propose loom attention, which allows a Transformer to dynamically rewire its circuits at every token
    by interweaving a head's vertical attention over the outputs of earlier heads (to obtain its query, key and
    value) with its horizontal attention over tokens. We instantiate vertical attention efficiently with normalized
    and gated linear attention over a per-token matrix memory, which stores the compressed head outputs and serves
    as a second residual stream. This yields LoomFormer, a dual-stream architecture that splits control and content
    between the vector and matrix streams. Across model sizes and training token budgets in language modeling and
    downstream tasks, LoomFormer matches Transformers trained with over 3x compute and recent residual-stream baselines
    (HC/mHC, MUDDFormer, AttnRes) trained with ~1.7-2.8x. For example, trained on the same 300B tokens with only
    2% extra FLOPs, LoomPythia-2.8B achieves ~1.6x the average downstream gain of mHC-Pythia-2.8B over Pythia-2.8B,
    and matches (0-shot) or surpasses (5-shot) Pythia-12B. Code is available at https://github.com/Caiyun-AI/LoomFormer
