- id: arxiv:2611.33836
  title: Can Its Own Misses Teach an MLLM to Find Small Brain Metastases?
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.33836'
