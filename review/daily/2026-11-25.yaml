  source_hash: c68c377bc322c40719353fb33da6fe4b2a6af88878521fc29bfb3df54c4e1454
  published: '2026-11-23T12:49:13Z'
  updated: '2026-11-25T03:10:09Z'
  hf_daily_dates: []
  abstract: 'Open video generators such as MiniMax-H3 produce short clips of only several to a dozen seconds per
    run. To synthesize longer sequences, existing methods either rely on agentic systems following preset scripts,
    or roll out autoregressively from the previous clip''s last frame, losing off-screen states and accumulating
    hallucinations across turns. Consequently, users still cannot take an explicit goal, choose how to accomplish
    it, and see that choice persist across subsequent clips. We study goal-grounded interactive video generation,
    where one goal admits multiple valid approaches, the user''s chosen approach must be executed on screen, and
    its consequences must persist across clips. To this end, we propose CineAct, a state-first agentic framework
    in which language-model agents handle reasoning while frozen image and video generators serve purely as renderers.
    Before interaction, the Architect initializes the world as a spatial layout with cameras, an asset library,
    and a scene graph; at each turn, the system deduces the planned state change, generates a target end frame with
    an image generator and rigorously verifies it, and synthesizes intermediate motion with an FL2V model. We further
    introduce a multi-space benchmark covering two suites: long-horizon step execution and open-intent branching
    admissibility. Experiments show that explicit world-state modeling boosts multi-step rollout consistency over
    the pixel-only baseline (+11.4 automated, +23.1 human points) and raises paired branching success toward a shared
    goal by +30.8 points.'
