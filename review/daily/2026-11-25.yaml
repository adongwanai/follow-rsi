- id: arxiv:2611.33010
  title: 'Embodied AI Fails the Mirror Test: How a Simple Mirror Breaks Robot Policies'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.33010'
  version: 1
  source_hash: c3ac4058df86a78ead99de00554e6d0a437b6b9b26b0e8256e5b6cb39bc15e1c
  published: '2026-11-24T17:32:00Z'
  updated: '2026-11-24T17:32:00Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: 'Can a simple mirror expose the limitations of today''s robotic manipulation policies? Inspired by the
    mirror self-recognition test in animal cognition, we investigate whether robot policies can reliably manipulate
    physical objects in scenes containing their reflections. We introduce RoboDojo-Mirror, a benchmark built on
    RoboDojo that preserves task objectives, success criteria, and policy checkpoints while comparing a mirror-free
    baseline with single-mirror, dual-mirror, and mirrored-tabletop conditions. Across five policies spanning Vision-Language-Action
    models, World Action Models, and agentic policies, every mirror condition reduces aggregate success rates: averaged
    over the three conditions, the drop ranges from 10.8 to 56.7 percentage points across policies, and it reaches
    62.5 points on the mirrored tabletop. Because a mirror is also a physical obstacle, we compare it against geometrically
    matched non-reflective panels; 50--88\% of mirror-specific failures occur without recorded robot--panel contact,
    so direct collisions alone do not explain the degradation. Trajectory and contact analyses instead reveal recurring
    behaviors consistent with phantom targeting of reflected objects and spatial mislocalization of real ones. Targeted
    diagnostics further characterize grasping near reflections, policy-dependent pushing progress, and physical-target
    interaction under main-camera occlusion. Real-robot experiments with $π_{0.5}$ and FastWAM also show lower overall
    success rates under the upright-mirror and mirrored-tabletop conditions. These findings reveal a shared vulnerability
    to reflective environments across diverse robot policies and motivate reflection-aware evaluation of embodied
    intelligence. Code is available at https://github.com/iPPLab/robodojo-mirror.'
