  abstract: 'Large language model (LLM) coding agents can iteratively self-improve robot manipulation skills in
    simulation benchmarks, yet real-world tasks provide neither ground-truth success scorers nor resettable practice
    environments. Our key observation is that a single real demonstration simultaneously specifies scene geometry,
    defines the terminal success criterion, and serves as a physical reference trajectory for verifying world fidelity---all
    decoupled from the source robot''s kinematics. We present {RESET}: we reconstruct a contact-rich world and derive
    a frozen read-only criterion from one demonstration ({R}ebuild); check that world against the demonstration
    by open-loop replay and silhouette consistency ({E}xamine); evolve modular white-box task graphs and skill code
    from per-node failure evidence ({S}elf-improve); deploy frozen code on real robots with zero runtime LLM calls
    ({E}xecute); and share the verified world and criterion with unseen robots without new demonstrations ({T}ransfer).
    On 8 manipulation tasks, each rebuilt from one real demonstration, RESET achieves 97% average success on unseen
    layouts in simulation, whereas zero-shot code reaches 27%, per-task fine-tuned pi0.5 policies 31%, and Diffusion
    Policy 50%; injecting reconstruction defects shows that practice tolerates many reconstruction errors, that
    geometric errors can still stall or mislead it, and that the check flags most of them while physical randomization
    covers the rest. Without any target demonstrations, 3 heterogeneous robots acquire the same task skills in the
    shared world: a robot with similar arms copies 95% of its skill functions unchanged from the source robot, while
    robots with different arms and hands write their own. In real-robot experiments, the resulting programs run
    on 4 robots and succeed in 80% of 280 trials.'
