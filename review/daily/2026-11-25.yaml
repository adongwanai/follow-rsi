- id: arxiv:2611.28649
  title: 'S-Mind: Internalizing Multi-View Geometry for Spatial Intelligence'
  announced: '2026-11-21'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.28649'
  version: 1
  source_hash: 19999dc34b7cd1be09c2a69c726f480e308149712c2188b7ce958b4b829af535
  published: '2026-11-21T08:22:21Z'
  updated: '2026-11-21T08:22:21Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: 'Spatial intelligence, the ability to reason about 3D space from visual observations, becomes essential
    as multimodal large language models (MLLMs) move into the physical world. Beyond perceiving each view, it rests
    on two cornerstones of human cognition: fusing multiple views into one coherent 3D scene and mentally transforming
    that scene to new viewpoints as reasoning unfolds. Yet our spatial probes reveal that MLLMs largely lack both
    capabilities, even after spatial fine-tuning. We therefore present S-Mind, which internalizes multi-view geometry
    within the MLLM through a compact set of spatial tokens. It supervises these tokens to hold the fused 3D scene
    and re-emits them to re-express this scene from every viewpoint the reasoning adopts. Across four spatial benchmarks,
    S-Mind improves its Qwen3.5 backbones by up to 22.26 points and surpasses frontier general models such as GPT-6-Astra
    (+0.45), Kimi-K3.1-Pro (+1.97), and GLM-5.3-Flash (+7.80) in average accuracy. Moreover, the same probes confirm
    that it acquires both capabilities, reaching fusion and transformation accuracies of 65.11% and 82.17%, against
    at most 16.02% and 37.28% for the baselines. At inference, S-Mind also runs about 100x faster than a tool-based
    agent on the same backbone. Instilled through these spatial tokens during training, spatial capability becomes
    intrinsic to the backbone and persists even when the tokens are withheld, offering a promising path toward spatial
    intelligence in MLLMs.'
