- id: arxiv:2611.33566
  title: The Phases of Hierarchy
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.33566'
  version: 1
  source_hash: bf10d6b4fb2ff01b8a3068cb476937240b7c9d19061e8dff55753af636d8acf4
  published: '2026-11-25T00:27:03Z'
  updated: '2026-11-25T00:27:03Z'
  hf_daily_dates: []
  abstract: We develop a dynamical phase theory of hierarchy, in which depth decides whether a population of size
    $N$ that revises its own environment can correct it without overcorrecting. The statistics that let a large
    majority detect a small bias - the basis of the Condorcet jury theorem - also make its response grow as $\sqrt{N}$.
    Fed back into the environment it is judging, this sharpening destabilises the matched state through a flip bifurcation
    at a critical loop gain, which we obtain analytically for a class of models we term adaptive normal forms. We
    show that this instability can be attenuated by hierarchical layering, requiring a depth scaling logarithmically
    with $N$. This recovers known logarithmic bounds in organisational economics directly from dynamic stability
    conditions. Hierarchical depth carries its own costs however, and by analysing the signal chain transmission
    up the hierarchy we show that beyond a finite depth no correction reaches the top before its deadline, and that
    below it the cost of arrival grows exponentially with depth. A hierarchy that is too flat therefore oscillates
    and one that is too deep cannot be steered in time, leaving a bounded window of depth between an unstable flat
    phase and a frozen inertial phase. We further show that these results can be generalised by treating each layer
    as a real-space renormalisation step, classifying aggregation rules by how they transmit bias. This establishes
    a connection between these dynamic results to attention in Transformers, where a residual update is diffusion
    on the token graph and depth plays the role of scale. Finally we show these phase boundaries are observable
    in finite sampling, and propose measurements which may characterise the proposed phases in real adaptive systems.
