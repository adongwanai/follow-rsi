- id: arxiv:2611.33700
  title: 'Sports Agent: A Self-Evolving System for Conversational Data Analytics'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
