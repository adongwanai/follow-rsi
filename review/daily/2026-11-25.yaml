- id: arxiv:2611.32094
  title: 'Clinical3D-Bench: Evaluating and Improving Spatial Intelligence of Multimodal LLMs in Hospital Environments'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.32094'
  version: 1
  source_hash: a104a623ac9c72ac5bdc11047906d80ad47e10731ec45d795c0d562249319ba0
  published: '2026-11-24T07:14:47Z'
  updated: '2026-11-24T07:14:47Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: 'Spatial reasoning in hospitals requires tracking look-alike equipment, interpreting patient-relative
    directions, and judging passage widths, yet existing benchmarks provide limited coverage of these abilities.
    We introduce Clinical3D-Bench, a simulated benchmark with 3,368 questions of eight types on egocentric walkthroughs
    of 373 hospital-room layouts. Layouts follow hospital design guidelines, answers are computed from the 3D scenes,
    and paired scene states test whether models change their answers when relevant evidence changes. Videos are
    photorealistic, and ten physicians screened the layouts. Among 35 multimodal large language models (MLLMs),
    the best open and proprietary models reach 45.7% and 53.6% macro accuracy, against 40.8% for an answer prior
    and 79.0% for physicians on a subset, and 27 of 32 open models score below 40% on two-way patient-relative directions.
    Fine-tuning on Clinical3D-45K, our 44,750-question training set, lifts two MLLMs 16-20 points above the best
    proprietary model. 3D maps given to the fine-tuned MLLM as input go largely unused: replacing them with another
    video''s, even when they are ground truth, barely changes its accuracy. The proposed GeoJeV instead lets the
    MLLM compute with 3D: it reconstructs a scene memory from each video, selects 3D operations and their arguments
    from the MLLM''s question state, and adds their evidence to its option scores. It achieves the highest accuracy
    of all evaluated models, narrowing the gap to physicians.'
