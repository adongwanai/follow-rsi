- id: arxiv:2611.33909
  title: 'EGSE: Evidence-Grounded Skill Evolution for Medical Reasoning Agents'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.33909'
  version: 1
  source_hash: d2a0abf6958cc39c1e0057381668d07af09832d9e20bf4395ebbb607b1522d76
  published: '2026-11-25T07:28:21Z'
  updated: '2026-11-25T07:28:21Z'
  hf_daily_dates: []
  abstract: Medical reasoning agents combine foundation models with specialized tools to interpret medical images,
    yet reusing their historical experience remains challenging. A correct final answer can conceal flawed reasoning
    or tool use, synthesized advice may lack source support, and superficially similar cases may require different
    diagnostic procedures. In this paper, we propose EGSE, an evidence-grounded skill evolution framework that distills
    historical dialogues from similar cases into reusable conditional workflows and progressively refines a multi-faceted
    skill library through supported and validated updates to improve medical agents. EGSE evaluates intermediate
    reasoning and tool use and contrasts repeated successful and failed rollouts to extract useful practices and
    evidence-supported avoidance guidance. These experiences are synthesized into workflows with applicability conditions
    and checks traceable to source dialogues. Library additions and merges require source-grounded review and execution
    validation. At inference time, EGSE routes queries to skill nodes organized by imaging modality, question task
    type, and disease category, then retrieves and selects applicable workflows based on their conditions, the current
    images, and the question to guide evidence acquisition and interpretation. Experiments across four chest X-ray
    benchmarks show that EGSE outperforms representative medical agents and skill evolution methods in reasoning
    accuracy while reducing tool calls. It also delivers consistent accuracy gains across seven foundation models
    and supports skill transfer across datasets.
