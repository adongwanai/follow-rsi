  version: 1
  source_hash: 8831bb5c24f81e28aae96e021ebf3faef41fa3ed81f389ee470b4839d1f756ec
  published: '2026-11-23T16:32:01Z'
  updated: '2026-11-23T16:32:01Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: 'Computer-use agents (CUAs) are rapidly improving, yet their evaluation remains largely static. Existing
    benchmarks provide a strong foundation, but fixed difficulty ceilings, limited feature coverage, and coarse
    aggregate scores progressively weaken their discriminative and diagnostic value. We introduce CUA-SEE, a closed-loop
    evaluation environment that co-evolves tasks and executable verifiers from rollout evidence. It disentangles
    three objectives: benchmark evolution expands evaluation scope through cohort-calibrated difficulty and coverage
    growth; diagnostic evolution increases resolution through agent-conditional capability-boundary probes; and
    verifier evolution improves precision by translating changing requirements into state-grounded checkpoints with
    adversarial validation. Across multiple agents, applications, and rounds, CUA-SEE generates challenging, measurable
    tasks while preserving process-level evidence. Our results position adaptive evaluation as a scalable counterpart
    to self-evolving agents, continuously tracking what agents can do, where their boundaries lie, and how reliably
    progress is measured.'
