  abstract: We present KMed-31B, a medical large language model post-trained from an open-weight model for on-premises
    deployment with limited hardware. Post-training a model for diverse medical tasks remains difficult, because
    improving one kind of task can lower performance on another. We attribute this to differences between tasks
    in expected output and available feedback. Medical question answering and diagnosis prediction have reference
    answers, whereas clinical inquiry has no single correct response and is judged with rubrics. We therefore divide
    medical training tasks into four categories by these two properties, train one specialist per category with
    a reward that its feedback supports, and integrate the specialists into a single student with Multi-teacher
    On-policy Delta Distillation (MOPD$^2$). For clinical inquiry, we build Synthetic Health Dialogue, a simulated
    corpus of consultations with lay users and clinicians whose patient cases span common clinical presentations
    in primary care. Relative to its base model, KMed-31B raises HealthBench Hard from 22.95 to 41.87 and HealthBench
    Professional from 37.92 to 50.20 in non-thinking mode, and from 23.80 to 51.48 and from 41.97 to 59.18 in thinking
    mode, while its scores on four multiple-choice medical benchmarks are maintained or slightly improved. KMed-31B
    has the highest unadjusted HealthBench Hard score among the compared models, including proprietary ones, and
    scores higher on HealthBench Professional than every open-weight model we compare, including models with more
    than ten times as many total parameters. Applied to another base model, Qwen3.8-27B, the same training recipe
    also raises both HealthBench scores. We describe the training recipe, data construction, and settings in detail
    so that institutions requiring on-premises deployment can develop medical models from open-weight foundations.
