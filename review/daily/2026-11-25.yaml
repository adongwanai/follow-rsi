- id: arxiv:2611.34398
  title: 'When Skills Fail to Compose: Compatibility and Retention in Language Models'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34398'
  version: 1
  source_hash: ad2f285d0a3b17e1bc3074de2c5e18f041fe91a714edb33780b216670f24fc44
