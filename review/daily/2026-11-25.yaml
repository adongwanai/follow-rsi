- id: arxiv:2611.32736
  title: 'Qwen-Image-HD: Autoregressive Diffusion for High Definition Image Generation'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.32736'
  version: 1
  source_hash: bbc59ed2ca66a63547d76fed1627d70fc0fa11ae5f560597b3401934701519e9
  published: '2026-11-24T14:52:10Z'
  updated: '2026-11-24T14:52:10Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: Fine-tuning a generator on a complete high-resolution canvas requires long image sequences and substantial
    computation, yet local regions can still exhibit unnatural repetitive stripes when training resources are limited.
    We introduce Qwen-Image-HD, which adapts Qwen-Image 2.0 to high-resolution synthesis through local training
    and blockwise autoregressive generation. Each prediction covers a target tile at 1K scale, conditioned on high-resolution
    upper and left neighbors and a compressed historical thumbnail. These conditions provide adjacent fine-scale
    structures and an overview of the scene generated so far. To integrate these complementary cues, we map both
    forms of history and the target to a shared canvas coordinate system to express their spatial relationships
    and scale differences. On Qwen-Image-Bench at 4K, Qwen-Image-HD achieves stronger overall evaluation performance
    than direct 4K generation with FLUX-3-Image-Klein. Compared with full-image 4K supervised fine-tuning of the
    same backbone, it achieves better generation quality with lower training compute and higher inference efficiency,
    while exhibiting fewer unnatural repetitive stripes in original-resolution comparisons. We further introduce
    a Wavefront-AutoRegressive inference schedule that generates tiles on the same anti-diagonal concurrently across
    GPUs to reduce single-image latency.
