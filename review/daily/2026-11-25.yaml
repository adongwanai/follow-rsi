- id: arxiv:2611.31205
  title: 'ACAP: Asynchronous Coding Agents for Efficient Robot Control'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.31205'
  version: 1
  source_hash: 7cf27c4948e22a263f8b34fcfe85e3f8224cb271eeb61791e37aee19778d2d2e
  published: '2026-11-23T18:52:19Z'
  updated: '2026-11-23T18:52:19Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: Coding agents can construct and revise robot behavior during execution, but using one agent for the
    whole robot can delay otherwise independent work. We introduce Asynchronous Coding Agents as Policy (ACAP),
    an asynchronous framework that organizes one robot as a team of persistent agents. Each member reasons and acts
    for a configurable control group, such as an arm with its gripper or the torso and chassis, enabling asynchronous
    reasoning and execution. However, different robot components often have physical dependencies that require coordination.
    To address this challenge, ACAP introduces a hyper-agent that assigns tasks, coordinates dependencies, and dynamically
    allocates control between the lead and member agents. This allows independent work to progress concurrently
    while supporting tightly coupled manipulation when necessary. Across 72 real-world rollouts covering 25 task/platform
    settings, ACAP reduces task-balanced time cost by 28.2% compared with a single-agent Direct Policy, with improvements
    across Fully Parallel, Parallel-Sequential, and Collaborative tasks. Across all eight Collaborative settings,
    ACAP also achieves lower mean time cost than Fixed Delegation, where only member agents can control their assigned
    groups. An additional 90-rollout study shows lower mean 30-minute-capped time cost than Direct on all six tasks.
    We further demonstrate mobile manipulation using the same member interface for chassis and torso control. We
    present the framework and a real-world rollout dataset containing observations, generated programs, actions,
    and feedback to support research on how coding agents reason and act in the physical world.
