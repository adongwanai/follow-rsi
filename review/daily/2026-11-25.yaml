- id: arxiv:2611.29150
  title: Can an Agent Trust Its Own Zoom? Cross-Magnification Provenance Verification for Whole-Slide Images
  announced: '2026-11-22'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.29150'
  version: 1
  source_hash: f8da6640ed1b0476d6448666fcb2f6387a23e1acd0bcc37261c49d2a29a61a2f
  published: '2026-11-22T02:10:25Z'
  updated: '2026-11-22T02:10:25Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: Visual agents navigate whole-slide images through magnified observations associated with claimed locations.
    However, a visually plausible observation does not necessarily originate from its claimed location, particularly
    across magnifications and in regions with similar tissue structures. We formulate cross-magnification provenance
    verification (CMPV) to evaluate whether visual evidence supports a claimed spatial association, recover the
    source when possible, and abstain when evidence is insufficient. We introduce PyraFault, a benchmark of 3.06
    million coordinate-supervised examples from 2,200 cases across five TCGA cohorts, covering within-context substitutions,
    absent-source faults, and geometric perturbations. We further propose ZoomTrace, a claim-independent verifier
    that estimates the observation's source before evaluating its agreement with the claimed location. It combines
    physical-scale alignment, visual retrieval, geometric refinement, and reliability estimation using spatially
    disjoint competing matches. On 503,320 test examples, ZoomTrace achieves 0.969 AUPRC and 0.987 AUROC, compared
    with 0.789 and 0.903 for Efficient LoFTR. Further evaluations reveal trade-offs in reliability estimation and
    limitations in vision-language models, cross-dataset retrieval, and calibration. Integrating ZoomTrace into
    visual agent tool paths reduces exposure to corrupted observations and silent failures, while downstream accuracy
    improvements depend on the agent and verification threshold.
