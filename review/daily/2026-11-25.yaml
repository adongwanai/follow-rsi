- id: arxiv:2611.31752
  title: Separating Measurement Failures from Defence Failures in Split Language-Model Privacy
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.31752'
  version: 1
  source_hash: 8da32fdb40663df77b0f18809dd83ae49de8abd9b6d1673837f246c59a865668
