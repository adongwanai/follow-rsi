- id: arxiv:2611.25595
  title: 'LoopedWAM: Looped World Action Models for Elastic Inference'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.25595'
  version: 3
  source_hash: 59d020f930e54a7cbcda9b83954f10b8a5db2a76fdacfad3548a6ecc91efa124
  published: '2026-11-19T06:42:13Z'
  updated: '2026-11-24T04:01:04Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: 'World action models (WAMs) couple generative video modeling with robotic action prediction but typically
    require large video and action transformers, limiting deployment efficiency. We present LoopedWAM, a compact
    WAM that recurrently applies a shared six-block core in each expert, executing 30 transformer layers while storing
    only 12 blocks per expert. To account for their asymmetric inference costs, the video and action experts can
    operate at different depths: visual features are computed once per query, whereas action computation repeats
    at every sampling step. We further propose elastic self-distillation, which trains a single elastic checkpoint,
    LoopedWAM-E, across action-depth and sampling-step budgets. With only 0.58B policy parameters and no robot pretraining,
    LoopedWAM achieves 96.1% success on LIBERO, 91.9% on RoboTwin 2.0, and 52.2% on RoboCasaGR1, while using $7.4\times$
    less peak GPU memory than Fast-WAM under matched inference measurements. On LIBERO, LoopedWAM-E achieves 96.0%
    success in 27.6 ms or 95.2% in 24.7 ms on an H100, providing multiple accuracy-latency operating points from
    a single checkpoint; with two sampling steps and four action loops, it stays within 0.5 points of LoopedWAM
    on all three benchmarks. Ablations demonstrate that weight-shared depth preserves competitive performance, while
    aggressive action-depth reduction requires explicit budget-aware training. On a real AgileX PiPER arm, LoopedWAM
    succeeds in 71.3% of 80 trials across four tasks.'
