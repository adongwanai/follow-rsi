- id: arxiv:2611.30219
  title: 'RoomTokens: Masked Diffusion over Structured Tokens for Indoor Scene Synthesis'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
