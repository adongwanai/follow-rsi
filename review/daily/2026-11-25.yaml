  source_hash: 6893404519bc1326c08dc8e4cfaa6c4ee2ae5b50b8e5175b05c62e8fd39d5bf6
  published: '2026-11-24T15:35:58Z'
  updated: '2026-11-24T15:35:58Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: Real-time interactive video generation allows users to change the prompt during generation to steer
    the evolving video. However, existing streaming models, which generate videos chunk by chunk, often keep following
    the previous prompt after a switch. We trace this failure to context inertia, where the previous chunk acts
    as a strong prior that suppresses the new prompt. Furthermore, we find that this inertia persists even when
    the cache retains only the previous chunk, yet discarding the context breaks visual continuity, which limits
    approaches that edit the cache. Rather than editing the cache, we propose Residual Guidance (RG), a simple,
    training-free method that counteracts context inertia with a correction measured outside the cache. Specifically,
    RG denoises the re-noised previous chunk once under the new prompt without the cache and adds the resulting
    residual to the early denoising steps of the next chunk, where its content is largely decided and the new prompt
    is most suppressed. Across settings ranging from a single switch to long multi-switch generation, RG substantially
    improves prompt switching capability on existing streaming models, including those with dedicated switching
    mechanisms, while largely retaining visual quality. As it requires no training or per-model tuning and adds
    only one forward pass per chunk, RG can be easily integrated into existing real-time video generation pipelines.
