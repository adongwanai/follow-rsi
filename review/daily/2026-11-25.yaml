- id: arxiv:2611.30564
  title: 'Seeing Is Locating: Spatial Awareness and Geographic Bias in Decision Language Models'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.30564'
  version: 1
  source_hash: cff94b53e037d55cf5c7a00cc2452c838de254d2584f8002bb8db9adcb386085
  published: '2026-11-23T12:09:31Z'
  updated: '2026-11-23T12:09:31Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: 'Decision models, which output probability distributions over candidate labels instead of generating
    text, are increasingly used as classifiers and evaluators for inputs associated with real-world locations. However,
    it remains unclear whether they can leverage spatial context and whether their predictions are geographically
    biased. We introduce GeoDecisions, a multimodal benchmark for evaluating the spatial awareness and geographic
    bias of decision models. GeoDecisions comprises two tasks: (1) geo-aware image classification, and (2) location
    rating on objective and subjective topics. Evaluating six decision models against supervised task-specific models,
    we find that spatial awareness requires vision: textual coordinates alone provide insufficient context for classifying
    everyday photos and satellite images. We also find substantial geographic bias. On everyday photos, despite
    achieving higher accuracy, open-weight decision models exhibit more spatially clustered errors than supervised
    models. Moreover, across all five subjective topics, every decision model gives lower ratings to locations with
    lower socioeconomic conditions. Finally, we propose a training-free method that combines decision models with
    a location prior to improve their spatial awareness without substantially increasing performance bias. Our code
    is available at https://github.com/cruiseresearchgroup/GeoDecisions.'
