- id: arxiv:2611.32884
  title: 'Lazy Agents Answer Against Their Own Beliefs: Reinforcement Learning with Verifiable Beliefs Teaches Them
    to Act on What They Believe'
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.32884'
  version: 1
  source_hash: 17c34c877b359509dca4c7c65a14d831d896aa8175469dd19c40334089c32c9f
  published: '2026-11-24T16:17:51Z'
  updated: '2026-11-24T16:17:51Z'
  hf_daily_dates:
  - '2026-11-25'
  abstract: 'AI agents working on long tasks often commit to an answer before they have enough evidence, a behavior
    called laziness. In our evaluations, they frequently commit even while their stated belief still names several
    possible answers. An outcome reward at the end of the episode scores only the final answer, so it cannot teach
    the agent when to commit, because a lucky guess receives the same reward as an answer backed by evidence. During
    training, however, the simulator can compute the exact posterior over the answer at every step and tell whether
    the evidence is already enough. We propose Reinforcement Learning with Verifiable Beliefs (RLVB), which rewards
    the agent for taking further steps while this posterior still allows several answers and for committing once
    the evidence is sufficient. The reward needs no judge, critic or reward model, and it never reads the belief
    line the agent writes before each action. We also introduce Pro Worlds, a benchmark of visual puzzles where
    the agent views a large world through a small window. We evaluate three vision-language models on three benchmarks,
    two of which are never seen in training. RLVB improves the base model in all nine settings, by 17.1% on average.
    Under the outcome reward, GRPO and PPO fall below the base model on average. RLVB also outperforms PPO with
    a process reward from an LLM judge by 9.3% on average while using 1.6 times fewer GPU-hours. The trained agent
    answers with sufficient evidence in 51%, 12% and 74% of the episodes on the three benchmarks, against 8%, 0.4%
    and 36% for the base model. Its accuracy gain therefore comes from answering more often at high levels of evidence.
    The belief line shows how the agent reaches this evidence: it acts on its own belief. It commits at only 0.1
    to 2.2% of the turns at which the evidence is insufficient and its line still names several answers, against
    3 to 68% for the base model.'
