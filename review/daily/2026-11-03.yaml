  abstract: 'Video generation is shifting from end-to-end synthesis toward agentic generation, where planning, tool
    use, and feedback enable coherent, controllable multi-shot videos. In parallel, video world models provide action-conditioned
    observations and predicted futures, serving as interactive environments for agents. We study their intersection
    through the agent harness: an executable runtime that constructs context, exposes tools, maintains state, routes
    feedback, and manages budgets around video models. This report examines three directions. First, agentic video
    generation, where harnesses coordinate scripting, shot planning, asset management, production, and editing,
    alongside the evaluation challenges of these systems. Second, agentic world modeling, where harnesses mediate
    observation, control, execution, and state. We discuss hybrid designs in which game engines or agent-written
    programs maintain world state while video models render observations, and how agents and world models can mutually
    evaluate and improve one another. Third, recursive self-improvement (RSI) in video model development, distinguishing
    output revisions, updates to harness state, generator parameters, and evaluators, and changes to the improvement
    procedure itself. We identify how these improvements feed back into subsequent development. Across these directions,
    we analyze essential agent capabilities, including audiovisual perception, long-horizon planning, memory, code-based
    interaction, feedback-guided control, skill reuse, and multi-agent coordination. We conclude with challenges
    in autonomous video production, lifelong memory, programmable hybrid control, autonomous model development,
    provenance, cost accounting, and evaluation linking video quality and task performance to sustained improvements
    in models and harnesses.'
