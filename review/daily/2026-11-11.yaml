- id: arxiv:2611.10510
  title: 'ReSkill: Selective Self-Improvement for Robot Manipulation'
  announced: '2026-11-07'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
