- id: arxiv:2611.12865
  title: 'Shortcuts and Boundaries: Verifiable RL Misalignment and Contextual Safety Learning'
  announced: '2026-11-09'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12865'
  version: 1
  source_hash: d0fe35beaa65dd40f6b6b20d5a3aab1407db8d4860d3c69fdd4228934e3e23df
