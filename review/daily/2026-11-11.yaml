  abstract: 'We introduce Micius-Flash, a 27-billion-parameter model for engineering with native multimodal input,
    deep reasoning and a 256K-token context window. We design the Micius data pipeline as a knowledge-tree-driven
    data flywheel comprising three stages: knowledge tree construction and expansion, data synthesis, and quality
    validation with hard-example augmentation. From this data, we train expert models for semiconductor knowledge
    and reasoning, hardware coding, and semiconductor multimodal understanding, along with agentic experts. Subsequently,
    we employ Multi-Teacher On-Policy Distillation (MOPD) to supervise training on sequences generated by Micius
    itself, thereby integrating the capabilities of these expert models into a unified model. On more than 20 datasets
    with about 15K records, Micius-Flash averages 64.2% on hardware code benchmarks, 15.0 points above a same-size
    baseline. It scores 62.4% on a semiconductor-specific agent benchmark, exceeding the same-size baseline by 17.2
    points. We further develop Micius Harness for industrial applications, connecting the model to specialized tools,
    including EDA tools and KiCad, as well as execution environments. Case studies in PCB design, chip design workflow
    automation, and software development demonstrate the model''s ability to use tool execution feedback for multi-step
    planning, code debugging, and iterative verification. We release Micius as an open-source model to advance the
    development of agents for science and engineering.'
