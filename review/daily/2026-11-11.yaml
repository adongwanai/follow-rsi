- id: arxiv:2611.10501
  title: 'Sampling Is Not Curiosity: Why LLM Agents Should Investigate'
  announced: '2026-11-07'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.10501'
