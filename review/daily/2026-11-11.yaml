    summary_en: JoMoHa trains an Engineer that generates executable harnesses and a task-solving Solver using task
      outcomes. Historical feedback conditions code proposals, which are validated before execution. Saved programs
      and model checkpoints are selected on validation and frozen for evaluation; program swaps at fixed Solver
      weights examine the contribution of the code. Its coevolution evidence includes retained and reused code artifacts
      beyond model learning, without establishing continual self-modification at deployment or local reruns of every
      cited baseline.
