- id: arxiv:2512.23818
  title: 'Energy-Tweedie: Score meets Score, Energy meets Energy'
  announced: '2025-12-29'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2512.23818'
  version: 3
  source_hash: 9630b89a67032ed9df07ca9f9061d9f3a2570135787b348178e596d60e73db88
  published: '2025-12-29T19:28:50Z'
  updated: '2026-11-07T12:03:15Z'
  hf_daily_dates:
  - '2026-11-10'
  abstract: 'Denoising and score estimation are classically linked through Tweedie''s formula, which relates the
    posterior mean under Gaussian noise to the Stein score of the noisy marginal. In this work, we extend this perspective
    beyond Gaussian noise to a broad class of Gibbs (energy-based) noise distributions, with the generalized Gaussian
    family as an example. We derive the Energy-Tweedie identity: when the denoising posterior is viewed through
    the lens of scoring rules, the path derivative of a kernel scoring rule defined by the noise potential recovers
    the Stein score of the noisy marginal. Thus, the familiar correspondence between Gaussian noise, posterior means,
    squared loss, and Tweedie''s formula is lifted to a distributional correspondence between Gibbs noise distributions,
    full posterior laws, kernel scoring rules, and the Energy-Tweedie identity, which gives a Tweedie-style relation
    for each noise potential. Among its consequences, this identity gives a posterior-samples-to-score route to
    score estimation, yields a principled criterion for estimating unknown noise parameters, and enables diffusion-style
    sampling along user-chosen paths through the noise-parameter space, supplying the score-based perspective on
    recent generative methods trained with scoring rules.'
