  arxiv_id: '2611.12426'
  version: 1
  source_hash: d9c84dc53900bb37a4ae89a255d5dc10622d40698a3318f99b54fad94dc52ca5
  published: '2026-11-09T13:51:18Z'
  updated: '2026-11-09T13:51:18Z'
  hf_daily_dates:
  - '2026-11-11'
  abstract: 'Discrete autoregressive modeling, notably through next-token prediction, has become a cornerstone of
    modern language models. Extending this paradigm to vision allows visual and language models to converge on a
    unified framework, thereby fostering shared methodology and infrastructure. This work investigates a central
    question: how far can a finite discrete vocabulary go in representing the richness of the visual world? We present
    dNaViT, a Discrete Native-resolution Vision Transformer that produces discrete visual primitives analogous to
    language tokens. Built upon a frozen pretrained encoder, dNaViT applies lightweight residual modulation with
    a dual-branch objective to inject reconstruction-aware cues into semantic features. By leveraging grouped product
    quantization, it scales discrete capacity without inflating spatial sequence lengths, while a balanced training
    recipe maintains both semantic and pixel-level information. Consequently, dNaViT functions as a versatile discrete
    visual tokenizer, enabling unified encoding across downstream tasks alongside high-fidelity image decoding.
    Extensive evaluations show that dNaViT matches or exceeds task-specific baselines across 12 visual understanding
    benchmarks, 4 generation benchmarks, and an image editing benchmark. These findings demonstrate that a compact
    discrete vocabulary can serve as a universal visual currency and unlock the full potential of fully unified,
    native multimodal methodology.'
