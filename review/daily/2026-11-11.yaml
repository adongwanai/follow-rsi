- id: arxiv:2611.13001
  title: 'One Table, Many Queries: Benchmarking Generalist Tabular Models Across Generation, Imputation, and Prediction'
  announced: '2026-11-08'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.13001'
  version: 1
  source_hash: 3d64b33d95d20b4b55191620cadb73f702bd0d1284313da16cae234f2c7e0241
