  llm_primary: ''
  decision: reject
  arxiv_id: '2611.13885'
  version: 1
  source_hash: b667748ef24edf1ad19a26b48290c906405600f59523d245d6f34e7affba97c7
  published: '2026-11-10T10:47:06Z'
  updated: '2026-11-10T10:47:06Z'
  hf_daily_dates:
  - '2026-11-11'
  abstract: 'Interpretability demonstrations often show that intervening on a group of neurons changes a model''s
    answer. A recent example removes an 18-neuron group in Qwen3-32B and the model answers "Simba" instead of "Scar"
    to a two-hop Lion King riddle. Such a demonstration establishes that the group matters, but not how much of
    it is necessary, whether other groups could do the same, or whether the effect carries over to other inputs.
    We ask: when intervening on a group of neurons changes a model''s answer, how much of that group is actually
    necessary? For every selected group we measure all 4,096 subsets of 12 MLP neurons. On a two-alternative capital
    task (Qwen3-0.6B), zero-ablating 12 selected neurons lowers the answer margin by 27% while random neurons barely
    change it, yet replacing the same neurons with their values from other questions also barely changes it: their
    activations are nearly constant across questions, and we find no evidence that they carry question-specific
    content. On two-hop relation chains, patching 12 neurons with activations from the first-hop question shifts
    the answer to the bridge entity (from Scar to Simba): the greedy answer starts with the bridge in 9/11 chains
    for Qwen3-1.7B, 9/11 for Llama-3.2-1B and 8/10 for Gemma-3-1B; random neurons never do. The full group is rarely
    necessary: a few neurons often suffice, and in many chains disjoint subsets each flip the answer on their own,
    in an exploratory analysis most often when the model is less confident. Group effects transfer to rephrasings
    of the same chain but are much weaker on other tested chains. We study neuron-level causal interventions and
    alternative subsets; we do not recover the full connectivity of circuits.'
