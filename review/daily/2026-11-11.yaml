- id: arxiv:2611.09501
  title: 'e-means: outperforming k-means (in one-tenth the epochs)'
  announced: '2026-11-06'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.09501'
  version: 1
  source_hash: 035ee54053f7721c9b0916fbaa60af414c9773b3c721c08006067c25e1c1c07b
  published: '2026-11-06T14:22:43Z'
  updated: '2026-11-06T14:22:43Z'
  hf_daily_dates:
  - '2026-11-10'
  abstract: Lloyd's k-means algorithm is a long-running standard for clustering, with applications in data analysis,
    retrieval, quantization and data curation. In this paper, we introduce an exponential moving average optimization
    procedure for k-means with mini-batch updates, powered by modern deep learning machinery and new insights. We
    also establish scaling laws on how decay rate and batch size impact final performance. This gives us a formulaic
    rule to fix them for multiple problem sizes and embedding datasets, without the need for any hyperparameter
    sweep. The resulting clustering algorithm, coined e-means, is much faster than Lloyd k-means and converges to
    lower losses, frequently even beating k-means++. On a wide array of embeddings datasets, it beats the loss of
    Lloyd k-means at 25 epochs in 1.4 to 2.6 epochs, which translates to 10-45x GPU wall-clock speedups compared
