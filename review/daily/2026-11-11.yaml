  updated: '2026-11-09T13:43:37Z'
  hf_daily_dates:
  - '2026-11-11'
  abstract: 'While modern video generative models achieve remarkable visual fidelity, they remain noticeably brittle
    when generating physically plausible dynamics and complex interactions. Targeted post-training is crucial, yet
    supervised fine-tuning suffers from offline state mismatch, and reinforcement learning is hindered by sparse,
    ill-defined physical reward functions. On-Policy (Self-)Distillation (OPSD) reconciles on-policy rollouts with
    dense corrective feedback, shifting the core challenge to designing effective privileged context. However, conventional
    modalities fall short: text prompts are inherently declarative, whereas real reference videos heavily entangle
    physical laws with visual appearance without parametric control. To this end, we propose PhysOPSD, introducing
    executable code as privileged physical context for video generation. Unlike static visual observations, executable
    code instantiates an editable physical world with intrinsic abstraction and controllability. Powered by PhysOPSD-Engine,
    we translate real-world physical scenarios into verifiable simulation programs. PhysOPSD then incorporates (i)
    dual-level physical privilege to bridge the information gap via an intermediate bottleneck, alongside (ii) controlled
    physical variations under shared rollout noise to expose causal dynamic shifts. Extensive experiments demonstrate
    that PhysOPSD substantially improves physical plausibility across diverse backbones, outperforming SFT and RL
    baselines with only $3$K samples, while preserving general video generation quality.'
