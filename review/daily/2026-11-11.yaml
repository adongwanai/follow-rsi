- id: arxiv:2611.14320
  title: 'Don''t Just Trust Your Memory: Evidence-Linked Memory Reduces Memory-Induced Degradation in LLM Agents'
  announced: '2026-11-10'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.14320'
  version: 1
  source_hash: 0fd8290e1a3567a2c9ecb9fb7a88d408de54347ad784534b22e18b5e4cf76ab8
  published: '2026-11-10T16:46:59Z'
  updated: '2026-11-10T16:46:59Z'
  hf_daily_dates:
  - '2026-11-11'
  abstract: External memory enables LLM agents to improve from experience by distilling trajectories of past tasks
    into concise lessons for new tasks. However, memory can also lead to memory-induced degradation, where an agent
    fails on tasks it would solve without memory, often because it follows a lesson that is incorrect, or misapplies
    or misreads a valid one. This is because lessons are inferred from trajectories labeled only with task success
    or failure, yet are typically provided without the trajectories they came from, leaving the agent no way to
    check them. To address this, we introduce WikiTrace, an evidence-linked memory system designed to let agents
    check each lesson against its original trajectory. Specifically, motivated by the finding that a trajectory
    often still holds the evidence needed to catch an erroneous lesson, WikiTrace stores each lesson as a concise
    insight linked to a summary of why its trajectory succeeded or failed and to the raw trajectory itself. Then,
    on a new task, the agent starts from all insights and, whenever one lacks details needed to act, conflicts with
    another, or comes from a failed task, descends through its links with terminal tools to fill in missing details
    or correct the insight before acting. We validate WikiTrace on five agentic benchmarks, showing that it consistently
    outperforms existing memory approaches and a baseline given the same insights alone, while also reducing memory-induced
    degradation. Our code is available at https://github.com/yukyeongleee/wikitrace
