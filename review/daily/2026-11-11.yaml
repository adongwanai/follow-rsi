  abstract: Dexterous manipulation requires rich spatial foresight over both the surrounding scene and the robot
    hand. Existing world-action models often acquire such predictive knowledge through explicit future prediction.
    We introduce DexForesight, a framework that learns spatial foresight implicitly by injecting dynamics-aware
    world representations into the latent space of a dexterous policy. During training, DexForesight learns an action-conditioned
    spatial world model from offline scene depth, kinematic hand geometry, and demonstration trajectories. The world
    model predicts 3D hand-point motion and visual feature changes, capturing both articulated hand dynamics and
    scene changes under demonstrated actions, including the motion of fingers occluded from the cameras. We then
    freeze the world model and align policy queries with its predictive world queries, transferring the learned
    spatial dynamics into policy latents and using them to condition action generation. At deployment, only the
    policy is retained, operating on RGB observations, language, and robot state without depth input or explicit
    future prediction. On 11 DexJoCo simulation tasks, DexForesight improves the overall success rate of the base
    policy from 49.4% to 60.5%. On three real-robot dexterous manipulation tasks, DexForesight achieves 58.3% success,
    compared with 50.0% for the strongest baseline. Project page https://dexforesight.github.io/
