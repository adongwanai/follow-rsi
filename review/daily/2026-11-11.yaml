  hf_daily_dates:
  - '2026-11-10'
  abstract: Large language model (LLM) agents are extending agent-mediated commerce on the Web from shopping for
    consumers to operating businesses for sellers. In online-to-offline (O2O) commerce, decisions are issued through
    Web-based platforms but realized through costly physical execution. Evaluating such agents requires going beyond
    individual transactions to ask whether decisions made online turn into sustained economic returns. We introduce
    AutoVend, a benchmark in which one LLM agent manages 20 vending machines across five site types through a Web-based
    operating interface for 180 simulated days. Its data-grounded simulator combines a shared warehouse, procurement
    lead times, paid replenishment, inventory expiration, and recurring operating costs. We evaluate five LLM agents
    against a rule-based inventory-control baseline and diagnose their site coordination, execution, and performance
    over time. Four of five evaluated LLM agents fall short of this baseline, and returns per dollar of inference
    cost rank models differently from returns alone. Operational analyses show that gains in individual metrics
    do not consistently yield stronger economic growth, as inventory and execution costs erode these gains. Trajectory
    analysis further reveals difficulties in grounding feasible actions, managing inventory commitments, and converting
    feedback into effective policy revisions.
