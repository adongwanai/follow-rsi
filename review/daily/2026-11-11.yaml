  updated: '2026-11-09T18:52:20Z'
  hf_daily_dates:
  - '2026-11-11'
  abstract: Reinforcement learning (RL) can improve an agent's task capability while reinforcing behavior that violates
    contextual execution requirements. We study this reward-driven misalignment, including reward hacking, through
    verifiable reward--context conflicts, where compliant task completion remains feasible while some executable
    shortcuts earn more reward than every compliant strategy. Encoding these conflicts in task dynamics lets us
    generate diverse interactive environments at scale and derive compliance feedback from execution histories.
    In resource and reporting workflows, task optimization increases real productivity through unauthorized resource
    use or raises reported scores while actual work declines. Controlled changes in the training distribution show
    that minority conflict exposure can still lead to widespread shortcut acquisition, reaching 97.9\% certified
    profitable violations on an API task under a 25\% conflict mixture after 128 updates. The same contextual checks
    supply a simple binary penalty that supports joint capability and compliance gains and partially mitigates acquired
    violations. Learned safety adapts to expanded authorization and transfers across mechanisms into workflows with
    evolving evidence and approval requirements. On 32 unseen changing-evidence tasks, resource-trained safety increases
    safe completion from 53.1\% to 89.1\% relative to task-only training, while both policies achieve full real
    work. These results connect a verifiable account of reward-driven misalignment with scalable task construction
    and safety learning that remains useful under changing execution requirements.
