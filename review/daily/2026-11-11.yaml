  hf_daily_dates:
  - '2026-11-11'
  abstract: 'While multimodal agents now carry out complex data analysis with tools, their ability to turn decades
    of satellite imagery into reliable land-change analysis, crucial for Earth observation science, remains unmeasured.
    Existing benchmarks fall short: they pose questions on curated images or give agents preprocessed inputs, leaving
    out the raw multi-sensor archives where such analysis begins. We introduce EarthRecord, a benchmark built on
    the raw record of 56 sites: four decades of Landsat, MODIS, VIIRS, and Sentinel-2 data, with cloud masking and
    cross-sensor harmonization left to the agent. It poses 238 land-change questions across ten analysis tasks,
    scored against withheld references from global products, agreement among methods, and visual interpretation.
    Two controls test what answers rest on: the closed book removes the record, and instrument pairs alter one satellite''s
    data while nothing changes on the ground. Evaluations of twelve multimodal agents reveal that leading agents
    complete most analyses end to end but falter when an answer requires mapping from imagery. Further analysis
    shows that the record moves answers from prior knowledge to the pixels but not yet to the real change on the
    ground: when one satellite''s data are altered, half of the right answers follow the alteration. EarthRecord
    thus provides a principled platform for measuring and advancing agents from pixels to land change.'
