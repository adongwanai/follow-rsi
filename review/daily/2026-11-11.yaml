- id: arxiv:2611.10649
  title: 'MACaQ: Fast, Model Agnostic Calibrated Quantization for Low-Precision Weights and Activations'
  announced: '2026-11-07'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.10649'
  version: 1
  source_hash: 05d84c8be96534a078a6b88390ce55a926000703688b8a2a6d8552fd4e57a11c
  published: '2026-11-07T10:49:02Z'
  updated: '2026-11-07T10:49:02Z'
  hf_daily_dates:
  - '2026-11-11'
  abstract: Weight-activation quantization can reduce the memory and compute cost of neural-network inference, but
    recent methods often require expensive optimization and architecture-specific propagation of basis transforms
    across layers. We introduce MACaQ, an MXFP4 W4A4 post-training quantization method that treats every linear
    layer independently. MACaQ applies a per-channel scale and a block-Hadamard transform online to each layer's
    activations, while absorbing the corresponding inverse transforms into its weights. Retaining these transforms
    online avoids cross-layer dependencies and enables a simple streaming implementation of the quantization process,
    in which only one layer must reside in memory at a time. To improve over round-to-nearest quantization, we introduce
    Flip-Refinement, a Hessian-aware coordinate-descent procedure that greedily moves individual FP4 codes to adjacent
    representable values. Despite executing the activation transforms at inference time, MACaQ adds only 2.3% end-to-end
    overhead over pure MXFP4 on Qwen3-32B in vLLM. MACaQ reaches lower perplexity than DuQuant++ and MR-GPTQ, and
    already matches their best perplexity on Llama-3-8B in 11 times less quantization time. We further apply MACaQ
    without architecture-specific modifications to an image diffusion model, illustrating the generality of its
    layer-local design and show quantization of a 122B parameter model in 64 minutes, using only 32.5GB GPU RAM.
