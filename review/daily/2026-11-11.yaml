  abstract: Protein engineering requires navigating rugged fitness landscapes, where small sequence changes can
    produce large functional differences, but experimental screening can only sample a small fraction of sequence
    space. Thus, a central challenge is to efficiently traverse the large combinatorial space of mutations in silico.
    We introduce ProTEUS, a mutation-resolved world model for closed-loop protein evolution. Pretrained on deep
    mutational scanning assays, ProTEUS learns a joint representation of sequence, evolutionary, and structural
    information using MutationFormer, a mutation-biased attention architecture. Variants are represented as states
    in this joint latent space, and mutations define actions whose functional consequences are predicted. To support
    exploration of many mutants, we developed a fast, physics-constrained all-atom predictor that utilizes explicit
    geometric constraint enforcement to achieve >10 fold increase in speed than AlphaFold3 with guaranteed physical
    validity. Lastly, ProTEUS refines its prediction and understanding of protein activity through closed loop experimental
    feedback to guide evolution toward a desired phenotype. ProTEUS surpasses established models in both zero-shot
    and supervised fine-tuning mutation prediction tasks. We experimentally demonstrate its utility in two closed-loop
    multi-objective engineering campaigns on aldehyde dehydrogenase and levansucrase, yielding variants with >10
    fold higher activity than wild type. ProTEUS provides a world-model framework that connects virtual evaluation
    of mutational outcomes with experimental learning for efficient protein evolution.
