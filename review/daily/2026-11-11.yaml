- id: arxiv:2611.11912
  title: 'LO-World: Unified BEV Latent Modeling for Joint 4D Occupancy and LiDAR Forecasting'
  announced: '2026-11-09'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
