- id: arxiv:2611.12411
  title: 'PhysOPSD: Code as Privilege for Physically Plausible Video Generation'
  announced: '2026-11-09'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12411'
  version: 1
  source_hash: 6315fa5a51a600f5ae1aefb400d53d60b5e3446123a36be82497bf06194fc3a9
