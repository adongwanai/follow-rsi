  abstract: We present TorchCurves, a PyTorch library that treats vector-valued parametric curves as learnable primitives.
    Its central operation maps batches of scalar inputs to points on curves represented in B-spline or Legendre
    polynomial bases, with differentiation through both inputs and coefficients. Curve coefficients can be optimized
    jointly with the surrounding model or produced by another network. The library provides trainable modules, reusable
    basis modules, and a functional interface, supporting applications ranging from continuous feature embeddings
    to Kolmogorov-Arnold networks and functional regression. Its implementation combines classical evaluation algorithms
    with vectorized PyTorch operations, emphasizing readability and maintainability without custom hardware kernels.
    Timing experiments compare curve evaluation against NumPy and SciPy and KAN training against EfficientKAN across
    a range of problem sizes. The results illustrate where this generality remains computationally practical and
    where overhead is substantial. Library is available on GitHub at https://github.com/alexshtf/torchcurves.
