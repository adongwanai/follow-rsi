  hf_daily_dates:
  - '2026-11-10'
  abstract: This paper studies retrieval-augmented generation (RAG), which leverages external knowledge to improve
    the performance of language models. Despite the remarkable progress, current RAG approaches are still far from
    satisfactory due to inadequate retrieval and potential hallucinations. Towards this end, we propose a novel
    approach named Task Refinement with Individual Optimization (TRIO) for RAG. The core idea of our TRIO is to
    equip three well-designed agents with an iterative refinement paradigm by aligning their individual optimization
    objectives. Specifically, we first expand ambiguous queries with a query extension agent and quantify the reward
    based on the improved answer quality, which can be utilized to refine our agent for higher expansion efficiency.
    To enhance the retrieval quality, we include a unanimity voting to annotate the expanded query as insufficient
    or sufficient, and their generative outcomes are utilized as ground truth to optimize the judge agent. To further
    improve evidence utilization and answer accuracy, an answer agent is optimized with dynamic matching-based rewards
    with curriculum learning for final outputs. Extensive experiments across multiple benchmark datasets validate
    the effectiveness of the proposed TRIO in comparison with state-of-the-art approaches. Our code is available
    at https://github.com/yingtaoren/TRIO.
