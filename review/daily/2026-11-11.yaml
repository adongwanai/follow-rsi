- id: arxiv:2611.12184
  title: 'Blind Variation, Selective Retention: Improving Creative Idea Generation in AI Scientists'
  announced: '2026-11-09'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12184'
  version: 1
  source_hash: 1d2be7a68e8e996ca6e8c5e860f723f8933322beac885e9f78424232caa476b6
  published: '2026-11-09T10:36:38Z'
  updated: '2026-11-09T10:36:38Z'
  hf_daily_dates:
  - '2026-11-11'
  abstract: 'Scientific discovery requires ideas that are original, useful, and non-obvious. Yet AI scientists are
    typically given as much task information as possible during idea generation, which can anchor generation toward
    familiar approaches. Inspired by the cognitive framework of Blind Variation and Selective Retention (BVSR),
    we propose a discovery framework that separates these two roles of information: it generates proposals under
    deliberately limited task information to broaden exploration, then learns from proposals previously verified
    on the same task and their outcomes to retain promising candidates for costly empirical evaluation. We evaluate
    BVSR across five proposer models and 12 scientific tasks. Limiting task information substantially increases
    proposal originality and non-obviousness, and produces a larger share of highly creative and high-utility proposals
    than existing state-of-the-art prompting-based baselines. Learning from prior proposal outcomes on the task
    further improves candidate selection, discarding half of the candidates while retaining most top-performing
    proposals. When incorporated into existing AI-scientist workflows, BVSR achieves stronger discoveries across
    gene expression analysis, drug response prediction, anomaly detection, scaling law discovery, and brain activity
    prediction. These results suggest that effective AI scientists should use information differently across stages
    of discovery: constrain task-specific information during exploration while exploiting accumulated empirical
    experience on the task.'
