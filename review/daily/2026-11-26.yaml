  abstract: 'NitroGen is an open vision-action foundation model for game control. It is trained by behavior cloning
    on online gameplay videos. In this paper, we study the frozen controller in Hollow Knight and Trackmania as
    examples along three dimensions: action adaptation, visual instruction following, and spatial exploration. Our
    results indicate that NitroGen can adapt its actions to local context, but it lacks the planning, recovery,
    and exploration needed for longer-horizon game control.'
