- id: arxiv:2611.34128
  title: 'FoundSurface: Feedforward Ray-Based 3D Scene Surface Reconstruction from Unposed Images'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34128'
  version: 1
  source_hash: 0e36a5b25de21d7cb448a6d1db3bf2918f592e3c1aad349eb8736d36bb25d7d5
  published: '2026-11-25T10:30:24Z'
  updated: '2026-11-25T10:30:24Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: Accurate 3D surface reconstruction from unposed images remains a fundamental challenge in computer vision.
    Recent feed-forward pointmap methods eliminate the need for camera poses but inherently produce discrete, sparse
    representations. In this paper, we present a generalizable pipeline that directly recovers continuous, high-fidelity
    3D surfaces from unposed images by seamlessly integrating pointmap- and ray-based representations. Our approach
    first extracts explicit geometric priors using a pre-trained pointmap model. A query-view-centric selection
    module then identifies geometrically relevant reference views via a robust surfel voting mechanism. Next, a
    cross-attention regressor bridges target query rays with reference features to estimate a continuous coarse
    surface. Lastly, a raylet-based module aggregates local 3D features to carve out high-frequency details and
    analytical normals. Trained as a single foundation model on 9 diverse datasets, our method demonstrates exceptional
    zero-shot generalization on 6 unseen datasets, clearly surpassing state-of-the-art baselines in geometric accuracy
    and detail preservation.
