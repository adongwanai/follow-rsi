- id: arxiv:2611.30895
  title: 'Speak When You See It: Proactive Task Assistants Should Wait for Evidence, Not the Clock'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.30895'
  version: 1
  source_hash: 92f5479f8d024b0a540a1b7c7a6150cde83711695544c00cbb6a8ca65f785067
  published: '2026-11-23T15:57:25Z'
  updated: '2026-11-23T15:57:25Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: 'Proactive assistants that guide people through physical tasks must decide, every few seconds, whether
    a step is complete and whether a mistake has occurred. We find that two benchmarks for this task largely reward
    knowing when rather than seeing what: a timer that never looks at the video, raising an alarm at 25 s and confirming
    each step at 30 s, reaches a mistake F1 of 0.373 on Ego-MC-Bench, above every published result (at most 0.27).
    We formalize this as the video-blind frontier, the best trade-off between completion accuracy and mistake F1
    that policies reach from the elapsed time, the instruction and training statistics alone: every published per-step
    result on Ego-MC-Bench lies inside it, and so do all twelve zero-shot models we run on QICD. To move beyond
    it, we introduce Evidence-Contrastive Training (ECT): fine-tune on the benchmark''s own questions, and pair
    its positives with negatives from the same recording at the same elapsed time, so that elapsed time cannot separate
    the two sides of a pair. Trained on 209 QICD videos in about 15 GPU-hours, a 2B model with ECT crosses the frontier
    on both benchmarks in all four seeds; transferred to Ego-MC-Bench without adaptation, it confirms 59% of mistake-free
    steps in time, against 30% for a published model with the same backbone trained on about 25k synthetic counterfactuals
    and real recordings. Its decisions follow the video beyond what timing explains: at equal elapsed time it tells
    a finished step from an unfinished one in 90-92% of test pairs, where the instruction''s typical duration reaches
    65%, rescaling the time stamps between the frames leaves it essentially unchanged, and swapping in another recording,
    of the same recipe where one exists, cuts its completion accuracy by two thirds. The code and model weights
    will be publicly released.'
