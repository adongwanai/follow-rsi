- id: arxiv:2611.33457
  title: Playfulness as Feedback for Agentic Game Development
  announced: '2026-11-24'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.33457'
  version: 1
  source_hash: ff97ac925ed0dba15a33afd1e4764aa2ac3c8d7404d6b9a5ff79d91a37513093
  published: '2026-11-24T21:30:09Z'
  updated: '2026-11-24T21:30:09Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: 'Coding agents can generate runnable games from natural-language descriptions. However, a runnable game
    does not guarantee an excellent gameplay experience for players. In our view, a playful game should provide
    1) reliable core functionality, 2) appealing visual design and assets, and 3) rich gameplay that supports exploration
    and progression. How agents can improve these aspects of playfulness remains underexplored. In our work, we
    propose Play2Evolve, a recursive game development framework with three stages: Initialization, Refinement, and
    Evolution. Using playfulness as feedback, agents playtest the game and diagnose issues in its functionality,
    visual presentation, and gameplay. Their feedback guides bug fixes and asset improvements. It also helps agents
    propose new gameplay and aesthetic goals for continued game evolution. To enrich game materials, we combine
    a video generation model with code to create appealing static and dynamic assets and integrate them into interactive
    gameplay. Finally, Play2Evolve achieves state-of-the-art performance among the evaluated methods, scoring 60.05
    on GameCraft-Bench compared with 50.81 after Game Initialization and 52.46 for Play2Code. Human overall-quality
    ratings reach 3.67, compared with 2.38 and 2.43, respectively. Our code will be released at https://github.com/showlab/Play2Evolve.'
