- id: arxiv:2611.34811
  title: 'HOG-WAM: Improving Visual Robustness through Future Gradient Prediction'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34811'
  version: 1
  source_hash: 7a51cf58bad1912353c0fc7fc1801ca3f5faeeb1088496a556ea7b164e239908
