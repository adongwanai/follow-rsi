- id: arxiv:2611.34064
  title: 'SPARC: Geometry-Guided Attention Pruning for Long-Horizon Camera-Controlled Video Generation'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34064'
  version: 1
  source_hash: 3ac7f7555bffc2ff511b174b93896c0714a8007ba3e63c021ff8ce79c014dc05
  published: '2026-11-25T09:38:00Z'
  updated: '2026-11-25T09:38:00Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: We present SPARC, a geometry-guided attention pruning framework that turns the native self-attention
    of pretrained video diffusion transformers into a unified mechanism for camera control and persistent scene
    memory. Our key insight is that attention connectivity can simultaneously serve as geometric conditioning for
    camera control and spatial addressing for historical memory retrieval. Motivated by the asymmetric contextual
    requirements of reconstructing observed content and synthesizing novel regions, SPARC restricts observed tokens
    to geometrically corresponding historical tokens and local spatiotemporal context, while preserving dense attention
    for unobserved regions. Correspondence-aware attention biasing and order-invariant historical positioning further
    enable stable retrieval across long temporal gaps. Without introducing additional learnable control or memory
    modules, SPARC achieves precise camera adherence and faithful scene revisitation while substantially reducing
    attention computation. Extensive experiments demonstrate the effectiveness of aggressive attention pruning in
    improving camera adherence, revisit consistency, and visual fidelity, with an inference speedup of over 50x
    when combined with four-step distillation. Project page is available at https://zju3dv.github.io/SPARC.
