  source_hash: 5363ba465ef3875de90139ce89904bfac80f9a7304295d02fba44973f788b56d
  published: '2025-09-09T17:53:58Z'
  updated: '2026-03-10T12:28:26Z'
  hf_daily_dates: []
  abstract: 'We introduce SimpleQA Verified, a 1,000-prompt benchmark for evaluating Large Language Model (LLM)
    short-form factuality based on OpenAI''s SimpleQA. It addresses critical limitations in OpenAI''s benchmark,
    including noisy and incorrect labels, topical biases, and question redundancy. SimpleQA Verified was created
    through a rigorous multi-stage filtering process involving de-duplication, topic balancing, and source reconciliation
    to produce a more reliable and challenging evaluation set, alongside improvements in the autorater prompt. On
    this new benchmark, Gemini 2.5 Pro achieves a state-of-the-art F1-score of 55.6, outperforming other frontier
    models, including GPT-5. This work provides the research community with a higher-fidelity tool to track genuine
    progress in parametric model factuality and to mitigate hallucinations. The benchmark dataset, evaluation code,
    and leaderboard are available at: https://www.kaggle.com/benchmarks/deepmind/simpleqa-verified.'
