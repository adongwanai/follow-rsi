- id: arxiv:2611.34331
  title: 'Puzzling-Bench: Evaluating Language Models on 23,777 Human-Written Puzzles with Community-Verified Answers'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34331'
  version: 1
  source_hash: a7a06349ed6172b11d23a5c1838e57b3cb0b100ec5b91cd6fd101e1a9dfb9aa6
  published: '2026-11-25T13:10:49Z'
  updated: '2026-11-25T13:10:49Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: 'We introduce Puzzling-Bench, a benchmark of 23,777 puzzles with community-verified answers drawn from
    the Puzzling Stack Exchange archive (2014-2026): riddles, ciphers, logic grids, lateral-thinking problems, wordplay
    and recreational mathematics, a third of them with images. Every puzzle carries the answer accepted by its author,
    a short reference answer taken from it (LLM-extracted for the evaluation sets and checked on a 50-puzzle human
    review), the author''s own hints, community tags and a creation date, so that the benchmark supports hint ablations,
    category analysis and a rolling post-cutoff slice (254 puzzles posted after the training cutoff of six of the
    nine models we evaluate, including the best one) as a contamination check. We evaluate nine frontier and open
    models with a two-tier scorer (normalized exact match, then an LLM judge) and validate the judge with three
    judges from two model families: they agree on 95-97% of verdicts (kappa 0.82-0.96), move no model by more than
    1.6 points, and show no own-family preference. The best model, GPT-6.1, reaches 74.8% on a shared 255-puzzle
    set; a hard core of 17 puzzles defeats all nine models; model failures are strongly correlated, and the second-best
    model contributes a single puzzle to a greedy ensemble, yet an oracle over all nine reaches 91%. On a 100-puzzle
    multimodal pilot, withholding the question''s image costs the two best models 24 and 35 points. We release the
    dataset, the scoring pipeline and all per-row provenance.'
  llm: {}
  summary_zh: ''
