- id: arxiv:2409.12941
  title: 'Fact, Fetch, and Reason: A Unified Evaluation of Retrieval-Augmented Generation'
  announced: '2024-09-19'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: ''
