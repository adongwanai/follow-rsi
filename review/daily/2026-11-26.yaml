  - '2026-11-26'
  abstract: World-action models jointly predict future observations and actions, yet visual corruption can disrupt
    the resulting policies. We introduce HOG-WAM, which adds future Histograms of Oriented Gradients (HOG) as structural
    supervision derived directly from demonstration images. An auxiliary HOG diffusion transformer (DiT) module
    reads RGB features through asymmetric attention, allowing its objective to shape the visual representation used
    for control. The module is used only during training and removed at inference, preserving FastWAM's RGB-to-action
    architecture. We evaluate four controlled observation corruptions through a visual-corruption extension of RoboTwin,
    termed RoboTwin-Plus; HOG-WAM achieves the highest success among the compared policies under all four. Mixed-noise
    success increases from 78.86% to 82.86% relative to FastWAM, with comparable performance on clean scenes. On
    LIBERO Plus, overall success increases from 74.49% to 75.26%, with the largest gain under sensor noise, from
    74.14% to 78.89%. Across four Franka tasks, average success increases from 40% to 59% under clean observations
    and from 17% to 24% under noisy observations. A representation ablation favors combining RGB observations with
    auxiliary HOG prediction over replacing RGB with HOG. These findings support future-gradient prediction as complementary
    supervision for visually robust control, with larger absolute gains on physical tasks than in simulation. Code
    is available at https://github.com/iPPLab/HOG-WAM.
