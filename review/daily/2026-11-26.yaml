- id: arxiv:2611.34675
  title: 'RoboEvo$^2$: Recursive Robot Self-Improvement via Harness-Policy Co-Evolution'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.34675'
  version: 1
  source_hash: 09e82941c0a6a243160cea2154092d8b0d0ef6f6561cfbc0ed2046db66d85a3d
  published: '2026-11-25T16:39:10Z'
  updated: '2026-11-25T16:39:10Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: Robots should adapt to unfamiliar environments and acquire new skills through interaction, then execute
    those skills efficiently with practice. Vision-language-action policies provide efficient control, but often
    need additional human demonstrations to handle unfamiliar settings; reasoning agents can discover solutions
    using broad prior knowledge and robot-control APIs, but repeated deliberation and repair are costly. Inspired
    by human learning through reasoning and practice, we propose RoboEvo$^2$, a framework for recursive harness-policy
    co-evolution. In Policy-to-Harness (P2H) evolution, policy failures guide a coding agent to search complementary
    Code, Code+ICL, and Code+Policy routes, consolidating verified solutions into reusable skills, routing strategies,
    and experience memory. In Harness-to-Policy (H2P) evolution, verified trajectories provide supervised training,
    while Counterfactual Preference Distillation (CPD) teaches the policy to favor successful corrections over failures
    from the same starting state. The improved policy provides stronger motor skills for subsequent search, while
    its remaining failures redirect harness evolution, closing the reciprocal loop. Through recursive co-evolution
    without additional human demonstrations, RoboEvo$^2$ improves standalone success from 11.0% to 84.1% and hybrid
    success from 30.4% to 90.5% on LIBERO-PRO, with similar gains and reduced agentic costs on RoboTwin C2R. Further
    experiments demonstrate autonomous task acquisition, cross-embodiment harness transfer, and 95.0% hybrid success
    on the Unitree G1-D. Our models and code will be publicly released.
