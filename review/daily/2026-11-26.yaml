  - '2026-11-26'
  abstract: Knowledge-intensive video generation remains challenging because prompts often omit the facts, appearances,
    and temporal relationships required for accurate generation. While search-based workflows can retrieve missing
    evidence, manually designed strategies limit adaptive planning, and conventional training suffers from costly
    video-level feedback and coarse trajectory-level credit assignment. In this paper, we present Loupe, a video
    generation agent that retrieves and verifies textual and visual evidence to construct evidence-grounded temporal
    video prompts with reference images. We further introduce Rubric-Based Credit (RBC), which leverages prompt-specific
    factual, visual, and temporal requirements to evaluate intermediate search and planning decisions before video
    rendering. Building on RBC, RBC-SFT reweights assistant-token learning by step quality, while RBC-GRPO incorporates
    step-level credits alongside a final planning reward, without rendering videos during RL. To address the lack
    of dedicated search-oriented evaluation, we construct Search-VBench, which contains 150 held-out prompts across
    seven categories. Experiments show that Loupe improves all four evaluation dimensions across three video generators,
    raising the overall score of MiniMax-H3 from 32.80 to 70.67 and outperforming an untrained search workflow.
    Ablation experiments show that full RBC training outperforms standard SFT followed by trajectory-level GRPO
    by 5.27 points. Human evaluations and results on Sci-VBench and KIVI-Bench further demonstrate improved generation
    quality, scientific grounding, factual precision, and helpfulness. Our project page is available at https://zengkaiya.github.io/Loupe/.
