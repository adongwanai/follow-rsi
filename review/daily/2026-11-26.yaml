- id: arxiv:2611.34147
  title: 'Letting Models Manage Their Own Context: Where We Stand'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34147'
  version: 1
  source_hash: 51df4aa13cfa2548fe19f80bbea8185744082243a26f86ebb2ef273ab9cce1e6
