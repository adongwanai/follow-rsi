  source_hash: 12fd8d6639e5f54db409077cf7fe460de8abdb2884e6904c45c8206da340ac6f
  published: '2026-11-23T10:51:35Z'
  updated: '2026-11-25T15:11:19Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: 'Contrastive decoding (CD) mitigates object hallucination in multimodal large language models (MLLMs)
    by contrasting token distributions under different conditions to adjust token scores. However, existing generative
    and discriminative benchmarks primarily measure final task scores, which can be confounded by candidate filtering,
    changes in generation trajectories, and response biases, making it difficult to isolate the effects of the underlying
    contrastive adjustments. To address these limitations while complementing existing evaluations, we introduce
    CONCOR (Contrastive Correction Evaluation), a controlled benchmark that directly evaluates the competition between
    ground-truth and different types of hallucinated candidates using the Contrastive Grounding Margin (CGM). CGM
    also enables analysis of directional consistency, composition, and reliability of contrastive corrections. Our
    evaluation reveals that existing CD methods exhibit distinct correction behaviors: some consistently favor ground-truth
    candidates, whereas others produce strong corrections but also introduce more errors. Crucially, these differences
    help explain their contrasting responses to increased contrast strength, which improves some methods while degrading
    others. These findings highlight the importance of evaluating the contrastive correction itself, rather than
    relying solely on final-output performance, and CONCOR provides a controlled and interpretable framework for
    understanding and improving CD methods for hallucination mitigation.'
