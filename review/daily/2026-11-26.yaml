  updated: '2026-11-20T15:29:27Z'
  hf_daily_dates: []
  abstract: 'Foundation-model agents are increasingly extending beyond software engineering (SWE) into autonomous
    scientific research, where acquiring and integrating domain knowledge remains a critical challenge. Recent industrial
    advances have increasingly adopted knowledge graphs and ontology-based semantic layers to organize heterogeneous
    knowledge into reusable representations. We ask: Can autonomous agents construct ontologies that help them solve
    real tasks, and do they offer measurable benefits over alternative knowledge representations? Existing benchmarks
    evaluate ontology correctness or agent task success in isolation, leaving the value of autonomously acquired
    knowledge unresolved. We therefore introduce AutoOntologyBench, a task-grounded benchmark comprising 19,947
    audited tasks grounded in 18 real-world knowledge sources across 7 domains, with source-native verification.
    Spanning Application, Repair, Organization, and Construction, AutoOntologyBench compares nine frontier-model
    agents under matched knowledge representations. Layered on retrieval, agent-built ontologies add 6.1 points
    of task success, yet trail an expert-derived reference by 13.0, identifying autonomous knowledge acquisition
    as the bottleneck to scalable scientific research. Code and resources are available at https://github.com/VinyehShaw/AutoOntologyBench.'
