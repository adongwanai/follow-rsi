- id: arxiv:2611.34466
  title: 'EgoUseBench: Benchmarking Computer-Use Agents under Evolving First-Person Contexts'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34466'
  version: 1
  source_hash: 51040d00508ce5a2fe3fce91dcec129c6fa71b601ab64d80b86d761a2ace90f4
  published: '2026-11-25T14:36:38Z'
  updated: '2026-11-25T14:36:38Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: 'AI wearables, such as smart glasses, extend the context available to agents beyond digital environments
    to users'' physical surroundings. With these devices, computer tasks can originate from users'' ongoing activities
    rather than solely from explicit instructions. Through first-person observations, agents can identify objects
    and activities relevant to user requests and ground digital tasks in the surrounding context. We call this interaction
    paradigm Ego Use. However, first-person observations are limited by the wearer''s viewpoint and may provide
    incomplete or ambiguous evidence of ongoing activities. As new observations arrive, agents may need to revise
    their understanding of the physical context and user intent, and reassess whether prior digital actions remain
    valid. Whether current agents can reliably handle these changes remains insufficiently evaluated. We introduce
    EgoUseBench, a benchmark for evaluating Ego Use across three interaction settings with different levels of first-person
    context. Computer-Use relies on explicit instructions, Offline Ego Use provides prerecorded first-person context
    before execution, and Online Ego Use provides continuous observations as user intent evolves. Based on over
    74 hours of real-world first-person recordings, we construct 693 tasks across the three interaction settings.
    To capture task evolution, we track first-person observations, user requirements, and website state separately.
    We further group tasks by how information changes during execution, resulting in three types: Graft (revised
    user requirements), Refresh (new first-person observations), and Clarify (agent-initiated information seeking).
    We evaluate advanced models and find that average success rates in Online Ego Use are 26.3% lower than in Computer-Use.
    This result reveals the difficulty of keeping task execution aligned with evolving first-person context and
    user intent.'
