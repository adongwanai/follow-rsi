- id: arxiv:2611.34912
  title: 'LiveVAE: Causal Window Attention Makes Efficient Streaming Video VAE'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34912'
  version: 1
  source_hash: 90aa47fe7672adccbe8fb5f1b11209a36a1e4729235824751c5bdbfb5cec5bf3
  published: '2026-11-25T18:57:14Z'
  updated: '2026-11-25T18:57:14Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: 'While video diffusion models have grown faster and increasingly streamable, the video VAE remains a
    primary latency bottleneck across interactive generation and editing pipelines. Existing VAEs and their acceleration
    methods rely mainly on heavy convolutions or full frame attention, and most focus only on decoding, leaving
    encoding costly for streaming conditional generation and editing. This raises a natural question: Do video VAE
    encoding and decoding actually require such global spatiotemporal modeling? By analyzing the effective receptive
    fields of pretrained video VAEs, we find that both encoding and decoding a patch rely almost entirely on its
    spatial and temporal neighbors. To exploit this strong locality, we introduce LiveVAE, a streaming encoder and
    decoder built on causal window attention, which cuts per frame compute while keeping the temporal KV cache bounded
    for streaming. Decoupled encoder/decoder distillation followed by joint finetuning preserves the pretrained
    latent space, making LiveVAE a drop-in replacement for the original VAE. On MiniMax-H3, LiveVAE achieves 5.2-6.2x
    faster encoding and 3.0-3.3x faster decoding than the official VAE with higher PSNR. Paired with our dedicated
    inference infrastructure, LiveVAE pushes the speedup to 13.4x with almost no quality loss. Code and models will
    be released.'
