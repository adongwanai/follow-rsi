- id: arxiv:2611.34347
  title: 'AIRIS: Benchmarking Social Embodied Intelligence in Egocentric Streaming Videos'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34347'
