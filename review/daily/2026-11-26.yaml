- id: arxiv:2611.34923
  title: Mixture-of-Loops Transformer
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34923'
  version: 1
  source_hash: 5219d6fa5f6f7905d593ca542a2346b2d92d5d6d3d77c8caa8e584026b10e691
  published: '2026-11-25T18:58:53Z'
  updated: '2026-11-25T18:58:53Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: 'Looped Transformers boost expressivity by reusing shared layers across loops, yet at the cost of efficiency.
    Pushing their expressivity-efficiency frontier requires rethinking the core mechanism connecting adjacent loops:
    What should be passed as a Transformer loops? We introduce Mixture-of-Loops Transformer (MoLT), whose Mixture-of-Loops
    Attention (MoLA) uses keys and values (KV) as memory for selective reuse across depths and loops. Under loop
    residual, MoLT-R retains the residual stream and reads local KV across loops for expressivity. Under loop KV,
    MoLT-KV instead restarts from embeddings and reads current-loop local KV with preceding-loop memory KV at earlier
    positions for efficiency. MoLT-KV eliminates same-position cross-loop dependence and, paired with loop forcing
    for parallel training, unlocks single-traversal Mixture-of-Loops (MoL) decoding beyond the training loop horizon.
    To balance efficiency and quality, we introduce U-shaped MoLT (U-MoLT), which separates memory construction
    from prediction readout and skips unused decoder traversals without changing predictions. In 400B-token pretraining,
    U-MoLT outperforms OLMo3 across 700M/1.5B dense and 3B MoE models, achieving 1.7x validation cross-entropy (CE)
    token efficiency at 700M while improving 3B MoE 10-domain perplexity by 0.75 and 10-task accuracy by 2.1 percentage
    points. In 100B-token continued pretraining of Qwen3.5-0.8B-Base, our U-MoLT adaptation lowers CE on all 11
    domains over the matched baseline with 1.4x mean token efficiency. At inference, U-MoLT with MoL-Hybrid-2 matches
    non-looped OLMo3 latency at 996.6 vs. 1,000.6 ms on S-size (~113M) models. Code is available at https://github.com/hustvl/MoLT'
