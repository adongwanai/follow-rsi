  updated: '2026-11-19T20:18:15Z'
  hf_daily_dates: []
  abstract: 'Molecular dynamics (MD) simulation resolves atomic-scale motion and predicts the structural, mechanical,
    and dynamic properties of materials, making it cen- tral to materials design and discovery. Yet an MD study
    requires an expert-driven workflow: designing the simulation, writing reliable input scripts, executing them,
    and analyzing the results with separate tools. Here we present ChatAtom, a multi-agent large language model
    system that translates a natural-language request into a complete MD workflow without the user writing input
    scripts or analysis code. Each agent has a defined responsibility within the workflow. An orchestrator plans
    the study; the LAMMPS and OVITO agents each use a generator-reviewer pair to prepare and review simulation and
    visualization scripts before execution; a high-performance computing agent dispatches jobs to remote resources;
    and an analysis agent interprets the completed run. The work- flow is accessible through a browser interface
    that streams thermodynamic data and rendered frames during local execution, allowing users to follow the simu-
    lation as it progresses. The architecture also supports new capabilities through loadable skills without modifying
    the agents, enabling autonomous hypothesis generation and testing. We evaluate ChatAtom through script-generation
    bench- marks, an end-to-end study of crack propagation, and a closed-loop campaign. By bringing script generation,
    execution, visualization, and analysis into one reviewed and observable pipeline, ChatAtom lowers the barrier
    to conducting MD studies and broadens access to advanced simulation workflows.'
