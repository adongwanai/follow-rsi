  source_hash: 4d547eca6ab93bb5711a7d2ec2ebdb1e6b95b8d0e186bd577ebdbf2a1893cf1f
  published: '2026-11-24T12:03:35Z'
  updated: '2026-11-24T12:03:35Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: Action-conditioned world models play a vital role in robotics and autonomous driving, yet existing video
    diffusion models struggle to maintain dynamic object persistence. When the camera turns away and returns, out-of-view
    moving entities fail to evolve plausibly in latent space, often mutating or vanishing entirely due to bounded
    perspective views. To resolve this issue, we propose OmniPersist, a unified framework that couples perspective
    video generation with panoramic evolution within a single-stage diffusion model, without relying on auxiliary
    models or initial panoramic inputs. To maintain efficiency, we model the panoramic stream at a lower frame rate,
    bridging both views across space and time via Geometric Anchoring (GeoAnch) for spatial correspondence and Temporal
    Compensation (TemComp) for temporal aggregation. OmniPersist is agnostic to camera-control architectures, supporting
    both latent-level and attention-level conditioning. Extensive experiments on a newly constructed dynamic benchmark
    across image-to-video and video continuation tasks demonstrate consistent gains in visual quality, camera controllability,
    revisit consistency, and dynamic persistence.
