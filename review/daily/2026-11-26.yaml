- id: arxiv:2611.34756
  title: 'Collect for Coverage, Replay with Evidence: Adaptive and Efficient On-Policy Distillation for Long-Horizon
    Agents'
  announced: '2026-11-25'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.34756'
  version: 1
  source_hash: f444b43aac8914cb96a7650034688d822da79e4c3f472d6af169b3eb02878a00
  published: '2026-11-25T17:27:31Z'
  updated: '2026-11-25T17:27:31Z'
  hf_daily_dates:
  - '2026-11-26'
  abstract: Fully online on-policy distillation (OPD) is costly for long-horizon agents because each update depends
    on fresh environment rollouts. Prefix replay offers an efficient alternative by sampling current-student responses
    from stored histories, reducing idle time for long-tail rollouts and allowing each collected trajectory to support
    multiple updates. However, our analysis of the complete prefix replay pipeline identifies two limitations in
    long-horizon settings. In trajectory collection, teacher-only trajectories miss student-induced histories, while
    broader history coverage can reduce teacher reliability. In trajectory reuse, fixed position-based schedules
    cannot identify critical decisions that may occur at any trajectory depth. We introduce CARE-OPD (Collect for
    coverAge, Replay with Evidence) to address both limitations. Student-seeded teacher completions and response-level
    confidence gating expand history coverage while filtering unreliable updates. Hindsight replay allocation then
    uses downstream execution evidence to select consequential turns. Across long-horizon tasks Software Engineering
    and Deep Research, CARE-OPD outperforms online OPD and prior prefix replay baselines. On SWE-bench Verified,
    it raises task success to 59.5% while reducing end-to-end training time by 45% and environment actions by 44%
    relative to asynchronous online OPD.
