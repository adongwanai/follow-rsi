- id: arxiv:2611.27734
  title: 'AutoOntologyBench: A Task-Grounded Benchmark for Agentic Knowledge Engineering'
  announced: '2026-11-20'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
