  abstract: Feature Engineering is the (traditionally manual) process of constructing derived variables from an
    existing dataset by combining, transforming, or otherwise manipulating the original data fields to reduce statistical
    noise and extract meaningful, domain-specific quantities of interest from the raw dataset. Recent work demonstrates
    promising progress toward the au tomation of this process through the integration of large language models (LLMs)
    and various metaheuristics to guide the search for useful features. We build on this approach by introducing
    a novel genetic algorithm that implements selection, crossover, and mutation at the individual feature level,
    rather than at the level of the entire engineered feature set. In doing so, we enable in-process statistical
    analysis of newly-generated features, thereby enabling the genetic algorithm to simultaneously integrate individual
    and group-level feature metrics into its selec tion process. We demonstrate this capability using state-of-the-art
    feature importance metrics, and show that this approach yields superior predictive performance while driving
    meaningful improvements in feature relevance, algorithm robustness, and overall model interpretability.
