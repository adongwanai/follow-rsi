  published: '2026-11-20T13:46:24Z'
  updated: '2026-11-20T13:46:24Z'
  hf_daily_dates: []
  abstract: 'There has been significant recent interest in understanding the behaviour of LLM agents from the perspective
    of human preferences or corpus statistics. In this paper we propose agent states as intermediate variables through
    which post-training can be measured and predicted. From a statistical physics perspective, we study the emergence
    of a global potential which governs the transition of state in LLM agent reasoning. We introduce a partition
    function to model the ideal KL-regularised transition distribution and track potential structure, mean reward
    and state entropy. We demonstrate our approach in two Qwen3.5-9B tasks: safety-test selection and physics-reasoning
    auditing. We observe that the potential structure strengthens during post-training as predicted from our framework,
    while joint changes in reward and state entropy provide consistency evidence. States thus provide a quantitative
    description of how post-training organises agent behaviour.'
