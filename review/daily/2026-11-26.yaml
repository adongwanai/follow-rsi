- id: arxiv:2412.15204
  title: 'LongBench v2: Towards Deeper Understanding and Reasoning on Realistic Long-context Multitasks'
  announced: '2024-12-19'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2412.15204'
  version: 2
  source_hash: 9925bb99c31d154cc5ef34935f378cde60ecbac3bac0a1cb8f44028fc4db5786
  published: '2024-12-19T18:59:17Z'
  updated: '2025-01-03T11:44:51Z'
  hf_daily_dates: []
  abstract: 'This paper introduces LongBench v2, a benchmark designed to assess the ability of LLMs to handle long-context
    problems requiring deep understanding and reasoning across real-world multitasks. LongBench v2 consists of 503
    challenging multiple-choice questions, with contexts ranging from 8k to 2M words, across six major task categories:
    single-document QA, multi-document QA, long in-context learning, long-dialogue history understanding, code repository
    understanding, and long structured data understanding. To ensure the breadth and the practicality, we collect
    data from nearly 100 highly educated individuals with diverse professional backgrounds. We employ both automated
    and manual review processes to maintain high quality and difficulty, resulting in human experts achieving only
    53.7% accuracy under a 15-minute time constraint. Our evaluation reveals that the best-performing model, when
    directly answers the questions, achieves only 50.1% accuracy. In contrast, the o1-preview model, which includes
    longer reasoning, achieves 57.7%, surpassing the human baseline by 4%. These results highlight the importance
    of enhanced reasoning ability and scaling inference-time compute to tackle the long-context challenges in LongBench
    v2. The project is available at https://longbench2.github.io.'
