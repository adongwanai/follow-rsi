- id: arxiv:2611.02822
  title: 'Disen-Forcing: Disentangling Semantic Anchoring from Motion for Autoregressive Video Diffusion'
  announced: '2026-11-02'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.02822'
  version: 1
  source_hash: d258a9debfa611648c0b38227c96e8aaff924bacd18c8456e1a40f9efb62cc6b
  published: '2026-11-02T09:22:39Z'
  updated: '2026-11-02T09:22:39Z'
  hf_daily_dates:
  - '2026-11-16'
  abstract: 'Autoregressive video diffusion models (AR-VDMs) enable real-time, long-horizon video generation but
    degrade rapidly once the inference horizon outruns the training horizon, due to compounding exposure bias. To
    stabilize long rollouts, recent methods heuristically adopt frame sink, keeping initial frames as a persistent
    model context, inspired by attention sinks in LLMs. We revisit this design and find that the mechanism by which
    initial frames stabilize long-range consistency in AR-VDMs is not an LLM-style attention sink; instead, long-range
    consistency is anchored through a sparse subset of attention heads, while the majority of heads predominantly
    capture local temporal dynamics. This observation reveals an over-conditioning pathology in existing frame-sink
    strategies: by universally exposing every head to the pinned initial-frame context, the model becomes prone
    to collapsing motion toward the low-dynamic modes of the teacher during model distillation. We propose Disen-Forcing,
    a distillation-time plug-in for AR-VDMs that disentangles and reinforces this head specialization through disentangled
    context routing and motion-disentangling regularization. On long-horizon video generation benchmarks, Disen-Forcing
    simultaneously improves long-range consistency and motion dynamics of base AR-VDMs, a trade-off that sink-based
    methods fail to balance.'
