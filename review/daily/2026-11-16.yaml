  version: 1
  source_hash: 0e737875c1f700543ae9d582fe4f5953d8bac138f0842046273f799c546780be
  published: '2026-09-30'
  updated: '2026-09-30'
  hf_daily_dates: []
  abstract: Coding agents need to establish that a program satisfies a specification and that the specification
    captures the requested behavior. We study how expert diagnosis of verification failures can become reusable
    guidance for this work. Our approach combines executable language definitions in the K framework with a kit
    of procedures for constructing specifications, repairing proofs, and auditing their adequacy. A human-guided
    development campaign on HumanEval, a benchmark of 164 Python programming tasks, achieves a 164/164 success rate
    with the semantics and the kit, measured by final AI audit Pass verdicts after two targeted repairs. To examine
    whether auditing detects problems that successful proofs leave unresolved, we construct 12 author-reviewed pairs
    of clean and defective packages. Every package passes its K proofs, and completed audits identify all defects
    and accept all clean packages. We then use KleverBench to test specification and proof construction for 31 programs
    with changed operator meanings. Comparisons with complete acceptance rules and equally long generic advice yield
    mixed results across two model and budget settings, motivating further work on selecting useful guidance within
    resource limits. Human-reviewed Optimism proofs establish expected pause reverts for six operations within declared
    input bounds under London semantics with unbounded gas. We report progress, difficulties, and lessons toward
    agents that deliver programs with checkable correctness arguments.
