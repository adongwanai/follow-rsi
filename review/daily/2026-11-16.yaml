- id: arxiv:2611.14505
  title: 'Continual-ARC: Measuring Skill Acquisition over a Working Lifetime'
  announced: '2026-11-10'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.14505'
  version: 3
  source_hash: d3c47698428e74533f8ca7353e96b19206ea5e66f96c01f6b7b79aca8cae2d45
  published: '2026-11-10T18:55:01Z'
  updated: '2026-11-15T00:35:07Z'
  hf_daily_dates:
  - '2026-11-16'
  abstract: 'Agent harnesses have emerged as a promising mechanism for continual learning, alongside test-time parametric
    learning. However, the current benchmarks have several limitations: they generally focus on a single applied
    domain, serve each instance only once, and assume a single family of learner, so memory-based and weight-based
    systems are rarely compared on the same scale. We propose Continual-ARC, a lifelong stream built from the three
    ARC-AGI editions, whose tasks need no domain knowledge. The same tasks return after dormant gaps with fresh
    instances, while new tasks keep arriving. On each instance, the learner may pay for demonstrations, submit answers,
    or act inside the harness, with retries permitted on incorrect submissions, which are paid for. Each instance
    is scored based on the share of this feedback budget consumed. Since a learner may keep anything between instances,
    memory-based and weight-based systems are scored on the same scale. After the stream, the learner is frozen
    and tested on fresh instances of the tasks it met, which measures memorization, and on unseen tasks, which measures
    generalization. We run an agent harness with frozen weights, with and without persistence, on Qwen3.5-9B and
    GLM-5.3 Flash, comparing them with two prompting floors, a program-induction method and Qwen3.5-9B''s weights
    trained to imitate GLM-5.3 Flash. Persistence in the harness generally does not improve memorization unless
    provided with explicit expert guidance. Most harness-based methods still learn less than a floor that simply
    caches each task''s demonstrations, across all models we tested. Harness-based methods gain little or nothing
    on unseen tasks, whereas weight-based learning shows substantial gains. This opens the door to future weight-based
    continual learning that could teach models to drive harnesses in new domains.'
