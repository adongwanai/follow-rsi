  source_hash: b5a7903358c8b319f5082ffe78cbf6d634b0641313d4d3d22bca2c663e61bfef
  published: '2026-11-13T16:07:26Z'
  updated: '2026-11-13T16:07:26Z'
  hf_daily_dates:
  - '2026-11-16'
  abstract: 'The release of GPT-6 Astra marks the emergence of a new paradigm in robotics: agentic robotics. Within
    weeks, frontier models with agentic harnesses matched or exceeded task-specific policies on many embodied benchmarks.
    Instead of training a dedicated policy for each family of tasks, an agentic robotic system applies a foundation
    model to open-world embodied tasks. It operates in a closed loop: observing the environment, interpreting user
    intent, reasoning about the task, invoking skills and tools, verifying outcomes, and adapting its strategy.
    Despite these advances, the community has yet to converge on a shared definition, a reliable evaluation framework,
    or a research roadmap. We argue that Embodied System 2, realized by a foundation model together with an embodied
    harness, forms the decision-making core of agentic robotics. Its central challenge is to translate general-purpose
    reasoning into effective and verifiable actions under physical constraints such as limited reaction time, mechanical
    limits, unpredictable environment changes, and irreversible consequences. Motivated by this perspective, we
    propose an evaluation framework that measures both model capabilities and closed-loop system performance. Furthermore,
    we identify the principles that carry over from digital to physical agents and the challenges that must be addressed
    to achieve reliable physical autonomy. On top of the Embodied System 2 and the evaluation framework, we envision
    a research roadmap toward sustained autonomy: the ability to perform work safely and reliably with progressively
    broader responsibility, from executing individual primitives to fulfilling standing roles.'
