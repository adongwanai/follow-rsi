- id: arxiv:2611.18482
  title: 'MMFlash: Faster Speculative Decoding for Vision-Language Models'
  announced: '2026-11-13'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.18482'
  version: 1
  source_hash: 4df6ac7d289f2de02517bb3bb6723fa33b467f3f4cdf7580c5afd16ccd01cc80
  published: '2026-11-13T17:54:28Z'
  updated: '2026-11-13T17:54:28Z'
  hf_daily_dates:
  - '2026-11-16'
  abstract: Speculative decoding accelerates generation by letting a lightweight drafter propose tokens for parallel
    verification by a target model. Diffusion drafters such as DFlash propose an entire token block in a single
    forward pass, but mainly focus on text-only tasks, leaving multimodal drafting underexplored. To study this
    setting, we first introduce a metric of token-level visual dependence based on the KL divergence between next-token
    distributions with and without visual input. We find that acceptance rates decrease from 46% in the lowest visual-dependence
    quartile to 22% in the highest, with this disparity persisting after multimodal training. Motivated by this
    observation, we propose MMFlash, a simple and effective framework that adaptively upweights visually dependent
    tokens that the drafter predicts poorly. For long video inputs, MMFlash further employs sparse attention to
    reduce redundant attention computation and improve drafting quality. Across various multimodal benchmarks, MMFlash
    achieves lossless decoding speedups of up to $3.58\times$, outperforming EAGLE-3 and DFlash by up to 195.4%
    and 17.1%, respectively.
