- id: arxiv:2611.18442
  title: 'CANTraj: Recovering Vehicle Trajectories from CAN Signals in Naturalistic Driving'
  announced: '2026-11-13'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
