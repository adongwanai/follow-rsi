- id: arxiv:2611.20856
  title: 'Synapse: Optimizing Natural-Language Agent Skills through Program Repair'
  announced: '2026-11-16'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.20856'
