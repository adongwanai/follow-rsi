- id: arxiv:2611.18397
  title: 'Gamer: A Generalist Vision-Language-Action Foundation Model for Long-Horizon Real-Time Game Agent'
  announced: '2026-11-13'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.18397'
  version: 1
  source_hash: 0ac765c3b2e5b48fd85cf65ff89b95b6589e2b3ee52f3c164c1d5f84ae07d351
  published: '2026-11-13T16:39:30Z'
  updated: '2026-11-13T16:39:30Z'
  hf_daily_dates:
  - '2026-11-16'
  abstract: We introduce Gamer, a generalist agent framework built for long-horizon tasks in complex interactive
    environments. Its end-to-end architecture combines perception, memory management, and multi-step reasoning.
    A shared training and deployment pipeline supports interaction with both conventional 2D graphical interfaces
    and complex 3D simulated worlds. We first continue pre-training on a dataset constructed from tens of thousands
    of hours of device-level keyboard and mouse interaction. These trajectories span simulated games and embodied
    environments, allowing the model to learn environmental dynamics across both physical and virtual domains. Sparse-thinking
    instruction tuning then substantially reduces redundant computation while preserving the reasoning needed for
    complex decisions. We train the policy for long-horizon interaction with a stable multi-turn reinforcement learning
    method that addresses finite context windows, accumulated rollout errors, and sparse rewards. For real-time
    interaction, a cloud-edge inference engine serves numerous simulated game environments concurrently, supports
    unbounded-context execution, and keeps online inference latency low. Across multiple challenging 3D open-world
    games, Gamer demonstrates solid generalization and operational efficiency comparable to skilled players. It
    also achieves competitive results on a range of conventional 2D game benchmarks. These results suggest that
    even repetitive keyboard and mouse trajectories can support substantial gains from scaling data and learning
    algorithms. Training on these trajectories helps Gamer learn complex skills more steadily in environments with
    both physical and digital properties. This approach offers a path toward generalist agents that can interact
    across digital and physical worlds.
