  - '2026-11-16'
  abstract: 'Frontier LLM agents that query databases with tools are among the most accurate text-to-SQL systems,
    but per-query calls to a hosted model are slow, costly, and expose sensitive organizational queries to external
    APIs. For example, a Claude Opus 5.5 agent serving 10,000 queries a day costs over $70,000 a year at list price.
    To what extent can local hardware already owned by an organization offload this burden without compromising
    the agent''s accuracy? We present LuthorSQL, a non-autoregressive 7B text-to-SQL model that serves as a rapid
    System 1 gate for a slower LLM agent (System 2), escalating queries only when uncertain. LuthorSQL makes a single
    forward pass to predict slot scores over a bounded grammar for query plans, compiles and runs up to 32 candidate
    plans, and chooses an answer using a trained validator. On its own, LuthorSQL reaches 68.03% execution accuracy
    on BIRD''s hidden test set at 0.84 s per question on a single GPU, maintains its accuracy in 9 GB with 8-bit
    quantized weights, and transfers zero-shot to Snowflake, BigQuery, MySQL, PostgreSQL, and DuckDB within 3.1
    points of its native SQLite accuracy. Combined with Claude Opus 5.5 in a pre-registered confidence cascade over
    227 questions on databases published after Opus''s training cutoff, LuthorSQL answers nearly half of all questions
    locally and cuts API cost by 33.3% at the same accuracy. Finally, contamination probing shows that Opus reproduces
    48-92% of public benchmark gold queries verbatim without seeing the schema; however, its tool-assisted accuracy
    holds on renamed schemas and reaches 95.6-97.4% on post-cutoff databases. Code and data: https://github.com/IAMIbrahimmemon/luthorsql'
