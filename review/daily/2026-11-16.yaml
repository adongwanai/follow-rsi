- id: arxiv:2611.18130
  title: 'JFinBench: A Continuously Refreshable Japanese Financial Benchmark from the Latest Certification Exams'
  announced: '2026-11-13'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.18130'
  version: 1
  source_hash: f608487083641124a9792ffa589eb8823f108545306a4b5ca745aee2df7acd9b
