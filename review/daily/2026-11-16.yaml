    summary_en: SkillForge trains the model while maintaining an external skill library. Execution rewards and failure
      trajectories guide child-skill generation. Trial skills become active after a usage threshold; fitness and
      usage govern stabilization and retirement, and later rollouts retrieve from the revised library. This supports
      a model-and-Harness coevolution classification. Shared task rewards do not isolate each skill’s causal contribution,
      and the teacher can introduce external knowledge.
