- id: arxiv:2610.23288
  title: 'CoEvolve: Self-Evolving Code Policies from Skills to Strategies for Humanoid Robots'
  announced: '2026-10-16'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: embodied
  decision: reject
  arxiv_id: '2610.23288'
  version: 1
  source_hash: a73f9b4ceec48692c0e09e1ceabe5077b42856d8424d8367207243072e1b1b0e
  published: '2026-10-16'
  updated: '2026-10-16'
  hf_daily_dates: []
  abstract: Recent advances in Vision-Language-Action (VLA) models and World Action Models (WAMs) have expanded
    the manipulation and whole body capabilities of individual robots. Yet a single robot remains limited by its
    embodiment, and many real world tasks require capabilities that can only emerge through cooperation. Existing
    multi robot frameworks largely emphasize task decomposition, allocation, and replanning, while providing limited
    support for adapting executable coordination when physical execution deviates from the intended behavior. We
    present CoEvolve, a framework that represents team coordination as executable code over fixed robot motor skills.
    CoEvolve introduces Verifier Guided Coordination Evolution, where a multimodal foundation model instantiates
    coordination strategies through motion primitives, semantic objectives, temporary robot roles, and bounded execution
    parameters. Physical verification evaluates each executed transition, rejected behaviors trigger structured
    coordination revision from an accepted checkpoint, and verified experience is retained to guide subsequent decisions.
    We evaluate CoEvolve with two simulated Unitree G1 humanoids transporting a freely supported rigid payload through
    constrained corridors. Across 15 base task runs with three multimodal backbone families, CoEvolve completes
    8 tasks, with every backbone achieving end to end success. Additional evaluations yield verified placement on
    two additional corridor layouts and after both same-backbone and cross-backbone experience initialization, while
    exposing persistent limitations in motion precision and contact stability. These results support executable
    coordination as a practical interface for adapting long horizon multi robot collaboration under shared physical
    constraints.
