- id: arxiv:2611.16010
  title: 'Iris-Z: Scaling One Generative Model Past Specialist Geometry Models'
  announced: '2026-11-11'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
