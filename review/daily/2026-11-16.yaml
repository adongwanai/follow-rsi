- id: arxiv:2611.15789
  title: 'VibePrevisBench: Evaluating Agentic Coding for 4D Scene Generation in Blender'
  announced: '2026-11-11'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.15789'
  version: 1
  source_hash: 7d4d3a8a46b01cb6834532a46342355098b6f7fb22f95d13d6e705dcd5a3a1e5
  published: '2026-11-11T18:02:07Z'
  updated: '2026-11-11T18:02:07Z'
  hf_daily_dates:
  - '2026-11-16'
  abstract: 'Controllable real-world video generation models can condition on a rendered graybox proxy video, which
    fixes layout, motion and camera. Coding agents can build such videos by reconstructing a 4D scene in Blender,
    yet no benchmark checks both these videos and the long, multi-shot scenes behind them. We introduce VibePrevisBench,
    a benchmark for 4D scene reconstruction: an agent turns a brief into an executable 4D scene and renders its
    proxy video. Its 242 tasks span four input kinds, including scripts, photos, continuations, and reference videos.
    Each delivery is scored along two evaluation dimensions. Rule-based Scene Check re-runs the code and compares
    the exported 4D scene with hidden ground truth facts in nine dimensions. VLM-based Screen Check asks a VLM judge
    whether the facts that pass can be recognized in the proxy video. We analyze the evaluation results and trajectories
    of 11 frontier coding agents and identify three key observations. First, multimodal understanding separates
    the agents, especially in understanding space and camera motion. Second, all agents seem to already master basic
    camera work and staging, and fail at challenging requests. Third, agents inspect their own renders but fail
    to correct their errors. Agents thus need better visual understanding of space and camera, explicit checks for
    challenging requests, and item-by-item verification of renders against the brief.'
