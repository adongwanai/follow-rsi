  abstract: Self-evolving language agents have emerged as a promising paradigm for continuously improving agent
    behavior through experience. However, most existing approaches evolve textual artifacts, which can influence
    action preferences but cannot reliably enforce action admissibility in embodied environments with discrete and
    often irreversible actions. We propose MetaAct, which shifts self-evolution from textual guidance to executable
    action constraints by synthesizing GEAR (Grounded Executable Action Rules) from execution feedback. Each rule
    is represented as a typed specification, compiled into a deterministic guard, and validated offline through
    trajectory replay without additional model calls or environment interactions. Across four benchmarks, MetaAct
    improves task performance; on ScienceWorld and WebShop, violations drop from 70% to 0% and 40% to 1%, with score
    gains of +10.1 and +8.0. Our code is available at https://github.com/BaiCubed/MetaAct.
