- id: arxiv:2611.14487
  title: 'Re-Search: Dissecting LLM Ideation Through a Two-Player Questioning Game'
  announced: '2026-11-10'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.14487'
