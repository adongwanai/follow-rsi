  arxiv_id: '2610.38946'
  version: 1
  source_hash: 146f049aa4f6bcd17f8cdc17cdbf4859abfa6945a0812d4145b028f4ec52a647
  published: '2026-10-28'
  updated: '2026-10-28'
  hf_daily_dates: []
  abstract: 'Training-time multi-agent system (MAS) design seeks to learn reusable orchestration policies, yet prevailing
    approaches remain largely one-shot: an Orchestrator generates a system but only observes and learns from its
    terminal outcome. This paradigm discards execution trajectories that expose system-level failures and contain
    fine-grained information beyond the terminal outcome, leaving no direct basis for revising the source MAS, evaluating
    the updated MAS, or learning from the resulting contrast. To this end, we introduce MAS-Loop, an execution-grounded
    framework that closes this feedback loop by coupling an Orchestrator with a trajectory-conditioned Refiner.
    For each task, the Orchestrator constructs and executes a source MAS to obtain an outcome score and an intermediate
    trajectory. Conditioned on the trajectory, the Refiner localizes an actionable failure, formulates a trajectory-grounded
    diagnosis, and proposes a bounded patch to the agents, information flow, or execution configuration. The executable
    updated MAS is re-executed on the same task to measure its realized outcome under stochastic execution. This
    pair-MAS comparison provides complementary learning signals: the Orchestrator learns to generate strong systems
    with fewer recoverable failures, whereas the Refiner learns to expose and repair observed weaknesses, thereby
    driving policy-level co-evolution across training iterations. Experiments show that MAS-Loop achieves the strongest
    overall performance among the evaluated baselines, with consistent gains from refinement across all evaluated
    benchmarks. The co-evolution process also yields MAS-JudgeCorpus, a dataset of execution-grounded source-updated
    pairs with orchestration- and trajectory-level supervision, which can provide the community with support for
    MAS reward modeling and trajectory-aware investigation.'
