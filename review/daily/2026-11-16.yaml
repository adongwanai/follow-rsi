- id: arxiv:2611.20533
  title: 'RemeshingAgent: An Iterative Agent for Repair-Based Decimation of Generated Building Meshes'
  announced: '2026-11-16'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.20533'
  version: 1
  source_hash: 46d07030dff54c338800a61e55c59e290c8f2896429e787b66f22c8ab3a92c1c
  published: '2026-11-16T05:08:27Z'
  updated: '2026-11-16T05:08:27Z'
  hf_daily_dates: []
  abstract: 'Aggressively simplifying a generated high-poly building mesh to 0.5-1% of its faces confronts a hard
    limit. The surface looks complete, yet the mesh is topologically shattered: 10^3-10^4 connected components and
    non-manifold thin walls. Below a certain budget, every practical decimator "melts": it deletes parts, welds
    thin walls, or breaks the error tolerance. We attribute this to instance-specific pathology: which components
    are significant and where the cliff sits vary from mesh to mesh, so no single fixed algorithm suffices, and
    decimation becomes an iterative loop of cleaning, simplifying, and verifying. We present RemeshingAgent, an
    agent that turns this loop into a validated process. The melting follows from a triangle-budget decomposition
    into curvature, crease, component, and genus terms: below the component floor, no output satisfies the repair
    contract, and cleaning first is the theory-mandated response. At a 0.5% budget the agent stays topology-clean
    where QEM and vertex clustering melt, matches a commercial remesher on 20 unseen city buildings, and on the
    24 training buildings a nine-participant single-workstation blind study prefers our outputs 168:48 (p = 0.0195,
    subject-level sign test). The trained skill deploys as retrieval replay: 11.7 seconds per mesh on CPU, with
    no LLM calls.'
