- id: arxiv:2611.17831
  title: 'V-JEPA-LM: Video-Language Models That Read Dynamics Beyond Static, Text-Aligned Representations'
  announced: '2026-11-13'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.17831'
  version: 1
  source_hash: f02110c1b93428a66ebcc403c71a6cda81f3e74fe6282f14e2b0e1f1818c49e4
  published: '2026-11-13T07:05:22Z'
  updated: '2026-11-13T07:05:22Z'
  hf_daily_dates:
  - '2026-11-16'
  abstract: 'World-model video encoders such as V-JEPA learn how scenes change (direction, speed, order, state)
    from video alone. To answer questions, they are joined to a language model trained on captions and question-answer
    pairs. But each caption or question names only a few attributes of a clip, so the model learns to retrieve those
    attributes rather than to read the clip, and the dynamics the encoder carries go unused: on the same items,
    a linear probe reads speed from frozen V-JEPA features at 87% while the VLM answers at chance. We show where
    dynamics lives in a frozen encoder: in a subspace shared across videos for predictive encoders such as V-JEPA,
    but not as a shared component of frame-wise, text-aligned encoders such as SigLIP. We then build counterfactual
    supervision that makes the language model read it: pixel transformations turn public videos into answer-balanced
    variants whose answers are set by the transformation and differ only in the change. Trained in a single stage
    on 4.53M public samples with 32 visual tokens per frame, where open video LLMs use several stages, 9M to 172M
    samples and 64 to 256 tokens per frame on average, the resulting V-JEPA-LM models (1B to 8B, Qwen3 and Llama)
    lead every size class in average score across eleven video benchmarks; our 4B model scores 72.1, against 61.1
    for the best open 4B and 64.8 for the best open 8B model. A controlled encoder x supervision study shows that
    the encoder decides what can be read and the supervision what is read: at a matched budget, counterfactual supervision
    adds 4.5 points on average and 38 on the speed questions of natural benchmarks. Code and models: https://github.com/kkt94/Llama-V-JEPA-LM.'
