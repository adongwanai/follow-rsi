- id: arxiv:2611.18529
  title: 'eDIAR: Training-Free Open-Speaker Streaming Diarization for Long Meetings and Large Archives via e-means'
  announced: '2026-11-13'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.18529'
  version: 1
  source_hash: be516dfeb18cdea38737bf9485e4c32223937e8485f223fcea56e1009c86f271
  published: '2026-11-13T18:43:11Z'
  updated: '2026-11-13T18:43:11Z'
  hf_daily_dates:
  - '2026-11-16'
  abstract: Meetings last up to an hour, and nobody knows in advance how many people will speak. Neural diarizers
    with a fixed number of output slots, such as Streaming Sortformer and Nemotron-3, are accurate and run online,
    but they cannot name more speakers than they have slots. We remove this limit without retraining. The slot head
    keeps deciding who is active and when speech overlaps, and speaker embeddings are clustered inside a single
    slot, with the official e-means algorithm, only after every slot has been used. In the streaming system, re-clustering
    is confined to a bounded window, labels are revised for a few seconds, and identities are anchored to the slots
    of the head. The resulting system has no limit on the number of speakers and stays accurate when speakers outnumber
    the slots, where fixed-slot models break down. On meetings that grow to an hour it stays far more accurate than
    Streaming Sortformer, which accumulates errors, and its cost per update does not grow with the meeting. The
    same recipe turns the four-slot Streaming Sortformer into an open-speaker system. Across recordings, e-means
    makes it affordable to link the speakers of a large archive frame by frame, a task that arises when conversational
    corpora are prepared, and it reaches the clustering quality of Lloyd's $k$-means several times faster. The method
    needs little tuning, and e-means runs with its default recipe from a few hundred to more than a million embeddings.
