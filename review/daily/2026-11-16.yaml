- id: arxiv:2611.17194
  title: 'eDMD: Endpoint Distribution Matching for Few-Step Diffusion Distillation'
  announced: '2026-11-12'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
