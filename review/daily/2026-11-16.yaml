- id: arxiv:2611.12901
  title: 'Rethinking in Spikes: Mitigating Hallucinations in MDLMs with Step-Aware Decoding'
  announced: '2026-10-14'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12901'
