  version: 1
  source_hash: a5bc69ee116f13c5891914f0fe0227906a77eaad6dd663486062edd2b3c010a8
  published: '2026-11-10T18:49:47Z'
  updated: '2026-11-10T18:49:47Z'
  hf_daily_dates: []
  abstract: 'Business process automation runs the same Standard Operating Procedure (SOP) again and again on new
    inputs. Large Language Model (LLM) agents can follow an SOP written in natural language, but they call an LLM
    to choose every step of every run, which adds latency and cost at scale. We present ReTrace, which turns an
    SOP and a few logged agent runs into a reusable workflow in which code, not an LLM, selects the next step. The
    agent''s reasoning, the explanation it writes with each tool call, often states why it took an action; the tool
    calls alone do not. ReTrace extracts the condition behind each step, merges these conditions across runs into
    a compact rule document, and generates an executable workflow from it. Only this last stage depends on the platform,
    so rule documents can be compiled for different orchestration platforms. On $79$ procedures from our production
    platform, ReTrace workflows reach $93.8\%$ completion, against $96.8\%$ for the agent, at $24\%$ lower cost
    per task. On $τ^2$-Bench, they reach $75.8\%$ task success (agent: $80.6\%$) and run in $1.3$s instead of $170$s;
    three rounds of repair on training failures lift $k{=}2$ workflows from $66.7\%$ to $81.2\%$. On eight SOP-Bench
    procedures, ReTrace without repair trails few-shot generation ($80.6\%$ vs. $83.6\%$), but repair from labeled
    training failures lifts it to $87.8\%$ at $0.40$s per task, compared to $85.5\%$ in $46.6$s for the agent.'
