- id: arxiv:2611.14326
  title: When Should Agents Remember? Falsification-Gated Self-Evolution for LLM Agents
  announced: '2026-11-10'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.14326'
  version: 1
  source_hash: 535defda1d199d301e3a029561e4e5b15f9a9b8681b0d91ba38edf2163821175
  published: '2026-11-10T16:52:25Z'
  updated: '2026-11-10T16:52:25Z'
  hf_daily_dates: []
  abstract: LLM agents increasingly operate in long-horizon, verifier-rich environments, but current self-improvement
    mechanisms often write episode-derived lessons directly into memory, making local success an unreliable signal
    for reusable and safe knowledge. This paper addresses the core question of when an experience-derived behavioral
    update should be admitted into persistent agent state. We propose Falsification-Gated Self-Evolution (FGSE),
    a verifier-grounded framework that represents each candidate lesson as a structured hypothesis with an explicit
    precondition, behavior change, expected effect, and verifier. FGSE applies the hypothesis only in a temporary
    state, tests it on target-transfer, falsification, and archived-regression probes, and then commits, refines,
    or rejects it according to measured gain and risk. Across web, app, tool-use, and long-term memory benchmarks,
    FGSE achieves strong task performance, including 39.8 WebArena success rate, 78.8 AppWorld average completion,
    and 0.724/0.487 Pass$^1$ on $τ$-Retail/$τ$-Airline, while reducing falsification failures to 5.0%, regression
    damage to 1.3%, and harmful committed updates to 3.6%. These results suggest that testing memory updates as
    hypotheses supports more reliable long-term adaptation.
