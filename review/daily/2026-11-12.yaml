- id: arxiv:2611.11531
  title: Probing Transformer Representations Layer by Layer, Module by Module
  announced: '2026-11-08'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.11531'
  version: 1
  source_hash: 1ce6d2e421bd6b291b7942fb7b0995939353fd1e594d1023a53813e977818efb
  published: '2026-11-08T18:16:49Z'
  updated: '2026-11-08T18:16:49Z'
  hf_daily_dates:
  - '2026-11-12'
  abstract: 'Which representation should be probed in a transformer-based foundation model? Recent work shows that
    the standard practice of probing the final layer is often suboptimal, as intermediate layers can provide better
    features. Yet, representations are still largely studied along depth alone, treating each transformer block
    as an atomic unit. In this work, we analyze transformer representations layer by layer, module by module. Through
    more than 144,000 linear probing evaluations of vision foundation models (VFMs) and large language models (LLMs),
    we show that layer and module choices should be considered jointly: the best layer-module pair yields substantially
    larger gains over the final-layer residual stream than the best layer with the residual stream fixed. Moreover,
    module performance can vary substantially across layers, showing that useful representations cannot be characterized
    by depth alone. Building on these findings, we evaluate simple fixed probing strategies: the final-layer feedforward
    activation (Act@100) for vision and the second normalization layer at 60% depth (LN2@60) for language. These
    strategies improve over the probing baseline in a majority of evaluations and recover, on average, 42% and 86%
    of the gains from probing the best layer-module pair for vision and language, respectively. For VFMs, these
    gains increase with the transfer difficulty between pretraining and downstream data.'
