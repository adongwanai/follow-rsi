- id: arxiv:2611.14113
  title: 'Looking One Step Ahead: An Anticipation-guided Agent for Object State Readout in Videos'
  announced: '2026-11-10'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.14113'
  version: 1
  source_hash: 0ec27671f140c391a90ea73ed25cb03cab12035ff79838d1c40acd726e9869f8
  published: '2026-11-10T14:05:39Z'
  updated: '2026-11-10T14:05:39Z'
  hf_daily_dates: []
  abstract: Understanding the progress of an activity requires tracking how the objects involved change over time.
    Object state readout provides this information by describing a target object's states and transitions across
    video frames. Although multimodal large language models (MLLMs) generate detailed visual descriptions, these
    descriptions may leave the attributes needed to distinguish successive states insufficiently specified. In this
    paper, we propose look-ahead state readout (LASER), an anticipation-guided agent for object state readout that
    uses possible next-step changes to determine which attributes to inspect in the present. Given temporally ordered
    frames and a target object, LASER converts anticipated changes into targeted visual questions and inspects the
    current frame to establish attribute values. It then checks state readouts and forecasts against independent
    observations of subsequent frames, refining a state record used to generate the final description. Reusable
    textual observation skills guide this process and are refined by tracing discrepancies with reference captions
    to the responsible instructions. Candidate revisions are selected on separate videos based on improved caption
    quality without increased contradictions with reference facts. Model parameters remain frozen throughout adaptation
    and inference, and the revised skills remain fixed during evaluation. Experiment results and further analysis
    on OSCaR and PLM RCap show consistent improvements of LASER over strong baselines and existing approaches, which
    demonstrates the effectiveness of our approach.
