- id: arxiv:2611.13615
  title: 'Synapse-Control: Making Agent Experience Actionable with Lightweight Runtime Control'
  announced: '2026-11-10'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.13615'
  version: 1
  source_hash: 334dcc82d800ef6fb802d934b59dba16ce18efabc8c5e86635a8f60a5c09d725
  published: '2026-11-10T05:50:12Z'
  updated: '2026-11-10T05:50:12Z'
  hf_daily_dates: []
  abstract: Large language model agents reuse execution experience to improve reliability on complex tool-based
    tasks. Systems such as Sentry call large models to generate failure diagnoses before retrieving advice, adding
    inference cost to experience reuse. We present Synapse-Control, an agent runtime whose lightweight control plane
    selects advice and determines when to send it to the task-executing model. Rules shortlist relevant advice,
    and a lightweight 1.7B classifier fine-tuned on teacher-labeled state-suggestion pairs scores those candidates
    instead of generating a diagnosis. Micro-contracts encode reusable interface checks, such as required arguments
    or valid options, without prescribing complete task programs. A Prompt Value Table records earlier guidance
