- id: arxiv:2611.13144
  title: 'Teaching the Harness: Student-Aware Skill Transfer for LLM Agents'
  announced: '2026-11-09'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.13144'
  version: 1
  source_hash: 239f1023660d2e25824998b42adf0929ab341fe69e2f2e481f1c2d5fcb2358d4
  published: '2026-11-09T19:23:42Z'
  updated: '2026-11-09T19:23:42Z'
  hf_daily_dates: []
  abstract: Effective teaching requires reasoning about the learner as well as the task, a capacity that Theory
    of Mind describes as inferring another agent's latent state from its behavior. We ask whether a stronger LLM
    teaches a fixed student better when it applies this principle. The student is an LLM agent acting through a
    harness that fixes its tools, context, and action budget, so a procedure that helps one model can exhaust the
    budget of another. We introduce Student-Aware Teaching (SAT). The teacher builds a learner model that pairs
    an empirical profile with hypotheses about the student's limitations, tests these hypotheses with diagnostic
    probes, and writes reusable skills for the diagnosed failures. A skill enters the library only after it raises
    success on matched development tasks. With Claude-Sonnet-5 teaching DeepSeek-V4-Flash, SAT reaches 86.46% task
    success across four primary runs, leading both a profile-free teacher with the same framework (81.04%) and the
    untaught student (75.00%) in each run. Removing the analytical learner model lowers both prediction and success,
    and under misleading learner profiles none of the 48 candidate skills passes admission. When DeepSeek-V4-Flash
    and Gemini-3.8-Flash exchange libraries, each performs better with its own. Saved libraries keep average gains
    of up to 11.1 points after the teacher leaves. The benefit depends on a student that can follow instructions
    and a deployment route that delivers them.
