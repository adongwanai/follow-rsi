- id: arxiv:2611.14256
  title: A Cross-Scenario Survey and Analysis of Self-Evolving Multimodal Agents
  announced: '2026-11-10'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.14256'
  version: 1
  source_hash: 5001bd8d6ab7775a90e1e7649c5ad4a31556093ce529826eecaca9537e88f35e
  published: '2026-11-10T16:04:02Z'
  updated: '2026-11-10T16:04:02Z'
  hf_daily_dates: []
  abstract: 'Recent work shows that multimodal agents increasingly self-improve without recurring human annotation.
    However, each self-improvement mechanism is designed and evaluated within a single scenario, leaving its preconditions
    unverified under cross-scenario transfer. This survey investigates the structural source of asymmetric mechanism
    transfer across four scenarios: multimodal reasoning, multimodal generation, GUI and Web navigation, and embodied
    manipulation. We first formalize the self-evolving multimodal agent by four criteria and a differentia of self-reference,
    and adopt the three-stage self-evolving loop of experience generation, feedback acquisition, and update consolidation
    as our analytical framework to position the scenarios along ceilings on rollout count and feedback fidelity.
    Comparing self-evolving with fixed loops within each scenario separates the limitations that the scenario imposes
    from those inherent in the self-evolving design. We then recast each mechanism as a trade-off that raises a
    scarce factor by presupposing a task-structural resource, such as output equivalence or checkable outcomes,
    and judge it portable, conditional, blocked, or redundant across scenarios. We attribute the asymmetry to divergent
    combinations of scarce factors and resources across opposite transfer directions, and identify the matched-budget
    measurements that could overturn these still untested verdicts.'
