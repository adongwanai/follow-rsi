- id: arxiv:2611.12918
  title: 'IntentTwin: Deconfounding Candidate Support and the Oracle-to-Deployment Gap in Offline Web Behavior Prediction'
  announced: '2026-10-27'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.12918'
  version: 1
  source_hash: 11a52e46f761425ecc741726c92fc3846781c4ef458f847ae37b829ea72af98a
