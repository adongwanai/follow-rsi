  source_hash: 3ed49c0bb0f88c6c1a552d88933f95bac5654ee67d17d784682c72cef2b41c42
  published: '2026-07-27T18:56:13Z'
  updated: '2026-10-30T13:55:34Z'
  hf_daily_dates:
  - '2026-11-12'
  abstract: Human cognitive tasks let us compare language models with humans under controlled conditions. Yet a
    model can reproduce the direction of a human effect while making different errors. CogBattery evaluates 54 open-weight
    language models on text adaptations of 13 cognitive paradigms, comparing each with human data from its source
    study. Like humans, models respond more to n-back lures than to controls, yet they make far more false alarms
    on ordinary non-targets. Most models' reported confidence separates correct from incorrect answers less well
    than humans' does, and most always choose the same wager, including models that classify accurately. These patterns
    span many model families. Across tasks, model scores share two dimensions. The first is closely tied to scale,
    yet larger models are not consistently closer to humans. Predefined cognitive groupings show no reliable predictive
    advantage over random groupings of the same size. These results show that matching human effect directions does
    not establish human-like behavior. CogBattery provides condition-level human references for testing errors and
    confidence reports in new models.
