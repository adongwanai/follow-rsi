- id: arxiv:2611.13758
  title: 'Mixed Signals: Weight-Space Programming for EEG and ECG'
  announced: '2026-11-10'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.13758'
  version: 1
  source_hash: 881ea4a0c94d010483459128160f465c9b270bf6e6020361d0ab3b0513f5920c
  published: '2026-11-10T08:59:09Z'
  updated: '2026-11-10T08:59:09Z'
  hf_daily_dates:
  - '2026-11-12'
  abstract: Weight-space programming allows language models to read a trained neural network's weights and edit
    them. This opens the door to ``training'' by reasoning rather than through gradient descent. Prior work has
    demonstrated its functionality and promise for game-playing networks and fixing specific failures in language
    models, even extending to diffusion models. In this work, we present its applicability to models trained on
    biosignal data, specifically EEG and ECG data. We show that frontier models are not only able to debug specific
    faults planted in biosignal-based models without being told what these faults are, but are even capable of writing
    all the weights of a network from scratch, given only the architecture, the task, and a minimal set of training
    subjects. In particular, in one set of experiments, a language model was able to match standard gradient-descent
    training using $6\times$ fewer training subjects, through reasoning alone and without any gradient descent step.
    Networks written by Claude Opus 5.5 also scored higher than classic hand-crafted EEG pipelines (alpha band power,
    and common spatial patterns with linear discriminant analysis) when built from the same 5 subjects. We also
    highlight some of the limitations, which include the inability of language models to improve already well-trained
    classification models, and their incapacity to reliably recognize, from the weights alone, the task a network
    was trained on. Overall, our results indicate that weight-space programming can be useful for small networks,
    such as those deployed on edge devices and wearables, but the concept still requires further investigation before
    it can be used in practice.
