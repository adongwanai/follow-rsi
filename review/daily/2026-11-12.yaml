  abstract: Large language model (LLM) shopping assistants now recommend products in multi-turn conversations. However,
    reliable evaluation faces Data scarcity and Difficulty Standardizing Criteria. To address these obstacles, we
    introduce CARTBench for CART (Complex and Ambiguous Requests with Timelines). For Data scarcity, we curate cases
    from real commercial shopping needs across 17 retail domains, pairing timestamped dialogue with 1,603 product
    records. For Difficulty Standardizing Criteria, we develop case-specific rubrics guided by Ideal Response Principles,
    distilled from excellent replies manually selected from successfully completed orders. These principles also
    guide Principle-Guided CART Prompting, our structured recommendation strategy. The experimental benchmark contains
    1,328 expert-annotated criteria across Core, Excellence, and Safety. To answer the CART question, we evaluate
    7 flagship commercial API models, including GPT-6.1-Sol and Claude-Opus-5, and 35B+ parameters open-weight models.
    In the first full-suite evaluation under the frozen rubrics, 3 of 10 models exceed 90% on Core, while none exceeds
    45% on Excellence. Therefore, we identify an understanding-to-execution gap between required behavior and high-quality
    purchase advice. To examine these limitations, we diagnose shared failures in product evidence and unresolved
    needs, linked to changing requirements and decisive unknowns. Code and data are available at https://github.com/Da1yuqin/CARTBench.
