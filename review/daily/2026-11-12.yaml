  updated: '2026-11-10T00:45:58Z'
  hf_daily_dates:
  - '2026-11-12'
  abstract: 'Low-bit quantization reduces the inference cost of LLM agents but can compromise task success. Examining
    failed rollouts, we find that quantized agents overlook task requirements or environmental conditions, producing
    environment transitions that diverge from successful full-precision references. Correcting these behavioral
    divergences remains difficult: offline data may miss the student''s failure contexts, while its own rollouts
    may provide few correct responses in those contexts. We introduce SteerDistill, a quantization-aware distillation
    method in which a full-precision teacher guides the student to revise failed responses and iteratively refines
    its guidance using feedback from student execution. This closed-loop teacher steering produces locally verified
    behavioral corrections. We internalize these corrections by training the student without guidance to match the
    steered student''s predictions at corrected turns and the full-precision teacher''s at other turns, enabling
    unassisted inference. Across five agentic benchmarks and three models, SteerDistill exceeds the strongest quantized
    baseline by 1.67--2.18 points in average score under W4A16 and stays within one point of BF16. On $τ^2$-Bench,
    it outperforms QeRL by 1.84 percentage points in success rate using 67% fewer training GPU hours and produces
    shorter successful trajectories than the quantized baselines.'
