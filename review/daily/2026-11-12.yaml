  hf_daily_dates: []
  abstract: '写真左：マイケル・ロジャース氏、写真右：トム・モラン氏 （English Announcement Below.） AIは、国家の安全保障のあり方を左右する重要なテクノロジーになりつつあります。この変化に日本が向き合うために、Sakana
    AIは本日、元米国家安全保障局（NSA）長官兼米サイバー軍司令官のマイケル・ロジャース（Michael Rogers）退役海軍大将と、元米中央情報局（CIA）幹部のトム・モラン（Tom Moran）氏が、ともにシニアアドバイザーに就任したことを発表します。両氏は、防衛分野の強化とサイバーセキュリティの強化の2つの軸で、当社に助言を行います。
    2名のアドバイザーは、異なるインテリジェンスの領域で、それぞれ最前線に立ってきました。 マイケル・ロジャース退役海軍大将 マイケル・ロジャース氏は、37年にわたる米海軍でのキャリアを、軍事作戦、インテリジェンス、サイバーセキュリティの最前線で歩んできました。
    海軍では暗号分野を専門とし、米インド太平洋軍（U.S. Indo-Pacific Command）の情報部長（J2）をはじめとする情報分野の要職を歴任。その後、米艦隊サイバー軍（U.S. Fleet Cyber Command）/第10艦隊の司令官（U.S.
    Tenth Fleet）などを経て、2014年から2018年には、NSA長官（National Security Agency Director and Commander）と米サイバー軍司令官（Commander
    of U.S. Cyber Command）を兼務しました。米国最大の諜報機関と、米軍ネットワークの防衛および世界規模のサイバー作戦を担う統合軍を同時に率いた、サイバー領域のエキスパートです。 2018年に四つ星の海軍大将として退役後は、2019年からBrunswick
    Groupのシニアアドバイザーとして、サイバーセキュリティ、地政学、危機管理について助言しています。 「AIは、サイバー空間における攻撃と防御の両面で、国家安全保障の前提を大きく変えつつあります。Sakana AIは、世界水準の研究力と、日本発の独自のアプローチを兼ね備えた企業です。サイバーセキュリティと防衛の強化に向けて、私の経験を役立てられることを楽しみにしています。」
    — マイケル・ロジャース退役海軍大将 トム・モラン元CIA支局長 トム・モラン氏は、約30年にわたりCIAに在籍し、オペレーション・オフィサーとして世界各地での任務にあたってきました。 東アジア、西欧、中東、アフリカの各地で支局長（Chief
    of Station）を6度務め、ワシントンD.C.の本部でも上級幹部職を歴任。情報機関の上級幹部にあたる上級情報部（Senior Intelligence Service）のメンバーとして、2023年には殊勲情報章（Distinguished
    Career Intelligence Medal）を受章しています。 2024年からは、UC Berkeley Goldman School of Public PolicyのInstitute for Security
    and Governanceにおいて「Intelligence Project」のディレクターを務め、自身の安全保障に関する知見を次世代に伝えています。 「インテリジェンスの現場で最も大切なのは、限られた時間のなかで、膨大な情報から正しい判断を導き出すことです。AIはその力を飛躍的に高める可能性を持っています。同時に、信頼性と責任ある運用が欠かせません。Sakana
    AIは、優れた人材と創造的な発想で、日本の防衛・インテリジェンスを支えようとしています。その挑戦に、アドバイザーとして参加できることを光栄に思います。」 — トム・モラン元CIA支局長 Sakana AI Sakana
    AIは創業以来、国内外から優れた人材を東京に迎え入れてきました。9月の ユルゲン・シュミットフーバー博士 に続き、今回は防衛とインテリジェンスの領域で、国際的な経験を持つ二人をお迎えします。 Sakana AIは 防衛事業に対する基本方針
    に基づき、技術の力で日本の防衛・インテリジェンスを支える最前線のチームを拡大中です。ソフトウェアエンジニア、アプライドリサーチエンジニア、サイバーセキュリティエンジニア、プロジェクトマネージャー、テクニカルエディターなど複数の職種の人材を募集しています。詳しくは当社の
    募集要項 をご覧ください。 English Announcement U.S. Admiral Michael Rogers and Former CIA Chief of Station Tom Moran Join
    Sakana AI as Senior Advisors Left: Michael Rogers, Right: Tom Moran AI is becoming a technology that will shape
    the future of national security. To help Japan meet this change, Sakana AI today announces that Admiral Michael
    Rogers, U.S. Navy (Ret.), former Director of the National Security Agency (NSA) and Commander of U.S. Cyber
    Command, and Tom Moran, a former senior officer of the Central Intelligence Agency (CIA), have both joined as
    Senior Advisors. They will advise the company on two fronts: strengthening defense capabilities and strengthening
    cybersecurity. Our two advisors have each stood on the front lines of different domains of intelligence. Admiral
    Michael Rogers, U.S. Navy (Ret.) Michael Rogers spent a 37-year career in the U.S. Navy on the front lines of
    military operations, intelligence, and cybersecurity. Specializing in cryptology, he held a series of senior
    intelligence posts, including Director for Intelligence (J2) at U.S. Indo-Pacific Command (INDOPACOM), and went
    on to serve as Commander of U.S. Fleet Cyber Command / U.S. Tenth Fleet, among other posts, before serving simultaneously
    as Director of the NSA and Commander of U.S. Cyber Command from 2014 to 2018. He led both the largest intelligence
    agency in the United States and the unified command responsible for defending U.S. military networks and conducting
    cyber operations worldwide, making him an expert with an unparalleled command of the cyber domain. After retiring
    in 2018 as a four-star admiral, he has served since 2019 as Senior Advisor to the Brunswick Group, advising
    on cybersecurity, geopolitics, and crisis management. “AI is fundamentally changing the assumptions of national
    security, on both offense and defense in cyberspace. Throughout my career, I have seen how much risk emerges
    when institutions fail to keep pace with advances in technology. Sakana AI combines world-class research with
    a distinctive approach that originates in Japan. I look forward to contributing my experience to strengthening
    cybersecurity and defense.” — Admiral Michael Rogers, U.S. Navy (Ret.) Tom Moran, Former CIA Chief of Station
    Tom Moran spent close to 30 years at the CIA, on the front lines of intelligence operations in the field around
    the world. He served six times as Chief of Station across East Asia, Western Europe, the Middle East, and Africa,
    and held senior leadership positions at headquarters in Washington, D.C. A member of the Senior Intelligence
    Service, the CIA’s senior executive cadre, he was awarded the Distinguished Career Intelligence Medal in 2023.
    Since 2024, he has also been passing on his security expertise to the next generation as Director of the Intelligence
    Project in the Institute for Security and Governance at UC Berkeley’s Goldman School of Public Policy. “What
    matters most in intelligence work is reaching the right judgment from an enormous amount of information in a
    limited amount of time. AI has the potential to dramatically strengthen that ability. At the same time, reliability
    and responsible use are essential. Sakana AI is working to support Japan’s defense and intelligence with outstanding
    people and creative thinking, and I am honored to join that effort as an advisor.” — Tom Moran, Former CIA Chief
    of Station About Sakana AI Since its founding, Sakana AI has welcomed outstanding talent from Japan and abroad
    to Tokyo. Following Dr. Jürgen Schmidhuber in September, we are now joined by two people with international
    experience in defense and intelligence. In line with our Defense Policy , Sakana AI is expanding its front-line
    team that supports Japan’s defense and intelligence through technology. We are hiring for multiple roles, including
    Software Engineer, Applied Research Engineer, Cybersecurity Engineer, Project Manager, and Technical Editor.
    For details, please see our careers page .'
