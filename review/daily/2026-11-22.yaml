- id: arxiv:2611.29303
  title: 'From Vanishing Gradients to Recursive Self-Improvement: Evaluating the Most Influential Papers in Large
    Language Model Evolution (1997-2026)'
  announced: '2026-11-22'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.29303'
  version: 1
  source_hash: dfafeb087655d011a09bba8a8dbc39e0834bc75b3c7cadf71c6d93fc8bb46679
  published: '2026-11-22T07:49:18Z'
  updated: '2026-11-22T07:49:18Z'
  hf_daily_dates: []
  abstract: The rapid proliferation of Large Language Model (LLM) research makes it increasingly difficult to distinguish
    incremental refinements from true paradigm shifts. This review evaluates 22 of the most influential publications
    spanning nearly three decades (1997-2026), organized through a causal, chronologically anchored taxonomy centered
    on the author's birth year (1999). Beginning "before 1999" with how recurrent neural networks (RNNs) forgot
    earlier context (much like forgetting Chapter 1 by the time a reader reaches Chapter 9), we trace how Long Short-Term
    Memory (LSTM) networks introduced a "bouncer" mechanism of forget, input, and output gates to selectively preserve
    long-term memory. We then examine how Word2Vec turned language into vector mathematics (king - male + female
    ~ queen), why sequential RNNs hit a parallelization wall, and how the Transformer's all-to-all attention weights
    launched the modern LLM era alongside a quadratic bottleneck. Next, we analyze why scaling parameters alone
    leaves capacity under-trained unless data scales equally (Chinchilla), how Reinforcement Learning from Human
    Feedback (RLHF) left alignment superficial, and how that gap compounded into adversarial jailbreaks and single-direction
    refusal subspaces (J-space), where instructing a model not to think of a restricted concept surfaces it much
    like the human "red ball" paradox. Finally, we synthesize the current state of AI (2024-2026), encompassing
    recursive model collapse, autonomous reasoning-model jailbreak agents, machine-speed agentic intrusions, and
    closed-loop recursive self-improvement (AIDE^2).
