  llm_primary: ''
  decision: reject
  arxiv_id: '2611.29732'
  version: 1
  source_hash: ca7849484b8dd0fa85407e87378cfef38fcfbd9d04457c5e771138b13a4c6ad5
  published: '2026-11-22T19:56:10Z'
  updated: '2026-11-22T19:56:10Z'
  hf_daily_dates: []
  abstract: Reinforcement learning (RL) has achieved substantial progress across many domains, but training an agent
    \textit{tabula rasa} remains highly sample-inefficient. A common remedy is to initialize the agent using a neural
    network pretrained on demonstrations. However, collecting demonstrations is expensive, and the demonstrations
    themselves can be suboptimal. In this work, we use a large language model (LLM) to generate an advice policy
    that produces demonstration data with effectively no human cost. We use this data to warmstart a DQN agent,
    and use the advice policy itself to guide exploration during training. Because LLM-generated advice is often
    suboptimal, we further introduce a value warmstart method that initializes the agent to recognize promising
    states from the advice policy's behavior, without directly copying its actions. To characterize the robustness
    of this method, we systematically perturb individual sub-skills of an LLM-generated advice policy for a long-horizon,
    sparse-reward task. Degraded advice still meaningfully accelerates learning relative to unaided baselines. These
    results suggest that LLM-generated advice, though suboptimal, can be a cheap alternative to costly human demonstrations.
