- id: arxiv:2611.29513
  title: 'Recursive Self-Editing: LLMs Program Their Own Weight Edits for Self-Improvement'
  announced: '2026-11-22'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.29513'
  version: 1
  source_hash: 7e80932ae28aac347d017cb33291c4fd1f08ab35ad260b5406608f2b2c6f9114
  published: '2026-11-22T14:30:51Z'
  updated: '2026-11-22T14:30:51Z'
  hf_daily_dates: []
  abstract: Recursive self-improvement asks a system to improve the very system that improves it. Today's language
    models improve themselves through data, training recipes or scaffolds. Whenever their weights change, gradient
    descent writes the update, not the model. We let the model write its own weights. In SELFWRITE, each generation
    the current model studies its own reasoning on fresh training problems, inspects its own weights and activations
    in a persistent Python session, and writes a program that constructs a low-rank weight edit for itself from
    white-box primitives (singular directions, activation contrasts between its right and wrong answers, rank-one
    projections, tensor computations), with no training or gradient tool. Every candidate is graded once on a hidden
    gate set against the current model; the best strictly improving edit is merged into the weights, and the edited
    model writes the next edit. On Qwen3.8-27B and math problems from DAPO-Math, five generations of SELFWRITE raise
    gate accuracy from 73.95% to 76.45% and accuracy on a held-out test split that the loop never sees from 76.30%
    to 77.75% (avg@4) and from 82.60% to 84.80% (pass@4), without a single gradient step. A language model can author
    useful changes to its own weights without gradients, and the edited model keeps writing useful edits.
