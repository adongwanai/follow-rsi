- id: arxiv:2611.29306
  title: 'DoppelVet: Comparative Safety Verification for Self-Evolving Agents'
  announced: '2026-11-22'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.29306'
  version: 1
  source_hash: e0e69f80c4ef69917d931fbe87daba4f589adf158da7831f0143f9db424aee73
  published: '2026-11-22T08:00:44Z'
  updated: '2026-11-22T08:00:44Z'
  hf_daily_dates: []
  abstract: Self-evolving agents improve by retaining feedback as reusable memories or skills, but every mistaken
    approval can shape many future behaviors. Two updates can provide exactly the same evidence to a verifier yet
    produce opposite safety outcomes, so the verifier cannot distinguish them from that evidence alone. We introduce
    DoppelVet, a verification framework that checks proposed updates before they enter an agent's persistent state.
    Without access to safety labels, DoppelVet constructs an alternative that matches every signal used by the existing
    verifier. It replays both updates from the same state and directly compares their behaviors in both presentation
    orders before deciding whether to retain the candidate. We evaluate DoppelVet on DoppelVet-Grid and DoppelVet-Tool,
    covering executable programs and natural-language memories. Across nine open-weight and proprietary verifiers,
    DoppelVet raises mean harmful-update detection AUC from 0.762 to 0.940 on DoppelVet-Grid and from 0.681 to 0.826
    on DoppelVet-Tool, outperforming VaG and AgentDoG 1.5. On DoppelVet-Grid, it reduces trajectories experiencing
    degradation from 30.39% to 0.43% over a ten-generation self-update loop and leaves no final degradation.
