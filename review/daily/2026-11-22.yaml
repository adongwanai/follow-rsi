- id: arxiv:2611.29613
  title: 'Weight Coding: Evolving Web-Scale Recommenders through Direct Weight Edits with LLM Agents'
  announced: '2026-11-22'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.29613'
  version: 1
  source_hash: c9fae3ca982b5799606bde26107e77ccb50d9cf4d0036a87e406d049c2cebc41
  published: '2026-11-22T17:11:38Z'
  updated: '2026-11-22T17:11:38Z'
  hf_daily_dates: []
  abstract: Web-scale recommender models evolve primarily through retraining or fine-tuning. We propose \emph{weight
    coding}, a methodology for model evolution through direct, executable weight edits. A large language model (LLM)
    agent inspects model structure and parameters, formulates hypotheses, and implements edits using evaluation
    feedback. The loop progresses from localized changes to targeted searches and composition, allowing edited components
    to adapt to one another. A cached engine enables rapid forward evaluation without backpropagation. On Pinterest's
    147M-parameter Image Search two-tower retriever, weight coding improves held-out recall@10 of production model
    by up to 15.0 percentage points (+24\% relative) with few edits in about 1/4 GPU hours of a full post-training
    finetune, while a common launch only improves around 1\%. After reinitializing the entire 13.6M-parameter interaction
    module randomly while retaining the surrounding trained model, searching 2,448 mixing and normalization parameters
    yields 9.8 points above production. Offline gains span the full funnel including dense retrieval, generative
    retrieval and ranking, with up to 1.37B learnable parameters and different edits for each architecture. Steering
    edits provide explicit control of model performance over segments like freshness and product. Weight coding
    requires no serving change and online A/B tests increase saves per user from the edited retrieval source by
    8.4\% to 10.7\%, aligned with the target business objectives. Our results establish weight coding as a practical
    and useful tool for model development and and behavioral control in a real web-scale production system, with
    potential to extend to both pre-training and post-training stages across the funnel.
