- id: arxiv:2611.22138
  title: 'RoboTeam: Benchmarking Vision-Based Multi-Agent Control of Many Robot Arms in Real Time'
  announced: '2026-11-17'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.22138'
  version: 1
  source_hash: df950b19f328b7183ba2bba2d09c77093c4c0c67b6f7c90ea91725bf1905f2db
  published: '2026-11-17T03:24:06Z'
  updated: '2026-11-17T03:24:06Z'
  hf_daily_dates: []
  abstract: 'Multimodal agents can now control robot arms by calling tools and writing code. Existing benchmarks
    fall short in three ways: most test one or two arms on short tasks, many pause the world while the agent thinks,
    and many give it ground-truth object positions. We present RoboTeam, a simulated benchmark where agents control
    4 to 16 robot arms in real time from camera images alone. Its 36 tasks are long jobs that the arms must do together,
    such as passing timbers or building a picture from hundreds of cubes. We start from the most flexible agent
    system, the adaptive system, where one agent decides when to fork delegates. With it, gpt-6.1-sol and opus-5.5
    complete 28 and 27 tasks, and four other models at most 3. But at a high price: a typical task takes gpt-6.1-sol
    3.5 hours and 218 million input tokens, and a third of its steps fail at least once and must be retried. We
    then compare it with three fixed systems: single-agent, hierarchical, and decentralized. All four complete a
    similar number of tasks but differ in time and tokens. The hierarchical and decentralized systems are faster
    but use up to 1.9 times the tokens, and the single agent uses fewer tokens but takes 1.6 times as long, so the
    adaptive system lies between them. Even so, no model or system is yet fast, cheap, and reliable at once. RoboTeam
    measures these limits where earlier benchmarks cannot: long multi-arm jobs, camera images only, and a world
    that never pauses.'
