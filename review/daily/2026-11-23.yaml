- id: arxiv:2611.22343
  title: 'PURE: A Diagnostic Benchmark for Multi-Granularity Multimodal Identity Matching'
  announced: '2026-11-17'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
