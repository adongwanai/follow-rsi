- id: arxiv:2611.23067
  title: Values Shape What Self-Improving Coding Agents Build
  announced: '2026-11-17'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.23067'
  version: 1
  source_hash: 8788215b2f669bc11c989cdfa282c3bbc61c63f647cfbac3efdadcbb9118a4a3
  published: '2026-11-17T16:56:46Z'
  updated: '2026-11-17T16:56:46Z'
  hf_daily_dates: []
  abstract: 'Self-improving agents are typically optimized for the results they produce, with less attention to
    how they produce them. Their instructions give designers limited ways to shape how they work, especially when
    the task is open-ended. This paper studies whether a short value statement in an agent''s persistent instruction
    file changes not only how well the agent performs but also what it builds. Four higher-order value types in
    Schwartz''s theory of basic human values were evaluated: openness to change, conservation, self-enhancement,
    and self-transcendence. Across diverse coding tasks, the values were held fixed within each run over multiple
    iterations of self-improvement. Three findings emerged: (1) Values matter for performance across a diverse set
    of tasks. The openness values increase performance on held-out data, whereas the opposite conservation values
    result in scores below those of an agent given no values. (2) Values change what agents build, producing solution
    algorithms that differ in size, complexity and approach. (3) Human oversight is still needed for designing values.
    Allowing the agent to revise its own values narrows the differences between sets of values, and values distilled
    from the AI literature provide no detectable gain over having no values. Properly designed values can thus influence
    what a self-improving coding agent builds and, where the task permits, how well it performs.'
