- id: arxiv:2611.22525
  title: 'When Agent Skills Go Stale: Runtime Behavior and Selective Maintenance in Evolving Environments'
  announced: '2026-11-17'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.22525'
  version: 1
  source_hash: 97f9d7420989df31e35535397ea9276c2bbce696f6262b7c5ff14347d04f246a
  published: '2026-11-17T10:18:46Z'
  updated: '2026-11-17T10:18:46Z'
  hf_daily_dates: []
  abstract: Agent skills use past experience and current observations to guide decisions and actions on related
    tasks. This experience is retained in skill state, whose reuse can amortize inference-time reasoning and environment
    interaction. When environment changes, parts of this state can become outdated while others remain useful. Across
    four task settings and two models, we compare skill reuse before and after environment changes. Previously beneficial
    skills can reduce task performance by over 10 percentage points or increase execution cost by nearly 40% relative
    to no skill. Task success can also remain unchanged while execution savings decline. These effects depend on
    which environment-specific details become outdated and the agent's ability to compensate using current observations.
    We introduce selective maintenance, which replays checks from successful executions without additional model
    calls. It verifies whether observed differences conflict with skill state, repairs affected content, and validates
    updates, rebuilding when local repair is insufficient. No description of the change is supplied. Relative to
    reusing stale state, maintenance improves task accuracy by up to 67pp and reduces execution steps by up to 37%.
    These results suggest that preserving a skill's inference time value as environments evolve requires selectively
    maintaining its state.
