- id: arxiv:2611.22299
  title: 'Harnesses That Improve Themselves: A Unifying Framework for Self-Improving Agent Harnesses'
  announced: '2026-11-17'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.22299'
  version: 1
  source_hash: ce1db7e59d8ed29a6af05b9650561db1d18e9d1f71c26763efa1454745906f32
  published: '2026-11-17T06:55:41Z'
  updated: '2026-11-17T06:55:41Z'
  hf_daily_dates: []
  abstract: 'Whether a foundation model succeeds as an autonomous agent depends as much on its runtime software
    as on its weights. This runtime, the agent harness, manages context and memory, steers multi-turn control, executes
    tool actions in sandboxes, and verifies work before stopping. Because models differ in how they use tools and
    how they fail, a static harness tuned for one model or task often stalls, wastes tokens, or regresses on another.
    This bottleneck has driven a shift from prompt tuning to self-improving agent harnesses: systems that inspect
    their own execution traces, separate runtime bugs from model limits, and rewrite their own code. We present
    a unifying architectural and design framework for self-improving agent harnesses. The framework pairs four editable
    runtime components (context and state, agent control, action interfaces, and verification and recovery) with
    a four-stage loop that diagnoses failures, proposes code patches, validates candidates, and deploys updates.
    Using this framework, we show how optimizers trace errors across long trajectories and discover reusable runtime
    mechanisms such as pre-stop verifiers, loop breakers, and persistent memory. We further show why full-harness
    rewrites overfit or break across modules, and how modular updates with validation gates generalize across models
    while bounding token cost. To keep self-modification safe, we establish practical defenses against recurring
    failure modes including prompt bloat, benchmark gaming, and evaluator tampering. Finally, experiments on SWE-bench
    Lite validate this framework, showing that gated modular evolution outperforms prompt reflection and full-harness
    rewrites across models and repositories at a fraction of the token cost.'
