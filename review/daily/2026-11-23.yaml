  abstract: 'Preparing, executing, and validating strongly coupled multi-physics simulations require expert time.
    Agentic workflows use large language models (LLMs) to coordinate them from natural-language descriptions, but
    reliability requires checks of physical consistency and fidelity to the problem description. Our agentic harness
    implements explicit task allocation: LLMs interpret user requests and simulator diagnostics, generate input
    components not covered by predefined construction rules, and propose repairs, while deterministic routines construct
    supported components and check inputs, edits, and results. We evaluate CO2-storage problems using the multi-physics
    simulator GEOS, from compositional flow to flow-poromechanics with frictional fault contact. In 80 attempts
    on two flow problems, grounding raises the proportion of structurally valid inputs from 5/20 to 20/20, but acceptance
    reaches 20/20 only with complete rule-based input preparation. With identical inputs, local repairs correct
    three seeded defects while preserving valid inputs. Supporting tests identify simulations passing physics checks
    despite differing from the problem description or reference results.'
