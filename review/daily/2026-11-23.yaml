- id: arxiv:2611.31117
  title: Self-Upgrading Embodied Agents
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.31117'
  version: 1
  source_hash: 49a46124a6960842ae18095e93ad9a72ed404320b6047a53ac04035d8432c844
  published: '2026-11-23T17:53:12Z'
  updated: '2026-11-23T17:53:12Z'
  hf_daily_dates: []
  abstract: 'An embodied agent built on a language model goes to work with the weights it was given and keeps them
    for life. To get better, it needs more training, or reflection, memory, search or prompts that cost every step
    and are lost when the task changes. Editing weights by reasoning, weight-space programming, could end this,
    but has stayed with models that only reason or relied on a far larger commercial model. We introduce the self-upgrading
    embodied agent, to our knowledge the first that learns from its own experience by upgrading its own weights
    on the job, between its tasks, with no training, no gradient, no reward model, no second model, no test-time
    scaling and no harness or prompt engineering. By day a 27B agent works in a household environment. At night
    it reads its record, finds many of its steps wasted on replies that reach the token limit before any action,
    traces the habit to one direction in its hidden states, and rewrites one tensor of its weights. An agent that
    rewrites itself must first never break itself, so it is its own examiner: it tests every change against its
    unchanged self on practice tasks and keeps only what holds. When an edit holds, the next day it is a better
    agent, at the same cost per step: over thousands of held-out episodes, 48 fresh seeds a task, its one kept edit
    makes it complete significantly more tasks, in fewer steps, with fewer wasted and fewer tokens. This self-improvement
    is multi-round, stable and continual: through the nights that follow, the upgrade holds, without collapse. Of
    four sizes of its family, only the 27B agent does this. From here on, an embodied agent need not keep training
    and inference apart: as it works, it gathers its own experience and upgrades itself, with no separate pre-training
    or post-training and no human intervention. We believe this opens lifelong continual learning for robots: stable,
    continual, recursive self-improvement.'
