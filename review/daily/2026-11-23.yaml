- id: arxiv:2509.21862
  title: 'Shachi: A Modular, Controllable Framework for LLM-Based Agent-Based Modeling of Emergent Collective Behavior'
  announced: '2025-09-26'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2509.21862'
