- id: arxiv:2611.15449
  title: 'Reading the Unreadable: Text-Aware Image Super-Resolution Needs Reasoning'
  announced: '2026-11-11'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.15449'
  version: 1
  source_hash: 19ded000d14fbab21d06fcfcfc128e2b3c6bd8c7be708f3e714f5ac1bb5d6bf9
  published: '2026-11-11T13:19:01Z'
  updated: '2026-11-11T13:19:01Z'
  hf_daily_dates:
  - '2026-11-23'
  abstract: 'Text-aware image super-resolution (TAISR) aims to recover high-resolution images from low-resolution
    inputs while preserving textual content. Existing methods treat this as a visual restoration problem, yet severely
    degraded text often cannot be read from local visual evidence alone. Humans instead read it by reasoning over
    image context, logical patterns, and prior knowledge. This raises a fundamental question: Does TAISR need reasoning?
    To answer this, we introduce two diagnostic tools. The first, ReasonText, is a human-curated benchmark that
    separates reasoning-required text from locally recoverable text. The second, Ground-Truth Text-Crop Accuracy
    (GTTCA), is a recognition-based metric that measures text restoration quality without text detection errors.
    Evaluating twelve recent super-resolution (SR) models, we find a consistent and substantial performance drop
    on reasoning-required text, revealing a systematic blind spot. Two observations point to a remedy. One is that
    text-conditioned SR models restore text substantially better when given ground-truth text. The other is that
    multimodal large language models (MLLMs) can read degraded text in low-resolution images through reasoning.
    We therefore propose Reasoning Transfer via Captioning (RTC), a training-free plug-in that uses an external
    MLLM to infer the degraded text and feeds the resulting caption to a text-conditioned SR model. RTC consistently
    improves all six text-conditioned SR models we evaluate, especially on reasoning-required text. Surprisingly,
    a real-world SR model with RTC can even outperform the TAISR model with RTC, suggesting that reasoning should
    be a core design axis for future TAISR.'
