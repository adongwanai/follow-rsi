- id: arxiv:2611.27211
  title: Explicit Style Extraction for Personalized Long-Form Text Generation
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.27211'
  version: 1
  source_hash: b6cbdc6d070fa2b981fe5032bd6374fd5d67cbbbfd6e43e52a086f47de51e2d0
  published: '2026-11-20T06:52:18Z'
  updated: '2026-11-20T06:52:18Z'
  hf_daily_dates:
  - '2026-11-23'
  abstract: 'Personalized long-form generation asks a language model to write new text the way a specific user would.
    The standard recipe, retrieval-augmented generation, places a few of the user''s past texts in the prompt but
    leaves the model to decide what to take from them. We introduce StylePrism, a taxonomy of 28 stylistic aspects
    in seven categories, and SP-Refine, an inference-time method that makes style extraction an explicit step: the
    model first fills StylePrism with the user''s patterns, quoted evidence, and habits to avoid, then drafts from
    the user''s samples and revises the draft twice against this profile, guided by its own style scores. On the
    three long-form tasks of LongLaMP with three LLMs, SP-Refine outperforms LongLaMP''s retrieval-augmented baseline
    in 25 of 27 ROUGE and METEOR comparisons, by 10.2% on average and by up to 35.8%. Annotating users'' own texts
    with the extracted profiles shows that StylePrism captures concrete, checkable habits, from the order of rhetorical
    moves to a reviewer''s sign-off. Ablations show that the profile helps as revision guidance, not as a replacement
    for the samples: writing from the profile alone is worse in all 27 comparisons, while a single implicit-inference
    call is a cheaper alternative that comes close. Oracle variants that let the reviser see the reference, together
    with reference-free controls, show that larger refinement gains require information unavailable at inference
    time.'
