- id: arxiv:2611.25534
  title: 'How Feedback-Free Self-Evolution Reshapes Agent Skills: A Systematic Study'
  announced: '2026-11-19'
  window_status: already_published
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2611.25534'
  version: 1
  source_hash: ccbffc69ae0ef0311919fb0ba548748d62d25e1320503643856fb2c688341798
  published: '2026-11-19T05:32:18Z'
  updated: '2026-11-19T05:32:18Z'
  hf_daily_dates:
  - '2026-11-23'
  abstract: 'Agent skills are documents in which experts write down procedural knowledge, and models increasingly
    maintain them by rewriting them without feedback. Such rewriting could adapt a skill to the model that uses
    it or erode the expert knowledge that makes it useful, yet how skills evolve under this feedback-free self-evolution
    has not been studied. We let models rewrite expert skills round after round without any task, run or judgment
    and run agents built on the same models with the rewritten skills. Our experiments show that the skills lose
    value rather than improve, as every model we test performs worse with them on every benchmark, by 15 points
    on average on SkillsBench after thirty rounds. Sampling each model''s prior with skills it writes from the topic
    alone, we find that rewriting pulls skills toward this prior and gives up first the knowledge outside it. Putting
    this knowledge back recovers much of the lost pass rate, so an expert''s skill is valuable largely for what
    the model does not write on its own. Building on this insight, SkillDiff marks this knowledge in place and raises
    the pass rate on SkillsBench by 4.8 points on average without feedback or any change to the skill''s text. Project
    repository: https://github.com/LitaoGuo/How-Self-Evolution-Reshapes-Skills.'
  llm: {}
