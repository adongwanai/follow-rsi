- id: arxiv:2611.30139
  title: 'AutoSECO: Automated Skill Evolution for Cross-Problem Combinatorial Optimization with General-Purpose
    LLM Agents'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
