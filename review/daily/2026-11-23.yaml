- id: arxiv:2611.28123
  title: 'Seeing the Invisible: How Vision-Language Models Read, Predict and Trace Radio Fields'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.28123'
