- id: arxiv:2611.27973
  title: 'MemOnce: A Scalable Memory Architecture for Large Language Models'
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.27973'
  version: 1
  source_hash: 5aac7f5289982ca6c8fc09af8c5c79ab6cb60364ccf388ca9abf35329f308d04
  published: '2026-11-20T18:51:29Z'
  updated: '2026-11-20T18:51:29Z'
  hf_daily_dates:
  - '2026-11-23'
  abstract: 'Deploying large language models (LLMs) in long-horizon and continual interactions requires maintaining
    reusable memory states for future inference, posing challenges for existing architectures. Standard Transformers
    accumulate layer-wise, token-level KV caches, incurring linear GPU memory growth and quadratic computational
    complexity as the context expands. In contrast, linear-time architectures compress history into fixed-size states,
    but struggle to retain fine-grained details. We introduce MemOnce, a foundation architecture that learns scalable
    memory states for language models. MemOnce is based on two core designs: (a) Memory encoder-decoder: it caches
    only a small subset of final-layer hidden states as compact memory representations and dynamically decodes them
    back into KV caches for attention layers; (b) Memory sparse attention: for each continual input, MemOnce adaptively
    retrieves relevant memory representations, with the sparse indices computed only once across layers. Coupling
    these two designs enables efficient on-the-fly memory loading and KV cache decoding, drastically reducing the
    GPU memory footprint and achieving linear-time complexity. We conduct extensive experiments to show that MemOnce
    outperforms Transformers and other architectures across varying model sizes, context lengths, and training paradigms
    (pretraining and post-training adaptation). In particular, adapting Qwen3.5-4B with MemOnce reduces memory state
    cache by 1313$\times$ and prefill latency by 6.9$\times$ at 1M context, and improves throughput by 3.5$\times$
    and overall memory performance by +5.77%. Finally, MemOnce generalizes zero-shot to downstream representation
    tasks, achieving competitive results against specialized models.'
