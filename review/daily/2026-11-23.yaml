- id: arxiv:2611.23417
  title: Autoregressive View Model
  announced: '2026-11-17'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.23417'
  version: 2
  source_hash: 51fb113912a7d91b59152e1d227df020a1fc5ae0183a64878286dc83b48246bf
  published: '2026-11-17T19:20:06Z'
  updated: '2026-11-20T17:27:55Z'
  hf_daily_dates:
  - '2026-11-23'
  abstract: We present the Autoregressive View Model (AVM), which generates a scene as a stream of views without
    constructing an explicit 3D representation. Through a unified in-context interface, AVM conditions on images
    or videos to generate short clips along a requested camera path. Visual context grounds reconstruction and interpolation,
    while a learned prior enables extrapolation into unseen regions. AVM retrieves relevant views from inputs and
    generated history to form a bounded active context. We fine-tune a pretrained bidirectional video diffusion
    transformer with flow matching in an N-in-1-out formulation. We then tune a causal model on its own rollouts
    to improve photorealism, reduce denoising steps, and limit long-horizon drift. We scale training to approximately
    8M scenes and video clips. We evaluate generation capacity and scene persistence across benchmarks for camera
    control, text control, visual quality, dynamics, sparse and 4D reconstruction, and long-horizon consistency.
    The results demonstrate that AVM adapts to diverse input and output settings through one in-context interface.
