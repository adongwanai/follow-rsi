  updated: '2026-11-23T13:28:20Z'
  hf_daily_dates: []
  abstract: Controllable generation can expand training data for driving perception, but visual realism alone does
    not ensure learning gains. Effective generation must adapt both what data to generate and how to construct them
    as the perception model evolves. In this paper, we present DriveDreamer-RSI, a framework for recursive self-improvement
    of driving perception and agentic data generation through feedback between perception learning and data construction.
    Its outer loop implements Gap-Guided Target Adaptation, generating labeled videos from current perception gaps
    and updating targets after training. Its inner loop uses a vision-language agent to iteratively edit scenes
    through observation and execution feedback. Across rounds, Learning-Feedback-Driven Strategy Refinement derives
    reusable construction advice from execution experience and downstream learning outcomes. On the nuScenes validation
    set, DriveDreamer-RSI surpasses the dataset-replay baseline by 4.09 mAP and 4.13 NDS points using approximately
    half the synthetic frames.
