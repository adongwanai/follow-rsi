- id: arxiv:2611.26613
  title: 'AgentRoboCritic: Understanding the Capability of Frontier Agents on Direct Robot Control'
  announced: '2026-11-19'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
