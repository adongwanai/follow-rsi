  version: 1
  source_hash: cf30cc8399bab618282673459ef390a28459cf7b42679b80e90d5fc2f4124cc2
  published: '2026-11-18T09:07:04Z'
  updated: '2026-11-18T09:07:04Z'
  hf_daily_dates:
  - '2026-11-23'
  abstract: Vision-language-action (VLA) models enable unmanned aerial vehicles (UAVs) to follow natural-language
    instructions, yet still fail frequently in closed-loop flight. Correcting these failures requires repairs, i.e.,
    actions that avoid them at the states the policy itself reaches, which human pilots cannot label at scale and
    rule-based planners cannot supply reliably. In this paper, we present AeroRSI, a recursive self-improvement
    framework in which an aerial navigation policy iteratively learns from its own failures. Our key insight is
    that a failing policy should judge its own repairs by flying on from them. Judged in this way, its sampled actions
    and even rule-based proposals that hurt it when imitated directly become reliable supervision. Moreover, an
    episode terminates at its first failure, concealing subsequent failures until the earlier ones are repaired.
    AeroRSI thus renews its supervision in every round, anchoring the failures of the current policy, verifying
    repairs by its continuation, and distilling them while keeping its behavior elsewhere. On TravelUAV, three rounds
    raise the success rate of a supervised 2B-parameter policy from 46.4% to 67.5% and reduce collisions by half,
    surpassing the previous state of the art by 10.6 points from the same initialization without extra human labels
    or inference cost. Code and models are available at https://github.com/starsholic/AeroRSI.
