  published: '2026-11-23T06:46:06Z'
  updated: '2026-11-23T06:46:06Z'
  hf_daily_dates: []
  abstract: General-purpose large language model (LLM) agents can develop complete solvers for combinatorial optimization
    problems. Their specialization, however, often relies on workflows engineered for individual problems, limiting
    the reuse of development expertise. We propose AutoSECO, an automated skill evolution method that learns reusable
    solver-development guidance from experience. The challenge is that external evaluation measures the completed
    solver, while the skill guides decisions during development. AutoSECO connects this feedback to guidance deficiencies
    by tracing performance shortfalls through solver code and recorded development decisions. Revisions are expressed
    as general instructions and retained only if a fresh solver developed under the revised skill achieves a lower
    mean evaluation gap. Evolved solely on the traveling salesperson problem (TSP), the skill guides fresh agents
    in developing solvers for capacitated vehicle routing, job-shop scheduling, and three-dimensional bin packing
    without further skill evolution. On TSP, the final mean benchmark gap is 0.52\%, compared with 0.98\% for the
    skill-evolution baseline SkillOpt. Across all four problems, the evolved skill achieves better aggregate results
    than no skill guidance, the initial skill, and SkillOpt. The same frozen skill also supports solver development
    under alternative model--harness configurations. These findings suggest that solver-development experience can
    be retained as reusable expertise for general-purpose LLM agents.
