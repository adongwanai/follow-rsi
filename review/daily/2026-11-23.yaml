  source_hash: 1ddc7bc4638d809d3bde7280f524b9723174cebda0a44098647268981475a1d0
  published: '2025-09-26T04:38:59Z'
  updated: '2026-06-15T00:21:47Z'
  hf_daily_dates: []
  abstract: 'How collective behaviors emerge from the interactions of individual LLM-driven agents is a central
    question in artificial life, yet controlled study of these emergent dynamics has been hindered by the lack of
    a principled simulation framework for systematic experimentation. To address this, we introduce Shachi, a principled
    methodology and modular framework that decomposes an agent''s cognition into core components: Configuration
    for intrinsic identity, Memory for contextual continuity, and Tools for extended capabilities, all orchestrated
    by an LLM reasoning engine. This decomposition treats each cognitive component as an independently controllable
    variable, enabling perturbation studies that trace how micro-level cognitive traits propagate into population-level
    dynamics. We investigate behavioral patterns across a 10-task benchmark spanning three levels of collective
    complexity. Shachi enables memory transfer across environment transitions, producing history-dependent behavioral
    shifts, and allows agents to simultaneously inhabit multiple environments, revealing cross-environment interference
    invisible in single-environment studies. Furthermore, in a real-world U.S. tariff shock case study, locally
    interacting agents with individually controlled cognitive components produce macro-level market dynamics directionally
    consistent with observed real-world outcomes. Our work provides a rigorous, open-source simulation framework
    for LLM-based ABM, aimed at fostering cumulative scientific inquiry into the emergent collective behaviors of
    interacting artificial agents.'
