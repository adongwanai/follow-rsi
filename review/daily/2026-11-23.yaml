  hf_daily_dates: []
  abstract: 'Large language models have improved rapidly on tasks with verifiable answers, such as mathematics and
    programming. Much less is known about their ability to reason about what we call conceptual questions: questions
    for which no ground truth is realistically accessible and no widely accepted resolution methodology exists,
    but on which progress can still be made by debating arguments. Most philosophical questions are of this kind,
    as are central components of questions in AI safety, decision theory, and social choice. Our approach is based
    on the view that while bottom-line conclusions on such questions are hard to evaluate, individual contextualized
    arguments can be evaluated far more reliably. We therefore introduce a dataset of 951 argumentative critiques
    of 442 position texts, spanning topics from AI safety and decision theory to ethics and politics, with 1,458
    ratings by six expert raters along dimensions including centrality, strength, correctness, and clarity. We propose
    two scoring functions and benchmark a range of models. Performance tracks general capability rankings.'
