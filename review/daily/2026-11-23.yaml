- id: arxiv:2611.23476
  title: 'GUARD: Stabilizing Recursive Self-Improvement with Regret Guidance'
  announced: '2026-11-17'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: backlog
  arxiv_id: '2611.23476'
  version: 1
  source_hash: 660ff3c61c02c5d1675a2e95ed6d46bb9e7b1207371d7701feb4640f0a81e198
  published: '2026-11-17T20:26:34Z'
  updated: '2026-11-17T20:26:34Z'
  hf_daily_dates: []
  abstract: 'Autonomous AI agents pair a frozen base model with an editable harness of prompts, skills, tool rules,
    and memory. Recursive self-improvement (RSI) adapts this harness from experience without weight updates, yet
    self-editing without external graders often backfires: reflection and scalar scores conflate what an edit newly
    broke with what remains unsolved, causing local regressions, skill forgetting, and memory bloat. We introduce
    GUARD (Grader-free Unsupervised Environment Design [UED] with Adaptive Rule Distillation), a closed-loop framework
    for reference-free continual harness evolution. Our key insight is to decompose each task into pre-execution
    self-checks and guide harness updates via directional regret. Each round grades trajectories against these checks,
    pinning mastered rules while prioritizing newly broken behaviors, and selects among parallel candidate edits
    by critic-free group-relative fitness. A Soft-HURT gate then promotes an edit only when gains outweigh regressions,
    scoping specialized fixes to prevent over-triggering and guaranteeing non-regression on its gated buffer. At
    test time, one frozen harness runs in a single pass. Across benchmarks on memory, skill evolution, continual
    task streams, and domain reasoning, GUARD consistently improves performance without catastrophic forgetting
    or memory pollution while substantially cutting deployment token usage.'
