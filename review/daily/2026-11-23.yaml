- id: arxiv:2611.31475
  title: 'SpatialCraft: Evolving Procedural Intelligence from Experience and Skills for Spatial Reasoning Agents'
  announced: '2026-11-23'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: accept
  arxiv_id: '2611.31475'
  version: 1
  source_hash: 3e71b46167a10f8949d7334d86584e7042acabc80449309189044be849685f79
  published: '2026-11-23T19:47:57Z'
  updated: '2026-11-23T19:47:57Z'
  hf_daily_dates: []
  abstract: 'Spatial reasoning agents increasingly rely on external tools, such as 3D reconstruction, segmentation,
    and geometric computation, to answer questions that a multimodal large language model (MLLM) cannot resolve
    from pixels alone. Tool access, however, shifts the bottleneck to orchestration: the agent must decide which
    tools to call, in what order, and how to interpret their outputs, yet a stateless agent repeats the same mistakes
    across tasks. We ask whether a frozen tool-using agent can improve its orchestration from its own interaction
    history, without parameter updates. We present SpatialCraft, a self-evolving framework that maintains two forms
    of external knowledge: Experiences, condition-action tactics distilled by contrasting rollouts of the same task,
    and Skills, multi-step procedures with explicit activation and termination conditions. Three designs couple
    the two streams. Experiences can be anchored to a Skill, appearing only while it is active rather than once
    per task. A Contrastive Utility Score estimates each Experience''s effect by randomly withholding it across
    rollouts of the same task, separating its contribution from task difficulty, and Experiences with consistently
    positive utility are consolidated into the Skills they support. Across five spatial benchmarks and four backbones,
    SpatialCraft achieves the best accuracy in all 20 settings, showing that a frozen agent can learn to orchestrate
    spatial tools from its own experience.'
