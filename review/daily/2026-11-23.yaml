  updated: '2026-11-23T17:39:59Z'
  hf_daily_dates: []
  abstract: Scaling robot manipulation learning remains challenging due to the high cost of collecting real-world
    interaction data. Real-to-Sim-to-Real (Real2Sim2Real) offers a promising route by enabling policy learning in
    simulation grounded in real-world observations, yet scaling this paradigm across diverse tasks and physical
    interactions remains difficult. We introduce Real2Worlds2Real, a self-improving agentic framework that integrates
    scalable simulation-world construction with policy development. Given limited visual observations and task descriptions,
    its tool-orchestration harness constructs faithful digital twins and expands them into diverse, physically executable
    digital cousins. The agent adaptively selects tools and revisits construction decisions, using visual and execution
    feedback to refine geometry and physical behavior. Building on these worlds, the agent orchestrates policy development
    by coordinating data generation, policy learning, and refinement based on task requirements and simulation rollout
    feedback. Across both stages, the agent distills validated procedures into reusable skills that guide subsequent
    tasks. Experiments demonstrate improved world fidelity and successful real-world policy transfer, with performance
    gains from increasing world diversity and interaction-data volume. Skill reuse further improves world-building
    efficiency and long-horizon task success.
