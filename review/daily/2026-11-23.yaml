- id: arxiv:2611.24249
  title: 'From Points to Trajectories: Rethinking Multimodal Alignment for Physical Events'
  announced: '2026-11-18'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.24249'
