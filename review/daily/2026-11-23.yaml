- id: arxiv:2611.27915
  title: 'StereoVLM: Binocular Vision-Language Models for Metric 3D Spatial Reasoning'
  announced: '2026-11-20'
  window_status: in_window
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.27915'
  version: 1
  source_hash: e9aacc6f4f2bcc0d8603384d0c19b6967d495a360c714bbc8592ec5b1024e7c7
  published: '2026-11-20T17:52:02Z'
  updated: '2026-11-20T17:52:02Z'
  hf_daily_dates:
  - '2026-11-23'
  abstract: Vision-language models (VLMs) exhibit strong semantic understanding but remain limited in their ability
    to reason about metric 3D space in the physical world. Existing VLMs typically infer 3D scene structure from
    one or more images without known camera calibration or cross-view geometric constraints. This makes metric 3D
    inference inherently ambiguous and leaves it unclear whether their spatial predictions are grounded in visual
    evidence or driven primarily by semantic priors. In contrast, calibrated stereo provides explicit cross-view
    geometry that resolves this ambiguity and offers a more reliable foundation for metric 3D perception and geometric
    generalization. We investigate how VLMs can learn transferable 3D representations directly from calibrated binocular
    observations. To this end, we introduce StereoVLM, the first geometry-aware binocular VLM for metric 3D spatial
    reasoning. StereoVLM follows a hierarchical learning paradigm spanning from cross-view correspondence and disparity
    estimation to calibration-conditioned metric depth perception and semantic spatial reasoning. We further find
    that disparity supervision generalizes substantially better than direct binocular depth supervision on unseen
    environments. To evaluate these capabilities, we introduce Stereo3D-Bench, a comprehensive benchmark across
    three levels, from point-level geometry to object-level spatial reasoning. StereoVLM-8B achieves 95.17% depth
    accuracy ($δ_1$) and a 66.98 average object-level score on Stereo3D-Bench. Intervention results further indicate
    that the model's performance on Stereo3D-Bench benefits from valid cross-view geometry and cannot be explained
    solely by additional visual tokens or semantic priors. Hierarchical geometric supervision also yields average
    gains of 3.54 points across five spatial benchmarks and 4.3 percentage points in RoboCasa manipulation success.
