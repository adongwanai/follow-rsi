  updated: '2026-11-23T17:28:31Z'
  hf_daily_dates: []
  abstract: 'Slay the Spire 2 (STS2) is a single-player deck-building game that requires long-term planning under
    heavy randomness. We present AlphaDefect, an expert-level AI system for STS2: for each character, one network
    trained with proximal policy optimization (PPO) makes every decision of a run, in combat and outside it. At
    the highest difficulty, Ascension 10, on two versions of the game current in November 2026 and on test seeds
    not played in training, AlphaDefect wins 62-77% of runs across six characters with greedy play and 68-80% with
    test-time search, after 1.3 to 6.7 billion decisions of training per character; runs uploaded by human players
    of all levels are won 11-20% of the time at the same difficulty. The networks read the game as entity records
    that identify each card, relic and enemy through a learned embedding and attributes from the game data, together
    with consequences of public information computed by the engine. Ablations show how much the agent depends on
    this encoding: without these identities, the network did not win a single run, and without the computed consequences
    it won 8.3 points fewer. To our knowledge, AlphaDefect is the strongest publicly reported STS2 agent as of November
    2026.'
