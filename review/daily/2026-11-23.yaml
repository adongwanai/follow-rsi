  abstract: 'We introduce Transformation Tracking and Understanding (TTU), extending video object tracking to environments
    where objects undergo physical assemblies and disassemblies. TTU requires continuously tracking objects through
    transformations, identifying new entities, maintaining a state graph of their relationships, and assigning semantic
    labels to transformations. While foundation models (e.g., SAM 2/3) maintain tracklets through appearance changes,
    they cannot update semantic identities as objects physically evolve. Prior work addresses only disassemblies,
    relying on expensive searches triggered only when tracking fails. We propose Tracking Instances via Proposals
    and Overlaps (TIPO), a training-free framework that continuously infers transformations via a generate-evaluate-judge
    pipeline. TIPO generates split and merge proposals from disjoint mask components, scores them against mask-decoder
    priors using inner and external overlap, and queries an MLLM on the top proposal for visual verification and
    semantic labeling. To benchmark TTU, we curate Video Instances, States, and Transformation Annotations (VISTA),
    a dataset including state graphs with 124 assembly and 132 disassembly events across 50 sequences and over 26,000
    frames. TIPO achieves state-of-the-art tracking and state-graph accuracy on VISTA, while operating $6\times$
    to $15\times$ faster than prior methods. Project page: https://davidegardenal.github.io/tipo-tracking'
