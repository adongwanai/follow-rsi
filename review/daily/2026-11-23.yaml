- id: arxiv:2611.22179
  title: 'RAG in a Trenchcoat: When Minimal Memory Is Enough for Agentic Systems, and When It Isn''t'
  announced: '2026-11-17'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: reject
  arxiv_id: '2611.22179'
  version: 1
  source_hash: 67523c3eb59fb21bb327a625903892a924631ff186f4550494aaa27c1e1a395f
  published: '2026-11-17T04:16:34Z'
  updated: '2026-11-17T04:16:34Z'
  hf_daily_dates: []
  abstract: 'Agentic memory research has accumulated extraction, supersession, reflection, and graph synthesis on
    top of retrieval-augmented generation. However, we found that almost none of those primitives earn their cost
    in our tested memory benchmarks: we show this with BRIDGE, a deliberately minimal RAG memory with chained observation
    notes, hybrid BM25 with cosine retrieval, and chronological rendering, which reaches parity within bootstrap
    CI with the prior SOTA on LongMemEval-S and BEAM, and beats the best memory baseline on EverMemBench by 5.7-6.3
    points at matched reader. It runs at ~5-7K reader-prompt tokens per query, using a single LLM call for each
    ingestion or query. We argue that this parity is itself the result: standard benchmarks score what memory retrieves,
    not what memory enables when the agent acts. To test the latter, we introduce five adversarial probes (Rule
    Application +-, Pattern Induction Style / Procedural, Dynamic Multiturn) judged at generation time by a cross
    vendor verification chain, where each query can only be solved by applying a remembered rule or pattern it never
    mentions. Across 5 probes x 20 scenarios, no architecture wins universally: atomic fact extractors (LangMem)
    win rule application, while BRIDGE''s block-summary memory wins pattern induction. This result holds across
    four domains, three graders, and three reader families. Each design fails where the other wins, for reasons
    a recall benchmark cannot see: atomic-fact extractors discard the form a demonstrated pattern takes, while block-summary
    memory retrieves the rule but the reader does not act on it, a gap that presenting the rule more prominently
    largely closes. What separates memory designs is not what they retrieve but what they enable an agent to do,
    and that is what agentic memory should be evaluated on.'
