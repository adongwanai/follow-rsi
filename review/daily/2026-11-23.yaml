  source_hash: 415ff4346d11b23f81c80b4627668ce7a40fe9cb248a2572ca3e40343632ccc6
  published: '2026-11-19T18:57:25Z'
  updated: '2026-11-19T18:57:25Z'
  hf_daily_dates:
  - '2026-11-23'
  abstract: Frontier multimodal language agents such as GPT-6 Astra have demonstrated strong capabilities in controlling
    robots directly via low-level numerical actions without high-level primitives. However, existing benchmarks
    report only episode-level success rates, which show neither how these agents succeed nor where they fail. In
    this paper, we present a systematic action-level analysis of frontier agents on direct robot control across
    12 manipulation benchmarks. We introduce AgentRoboCritic, an intent-grounded critique framework in which the
    policy agent states a local intent alongside each action, and a critic evaluates the action's outcome and failure
    mode against this intent. Our action-level analysis demonstrates the promising capabilities of frontier agents
    on direct robot control, including closed-loop recovery from local execution failures, reliable semantic grounding
    across diverse scenes, and strong zero-shot manipulation without task-specific adaptation. It also identifies
    their current limitations, including task-relevant physical execution bottlenecks such as grasping and alignment,
    and uneven recovery across failure modes. Finally, we validate our critic on a 400-action human-annotated benchmark
    and release a dataset of 12,844 annotated actions alongside a fine-tuned open-source critic, Muse-Glimmer-30B,
    whose failure-mode accuracy rises from 32.58% to 74.24%, enabling low-cost action-level analysis.
