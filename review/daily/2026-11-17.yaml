    secondary: []
  summary_zh: Harness 侧持续修订技能，并在有界记忆里保留技能解释不了的高残差样例；参数侧用双锚点（上一检查点与基座）约束漂移，把经验吸收进权重。
  summary_en: On the harness side, continually revises skills and retains high-residual examples unexplained by
    the skills in bounded memory; on the parameter side, two anchors, the previous checkpoint and the base model,
    constrain drift while absorbing experience into weights.
