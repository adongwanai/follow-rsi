  published: '2026-10-29T09:46:50+00:00'
  updated: '2026-10-29T09:46:50+00:00'
  hf_daily_dates:
  - '2026-11-04'
  abstract: Molecular discovery requires navigating vast combinatorial search spaces while balancing competing biological
    objectives. AI agents can automate expert-defined molecular design protocols, but automation alone does not
    address how to optimize workflows for new tasks or improve their development through experience. Here we introduce
    MoLRSI, an AI agent that combines systematic optimization of workflows and model architectures with persistent
    cross-task memory to recursively improve its search policy for molecular discovery. Workflow performance, refinement
    outcomes, and execution feedback guide subsequent searches, allowing the agent to improve both its workflows
    and its strategy for developing them. We evaluate MoLRSI in two challenging molecular discovery settings that
    require balancing competing properties. In antibiotic discovery, MoLRSI developed a screening workflow balancing
    antibacterial activity, cytotoxicity and structural novelty, achieving an experimental hit rate of 15.9%, compared
    with 8.7% for a previous expert-led workflow using the same training data and screening library. In de novo
    peptide-MHC binder design, MoLRSI developed workflows that jointly consider target binding and specificity,
    producing eight experimentally validated hits against MART-1 and SARS-CoV-1 pMHCs with preferential binding
    over tested off-targets while Claude Science completely failed. These findings demonstrate how experience-guided
    workflow optimization can address competing discovery objectives while improving the search strategies used
    in subsequent campaigns.
