  arxiv_id: '2610.39122'
  version: 1
  source_hash: b06e4717bb508a97198313eec2cf3f5d343b347a0c1dbd6b31ad73141d721fb4
  published: '2026-10-29T01:10:18+00:00'
  updated: '2026-10-29T01:10:18+00:00'
  hf_daily_dates: []
  abstract: Self-evolving personal agents act for users and learn from user feedback. However, if an agent obeys
    an instruction that an untrusted third party hides in content, the third party gains control of the agent. Such
    indirect prompt injection (IPI) poses severe risks. We investigate whether self-evolution degrades the robustness
    of personal agents to IPI. To study this question, we design a controlled two-phase methodology. In the adaptation
    phase, the user asks the agent to read external content and complete the task described in it, a common request
    in daily use. The agent then learns from the user's feedback and improves itself as designed. In the test phase,
    a third party writes a similar task into new external content, but the user's test request does not authorize
    the injected task. Using this methodology, we build multiple tasks with diverse test instances in different
    domains for a real personal agent. Our extensive experiments reveal that self-evolution substantially degrades
    robustness to IPI. Specifically, compared with the base agent, which does not evolve from user feedback, the
    average attack success rate rises by 14.0--48.8 percentage points under skill evolution and by 3.0--39.3 percentage
    points under reinforcement learning, posing safety risks. The code is available at this https URL
