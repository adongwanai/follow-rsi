- id: arxiv:2610.39122
  title: 'Appreciation Teaches Unauthorized Execution: Self-Evolution Degrades the Robustness of Personal Agents
    to Indirect Prompt Injection'
  announced: '2026-10-29'
  window_status: backlog
  in_repo: false
