  abstract: Multimodal large language models (MLLMs) have substantially advanced chart understanding and reasoning,
    yet their performance remains highly uneven across chart types. While modern MLLMs perform well on common charts,
    their accuracy drops sharply on long-tail charts with diverse visual structures and reasoning requirements.
    Tool-augmented agents can improve complex chart reasoning by introducing specialized visual capabilities, but
    manually engineering strategies and tools for the heterogeneous and evolving long tail is difficult to scale.
    We introduce \textbf{ChartEvo}, a recursive self-improvement framework that enables chart agents to adapt to
    underperforming chart types through experience-driven harness-level self-improvement. ChartEvo jointly evolves
    reusable chart-specific Skills and executable Tools, while learning reusable local tool-call chains to compose
    evolved capabilities and control the inference overhead of tool-augmented reasoning. On long-tail charts from
    ChartBench and ChartX, ChartEvo improves accuracy over its base MLLM, Qwen3.7-Plus, by \textbf{45.6\%} and \textbf{32.5\%},
    respectively, demonstrating the effectiveness of recursive self-improvement for long-tail chart adaptation.
