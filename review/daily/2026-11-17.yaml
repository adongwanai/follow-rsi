  abstract: 'Scientific computing increasingly relies on large language model-based agents for performance engineering
    tasks such as instrumentation, analysis, and workflow porting. However, agent effectiveness depends heavily
    on the surrounding harness, which typically relies on manually written skills and curated memory. This limits
    autonomous learning, forcing agents to repeatedly rediscover solutions rather than retain and reuse knowledge
    from prior executions. We introduce Phronix, a capability-centric learning paradigm that enables agentic harnesses
    to acquire, validate, and refine reusable capabilities from their own executions. Phronix operates through a
    predictor-validator-corrector loop: MCP tools and associated skills propose solutions, tool executions validate
    them, and observed outcomes refine the stored capabilities. It distills every observed interaction into a capability
    store and researches a failing task rather than abandoning it. First, such learned capabilities solve a recurring
    task on the first attempt in 93-95% of cases across every model, significantly reducing solution non-determinism
    and improving reliability. Second, Phronix turns an agent''s own execution into 7.6-30.8 durable capabilities
    per task without user instruction, and creation falls below two once the needed capability exists. Third, warm-start
    runs consume only 0.38-0.40 million tokens per task, which is three to four times less than a single baseline
    attempt, while a cold-start costs no more than the baseline. On the 1000 Genome Pegasus workflow, instrumenting
    a production application for I/O performance analysis, Phronix passes all 11 correctness checks against six
    for the baseline harness, and also lifts the task solving rates of two cheaper models from 29% and 27% of SWE-bench
    tasks solved to 91% and 87%, respectively, matching the performance of the most expensive evaluated model.'
