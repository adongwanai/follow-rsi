  updated: '2026-10-26T15:11:26Z'
  hf_daily_dates: []
  abstract: 'We present the Infinity Machine, a self-improving AI agent that we use for research on problems whose
    answers aprogram or data can check. Each candidate solution is produced by a full tool-using agent that works
    for up to an hour in a fresh sandbox; proposers see only a public score, and a private split decides what counts.
    The harness itself(prompts, tools, skills, playbook, meta agent) is an editable genome, changed only through
    a kernel-enforced gate with held-out and cost checks. An autonomous mode goes from a plain-text goal to a verified
    report with no human step: an agent picks an open problem and writes its verifier, the kernel calibrates it,
    an adversarial agent audits it, and an agent that never sees the verifier re-checks the result. Across fourteen
    problems in six days, for about $180 of model usage, the system produced four results beyond the published state
    of the art on catalogued open problems in quantum information: a certified depolarizing-channel threshold point
    p = 0.064966, a qutrit positivity frontier of 0.2910672, a 44-gate depth-6 Golay state preparation, and a stabilizer-rank
    bound chi(T^7) <= 10. It also cut SABRE qubit-routing overhead from 68,559 to 12,087 added gates. In hardware,
    it cut the energy per MAC of an open 8x8 INT8 systolic tile by 77.7% through a full open RTL-to-GDS flow, bit-exact.
    Three fully autonomous runs ended in honestties with public records; one audit caught a stale record, and one
    agent-written score pointing the wrong way went unnoticed. We report the failures as carefully: the one self-derived
    harness generation was rejected on cost, proposers gamed lenient scorers four times, and operator changes were
    decisive for several results.'
