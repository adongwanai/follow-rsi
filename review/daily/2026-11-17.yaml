- id: arxiv:2610.39714
  title: 'MoLRSI: A Recursive Self-Improving AI agent for Molecular Discovery'
  announced: '2026-10-29'
  window_status: backlog
  in_repo: false
  gate: {}
  llm_primary: ''
  decision: defer
  arxiv_id: '2610.39714'
  version: 1
