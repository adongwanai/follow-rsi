- id: arxiv:2610.04184
  arxiv_id: '2610.04184'
  title: 'EvalResearchBench: Can AI Agents Build Their Own Feedback for Recursive Self-Improvement?'
  version: 1
  source_hash: b3844f6da1ef4bf7ae2d5b63100fee68eaa431dc1798963e8483f2bff12cfc73
  abstract: Recursive self-improvement (RSI) relies on evaluation feedback to assess progress and guide further
    research, yet repeatedly running complex benchmarks is costly and slows iteration. Human experts reduce this
    cost by selecting benchmark subsets or designing compact suites. We ask whether AI agents can automate this
    design process and introduce EvalResearchBench (ERB), a benchmark for autonomous evaluation research. Given
    target materials, development references, candidate APIs, and fixed time and API budgets, an agent called the
    researcher selects or synthesizes tasks, implements graders, and revises them in pilot tests before freezing
    an executable evaluator for coding, co-work, and reasoning. We study 9 researchers and 13 candidate models and
    compare each frozen evaluator with 14 target benchmarks on score concordance and pairwise agreement. The best
    evaluators order about 75\% of candidate pairs as the targets do, below the 91\% ceiling set by disagreements
    among the targets. No researcher leads on every metric, and the best evaluator on development targets is not
    the best on sealed targets hidden from the researcher. A human-designed sample of public tasks remains a strong
    baseline, and the evaluator with the lowest recorded execution cost attains the highest pairwise agreement.
    Agents repair tasks and graders through pilot feedback, yet their evaluators can still truncate answers, exhaust
    the evaluation budget, or let a few questions dominate a domain score.
