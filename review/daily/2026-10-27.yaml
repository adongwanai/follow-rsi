- id: arxiv:2610.18082
  arxiv_id: '2610.18082'
  title: Failure Recovery via Belief Updates and World Modeling for Long-Horizon Agents
  version: 1
  source_hash: 7cc2bcc450cefc1937569365d3a380177c1bf88344da532cdbb4692c0ca1ad05
  abstract: Long-horizon agents often struggle to recover from failures whose causes lie several steps earlier,
    beyond what local reflection or backtracking can resolve. We introduce BELIEFWEAVER, a framework that combines
    persistent evidence across attempts with prospective reasoning over repair directions. It maintains a relational
    belief state over frontiers, attempts, observations, and checkpoints. Execution evidence updates related frontier
    priorities across attempts and rollback, while diagnostic evidence gates execution. An implicit world model
    (IWM) evaluates repair hypotheses, predicts progress, and identifies relations among frontiers to guide exploration.
    We further distill these recurring IWM reasoning components into a 9B student through supervised fine-tuning
    and on-policy distillation (OPD). Across three terminal-based benchmarks, BELIEFWEAVER improves aggregate final
    score by 5.1 percentage points over native Terminus-2 continuation, with positive trends in exploration efficiency.
    The distilled 9B student improves final score by 9.8 percentage points over the reported native baseline while
    reducing estimated teacher API cost by 54.8% relative to the matched teacher. These results show that persistent
    evidence and prospective reasoning can improve recovery in long-horizon agent tasks while substantially reducing
    reliance on teacher-model inference.
