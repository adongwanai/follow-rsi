- id: arxiv:2610.19366
  arxiv_id: '2610.19366'
  title: 'Seeing, Maintaining, and Learning: The Evolution of Multimodal Agent Memory'
  version: 1
  source_hash: a29acb5a25a5138414cd4d881495e5a76653bc147b3fbe865e62ef6016eb0fba
  abstract: 'Multimodal models and agents have emerged to enable AI systems to learn from and interact with the
    real world more like humans by integrating information across multiple modalities. However, enabling multimodal
    agents to continually acquire useful information from complex, heterogeneous multimodal data remains a significant
    challenge as they move toward long-horizon tasks and lifelong settings. Addressing this challenge requires effective
    memory mechanisms that can maintain continuity across sessions, adapt to changing users and environments, and
    refine memory-management policies through accumulated experience. We introduce a two-axis analytical framework
    for multimodal agent memory structured around two key questions: how multimodal information is formed and represented
    (Axis I, Formation and Representation), and how its management adapts with accumulated experience (Axis II,
    Memory Management). Axis I, Formation and Representation, characterizes what information is retained and how
    it is encoded (e.g., modality-specific embeddings, textual and structured records, latent and parametric representations)
    to support subsequent reasoning and action. Axis II, Memory Management, distinguishes three tiers: T1 Static
    Memory reuses fixed memory; T2 Dynamic Memory updates memory through a stable policy; and T3 Self-Evolving Memory
    updates memory through an evolving policy. Based on this framework, we synthesize recurring design patterns
    and derive principles for balancing source fidelity with abstraction, maintaining temporal validity and provenance,
    grounding memory use in recoverable evidence, and evolving memory policies over time. Furthermore, we discuss
    the challenges and potential future directions for the memory mechanism of multimodal agents.'
