- id: arxiv:2610.20571
  arxiv_id: '2610.20571'
  title: 'Any Time, Any Space: A World-State-Centric Framework for Agentic Video Generation'
  version: 1
  source_hash: 55b3e54779d5046c05df41efce873a7cf9838a7ddeb825f5b8386a0c949cfd54
  abstract: 'Long-form agentic video generation must turn a screenplay into shots that remain spatially and temporally
    consistent across nonconsecutive requests. Passing prompts or recent frames between shots does not provide a
    shared spatial frame for revisiting a scene or a time-indexed record for replaying an earlier event. We present
    Any Time, Any Space (ATAS), which compiles a screenplay into shot requests with explicit location, camera, and
    event-time references. Before generation, it retrieves relevant evidence from a scene memory of registered static
    geometry and an event memory of dynamic observations indexed by scene, event, and time. After generation, ATAS
    reconstructs and registers the clip. It updates memory only when review and state checks accept the observation,
    while film delivery remains independent of memory admission. Across four video generators, ATAS improves all
    reported cross-shot consistency measures and achieves the highest aggregate benchmark score for each backbone.
    It also outperforms the compared agents and 3D-guided methods on target-image spatial revisit, leads three event-recapture
    criteria, and receives the highest human ratings on all six criteria. The video results and code are available
    on our project page: https://lhmd.top/atas/.'
