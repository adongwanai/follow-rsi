  title: 'HexaShell: A Thin Harness for Exploring the Limits of VLM Agents as Robot Coding Agents'
  version: 1
  source_hash: 214fa1831a5c4cd9086669d0fb8a9dbc1ba5f54ca9c7a10477e6a6aecaf5f031
  abstract: 'Agents built on vision language models (VLMs) now compete with learned policies on robot manipulation
    leaderboards. We ask how far a coding agent can go when it controls a robot instead of a computer, and where
    it stops. Our system, HexaShell, keeps the harness thin: it only turns the agent''s commands into robot motion.
    The agent drives a robot with two arms through one command line. It sees three RGB cameras and knows their calibration.
    After each failed attempt, the agent reads the log, finds the cause, and writes or fixes small programs called
    tools. In this way it keeps what it learns as code, as a coding agent does when it fixes a failing test. The
    tools may use only what the robot observes. They use triangulation to find where objects are, relative to each
    other and to the gripper. If two cameras see the same point, the point lies where the two camera rays meet.
    If a point lies on a known plane, such as the table or the top of a block, it lies where its ray meets that
    plane. When the head camera is not enough, the robot moves a wrist camera to get a second view. We build the
    tools on only ten layouts of one seed per task, then freeze them and test them on ten new layouts of the same
    seed. We use Codex with GPT-6-Astra at medium reasoning effort. On all 42 RoboDojo tasks, HexaShell reaches
    a success rate of 39.7% and a progress score of 48.0, averaged in the same way as the leaderboard. This is a
    new state of the art on RoboDojo. The limit is contact, not reasoning: pushing reaches 92.5% and memory tasks
    65.0%, but tight insertion only 8.3%. When the agent fails, it usually sees the failure but cannot make the
    motion work. We open source the tools evolved so far at https://github.com/HexaFuture/HexaShell.'
