- id: arxiv:2610.22234
  arxiv_id: '2610.22234'
  title: 'OS-Helix: Unifying GUI Interaction and Code Execution in Native Computer-Using Agents'
  version: 1
  source_hash: 2e2fc4593fe3584e8692e1cc918d228b5eb69ce0c661a5ff996f6eb5e773dbc4
  abstract: Real desktop automation is neither purely visual nor purely programmatic. Agents must understand user-facing
    interfaces while efficiently manipulating files, scripts, and system state. However, native GUI/code coordination
    cannot be obtained by prompt-level tool composition. In our preliminary experiments, naively adding a code tool
    degrades a GUI agent, revealing that GUI/code routing must be internalized through training on high-quality
    hybrid data. We present OS-Helix, an end-to-end trained multimodal computer-using agent that unifies GUI actions
    and code execution in one action space. To construct the required supervision, we introduce application-artifact
    composition, pairing desktop applications with authentic file artifacts to instantiate executable Ubuntu states,
    and a decoupled instruction/evaluator generation pipeline that produces environment-grounded tasks whose final
    states can be verified regardless of the solution modality. We cold-start the policy with SFT on filtered hybrid
    data and further improve it through online RL in live desktop environments. For RL, we propose Step-balanced
    GSPO, which aggregates importance weight by action step rather than raw assistant tokens to prevent long code
    actions from dominating heterogeneous-action optimization. On OSWorld-Verified, OS-Helix-27B and OS-Helix-35B-A3B
    achieve relative improvements of 35.0% and 33.7% over their matched Qwen3.5 hybrid baselines, while OS-Helix-27B-RL
    further improves by 42.9% to reach 66.44% success. Ablations provide evidence consistent with contributions
    from learned GUI/code coordination, scalable verifiable supervision, and action step balanced optimization,
    while demonstrating cross-platform transfer on WindowsAgentArena. Our project homepage is at https://os-copilot.github.io/OS-Helix/.
