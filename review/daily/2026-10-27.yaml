- id: arxiv:2610.26426
  arxiv_id: '2610.26426'
  title: 'HarnessRL: Co-Evolving Policies with a Just-in-Time Training Harness for Open-Ended RL'
  version: 1
  source_hash: c611e51b55dd647b7467887b19b675c221b9b4f42e372bf0544fb9cce53c1773
  abstract: Rubric-based reinforcement learning (RL) trains policies for open-ended generation with natural-language
    criteria as rewards, but these rewards can become ineffective as training progresses. We identify two failure
    modes. Under non-discriminative rewards, scores collapse to uniformly low or high values due to insufficient
    exploration or a mismatch between task difficulty and policy capability. Under spurious rewards, higher scores
    do not correspond to better responses. Both reflect a training configuration whose task sampling, exploration,
    and evaluation stay fixed as the policy evolves. We introduce HarnessRL, a training-time harness that co-evolves
    with the policy through three interfaces for task sampling, rollout guidance, and rubric criteria. HarnessRL
    maintains a training-time memory from which a harness evolver retrieves within-task history and cross-task evidence.
    Using this evidence, the evolver attributes each reward failure to the interface whose update can address it.
    It then runs a proposer and just-in-time critic loop in which the critic accepts a candidate update only after
    measuring its effect on the current frozen policy, returning rejected candidates for revision. We also curate
    Rubric-Mix-10k, a five-domain training and evaluation suite for open-ended RL across medical, science, writing,
    role-play, and instruction-following tasks. On Rubric-Mix-10k, HarnessRL outperforms the strongest baselines
    by 2.8 to 3.1 points across both 4B and 9B model scales and nearly halves the training steps to its best checkpoint.
    Code and data are available at https://github.com/Tongyi-ConvAI/Qwen-Character/tree/main/HarnessRL.
