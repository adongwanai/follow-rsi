- id: arxiv:2610.27227
  arxiv_id: '2610.27227'
  title: Which Agent's Skill Should Change? Group-Relative Credit Assignment for Evolving Multi-Agent Teams
  version: 1
  source_hash: a5b7809243f5c5e72bcdc6508081e28a3e65cc457a5dab76f73eab3ee2da3bbe
  abstract: 'Cooperative language-model agents can improve without weight updates by revising reusable skills, but
    only if a shared team reward is traced to the responsible agent and skill. Existing methods credit the skills
    present in each trajectory, yet presence is not responsibility: a harmful skill active in successful runs still
    earns positive credit. We present GRSE, Group-Relative Skill Evolution, which assigns behavioral credit by comparison:
    inspired by GRPO, it executes each question several times under the same skill libraries and contrasts the executions
    to credit agent--skill pairs, with structured diagnosis of failures. On HotpotQA and LoCoMo with two open-weight
    actors, GRSE outperforms MASkills, the closest prior method, on HotpotQA and every LoCoMo category except open-domain,
    with the largest gains on multi-hop questions (+6.7 and +3.2 F1). Its gains rest on better-grounded retrieval
    rather than answers given without evidence, and its learned skills transfer between the multi-hop tasks. GRSE
    is robust to corrupted libraries: starting from planted harmful skills, it credits every planted skill with
    the correct sign and recovers the score of a clean library (+6.3 points), whereas MASkills misattributes two
    and falls below its starting point.'
