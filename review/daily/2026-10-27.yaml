- id: arxiv:2610.35845
  arxiv_id: '2610.35845'
  title: 'Work Agents: Systems, Capabilities, and Optimization'
  version: 1
  source_hash: f390d26298b2d5a38c3dc433d3f61a7101d2d063e23e7fbe18cd4f2af110d49a
  abstract: As foundation models evolve from information generation to digital work execution, agents are increasingly
    capable of completing complex tasks across tools, applications, and workflows. However, existing research lacks
    a unified perspective on how agents reliably accomplish delegated work. To address this gap, we present a work-centric,
    system-level perspective that views work agents as systems combining foundation models and runtime harnesses
    to execute tasks in stateful workspaces and deliver verifiable outcomes. We introduce two complementary dimensions,
    work persistence and work openness, to characterize working conditions, and classify digital work into five
    forms according to task scope and organization. Building on this framework, we identify five core capability
    families required for reliable work execution and examine approaches to model optimization, harness optimization,
    and their joint optimization. We further analyze existing evaluation methods and metrics from the perspective
    of work outcomes. Finally, we discuss future research directions, including sustained work delegation, adaptation
    to open environments, and the interaction between work execution and capability improvement. This paper provides
    a unified framework for understanding, optimizing, and evaluating work agents, supporting the development of
    systems capable of delivering reliable, verifiable, and practically valuable work outcomes.
