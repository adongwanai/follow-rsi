- id: arxiv:2610.16523
  arxiv_id: '2610.16523'
  title: 'EAU: Environment-Agent-User Co-evolution for Training User-Centric Agents'
  version: 1
  source_hash: 5942e57e201afbd5eb1deea2c2c72f0b519b5eca65ba709fbb7d468e02ed29d3
  abstract: Training LLM agents to interact with users over multiple turns is challenging because the learning signal
    depends not only on the agent, but also on the user simulator and environment, which jointly shape the agent's
    experience. Simulated users can be stochastic or inconsistent, while environments may contain unreliable tools,
    incomplete state coverage, and incorrect verifiers. Prior work mainly addresses the resulting instability through
    reward shaping or denser supervision, while treating these components as fixed. We instead introduce EAU, a
    meta-agent framework for environment--agent--user co-evolution. During training, EAU monitors trajectories,
    tool traces, rewards, and training statistics; diagnoses failures and uninformative interactions; and proposes
    targeted modifications to the user simulator, environment, reward design, and RL configuration. Validated changes
    are hot-swapped into the ongoing run, allowing the training setup to evolve together with the policy. These
    adaptations also persist across runs, so later training can build on previously discovered improvements rather
    than restarting from a fixed setup. We enable this process through an editable symbolic representation of user
    and environment dynamics, while the agent remains a neural LLM optimized with RL. Across three interactive-agent
    benchmarks and two backbone models, EAU consistently outperforms prior RL methods, improving the overall score
    over the strongest baseline by 14.7--15.0% and increasing successful task completion on ColBench by up to 36.7%,
    showing that co-evolving the training system with the policy can substantially improve multi-turn RL.
