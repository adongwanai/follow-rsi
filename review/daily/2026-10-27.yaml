- id: arxiv:2610.22732
  arxiv_id: '2610.22732'
  title: 'TokenEconomizer: Experience-Driven Black-Box Cost Control for Coding Agents'
  version: 1
  source_hash: 173eb4bf04679bf235b622f452319b2bd2dd9601a610a34da7ca49b5cc96a6f8
  abstract: Advances in frontier coding agents have sharply increased the token costs of AI-assisted software engineering.
    Their token efficiency is typically evaluated on isolated tasks, whereas real-world developers use them to continuously
    build, update, and maintain large-scale projects. This mismatch motivates us to evaluate agents over sequences
    of realistic coding tasks, where we find that agents exhibit recurring environment-dependent token costs that
    existing methods struggle to reduce. To minimize these costs, we introduce TokenEconomizer, an external controller
    that cuts environment-specific token costs over a sequence of tasks. These cuts come from determining (i) which
    operational micro-skills to inject, (ii) which persistently irrelevant tools to prune, and (iii) when to intervene
    in unproductive failure loops. Across Claude Code, Codex, and GitHub Copilot CLI paired with frontier models,
    TokenEconomizer reduces the average token cost by 18.4-30.9% with comparable task success. Savings hold in every
    repository under every tested agent-model setting and generalize to diverse domains such as sequential web development
    and security auditing, where costs fall by 6.4-21.2% depending on task structure. Our work establishes adaptive
    black-box cost control as a promising direction for reducing token costs of coding agents in realistic settings.
