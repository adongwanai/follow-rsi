- id: arxiv:2610.31062
  arxiv_id: '2610.31062'
  title: 'SCOPE: Compiling Natural-Language Policies into Neurosymbolic Predicate Programs'
  version: 1
  source_hash: 70fa0dd3ba4ff26c9fb756e905d031b9fd4756627b65eb1bad8373003e31a4e5
  abstract: Policy enforcement for LLM agents has shifted from single-turn content moderation to compound, application-specific
    policies evaluated over multi-turn transcripts and tool-call trajectories. Fine-tuned guardrail models are efficient
    but degrade on compound policies, and while LLM-as-a-judge approaches achieve higher accuracy, they incur high
    inference cost and tend to produce unstable predictions. Neurosymbolic methods offer a natural alternative,
    decomposing the policy into narrow neural decisions composed under explicit logic. However, existing symbolic
    layers lack the required expressiveness and are optimized against fixed data rather than the policy itself.
    To address this, we introduce SCOPE, which compiles a policy into an executable program of neural predicates
    executed by small models, deterministic extractors, and code that composes their outputs. The program is optimized
    jointly with its training data, using adversarial generation of counterexamples that target where the program
    deviates from the policy. We evaluate SCOPE on a benchmark of real-world policy tasks against prompt optimization,
    task decomposition, and workflow generation methods, achieving the highest average accuracy across tasks and
    models. Programs optimized with the weakest executor transfer to other models without further optimization.
    This allows them to be deployed in production on inexpensive models, where they reach accuracy comparable to
    frontier reasoning models. Unlike these monolithic models, SCOPE produces substantially more stable predictions,
    and each verdict is interpretable through the predicate outputs that produced it. Additionally, we validate
    the key components of our method through an ablation study. SCOPE thus enables reliable, interpretable, and
    efficient policy enforcement at production scale.
