- id: arxiv:2610.17953
  arxiv_id: '2610.17953'
  title: 'Agent-Reflex: Teaching Language Agents to Act Reflectively'
  version: 1
  source_hash: 0e648934a537995b4c559b519a44011d4d47d05a6d14e1100cf4362ee5cdecde
  abstract: Large language models have evolved from single-turn chatbots into interactive agents capable of long-horizon
    reasoning. In real deployments, MCP tool services can return noisy feedback and users may intervene to correct
    the agent, but existing methods provide limited supervision for reflection learning and failure recovery. To
    bridge this gap, we propose Agent-Reflex, a general training framework for incentivizing proactive reflection
    in agents. Specifically, Agent-Reflex comprises three stages. First, Environment Reflection Skill Discovery
    (RSD) injects grounded tool-feedback perturbations into environment scaling, samples a capability-diverse LLM
    pool, mines matched success-failure pairs, and summarizes reusable reflection meta-skills. Building on this
    skill library, we then apply Reflective Supervised Fine-Tuning (ReSFT) that converts each skill into supervision
    for self-reflection, skill recovery, and user-centric correction, strengthening complementary reflective behaviors.
    Finally, we propose On-Policy Reflective Policy Optimization (ORPO) to combine agentic reinforcement learning
    under noisy interactions with reflection-guided on-policy distillation to further elicit proactive reflection.
    Built on Qwen3-8B, Agent-Reflex reaches 58.6 overall on five long-horizon tool-use benchmarks and 29.1 on AgentNoiseBench,
    surpassing strong environment-scaling and reflection baselines. Experiments on six challenging agent benchmark
    suites demonstrate the effectiveness of Agent-Reflex. Further analyses show that Agent-Reflex improves agents'
    robustness to noise while maintaining stable training dynamics, supporting scalable agent training. Our code
    is available at https://github.com/RUC-NLPIR/Agent-Reflex.
