- id: arxiv:2610.16071
  arxiv_id: '2610.16071'
  title: 'Dream2Discern: Learning from Hard Latent Variants for Runtime Failure Prediction in Multi-Agent Systems'
  version: 1
  source_hash: eb5244b2e33042d5207446f36e40bc10cafe2fcdc9033e9999ace84afabeb0db
  abstract: 'Reliable deployment of LLM-based multi-agent systems calls for runtime auditors that predict terminal
    outcomes from observed execution prefixes. These auditors typically learn from a limited corpus of trajectories
    with verified outcomes. Expanding this corpus requires costly execution and verification, yet broader failure
    coverage alone provides no explicit criterion for identifying prefixes that the current auditor finds difficult
    to classify. To this end, we propose Dream2Discern, a runtime auditor trained through implicit augmentation
    guided by its own prediction loss. During Dream, we select perturbations of the auditor''s representation operators
    to increase prediction loss on recorded prefixes, yielding hard latent variants. During Discern, the auditor
    learns to predict execution outcomes from these variants using the original labels. The variants are regenerated
    as the auditor learns, turning a limited corpus into a renewable source of hard examples and requiring no additional
    trajectory collection or outcome verification. Extensive evaluations on AFTraj-2K and StepShield show that Dream2Discern
    outperforms competitive failure auditors and achieves over 90% trajectory-level weighted accuracy on both benchmarks
    while balancing prediction accuracy and timeliness. Project page: https://zbox1005.github.io/dream2discern-project/'
