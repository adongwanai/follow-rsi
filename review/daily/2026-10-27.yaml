- id: arxiv:2610.20431
  arxiv_id: '2610.20431'
  title: 'SwarmRSI: Recursive Self-Improvement through Evolving Scientific Agent Swarm'
  version: 1
  source_hash: bd60cac261be8d952d7bc2c1e671ac86d49b9177798e9f4411ddbdfe19f96cf5
  abstract: Recursive self-improvement (RSI) in scientific research aims to improve agents' research capabilities
    through their own experimental experience. Scientific agent swarms can combine evidence and implementations
    from different research directions to guide their agents' subsequent experiments. However, poor experimental
    results can leave unclear whether to revise a hypothesis or its implementation, while overall program scores
    can hide components useful to other agents. To address these challenges, we introduce SwarmRSI, a framework
    that evolves scientific agent swarms for recursive self-improvement. We devise Feedback-Guided Swarm Mutation
    to refine hypotheses and their implementations using experimental feedback from other agents. We also propose
    Complementary Swarm Recombination to reuse retained hypotheses and complementary program components across agents,
    allowing partial results to support new research. Recursive Swarm Evolution integrates both mechanisms into
    a feedback loop, using new experimental evidence to guide subsequent research. Experiments on OpenProblems,
    NatureBench and MLE-Bench Lite demonstrate SwarmRSI's state-of-the-art (SOTA) performance. Further evaluations
    show that accumulated research experience improves performance on held-out tasks. Biologists also reproduce
    its programs for follow-up biological analyses.
