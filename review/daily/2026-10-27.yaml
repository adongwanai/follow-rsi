- id: arxiv:2610.29677
  arxiv_id: '2610.29677'
  title: Toward Recursive Self-Improvement in Physical AI
  version: 1
  source_hash: aac97424e9062609f3420763267409c2993e2b280ad762e77899cebe44df5036
  abstract: Recursive self-improvement (RSI) describes a system that improves not only its behavior but also the
    process by which it improves. Recent digital agents test this idea by rewriting their own code and checking
    each version with executable tests. Bringing these mechanisms into the physical world requires learning from
    partial observations through costly trials, while accounting for changing operating conditions and potentially
    irreversible consequences. We position RSI within robot learning and trace pathways from improving robot capabilities
    to improving the processes that generate them. We examine how physical experience can strengthen these improvement
    mechanisms and when the resulting gains can support further self-improvement of the mechanisms themselves. Gains
    carry forward only when feedback addresses remaining learning needs, the receiving component can use the change,
    its value survives changes in tasks or hardware, and continued practice remains safe and affordable. Existing
    studies, concentrated in manipulation, support behavioral improvement, benefits to later learning, and procedure
    improvement. Some systems also change the improver's knowledge or tools, but the physical studies reviewed here
    have yet to isolate gains attributable to recursion. We synthesize these findings into evaluation principles
    and research directions for machines that, trial by trial, safely improve the way they improve.
