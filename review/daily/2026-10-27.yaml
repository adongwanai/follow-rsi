- id: arxiv:2610.18097
  arxiv_id: '2610.18097'
  title: 'APT: Feedback-Driven Agentic Post-Training for Text-to-Image Generation'
  version: 1
  source_hash: 3d8d72ac71817fc138745e6f9cedd0356ad21ffa4b92e1d772deb8d17063c1ff
  abstract: Post-training is crucial for improving text-to-image models, yet existing pipelines typically rely on
    manually curated training data and fixed training distributions. We introduce APT (Agentic Post-Training), a
    fully automated framework that adaptively post-trains a base model according to its evolving capability profile.
    APT coordinates three agents to construct evaluation sets from user requirements, diagnose model-specific strengths
    and failure modes, and generate reinforcement learning data with an adaptive prompt distribution that emphasizes
    underperforming capabilities. By repeatedly evaluating, diagnosing, and updating the generator, APT lets the
    current model's behavior shape its next training tasks, forming a feedback loop inspired by recursive self-improvement.
    For general-purpose settings without user-specified evaluation scenarios, we further develop an evaluation harness
    that enables broad and diverse evaluation set generation. Experiments across multiple base models, benchmarks,
    and generation architectures demonstrate that APT is model-agnostic, benchmark-agnostic, architecture-agnostic,
    and fully automated.
