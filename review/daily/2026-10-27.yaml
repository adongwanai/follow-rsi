  title: 'Δτ-Bench: Pushing Agents Toward a Moving Capability'
  version: 1
  source_hash: 8fd8849dd49489af3d811f2e6b199bce0656b5267cda4c24aeec925fa4911607
  abstract: 'In this paper, we introduce Δτ-Bench, an executable agent benchmark that models the structural evolution
    of large tool ecosystems. In Δτ-Bench, independently evolving services continually reshape how tasks can be
    accomplished: familiar tools may disappear or be replaced, while more efficient alternatives emerge amid overlapping
    functionality and noisy documentation. Against this moving capability frontier, we evaluate whether agents can
    proactively discover efficient tool-use paths and promptly revise their accumulated procedural knowledge, bringing
    together demands that existing benchmarks fail to examine. Δτ-Bench comprises 1,588 validated multi-turn tasks
    across 42 domains and six successive ecosystem states generated through capability-preserving transformations.
    Our evaluation shows that even the strongest evaluated model or harness achieves only 42.3% task success, while
    initial gains from existing skill-learning methods can not consistently translate into better adaptation as
    the ecosystem evolves. These findings motivate Steward, an ecosystem manager that jointly manages tools and
    procedural knowledge through incremental skill maintenance and dynamic provisioning during task execution. Experiments
    show that Steward sustains higher task success across ecosystem changes with lower skill-maintenance overhead,
    while improving both recovery from disrupted workflows and adoption of more efficient alternatives.'
