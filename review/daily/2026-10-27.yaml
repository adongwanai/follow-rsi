- id: arxiv:2610.28388
  arxiv_id: '2610.28388'
  title: 'Self-Credit: Credit Assignment for Long-Horizon Agentic RL via Intra-group Rescaling'
  version: 1
  source_hash: 323fda5d7297618d5b1e5b42656531d93145fcb7e928471b6b4488f0ccb6dd75
  abstract: LLM agents are commonly trained with RLVR, but the sparse nature of typical RLVR rewards makes credit
    assignment challenging, especially for long-horizon tasks. We propose Self-Credit, an end-to-end agentic RL
    method that creates dense supervision signals from sparse outcome rewards using self-generated credit assignment
    via intra-group rescaling. Self-Credit builds on group-based RL with three components. First, during its rollouts,
    the policy model generates summaries with citations to earlier turns containing critical evidence, which serve
    as self-generated credit. Second, we refine this model-generated credit with intra-group rescaling, which compares
    cited actions across successful and failed rollouts for the same prompt. This approach uses group-level agreement
    and disagreement to remove undeserved credit and further emphasize credit assigned to critical actions. Third,
    advantage reweighting uses the rescaled credit weights to update the advantages of the cited turns. On BrowseComp-Plus,
    Self-Credit improves over the base models by 37.0 and 36.2 points on Qwen3 8B and 32B respectively, and outperforms
    the strongest agentic RL baselines by 8.5 and 5.6 points, respectively. Self-Credit also improves over the strongest
    baselines by 4.9 points on GAIA and 4.7 points on xBench-DeepSearch. Analyses show that self-generated credit
    provides useful signals for selecting critical actions, and that intra-group rescaling, especially on failed
    rollouts, is important across model scales.
