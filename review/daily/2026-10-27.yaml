- id: arxiv:2610.22194
  arxiv_id: '2610.22194'
  title: 'AutoSFT: An Agentic System for Automated Data Research in Supervised Fine-Tuning'
  version: 1
  source_hash: fbd0d33196877f8c3569705e71593f02e719153bd72517d5653238eba6fe0808
  abstract: 'Language model agents increasingly automate post-training, but when given the full training stack they
    converge on supervised fine-tuning and spend most effort revising training data. Existing systems give the agent
    one kind of control, selecting rows from a fixed pool or calling a generator, whereas a human data engineer
    adjusts proportions, prunes, repairs, replaces and synthesizes the data. We design a data action space for these
    changes and ask whether an automated system can make the full range rather than one of them, and what structure
    that requires. We first run this loop with a single agent, and it reaches only one action, adjusting category
    proportions, while its context fills with execution output and is discarded mid-search. We therefore introduce
    AutoSFT, a multi-agent system where a meta agent separates execution from analysis, gathers proposals from independent
    angles, and calls a synthesis subagent for capabilities the pool cannot cover, with the model, the trainer,
    and the budget fixed within each comparison. Adding each component in turn helps: the executor halves context
    loss, the analysis subagents lift the best IFEval by +6.5, and synthesis adds +3.4 IFEval and +2.9 IFBench.
    The same loop transfers to code, where analysis adds +3.7 MBPP+ over a single agent that does not improve. Every
    result comes from runs that retrain from the base model each round, so each component''s effect is individually
    attributable. Our findings suggest that automating SFT data research depends more on covering diverse data actions
    than on a stronger single action.'
