  title: 'From VLM Planners to Robotic Agents: Self-Evolving Harnesses for History-Dependent Manipulation'
  version: 1
  source_hash: 48bf12dbbbab550baea039b01ed0dea35623c47feb3a0d29fcdb511b29da6237
  abstract: 'Vision-language-action (VLA) models achieve strong performance across embodied manipulation tasks by
    unifying visual understanding, language conditioning, and action generation. However, long-horizon tasks can
    involve non-Markovian dependencies: successful decisions may require retaining task progress and past interaction
    outcomes, while partial observability and execution errors compound over time. Existing work has begun to address
    these challenges by augmenting foundation-model policies with memory and by introducing hierarchical architectures
    that separate high-level planning from low-level execution. We organize the high-level VLM as a robotic agent
    through an editable harness to maintain task context and improve planning through execution experience. We instantiate
    this approach as SERA (Self-Evolving Robotic Agent), with a fixed VLA executor providing low-level control.
    The harness maintains and updates task context using observations and execution feedback to guide subsequent
    planning. Self-evolution uses environment rollouts to propose and evaluate harness revisions, with the selected
    configuration fixed before held-out testing. On RoboMME, SERA achieves 51.38% overall success with autonomous
    selection, compared with 44.38% without self-evolution. Our exploration suggests that agentic planning is a
    promising direction for history-dependent robotic manipulation.'
