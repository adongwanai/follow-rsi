- id: arxiv:2610.27327
  arxiv_id: '2610.27327'
  title: Unsupervised Tool Evolution for Coding Agents in Data-Lake Analytics
  version: 1
  source_hash: b38eb707b45de5083cc7b0c514e725c34e38978d353a427300db54e33387696f
  abstract: Coding agents can answer analytical questions over a data lake by discovering, cleaning, and joining
    the relevant data. However, they discard this work after each question and redo it from scratch for the next
    one. Tool evolution, which automatically builds and refines reusable tools across tasks, is a natural fit for
    this repetition. Since a ground-truth label for a data-lake question requires an expert to solve it first, we
    consider the unsupervised setting. We propose TEAL (Tool Evolution for Analytics over data Lakes), which evolves
    a library of tools and usage skills for a given Worker agent without labels. Two agents propose tools from complementary
    evidence, an Explorer from the data lake itself and a Critic from Worker trajectories. A proposed change is
    kept only if the Worker adopts the tool on a rerun without extra steps and any changed answer is supported by
    trajectory evidence. We also introduce TEAL-Q, which generates synthetic questions for tool evolution when real
    ones are unavailable. We evaluate on KramaBench and LakeQA with four Worker LLMs under step budgets, which cap
    the number of steps the Worker may take per question. With a tight budget of 10 or 15 steps, TEAL improves every
    Worker on both benchmarks, lifting Sonnet-5 at 15 steps by 9.3 points on KramaBench and 21.7 points on LakeQA.
    A tighter budget also yields better feedback for evolution. For example, Sonnet-5's LakeQA library evolved at
    20 steps and deployed unchanged at 30 steps scores 68.3, above both the baseline (59.6) and a library evolved
    directly at 30 steps (64.2). Additionally, a library evolved on synthetic questions performs comparably to one
    evolved on real questions. These results show that useful tools can be evolved without labels, and hopefully
    inspire future work on what to evolve and how to obtain feedback in unsupervised agent evolution.
