- id: arxiv:2610.33956
  arxiv_id: '2610.33956'
  title: 'Continual Learning Exam: Benchmarking Long-Horizon RSI and Experiential Learning in LLM Agents'
  version: 1
  source_hash: cd5f634dcb36784005de1e6685f9d4b467f0cb0a02fc1c6077db65e0ebdd1eb7
  abstract: Continual learning is the ability of LLM agents to improve over time by acquiring, refining, and applying
    knowledge from experience while retaining useful prior knowledge. It is essential for agents learning over long
    time horizons, yet current evaluations largely assess individual task performance rather than improvement through
    accumulated experience. We introduce Continual Learning Exam (CLE), a large-scale benchmark developed by 50+
    domain experts to measure experience-driven improvement in realistic professional workflows. CLE comprises 120
    human-authored tasks, each organised as a five-level ladder, yielding 600 levels spanning 89 professional roles
    across 12 occupational domains. Agents must pass each level to unlock the next, with later levels building on
    experience accumulated during earlier assignments. An evaluation agent assesses each submission against human-authored
    rubrics. We compare a single-submission setting with one that provides diagnostic feedback after failure and
    allows one revision. Across 17 harness-model configurations using frontier LLMs, feedback and revision yield
    a median completion gain of 5.3 percentage points. Yet the best-performing system clears only 47.7% of levels
    and completes all five levels in just 23.3% of tasks, highlighting the difficulty of sustained learning from
    experience for existing frontier LLMs. As such, the dataset can also be used to post-train LLMs to strengthen
    their continual learning capabilities.
