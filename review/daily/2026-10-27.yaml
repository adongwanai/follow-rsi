- id: arxiv:2610.20399
  arxiv_id: '2610.20399'
  title: 'Cortex: Consolidating Context into Parametric Memory'
  version: 1
  source_hash: d52b5a27b3a19a38b67d1fc6b96d687a6be5549520dc2c2dcea588ab3f864e05
  abstract: Context can improve large language model performance, but these gains may be lost after context removal.
    Inspired by biological systems consolidation, we formulate Memory Consolidation (MC) as internalizing these
    gains while preserving non-target capabilities, connecting context-specified editing, skill learning, and behavioral
    steering under a common objective. We introduce a five-task-family testbed measuring consolidation and retention
    under single, batch, and sequential updates. We propose Cortex, which generates prospective queries to anticipate
    uses of context and distills context-conditioned outputs into mergeable low-rank or structural feed-forward
    network updates. Across 4B--120B dense and mixture-of-experts backbones, including both text-only and multimodal
    models, Cortex lies on the empirical consolidation--retention Pareto frontier in most evaluated settings. After
    50 sequential factual edits on a 14B model, Cortex-Structural recovers 88.9% of the context-induced gain while
    retaining 99.8% of original non-target performance.
