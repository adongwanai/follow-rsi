- id: arxiv:2610.26453
  arxiv_id: '2610.26453'
  title: 'Remembering Has a Price: Learning Memory Worth under Resource Constraints'
  version: 1
  source_hash: ca1c4cf771fee5e9b56c8e11eb7b8a98d7f3a4be9beb5dd0f57565b9887dc856
  abstract: 'Lifelong agents continually accumulate and reuse experience to improve after deployment, yet in practice
    they often operate under tight generation, interaction, and memory budgets. Under such stringent joint constraints,
    we find that existing lifelong-memory methods can become ineffective, with several sophisticated approaches
    offering little advantage over simple retrieval or even no-memory agents. This reveals a more fundamental problem:
    resource scarcity makes each memory decision more consequential. When only a small amount of past experience
    can be retained or reused and opportunities for reasoning and recovery are limited, retrieving a relevant but
    ineffective memory can consume scarce context and hinder downstream execution. The key challenge is therefore
    not simply to retrieve relevant experience, but to determine which experiences are actually worth retaining
    and reusing. To address this challenge, we propose TokenWorth, a lightweight online memory framework that learns
    query-dependent memory worth from sparse execution feedback and applies it consistently to memory retrieval
    and bounded memory management. Across three LifelongAgentBench environments and both local and API-based deployments,
    TokenWorth achieves the highest task success rate while using the fewest output tokens among the evaluated methods.
    These results suggest that effective lifelong adaptation under resource constraints depends not on remembering
    more, but on learning what is worth remembering. Our code is publicly available at https://github.com/AIGNLAI/TokenWorth.'
