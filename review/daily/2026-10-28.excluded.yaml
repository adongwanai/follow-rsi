- id: arxiv:2610.26860
  arxiv_id: '2610.26860'
  title: 'OpenVLHarness: Real World Visual Agentic Tool-Use with Multimodal Memory'
  version: 1
  source_hash: d2b0af00abc1fb027e27e1543a17927d1cd6f63658aa6c9270b4ae55ae44ce53
  abstract: 'Multimodal large language models (MLLMs) have made rapid progress on visual reasoning, yet many tasks
    require evidence that is difficult to obtain through internal reasoning alone: our controlled study on 22 benchmarks
    shows that simply increasing the inference budget of the base model yields only modest gains. Such tasks demand
    grounded perception, external knowledge, and numerical measurements obtained through heterogeneous tools, whose
    outputs must be made interpretable to the model and retained across reasoning steps. We introduce OpenVLHarness,
    a multimodal reasoning harness organized around a capability layer and persistent multimodal memory. The capability
    layer combines task-level tool interfaces with evidence rendering, providing consistent access to heterogeneous
    backends and converting their outputs into model-readable observations. Persistent multimodal memory retains
    the corresponding images, structured data, and web references as addressable artifacts throughout each query.
    A coding interface executes generated programs over stored data, enabling computations that combine results
    from multiple tools. Together, these mechanisms support an iterative process of acquiring, inspecting, and composing
    multimodal evidence. Evaluated on 22 benchmarks with eight open and proprietary backbones, OpenVLHarness improves
    average scores by 9.7-12.6 points over matched no-tool baselines, including +11.2 with Qwen3-VL-8B, +9.7 with
    Kimi K3, and +9.9 with GPT-6 Astra. With GPT-6 Luna at medium reasoning effort, OpenVLHarness outperforms the
    base model, Codex, and Visual Sketchpad at maximum effort by 7.7-8.5 points while incurring at most 37% of their
    model-token cost.'
