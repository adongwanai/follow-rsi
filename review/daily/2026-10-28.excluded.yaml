- id: arxiv:2610.14774
  arxiv_id: '2610.14774'
  title: 'ProgAgent: Learning Tool Orchestration through Programmatic Training'
  version: 1
  source_hash: 07f68620aefeaee03bd1a94f0f0754d94f9068b3f6e5b655fa148b7ebd3b0bd0
  abstract: Large language models (LLMs) are increasingly expected to orchestrate diverse tools over long-horizon
    tasks. Existing agents typically use Direct Tool Calling (DTC), where the model invokes tools sequentially,
    and tool responses accumulate in the model context, which can lead to context rot and orchestration breakdown.
    In contrast, Programmatic Tool Calling (PTC) invokes tools through executable code and stores intermediate results
    in runtime variables rather than appending them to the context. Prior work has explored PTC mainly as an inference-time
