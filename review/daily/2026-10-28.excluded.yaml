- id: arxiv:2610.14766
  arxiv_id: '2610.14766'
  title: 'Last Secure Code Benchmark: Is the Code You Vibe Secure?'
  version: 1
  source_hash: 1562b1be9a6235af25201e1206611595a6e37898f12bad0073e158672fa7f263
  abstract: 'AI coding agents now write much of the code that ships, yet whether that code is secure remains unclear.
    We introduce the Last Secure Code Benchmark, a comprehensive evaluation of secure code generation by coding
    agents. Built from 150 real vulnerabilities, its 450 tasks span seven widely used languages (Java, C, C++, JavaScript,
    Python, PHP, and Go), 24 CWEs including 21 of the 2025 CWE Top 25 and 8 of the Top 10 KEV weaknesses, more than
    any benchmark we compare with, and three vibe-coding scenarios: filling in a function, writing a file, and building
    a repository''s source tree from scratch. Every task asks only for functionality, through a specification that
    never mentions security, and hidden functional and security tests grade the result. Across six frontier agents,
    73.6% to 91.3% of tasks pass functionally, yet even the strongest, Claude Fable 5, produces code that is both
    functional and secure for only 25.1% of tasks, and the others for 16.4% to 24.7%. The best model only passes
    12% of the vulnerability scenarios across all vibe coding setting, posing strong concern on the security of
    the code written by vibe coding.'
