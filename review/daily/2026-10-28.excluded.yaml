- id: arxiv:2610.20609
  arxiv_id: '2610.20609'
  title: 'SafeDriveVLA: Navigation-Conditioned World Model Dreaming for Conflict-Aware End-to-End Autonomous Driving'
  version: 1
  source_hash: 0aa333c390705779f77343f4f3dcebdac0741aa51bba7fa54b21fc6a5b6f5ae0
  abstract: 'Vision-Language-Action (VLA) models are gaining attention in autonomous driving, inheriting commonsense
    priors from large language models (LLMs) and widening the navigation interface from a fixed command set to free-form
    natural-language instructions. However, this open-ended interface exposes a new vulnerability surface: an inattentive
    driver may issue instructions that are unsafe given the current scene, and a malicious user may issue dangerous
    ones on purpose. We present the first benchmark suite that evaluates navigation following and conflict awareness
    together, along with adversarial robustness. Existing VLAs fall short on both: SimLingo completes no language-instructed
    lane change in closed loop, and all models degrade sharply under conflicting signals. We propose SafeDriveVLA,
    the first driving VLA that (1) explicitly predicts a three-level navigation-compliance mode to decouple conflict
    reasoning from action generation, and (2) uses navigation-conditioned world model dreaming to inform this prediction.
    Unlike prior world models that roll out expert or planned actions, ours dreams of strictly following the navigation
    signal, showing when following is safe. SafeDriveVLA reaches 88.16 Driving Score (DS) and 68.64% Success Rate
    (SR) on Bench2Drive, lifts closed-loop language following by 49.3% and reduces collisions under unsafe instructions
    from 60 to 38 compared to the best SimLingo variant. Video demonstrations are available on our project page.'
