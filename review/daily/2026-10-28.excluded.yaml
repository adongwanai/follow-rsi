- id: arxiv:2610.15715
  arxiv_id: '2610.15715'
  title: 'History Replays Itself: Unleashing Long-Context Capability in Linear Attention'
  version: 1
  source_hash: 188c92a99add47c46922d90cea300ef03d42877a8afa609ce3c08ca79eccaf1d
  abstract: 'Linear attention promises the efficiency needed for long-context language modelling, yet its fixed-size
    recurrent state must simultaneously support ongoing computation and preserve information from an ever-growing
    history. This coupling has reinforced a prevailing view that the state''s memory capacity defines the model''s
    long-context capability. We challenge this presumed ceiling: recurrent computation need not bear the full burden
    of long-term storage. We introduce NoteBank, a sparse episodic memory that archives selected text before future
    queries are known, uses the backbone''s native features for writing and addressing, and reads retrieved evidence
    through its native forward computation via replay. This training-free, plug-and-play interface requires no external
    embedding model, separately trained retriever, or separate neural reader. At one million tokens, it raises Gated
    DeltaNet''s mean accuracy across six RULER retrieval tasks from 1.7% to 70.3%, with no observed significant
    retrieval degradation from 4K to 1M tokens. This recovery adds leqslant0.025% to analytical FLOPs, with persistent
    context storage approximately 1/2,600 that of a Transformer''s full MHA KV cache at matched width, depth, and
    precision. Experiments extend from three 1.3B recurrent backbones to Mamba-2-8B and post-trained Qwen3.5-9B,
    demonstrating gains on LongBench v1/v2 and MemoryAgentBench. Together, these results show that sparse evidence
    storage and native replay can substantially expand the long-context capability of pretrained linear attention
    models while retaining the efficiency of recurrent computation.'
