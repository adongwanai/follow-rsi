    GroundGUI-8B achieves 95.2% on ScreenSpot-V2, 63.9% on ScreenSpot-Pro, 65.4% on OSWorld-G, 86.8% on MMBench-GUI
    L2, and 38.3% on UI-Vision. Among 8B-scale models, it produces substantial gains over models trained on open-source
    datasets, with performance comparable or even superior to models trained on closed-source data. Code, models,
