- id: arxiv:2610.18272
  arxiv_id: '2610.18272'
  title: 'JevGPT: Thinking Fast and Slow in Autonomous Research'
  version: 1
  source_hash: 63708c4e0a84f8da83d45cbe8bca225f6d8a6b5ea4d6f34cd96705ef85f525e8
  abstract: Autonomous research agents must acquire and reason over evidence within a limited budget. Yet relevant
    sources can remain uninspected or unused, leaving a gap between retrieval coverage and the evidence that informs
    research. The challenge is to align fast local judgments with changing evidence needs and feed their findings
    back into research decisions. We introduce JevGPT, a dual-system architecture for autonomous research that couples
    fast evidence processing with deliberative research planning. System Two sets evidence objectives and integrates
    findings, while System One locates support, assesses relevance, and guides further inspection. Independent source
    judgments run in parallel; selected original passages inform the next research step. Experiments on fixed-corpus
    question answering and document ranking show that JevGPT achieves leading task performance, with faster completion
    and lower cost than comparably effective research agents. Evidence analysis shows broader source inspection
    and greater coverage of supporting documents in the research loop, highlighting efficient evidence processing
    as a route to more capable autonomous research.
