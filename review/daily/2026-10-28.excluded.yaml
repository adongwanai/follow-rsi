  abstract: Long-horizon agents must coordinate reasoning, tool use, and environment feedback over extended interactions.
    Learning from sparse outcome rewards requires weighting trajectories of different lengths and updating the policy
    while rollouts are still being collected. We examine a single-rollout asynchronous recipe combining Muon, token-averaged
    loss, truncated importance sampling, and auxiliary length and tool-error penalties. Single-rollout sampling
    allows asynchronous learning without waiting for multiple trajectories for the same issue. We study optimizer
