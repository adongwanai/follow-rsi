- id: arxiv:2610.18861
  arxiv_id: '2610.18861'
  title: Hybrid Reasoning Agents
  version: 1
  source_hash: 44e4dfd6b4af023f7c370b586e5c586f41db2a8ec25546c760af2e6e969bfdd1
  abstract: 'How can we build an agent that thinks beyond human language, yet still acts through it in the external
    environment? Modern LLM agents still reason and interact through text, while latent reasoning offers an efficient
    internal medium but lacks native tool access and reasoning transparency. We bridge these two directions with
    Hybrid Reasoning Agents (HybridAgents), which dynamically navigate between latent reasoning and text-based interaction
    throughout a unified generation process. Architecturally, a lightweight HybridLink enables seamless transitions
    between text and latent modes, while the agent''s continuous working memory preserves lossless hybrid context
    across multiple turns. These designs preserve tool-integrated agentic capabilities while making latent thoughts
    directly inspectable. Building on this architecture, we further develop dedicated post-training algorithms for
    hybrid reasoning: HybridSFT stabilizes tool-integrated hybrid generation by teaching the backbone to coordinate
    with HybridLink, then HybridRL scales reasoning by learning when to think in latent space and when to act through
    text. We evaluate HybridAgent at 3 model scales across 11 benchmarks covering mathematics, science, medicine,
    search, and agentic reasoning. Compared with frontier LLM Agents and agentic frameworks spanning both text-based
    and latent methods, HybridAgent consistently improves performance by 10.4%, while delivering 35.5%-54.7% token
    reduction, 1.8x-2.6x faster inference, and 2.7x-3.7x cost savings. Code and data are available at https://github.com/togethercomputer/HybridAgent.'
