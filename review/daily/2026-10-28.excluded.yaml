- id: arxiv:2610.30755
  arxiv_id: '2610.30755'
  title: Is Complex Agentic Memory Always Needed? Naive RAG Is Stronger Than We Thought
  version: 1
  source_hash: 432026f737cc9f3f6d40b1fed108b39946ea4b66159af630586e024c225727ec
  abstract: LLM memory is widely used in long-term conversation understanding. Agentic memory systems often use
    mutation, structural organization, learned retrieval strategies, or other complex operations. Is this complexity
    always necessary? We study Raw-RAG, a naive RAG baseline using dense retrieval and reranking over raw history
    to supply evidence to a reader LLM. Across LoCoMo, LongMemEval, MEME, and MemoryAgentBench, Raw-RAG ranks first
    among the compared memory systems in six of seven benchmark-model settings, outperforming the strongest compared
    agentic memory system by 0.13-5.53 points. We investigate why raw-history retrieval remains competitive. Evidence
    analysis shows that its higher coverage of necessary evidence can offset lower utilization. Useful evidence
    includes both answer values and the relations and dependency paths needed to derive them. Even complete access
    to transformed memory stores leaves an accuracy gap relative to raw evidence, highlighting the importance of
    preserving raw information. These findings challenge the necessity of complex agentic memory for the evaluated
    conversation tasks and establish naive RAG as an essential baseline.
