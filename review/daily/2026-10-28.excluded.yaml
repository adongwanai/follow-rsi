- id: arxiv:2610.30320
  arxiv_id: '2610.30320'
  title: Self-Distilling Future Video Representations for World Action Models
  version: 1
  source_hash: 1bebdcd8b8a15027348eb042e60cb6de383240dd53f887a9968ce36a470b5906
  abstract: World Action Models (WAMs) have emerged as a promising approach to learning generalist robot policies
    using rich spatiotemporal priors from pre-trained video diffusion models. A recent line of WAMs improves inference
    efficiency by conditioning a separate action decoder on intermediate future video representations extracted
    from a single denoising step, avoiding costly iterative denoising required for video generation. This design
    makes action prediction depend directly on the quality of these future representations. In this paper, we introduce
    Future REpresentation learning via self-Distillation with temporal context (FRED), a framework that trains WAMs
    to improve the quality of future video representations from noise in a single denoising step. Specifically,
    FRED uses self-distillation to predict future representations from noise, using representations extracted from
    ground-truth future observations as targets. We further condition the video model on historical observations,
    providing temporal context for predicting future representations better. Across diverse real-world manipulation
    scenarios, FRED consistently outperforms competing WAMs. It achieves particularly large gains on long-horizon
    and out-of-domain tasks under zero-shot environment generalization, and substantially improves human-to-robot
    skill transfer, reaching 50.0% task success on tasks absent from robot training data and demonstrated only in
    human videos, compared with 19.4% for the best competing WAM.
