- id: arxiv:2610.29357
  arxiv_id: '2610.29357'
  title: Memory-Centric Continual Learning for AI Agents
  version: 1
  source_hash: 766c06f251078e40e8b9573a6de1b58ab889a21147536103f1235c183d396d66
  abstract: Autonomous agents powered by foundation models can reason, plan, and use tools, but their fixed weights
    and context limits hinder sustained learning from experience over long-term deployment. While external memory
    systems attempt to bridge this gap, they mostly act as passive retrieval caches, evaluated primarily by whether
    they can recall stored facts or past interactions. Whether memory can drive genuine continual learning remains
    an open question. In this paper, we introduce Memory-Centric Continual Learning (MCCL), arguing that memory
    should be judged by whether it improves future actions, not merely what it retrieves. MCCL has three main parts.
    First, a three-axis taxonomy organizes memory by where state is stored (substrates), what form it takes (assets),
    and how it is managed (policies). This defines a two-loop lifecycle that updates memory state in an inner loop
    while refining management policies in an outer loop based on task feedback. Second, an evaluation protocol measures
    retention under interference, adaptation to change, and task transfer to isolate genuine behavioral gains from
    simple context expansion. Third, a memory scaling framework models how agent performance scales with experience,
    storage capacity, and compute budgets across non-parametric and parametric memory. Together, these components
    reframe agent memory from passive lookup to continuous learning, offering a principled route toward self-improving
    autonomous agents.
