  title: 'RLSplat: Resource-Linear Budget Control for Feed-forward 3D Gaussian Splatting'
  version: 1
  source_hash: 93943382b8abcf13a1b42efd51b50e84c4b511289a828f579076d9fe4639d195
  abstract: 'Feed-forward 3D Gaussian Splatting (FF3DGS) reconstructs 3D scenes from images in a single forward
    pass, making it well-suited to applications that must operate within limited resource budgets. To further improve
    its practicality, recent budget-controllable FF3DGS methods allow the number of Gaussians to be adjusted at
    inference, so that the output meets a given storage limit or rendering-latency constraint. However, these methods
    overlook the cost of inference itself: to produce a representation with the target number of Gaussians, they
    first predict a dense set of Gaussians and then prune or select from it, requiring nearly constant latency and
    peak memory regardless of the budget. We therefore propose RLSplat, a resource-linear budget-controllable FF3DGS
    framework whose representation size, inference latency, and peak memory all decrease linearly as the Gaussian
    budget is reduced. Instead of pruning or selection, RLSplat learns a Gaussian allocation policy that distributes
    the budget across local scene regions, so that exactly the requested number of Gaussians is generated. These
    Gaussians are then refined through resource-linear Gaussian decoding, in which each Gaussian attends only to
    nearby Gaussians found via an efficient hierarchical neighbor search, so that the decoding cost decreases linearly
    with fewer Gaussians. In zero-shot evaluation, RLSplat outperforms prior budget-controllable methods at every
    budget, surpassing the strongest baseline even with 4times fewer Gaussians, while running up to 4.1times faster
    with 9.6times less peak memory at low budgets.'
