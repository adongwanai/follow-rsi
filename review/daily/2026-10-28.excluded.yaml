- id: arxiv:2610.30113
  arxiv_id: '2610.30113'
  title: 'Quant-Arena: Benchmarking LLM Agents for Quantitative Trading Research'
  version: 1
  source_hash: 5caf5baf94a2781f9205732318f4465c856c12dfb13da43766cc801460e53680
  abstract: 'Quantitative research is an iterative loop: a researcher proposes a market hypothesis, implements it
    as an executable signal, tests it on historical data, and decides what to keep. Existing benchmarks score formulas,
    code, or individual trading decisions, leaving open whether large language models (LLMs) can complete this loop
    and produce strategies that work beyond the research period. We introduce Quant-Arena, a benchmark and public
    leaderboard for end-to-end quantitative research on real A-share market data. A model constructs features and
    stock-scoring code, receives feedback only on 2022--2023, and freezes one strategy for assessment on the sealed
    year 2024. A cash-account evaluator applies trading constraints and costs, including market impact estimated
    from a simulated order book. Scores are dominated by realized excess return and complemented by signal quality
    and the diversity of features used by the strategy. We evaluate nine frontier models, among which GPT-6 Astra
    scores highest; yet no model beats the equal-weight market in 2024. Quant-Arena is open to submissions from
    any model or agent harness.'
