- id: arxiv:2610.24520
  arxiv_id: '2610.24520'
  title: 'HABIT-Bench: Evaluating Habit Induction from Longitudinal Weak Evidence in Agent Memory'
  version: 1
  source_hash: 7f49f62ba9e5349d63f79cbec06764fd665f75d48608b397e9274765c9765822
  abstract: In long-term interactions with large language model (LLM) agents, users reveal habits through their
    choices and actions. These habits capture implicit user information that agents must infer across conversations.
    However, individual observations may provide only partial evidence about a habit or when it applies. Retaining
    past interactions alone does not ensure that agents can infer habits and apply them appropriately. We introduce
    HABIT-Bench to evaluate how well agent memory systems infer habits from weak evidence and apply them to later
    requests. We construct synthetic user histories from task-oriented dialogue data and controlled habit graphs.
    The histories span hundreds of sessions across food, finance, software, and travel. Four-choice tasks assess
    agents' ability to infer user habits and apply them appropriately. They include temporary exceptions, changes
    in habits, and suggestions that users have not accepted. Sampled tasks undergo independent human review. We
    evaluate eight memory methods with Qwen3-235B-A22B and GLM-5.3-Flash. The best-performing memory method achieves
    33.61\% macro accuracy across the four domains. Performance remains limited even when annotated evidence is
    supplied directly. These results expose a persistent gap between access to past interactions and the ability
    to infer and appropriately use user habits.
