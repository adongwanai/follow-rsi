- id: arxiv:2610.29968
  arxiv_id: '2610.29968'
  title: 'CulturalRiddles: A Multicultural Benchmark of Riddles'
  version: 1
  source_hash: ffae1d0694788d38247fc7d5f0b41229b0738c668f5b3f09b02cbac78edcbdeb
  abstract: As LLMs expand their language coverage, evaluating how well they understand and represent diverse cultures
    becomes increasingly important. However, many benchmarks remain English-centric, with limited cultural coverage
    and a focus on factual knowledge over its application in real-world cultural contexts. We propose CulturalRiddles,
    a benchmark of original, culturally grounded riddles created entirely by humans through a participatory community
    effort, spanning 62 cultures (45 countries, 51 languages). These riddles are deeply rooted in their respective
    cultures and require abductive and compositional reasoning, alongside detailed factual and social knowledge,
    language skills, and an understanding of culturally specific associations. We benchmark 28 LLM configurations
    using both automatic and large-scale human evaluation. Even frontier models achieve at most 22% accuracy in
    some communities. We publicly release all artifacts alongside an open contribution process to expand the benchmark's
    linguistic and cultural coverage.
