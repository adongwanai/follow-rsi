- id: arxiv:2610.26851
  arxiv_id: '2610.26851'
  title: 'Manga2Animate: An Agentic Framework for Faithful Manga Animation with Script and Storyboard Planning'
  version: 1
  source_hash: f8db3490bc108486a3bc616120526cd4b0645cbdf57c916f7fbc32335bc790a1
  abstract: 'Adapting existing manga into coherent animation that stays faithful to the source is a valuable yet
    challenging task. Existing methods either access the manga mainly through text, losing its characters and art
    style, or feed manga pages directly into video generation models, which misinterpret the manga''s structure
    and produce incorrect storylines. In this paper, we propose Manga2Animate, a multi-agent framework that grounds
    every stage of generation in the source manga. We decompose the task into two intermediate representations,
    an animation script and a visual storyboard. Each representation is produced by a creator agent and reviewed
    against the source panels by a paired reviewer agent. We tailor representation-specific selection and dual-level
    feedback to progressively refine both before synthesizing the final animation. Extensive experiments and a user
    study demonstrate that Manga2Animate produces animations more faithful to the source manga and more consistent
