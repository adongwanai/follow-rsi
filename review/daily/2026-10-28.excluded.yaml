- id: arxiv:2610.22512
  arxiv_id: '2610.22512'
  title: Predicting Privileged Information Effectiveness for On-Policy Self-Distillation
  version: 1
  source_hash: fafd99c618b30684ffd1218c3f17747a90c6f3ac6236d965ecb271224b2c109c
  abstract: 'On-policy self-distillation (OPSD) enables large language models (LLMs) to learn from privileged information
    (PI) without a separate teacher model. However, prior work largely treats PI as a fixed design choice, leaving
    the effects of its content and construction poorly understood. This challenge is particularly important in multi-turn
    agentic settings, where trajectories contain actions, observations, and reasoning that can be transformed into
    PI in many ways. We systematically evaluate 16 PI configurations across three multi-turn agentic benchmarks
    and three student models that vary in scale and reasoning mode. We find that PI effectiveness depends on its
    content, generation source, and the student model. Information-dense trajectories and PI produced by more capable
    generators generally yield larger gains, whereas thinking models benefit less consistently. To assess PI before
    training, we compare PI utility with two KL-based metrics: sampled-token reverse KL (D) and error-step KL contrast
    (Δd^{-}_{err}). The KL-based metrics track post-training performance more consistently than PI utility, which
    can be distorted by information leakage. Empirically, selecting each task''s PI by Δd^{-}_{err} also improves
    post-training performance over random selection, most when the PI candidates differ widely. Finally, effective
    PI remains beneficial when combined with GRPO, allowing the combined objective to outperform a strong GRPO baseline.
    Overall, our results provide practical guidance for constructing and evaluating PI in OPSD training.'
