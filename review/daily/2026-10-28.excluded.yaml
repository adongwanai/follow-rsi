- id: arxiv:2610.29722
  arxiv_id: '2610.29722'
  title: Retrieval Augmented Generation Compositionality
  version: 1
  source_hash: 11f4ab114db39677807cc25f8e3adf7a295b6e090497204d80220e9c5ad99fc8
  abstract: 'Retrieval Augmented Generation (RAG) grounds large language models in external knowledge. Modern pipelines
    combine embedding, chunking, retrieval, reranking, query augmentation, context compression, and agentic verification,
    yet these techniques are typically evaluated one at a time. It remains unclear whether their isolated gains
    survive composition, whether retrieval quality and answer faithfulness favor the same design choices, and whether
    conclusions from small corpora hold at large scale. We pre-declare three hypotheses and introduce LASAGNA, an
    open-source framework for controlled RAG evaluation. We test 450 configurations across eight benchmarks and
    corpora ranging from 5K to 200K documents. Three findings emerge. First, individually strong techniques from
    different phases of a RAG pipeline do not necessarily compose: three retrieval techniques predict a +47% combined
    improvement but deliver only +17% when used together. Second, component gains stack differently for retrieval
    and faithfulness, and optimizing one can hurt the other. Third, the best composition changes as the corpus grows:
    the combination that wins on a small corpus may not remain best at large scale. These findings show that gains
    measured in isolation are not reliable predictors of realistic performance, and that new RAG techniques should
    be tested with the full surrounding stack. We call on researchers to do so and supply LASAGNA to simplify these
    experiments.'
