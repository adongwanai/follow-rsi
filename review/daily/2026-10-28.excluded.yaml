- id: arxiv:2610.19696
  arxiv_id: '2610.19696'
  title: 'Share the Symbol, Not the Vector: Training-Free Fact Communication Across Language Models'
  version: 1
  source_hash: 9e25aa9820b45f2683e35ec53499b571fb2a226eb0ddf651d47795217bab6621
  abstract: Multi-agent systems allow language models to solve tasks collaboratively by sharing complementary information.
    These systems typically communicate through text, while recent approaches also explore exchanging internal model
    states. However, sharing these states across architectures often requires learned translators or assumptions
    about model compatibility. We introduce SYNC (Symbol-Indexed Neural Communication), a word-indexed interface
    that connects heterogeneous models without fine-tuning or a learned translator. From descriptions only it can
    see, the sender selects words from a shared list and sends their indices for each object, without seeing the
    questions. The receiver writes the described facts into its hidden states using its own word directions, vectors
    fitted once from its activations. We test selective use by swapping one attribute between two objects and requiring
    correct answers about both changed and unchanged attributes before and after the swap, four answers in total.
    We choose an early write layer on four development receivers and then fix it. With three different senders and
    nine newer receivers from five families, four-answer success on new scenes reaches 72.0-98.3%, up to 96 percentage
    points above middle-layer writing, and the two largest receivers match plain text. A task-free probe predicted
    in advance which depths each new receiver can use (45 of 45 cases). Without retuning, messages listing every
    fact keep 89.6-100% success under new layouts, and sender messages reach 23.9-64.0% on a landmark task with
    multi-token symbols, below text but from 0% without a message. These results show that shared word indices and
    receiver-local directions can support selective fact use across model families without additional training.
