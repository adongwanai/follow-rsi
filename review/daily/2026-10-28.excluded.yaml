- id: arxiv:2610.23234
  arxiv_id: '2610.23234'
  title: 'MultiAgent-OPD: End-to-End Training of Hierarchical Multi-Agent Systems with On-Policy Distillation'
  version: 1
  source_hash: e693626077aed835e3af94049d6a1f89c4a4ba7b5671ff1a24dcd09781c35a6e
  abstract: In a hierarchical multi-agent system, a Leader assigns tasks and subagents carry them out. Jointly training
    the Leader and the subagents is difficult because a final answer gives only indirect feedback to the subagents.
    An LLM judge can score the performance of the subagents, but these scores depend on the judge's own assessment
    of the quality of subagents' responses. We present MultiAgent-OPD, which combines on-policy distillation with
    reinforcement learning to jointly train a shared-parameter Leader-Searcher-Answerer team end to end. We first
    train a Teacher in a Searcher-Answerer workflow using answer correctness. During team training, the frozen Teacher
    scores student-generated search and summary tokens to provide local process supervision for the Searchers, while
    the Leader learns from team success and the Answerer from candidate correctness. Across seven datasets, the
    trained system reaches 38.68% macro avg@4, exceeding Prompted Critic by 4.06 percentage points and C-MAS + RL,
    the trained cascaded multiagent system, by 2.61 percentage points. The team also solves more questions within
    four attempts.
