- id: arxiv:2610.26825
  arxiv_id: '2610.26825'
  title: 'MemT-1.0: Towards Memory-Native Evolution'
  version: 1
  source_hash: 47d24929071d2d7f340346eb7c8ca9efc731aa3c4542a733841a871ec561291f
  abstract: Memory-native evolution requires making memory an intrinsic capability of foundation models, enabling
    them to continuously accumulate and utilize information. To this end, we introduce MemT-1.0, a new architecture
    of memory foundation models that internalize memory as part of model computation. Building on Metis, MemT-1.0
    employs Gated DeltaNet-2 with a stable token-level memory update mechanism within each turn. We further introduce
    Mixture-of-Storage to scale native memory capacity. Following a deliberate backbone preparation, we develop
    a two-stage training pipeline consisting of continued pre-training and post-training, supported by 34B tokens
    of training data and efficient training and inference infrastructure. We release a model family comprising MemT-1.0-Nano
    and MemT-1.0-Flash, and conduct a comprehensive evaluation of memory and general capabilities. The results show
    that they outperform the parametric memory baselines on average and remain competitive with retrieval-augmented
    methods, while largely preserving general capabilities. At a history length of 128K tokens, MemT-1.0-Nano achieves
    approximately 1.86times end-to-end inference speedup and a 66times reduction in persistent storage relative
    to full context KV cache. By internalizing retrieved procedural experience, MemT-1.0 improves task success on
    agentic tasks, providing a practical step toward memory-native evolution.
