- id: arxiv:2610.28578
  arxiv_id: '2610.28578'
  title: 'Sage-A1.5: From Long-Horizon Execution to Scientific Exploration with Capability Composition'
  version: 1
  source_hash: 8af6e17dcf46937eb37dc9167d9ee39a92146f020ffbbcd07433375ada11f0c5
  abstract: 'In this report, we introduce Sage-A1.5, a 35B Mixture-of-Experts agentic model that builds on A1 to
    advance long-horizon problem solving through adaptive capability composition. Compared with A1, Sage-A1.5 learns
    not only to solve individual tasks, but also to organize work and revise its approach during execution. Sage-A1.5
    highlights three improvements: agentic orchestration, verification, and open scientific discovery. First, agentic
    orchestration extends single-agent execution through task delegation and parallel collaboration among subagents
    with isolated contexts, enabling complex tasks to be decomposed and addressed concurrently and supporting efficient
    execution while reducing interference across concurrent subagents. Second, agentic verification strengthens
    long-horizon reliability through progress checking, evidence validation, and reflective strategy revision, allowing
    the agent to recognize unproductive search paths and pursue alternative approaches. Third, open scientific discovery
    extends agentic capabilities beyond answering predefined questions to conducting exploratory research, connecting
    scientific inquiry with interactive analysis and inspectable research artifacts. We showcase these capabilities
    through complicated agentic tasks and multidisciplinary scientific applications. Besides, we hope Sage-A1.5
    provides the community with an accessible foundation for open scientific discovery, offering a practical path
    from long-horizon task execution to collaborative, verifiable, and inspectable scientific exploration.'
