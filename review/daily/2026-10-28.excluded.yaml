- id: arxiv:2610.22200
  arxiv_id: '2610.22200'
  title: 'OpenGCUA: Toward a Fully Open Stack for Generalist Computer Use'
  version: 1
  source_hash: 45aa20b6d1fd59ddd55cd52c5e75255a4dc7510dd71469c7d3fe71c2b4a03fdb
  abstract: 'Computer use has reached a turning point: the focus is expanding from GUI-only interaction to systems
    that complete tasks on users'' computers through visual and programmatic interfaces. We define a generalist
    computer-use agent (GCUA) as a system in which the model chooses how to observe, act, and organize its work
    across visual and programmatic interfaces. Yet frontier implementations, such as GPT-6 Astra''s computer-use
    system, remain largely closed, limiting systematic study of their design. We introduce Open Generalist CUA (OpenGCUA),
    an ongoing project to develop and open the full stack for GCUAs with the community. This report presents the
    first release of OpenGCUA. Code execution is a key feature of our agent design: it lets intermediate results
    determine subsequent operations and enables models to apply their existing programming capabilities directly
    to computer interaction. We also propose harness-to-model decision transfer, moving selected observations and
    task-state decisions from fixed harness rules to the model. On OSWorld-v2, our full configuration improves task
    scores across all eight evaluated models, including GPT-6 Astra and Claude Opus 5, raising mean partial score
    by +19.6 points and reducing reported steps per task by an average of 53.0% relative to batched GUI-only execution.
    We release our implementation and prompts, evaluation trajectories from all eight models, and preliminary versions
    of a real-device harness and a cross-device SDK. The harness addresses real-device challenges not fully captured
    by benchmarks, while the SDK provides a common programming interface across computers, mobiles and browsers.
    Across four real macOS tasks under our real-device harness, selected Qwen3.8-Max runs use 19.4 times as many
    reported reasoning tokens as GPT-6 Astra, highlighting substantial differences between models in real-device
    execution efficiency.'
