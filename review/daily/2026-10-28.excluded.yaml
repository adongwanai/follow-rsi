- id: arxiv:2610.29989
  arxiv_id: '2610.29989'
  title: 'Looking Ahead: Modeling Future Evolution in Autoregressive Video Generation'
  version: 1
  source_hash: 50ab369dac39643a3b4eae7370e898bafe629eed1d082b1988bdfab444d3bb92
  abstract: Autoregressive video diffusion models generate videos chunk by chunk, yet producing plausible continuations
    does not guarantee that they capture how scenes evolve. Under teacher forcing, strong temporal redundancy may
    allow local visual continuity to serve as a shortcut for current-chunk denoising, reducing the pressure to model
    visual evolution. We introduce Future Chunk Prediction (FCP), an auxiliary objective jointly optimized with
    teacher-forced denoising that predicts temporally separated chunks without access to the intervening visual
    context. Drawing supervision directly from training videos, FCP requires no additional pretrained visual encoder
    and leaves autoregressive inference unchanged. Our method achieves superior physical plausibility over standard
    teacher-forced autoregressive training with a lower overall training compute budget, highlighting the effectiveness
    and efficiency of future-chunk supervision for modeling visual evolution. Intriguingly, our visualizations suggest
    that FCP fosters a more structured representation space, which may be valuable for building autoregressive world
    models.
