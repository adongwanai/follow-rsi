# 2026-10-27 期复审结论（人工逐篇对照摘要）
# 判据：Harness RSI = 模型冻结或权重不是主要训练对象；系统根据执行/评估反馈修改
#       Harness 本身（提示、工具代码/工具库、技能文件、上下文/记忆管理的代码或策略、控制流/工作流、
#       环内验证器、改进器）；被接受的修改保留到后续任务或后续轮次。
# 不算 Harness：训练出来的模型策略（RL/SFT）、训练环境/奖励/用户模拟器、外部产物（内核、代码库、假设、
#       研究结果）、只积累记忆条目/经验数据（→ experience_world_model）、固定框架。
# 结果：原 25 篇中 Harness 判对 8 篇（自动判为 harness 的 20 篇里 8 篇正确，precision 0.40）。

date: 2026-10-27
