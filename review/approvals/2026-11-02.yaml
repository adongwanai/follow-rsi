- id: arxiv:2610.31810
  source_hash: de384ef682f1574fa673c781cad002fcb482512bb6a7f3513c6b03e30b603f3e
  scope_recommendation: exclude
  scope_decision: rejected_from_harness_scope
  disposition: scope_advice
  evidence_report: docs/internal/reports/maintenance-2026-11-02/reconciliation.json
  reason_zh: 该工作提出 PaperFormalizer：一个固定的六阶段（转录、自然语言审查、规划、脚手架、补证明、链接）agentic 流水线，把作者论文转成 Lean 可验证版本。执行器（gpt-6.1-sol
    / Claude Opus，通过 Codex CLI 与 Claude Code CLI 调用）只是被配置，未见权重更新，属于冻结执行器；但被改进的对象是‘论文本身’与‘作者 Lean 工具库中的数学定理’——论文的陈述修复、Lean
    代码、报告都是任务产出（符合边界 c：生成的内核/科学结论/外部软件属任务输出）。反馈回路（fixer 提议修复、第二 reviewer 复核、Lean 编译失败回退到 review 阶段）确实存在，且工具库会跨论文增长并在后续规划阶段被复用，具有持久性；但增长的是数学结果库（更接近边界
    b 的经验/知识条目累积与检索复用），而不是可复用的执行程序工件（系统提示、工具实现、控制流、in-loop verifier 的策略代码）；流水线阶段与编排是静态的，符合边界 d 的‘静态编排/静态模板不构成保留式自我改进’。作者反馈只改变当前论文的声称与修补，或由作者决定是否把定理晋升进工具库，未报告对
    agent 自身程序工件的反馈驱动修改，也无证据表明 harness 工件是主要改进对象，故判定为 other_direction。
  pending_evidence_zh: 若后续全文/附录表明‘个人工具库的 curation agent’或 reviewer/fixer 自身的提示、策略或工具实现会依据运行失败反馈被持久修改并跨论文复用，应重评为
    harness_method；需检查第 4 节工具库 curation（Claude Opus 角色）与第 6 节自动模式是否存在对 agent 程序工件的写回，而不仅是数学定理晋升。
- id: arxiv:2610.31372
  source_hash: 5a86bd6aef665da910b6d6e56437df1ec2d0b8babad89ff9eb36a1973343f661
  scope_recommendation: exclude
