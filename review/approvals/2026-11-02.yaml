  evidence_report: docs/internal/reports/maintenance-2026-11-02/reconciliation.json
  reason_zh: 该文提出 RIVT 分类法与 RIDAR 框架：RIDAR-Post-hoc 用 Analyzer+Verifier 事后检测研究诚信违规，RIDAR-runtime 用常驻 Analyzer 加规则
    Supervisor 在运行中检测并向执行中的 agent 投递反馈，必要时用 completion barrier 把违规退回 agent 修正。被改动的是当前这一次轨迹中的行为/交付物，属任务内纠正与护栏，而非把某个外部可复用程序工件（系统提示、工具库、技能文件、控制流、可复用策略文件）作为主要改进对象并保留给后续任务；文中执行体是
    Claude Code/Codex/OpenCode 前沿 harness 与固定模型，全文无任何权重训练，也没有把修正沉淀为跨任务可复用工件或策略的机制与证据。其评价对象是 RIV 检测准确率与运行中违规数量下降，不是
    Harness 工件的反馈驱动演化，因此归为 other_direction。
  pending_evidence_zh: 若需完全排除，应核查附录 H 提示与实现细节中是否存在把 RIDAR 反馈写回系统提示/技能文件/控制流并在后续会话复用的情况；正文现有表述只支持运行内修正，未见此类持久化更新。
