  reason_zh: 该工作的循环是：proposer 生成/变异任务，solver 在环境中执行，feedback generator 汇总执行轨迹，proposer 依据 solver 的实际表现（难度但可解）获得奖励，从而迭代演化出更难、更多样的任务。被反馈驱动修改并保留下来的是基准任务/测试套件（即训练或评测环境与任务分布），而不是被评测
    agent 自身的可复用执行程序工件（系统提示、工具实现、技能文件、工作流、in-loop verifier 或 improver）。按边界 (c)，训练环境、用户模拟器与奖励属于任务输出或其他方向；按边界与说明，通用工具/agent
    基准及其演化属于 other_direction，除非论文专门评估 Harness 工件本身的演化——摘要未显示这一点。因此 scope 记为 other_direction，不予纳入。
  pending_evidence_zh: 若后续获得全文，需核查：(1) solver 或 proposer 的权重是否被训练更新，或是否仅为固定模型加提示/奖励；(2) 是否存在对 solver 自身可复用执行程序工件（系统提示、工具库、技能文件、上下文管理代码、工作流、in-loop
    verifier）的反馈驱动修改与跨轮保留，若有则需按 OWNER 共演化例外重新评估；(3) 论文是否把“Harness 工件演化”本身作为研究/评估对象，而非仅演化基准任务。
