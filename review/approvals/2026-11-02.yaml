  reason_zh: Memorilla 的核心改进对象是一个可训练的记忆模块（8B 解码器配置下 194,123,776 个可训练参数），它用交叉注意力从持久化的文档嵌入中读出 K=16 个查询条件化的软记忆 token，并投影进冻结
    LLM 的输入嵌入空间；冻结的执行器（Qwen3-8B 解码器与 Qwen3-Embedding-4B 编码器）本身不被改动。该对象是可学习参数模块，而不是可编辑的外部程序工件（系统提示词、工具实现/库、技能文件、显式可复用策略文件、控制流/工作流、in-loop
    验证器或改进器）。其修改方式是梯度式的：监督阶段最小化答案 token 的负对数似然并做三阶段课程训练，TextWorld 阶段仅对记忆模块用 GRPO 依环境奖励更新权重。这正落在边界 (a) 所述“优化 SFT/RL
    权重，即便该策略管理工具或记忆，也不算 Harness”之内；其余机制（把文档编码一次并持久存储、按查询做检索/读出）属于记忆条目的存储与检索，对应边界 (b)。此外没有证据显示存在迭代式的“执行反馈→修改外部工件→跨任务复用”的自我改进循环：持久化的是嵌入存储与一次性训练得到的
    checkpoint（权重），而非被反馈反复编辑的程序工件。因此判为 other_direction 而非 harness_method。
  pending_evidence_zh: 若后续版本将该记忆读出/管理策略实现为显式、可编辑、可检视的外部策略文件或代码，并由执行反馈在多个任务/会话/优化轮次中反复修改并保留复用，则需重新评估其是否构成 harness_method；同样，若出现将“记忆管理程序工件”的更新与“记忆策略权重”的训练明确分离的消融，应重新审查。
