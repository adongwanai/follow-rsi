  abstract: 'Large language models (LLMs) are increasingly deployed to solve complex scientific and practical problems
    via iterative optimization. However, dynamically coordinating diverse search mechanisms as candidate quality,
    failure modes, and resource budgets evolve remains a critical open challenge. Targeted empirical diagnostics
    reveal that mechanism effectiveness is highly state-dependent. Motivated by this, we analyze how individual
    decisions drive final outcomes, decomposing the expected terminal improvement under a shared budget into cumulative
    decision opportunities minus cumulative selection losses. Guided by this opportunity-loss theoretical foundation,
    we propose OptiCom, a unified framework that represents LLM-driven optimizers within a shared configuration
    space: C=(A,Q,O,E,M,S), corresponding to artifact, query, operator, evaluation, memory, and strategy. Operating
    within this space, a fast LLM-based Optimization Controller dynamically composes immediate mechanisms through
    structured Action Packages, while a slower Strategy Adapter refines long-term selection preferences, operator
    weights, and templates based on accumulated trajectory feedback. Comprehensive evaluations across 32 benchmark
    groups demonstrate the superiority of framework: OptiCom achieves an average Max-score rank of 1.72 among 14
    evaluated configurations, securing the top score in 23 groups. Ultimately, these results highlight the broad
    applicability and high extensibility of OptiCom as a general-purpose paradigm for robust LLM test-time scaling.'
