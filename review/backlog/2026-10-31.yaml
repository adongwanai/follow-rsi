  arxiv_id: '2609.37151'
  version: 1
  source_hash: 364c280f07c6165e4076becb8a9b4938520d46f0b098502af52550591acc430b
  published: '2026-09-29'
  updated: '2026-09-29'
  hf_daily_dates: []
  abstract: 'Automated multi-agent systems offer clear advantages over manually designed ones in scalability and
    adaptability, but existing workflow topology methods still face important limitations. Search-based methods
    are often computationally expensive, textual-gradient-based methods rely on coarse-grained feedback, and existing
    generation-based methods are not well suited to discrete workflow topologies with complex dependencies. To address
    these limitations, we propose FlowMAS, a multi-agent workflow topology method based on Generative Flow Networks
    (GFlowNets). FlowMAS models workflow generation as reward-guided flow over the topology space and introduces
    three components: a GFlowNet-based topology generation backbone, a curiosity-driven module for structure-aware
    exploration, and an information-guided optimization module for evaluating intermediate topologies. Concretely,
    the curiosity-driven module encourages exploration of structurally novel workflows, while the information-guided
    module measures both the information contribution and the communication efficiency of different operators to
    favor more informative and effective collaboration patterns. Experiments on six benchmark datasets with three
    LLM backbones show that FlowMAS consistently outperforms multiple baselines.'
