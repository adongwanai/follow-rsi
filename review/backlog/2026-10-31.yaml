  abstract: Automating the search for effective harnesses is an important step toward enabling agents to recursively
    self-improve. Existing harness optimizations typically produce a single global harness that is applied uniformly
    across task instances. However, a harness that works well on average may not be optimal for every instance.
    We introduce Turbo Harness, a framework that can adapt a globally optimized harness to each instance by reusing
    information generated during the original optimization process. Specifically, Turbo Harness recycles artifacts
    produced during a completed global harness optimization run, and summarizes them into a structured playbook.
    We train a harness editor to leverage this prior optimization experience to generate instance-specific patches
    to the global harness. At inference time, the editor uses the instance and the playbook to construct a tailored
    harness in which the execution model operates. Through numerical experiments, we show that Turbo Harness consistently
    outperforms existing harness optimization baselines across seven benchmarks spanning interactive agent tasks,
    software engineering, and long-horizon terminal tasks.
