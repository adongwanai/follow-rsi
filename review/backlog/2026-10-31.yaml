  abstract: Text-guided image editors can generate high-fidelity medical deepfakes, challenging the reliability
    of clinical imagery. Although reasoning-based detectors perform strongly in distribution, they degrade substantially
    under deployment shift. MedForge-Reasoner, an 8B vision-language model trained with supervised fine-tuning and
    reinforcement learning, achieves 99.2% accuracy on its target distribution, yet misclassifies 40% of authentic
    scans, reaches only 77% accuracy on unseen generators, and falls to 59% under transmission distortion. Adapting
    such models through conventional retraining is costly, requiring large-scale supervision and expert-designed
    guidelines. We introduce MedForge-RSI, a recursive self-improvement framework that enables a deployed detector
    to adapt while keeping its model weights frozen. Over 20 rounds, the detector analyzes verified errors, accumulates
    reusable experience, and autonomously develops image-analysis tools, while an independent acceptance test retains
    only validated improvements. Across 49 registered configurations, MedForge-RSI increases average accuracy over
    four test sets from 75.0% to 84.4%. On a held-out 4,000-image evaluation, it improves clean accuracy from 76.5%
    to 87.9% and transmission-distorted accuracy from 59.0% to 70.5%, with the largest gains in authentic-image
    recall. Controlled analysis across all 49 trajectories identifies which self-improvement mechanisms replicate
    across seeds, shows acceptance testing to be the largest individual contributor, and reveals a taxonomy of failed
    adaptations. We release the complete trajectories, including all rejected and rolled-back changes.
