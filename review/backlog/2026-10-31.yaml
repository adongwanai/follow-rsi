- id: arxiv:2610.00437
  title: 'JevSpawn: Adaptive Agentic Inference through Compositional Action Spaces'
  announced: '2026-09-30'
  window_status: stale
  in_repo: false
  gate: {}
  llm_primary: harness / component
  decision: defer
  arxiv_id: '2610.00437'
  version: 1
  source_hash: 8d655b43a48a713f3bf4e52976fe0a65e3ab8dcf813fdc2033184e2f049bed4b
  published: '2026-09-30'
  updated: '2026-09-30'
  hf_daily_dates: []
  abstract: LLM agents generate intermediate reasoning and actions token by token, making extended interactions
    slow and computationally expensive. Jev-style models offer fast probabilistic predictions over finite fields,
    but require those fields to be specified in advance. This requirement limits autonomous task solving, where
    the available actions must be derived from natural language instructions and adapted through interaction. We
    introduce JevSpawn, a compositional policy that connects natural language task specifications to finite probabilistic
    exploration. Parallel action spawning is coupled with feedback driven branch selection, representation revision,
    and recovery from retained alternatives. Shared action structure and model prefixes reduce repeated generation
