  abstract: Recent achievements in AI-assisted mathematics require intensive interaction of agents with proof assistants
    to generate machine-checked proof certificates. Agents interact with proof assistants such as Rocq or Lean through
    an interface that controls what the agent receives from the prover and the cost of these interactions. Today,
    these interfaces are adapted from tools designed for humans and not optimized for agents. We propose an evolutionary
    method where a frontier model incrementally proposes new features and only keeps the ones that improve the overall
    performance of smaller models. We demonstrate the effectiveness of our method by growing, on a curated set of
    mathematical problems, ROCQ-MCP-EVOLVE, a new MCP server for the Rocq prover. On the held-out test split of
    miniF2F-Rocq, an agent equipped with ROCQ-MCP-EVOLVE outperforms both the baseline that only exposes the Rocq
    compiler and an established MCP server, across four models from two families, in success rate, cost per solve,
    and time per solve. Although evolved for Rocq, the resulting server transfers to Lean, improving cost and time
    per solve on a subset of PutnamBench. We release ROCQ-MCP-EVOLVE and its port to Lean.
