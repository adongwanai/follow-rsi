  hf_daily_dates: []
  abstract: We present ASENA, an embodied agent system that enables general-purpose coding agents to program humanoid
    navigation, manipulation, and interaction. Through a unified robot harness, agents read sensor data, write and
    execute programs, inspect recorded outcomes, repair failures, and reuse notes and executable skills while keeping
    their model weights fixed. We also introduce ASENA-VLN, a 4B monocular navigation policy that serves as an optional
    tool within this programmable system. ASENA-VLN predicts body-frame trajectories for both extended routes and
    short-horizon behaviors. Its shared vision-language decoder is trained on route instructions, visual question
    answering, and a newly curated dataset of geometry-derived atomic navigation tasks. As a standalone policy,
    ASENA-VLN achieves state-of-the-art success rates of 68.7% on R2R and 70.2% on RxR. When integrated with a coding
    agent, learned navigation improves ASENA's success rate by 11 percentage points on both agentic benchmarks and
    reduces execution time. Persistent workspace evolution uses simulator feedback to improve success over ten passes
    through recurring 100-task subsets. Success increases from 72% to 98% on R2R and from 65% to 89% on RxR. On
    embodied question answering, ASENA achieves state-of-the-art accuracy with fewer interaction steps. On a Unitree
    G1, we demonstrate search, visual inspection, spatial reasoning, synthesized gestures, and mobile manipulation
    combining object pickup, carrying, and handoff without a pre-built map. These demonstrations illustrate how
    online programming extends robot behavior beyond route following and predefined skills.
