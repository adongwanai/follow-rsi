  abstract: 'In harness self-evolution, agents modify their own prompts, code, tools, and orchestration while keeping
    the underlying language model fixed. Recent work has shown that agents can improve themselves in response to
    task failures and achieve substantial performance gains. However, gains on failed tasks do not automatically
    ensure that performance on previously successful tasks is preserved, raising concerns about reliable adoption.
    In this work, we provide a theoretically grounded condition under which a self-evolved harness can be reliably
    adopted. We then propose a validation rule to make the evolved system satisfy the reliable adoption condition
    with theoretical guarantees. Consequently, the system can achieve progressive improvement through evolution.
    This leads to a natural question: Does reliable self-evolution have a performance ceiling, and which factors
    govern this ceiling? Our theoretical results show that the performance ceiling is determined by the costs of
    verification and evaluation. On the other hand, self-evolution may stall in practice. In this regard, we show
    that experimental evidence on agent performance shifts can be used to identify the sources of stagnation. Our
    work thus establishes a theoretical framework for understanding and advancing reliable harness self-evolution.'
