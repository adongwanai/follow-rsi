  abstract: Improving embodied agents often focuses on optimizing the underlying model through training, while the
    surrounding agent harness that controls planning, context, and tool use is typically engineered. We ask whether
    this harness can instead improve itself directly from experience traces under sparse environmental feedback.
    We propose EMbodied Agent Harness Optimization (EMHO), a self-evolving framework that keeps the embodied model
    frozen and iteratively revises its harness by analyzing execution trajectories and prior harness history. EMHO
    optimizes beyond skills or recovery prompts, modifying how the agent monitors progress, uses vision tools, grounds
    observations, and responds to failures. To support multiple subtasks with a single harness, we introduce EMHO-Merge,
    which addresses trade-offs in jointly optimizing a single shared harness across subtasks by using episode-level
    gains and losses to guide evidence-supported refinement of when and how revised behaviors are applied. We evaluate
    EMHO on EmbodiedBench across navigation and manipulation tasks, and EMHO consistently improves task success
    for both Qwen 9B and 27B models. Qualitative analysis shows that EMHO goes beyond recovering from failures and
    unproductive actions to reshape how the embodied agent interprets and interacts with its environment.
