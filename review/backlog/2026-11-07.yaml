  abstract: Harness evolution is an iterative search procedure that repeatedly evaluates and revises candidate harnesses
    used for LLM agents using task feedback. We revisit the evaluation of such automatic harness evolution procedures
    and identify two fundamental issues in the protocol. First, prior work does not compare these approaches with
    simple task-level search baselines under matched feedback and inference budgets. Second, prior work searches
    for harness configurations using verification signals (e.g., unit test cases) drawn from the same benchmarks
    on which it reports the final performance of the evolved harnesses, violating the standard separation between
    training and test data. To address this, we compare automatic harness evolution with simple test-time scaling
    and discovery baselines under comparable feedback and inference budgets, and evaluate evolved harnesses on held-out
    tasks to assess generalization. Following prior work, we experiment on Terminal-Bench 2.1 and find that automatic
    harness evolution fails to outperform simple test-time scaling methods both with and without test cases, and
    exhibits limited generalization. However, we find that long-horizon games are a promising setting for automatic
    harness evolution, as they are difficult enough to leave headroom, rely heavily on adaptation to out-of-distribution
    dynamics, and provide granular feedback by design. In these settings, task-specific harness evolution improves
    over the search baseline by 80% on ARC-AGI-3 and by 11% on EdgeBench games under matched budgets. Together,
    these findings highlight the need for matched-budget baselines and held-out evaluation to distinguish genuine
    harness improvements from benchmark-specific search and overfitting, and point to a more careful characterization
    of when automatic harness evolution is actually useful. Our code is available at https://github.com/rethinking-harness-evolution.
