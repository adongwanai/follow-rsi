  abstract: 'Large language models are increasingly embedded in software engineering workflows as coding agents
    that can inspect repositories, invoke tools, execute tests, debug failures, and generate patches. Yet most existing
    coding agents remain largely static after deployment, even though software development is a dynamic, feedback-rich
    process in which repositories evolve, dependencies change, tests fail, and repair attempts leave reusable experience.
    This tension has motivated a growing body of work on self-evolving coding agents, where the agent improves its
    future behavior by persistently updating its framework, memory, skills and tools, components, workflow and topology,
    or environment and context from prior coding interactions. In this survey, we provide a structured synthesis
    of this emerging area. We first define the concept of self-evolving coding agents and distinguish it from conventional
    coding agents and general self-evolving agents. We then develop a taxonomy centered on the targets of evolution,
    complemented by two orthogonal perspectives: when evolution occurs and which code-specific signals drive it.
    We further examine the benchmarks used to measure the effect of evolution and related coding products. Across
    the literature, we find that executable feedback, repository-level context, and coding trajectories make software
    engineering a natural domain for agent self-evolution, but also introduce challenges in feedback reliability,
    benchmark overfitting, reversibility, system complexity, safety, cost, and generalization. By organizing existing
    work around these dimensions, this survey aims to clarify the conceptual boundaries of self-evolving coding
    agents and provide a foundation for designing more adaptive, reliable, and software-aware agentic systems.'
