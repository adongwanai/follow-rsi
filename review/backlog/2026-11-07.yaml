  abstract: Reliable agent evaluation is complicated by automatic harness optimization, which repeatedly uses a
    released benchmark $B_{\mathrm{rel}}$ to guide a Proposer that edits prompts, memory, retrieval, tools, and
    control code around a fixed foundation model. Task holdout is commonly used to guard against harness overfitting.
    It varies semantic tasks but leaves the benchmark protocol fixed, so a bad genius Proposer can produce a cheating
    harness whose improvement over the initial harness on $B_{\mathrm{rel}}$ depends on a benchmark-wide shortcut.
    We introduce Counterfactual Harness Search and Evolution (CHASE), which casts harness evolution as constraint
    generation over valid counterfactual benchmarks. After each Proposer update, a Challenger searches for an executable
    protocol transformation with large gain destruction. A validity firewall checks that task semantics are preserved,
    while a held-out confirmation set determines whether the counterfactual enters a finite archive. We formalize
    an ideal shortcut-neutralized benchmark $B_0$ and establish theoretical guarantees linking finite counterfactual
    archives to $B_0$ and characterizing sequential Challenger search. We evaluate CHASE on Syn-Ledger and OfficeQA,
    where CHASE retains strong released-benchmark gains while substantially reducing gain destruction under valid
    protocol transformations.
