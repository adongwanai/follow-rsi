  abstract: 'The performance of LLM-based agents is jointly shaped by their base models and the harnesses that mediate
    their interaction with the environment. Because different models exhibit distinct behaviors, effective harness
    design is inherently model-specific. Yet agent harnesses are still largely engineered by human experts, a paradigm
    that scales poorly as modern LLMs become increasingly diverse and rapidly evolving. In this paper, we introduce
    Self-Harness, a new paradigm in which an LLM-based agent improves its own operating harness, without relying
    on human engineers or stronger external agents. We operationalize Self-Harness as an iterative loop with three
    stages: Weakness Mining, which identifies model-specific failure patterns from execution traces; Harness Proposal,
    which generates diverse yet minimal harness modifications tied to these failures; and Proposal Validation, which
    accepts candidate edits only after regression testing. We instantiate Self-Harness across Terminal-Bench-2.0,
    SWE-bench Verified, and AppWorld using a minimal initial harness and three base models from diverse families:
    MiniMax M2.5, Qwen3.5-35B-A3B, and GLM-5. Across all nine model--benchmark combinations, every final harness
    improves both held-in and held-out pass rates, with overall relative gains of up to 132%. Qualitative analyses
    further show that the retained mechanisms address benchmark-specific bottlenecks in artifact handling and runtime
    control, software-patch verification, and application-state retrieval. These results suggest a path toward LLM-based
    agents that are not merely shaped by their harnesses, but can also participate in reshaping them.'
