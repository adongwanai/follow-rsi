  abstract: Post-training agents for automated AI research requires optimizing not only model parameters, but also
    the runtime harness that shapes how research trajectories are generated, evaluated, and learned from. Existing
    pipelines typically train models under a fixed harness, including prompts, tools, skills, middleware, and memory,
    while leaving the data-generating process outside the optimization objective. This creates a mismatch between
    model updates and the static scaffolding that determines trajectory quality. We introduce Co-Harness, a framework
    that jointly optimizes the agent harness and model parameters during post-training. Co-Harness alternates between
    harness optimization and model optimization. An LLM-based HarnessCritic analyzes failed trajectories, identifies
    harness-level failure modes, and proposes validated local updates. The model is then fine-tuned on high-quality
    trajectories generated by the improved harness, distilling effective scaffolding into model parameters. A 200+
    hour autonomous case study further shows that Co-Harness can recover from system crashes, improve inference
    efficiency, and discover ensemble strategies without human intervention. These results suggest that joint harness
    and model optimization is an effective way to improve agents beyond fixed-harness post-training.
