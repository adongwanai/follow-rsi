  abstract: Multi-agent systems (MAS) powered by large language models have shown strong performance across code
    generation, mathematical reasoning, and question answering. However, existing methods for automating MAS design
    mostly operate at the task level, producing a single fixed workflow per benchmark that is applied uniformly
    to all queries. This assumption fails under realistic conditions. Query difficulty varies widely within a task,
    and real-world workloads mix heterogeneous task types. We introduce OOPMAS, a training-free framework that generates
    both the agent set and the coordination workflow at the granularity of individual queries. Agents are represented
    as object-oriented class definitions with dedicated roles, tools, and persistent state, and workflows are expressed
    as executable main functions over these agent objects. A dynamic skill library accumulates structured lessons
    from execution feedback across optimization rounds, enabling in-context improvement without any gradient updates
    or fine-tuning. On a mixed-task benchmark of queries spanning code, math, and QA, OOPMAS achieves 89.6% accuracy,
    outperforming the strongest baseline by 18.1 percentage points. A model-swap study across four LLM backbones
    shows consistent scaling, reaching 92.4% with the strongest model.
