  hf_daily_dates: []
  abstract: 'Self-improving LLM agents can adapt a credit pipeline to a changed rule, but an agent that rewrites
    itself destroys the artefact a supervisor reviews: a named change, a recorded test, an approval. We argue that
    self-evolution is reviewable only if it is confined to the runtime harness (instruction text, tool-call logic
    and primitive composition) while model weights stay fixed, so that every adaptation is a diff with a cause and
    a test attached. We give a dual-loop engine built on that bound, with one admission gate that writes a hash-chained
    record before deployment, and we measure the gate in simulation, with a simulated agent and a seeded-search
    proposer rather than language models. Across three families of supervisory re-interpretation at three severities,
    10 seeds each, the gated loop admitted 144 of 7,449 candidate changes, none of which worsened error on held-out
    history, and restored the false-positive rate to the oracle level without raising missed flags in every low-
    and mid-severity cell. With the gate replaced by the check an unbounded system applies (fewer errors visible
    in recent traces), the same loops admitted 309 harmful changes and left missed flags above 10% in 49 of 90 runs:
    false positives fell because the screen was loosened. Evaluated on pre-shift labels, the gate rejected every
    candidate, so a re-interpretation must be encoded as a rule that relabels history. Parametric and scope shifts
    were repaired locally, a structural one only by primitive replacement; at the highest structural severity the
    gate''s fixed tolerance blocked the correct replacement in half the seeds. We map the mechanisms to the EU AI
    Act''s provisions for high-risk credit scoring and note that the April 2026 US model-risk guidance excludes
    agentic AI from its scope.'
