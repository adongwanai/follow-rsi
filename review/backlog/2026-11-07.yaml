  abstract: Video temporal grounding aims to localize events in videos from natural-language queries. For agents
    built around frozen video-language models, the harness determines how queries guide temporal predictions and
    how those predictions are refined. Manually refining these harnesses requires diagnosing grounding failures
    and coordinating changes to both agent workflows and instructions. We introduce VideoEvolve, a framework that
    automatically evolves agent harnesses for video temporal grounding. VideoEvolve uses a Cloze-Structured Harness
    Representation that preserves stage interfaces while leaving agent workflows and instructions open to evolution.
    Branch-Guided Harness Evolution preserves promising code branches for continued refinement, using execution
    feedback to guide local edits and validation to determine which improvements are carried forward. Experiments
    demonstrate improved grounding performance across multiple benchmarks. Component analyses identify instruction
    refinement as a consistent source of gains, while the benefits of evolved code vary across evaluation settings.
    Together, these results support automated harness evolution as an effective approach to improving video temporal
    grounding. Code is available at https://github.com/bingjunluo/VideoEvolve .
