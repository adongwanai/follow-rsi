  abstract: 'Recursive self-improvement (RSI) remains hard in long-horizon tasks, where growing histories obscure
    the task state and misalign skill invocation. We introduce Recuris, a recursive Experiential-Working Memory
    architecture for long-horizon agent harnesses, in which Working Memory tracks task progress and guides skill
    selection from Experiential Memory, grounding skill use in current needs rather than the full history. This
    coupling also turns execution into structured evidence that localizes failures to specific memory components.
    Across tasks, a fixed Meta-Agent turns that evidence into localized, validation-gated updates to Skill Memory
    that reshape execution and yield new evidence, forming a bounded recursive memory-evolution loop. Across four
    long-horizon benchmarks and ten models, Recuris improves task success in 35 of the 37 completed model-benchmark
    pairs, carrying frontier models to SOTA-level task success: on tau-bench it adds +17.8 points to GPT-5.6 Sol
    and +15.6 to Claude Opus 5, taking Opus 5 to 87.9%, and +16.6/+13.5 points on Qwen3.6-27B/35B on SkillFlow.
    The advantage widens as the interaction horizon grows, to +32.2 points on the longest tasks, and common long-horizon
    failures fall by up to 80%. These results position recursively evolving memory as a scalable foundation for
    RSI, enabling agents to continuously transform accumulated experience into increasingly effective long-horizon
    behavior. Code: https://github.com/Gen-Verse/Recuris'
